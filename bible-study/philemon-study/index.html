portance."],"lessons":[{"refs":"1:1–3","title":["第 1 課｜收信人與家中教會（1–3 節）","Lesson 1 | Recipients and house church (vv. 1–3)"],"aim":["這是給腓利門也給可見證的群體。","The appeal addresses Philemon and a witnessing community."],"flow":[["讀收信人與「在你家中的教會」，列出被公開邀請參與的人。","Read the addressees and “church in your house”; list those publicly drawn into the appeal."],["比較「基督耶穌的囚犯」與腓利門的家主地位。","Compare “prisoner of Christ Jesus” with Philemon’s standing as householder."],["討論一封公開信如何改變私人權力關係。","Discuss how a public letter changes a private power relationship."]],"question":["亞腓亞與亞基布被列入收信人有何意義？","Why might Apphia and Archippus be named among recipients?"],"practice":["不要把阿尼西母從開頭的群體場景中抹去。","Do not erase Onesimus from the communal setting."]},{"refs":"1:4–5","title":["第 2 課｜感謝與愛（4–5 節）","Lesson 2 | Thanks and love (vv. 4–5)"],"aim":["保羅先肯定腓利門過去使人得安慰。","Paul first affirms Philemon’s past care."],"flow":[["讀保羅為腓利門感謝神的理由。","Read why Paul gives thanks for Philemon."],["標出「愛」與「信」各自指向的對象。","Mark the objects of love and faith."],["思考稱讚如何為後面的具體請求鋪路。","Consider how praise prepares the later appeal."]],"question":["保羅為何先肯定腓利門，再談阿尼西母？","Why does Paul affirm Philemon before naming Onesimus?"],"practice":["肯定以往善行不表示可以迴避當下的責任。","Past good deeds do not remove present responsibility."]},{"refs":"1:6–7","title":["第 3 課｜信心伙伴（6–7 節）","Lesson 3 | Partnership in faith (vv. 6–7)"],"aim":["「相通」將信仰連於共享實踐。","Partnership ties belief to shared practice."],"flow":[["細讀「信心的相通」與「眾聖徒的心」兩個語句。","Read partnership in faith and the hearts of the saints closely."],["回顧腓利門如何使其他人得安慰。","Recall how Philemon has refreshed others."],["問阿尼西母是否也能被納入這種相通。","Ask whether Onesimus is included in this partnership."]],"question":["「相通」若及於阿尼西母，腓利門的行動需要怎樣改變？","If partnership includes Onesimus, what must change in Philemon’s actions?"],"practice":["不要把團契當作只對有權者開放的身分。","Do not make fellowship a status reserved for the powerful."]},{"refs":"1:8–9","title":["第 4 課｜請求而非命令（8–9 節）","Lesson 4 | Appeal rather than command (vv. 8–9)"],"aim":["保羅如何運用或放下權柄？","How does Paul wield or withhold authority?"],"flow":[["比較「可以吩咐」與「寧可憑愛心求」的語氣。","Compare “bold enough to command” with an appeal based on love."],["找出保羅訴諸年齡與監禁處境的修辭。","Identify Paul’s references to age and imprisonment."],["討論不用命令是否仍然施加社會壓力。","Discuss whether an appeal still exerts social pressure."]],"question":["保羅在這兩節如何使用自己的權柄？","How does Paul use his authority in these verses?"],"practice":["權力分析應同時問保羅、腓利門和阿尼西母的自主。","Assess the agency of Paul, Philemon, and Onesimus."]},{"refs":"1:10–13","title":["第 5 課｜阿尼西母成為同工（10–13 節）","Lesson 5 | Onesimus becomes a coworker (vv. 10–13)"],"aim":["以「兒子」稱阿尼西母，仍應問他的自主位置。","The “child” language invites attention to Onesimus’s agency."],"flow":[["讀保羅給阿尼西母的稱呼與雙關語。","Read Paul’s kinship language and wordplay about Onesimus."],["列出書信明說與沒有明說的阿尼西母經歷。","Separate explicit claims about Onesimus from unstated history."],["比較保羅想留下他與將他送回的張力。","Compare Paul’s wish to keep him with sending him back."]],"question":["本段如何改變讀者看待阿尼西母的方式？","How does this passage change how readers see Onesimus?"],"practice":["不要把逃跑、偷竊或安全結局當成確定史實。","Do not assert flight, theft, or a safe outcome as fact."]},{"refs":"1:14–16","title":["第 6 課｜甘心與弟兄身分（14–16 節）","Lesson 6 | Willingness and brotherhood (vv. 14–16)"],"aim":["奴僕與弟兄的身分衝突不能被輕描淡寫。","Slave and brother identities cannot be reconciled by a slogan."],"flow":[["找出「甘心」與「不再是奴僕」的連接。","Connect willingness with “no longer as a slave.”"],["分辨「弟兄」的宗教稱呼與羅馬法律上的奴役關係。","Distinguish brotherhood language from Roman legal enslavement."],["討論阿尼西母可能怎樣聽見這段請求。","Discuss how Onesimus might have heard the appeal."]],"question":["「高過奴僕」對腓利門的實際行動有何要求？","What concrete change might “more than a slave” ask of Philemon?"],"practice":["不可用屬靈平等掩蓋法律與身體的不平等。","Spiritual equality must not hide legal and bodily inequality."]},{"refs":"1:17–20","title":["第 7 課｜接納與債務（17–20 節）","Lesson 7 | Welcome and debt (vv. 17–20)"],"aim":["保羅承擔可能欠款，促使腓利門改變關係。","Paul offers to assume a possible debt, pressing relational change."],"flow":[["讀「接納他如同接納我」與「算在我的帳上」。","Read “welcome him as you would me” and “charge it to me.”"],["留意保羅同時提出付款與提醒腓利門欠他的情。","Notice Paul’s offer to pay and reminder of Philemon’s debt to him."],["問這種債務談判能否讓阿尼西母獲得更安全的位置。","Ask whether the debt negotiation might make Onesimus safer."]],"question":["保羅承擔成本，是如何挑戰主人的特權？","How does Paul’s offer to bear cost challenge the master’s privilege?"],"practice":["經文沒有記錄交易結果，也沒有消除奴役問題。","The text records no outcome and does not dissolve slavery."]},{"refs":"1:21–25","title":["第 8 課｜住處與問安（21–25 節）","Lesson 8 | Lodging and greetings (vv. 21–25)"],"aim":["未記載回應，使讀者思考公開信的壓力。","The missing reply leaves readers weighing a public appeal."],"flow":[["讀「你會做得比我所說的更多」與預備住處的請求。","Read “you will do even more” and the request for lodging."],["比較末尾同工問安與開頭的家中教會。","Compare coworkers’ greetings with the opening house church."],["讓學員提出一個文本未回答、但倫理上必須面對的問題。","Ask learners for one ethical question the letter leaves unanswered."]],"question":["書信沒有交代腓利門的回應，這如何影響教學結論？","How does the absent reply shape a teaching conclusion?"],"practice":["保留未竟結局，並把阿尼西母的尊嚴與安全放在中心。","Retain the open ending and center Onesimus’s dignity and safety."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["腓利門書最常被忽略的人物是誰？為何？","Which character in Philemon is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為原創研讀摘要。延伸導讀呈現一種詮釋；請以完整經文為主，並區分歷史推論與經文明說。","Original study summaries. Further guides offer one perspective; prioritize the full text and distinguish historical inference from explicit claims."],"sources":[{"title":["BibleProject｜腓利門書導讀","BibleProject | Philemon guide"],"url":"https://bibleproject.com/guides/book-of-philemon/"}],"footer":["腓利門書 · 成人主日學教師版 · 請配合完整經文閱讀。","Philemon · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
