<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="路得記成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>路得記｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"RUT","category":["歷史敘事 · 舊約","OLD TESTAMENT · NARRATIVE"],"name":["路得記","Ruth"],"subtitle":["在士師時代的饑荒與喪失中，路得、拿俄米與波阿斯藉忠誠、拾穗和公開承擔走出新的可能。","Amid famine and loss in the days of the judges, Ruth, Naomi, and Boaz open a future through loyalty, gleaning, and public responsibility."],"overviewIntro":["在士師時代的饑荒與喪失中，路得、拿俄米與波阿斯藉忠誠、拾穗和公開承擔走出新的可能。","Amid famine and loss in the days of the judges, Ruth, Naomi, and Boaz open a future through loyalty, gleaning, and public responsibility."],"lengthNote":["4 章；請按文學單元和整卷脈絡閱讀。","4 chapters; read each literary unit within the whole book."],"thesis":["日常忠誠承載廣闊的盼望","Ordinary loyalty carries a wider hope"],"thesisDetail":["上帝的作為透過脆弱者的選擇、田間的保護與城門的公正逐漸顯明，最後接上大衛的家譜。","Divine purpose emerges through vulnerable people’s choices, field protection, and public justice, then joins David’s genealogy."],"keyQuestion":["失落中的人如何得到安全與歸屬？","How do people facing loss find safety and belonging?"],"keyAnswer":["全書既肯定人的忠誠，也使讀者注意制度、移民身分與性別權力。","The book affirms loyalty while attending to institutions, migration, and gendered power."],"finalMovement":["俄備得的家譜通往大衛，將士師時代這段小家庭故事連到撒母耳記的王權故事。","Obed’s genealogy leads to David, joining this household story from the judges’ era to the monarchy in Samuel."],"readingKeys":[{"refs":"1 ↔ 4","title":["空與滿","Empty and full"],"body":["拿俄米的用語與結尾鄰人的祝福形成首尾呼應。","Naomi’s language and the neighbors’ blessing frame the story."]},{"refs":"2","title":["拾穗制度","Gleaning"],"body":["律法提供入口，但安全與尊嚴取決於實際關係。","Law creates access; safety and dignity depend on practice."]},{"refs":"2:12; 3:9","title":["翅膀與衣襟","Wings and garment"],"body":["路得尋求神的蔭庇，也要求波阿斯承擔具體責任。","Ruth seeks divine shelter and asks Boaz for concrete responsibility."]},{"refs":"4:1–12","title":["城門與見證","Gate and witnesses"],"body":["轉機經過公開程序，不只依靠個人情感。","The resolution passes through public procedure, not private feeling alone."]}],"mapIntro":["以下分段是教學導覽，章界有助查找，並非每一段論述的天然邊界。","These movements guide study; chapter divisions are useful but do not always mark a natural literary boundary."],"movements":[{"refs":"1:1–5","title":["第 1 課｜饑荒與喪失","Lesson 1 | Famine and loss"],"body":["為故事建立經濟、遷徙和喪親背景。","Establish the economic, migrant, and bereavement context."]},{"refs":"1:6–22","title":["第 2 課｜選擇同行","Lesson 2 | Choosing to stay"],"body":["比較俄珥巴、路得與拿俄米各自合理而不同的抉擇。","Compare Orpah, Ruth, and Naomi’s distinct, understandable choices."]},{"refs":"2:1–13","title":["第 3 課｜拾穗與安全","Lesson 3 | Gleaning and safety"],"body":["看法律保障如何需要田間的實際執行。","Study how legal provision needs practical enforcement in the field."]},{"refs":"2:14–23","title":["第 4 課｜多給的糧與親族","Lesson 4 | Extra grain and kinship"],"body":["討論超過最低法律要求的慷慨，與拿俄米希望的重現。","Consider generosity beyond minimum law and Naomi’s renewed hope."]},{"refs":"3:1–9","title":["第 5 課｜路得提出請求","Lesson 5 | Ruth makes a request"],"body":["細讀拿俄米的計畫、打穀場風險與路得自己的話。","Read Naomi’s plan, the risky setting, and Ruth’s own words."]},{"refs":"3:10–18","title":["第 6 課｜等待與次序","Lesson 6 | Waiting and due process"],"body":["觀察波阿斯願意承擔，卻先處理更近親屬的權利。","Observe Boaz’s willingness alongside the nearer relative’s prior claim."]},{"refs":"4:1–12","title":["第 7 課｜城門的公開責任","Lesson 7 | Public responsibility at the gate"],"body":["研究土地、家族與見證人的作用。","Examine land, family responsibility, and witnesses."]},{"refs":"4:13–22","title":["第 8 課｜拿俄米與大衛家譜","Lesson 8 | Naomi and David’s line"],"body":["看出生、鄰里祝福與家譜如何接續全書起點。","Read the birth, neighbors’ blessing, and genealogy against the opening."]}],"mapCaution":{"title":["歷史與文學提醒","Historical and literary note"],"body":["本書以古代敘事、神學評價與編排方式說話；章節與年代問題宜參照整卷上下文，避免把故事當作現代新聞紀錄。","This ancient narrative communicates through theological evaluation and literary design; read episodes in context rather than as modern reporting."]},"chaptersIntro":["每章有摘要、兩個深入重點、詮釋提醒與課堂提問。章名與分段是本站的研讀提示。","Each chapter has a summary, two close-reading points, an interpretive caution, and a teaching question. Titles and divisions are study aids."],"chapters":[{"n":1,"refs":"1","title":["離鄉、喪失與路得同行","Loss, return, and Ruth’s loyalty"],"summary":["饑荒使拿俄米一家往摩押，丈夫與兒子相繼死亡；拿俄米回伯利恆，路得選擇同行並認她的民與神。","Famine drives Naomi’s family to Moab; after husband and sons die, Naomi returns to Bethlehem and Ruth chooses her people and God."],"deep":[["故事由糧食匱乏開場，以收割季節回城作轉機","The story moves from famine to harvest on return"],["路得的誓言承擔跨族、跨家庭的長期風險","Ruth’s pledge carries lasting cross-family and cross-ethnic risk"]],"caution":["拿俄米的哀傷、路得的移民身分與打穀場的風險都應被認真看待；勿將女性生育或婚姻視為唯一的價值與結局。","Take Naomi’s grief, Ruth’s migrant status, and the threshing floor’s risk seriously; marriage or childbirth is not a woman’s sole value."],"question":["「我滿滿地出去，空空地回來」如何表達拿俄米的痛？","How does Naomi’s “full” and “empty” language voice grief?"]},{"n":2,"refs":"2","title":["田間拾穗與慷慨保護","Gleaning and generous protection"],"summary":["路得為養活二人去拾穗，恰到波阿斯田裡；波阿斯吩咐工人保護她並留下更多穀物，拿俄米看見親族希望。","Ruth gleans to sustain them and arrives in Boaz’s field; he orders protection and extra grain, and Naomi sees hope in a kinsman."],"deep":[["拾穗有律法背景，但實際安全仍仰賴田主與工人選擇","Gleaning has legal roots, but safety depends on the landowner and workers"],["「恰巧」的敘述讓日常決定承載天意問題","The apparent chance encounter invites reflection on providence"]],"caution":["拿俄米的哀傷、路得的移民身分與打穀場的風險都應被認真看待；勿將女性生育或婚姻視為唯一的價值與結局。","Take Naomi’s grief, Ruth’s migrant status, and the threshing floor’s risk seriously; marriage or childbirth is not a woman’s sole value."],"question":["制度允許拾穗，為何仍需要波阿斯的具體保護？","Why does a gleaning law still require concrete protection?"]},{"n":3,"refs":"3","title":["打穀場上的主動請求","A request at the threshing floor"],"summary":["拿俄米策劃夜間相遇，路得請波阿斯展開衣襟作至近親屬；波阿斯肯定她，卻指出還有更近的親族。","Naomi plans a night encounter; Ruth asks Boaz to spread his garment as a family redeemer; he affirms her but notes a nearer relative."],"deep":[["路得的請求呼應 2:12「翅膀」的祝福","Ruth’s request echoes the “wings” blessing in 2:12"],["夜間場景有風險與曖昧，需尊重路得的主動與脆弱","The night scene holds risk and ambiguity; honor both her agency and vulnerability"]],"caution":["拿俄米的哀傷、路得的移民身分與打穀場的風險都應被認真看待；勿將女性生育或婚姻視為唯一的價值與結局。","Take Naomi’s grief, Ruth’s migrant status, and the threshing floor’s risk seriously; marriage or childbirth is not a woman’s sole value."],"question":["路得如何從領受祝福轉向主動尋求保障？","How does Ruth move from receiving blessing to requesting protection?"]},{"n":4,"refs":"4","title":["城門交易、出生與家譜","Gate transaction, birth, and genealogy"],"summary":["更近親屬在城門放棄權利，波阿斯承擔責任並與路得結婚；俄備得出生使拿俄米重得未來，家譜連到大衛。","At the gate the nearer relative declines, Boaz accepts responsibility and marries Ruth; Obed’s birth renews Naomi’s future and the genealogy leads to David."],"deep":[["城門見證將私人善意化為公開責任","Public witnesses turn private generosity into accountable action"],["家譜沒有抹去拿俄米的哀傷，而是將日常忠誠放進更長故事","The genealogy places ordinary loyalty in a longer story without erasing grief"]],"caution":["拿俄米的哀傷、路得的移民身分與打穀場的風險都應被認真看待；勿將女性生育或婚姻視為唯一的價值與結局。","Take Naomi’s grief, Ruth’s migrant status, and the threshing floor’s risk seriously; marriage or childbirth is not a woman’s sole value."],"question":["結尾的喜樂如何仍尊重第一章的喪失？","How can the joyful ending still honor chapter 1’s losses?"]}],"themesIntro":["以下主題橫跨全書；先讀完整經文，再比較各段的不同聲音。","These themes run through the book; read full passages before comparing their distinct voices."],"themes":[{"refs":"1:8,16–17; 2:20; 3:10","title":["忠誠與慈愛","Loyal love"],"body":["人物的忠誠藉同行、糧食與承擔具體顯出。","Loyal love becomes concrete in staying, feeding, and accepting responsibility."],"caution":["不要要求弱勢者單方面犧牲。","Do not demand one-sided sacrifice from vulnerable people."]},{"refs":"1:1–6; 2; 4","title":["糧食與社會保護","Food and social protection"],"body":["饑荒、拾穗和城門交易顯示信仰牽涉經濟安全。","Famine, gleaning, and gate process show faith’s relation to economic security."],"caution":["私人恩惠不能替代公正制度。","Private goodwill cannot replace fair institutions."]},{"refs":"1:16–22; 2:10; 4:13–22","title":["移民與歸屬","Migration and belonging"],"body":["摩押女子路得成為以色列家族與大衛家譜的一員。","Ruth the Moabite enters an Israelite family and David’s genealogy."],"caution":["避免把接納說成完全沒有文化與權力差異。","Do not erase cultural and power differences in belonging."]},{"refs":"2:3; 3–4","title":["天意與人行動","Providence and agency"],"body":["敘事少直接描述神行動，卻讓日常選擇、風險與公共程序構成轉機。","The narrator rarely depicts direct divine action; daily choices, risks, and process carry the turning point."],"caution":["勿把受苦者的痛立即解釋為神安排。","Do not instantly explain a sufferer’s pain as divine design."]}],"pastoral":{"title":["教師帶領提醒","Teaching care"],"body":["不要匆忙以婚姻或生育「解決」拿俄米的哀傷。路得身為貧窮移民女性的安全、選擇權和勞動應被認真討論。","Do not use marriage or childbirth to rush past Naomi’s grief. Take Ruth’s safety, agency, migrant status, and labor seriously."]},"lessonsIntro":["八課可按班級時數調整。先讀指定經文與相鄰段落，再檢視人物、敘事者評價及今日應用的界線。","Adjust eight lessons to class time. Read assigned and adjacent passages, then distinguish character actions, narrator evaluation, and responsible application."],"lessons":[{"refs":"1:1–5","title":["第 1 課｜饑荒與喪失","Lesson 1 | Famine and loss"],"aim":["為故事建立經濟、遷徙和喪親背景。","Establish the economic, migrant, and bereavement context."],"flow":[["列出一家人作的遷徙決定","List the family’s migration decisions"],["留意死亡敘述的節奏","Attend to the sequence of deaths"],["討論寡婦的生存困境","Discuss widows’ survival risks"]],"question":["饑荒如何改變家庭的選擇？","How does famine reshape family choices?"],"practice":["不要以後續喜樂壓制喪親者哀傷。","Do not silence grief with the later happy ending."]},{"refs":"1:6–22","title":["第 2 課｜選擇同行","Lesson 2 | Choosing to stay"],"aim":["比較俄珥巴、路得與拿俄米各自合理而不同的抉擇。","Compare Orpah, Ruth, and Naomi’s distinct, understandable choices."],"flow":[["讀兩位媳婦與拿俄米的對話","Read the women’s dialogue"],["細讀路得誓言的代價","Name the cost of Ruth’s pledge"],["追問拿俄米的「空空」","Examine Naomi’s “empty”"]],"question":["忠誠何時是冒險而非浪漫口號？","When is loyalty a risk rather than a slogan?"],"practice":["不要貶低俄珥巴選擇回鄉。","Do not belittle Orpah’s return home."]},{"refs":"2:1–13","title":["第 3 課｜拾穗與安全","Lesson 3 | Gleaning and safety"],"aim":["看法律保障如何需要田間的實際執行。","Study how legal provision needs practical enforcement in the field."],"flow":[["查利未記 19:9–10 的背景","Read Leviticus 19:9–10"],["找出波阿斯給的安全指示","List Boaz’s safety instructions"],["比較路得的提問與波阿斯的回答","Compare Ruth’s question with his reply"]],"question":["有權拾穗是否就等於有安全保障？","Does a right to glean ensure safety?"],"practice":["留意移民女性可能遭遇騷擾。","Attend to harassment risk for a migrant woman."]},{"refs":"2:14–23","title":["第 4 課｜多給的糧與親族","Lesson 4 | Extra grain and kinship"],"aim":["討論超過最低法律要求的慷慨，與拿俄米希望的重現。","Consider generosity beyond minimum law and Naomi’s renewed hope."],"flow":[["數出波阿斯超過法定的行動","List Boaz’s actions beyond minimum duty"],["留意路得把糧帶給誰","Notice with whom Ruth shares food"],["讀拿俄米對至近親屬的解說","Read Naomi on the family redeemer"]],"question":["慷慨如何與制度共同工作？","How can generosity and institutions work together?"],"practice":["不要把照顧窮人只交給私人善心。","Do not leave care for the poor to private charity alone."]},{"refs":"3:1–9","title":["第 5 課｜路得提出請求","Lesson 5 | Ruth makes a request"],"aim":["細讀拿俄米的計畫、打穀場風險與路得自己的話。","Read Naomi’s plan, the risky setting, and Ruth’s own words."],"flow":[["比較拿俄米吩咐與路得實際說法","Compare Naomi’s instructions with Ruth’s speech"],["對照 2:12 的翅膀","Echo 2:12’s wings"],["辨認路得尋求的保障","Name the protection Ruth seeks"]],"question":["路得如何主動塑造這場對話？","How does Ruth shape the encounter?"],"practice":["不要把曖昧場景定為單一浪漫模式。","Do not impose a single romantic reading on the ambiguous scene."]},{"refs":"3:10–18","title":["第 6 課｜等待與次序","Lesson 6 | Waiting and due process"],"aim":["觀察波阿斯願意承擔，卻先處理更近親屬的權利。","Observe Boaz’s willingness alongside the nearer relative’s prior claim."],"flow":[["讀波阿斯對路得品格的稱讚","Read Boaz’s praise of Ruth"],["說明更近親屬的程序","Explain the nearer relative’s place"],["追蹤穀物與拿俄米的等待","Trace grain and Naomi’s wait"]],"question":["善意為何還需公開程序？","Why does goodwill still need a public process?"],"practice":["勿把波阿斯的權力位置浪漫化。","Do not romanticize Boaz’s power."]},{"refs":"4:1–12","title":["第 7 課｜城門的公開責任","Lesson 7 | Public responsibility at the gate"],"aim":["研究土地、家族與見證人的作用。","Examine land, family responsibility, and witnesses."],"flow":[["重建城門交易的次序","Reconstruct the gate transaction"],["比較兩名親屬的選擇","Compare the two relatives’ choices"],["讀眾人祝福的內容","Read the community’s blessing"]],"question":["公開見證如何保護較弱者？","How can public witness protect vulnerable people?"],"practice":["古代財產與婚姻程序不可直接當今法。","Ancient property and marriage procedures are not present law."]},{"refs":"4:13–22","title":["第 8 課｜拿俄米與大衛家譜","Lesson 8 | Naomi and David’s line"],"aim":["看出生、鄰里祝福與家譜如何接續全書起點。","Read the birth, neighbors’ blessing, and genealogy against the opening."],"flow":[["比較 1 章與 4 章拿俄米的語言","Compare Naomi in chapters 1 and 4"],["辨認鄰里女性的角色","Notice the neighborhood women"],["讀家譜如何指向大衛","Trace the genealogy to David"]],"question":["結局如何擴大而不抹去個人故事？","How does the ending widen without erasing personal lives?"],"practice":["不要把生育視作所有苦難的必然解答。","Do not make childbirth a universal answer to grief."]}],"questionsIntro":["請先讓學員指出經文根據，再討論詮釋與應用；困難經文可以保留開放問題。","Ask learners for textual evidence before interpretation and application; difficult passages may leave open questions."],"extraQuestions":[["哪一處轉機最依賴制度，哪一處最依賴個人的善意？","Which turning points rely on institutions, and which on individual generosity?"],["拿俄米、路得與波阿斯的主動性有何不同？","How do Naomi, Ruth, and Boaz exercise different kinds of agency?"],["「神的眷顧」如何在文本中被表達，又有哪些未說出的空間？","How is divine care expressed, and what does the story leave unsaid?"]],"sourceNote":["本站提供原創逐章研讀摘要與教學建議，不轉載現代聖經譯本經文。中文經文連結預設新標點和合本（神版），英文預設 NASB 2020。","Original chapter notes and teaching suggestions; no modern translation text is reproduced. Scripture links default to CUNP (Shen edition) in Chinese and NASB 2020 in English."],"sources":[{"title":["BibleProject｜路得記導讀","BibleProject | Ruth guide"],"url":"https://bibleproject.com/guides/book-of-ruth/"},{"title":["耶魯公開課｜舊約導論","Open Yale Courses | Introduction to the Old Testament"],"url":"https://oyc.yale.edu/religious-studies/rlst-145"}],"footer":["路得記研讀 · 原創逐章摘要與成人主日學教師教案","Ruth study · original chapter notes and adult class plans"],"pdfFiles":[{"file":"舊約縱覽-17_士師記路得記-1.pdf","title":["大衛鮑森舊約縱覽｜士師記／路得記 1 · PDF ↗","David Pawson’s Old Testament Survey | Judges and Ruth 1 · PDF ↗"]},{"file":"舊約縱覽-18_士師記路得記-2.pdf","title":["大衛鮑森舊約縱覽｜士師記／路得記 2 · PDF ↗","David Pawson’s Old Testament Survey | Judges and Ruth 2 · PDF ↗"]}]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
