":{"title":["閱讀提醒","Reading caution"],"body":["不要把「神沒有被提名」簡化為神完全不在場，或反過來斷言每個巧合都是可證明的神蹟。","Neither assume God’s absence from the unnamed divine nor claim every coincidence is a provable miracle."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["王的宴席與瓦實提","Royal banquet and Vashti"],"summary":["亞哈隨魯展示國力，命瓦實提出席；她拒絕後被廢。","Ahasuerus displays his splendor and commands Vashti to appear; she refuses and is removed."],"deep":[["王與謀士把一名女子的拒絕轉成全國男性權威問題。","The court turns one woman’s refusal into an empire-wide issue of male authority."],["瓦實提的拒絕是故事轉折，而非可草率定性的過錯。","Vashti’s refusal is a turning point, not a fault to label hastily."]],"caution":["勿用本章為控制配偶辯護。","Do not use this chapter to justify control of a spouse."],"question":["瓦實提有多少選擇空間？","How much choice does Vashti have?"]},{"n":2,"refs":"2","title":["以斯帖與未賞的功勞","Esther and an unrewarded act"],"summary":["以斯帖進入王宮成后；末底改揭發暗殺陰謀，事被記錄卻未獲賞。","Esther becomes queen; Mordecai exposes an assassination plot that is recorded but unrewarded."],"deep":[["以斯帖隱藏族裔與末底改未受賞同為伏筆。","Esther’s hidden identity and Mordecai’s unrecognized act prepare later turns."],["身分隱藏與記錄未賞，為後來的反轉埋線。","Hidden identity and an unrewarded record prepare later reversal."]],"caution":["不要將選后制度浪漫化；注意權力不對稱。","Do not romanticize the royal selection; note power imbalance."],"question":["哪些細節會在後文重新出現？","Which details return later?"]},{"n":3,"refs":"3","title":["哈曼與滅族詔令","Haman and the genocidal edict"],"summary":["哈曼因末底改不跪而發怒，掣籤選日，取得王的詔書攻擊猶大人。","Enraged by Mordecai’s refusal, Haman casts lots and secures a decree against the Jews."],"deep":[["全族被定為敵人是權力製造偏見的手段。","Power turns an entire people into an imagined enemy."],["個人衝突被權臣升高為對整個族群的威脅。","A court conflict is escalated into a threat against an entire people."]],"caution":["不可把任何當代族群等同哈曼。","Do not equate a modern ethnic group with Haman."],"question":["哈曼如何把私怨變成國家政策？","How does Haman turn private rage into state policy?"]},{"n":4,"refs":"4","title":["以斯帖決意進見","Esther decides to approach"],"summary":["末底改與以斯帖隔著宮門商議；她請眾人禁食，決意冒險進王面前。","Mordecai and Esther confer across the palace boundary; she asks for fasting and risks approaching the king."],"deep":[["「若是死就死」表達風險的真實，而非浪漫口號。","“If I perish” names a real risk, not a romantic slogan."],["「焉知你得王后位分不是為現今的機會」保留推測語氣。","“Who knows whether” keeps uncertainty in view."]],"caution":["勿把冒險當作對受脅迫者的輕率要求。","Do not demand reckless risk from vulnerable people."],"question":["以斯帖如何在不確定中作決定？","How does Esther decide amid uncertainty?"]},{"n":5,"refs":"5","title":["第一次宴席與木架","First banquet and gallows"],"summary":["王接納以斯帖，她安排下一場宴席；哈曼因末底改不跪而設木架。","The king receives Esther, who plans another banquet; Haman prepares a stake for Mordecai."],"deep":[["兩條情節線在宴席與木架之間收緊。","Banquet and stake draw the plot’s strands together."],["以斯帖延後揭露與哈曼急於報復形成節奏對比。","Esther’s delay contrasts with Haman’s hurried revenge."]],"caution":["不要把沉默一概解讀為缺乏勇氣。","Do not equate strategic silence with cowardice."],"question":["延後請求為何可能是策略？","Why might postponing the request be strategic?"]},{"n":6,"refs":"6","title":["王失眠與哈曼羞辱","The sleepless king and Haman’s humiliation"],"summary":["王讀史記得末底改功勞，哈曼誤以為榮耀給自己，反被命尊榮末底改。","The king recalls Mordecai’s service; Haman assumes honor is his but must honor Mordecai."],"deep":[["敘事反諷來自讀者比哈曼更知道局勢。","Irony works because readers know more than Haman."],["沒有新神蹟宣告，卻以時機與誤會推動反轉。","No explicit miracle is announced; timing and irony drive reversal."]],"caution":["勿把所有偶然都斷言成可檢驗的神聖安排。","Do not label every coincidence a provable divine intervention."],"question":["哪一個誤判使哈曼陷入反轉？","Which mistaken assumption reverses Haman’s fortunes?"]},{"n":7,"refs":"7","title":["以斯帖揭發哈曼","Esther exposes Haman"],"summary":["第二次宴席，以斯帖揭示自身族裔與哈曼陰謀，哈曼被處死在自己預備的木架上。","At the second banquet Esther names her people and Haman’s plot; Haman dies on the stake he prepared."],"deep":[["以斯帖從被隱藏的身分轉為公開發言。","Esther moves from concealed identity to public speech."],["反制法令也仰賴帝國權力，拯救並非簡單無暴力。","The counter-edict uses imperial power; rescue is not violence-free."]],"caution":["不可將法令中的暴力當成今日報復授權。","Do not turn the decree’s violence into a mandate for revenge."],"question":["她如何在王面前界定所受威脅？","How does she name the threat before the king?"]},{"n":8,"refs":"8","title":["不能撤銷的法令","The irrevocable edict"],"summary":["末底改得權，但原詔令不能撤銷；新令容許猶大人集結保衛生命。","Mordecai gains authority, but the old edict stands; a new one permits the Jews to assemble and defend themselves."],"deep":[["法律的僵硬使反轉仍充滿風險。","Rigid law leaves the reversal dangerous."],["反制法令也仰賴帝國權力，拯救並非簡單無暴力。","The counter-edict uses imperial power; rescue is not violence-free."]],"caution":["不可將法令中的暴力當成今日報復授權。","Do not turn the decree’s violence into a mandate for revenge."],"question":["為何哈曼死後危機仍未結束？","Why is the crisis not over after Haman dies?"]},{"n":9,"refs":"9","title":["自衛與普珥節","Defense and Purim"],"summary":["猶大人對攻擊者自衛，書中記下大量死亡；末底改與以斯帖設普珥節記念。","Jews defend against attackers, many deaths are recorded, and Mordecai and Esther institute Purim."],"deep":[["「沒有下手奪取財物」反覆出現，但不能使死亡無須討論。","Repeated refusal to seize plunder does not erase the need to discuss deaths."],["節期記念從哀到樂，也要求正視傷亡與權力。","The festival remembers a turn from grief to joy while violence and power remain in view."]],"caution":["勿讓勝利慶祝消除對死者的倫理追問。","Do not let celebration erase ethical questions about the dead."],"question":["節期如何記念恐懼與得救？","How does the festival remember fear and rescue?"]},{"n":10,"refs":"10","title":["末底改受尊崇","Mordecai’s elevation"],"summary":["末底改在王朝中居高位，為同胞求好處並說和平的話。","Mordecai rises in imperial rank, seeks his people’s welfare, and speaks peace."],"deep":[["結尾以帝國權力保障族群，仍留下權力如何運用的問題。","The ending uses imperial power for communal welfare yet leaves questions about power."],["節期記念從哀到樂，也要求正視傷亡與權力。","The festival remembers a turn from grief to joy while violence and power remain in view."]],"caution":["勿讓勝利慶祝消除對死者的倫理追問。","Do not let celebration erase ethical questions apter 7 and trace the turn in “Esther exposes Haman.”"],["比較 7–8 章的角色、場景與重複語詞。","Compare characters, settings, and repeated words in chapters 7–8."],["讀 8 章，整理這段如何接續全書。","Read chapter 8 and connect this unit to the whole book."]],"question":["她如何在王面前界定所受威脅？","How does she name the threat before the king?"],"practice":["不可將法令中的暴力當成今日報復授權。","Do not turn the decree’s violence into a mandate for revenge."]},{"refs":"9–10","title":["第 8 課｜自衛、普珥節與結尾","Lesson 8 | Defense, Purim, and ending"],"aim":["猶大人勝過敵對者，設立普珥節；末底改在朝中受尊崇。","The Jews prevail against attackers, establish Purim, and Mordecai rises in court."],"flow":[["讀 9 章，找出「自衛與普珥節」的轉折。","Read chapter 9 and trace the turn in “Defense and Purim.”"],["比較 9–10 章的角色、場景與重複語詞。","Compare characters, settings, and repeated words in chapters 9–10."],["讀 10 章，整理這段如何接續全書。","Read chapter 10 and connect this unit to the whole book."]],"question":["節期如何記念恐懼與得救？","How does the festival remember fear and rescue?"],"practice":["勿讓勝利慶祝消除對死者的倫理追問。","Do not let celebration erase ethical questions about the dead."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["以斯帖記最常被忽略的人物是誰？為何？","Which character in Esther is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜以斯帖記導讀","BibleProject | Esther guide"],"url":"https://bibleproject.com/guides/book-of-esther/"}],"footer":["以斯帖記 · 成人主日學教師版 · 請配合完整經文閱讀。","Esther · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-languag
