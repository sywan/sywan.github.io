<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="撒母耳記下成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>撒母耳記下｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"2SA","category":["歷史敘事 · 舊約","OLD TESTAMENT · NARRATIVE"],"name":["撒母耳記下","2 Samuel"],"subtitle":["從大衛哀悼掃羅、建都與王朝應許，到拔示巴、他瑪與押沙龍的傷害和動亂；以公義與受害者的眼光審視王權。","From David’s lament, capital, and dynastic promise to harms involving Bathsheba, Tamar, and Absalom, examine kingship through justice and its victims."],"overviewIntro":["從大衛哀悼掃羅、建都與王朝應許，到拔示巴、他瑪與押沙龍的傷害和動亂；以公義與受害者的眼光審視王權。","From David’s lament, capital, and dynastic promise to harms involving Bathsheba, Tamar, and Absalom, examine kingship through justice and its victims."],"lengthNote":["24 章；請按文學單元和整卷脈絡閱讀。","24 chapters; read each literary unit within the whole book."],"thesis":["王朝應許與王的問責並行","Dynastic promise and royal accountability coexist"],"thesisDetail":["神應許建立大衛的家，但大衛的濫權傷害他人；全書不容應許遮蔽受害者，也不把認罪等同傷害消失。","God promises a royal house, yet David’s abuse harms others; promise does not hide victims, and confession does not undo harm."],"keyQuestion":["有權者的罪如何使無權者承受代價？","How do the powerful make others bear the cost of wrongdoing?"],"keyAnswer":["拿單的責備、他瑪的拒絕與利斯巴的守候，讓讀者以不同聲音檢驗「公義的王」。","Nathan’s rebuke, Tamar’s refusal, and Rizpah’s vigil test what a just king means."],"finalMovement":["數民之罪與亞勞拿禾場祭壇使全卷停在悔改和代價之間；列王紀將繼續檢驗大衛家。","The census and Araunah’s altar leave the reign between repentance and cost; Kings continues testing David’s house."],"readingKeys":[{"refs":"7 ↔ 11–12","title":["應許與責備","Promise and rebuke"],"body":["拿單先帶來王朝應許，後以寓言審判王的濫權。","Nathan brings a dynastic promise and later confronts royal abuse."]},{"refs":"11–14","title":["留意缺席的公義","Notice absent justice"],"body":["拔示巴、烏利亞與他瑪的傷害不能被王的認罪或父子見面直接消除。","Confession and a family meeting do not erase harms to Bathsheba, Uriah, and Tamar."]},{"refs":"15–20","title":["勝利之後仍分裂","Division after victory"],"body":["押沙龍死後大衛回城，卻又有猶大與以色列爭端及示巴叛亂。","Absalom’s death and David’s return are followed by tribal conflict and Sheba’s revolt."]},{"refs":"21–24","title":["結尾回望全書","The ending rereads the reign"],"body":["利斯巴、詩歌、勇士名單與瘟疫使讀者同時衡量盼望與代價。","Rizpah, poems, warriors, and plague weigh both hope and cost."]}],"mapIntro":["以下分段是教學導覽，章界有助查找，並非每一段論述的天然邊界。","These movements guide study; chapter divisions are useful but do not always mark a natural literary boundary."],"movements":[{"refs":"1–4","title":["第 1 課｜哀歌與王權交接","Lesson 1 | Lament and succession"],"body":["比較大衛的哀歌、猶大與以色列分治，以及兩次拒絕謀殺邀功。","Compare David’s lament, divided kingdoms, and refusal of murderous bids for favor."]},{"refs":"5–7","title":["第 2 課｜首都、約櫃與應許","Lesson 2 | Capital, ark, and promise"],"body":["讀耶路撒冷的新中心、迎約櫃與「建家」應許。","Read the new capital, ark procession, and promise of a “house.”"]},{"refs":"8–10","title":["第 3 課｜權力、公義與恩惠","Lesson 3 | Power, justice, and kindness"],"body":["對照戰功行政、米非波設蒙恩與外交誤解。","Compare state administration, Mephibosheth’s welcome, and diplomatic suspicion."]},{"refs":"11–12","title":["第 4 課｜王的罪與拿單的責備","Lesson 4 | Royal abuse and prophetic rebuke"],"body":["以權力差距讀拔示巴、烏利亞與拿單寓言；區分認罪和修復。","Read Bathsheba, Uriah, and Nathan’s parable through power imbalance; distinguish confession from repair."]},{"refs":"13–14","title":["第 5 課｜他瑪與未竟的公義","Lesson 5 | Tamar and unresolved justice"],"body":["以他瑪的話為中心，分析父王不作為、押沙龍報復與表面調停。","Center Tamar’s words while analyzing royal inaction, revenge, and superficial mediation."]},{"refs":"15–17","title":["第 6 課｜反叛、資訊與被利用者","Lesson 6 | Revolt and exploited people"],"body":["觀察司法口號、流亡與謀略，並指出女性與殘障者如何被政爭利用。","Read justice rhetoric, flight, and strategy while noticing women and a disabled man used in political claims."]},{"refs":"18–20","title":["第 7 課｜得勝與分裂未癒","Lesson 7 | Victory without healing"],"body":["讀押沙龍之死、大衛回城與示巴叛亂，檢查軍事勝利的限制。","Read Absalom’s death, David’s return, and Sheba’s revolt as limits of military success."]},{"refs":"21–24","title":["第 8 課｜附錄中的王權審視","Lesson 8 | The closing mirror of kingship"],"body":["以利斯巴、兩首詩、烏利亞之名與數民災疫評估大衛王朝。","Use Rizpah, two poems, Uriah’s name, and the census plague to evaluate David’s reign."]}],"mapCaution":{"title":["歷史與文學提醒","Historical and literary note"],"body":["本書以古代敘事、神學評價與編排方式說話；章節與年代問題宜參照整卷上下文，避免把故事當作現代新聞紀錄。","This ancient narrative communicates through theological evaluation and literary design; read episodes in context rather than as modern reporting."]},"chaptersIntro":["每章有摘要、兩個深入重點、詮釋提醒與課堂提問。章名與分段是本站的研讀提示。","Each chapter has a summary, two close-reading points, an interpretive caution, and a teaching question. Titles and divisions are study aids."],"chapters":[{"n":1,"refs":"1","title":["大衛哀悼掃羅與約拿單","David laments Saul and Jonathan"],"summary":["報信的亞瑪力人自稱殺掃羅，大衛處死他；隨後作哀歌悼念掃羅與約拿單，禁止以色列在喜樂中誇耀。","An Amalekite claims to have killed Saul and is executed; David then laments Saul and Jonathan rather than celebrating their deaths."],"deep":[["報信者說法與撒上 31 章不完全一致，須比較敘事視角","The messenger’s account differs from 1 Samuel 31; compare perspectives"],["哀歌承認敵對君王也值得哀傷","The lament honors even a rival king"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["大衛為何以哀歌開始自己的王權故事？","Why does David’s reign begin with lament?"]},{"n":2,"refs":"2","title":["大衛在希伯崙與兩家衝突","David at Hebron and two houses at war"],"summary":["大衛受膏作猶大王，伊施波設被立為以色列王；雙方軍隊在基遍交戰，亞撒黑追亞比尼珥而死。","David is anointed king of Judah while Ish-bosheth rules Israel; their forces fight at Gibeon, and Asahel dies pursuing Abner."],"deep":[["大衛稱讚埋葬掃羅的雅比人，延續對先王的尊重","David commends Jabesh’s burial of Saul"],["軍官的角力使王權更替伴隨同族流血","Commanders’ rivalry turns succession into civil bloodshed"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["何以王權更替未立即帶來和平？","Why does succession fail to bring immediate peace?"]},{"n":3,"refs":"3","title":["亞比尼珥轉向與遭殺","Abner changes sides and is killed"],"summary":["亞比尼珥與伊施波設決裂，提出帶以色列歸大衛；約押為亞撒黑報仇殺他，大衛公開哀悼並否認參與。","Abner breaks with Ish-bosheth and seeks to unite Israel under David; Joab kills him for Asahel, and David publicly mourns and disavows the act."],"deep":[["亞比尼珥的政治轉向未必純出忠誠","Abner’s shift may not be purely loyal"],["大衛的公開哭喪也有維持合法性的政治面向","David’s public lament also protects legitimacy"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["公開悼念如何兼具真哀傷與政治功能？","How can public mourning be both sincere and political?"]},{"n":4,"refs":"4","title":["伊施波設遭刺殺","Ish-bosheth assassinated"],"summary":["兩名軍官刺殺伊施波設，拿首級向大衛邀功；大衛拒賞，命人處死刺客，安葬死者首級。","Two captains murder Ish-bosheth and bring his head to David for reward; David condemns them and buries the head."],"deep":[["大衛拒絕以謀殺換取王位合法性","David refuses legitimacy through murder"],["回想撒上 24、26 章拒殺掃羅的模式","The response echoes sparing Saul in 1 Samuel 24 and 26"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["取得權力的方式如何影響權力的正當性？","How does the means of gaining power shape legitimacy?"]},{"n":5,"refs":"5","title":["全以色列立王與耶路撒冷","King over Israel and Jerusalem"],"summary":["眾支派立大衛為王，他攻取耶路撒冷並定都；非利士人來攻，大衛求問後兩度得勝。","The tribes make David king; he takes Jerusalem as capital and defeats Philistines after inquiry."],"deep":[["耶路撒冷成為新政治中心，不屬單一舊支派","Jerusalem becomes a new center outside an old tribal capital"],["兩次戰役的指示不同，得勝不等於機械複製","Directions differ in two battles; victory is not a formula"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["新首都如何重塑各支派的關係？","How does the new capital reshape tribal relationships?"]},{"n":6,"refs":"6","title":["約櫃入城與米甲爭議","Ark enters Jerusalem; Michal disputes"],"summary":["運約櫃時烏撒被擊殺，行程暫停；後來大衛歡舞迎約櫃入城，米甲批評他，兩人關係決裂。","Uzzah dies during the ark’s transport, pausing the journey; later David dances as the ark enters Jerusalem, and Michal criticizes him."],"deep":[["約櫃不應被當成王室勝利裝飾","The ark is not royal decoration"],["米甲的處境有家族、婚姻與政治張力，不宜只叫她「不敬虔」","Michal’s response belongs to family, marital, and political tensions, not a simple label of irreverence"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["大衛與米甲為何對同一事件理解不同？","Why do David and Michal read the event differently?"]},{"n":7,"refs":"7","title":["大衛之約與建殿延後","Covenant with David; temple deferred"],"summary":["大衛想為神建殿，神藉拿單反轉：神先為大衛建立「家」，其後裔將承接王位；大衛以禱告回應。","David proposes a temple; through Nathan God reverses the offer, promising a royal “house” and future heir, and David responds in prayer."],"deep":[["「家」一字連結宮殿、聖殿與王朝","“House” links palace, temple, and dynasty"],["應許是神先行，不是王用建築換取神支持","Promise begins with God, not a royal building project earning favor"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["本章如何重新定位君王與神的關係？","How does this chapter reset the ruler’s relation to God?"]},{"n":8,"refs":"8","title":["戰功、行政與不安的暴力","Campaigns and administration"],"summary":["大衛接連擊敗周邊勢力，設立官員；章末說他向眾民施行公平與公義，征戰段落仍帶暴力問題。","David defeats surrounding powers and appoints officials; the chapter says he administers justice, though its campaigns raise moral questions."],"deep":[["戰功總結與行政清單把國家建立連在一起","Campaign and official lists portray state building"],["讀者應同時問公義宣稱與受征服者的經驗","Justice claims must be read beside the conquered peoples’ experience"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["如何評估一個同時自稱公義且大幅用兵的王朝？","How can a militarized kingdom’s justice claim be assessed?"]},{"n":9,"refs":"9","title":["大衛善待米非波設","David welcomes Mephibosheth"],"summary":["大衛尋找掃羅家後人，為約拿單之故把米非波設接到王席，歸還祖父產業，並安排洗巴管理。","For Jonathan’s sake David welcomes Saul’s descendant Mephibosheth to the royal table, restores family land, and appoints Ziba to manage it."],"deep":[["王席可以表忠誠，也可使受惠者依賴王權","The royal table can signal loyalty yet create dependence"],["米非波設的身體障礙不應被用作人格缺陷象徵","Mephibosheth’s disability is no moral defect"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["王的善待如何兼具恩惠與權力不對等？","How can royal kindness coexist with unequal power?"]},{"n":10,"refs":"10","title":["使臣受辱與亞捫戰爭","Envoys humiliated and Ammonite war"],"summary":["亞捫王誤認大衛慰問使者為間諜，剃鬍剪衣羞辱他們；雙方結盟與反擊，引發長期戰事。","Ammon’s king suspects David’s condolence envoys, humiliates them, and alliances and counterattacks launch war."],"deep":[["誤讀善意成敵意使外交危機升級","Misreading condolence as espionage escalates crisis"],["戰爭背景直接連到第十一章大衛留京的場景","The war leads into David staying in Jerusalem in chapter 11"]],"caution":["王權建立與征戰仍涉及被征服者與被擄者；勿以成功敘事掩蓋暴力及權力不對等。","State formation and war involve conquered and vulnerable people; do not let success hide violence or unequal power."],"question":["誤解如何在權力競爭中迅速擴大？","How can suspicion escalate under political rivalry?"]},{"n":11,"refs":"11","title":["大衛、拔示巴與烏利亞","David, Bathsheba, and Uriah"],"summary":["列王出戰時大衛留京，召拔示巴並使她懷孕；他設計掩蓋，最後命約押把烏利亞置於死地。","While armies fight, David stays in Jerusalem, summons Bathsheba, and she conceives; he attempts a cover-up and arranges Uriah’s death."],"deep":[["王命與權力差距使拔示巴不宜被描寫為誘惑者","Royal summons and unequal power rule out blaming Bathsheba as seducer"],["烏利亞忠於同袍，映照大衛逃避責任","Uriah’s loyalty exposes David’s evasion"]],"caution":["第 11–16 章涉及王權性濫用、他瑪受害與妃嬪被利用；不責怪受害者，也不把「和解」取代問責。","Chapters 11–16 involve royal sexual abuse, Tamar’s assault, and concubines used as political tools; avoid victim-blaming and require accountability."],"question":["敘事如何揭露王權對身體與生命的支配？","How does the story expose royal control over bodies and lives?"]},{"n":12,"refs":"12","title":["拿單責備與後果","Nathan confronts David and consequences follow"],"summary":["拿單以窮人小母羊寓言使大衛自判己罪；大衛承認過錯，孩子死亡，拔示巴後生所羅門，亞捫戰事結束。","Nathan’s lamb parable draws David into judging himself; David confesses, the child dies, Solomon is later born, and the Ammonite campaign ends."],"deep":[["寓言讓王先對不義作道德判斷再面對自己","The parable elicits moral judgment before self-recognition"],["認罪沒有取消拔示巴與孩子所承受的傷害","Confession does not erase Bathsheba’s and the child’s losses"]],"caution":["第 11–16 章涉及王權性濫用、他瑪受害與妃嬪被利用；不責怪受害者，也不把「和解」取代問責。","Chapters 11–16 involve royal sexual abuse, Tamar’s assault, and concubines used as political tools; avoid victim-blaming and require accountability."],"question":["認罪與對受害者負責如何區別又相連？","How do confession and accountability to victims differ and connect?"]},{"n":13,"refs":"13","title":["他瑪受害與押沙龍報復","Tamar assaulted; Absalom retaliates"],"summary":["暗嫩強暴他瑪後厭棄她，大衛震怒卻未見公義處理；押沙龍兩年後殺暗嫩，逃往基述。","Amnon assaults and rejects Tamar; David is angry without effective justice, and Absalom kills Amnon two years later before fleeing."],"deep":[["他瑪明言拒絕並指出不義，絕非「曖昧」","Tamar clearly refuses and names the wrong"],["父王的不作為使家族與國家的暴力擴大","The father-king’s inaction widens familial and national violence"]],"caution":["第 11–16 章涉及王權性濫用、他瑪受害與妃嬪被利用；不責怪受害者，也不把「和解」取代問責。","Chapters 11–16 involve royal sexual abuse, Tamar’s assault, and concubines used as political tools; avoid victim-blaming and require accountability."],"question":["如何以他瑪的話而非施暴者理由教這章？","How can Tamar’s words, not the perpetrator’s excuses, lead discussion?"]},{"n":14,"refs":"14","title":["押沙龍回城卻未和解","Absalom returns without reconciliation"],"summary":["約押安排提哥亞婦人說服大衛召押沙龍回來；他雖返耶路撒冷，久未見王，最後強迫約押促成相見。","Joab uses a woman from Tekoa to persuade David to recall Absalom; he returns but remains excluded, then forces a royal audience."],"deep":[["巧言的調停沒有處理他瑪之傷與暗嫩之罪","Skillful mediation leaves Tamar’s harm and Amnon’s crime unaddressed"],["父子見面不等於公義、承認或真正和解","A meeting is not justice or reconciliation"]],"caution":["第 11–16 章涉及王權性濫用、他瑪受害與妃嬪被利用；不責怪受害者，也不把「和解」取代問責。","Chapters 11–16 involve royal sexual abuse, Tamar’s assault, and concubines used as political tools; avoid victim-blaming and require accountability."],"question":["未處理的傷害如何在表面和解後繼續發酵？","How can unresolved harm persist after outward reconciliation?"]},{"n":15,"refs":"15","title":["押沙龍奪人心與大衛逃城","Absalom wins support; David flees"],"summary":["押沙龍在城門承諾公正審判，於希伯崙發動叛變；大衛帶家人逃離，留下部分妃嬪守宮。","Absalom promises justice at the gate and launches revolt from Hebron; David flees with his household, leaving some concubines behind."],"deep":[["城門的司法抱怨回應王朝治理缺口","Gate complaints expose a governance failure"],["留下的女性承受政治決定的風險","Women left behind bear risk from a political decision"]],"caution":["第 11–16 章涉及王權性濫用、他瑪受害與妃嬪被利用；不責怪受害者，也不把「和解」取代問責。","Chapters 11–16 involve royal sexual abuse, Tamar’s assault, and concubines used as political tools; avoid victim-blaming and require accountability."],"question":["為何「我會給你公正」能成為有效政治口號？","Why does a promise of justice become a powerful political message?"]},{"n":16,"refs":"16","title":["洗巴、示每與押沙龍的公開羞辱","Ziba, Shimei, and public humiliation"],"summary":["逃亡中洗巴指控米非波設，示每咒罵大衛；押沙龍在亞希多弗建議下公開與父親妃嬪同寢，宣示奪權。","During flight Ziba accuses Mephibosheth and Shimei curses David; Absalom publicly takes David’s concubines on Ahithophel’s advice to claim power."],"deep":[["洗巴說法尚未受另一方核對","Ziba’s claim responsible application."],"lessons":[{"refs":"1–4","title":["第 1 課｜哀歌與王權交接","Lesson 1 | Lament and succession"],"aim":["比較大衛的哀歌、猶大與以色列分治，以及兩次拒絕謀殺邀功。","Compare David’s lament, divided kingdoms, and refusal of murderous bids for favor."],"flow":[["讀 1 章哀歌如何稱掃羅","Read how the lament names Saul"],["追蹤 2–3 章兩家軍事衝突","Trace two houses in chapters 2–3"],["比較亞比尼珥與伊施波設死後的反應","Compare responses to Abner’s and Ish-bosheth’s deaths"]],"question":["不以仇敵之死慶功有何政治倫理？","What political ethic resists celebrating a rival’s death?"],"practice":["讓內戰死者不被合法性討論淹沒。","Keep civil-war dead visible in debates about legitimacy."]},{"refs":"5–7","title":["第 2 課｜首都、約櫃與應許","Lesson 2 | Capital, ark, and promise"],"aim":["讀耶路撒冷的新中心、迎約櫃與「建家」應許。","Read the new capital, ark procession, and promise of a “house.”"],"flow":[["標出第五章政軍發展","Map chapter 5’s state-building"],["比較大衛與米甲對迎約櫃的觀點","Compare David and Michal in chapter 6"],["找第七章「家」的不同意思","Identify meanings of “house” in chapter 7"]],"question":["王可以替神設計甚麼、不能設計甚麼？","What can a king design for God, and what cannot he control?"],"practice":["勿以米甲不育作對女性的道德評分。","Do not make Michal’s childlessness a moral score."]},{"refs":"8–10","title":["第 3 課｜權力、公義與恩惠","Lesson 3 | Power, justice, and kindness"],"aim":["對照戰功行政、米非波設蒙恩與外交誤解。","Compare state administration, Mephibosheth’s welcome, and diplomatic suspicion."],"flow":[["討論 8 章公義宣稱","Examine justice claims in chapter 8"],["讀 9 章王席的恩惠與依賴","Read generosity and dependence at the royal table in chapter 9"],["找出 10 章戰事如何起於誤讀","Trace suspicion into war in chapter 10"]],"question":["善意如何仍需受權力差距檢驗？","How must kindness be tested under unequal power?"],"practice":["勿把米非波設的障礙當作屬靈寓言。","Do not turn Mephibosheth’s disability into a moral metaphor."]},{"refs":"11–12","title":["第 4 課｜王的罪與拿單的責備","Lesson 4 | Royal abuse and prophetic rebuke"],"aim":["以權力差距讀拔示巴、烏利亞與拿單寓言；區分認罪和修復。","Read Bathsheba, Uriah, and Nathan’s parable through power imbalance; distinguish confession from repair."],"flow":[["標出王的每道命令及受影響者","Mark each royal command and its targets"],["細讀小母羊寓言的轉折","Read the lamb parable’s turn"],["問認罪後誰仍承受後果","Ask who still bears consequences after confession"]],"question":["誰能對有權者說「你就是那人」？","Who can tell a ruler, “You are the one”?"],"practice":["不要把拔示巴稱為誘惑者或把孩子死亡合理化為可接受代價。","Do not blame Bathsheba or treat a child’s death as acceptable cost."]},{"refs":"13–14","title":["第 5 課｜他瑪與未竟的公義","Lesson 5 | Tamar and unresolved justice"],"aim":["以他瑪的話為中心，分析父王不作為、押沙龍報復與表面調停。","Center Tamar’s words while analyzing royal inaction, revenge, and superficial mediation."],"flow":[["事先提醒內容並容許退出","Warn about content and allow opting out"],["讀他瑪對暗嫩的拒絕","Read Tamar’s refusal"],["比較大衛憤怒與實際行動","Compare David’s anger with his actions"]],"question":["為甚麼見面與親吻不能代替公義？","Why can a meeting or kiss not replace justice?"],"practice":["不追問受害者為何未採取更多行動。","Do not question why the victim did not do more."]},{"refs":"15–17","title":["第 6 課｜反叛、資訊與被利用者","Lesson 6 | Revolt and exploited people"],"aim":["觀察司法口號、流亡與謀略，並指出女性與殘障者如何被政爭利用。","Read justice rhetoric, flight, and strategy while noticing women and a disabled man used in political claims."],"flow":[["分析押沙龍在城門的承諾","Analyze Absalom’s gate promises"],["比較洗巴報告與後來申辯","Set Ziba’s report beside the later response"],["追蹤第十七章的傳信網絡","Trace chapter 17’s messenger network"]],"question":["政治宣傳如何利用真實的不滿？","How can political messaging exploit real grievances?"],"practice":["勿將宮中妃嬪描述為自願的政治象徵。","Do not depict the concubines as willing political symbols."]},{"refs":"18–20","title":["第 7 課｜得勝與分裂未癒","Lesson 7 | Victory without healing"],"aim":["讀押沙龍之死、大衛回城與示巴叛亂，檢查軍事勝利的限制。","Read Absalom’s death, David’s return, and Sheba’s revolt as limits of military success."],"flow":[["比較約押與大衛對押沙龍的選擇","Compare Joab and David on Absalom"],["讀米非波設的解釋","Read Mephibosheth’s account"],["討論亞比拉婦人的談判","Discuss the wise woman at Abel"]],"question":["王回來之後，哪一些裂痕仍在？","Which divisions persist after the king returns?"],"practice":["哀悼與治理責任須同時被看見。","Recognize grief and public responsibility together."]},{"refs":"21–24","title":["第 8 課｜附錄中的王權審視","Lesson 8 | The closing mirror of kingship"],"aim":["以利斯巴、兩首詩、烏利亞之名與數民災疫評估大衛王朝。","Use Rizpah, two poems, Uriah’s name, and the census plague to evaluate David’s reign."],"flow":[["讓利斯巴的守候提出問題","Let Rizpah’s vigil raise questions"],["對照 22–23 章理想與烏利亞之名","Set the poems beside Uriah’s name"],["讀 24 章百姓付的代價","Read the people’s cost in chapter 24"]],"question":["對王權的最後判斷為何不能只看戰功？","Why can military achievement not be the final judgment of rule?"],"practice":["不要以神學公式合理化七名後裔與瘟疫死者的死亡。","Do not rationalize the deaths of descendants or plague victims."]}],"questionsIntro":["請先讓學員指出經文根據，再討論詮釋與應用；困難經文可以保留開放問題。","Ask learners for textual evidence before interpretation and application; difficult passages may leave open questions."],"extraQuestions":[["第七章的應許如何與第十一至十三章的王家罪行同讀？","How should chapter 7’s promise be read beside chapters 11–13?"],["誰能對王說真話？誰雖說了話仍未得公義？","Who can confront the king, and who speaks yet still lacks justice?"],["第二十一至二十四章為何以非時間順序的方式回望大衛？","Why do chapters 21–24 revisit David outside a simple chronology?"]],"sourceNote":["本站提供原創逐章研讀摘要與教學建議，不轉載現代聖經譯本經文。中文經文連結預設新標點和合本（神版），英文預設 NASB 2020。","Original chapter notes and teaching suggestions; no modern translation text is reproduced. Scripture links default to CUNP (Shen edition) in Chinese and NASB 2020 in English."],"sources":[{"title":["BibleProject｜撒母耳記下導讀","BibleProject | 2 Samuel guide"],"url":"https://bibleproject.com/guides/books-of-samuel/"},{"title":["耶魯公開課｜舊約導論","Open Yale Courses | Introduction to the Old Testament"],"url":"https://oyc.yale.edu/religious-studies/rlst-145"}],"footer":["撒母耳記下研讀 · 原創逐章摘要與成人主日學教師教案","2 Samuel study · original chapter notes and adult class plans"],"pdfFiles":[{"file":"舊約縱覽-19_撒母耳記上下-1.pdf","title":["大衛鮑森舊約縱覽｜撒母耳記上／下 1 · PDF ↗","David Pawson’s Old Testament Survey | 1 and 2 Samuel 1 · PDF ↗"]},{"file":"舊約縱覽-20_撒母耳記上下-2.pdf","title":["大衛鮑森舊約縱覽｜撒母耳記上／下 2 · PDF ↗","David Pawson’s Old Testament Survey | 1 and 2 Samuel 2 · PDF ↗"]}]};</script><script
