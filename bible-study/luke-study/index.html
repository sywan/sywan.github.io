<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="路加福音成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>路加福音｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"LUK","category":["四福音","The Four Gospels"],"name":["路加福音","Luke"],"subtitle":["24 章從降生詩歌、加利利事工到耶路撒冷旅程、受難復活；與使徒行傳相連。","Twenty-four chapters move from birth songs and Galilee through the Jerusalem journey, death, and resurrection, continuing into Acts."],"overviewIntro":["先從全書結構掌握路加福音，再逐章研讀人物、事件與神學判斷。","Survey Luke as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["24 章；依照書卷原有次序逐章研讀。","24 chapters studied in canonical sequence."],"thesis":["失喪的人被尋回，救恩臨到萬民","The lost are sought and good news reaches all peoples"],"thesisDetail":["路加以聖靈、禱告、飯桌、財富與貧窮、婦女和外邦人的故事，描繪耶穌如何翻轉社會期待。","Through Spirit, prayer, table, wealth and poverty, women, and Gentiles, Luke portrays Jesus overturning social expectations."],"keyQuestion":["路加福音如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Luke portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["路加以聖靈、禱告、飯桌、財富與貧窮、婦女和外邦人的故事，描繪耶穌如何翻轉社會期待。","Through Spirit, prayer, table, wealth and poverty, women, and Gentiles, Luke portrays Jesus overturning social expectations."],"finalMovement":["以馬忤斯路上的經文解明、飯桌認出與耶路撒冷的見證，預備使徒行傳的展開。","Scriptural explanation and recognition at Emmaus prepare the Jerusalem witnesses and the story of Acts."],"readingKeys":[{"refs":"1–2","title":["降生與逆轉之歌","Birth and songs of reversal"],"body":["馬利亞、撒迦利亞、西面與亞拿的聲音把孩子放在以色列盼望與萬民之光中。","Mary, Zechariah, Simeon, and Anna place the child within Israel’s hope and light for nations."]},{"refs":"5–8","title":["加利利：飯桌、醫治、聆聽","Galilee: table, healing, hearing"],"body":["召門徒、與罪人同桌、平原講論、婦女受醫治與種子比喻並進。","Calling, meals with sinners, the plain sermon, women’s healing, and seed parable unfold."]},{"refs":"11–13","title":["禱告、財富與悔改","Prayer, wealth, and repentance"],"body":["主禱文、無知財主、警醒與不結果無花果樹質問信仰實踐。","The Lord’s Prayer, rich fool, watchfulness, and fruitless fig tree probe lived faith."]},{"refs":"22–24","title":["受難、復活與見證","Passion, resurrection, and witness"],"body":["耶穌在飯桌、客西馬尼、十字架仍顧念他人；婦女與以馬忤斯門徒見證復活。","At meal, Gethsemane, and cross Jesus attends to others; women and Emmaus disciples witness resurrection."]}],"mapIntro":["沿八個段落觀察路加福音的敘事推進與轉折。","Trace the movement of Luke through eight teaching units."],"movements":[{"refs":"1–2","title":["降生與逆轉之歌","Birth and songs of reversal"],"body":["馬利亞、撒迦利亞、西面與亞拿的聲音把孩子放在以色列盼望與萬民之光中。","Mary, Zechariah, Simeon, and Anna place the child within Israel’s hope and light for nations."]},{"refs":"3–4","title":["洗禮、試探與拿撒勒宣言","Baptism, testing, and Nazareth"],"body":["家譜、試探與賽 61 的宣讀共同界定耶穌向窮人和被擄者的使命。","Genealogy, testing, and Isaiah 61 define a mission to poor and captive people."]},{"refs":"5–8","title":["加利利：飯桌、醫治、聆聽","Galilee: table, healing, hearing"],"body":["召門徒、與罪人同桌、平原講論、婦女受醫治與種子比喻並進。","Calling, meals with sinners, the plain sermon, women’s healing, and seed parable unfold."]},{"refs":"9–10","title":["轉向耶路撒冷與差派","Turning to Jerusalem and sending"],"body":["彼得認信、變像後，9:51 決意往耶路撒冷；門徒學習接待與好撒瑪利亞人。","After confession and transfiguration, 9:51 turns toward Jerusalem; disciples learn welcome and neighbor-love."]},{"refs":"11–13","title":["禱告、財富與悔改","Prayer, wealth, and repentance"],"body":["主禱文、無知財主、警醒與不結果無花果樹質問信仰實踐。","The Lord’s Prayer, rich fool, watchfulness, and fruitless fig tree probe lived faith."]},{"refs":"14–17","title":["筵席、失喪者與門徒","Banquets, the lost, and disciples"],"body":["筵席席次、三個失喪比喻、財富故事與十個痲瘋病人挑戰排除。","Banquet seats, lost parables, wealth stories, and ten lepers challenge exclusion."]},{"refs":"18–21","title":["進城與聖殿","Entry and temple"],"body":["寡婦與稅吏、撒該、進城、聖殿辯論和末日教導交錯。","Widow and tax collector, Zacchaeus, entry, temple debates, and future teaching interweave."]},{"refs":"22–24","title":["受難、復活與見證","Passion, resurrection, and witness"],"body":["耶穌在飯桌、客西馬尼、十字架仍顧念他人；婦女與以馬忤斯門徒見證復活。","At meal, Gethsemane, and cross Jesus attends to others; women and Emmaus disciples witness resurrection."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["不要把「路加與使徒行傳相連」說成兩卷所有細節毫無差異；留意各卷敘事節奏與目的。","Luke and Acts are linked, but do not flatten every detail into one undifferentiated account; attend to each volume’s design."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["報喜與馬利亞頌歌","Announcements and Mary’s song"],"summary":["約翰與耶穌的出生預告交錯；馬利亞頌歌宣告卑微者升高。","John’s and Jesus’ birth announcements interweave, and Mary sings of the lowly lifted."],"deep":[["婦女聲音與聖靈在開篇居核心位置。","Women’s voices and the Spirit lead the opening."],["馬利亞頌歌的降卑升高貫穿全卷。","The Magnificat’s reversal runs through the Gospel."]],"caution":["不把馬槽場景浪漫化而忽略低微家庭處境。","Do not romanticize the manger and overlook the family’s vulnerability."],"question":["哪一節最能支持「婦女聲音與聖靈在開篇居核心位置。」的觀察？","Which verse best supports the observation “Women’s voices and the Spirit lead the opening.”?"]},{"n":2,"refs":"2","title":["出生、牧人與聖殿","Birth, shepherds, and temple"],"summary":["耶穌出生時牧人聽好消息；西面與亞拿在聖殿認出盼望，少年耶穌在殿中發問。","Shepherds hear good news; Simeon and Anna recognize hope in the temple; the young Jesus asks questions there."],"deep":[["窮困牧人和年長見證人共同迎接孩子。","Poor shepherds and elder witnesses welcome the child."],["馬利亞頌歌的降卑升高貫穿全卷。","The Magnificat’s reversal runs through the Gospel."]],"caution":["不把馬槽場景浪漫化而忽略低微家庭處境。","Do not romanticize the manger and overlook the family’s vulnerability."],"question":["哪一節最能支持「窮困牧人和年長見證人共同迎接孩子。」的觀察？","Which verse best supports the observation “Poor shepherds and elder witnesses welcome the child.”?"]},{"n":3,"refs":"3","title":["約翰的公義呼召與家譜","John’s justice call and genealogy"],"summary":["約翰要群眾分享衣食、稅吏公正、兵丁不勒索；耶穌受洗，家譜追溯到亞當。","John calls for sharing and fair conduct; Jesus is baptized and the genealogy reaches Adam."],"deep":[["悔改「果子」有具體經濟面向。","Repentance has concrete economic fruit."],["拿撒勒衝突預告好消息跨出熟悉邊界。","Nazareth’s conflict anticipates good news beyond familiar bounds."]],"caution":["不要把對拿撒勒的批判擴大為對猶太人的指責。","Do not extend Nazareth’s dispute to Jews as a people."],"question":["哪一節最能支持「悔改「果子」有具體經濟面向。」的觀察？","Which verse best supports the observation “Repentance has concrete economic fruit.”?"]},{"n":4,"refs":"4","title":["曠野與拿撒勒宣言","Wilderness and Nazareth manifesto"],"summary":["耶穌拒絕試探，在拿撒勒讀出向窮人、被擄者傳好消息；家鄉人反對。","Jesus resists testing and reads good news to the poor and captive at Nazareth, meeting opposition."],"deep":[["以賽亞書宣告為後續事工提供綱領。","Isaiah’s proclamation frames the ministry."],["拿撒勒衝突預告好消息跨出熟悉邊界。","Nazareth’s conflict anticipates good news beyond familiar bounds."]],"caution":["不要把對拿撒勒的批判擴大為對猶太人的指責。","Do not extend Nazareth’s dispute to Jews as a people."],"question":["哪一節最能支持「以賽亞書宣告為後續事工提供綱領。」的觀察？","Which verse best supports the observation “Isaiah’s proclamation frames the ministry.”?"]},{"n":5,"refs":"5","title":["漁夫、痲瘋病人與稅吏","Fishers, leper, and tax collector"],"summary":["魚獲後彼得蒙召，痲瘋病人得醫治、癱子得赦，利未擺設飯桌。","After a great catch Peter is called; a leper and paralytic are restored, and Levi gives a banquet."],"deep":[["飯桌接納延伸醫治與赦罪。","Table welcome extends healing and forgiveness."],["耶穌的權柄以憐憫與接納具體呈現。","Authority appears through mercy and welcome."]],"caution":["醫治敘事不保證所有病人立刻康復。","Healing stories do not promise instant recovery for all."],"question":["哪一節最能支持「飯桌接納延伸醫治與赦罪。」的觀察？","Which verse best supports the observation “Table welcome extends healing and forgiveness.”?"]},{"n":6,"refs":"6","title":["安息日與平原講論","Sabbath and plain sermon"],"summary":["十二使徒蒙選，安息日醫治引爭議；耶穌說貧窮者有福並命人愛仇敵。","The twelve are chosen, Sabbath healing is disputed, and the sermon blesses the poor and calls for enemy-love."],"deep":[["平原講論同時有祝福與對富者的禍哉。","Blessings stand beside woes to the rich."],["耶穌的權柄以憐憫與接納具體呈現。","Authority appears through mercy and welcome."]],"caution":["醫治敘事不保證所有病人立刻康復。","Healing stories do not promise instant recovery for all."],"question":["哪一節最能支持「平原講論同時有祝福與對富者的禍哉。」的觀察？","Which verse best supports the observation “Blessings stand beside woes to the rich.”?"]},{"n":7,"refs":"7","title":["百夫長、寡婦與赦免","Centurion, widow, and forgiveness"],"summary":["耶穌醫治百夫長僕人、使拿因寡婦之子復活，並與受蔑視女子同席。","Jesus heals a centurion’s servant, raises a widow’s son, and shares table space with a scorned woman."],"deep":[["憐憫跨越軍人、寡婦與被羞辱者。","Mercy reaches soldier, widow, and shamed woman."],["耶穌的權柄以憐憫與接納具體呈現。","Authority appears through mercy and welcome."]],"caution":["醫治敘事不保證所有病人立刻康復。","Healing stories do not promise instant recovery for all."],"question":["哪一節最能支持「憐憫跨越軍人、寡婦與被羞辱者。」的觀察？","Which verse best supports the observation “Mercy reaches soldier, widow, and shamed woman.”?"]},{"n":8,"refs":"8","title":["婦女同行與種子比喻","Women accompany and seed parable"],"summary":["婦女供應事工，撒種比喻探聆聽，風浪、鬼與疾病被勝過。","Women support the ministry; the sower probes hearing amid storm, demons, and illness."],"deep":[["同行婦女不是敘事陪襯。","The women are participants, not scenery."],["耶穌的權柄以憐憫與接納具體呈現。","Authority appears through mercy and welcome."]],"caution":["醫治敘事不保證所有病人立刻康復。","Healing stories do not promise instant recovery for all."],"question":["哪一節最能支持「同行婦女不是敘事陪襯。」的觀察？","Which verse best supports the observation “The women are participants, not scenery.”?"]},{"n":9,"refs":"9","title":["認信、變像與轉向","Confession, transfiguration, and turn"],"summary":["十二人被差，五千人得食；彼得認信、變像後，耶穌決意上耶路撒冷。","The twelve are sent and a crowd fed; confession and transfiguration lead to the turn toward Jerusalem."],"deep":[["9:51 是全卷敘事方向的轉捩點。","Luke 9:51 marks a narrative turn."],["好撒瑪利亞人故事改問「誰成為鄰舍」。","The Samaritan story asks who acts as neighbor."]],"caution":["不可把撒瑪利亞人當作「例外好人」來貶低族群。","Do not use the Samaritan as an exception that demeans a group."],"question":["哪一節最能支持「9:51 是全卷敘事方向的轉捩點。」的觀察？","Which verse best supports the observation “Luke 9:51 marks a narrative turn.”?"]},{"n":10,"refs":"10","title":["七十人與好撒瑪利亞人","Seventy and good Samaritan"],"summary":["受差者回來歡喜；耶穌以受傷旅客故事重定鄰舍，並造訪馬大馬利亞。","The sent return; the injured traveler reframes neighbor-love, and Jesus visits Martha and Mary."],"deep":[["鄰舍由實際憐憫定義，不是先由身份界定。","Neighbor is defined by mercy in action."],["好撒瑪利亞人故事改問「誰成為鄰舍」。","The Samaritan story asks who acts as neighbor."]],"caution":["不可把撒瑪利亞人當作「例外好人」來貶低族群。","Do not use the Samaritan as an exception that demeans a group."],"question":["哪一節最能支持「鄰舍由實際憐憫定義，不是先由身份界定。」的觀察？","Which verse best supports the observation “Neighbor is defined by mercy in action.”?"]},{"n":11,"refs":"11","title":["禱告與宗教批判","Prayer and religious critique"],"summary":["主禱文和祈求教導之後，趕鬼爭議及對外潔內污的責備加深。","The Lord’s Prayer and asking teaching lead into exorcism disputes and critique of outward purity."],"deep":[["飯桌前後的內外反差揭露虛假敬虔。","The inside-outside contrast exposes false piety."],["路加把日用糧與財富倫理並置。","Luke places daily bread beside wealth ethics."]],"caution":["偶發災難不可推論受害者特別有罪。","Do not infer that disaster victims are especially sinful."],"question":["哪一節最能支持「飯桌前後的內外反差揭露虛假敬虔。」的觀察？","Which verse best supports the observation “The inside-outside contrast exposes false piety.”?"]},{"n":12,"refs":"12","title":["財富、憂慮與警醒","Wealth, worry, and readiness"],"summary":["無知財主積財不知死期；耶穌勸不要憂慮，卻要分糧並警醒。","A rich fool hoards without knowing life’s span; Jesus teaches trust, sharing, and readiness."],"deep":[["不憂慮之言與「不要只積財」並讀。","Read “do not worry” with the warning against hoarding."],["路加把日用糧與財富倫理並置。","Luke places daily bread beside wealth ethics."]],"caution":["偶發災難不可推論受害者特別有罪。","Do not infer that disaster victims are especially sinful."],"question":["哪一節最能支持「不憂慮之言與「不要只積財」並讀。」的觀察？","Which verse best supports the observation “Read “do not worry” with the warning against hoarding.”?"]},{"n":13,"refs":"13","title":["悔改與不結果的樹","Repentance and unfruitful tree"],"summary":["耶穌拒把遇難者當作特別罪人，說無花果樹仍有回轉時間，安息日醫治女子。","Jesus rejects victim-blame, gives the fruitless tree more time, and heals a woman on Sabbath."],"deep":[["災難不是判定個人罪責的證據。","Disaster does not prove a victim’s special guilt."],["路加把日用糧與財富倫理並置。","Luke places daily bread beside wealth ethics."]],"caution":["偶發災難不可推論受害者特別有罪。","Do not infer that disaster victims are especially sinful."],"question":["哪一節最能支持「災難不是判定個人罪責的證據。」的觀察？","Which verse best supports the observation “Disaster does not prove a victim’s special guilt.”?"]},{"n":14,"refs":"14","title":["宴席的低位與邀請","Low seats and invitation"],"summary":["耶穌在筵席勸取低位，請貧者和殘障者來；大筵席比喻擴展賓客。","Jesus urges low seats and inviting poor and disabled people; a banquet parable widens the table."],"deep":[["群體的筵席座次顯示其價值觀。","Seating reveals communal values."],["15 章的喜樂回應先前對耶穌與罪人同席的抱怨。","Chapter 15’s joy answers complaint about shared meals."]],"caution":["財富比喻不可變成對窮人的責備。","Wealth parables must not blame the poor."],"question":["哪一節最能支持「群體的筵席座次顯示其價值觀。」的觀察？","Which verse best supports the observation “Seating reveals communal values.”?"]},{"n":15,"refs":"15","title":["失羊、失錢、失子","Lost sheep, coin, and sons"],"summary":["耶穌回應與罪人同席的抱怨，用三個失喪故事描繪尋回與歡喜。","Three lost stories answer complaints about meals with sinners, depicting search and joy."],"deep":[["長子的不滿也要放在故事最後聆聽。","The elder son’s resentment remains part of the ending."],["15 章的喜樂回應先前對耶穌與罪人同席的抱怨。","Chapter 15’s joy answers complaint about shared meals."]],"caution":["財富比喻不可變成對窮人的責備。","Wealth parables must not blame the poor."],"question":["哪一節最能支持「長子的不滿也要放在故事最後聆聽。」的觀察？","Which verse best supports the observation “The elder son’s resentment remains part of the ending.”?"]},{"n":16,"refs":"16","title":["管家、財富與拉撒路","Manager, wealth, and Lazarus"],"summary":["不義管家比喻與富人拉撒路故事連成對金錢、忠誠與忽視窮人的質問。","A manager parable and rich man/Lazarus story challenge money, loyalty, and neglect of the poor."],"deep":[["門口的拉撒路不是抽象符號，而是被忽略的人。","Lazarus at the gate is an ignored person."],["15 章的喜樂回應先前對耶穌與罪人同席的抱怨。","Chapter 15’s joy answers complaint about shared meals."]],"caution":["財富比喻不可變成對窮人的責備。","Wealth parables must not blame the poor."],"question":["哪一節最能支持「門口的拉撒路不是抽象符號，而是被忽略的人。」的觀察？","Which verse best supports the observation “Lazarus at the gate is an ignored person.”?"]},{"n":17,"refs":"17","title":["赦免、信心與感謝","Forgiveness, faith, and thanks"],"summary":["耶穌談饒恕與信心，十個痲瘋病人中只有一個撒瑪利亞人回來感謝。","Jesus teaches forgiveness and faith; one Samaritan among ten healed returns to thank."],"deep":[["外人回來感謝，挑戰誰真正看見恩典。","An outsider’s thanks challenges assumptions of belonging."],["15 章的喜樂回應先前對耶穌與罪人同席的抱怨。","Chapter 15’s joy answers complaint about shared meals."]],"caution":["財富比喻不可變成對窮人的責備。","Wealth parables must not blame the poor."],"question":["哪一節最能支持「外人回來感謝，挑戰誰真正看見恩典。」的觀察？","Which verse best supports the observation “An outsider’s thanks challenges assumptions of belonging.”?"]},{"n":18,"refs":"18","title":["寡婦、稅吏與富官","Widow, tax collector, and ruler"],"summary":["恆切寡婦求公義、稅吏求憐憫，孩子被接納，富官難捨財。","A persistent widow seeks justice, a tax collector mercy; children are welcomed and a rich ruler struggles."],"deep":[["求公義、求憐憫與財富問題同時出現。","Justice, mercy, and wealth meet in one chapter."],["撒該的悔改有金錢補償的具體表現。","Zacchaeus’ repentance includes financial restitution."]],"caution":["不要以寡婦奉獻壓迫缺乏資源的人。","Do not pressure the poor using the widow’s gift."],"question":["哪一節最能支持「求公義、求憐憫與財富問題同時出現。」的觀察？","Which verse best supports the observation “Justice, mercy, and wealth meet in one chapter.”?"]},{"n":19,"refs":"19","title":["撒該與進入耶路撒冷","Zacchaeus and entry"],"summary":["撒該以賠償回應被尋回；耶穌進城後為耶路撒冷哭，清理聖殿。","Zacchaeus makes restitution; Jesus enters, weeps over Jerusalem, and challenges temple practice."],"deep":[["失喪者被尋回有可見的社會結果。","Being found has visible social consequences."],["撒該的悔改有金錢補償的具體表現。","Zacchaeus’ repentance includes financial restitution."]],"caution":["不要以寡婦奉獻壓迫缺乏資源的人。","Do not pressure the poor using the widow’s gift."],"question":["哪一節最能支持「失喪者被尋回有可見的社會結果。」的觀察？","Which verse best supports the observation “Being found has visible social consequences.”?"]},{"n":20,"refs":"20","title":["權柄與復活辯論","Authority and resurrection debates"],"summary":["耶穌以葡萄園比喻回應領袖，又回答納稅與復活問題。","Jesus responds with a vineyard parable and debates tax and resurrection."],"deep":[["彼此論辯發生於猶太社群內部。","The debates occur within Jewish communities."],["撒該的悔改有金錢補償的具體表現。","Zacchaeus’ repentance includes financial restitution."]],"caution":["不要以寡婦奉獻壓迫缺乏資源的人。","Do not pressure the poor using the widow’s gift."],"question":["哪一節最能支持「彼此論辯發生於猶太社群內部。」的觀察？","Which verse best supports the observation “The debates occur within Jewish communities.”?"]},{"n":21,"refs":"21","title":["寡婦奉獻與殿的危機","Widow’s gift and temple crisis"],"summary":["耶穌看見寡婦奉獻，旋即預告殿毀、逼迫與警醒。","Jesus notices a widow’s gift, then warns of temple ruin, persecution, and vigilance."],"deep":[["寡婦的缺乏須與 20:47 吞併寡婦房屋連讀。","Read the widow alongside Luke 20:47’s warning about exploitation."],["撒該的悔改有金錢補償的具體表現。","Zacchaeus’ repentance includes financial restitution."]],"caution":["不要以寡婦奉獻壓迫缺乏資源的人。","Do not pressure the poor using the widow’s gift."],"question":["哪一節最能支持「寡婦的缺乏須與 20:47 吞併寡婦房屋連讀。」的觀察？","Which verse best supports the observation “Read the widow alongside Luke 20:47’s warning about exploitation.”?"]},{"n":22,"refs":"22","title":["晚餐與客西馬尼","Meal and Gethsemane"],"summary":["最後晚餐中耶穌談服事與彼得，橄欖山禱告後被捕、彼得否認。","At the final meal Jesus speaks of service and Peter; prayer, arrest, and denial follow."],"deep":[["真正為大者以服事回應爭位。","Greatness is redefined by service."],["復活後門徒由懼怕轉向理解經文與作見證。","After resurrection, fear moves toward understanding Scripture and witness."]],"caution":["勿把群眾或猶太領袖的角色擴成猶太人的集體罪責。","Do not turn particular roles into collective guilt of Jews."],"question":["哪一節最能支持「真正為大者以服事回應爭位。」的觀察？","Which verse best supports the observation “Greatness is redefined by service.”?"]},{"n":23, ld."],"caution":["醫治敘事不保證所有病人立刻康復。","Healing stories do not promise instant recovery for all."]},{"refs":"11–13","title":["禱告、財富與悔改","Prayer, wealth, and repentance"],"body":["主禱文、無知財主、警醒與不結果無花果樹質問信仰實踐。","The Lord’s Prayer, rich fool, watchfulness, and fruitless fig tree probe lived faith."],"caution":["偶發災難不可推論受害者特別有罪。","Do not infer that disaster victims are especially sinful."]},{"refs":"18–21","title":["進城與聖殿","Entry and temple"],"body":["寡婦與稅吏、撒該、進城、聖殿辯論和末日教導交錯。","Widow and tax collector, Zacchaeus, entry, temple debates, and future teaching interweave."],"caution":["不要以寡婦奉獻壓迫缺乏資源的人。","Do not pressure the poor using the widow’s gift."]},{"refs":"22–24","title":["受難、復活與見證","Passion, resurrection, and witness"],"body":["耶穌在飯桌、客西馬尼、十字架仍顧念他人；婦女與以馬忤斯門徒見證復活。","At meal, Gethsemane, and cross Jesus attends to others; women and Emmaus disciples witness resurrection."],"caution":["勿把群眾或猶太領袖的角色擴成猶太人的集體罪責。","Do not turn particular roles into collective guilt of Jews."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["貧富逆轉與醫治敘事須避免責備貧窮者、病人或被排斥者；問耶穌如何恢復他們的尊嚴。","Do not blame the poor, ill, or excluded when teaching reversal and healing; ask how Jesus restores dignity."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–2","title":["第 1 課｜降生與逆轉之歌","Lesson 1 | Birth and songs of reversal"],"aim":["馬利亞、撒迦利亞、西面與亞拿的聲音把孩子放在以色列盼望與萬民之光中。","Mary, Zechariah, Simeon, and Anna place the child within Israel’s hope and light for nations."],"flow":[["讀 1 章：婦女聲音與聖靈在開篇居核心位置。","Read chapter 1: Women’s voices and the Spirit lead the opening."],["對照 1–2 章：馬利亞頌歌的降卑升高貫穿全卷。","Compare chapters 1–2: The Magnificat’s reversal runs through the Gospel."],["討論：哪一節最能支持「窮困牧人和年長見證人共同迎接孩子。」的觀察？","Discuss: Which verse best supports the observation “Poor shepherds and elder witnesses welcome the child.”?"]],"question":["哪一節最能支持「婦女聲音與聖靈在開篇居核心位置。」的觀察？","Which verse best support
