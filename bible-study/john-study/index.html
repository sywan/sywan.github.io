<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="約翰福音成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>約翰福音｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"JHN","category":["四福音","The Four Gospels"],"name":["約翰福音","John"],"subtitle":["21 章以「道成肉身」開篇，透過神蹟、對話和告別講論引向十字架、復活與見證。","Twenty-one chapters begin with the Word made flesh and use signs, conversations, and farewell teaching to reach cross, resurrection, and witness."],"overviewIntro":["先從全書結構掌握約翰福音，再逐章研讀人物、事件與神學判斷。","Survey John as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["21 章；依照書卷原有次序逐章研讀。","21 chapters studied in canonical sequence."],"thesis":["道成肉身，使人看見生命與愛","The Word became flesh to reveal life and love"],"thesisDetail":["約翰安排神蹟與「我是」語句，讓讀者看見耶穌與父的關係；十字架被描寫為榮耀，門徒被召彼此相愛。","Signs and “I am” sayings disclose Jesus’ relation to the Father; the cross is portrayed as glory and disciples are called to love."],"keyQuestion":["約翰福音如何在複雜歷史中呈現忠誠、失敗與盼望？","How does John portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["約翰安排神蹟與「我是」語句，讓讀者看見耶穌與父的關係；十字架被描寫為榮耀，門徒被召彼此相愛。","Signs and “I am” sayings disclose Jesus’ relation to the Father; the cross is portrayed as glory and disciples are called to love."],"finalMovement":["20:30–31 先陳明寫作目的；第 21 章再以彼得的恢復與愛的問答，將見證交給群體。","John 20:30–31 states a purpose, while chapter 21 restores Peter and hands witness to the community."],"readingKeys":[{"refs":"1–2","title":["序言、見證與第一神蹟","Prologue, witnesses, and first sign"],"body":["道成肉身、施洗者見證、門徒被召、迦拿水變酒與聖殿行動開篇。","The Word becomes flesh; witnesses, disciples, Cana, and temple action open the story."]},{"refs":"5–6","title":["醫治、生命之糧與不信","Healing and bread of life"],"body":["畢士大池醫治引起安息日爭論；餵飽群眾後耶穌談真正的糧。","A Bethesda healing sparks Sabbath debate; feeding a crowd leads to bread-of-life teaching."]},{"refs":"11–12","title":["拉撒路、進城與榮耀的時候","Lazarus, entry, and the hour"],"body":["耶穌在墳前哭，拉撒路復活加速反對；進城後談一粒麥子與被舉起。","Jesus weeps at Lazarus’s tomb; the raising sharpens opposition, and entry leads to grain and lifting-up imagery."]},{"refs":"20–21","title":["復活、相信與恢復","Resurrection, believing, restoration"],"body":["馬利亞與門徒遇見復活主；多馬的追問與彼得被重新託付構成結尾。","Mary and disciples meet the risen Jesus; Thomas questions and Peter is recommissioned."]}],"mapIntro":["沿八個段落觀察約翰福音的敘事推進與轉折。","Trace the movement of John through eight teaching units."],"movements":[{"refs":"1–2","title":["序言、見證與第一神蹟","Prologue, witnesses, and first sign"],"body":["道成肉身、施洗者見證、門徒被召、迦拿水變酒與聖殿行動開篇。","The Word becomes flesh; witnesses, disciples, Cana, and temple action open the story."]},{"refs":"3–4","title":["夜間與井旁的對話","Night conversation and well"],"body":["尼哥德慕與撒瑪利亞婦人從不同位置聽見新生與活水。","Nicodemus and a Samaritan woman hear new birth and living water from different positions."]},{"refs":"5–6","title":["醫治、生命之糧與不信","Healing and bread of life"],"body":["畢士大池醫治引起安息日爭論；餵飽群眾後耶穌談真正的糧。","A Bethesda healing sparks Sabbath debate; feeding a crowd leads to bread-of-life teaching."]},{"refs":"7–10","title":["住棚節、光與好牧人","Festival, light, and shepherd"],"body":["節期中的爭論、行淫婦人文本問題、瞎眼者得醫治與牧人講論連結。","Festival debates, the disputed adultery passage, a healed blind man, and shepherd discourse connect."]},{"refs":"11–12","title":["拉撒路、進城與榮耀的時候","Lazarus, entry, and the hour"],"body":["耶穌在墳前哭，拉撒路復活加速反對；進城後談一粒麥子與被舉起。","Jesus weeps at Lazarus’s tomb; the raising sharpens opposition, and entry leads to grain and lifting-up imagery."]},{"refs":"13–17","title":["洗腳與告別講論","Footwashing and farewell teaching"],"body":["耶穌洗腳，講彼此相愛、真葡萄樹、保惠師，最後為門徒祈禱。","Jesus washes feet, teaches love, true vine, the Paraclete, and prays for disciples."]},{"refs":"18–19","title":["審判、十字架與園中墳墓","Trial, cross, and garden tomb"],"body":["彼得不認、彼拉多審問、十字架與安葬以王權與見證語言展開。","Peter denies, Pilate questions, and cross and burial unfold through kingship and testimony."]},{"refs":"20–21","title":["復活、相信與恢復","Resurrection, believing, restoration"],"body":["馬利亞與門徒遇見復活主；多馬的追問與彼得被重新託付構成結尾。","Mary and disciples meet the risen Jesus; Thomas questions and Peter is recommissioned."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["本書多次用「猶太人」指特定領袖或敘事對手；耶穌、門徒與最初群體本身也是猶太人，絕不可作反猶太讀法。","“The Jews” often refers to particular opponents or leaders; Jesus and his first followers were Jewish. Never teach these disputes as anti-Judaism."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["道成肉身與第一批見證人","Word made flesh and first witnesses"],"summary":["序言宣告道、光與生命；施洗者作證，第一批門徒跟隨耶穌。","The prologue announces Word, light, and life; John testifies and first disciples follow."],"deep":[["道「住在」人中是全卷關係主題。","The Word dwelling among people sets the relational theme."],["1:14 的「住在我們中間」與 2 章聖殿問題互相照映。","Dwelling in 1:14 echoes temple questions in chapter 2."]],"caution":["「應驗」與聖殿語言須尊重猶太語境。","Read temple language within Jewish context."],"question":["哪一節最能支持「道「住在」人中是全卷關係主題。」的觀察？","Which verse best supports the observation “The Word dwelling among people sets the relational theme.”?"]},{"n":2,"refs":"2","title":["迦拿與聖殿","Cana and temple"],"summary":["水變酒被稱第一個神蹟；耶穌在聖殿的行動引出身體與新殿意象。","Water becomes wine as a first sign; temple action introduces his body as temple."],"deep":[["神蹟與聖殿都指向身份，不只是奇事。","Sign and temple both point to identity."],["1:14 的「住在我們中間」與 2 章聖殿問題互相照映。","Dwelling in 1:14 echoes temple questions in chapter 2."]],"caution":["「應驗」與聖殿語言須尊重猶太語境。","Read temple language within Jewish context."],"question":["哪一節最能支持「神蹟與聖殿都指向身份，不只是奇事。」的觀察？","Which verse best supports the observation “Sign and temple both point to identity.”?"]},{"n":3,"refs":"3","title":["夜訪與新生","Night visit and new birth"],"summary":["尼哥德慕夜訪耶穌，聽見從上頭生與神愛世人的話；施洗者再作證。","Nicodemus visits at night and hears of birth from above and divine love; John testifies again."],"deep":[["「從上頭」與「再一次」的雙關要留意。","Notice the double sense of birth “from above/again.”"],["夜與正午、私人與公共見證形成對比。","Night/noon and private/public witness contrast."]],"caution":["不要把撒瑪利亞婦人簡化為道德失敗者。","Do not reduce the Samaritan woman to moral failure."],"question":["哪一節最能支持「「從上頭」與「再一次」的雙關要留意。」的觀察？","Which verse best supports the observation “Notice the double sense of birth “from above/again.””?"]},{"n":4,"refs":"4","title":["井旁與活水","At the well and living water"],"summary":["耶穌與撒瑪利亞婦人談水、敬拜與彌賽亞；婦人邀全城來看。","Jesus discusses water, worship, and Messiah with a Samaritan woman, who invites her town."],"deep":[["被視作邊緣者成為見證人。","A marginalized interlocutor becomes a witness."],["夜與正午、私人與公共見證形成對比。","Night/noon and private/public witness contrast."]],"caution":["不要把撒瑪利亞婦人簡化為道德失敗者。","Do not reduce the Samaritan woman to moral failure."],"question":["哪一節最能支持「被視作邊緣者成為見證人。」的觀察？","Which verse best supports the observation “A marginalized interlocutor becomes a witness.”?"]},{"n":5,"refs":"5","title":["安息日醫治與父的工作","Sabbath healing and Father’s work"],"summary":["畢士大池病人得醫治，安息日爭議引出耶穌談父與子的工作和見證。","A Bethesda patient is healed; Sabbath debate leads to teaching on Father, Son, and witnesses."],"deep":[["從一個病人的處境進入神學辯論。","A patient’s situation precedes theological dispute."],["神蹟指向耶穌身份，卻不強迫眾人同意。","Signs point to identity without compelling agreement."]],"caution":["疾病不可被視為本人罪責。","Illness is not proof of personal sin."],"question":["哪一節最能支持「從一個病人的處境進入神學辯論。」的觀察？","Which verse best supports the observation “A patient’s situation precedes theological dispute.”?"]},{"n":6,"refs":"6","title":["餵飽與生命之糧","Feeding and bread of life"],"summary":["五千人得食、水上行走後，耶穌談從天降下的糧；部分門徒離開。","Feeding and walking on water lead to bread-of-life teaching, and some disciples depart."],"deep":[["物質飽足與生命糧的語言相互張力。","Physical bread and life-giving bread remain in tension."],["神蹟指向耶穌身份，卻不強迫眾人同意。","Signs point to identity without compelling agreement."]],"caution":["疾病不可被視為本人罪責。","Illness is not proof of personal sin."],"question":["哪一節最能支持「物質飽足與生命糧的語言相互張力。」的觀察？","Which verse best supports the observation “Physical bread and life-giving bread remain in tension.”?"]},{"n":7,"refs":"7","title":["住棚節中的爭論","Festival disputes"],"summary":["耶穌在住棚節上殿教導，群眾對他從何而來及活水應許爭論。","Jesus teaches at the festival; people debate his origin and living-water promise."],"deep":[["節期背景有助理解活水語言。","Festival setting clarifies living-water imagery."],["9 章的被逐者與 10 章好牧人互相詮釋。","The expelled man in chapter 9 illuminates the shepherd in chapter 10."]],"caution":["7:53–8:11 在早期抄本中位置與收錄有爭議，需說明。","John 7:53–8:11 has important manuscript and placement questions."],"question":["哪一節最能支持「節期背景有助理解活水語言。」的觀察？","Which verse best supports the observation “Festival setting clarifies living-water imagery.”?"]},{"n":8,"refs":"8","title":["光、自由與身份","Light, freedom, and identity"],"summary":["行淫婦人段落有抄本問題；耶穌在持續爭辯中談世界的光、自由與亞伯拉罕。","The adultery passage has textual issues; Jesus speaks of light, freedom, and Abraham in extended dispute."],"deep":[["經文傳抄問題與本章神學爭論要分別說清。","Distinguish textual history from theological dispute."],["9 章的被逐者與 10 章好牧人互相詮釋。","The expelled man in chapter 9 illuminates the shepherd in chapter 10."]],"caution":["7:53–8:11 在早期抄本中位置與收錄有爭議，需說明。","John 7:53–8:11 has important manuscript and placement questions."],"question":["哪一節最能支持「經文傳抄問題與本章神學爭論要分別說清。」的觀察？","Which verse best supports the observation “Distinguish textual history from theological dispute.”?"]},{"n":9,"refs":"9","title":["生來瞎眼者看見","A man born blind sees"],"summary":["耶穌拒絕把瞎眼歸咎本人或父母，醫治後當事人被盤問與逐出。","Jesus rejects sin-blame for congenital blindness; the healed man is interrogated and expelled."],"deep":[["肉眼看見與群體的屬靈盲點對照。","Physical sight contrasts with communal blindness."],["9 章的被逐者與 10 章好牧人互相詮釋。","The expelled man in chapter 9 illuminates the shepherd in chapter 10."]],"caution":["7:53–8:11 在早期抄本中位置與收錄有爭議，需說明。","John 7:53–8:11 has important manuscript and placement questions."],"question":["哪一節最能支持「肉眼看見與群體的屬靈盲點對照。」的觀察？","Which verse best supports the observation “Physical sight contrasts with communal blindness.”?"]},{"n":10,"refs":"10","title":["好牧人與羊","Good shepherd and sheep"],"summary":["耶穌談門、牧人、雇工與羊的聲音；殿中再起身份爭論。","Jesus speaks of gate, shepherd, hired hand, and sheep hearing, amid renewed temple debate."],"deep":[["好牧人願為羊捨命，對比棄羊的雇工。","The shepherd gives life rather than abandoning sheep."],["9 章的被逐者與 10 章好牧人互相詮釋。","The expelled man in chapter 9 illuminates the shepherd in chapter 10."]],"caution":["7:53–8:11 在早期抄本中位置與收錄有爭議，需說明。","John 7:53–8:11 has important manuscript and placement questions."],"question":["哪一節最能支持「好牧人願為羊捨命，對比棄羊的雇工。」的觀察？","Which verse best supports the observation “The shepherd gives life rather than abandoning sheep.”?"]},{"n":11,"refs":"11","title":["拉撒路與耶穌的眼淚","Lazarus and Jesus’ tears"],"summary":["馬大馬利亞哀哭，耶穌也在墳前哭並呼拉撒路出來，領袖決意除掉耶穌。","Martha and Mary grieve; Jesus weeps and calls Lazarus out, prompting a plot."],"deep":[["「我是復活」不取消墳前眼淚。","“I am resurrection” does not erase tears."],["「榮耀的時候」藉失去生命而結果。","The hour of glory bears fruit through self-giving."]],"caution":["勿將馬大馬利亞的哀哭當作缺乏信心。","Do not shame Martha and Mary’s grief."],"question":["哪一節最能支持「「我是復活」不取消墳前眼淚。」的觀察？","Which verse best supports the observation ““I am resurrection” does not erase tears.”?"]},{"n":12,"refs":"12","title":["膏抹、進城與一粒麥子","Anointing, entry, and a grain"],"summary":["馬利亞膏抹，耶穌進城，外邦人求見；一粒麥子死後結果的圖像預告時刻。","Mary anoints, Jesus enters, Greeks seek him, and a dying grain images the coming hour."],"deep":[["榮耀之路不繞過死亡與自我給予。","Glory goes through self-giving and death."],["「榮耀的時候」藉失去生命而結果。","The hour of glory bears fruit through self-giving."]],"caution":["勿將馬大馬利亞的哀哭當作缺乏信心。","Do not shame Martha and Mary’s grief."],"question":["哪一節最能支持「榮耀之路不繞過死亡與自我給予。」的觀察？","Which verse best supports the observation “Glory goes through self-giving and death.”?"]},{"n":13,"refs":"13","title":["洗腳與彼此相愛","Footwashing and love"],"summary":["耶穌洗門徒腳，猶大離席後給彼此相愛的新命令，預告彼得否認。","Jesus washes feet, Judas leaves, a new love command follows, and Peter’s denial is foretold."],"deep":[["洗腳比口號更具體地定義愛。","Footwashing makes love concrete."],["愛的命令以洗腳行動作可見模式。","Footwashing makes the love command visible."]],"caution":["「世界恨你們」不應用作鼓勵敵視外人。","Do not use “the world hates you” to foster hostility."],"question":["哪一節最能支持「洗腳比口號更具體地定義愛。」的觀察？","Which verse best supports the observation “Footwashing makes love concrete.”?"]},{"n":14,"refs":"14","title":["道路、真理與保惠師","Way, truth, and Paraclete"],"summary":["耶穌安慰門徒，談與父的關係、差來的保惠師與所賜平安。","Jesus comforts disciples, speaks of Father and Paraclete, and offers peace."],"deep":[["平安在離別與焦慮情境中宣告。","Peace is promised amid departure and anxiety."],["愛的命令以洗腳行動作可見模式。","Footwashing makes the love command visible."]],"caution":["「世界恨你們」不應用作鼓勵敵視外人。","Do not use “the world hates you” to foster hostility."],"question":["哪一節最能支持「平安在離別與焦慮情境中宣告。」的觀察？","Which verse best supports the observation “Peace is promised amid departure and anxiety.”?"]},{"n":15,"refs":"15","title":["葡萄樹與朋友","Vine and friends"],"summary":["門徒如枝子連於真葡萄樹，耶穌稱他們為朋友並命彼此相愛。","Disciples are branches on the true vine and are called friends who love one another."],"deep":[["結果子由「常在」的關係生出。","Fruit grows from abiding relationship."],["愛的命令以洗腳行動作可見模式。","Footwashing makes the love command visible."]],"caution":["「世界恨你們」不應用作鼓勵敵視外人。","Do not use “the world hates you” to foster hostility."],"question":["哪一節最能支持「結果子由「常在」的關係生出。」的觀察？","Which verse best supports the observation “Fruit grows from abiding relationship.”?"]},{"n":16,"refs":"16","title":["憂愁轉喜樂","Grief into joy"],"summary":["耶穌預告離去、保惠師的工作與門徒暫時憂愁，並勸他們勇敢。","Jesus speaks of departure, the Paraclete, grief turned to joy, and courage."],"deep":[["鼓勵沒有否認門徒即將分散。","Encouragement does not deny impending scattering."],["愛的命令以洗腳行動作可見模式。","Footwashing makes the love command visible."]],"caution":["「世界恨你們」不應用作鼓勵敵視外人。","Do not use “the world hates you” to foster hostility."],"question":["哪一節最能支持「鼓勵沒有否認門徒即將分散。」的觀察？","Which verse best supports the observation “Encouragement does not deny impending scattering.”?"]},{"n":17,"refs":"17","title":["為門徒合一祈禱","Prayer for unity"],"summary":["耶穌為自己、當時門徒及後來相信者祈禱，求他們在真理和愛中合一。","Jesus prays for himself, current disciples, and later believers to be one in truth and love."],"deep":[["合一不是取消真實差異與真理。","Unity need not erase difference or truth."],["愛的命令以洗腳行動作可見模式。","Footwashing makes the love command visible."]],"caution":["「世界恨你們」不應用作鼓勵敵視外人。","Do not use “the world hates you” to foster hostility."],"question":["哪一節最能支持「合一不是取消真實差異與真理。」的觀察？","Which verse best supports the observation “Unity need not erase difference or truth.”?"]},{"n":18,"refs":"18","title":["被捕與彼拉多審問","Arrest and Pilate’s hearing"],"summary":["耶穌主動面對逮捕，彼得否認；彼拉多與耶穌論王權和真理。","Jesus faces arrest, Peter denies, and Pilate questions kingship and truth."],"deep":[["「我的國不屬這世界」先放在暴力與王權對話中。","Read the kingdom statement amid violence and kingship."],["耶穌在十字架上仍照顧母親與門徒。","Jesus cares for mother and disciple from the cross."]],"caution":["絕不可把猶太領袖角色轉成猶太人的集體罪責。","Never assign collective blame to Jewish people."],"question":["哪一節最能支持「「我的國不屬這世界」先放在暴力與王權對話中。」的觀察？","Which verse best supports the observation “Read the kingdom statement amid violence and kingship.”?"]},{"n":19,"refs":"19","title":["十字架、母親與安葬","Cross, mother, and burial"],"summary":["王權標牌與兵丁行動交錯；耶穌將母親託門徒，死後由約瑟尼哥德慕安葬。","A royal inscription and soldiers frame Jesus’ care for his mother and burial by Joseph and Nicodemus."],"deep":[["十字架是受害的現實，也在本卷被描寫為榮耀。","The cross is real harm and, in this Gospel, glory."],["耶穌在十字架上仍照顧母親與門徒。","Jesus cares for mother and disciple from the cross."]],"caution":["絕不可把猶太領袖角色轉成猶太人的集體罪責。","Never assign collective blame to Jewish people."],"question":["哪一節最能支持「十字架是受害的現實，也在本卷被描寫為榮耀。」的觀察？","Which verse best supports the observation “The cross is real harm and, in this Gospel, glory.”?"]},{"n":20,"refs":"20","title":["馬利亞、多馬與寫作目的","Mary, Thomas, and purpose"],"summary":["馬利亞見復活主，門徒得平安，多馬要求看見；作者說記錄神蹟為叫人信。","Mary meets the risen Jesus, disciples receive peace, Thomas seeks sight, and the author states the signs’ purpose."],"deep":[["多馬的求證由耶穌回應，而非被簡單羞辱。","Jesus engages Thomas’ request rather than simply shaming him."],["看見與未看見的信心都藉見證而來。","Seeing and believing are explored through testimony."]],"caution":["不要把多馬當作只因疑問就被排斥的人。","Do not caricature Thomas for asking questions."],"question":["哪一節最能支持「多馬的求證由耶穌回應，而非被簡單羞辱。」的觀察？","Which verse best supports the observation “Jesus engages Thomas’ request rather than simply shaming him.”?"]},{"n":21,"refs":"21","title":["海邊早餐與彼得恢復","Breakfast and Peter restored"],"summary":["七位門徒在海邊遇見耶穌，早餐後彼得三次被問愛並受託牧養。","Seven disciples meet Jesus by the sea; after breakfast Peter is asked three times about love and care."],"deep":[["恢復的彼得被託付照顧羊，而非特權。","Peter’s restoration commissions care rather than privilege."],["看見與未看見的信心都藉見證而來。","Seeing and believing are explored through testimony."]],"caution":["不要把多馬當作只因疑問就被排斥的人。","Do not caricature Thomas for asking questions."],"question":["哪一節最能支持「恢復的彼得被託付照顧羊，而非特權。」的觀察？","Which verse best supports the observation “Peter’s restoration commissions care rather than privilege.”?"]}],"themesIntro":["以下主題由約翰福音的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of John and complement the chapter studies."],"themes":[{"refs":"1–2","title":["序言、見證與第一神蹟","Prologue, witnesses, and first sign"],"body":["道成肉身、施洗者見證、門徒被召、迦拿水變酒與聖殿行動開篇。","The Word becomes flesh; witnesses, disciples, Cana, and temple action open the story."],"caution":["「應驗」與聖殿語言須尊重猶太語境。","Read temple language within Jewish context."]},{"refs":"5–6","title":["醫治、生命之糧與不信","Healing and bread of life"],"body":["畢士大池醫治引起安息日爭論；餵飽群眾後耶穌談真正的糧。","A Bethesda healing sparks Sabbath debate; feeding a crowd leads to bread-of-life teaching."],"caution":["疾病不可被視為本人罪責。","Illness is not proof of personal sin."]},{"refs":"11–12","title":["拉撒路、進城與榮耀的時候","Lazarus, entry, and the hour"],"body":["耶穌在墳前哭，拉撒路復活加速反對；進城後談一粒麥子與被舉起。","Jesus weeps at Lazarus’s tomb; the raising sharpens opposition, and entry leads to grain and lifting-up imagery."],"caution":["勿將馬大馬利亞的哀哭當作缺乏信心。","Do not shame Martha and Mary’s grief."]},{"refs":"18–19","title":["審判、十字架與園中墳墓","Trial, cross, and garden tomb"],"body":["彼得不認、彼拉多審問、十字架與安葬以王權與見證語言展開。","Peter denies, Pilate questions, and cross and burial unfold through kingship and testimony."],"caution":["絕不可把猶太領袖角色轉成猶太人的集體罪責。","Never assign collective blame to Jewish people."]},{"refs":"20–21","title":["復活、相信與恢復","Resurrection, believing, restoration"],"body":["馬利亞與門徒遇見復活主；多馬的追問與彼得被重新託付構成結尾。","Mary and disciples meet the risen Jesus; Thomas questions and Peter is recommissioned."],"caution":["不要把多馬當作只因疑問就被排斥的人。","Do not caricature Thomas for asking questions."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["失明、疾病與傷痛故事不可推為當事人犯罪；9 章已明確拒絕把生來失明歸咎於他或父母。","Do not attribute blindness, illness, or grief to personal sin; chapter 9 explicitly rejects that blame."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–2","title":["第 1 課｜序言、見證與第一神蹟","Lesson 1 | Prologue, witnesses, and first sign"],"aim":["道成肉身、施洗者見證、門徒被召、迦拿水變酒與聖殿行動開篇。","The Word becomes flesh; witnesses, disciples, Cana, and temple action open the story."],"flow":[["讀 1 章：道「住在」人中是全卷關係主題。","Read chapter 1: The Word dwelling among people sets the relational theme."],["對照 1–2 章：1:14 的「住在我們中間」與 2 章聖殿問題互相照映。","Compare chapters 1–2: Dwelling in 1:14 echoes temple questions in chapter 2."],["討論：哪一節最能支持「神蹟與聖殿都指向身份，不只是奇事。」的觀察？","Discuss: Which verse best supports the observation “Sign and temple both point to identity.”?"]],"question":["哪一節最能支持「道「住在」人中是全卷關係主題。」的觀察？","Which verse best supports the observation “The Word dwelling among people sets the relational theme.”?"],"practice":["「應驗」與聖殿語言須尊重猶太語境。","Read temple language within Jewish context."]},{"refs":"3–4","title":["第 2 課｜夜間與井旁的對話","Lesson 2 | Night conversation and well"],"aim":["尼哥德慕與撒瑪利亞婦人從不同位置聽見新生與活水。","Nicodemus and a Samaritan woman hear new birth and living water from different positions."],"flow":[["讀 3 章：「從上頭」與「再一次」的雙關要留意。","Read chapter 3: Notice the double sense of birth “from above/again.”"],["對照 3–4 章：夜與正午、私人與公共見證形成對比。","Compare chapters 3–4: Night/noon and private/public witness contrast."],["討論：哪一節最能支持「被視作邊緣者成為見證人。」的觀察？","Discuss: Which verse best supports the observation “A marginalized interlocutor becomes a witness.”?"]],"question":["哪一節最能支持「「從上頭」與「再一次」的雙關要留意。」的觀察？","Which verse best supports the observation “Notice the double sense of birth “from above/again.””?"],"practice":["不要把撒瑪利亞婦人簡化為道德失敗者。","Do not reduce the Samaritan woman to moral failure."]},{"refs":"5–6","title":["第 3 課｜醫治、生命之糧與不信","Lesson 3 | Healing and bread of life"],"aim":["畢士大池醫治引起安息日爭論；餵飽群眾後耶穌談真正的糧。","A Bethesda healing sparks Sabbath debate; feeding a crowd leads to bread-of-life teaching."],"flow":[["讀 5 章：從一個病人的處境進入神學辯論。","Read chapter 5: A patient’s situation precedes theological dispute."],["對照 5–6 章：神蹟指向耶穌身份，卻不強迫眾人同意。","Compare chapters 5–6: Signs point to identity without compelling agreement."],["討論：哪一節最能支持「物質飽足與生命糧的語言相互張力。」的觀察？","Discuss: Which verse best supports the observation “Physical bread and life-giving bread remain in tension.”?"]],"question":["哪一節最能支持「從一個病人的處境進入神學辯論。」的觀察？","Which verse best supports the observation “A patient’s situation precedes theological dispute.”?"],"practice":["疾病不可被視為本人罪責。","Illness is not proof of personal sin."]},{"refs":"7–10","title":["第 4 課｜住棚節、光與好牧人","Lesson 4 | Festival, light, and shepherd"],"aim":["節期中的爭論、行淫婦人文本問題、瞎眼者得醫治與牧人講論連結。","Festival debates, the disputed adultery passage, a healed blind man, and shepherd discourse connect."],"flow":[["讀 7 章：節期背景有助理解活水語言。","Read
