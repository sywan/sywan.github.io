<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="尼希米記成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>尼希米記｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"NEH","category":["歷史書","Historical Books"],"name":["尼希米記","Nehemiah"],"subtitle":["從城牆重建到律法宣讀與社群改革：13 章問「修好城市」能否等於「修好群體」。","From wall rebuilding to Torah reading and communal reforms: 13 chapters ask whether repairing a city repairs its people."],"overviewIntro":["先從全書結構掌握尼希米記，再逐章研讀人物、事件與神學判斷。","Survey Nehemiah as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["13 章；依照書卷原有次序逐章研讀。","13 chapters studied in canonical sequence."],"thesis":["城牆完成，群體仍需更新","Walls finish; community renewal continues"],"thesisDetail":["尼希米整修防禦，也處理貧困、敬拜與安息日；書尾衝突表明復興仍未完成。","Nehemiah repairs defenses and addresses debt, worship, and Sabbath; the last conflicts show renewal remains unfinished."],"keyQuestion":["尼希米記如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Nehemiah portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["尼希米整修防禦，也處理貧困、敬拜與安息日；書尾衝突表明復興仍未完成。","Nehemiah repairs defenses and addresses debt, worship, and Sabbath; the last conflicts show renewal remains unfinished."],"finalMovement":["尼希米以多次「求你記念我」收尾，並留下對群體持續忠誠的追問。","Nehemiah ends by asking God to remember him, leaving communal faithfulness unresolved."],"readingKeys":[{"refs":"1–2","title":["禱告與差派","Prayer and commission"],"body":["尼希米聽聞城毀，向王請求返回並取得資源。","Nehemiah hears of Jerusalem’s distress and secures permission and resources."]},{"refs":"5–6","title":["內部債務與外部威脅","Debt and external pressure"],"body":["尼希米處理同胞債務，也面對陷阱與恐嚇，城牆終完成。","Nehemiah addresses debt among Judeans and resists plots; the wall is finished."]},{"refs":"8–9","title":["聽律法與認罪","Torah and confession"],"body":["公開宣讀律法、守住棚節，群體回顧歷史並認罪。","Public Torah reading and Booths lead into communal historical confession."]},{"refs":"13","title":["改革與未竟結尾","Reform and unresolved ending"],"body":["尼希米處理殿室、供應、安息日與通婚問題，以祈求神記念收尾。","Nehemiah confronts temple rooms, support, Sabbath, and marriages, ending with a plea to be remembered."]}],"mapIntro":["沿八個段落觀察尼希米記的敘事推進與轉折。","Trace the movement of Nehemiah through eight teaching units."],"movements":[{"refs":"1–2","title":["禱告與差派","Prayer and commission"],"body":["尼希米聽聞城毀，向王請求返回並取得資源。","Nehemiah hears of Jerusalem’s distress and secures permission and resources."]},{"refs":"3–4","title":["城牆與抵抗","Walls and resistance"],"body":["群體分工建造，面對嘲笑與威脅仍繼續。","The community divides work and continues amid ridicule and threats."]},{"refs":"5–6","title":["內部債務與外部威脅","Debt and external pressure"],"body":["尼希米處理同胞債務，也面對陷阱與恐嚇，城牆終完成。","Nehemiah addresses debt among Judeans and resists plots; the wall is finished."]},{"refs":"7","title":["人數與居住","People and settlement"],"body":["城門職分、歸回名單與居住問題被安排。","Gatekeeping, returnee lists, and settlement are addressed."]},{"refs":"8–9","title":["聽律法與認罪","Torah and confession"],"body":["公開宣讀律法、守住棚節，群體回顧歷史並認罪。","Public Torah reading and Booths lead into communal historical confession."]},{"refs":"10–11","title":["立約與安居","Covenant and settlement"],"body":["百姓簽署責任、安排城內居住與敬拜供應。","The people pledge commitments and arrange urban settlement and worship support."]},{"refs":"12","title":["城牆奉獻","Wall dedication"],"body":["祭司與歌者形成兩隊感恩行列，在城牆上會合。","Priests and singers form two thanksgiving processions on the wall."]},{"refs":"13","title":["改革與未竟結尾","Reform and unresolved ending"],"body":["尼希米處理殿室、供應、安息日與通婚問題，以祈求神記念收尾。","Nehemiah confronts temple rooms, support, Sabbath, and marriages, ending with a plea to be remembered."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["《以斯拉—尼希米記》原是一個整體；兩卷並讀可看見聖殿、律法、城牆與群體的連續張力。","Read Ezra and Nehemiah together as a unified work: temple, Torah, walls, and community remain in tension."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["聽見耶路撒冷的消息","News from Jerusalem"],"summary":["尼希米在書珊聽見城牆破損，悲哀禁食，禱告記念神的應許。","In Susa Nehemiah hears of ruined walls, mourns, fasts, and prays in light of God’s promise."],"deep":[["遙遠的居所沒有切斷他對故城居民的責任。","Distance does not end responsibility toward the city’s people."],["禱告與周密規劃在同一故事中並行。","Prayer and practical planning work together."]],"caution":["勿將王的准許當作所有請求都必蒙允的公式。","Do not make royal permission a promise that every request succeeds."],"question":["尼希米的禱告如何結合認罪與盼望？","How does his prayer join confession and hope?"]},{"n":2,"refs":"2","title":["求王准許與夜間察看","Permission and inspection"],"summary":["尼希米向亞達薛西求准返城，獲詔書與木料，夜間察看城牆後召集人。","Nehemiah asks Artaxerxes for leave, letters, and timber, inspects the wall by night, then calls people together."],"deep":[["夜間察看使公開動員有具體事實根據。","Night inspection grounds public mobilization in facts."],["禱告與周密規劃在同一故事中並行。","Prayer and practical planning work together."]],"caution":["勿將王的准許當作所有請求都必蒙允的公式。","Do not make royal permission a promise that every request succeeds."],"question":["行動前尼希米做了哪些準備？","What preparations precede action?"]},{"n":3,"refs":"3","title":["分段修牆的眾人","Many builders, many sections"],"summary":["祭司、家族、工匠與官員負責不同城牆段落，名字與位置相連。","Priests, families, artisans, and officials repair different stretches of wall and gates."],"deep":[["施工名單記念許多人的工作，也顯出合作分工。","The work list remembers many contributors and shared labor."],["名單讓修牆不只是尼希米一人的功勞。","Lists prevent giving Nehemiah sole credit for the wall."]],"caution":["勿把鄰近群體一律當作敵人。","Do not treat every neighbor as an enemy."],"question":["哪些人常被宏大工程故事忽略？","Who is easily overlooked in major project stories?"]},{"n":4,"refs":"4","title":["嘲笑、威脅與防衛","Ridicule, threat, and defense"],"summary":["參巴拉等人嘲笑，後有攻擊威脅；建造者安排守望，仍繼續工作。","Sanballat and others mock; threats grow, so builders organize guards and keep working."],"deep":[["工人既建造又守衛，壓力落在普通家庭身上。","Workers build and guard, burdening ordinary families."],["名單讓修牆不只是尼希米一人的功勞。","Lists prevent giving Nehemiah sole credit for the wall."]],"caution":["勿把鄰近群體一律當作敵人。","Do not treat every neighbor as an enemy."],"question":["威脅如何改變群體工作的方式？","How does threat change the work?"]},{"n":5,"refs":"5","title":["債務與內部壓迫","Debt and internal exploitation"],"summary":["百姓控訴借貸、田產抵押與兒女受奴役；尼希米責備貴胄，要求歸還。","People protest loans, mortgaged fields, and enslaved children; Nehemiah rebukes elites and demands restitution."],"deep":[["修牆不能掩蓋同胞之間的經濟剝削。","Wall building cannot hide exploitation within the community."],["內部經濟不義比外牆缺口更難修補。","Internal economic injustice can be harder to repair than a wall."]],"caution":["勿用工程成功遮蔽被抵押家庭的損失。","Do not let project success conceal harm to indebted families."],"question":["尼希米如何把公義變成具體歸還？","How does Nehemiah make justice concrete through restitution?"]},{"n":6,"refs":"6","title":["詭計、恐嚇與完工","Plots, fear, and completion"],"summary":["反對者邀約、恐嚇與假預言接連而來；尼希米未停工，城牆完成。","Opponents use invitations, threats, and false prophecy; Nehemiah persists and the wall is completed."],"deep":[["辨識建議的來源與目的，是領袖的一部分工作。","Leadership includes discerning the source and aim of advice."],["內部經濟不義比外牆缺口更難修補。","Internal economic injustice can be harder to repair than a wall."]],"caution":["勿用工程成功遮蔽被抵押家庭的損失。","Do not let project success conceal harm to indebted families."],"question":["尼希米如何辨認危險的邀約？","How does Nehemiah discern the trap?"]},{"n":7,"refs":"7","title":["城門與歸回名冊","Gates and returnee register"],"summary":["尼希米設守門者，因城大人少而重看歸回名冊與家譜。","Nehemiah appoints gatekeepers and revisits the returnee register because the city is large but sparsely populated."],"deep":[["城牆完工後，人口與治理仍待安排。","After completion, settlement and governance remain unfinished."],["城牆的用途依賴有人居住、守護與服事。","A wall depends on people who inhabit, guard, and serve."]],"caution":["名單不應取代對未列名者的關心。","Lists should not replace concern for unnamed people."],"question":["為何牆修好還需要名冊？","Why is a register needed after the wall is finished?"]},{"n":8,"refs":"8","title":["律法宣讀與住棚節","Torah reading and Booths"],"summary":["以斯拉向聚集的男女宣讀律法，利未人講解；群體歡樂守住棚節。","Ezra reads Torah to gathered men and women, Levites explain it, and the people celebrate Booths."],"deep":[["明白經文之後，哭泣與歡樂都被引導。","Understanding Scripture shapes both tears and joy."],["理解經文、歡樂守節與承認過犯構成連續回應。","Understanding, celebration, and confession form a sequence."]],"caution":["不要把認罪變成對弱勢者的責怪。","Do not turn confession into blame of vulnerable people."],"question":["講解為何和朗讀同樣重要？","Why is explanation as important as reading?"]},{"n":9,"refs":"9","title":["回顧歷史的認罪","Historical confession"],"summary":["群體回述創造、出埃及、曠野與地土，承認反覆背離及當下困境。","The assembly retells creation, exodus, wilderness, and land while confessing repeated rebellion and present distress."],"deep":[["禱告以歷史作鏡子，不只列出當下的錯誤。","The prayer uses history as a mirror, not merely a list of recent errors."],["理解經文、歡樂守節與承認過犯構成連續回應。","Understanding, celebration, and confession form a sequence."]],"caution":["不要把認罪變成對弱勢者的責怪。","Do not turn confession into blame of vulnerable people."],"question":["歷史回顧如何引出今日責任？","How does historical memory lead to present responsibility?"]},{"n":10,"refs":"10","title":["簽署群體承諾","A signed community pledge"],"summary":["首領、利未人與百姓承諾守律法、安息日與聖殿供應。","Leaders, Levites, and people pledge Torah observance, Sabbath, and support for the temple."],"deep":[["約定包括日常買賣與資源，而非只有宗教口號。","Commitments include trade and resources, not only religious slogans."],["集體承諾需要人口與資源上的實際安排。","Public commitments require practical people and resources."]],"caution":["簽名並不保證未來一定完全遵行。","Signatures do not guarantee perfect future compliance."],"question":["承諾如何落實在日常經濟？","How do pledges shape daily economics?"]},{"n":11,"refs":"11
