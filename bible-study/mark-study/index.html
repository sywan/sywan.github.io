<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="馬可福音成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>馬可福音｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"MRK","category":["四福音","The Four Gospels"],"name":["馬可福音","Mark"],"subtitle":["16 章以急促敘事追問耶穌身份，從加利利走向耶路撒冷、十字架與空墳。","Sixteen brisk chapters ask who Jesus is, moving from Galilee to Jerusalem, the cross, and empty tomb."],"overviewIntro":["先從全書結構掌握馬可福音，再逐章研讀人物、事件與神學判斷。","Survey Mark as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["16 章；依照書卷原有次序逐章研讀。","16 chapters studied in canonical sequence."],"thesis":["被釘十字架者重新定義彌賽亞與門徒","The crucified one redefines Messiah and disciple"],"thesisDetail":["耶穌以權柄醫治和教導，門徒卻反覆不明白；三次預告受難把身份的答案引向服事與十字架。","Jesus heals and teaches with authority while disciples repeatedly misunderstand; three passion predictions direct identity toward service and the cross."],"keyQuestion":["馬可福音如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Mark portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["耶穌以權柄醫治和教導，門徒卻反覆不明白；三次預告受難把身份的答案引向服事與十字架。","Jesus heals and teaches with authority while disciples repeatedly misunderstand; three passion predictions direct identity toward service and the cross."],"finalMovement":["最早可見的結尾在 16:8 停於婦女恐懼和沉默；16:9–20 的較長結尾見於後期抄本，教學需明說。","The earliest recoverable ending stops at 16:8 with fear and silence; the longer 16:9–20 appears in later manuscript tradition and needs explicit notice."],"readingKeys":[{"refs":"1–3","title":["好消息與權柄","Good news and authority"],"body":["開篇宣告福音，耶穌呼召、醫治與爭辯使身份問題升溫。","The gospel opens with calling, healing, and disputes that sharpen the identity question."]},{"refs":"6–8","title":["餅、邊界與認信","Bread, boundaries, and confession"],"body":["差派、餵飽兩群人、潔淨爭議與彼得認信後，十字架首次被明言。","Mission, two feedings, purity disputes, and Peter’s confession lead to the first passion prediction."]},{"refs":"11–12","title":["進城與聖殿爭論","Entry and temple disputes"],"body":["耶穌進耶路撒冷、批判聖殿經濟，與多方辯論誡命和復活。","Jesus enters Jerusalem, critiques temple practice, and debates commands and resurrection."]},{"refs":"16","title":["空墳與抄本結尾","Empty tomb and textual endings"],"body":["婦女見石移開、聽見復活信息；8 節的恐懼結尾與較長結尾要分別閱讀。","Women find the stone moved and hear resurrection news; verse 8 and the later longer ending need distinct treatment."]}],"mapIntro":["沿八個段落觀察馬可福音的敘事推進與轉折。","Trace the movement of Mark through eight teaching units."],"movements":[{"refs":"1–3","title":["好消息與權柄","Good news and authority"],"body":["開篇宣告福音，耶穌呼召、醫治與爭辯使身份問題升溫。","The gospel opens with calling, healing, and disputes that sharpen the identity question."]},{"refs":"4–5","title":["比喻與超越恐懼","Parables and fear"],"body":["種子比喻與風浪、群鬼、疾病和死亡故事並列。","Seed parables stand beside storm, demons, illness, and death."]},{"refs":"6–8","title":["餅、邊界與認信","Bread, boundaries, and confession"],"body":["差派、餵飽兩群人、潔淨爭議與彼得認信後，十字架首次被明言。","Mission, two feedings, purity disputes, and Peter’s confession lead to the first passion prediction."]},{"refs":"9–10","title":["下山與僕人之路","From the mountain to service"],"body":["變像之後的受苦、第二三次受難預告與孩子、富人、巴底買故事相連。","Transfiguration, suffering, repeated passion predictions, children, wealth, and Bartimaeus frame service."]},{"refs":"11–12","title":["進城與聖殿爭論","Entry and temple disputes"],"body":["耶穌進耶路撒冷、批判聖殿經濟，與多方辯論誡命和復活。","Jesus enters Jerusalem, critiques temple practice, and debates commands and resurrection."]},{"refs":"13","title":["橄欖山的警醒","Watchfulness on the Mount of Olives"],"body":["預告聖殿毀壞、患難和人子來臨，反覆勸門徒警醒。","Temple destruction, distress, and coming Son of Man imagery lead to repeated vigilance."]},{"refs":"14–15","title":["被棄絕的王","The rejected king"],"body":["膏抹、晚餐、客西馬尼、逮捕、審判與十字架逐步揭露門徒失敗和耶穌身份。","Anointing, meal, Gethsemane, arrest, trial, and cross expose disciple failure and Jesus’ identity."]},{"refs":"16","title":["空墳與抄本結尾","Empty tomb and textual endings"],"body":["婦女見石移開、聽見復活信息；8 節的恐懼結尾與較長結尾要分別閱讀。","Women find the stone moved and hear resurrection news; verse 8 and the later longer ending need distinct treatment."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["馬可 16:9–20 的抄本差異與其他福音結尾應分開討論；不要把蛇或毒藥段落當作測試信心的命令。","Discuss the textual history of Mark 16:9–20 separately; never treat snake or poison language as a test of faith."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["福音開端與權柄","Beginning and authority"],"summary":["施洗約翰預備道路，耶穌受洗、受試探後呼召門徒、醫治與趕鬼。","John prepares the way; after baptism and testing, Jesus calls, heals, and casts out demons."],"deep":[["故事從一開始就追問耶穌身份與使命。","The opening links identity to mission."],["「立刻」等節奏讓事工緊迫感可見。","Repeated urgency creates narrative momentum."]],"caution":["污鬼認出耶穌不代表讀者已明白其使命。","Demonic recognition does not complete the account of his mission."],"question":["哪一節最能支持「故事從一開始就追問耶穌身份與使命。」的觀察？","Which verse best supports the observation “The opening links identity to mission.”?"]},{"n":2,"refs":"2","title":["赦罪與安息日爭議","Forgiveness and Sabbath disputes"],"summary":["癱子得赦醫治，利未蒙召，禁食與安息日問題使反對增強。","A paralyzed man is forgiven and healed, Levi is called, and fasting and Sabbath disputes grow."],"deep":[["與罪人同席是福音行動，不只是爭辯題。","Table fellowship is an enacted message."],["「立刻」等節奏讓事工緊迫感可見。","Repeated urgency creates narrative momentum."]],"caution":["污鬼認出耶穌不代表讀者已明白其使命。","Demonic recognition does not complete the account of his mission."],"question":["哪一節最能支持「與罪人同席是福音行動，不只是爭辯題。」的觀察？","Which verse best supports the observation “Table fellowship is an enacted message.”?"]},{"n":3,"refs":"3","title":["醫治、十二人與真正家人","Healing, twelve, and family"],"summary":["安息日醫治後敵意加深，耶穌立十二人，親屬與文士質疑其事工。","A Sabbath healing intensifies opposition; twelve are appointed as family and scribes question Jesus."],"deep":[["真正家人的問題由聽從神旨意界定。","Doing God’s will defines the family question."],["「立刻」等節奏讓事工緊迫感可見。","Repeated urgency creates narrative momentum."]],"caution":["污鬼認出耶穌不代表讀者已明白其使命。","Demonic recognition does not complete the account of his mission."],"question":["哪一節最能支持「真正家人的問題由聽從神旨意界定。」的觀察？","Which verse best supports the observation “Doing God’s will defines the family question.”?"]},{"n":4,"refs":"4","title":["種子、聆聽與風浪","Seeds, hearing, and storm"],"summary":["撒種及其他種子比喻探討聆聽，風浪平靜引出門徒的身份疑問。","Seed parables examine hearing; a calmed storm raises the disciples’ question of identity."],"deep":[["理解天國需要聽與等候，不只看壯觀能力。","Understanding the kingdom takes listening and patience."],["問「這到底是誰」推動讀者繼續。","“Who is this?” drives the narrative forward."]],"caution":["醫治故事不可成為病人缺乏信心的指控。","Do not blame sick people for supposed lack of faith."],"question":["哪一節最能支持「理解天國需要聽與等候，不只看壯觀能力。」的觀察？","Which verse best supports the observation “Understanding the kingdom takes listening and patience.”?"]},{"n":5,"refs":"5","title":["被隔離者重回群體","The excluded restored"],"summary":["格拉森人、患血漏婦人與睚魯女兒的故事交織醫治、恐懼與信任。","The Gerasene man, bleeding woman, and Jairus’s daughter join healing, fear, and trust."],"deep":[["女性身體與被排斥者被耶穌看見。","Jesus sees women and excluded people."],["問「這到底是誰」推動讀者繼續。","“Who is this?” drives the narrative forward."]],"caution":["醫治故事不可成為病人缺乏信心的指控。","Do not blame sick people for supposed lack of faith."],"question":["哪一節最能支持「女性身體與被排斥者被耶穌看見。」的觀察？","Which verse best supports the observation “Jesus sees women and excluded people.”?"]},{"n":6,"refs":"6","title":["差派、約翰之死與兩餅故事開端","Mission, John’s death, and bread"],"summary":["十二人受差，約翰被殺；耶穌憐憫群眾、餵飽五千並在水上接近門徒。","The twelve are sent, John is killed, and Jesus feeds a crowd and approaches disciples on water."],"deep":[["希律筵席與耶穌供食形成政治對照。","Herod’s feast contrasts with Jesus’ feeding."],["餅的重複讓門徒遲鈍與群眾需要對照。","Repeated bread scenes contrast disciples’ slowness and crowds’ need."]],"caution":["「法利賽人的酵」不可推成反猶太的標籤。","Do not turn disputes with Pharisees into anti-Jewish labels."],"question":["哪一節最能支持「希律筵席與耶穌供食形成政治對照。」的觀察？","Which verse best supports the observation “Herod’s feast contrasts with Jesus’ feeding.”?"]},{"n":7,"refs":"7","title":["潔淨與外邦人的信心","Purity and Gentile faith"],"summary":["耶穌談污穢出自人心，遇敘利腓尼基婦人，並醫治聾啞者。","Jesus locates defilement within, meets a Syrophoenician woman, and heals a deaf man."],"deep":[["婦人的機智回應推動敘事邊界。","The woman’s reply presses narrative boundaries."],["餅的重複讓門徒遲鈍與群眾需要對照。","Repeated bread scenes contrast disciples’ slowness and crowds’ need."]],"caution":["「法利賽人的酵」不可推成反猶太的標籤。","Do not turn disputes with Pharisees into anti-Jewish labels."],"question":["哪一節最能支持「婦人的機智回應推動敘事邊界。」的觀察？","Which verse best supports the observation “The woman’s reply presses narrative boundaries.”?"]},{"n":8,"refs":"8","title":["第二次餵飽與彼得認信","Second feeding and Peter’s confession"],"summary":["四千人得食，門徒仍不明白餅；彼得認基督，耶穌預告受苦。","Four thousand are fed; disciples miss the bread’s meaning; Peter confesses and Jesus predicts suffering."],"deep":[["認信後立刻需要重新理解彌賽亞。","Confession immediately needs redefinition."],["餅的重複讓門徒遲鈍與群眾需要對照。","Repeated bread scenes contrast disciples’ slowness and crowds’ need."]],"caution":["「法利賽人的酵」不可推成反猶太的標籤。","Do not turn disputes with Pharisees into anti-Jewish labels."],"question":["哪一節最能支持「認信後立刻需要重新理解彌賽亞。」的觀察？","Which verse best supports the observation “Confession immediately needs redefinition.”?"]},{"n":9,"refs":"9","title":["變像與服事小者","Transfiguration and the little one"],"summary":["山上變像後，耶穌醫治孩子，再預告受難，教導接納孩子。","After transfiguration Jesus heals a child, predicts death, and teaches welcome of little ones."],"deep":[["門徒爭大與照顧孩子形成反差。","Ambition contrasts with welcome of a child."],["門徒爭高位與耶穌服事之言互相批判。","The disciples’ ambition is corrected by service."]],"caution":["背十字架不可用作合理化受害。","Cross-bearing must not excuse abuse."],"question":["哪一節最能支持「門徒爭大與照顧孩子形成反差。」的觀察？","Which verse best supports the observation “Ambition contrasts with welcome of a child.”?"]},{"n":10,"refs":"10","title":["財富、權位與巴底買","Wealth, rank, and Bartimaeus"],"summary":["婚姻與孩子、富人的難題、求高位的門徒，最後由巴底買求看見收束。","Marriage, children, wealth, and ambition culminate in Bartimaeus asking for sight."],"deep":[["真正「看見」是跟隨服事之路。","True sight becomes following the path of service."],["門徒爭高位與耶穌服事之言互相批判。","The disciples’ ambition is corrected by service."]],"caution":["背十字架不可用作合理化受害。","Cross-bearing must not excuse abuse."],"question":["哪一節最能支持「真正「看見」是跟隨服事之路。」的觀察？","Which verse best supports the observation “True sight becomes following the path of service.”?"]},{"n":11,"refs":"11","title":["進城、無花果樹與聖殿","Entry, fig tree, and temple"],"summary":["耶穌騎驢進城，無花果樹與聖殿行動相互夾敘，權柄受質疑。","Jesus enters on a colt; fig tree and temple action interlock, and authority is challenged."],"deep":[["夾敘法使無花果樹和殿相互詮釋。","Intercalation lets fig tree and temple interpret each other."],["窮寡婦故事與責備侵吞寡婦房屋的上下文相連。","The widow’s gift follows a warning about devouring widows’ houses."]],"caution":["勿把寡婦奉獻當作要求窮人捐出所有。","Do not use the widow to pressure poor people to give everything."],"question":["哪一節最能支持「夾敘法使無花果樹和殿相互詮釋。」的觀察？","Which verse best supports the observation “Intercalation lets fig tree and temple interpret each other.”?"]},{"n":12,"refs":"12","title":["葡萄園、誡命與寡婦","Vineyard, command, and widow"],"summary":["耶穌以葡萄園比喻責備領袖，又談納稅、復活、愛神愛鄰舍與寡婦奉獻。","Vineyard parable, tax, resurrection, greatest command, and widow’s gift reveal contested authority."],"deep":[["寡婦與吞吃寡婦房屋的警告應連讀。","Read the widow beside the warning about exploiting widows."],["窮寡婦故事與責備侵吞寡婦房屋的上下文相連。","The widow’s gift follows a warning about devouring widows’ houses."]],"caution":["勿把寡婦奉獻當作要求窮人捐出所有。","Do not use the widow to pressure poor people to give everything."],"question":["哪一節最能支持「寡婦與吞吃寡婦房屋的警告應連讀。」的觀察？","Which verse best supports the observation “Read the widow beside the warning about exploiting widows.”?"]},{"n":13,"refs":"13","title":["聖殿危機與警醒","Temple crisis and watchfulness"],"summary":["耶穌預告殿毀、逼迫與人子來臨，要求門徒不要被驚嚇或假消息騙。","Jesus foresees temple destruction, persecution, and coming Son of Man; disciples must watch and resist deception."],"deep":[["「那日那時」不可被算成確定日期。","The unknown day cannot become a firm calculation."],["「你們要謹慎」比計算日期更重要。","The call to watch matters more than dates."]],"caution":["不以戰爭新聞製作精確末日時間表。","Do not turn war news into an exact end-time calendar."],"question":["哪一節最能支持「「那日那時」不可被算成確定日期。」的觀察？","Which verse best supports the observation “The unknown day cannot become a firm calculation.”?"]},{"n":14,"refs":"14","title":["膏抹、晚餐與被捕","Anointing, meal, and arrest"],"summary":["女人預先膏抹，耶穌與門徒共餐、在客西馬尼禱告，最後被捕，彼得不認。","A woman anoints Jesus, the meal and Gethsemane follow, and Peter denies after the arrest."],"deep":[["忠誠女子與失敗門徒的敘事對比。","A faithful woman contrasts with failing disciples."],["百夫長在十字架前的承認回應全書開端。","The centurion’s confession at the cross answers the opening."]],"caution":["處理審判敘事須避免對猶太人的集體罪責。","Do not assign collective guilt to Jews for the trial."],"question":["哪一節最能支持「忠誠女子與失敗門徒的敘事對比。」的觀察？","Which verse best supports the observation “A faithful woman contrasts with failing disciples.”?"]},{"n":15,"refs":"15","title":["十字架與百夫長","Cross and centurion"],"summary":["彼拉多移交耶穌，兵丁嘲弄；耶穌死時百夫長認他為神子，婦女看見安葬。","Pilate hands Jesus over, soldiers mock, a centurion calls him God’s Son at death, and women watch burial."],"deep":[["身份在看似失敗的十字架上被揭露。","Identity is disclosed at apparent defeat."],["百夫長在十字架前的承認回應全書開端。","The centurion’s confession at the cross answers the opening."]],"caution":["處理審判敘事須避免對猶太人的集體罪責。","Do not assign collective guilt to Jews for the trial."],"question":["哪一節最能支持「身份在看似失敗的十字架上被揭露。」的觀察？","Which verse best supports the observation “Identity is disclosed at apparent defeat.”?"]},{"n":16,"refs":"16","title":["空墳、恐懼與較長結尾","Empty tomb and longer ending"],"summary":["婦女在空墳聽見復活消息而害怕；9–20 節較長結尾應另加抄本說明。","Women hear resurrection news at the empty tomb and fear; verses 9–20 require a textual note."],"deep":[["8 節的停頓與較後抄本補充不可混作同一層。","Distinguish the abrupt verse 8 ending from later additions."],["恐懼中的未完成感把回應交到讀者面前。","The unresolved fear invites a readerly response."]],"caution":["16:9–20 的較長結尾有重要抄本問題。","The longer ending of 16:9–20 has substantial manuscript issues."],"question":["哪一節最能支持「8 節的停頓與較後抄本補充不可混作同一層。」的觀察？","Which verse best supports the observation “Distinguish the abrupt verse 8 ending from later additions.”?"]}],"themesIntro":["以下主題由馬可福音的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of Mark and complement the chapter studies."],"themes":[{"refs":"1–3","title":["好消息與權柄","Good news and authority"],"body":["開篇宣告福音，耶穌呼召、醫治與爭辯使身份問題升溫。","The gospel opens with calling, healing, and disputes that sharpen the identity question."],"caution":["污鬼認出耶穌不代表讀者已明白其使命。","Demonic recognition does not complete the account of his mission."]},{"refs":"6–8","title":["餅、邊界與認信","Bread, boundaries, and confession"],"body":["差派、餵飽兩群人、潔淨爭議與彼得認信後，十字架首次被明言。","Mission, two feedings, purity disputes, and Peter’s confession lead to the first passion prediction."],"caution":["「法利賽人的酵」不可推成反猶太的標籤。","Do not turn disputes with Pharisees into anti-Jewish labels."]},{"refs":"11–12","title":["進城與聖殿爭論","Entry and temple disputes"],"body":["耶穌進耶路撒冷、批判聖殿經濟，與多方辯論誡命和復活。","Jesus enters Jerusalem, critiques temple practice, and debates commands and resurrection."],"caution":["勿把寡婦奉獻當作要求窮人捐出所有。","Do not use the widow to pressure poor people to give everything."]},{"refs":"14–15","title":["被棄絕的王","The rejected king"],"body":["膏抹、晚餐、客西馬尼、逮捕、審判與十字架逐步揭露門徒失敗和耶穌身份。","Anointing, meal, Gethsemane, arrest, trial, and cross expose disciple failure and Jesus’ identity."],"caution":["處理審判敘事須避免對猶太人的集體罪責。","Do not assign collective guilt to Jews for the trial."]},{"refs":"16","title":["空墳與抄本結尾","Empty tomb and textual endings"],"body":["婦女見石移開、聽見復活信息；8 節的恐懼結尾與較長結尾要分別閱讀。","Women find the stone moved and hear resurrection news; verse 8 and the later longer ending need distinct treatment."],"caution":["16:9–20 的較長結尾有重要抄本問題。","The longer ending of 16:9–20 has substantial manuscript issues."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["受難道路不是要求受虐者留下受害；耶穌揭露濫權，也讓被忽視者被看見。","The way of the cross does not require abuse victims to remain in harm; Jesus challenges abusive power and sees the overlooked."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–3","title":["第 1 課｜好消息與權柄","Lesson 1 | Good news and authority"],"aim":["開篇宣告福音，耶穌呼召、醫治與爭辯使身份問題升溫。","The gospel opens with calling, healing, and disputes that sharpen the identity question."],"flow":[["讀 1 章：故事從一開始就追問耶穌身份與使命。","Read chapter 1: The opening links identity to mission."],["對照 1–3 章：「立刻」等節奏讓事工緊迫感可見。","Compare chapters 1–3: Repeated urgency creates narrative momentum."],["討論：哪一節最能支持「真正家人的問題由聽從神旨意界定。」的觀察？","Discuss: Which verse best supports the observation “Doing God’s will defines the family question.”?"]],"question":["哪一節最能支持「故事從一開始就追問耶穌身份與使命。」的觀察？","Which verse best supports the observation “The opening links identity to mission.”?"],"practice":["污鬼認出耶穌不代表讀者已明白其使命。","Demonic recognition does not complete the account of his mission."]},{"refs":"4–5","title":["第 2 課｜比喻與超越恐懼","Lesson 2 | Parables and fear"],"aim":["種子比喻與風浪、群鬼、疾病和死亡故事並列。","Seed parables stand beside storm, demons, illness, and death."],"flow":[["讀 4 章：理解天國需要聽與等候，不只看壯觀能力。","Read chapter 4: Understanding the kingdom takes listening and patience."],["對照 4–5 章：問「這到底是誰」推動讀者繼續。","Compare chapters 4–5: “Who is this?” drives the narrative forward."],["討論：哪一節最能支持「女性身體與被排斥者被耶穌看見。」的觀察？","Discuss: Which verse best supports the observation “Jesus sees women and excluded people.”?"]],"question":["哪一節最能支持「理解天國需要聽與等候，不只看壯觀能力。」的觀察？","Which verse best supports the observation “Understanding the kingdom takes listening and patience.”?"],"practice":["醫治故事不可成為病人缺乏信心的指控。","Do not blame sick people for supposed lack of faith."]},{"refs":"6–8","title":["第 3 課｜餅、邊界與認信","Lesson 3 | Bread, boundaries, and confession"],"aim":["差派、餵飽兩群人、潔淨爭議與彼得認信後，十字架首次被明言。","Mission, two feedings, purity disputes, and Peter’s confession lead to the first passion prediction."],"flow":[["讀 6 章：希律筵席與耶穌供食形成政治對照。","Read chapter 6: Herod’s feast contrasts with Jesus’ feeding."],["對照 6–8 章：餅的重複讓門徒遲鈍與群眾需要對照。","Compare chapters 6–8: Repeated bread scenes contrast disciples’ slowness and crowds’ need."],["討論：哪一節最能支持「認信後立刻需要重新理解彌賽亞。」的觀察？","Discuss: Which verse best supports the observation “Confession immediately needs redefinition.”?"]],"question":["哪一節最能支持「希律筵席與耶穌供食形成政治對照。」的觀察？","Which verse best supports the observation “Herod’s feast contrasts with Jesus’ feeding.”?"],"practice":["「法利賽人的酵」不可推成反猶太的標籤。","Do not turn disputes with Pharisees into anti-Jewish labels."]},{"refs":"9–10","title":["第 4 課｜下山與僕人之路","Lesson 4 | From the mountain to service"],"aim":["變像之後的受苦、第二三次受難預告與孩子、富人、巴底買故事相連。","Transfiguration, suffering, repeated passion predictions, children, wealth, and Bartimaeus frame service."],"flow":[["讀 9 章：門徒爭大與照顧孩子形成反差。","Read chapter 9: Ambition contrasts with welcome of a child."],["對照 9–10 章：門徒爭高位與耶穌服事之言互相批判。","Compare chapters 9–10: The disciples’ ambition is corrected by service."],["討論：哪一節最能支持「真正「看見」是跟隨服事之路。」的觀察？","Discuss: Which verse best supports the observation “True sight becomes following the path of service.”?"]],"question":["哪一節最能支持「門徒爭大與照顧孩子形成反差。」的觀察？","Which verse best supports the observation “Ambition contrasts with welcome of a child.”?"],"practice":["背十字架不可用作合理化受害。","Cross-bearing must not excuse abuse."]},{"refs":"11–12","title":["第 5 課｜進城與聖殿爭論","Lesson 5 | Entry and temple disputes"],"aim":["耶穌進耶路撒冷、批判聖殿經濟，與多方辯論誡命和復活。","Jesus enters Jerusalem, critiques temple practice, and debates commands and resurrection."],"flow":[["讀 11 章：夾敘法使無花果樹和殿相互詮釋 節最能支持「忠誠女子與失敗門徒的敘事對比。」的觀察？","Which verse best supports the observation “A faithful woman contrasts with failing disciples.”?"],"practice":["處理審判敘事須避免對猶太人的集體罪責。","Do not assign collective guilt to Jews for the trial."]},{"refs":"16","title":["第 8 課｜空墳與抄本結尾","Lesson 8 | Empty tomb and textual endings"],"aim":["婦女見石移開、聽見復活信息；8 節的恐懼結尾與較長結尾要分別閱讀。","Women find the stone moved and hear resurrection news; verse 8 and the later longer ending need distinct treatment."],"flow":[["讀 16 章：8 節的停頓與較後抄本補充不可混作同一層。","Read chapter 16: Distinguish the abrupt verse 8 ending from later additions."],["對照 16 章：恐懼中的未完成感把回應交到讀者面前。","Compare chapters 16: The unresolved fear invites a readerly response."],["討論：哪一節最能支持「8 節的停頓與較後抄本補充不可混作同一層。」的觀察？","Discuss: Which verse best supports the observation “Distinguish the abrupt verse 8 ending from later additions.”?"]],"question":["哪一節最能支持「8 節的停頓與較後抄本補充不可混作同一層。」的觀察？","Which verse best supports the observation “Distinguish the abrupt verse 8 ending from later additions.”?"],"practice":["16:9–20 的較長結尾有重要抄本問題。","The longer ending of 16:9–20 has substantial manuscript issues."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["馬可福音最常被忽略的人物是誰？為何？","Which character in Mark is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜馬可福音導讀","BibleProject | Mark guide"],"url":"https://bibleproject.com/guides/book-of-mark/"}],"footer":["馬可福音 · 成人主日學教師版 · 請配合完整經文閱讀。","Mark · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src=".
