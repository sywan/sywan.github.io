the tent."]},{"refs":"4–7; 16","title":["罪與修復","Wrongdoing and repair"],"body":["獻祭、承認與補償把罪看成關係與群體的問題。","Offerings, confession, and restitution treat wrong as relational and communal."]},{"refs":"11–15","title":["身體與禮儀","Bodies and ritual"],"body":["暫時不潔不等於道德污點，重返群體也是條例目的。","Temporary impurity is not moral stain; reintegration matters."]},{"refs":"19; 23–25","title":["聖潔中的公義","Justice within holiness"],"body":["愛鄰舍、留穗、安息與土地歸神使敬拜觸及經濟生活。","Neighbor love, gleanings, rest, and divine land ownership bring economics into worship."]}],"mapIntro":["以下分段是教學導覽，章界有助查找，並非每一段論述的天然邊界。","These movements guide study; chapter divisions are useful but do not always mark a natural literary boundary."],"movements":[{"refs":"1–7","title":["祭物與親近","Offerings and approach"],"body":["燔祭、素祭、平安祭、贖罪祭與贖愆祭處理敬拜、感恩和修復。","Five offering types address worship, gratitude, and repair."]},{"refs":"8–10","title":["祭司承接與界線","Priests ordained and bounded"],"body":["公開委任、神的榮光與擅自獻祭的危機並列。","Public ordination, divine glory, and unauthorized worship stand together."]},{"refs":"11–15","title":["潔淨、身體與重返","Purity, bodies, and return"],"body":["飲食、疾病與身體狀態的規定也處理重返群體的路。","Regulations about food and bodies also make room for return to community."]},{"refs":"16–17","title":["贖罪日與生命之血","Atonement and life in blood"],"body":["中心儀式清理聖所並帶走群體罪責。","A central ritual cleanses sacred space and removes communal guilt."]},{"refs":"18–22","title":["聖潔與鄰舍","Holiness and neighbor"],"body":["家庭、性、窮人、寄居者與祭司職責都進入聖潔生活。","Households, sexuality, the poor, immigrants, and priests all enter holy life."]},{"refs":"23–25","title":["節期、安息與土地","Festivals, rest, and land"],"body":["公共時間與土地規範使記念和公義成為群體節奏。","Communal time and land rules weave memory and justice into public rhythm."]},{"refs":"26–27","title":["約的後果與奉獻","Covenant consequences and dedication"],"body":["祝福警告與許願條例以忠誠和實際責任收束。","Blessings, warnings, and vows close with fidelity and concrete responsibility."]}],"mapCaution":{"title":["讀法提醒","Reading caution"],"body":["先觀察敘事與律法在各自的歷史、文學脈絡中如何運作，再進入神學比較與今日應用。","Observe how narrative and instruction work in their historical and literary contexts before drawing theological comparisons or present-day applications."]},"chaptersIntro":["每章有摘要、兩個深入重點、詮釋提醒與課堂提問。章名與分段是本站的研讀提示。","Each chapter has a summary, two close-reading points, an interpretive caution, and a teaching question. Titles and divisions are study aids."],"chapters":[{"n":1,"refs":"1","title":["燔祭與全然獻上","Burnt offering"],"summary":["神從會幕呼召摩西，規定燔祭的祭牲、按手與獻祭程序，開啟親近聖潔神的路。","God calls Moses from the tent and describes the burnt offering, laying on hands, and the ritual approach to holiness."],"deep":[["祭物須無殘疾，顯示敬拜不是隨意處理剩餘物","Unblemished gifts mark deliberate worship"],["不同牲畜選項使不同資源的人可參與","Several animal options allow varied means of participation"]],"caution":["祭祀條例屬古代以色列的敬拜生活；不要把每個禮儀細節直接等同今日實踐。","Sacrificial rules belong to ancient Israel’s worship; do not equate every ritual detail with present practice."],"question":["獻祭程序如何處理人與神之間的距離？","How does the ritual address distance between people and God?"]},{"n":2,"refs":"2","title":["素祭與日常出產","Grain offering"],"summary":["細麵、油、乳香與鹽可作素祭，部分歸祭司，將土地出產帶入敬拜。","Flour, oil, frankincense, and salt form grain offerings; a portion goes to priests, bringing harvest into worship."],"deep":[["素祭不是動物祭的低等替代品","Grain is not an inferior form of worship"],["鹽與不得用酵的規定讓日常食物成為受分別的禮物","Salt and leaven instructions set ordinary food apart"]],"caution":["祭祀條例屬古代以色列的敬拜生活；不要把每個禮儀細節直接等同今日實踐。","Sacrificial rules belong to ancient Israel’s worship; do not equate every ritual detail with present practice."],"question":["日常工作所得如何進入感恩？","How can the fruit of ordinary labor become gratitude?"]},{"n":3,"refs":"3","title":["平安祭與共享","Well-being offering"],"summary":["平安祭規定牲畜與脂油處理，後續章節顯示它也連於共享筵席。","The well-being offering governs animal and fat portions; later instructions connect it with a shared meal."],"deep":[["獻祭的核心不只消除罪，也包括感謝與相交","Offerings include fellowship and thanks, not only wrongdoing"],["血與脂油屬神的限制標示生命尊重","Limits on blood and fat mark respect for life"]],"caution":["祭祀條例屬古代以色列的敬拜生活；不要把每個禮儀細節直接等同今日實踐。","Sacrificial rules belong to ancient Israel’s worship; do not equate every ritual detail with present practice."],"question":["與神和群體相交如何透過飲食表達？","How can a shared meal express fellowship?"]},{"n":4,"refs":"4","title":["誤犯罪與代表責任","Unintentional sin and representation"],"summary":["祭司、全會眾、官長與個人的誤犯有不同程序，顯出職位越高影響越廣。","Unintentional wrongs by priest, community, leader, or individual receive distinct procedures, showing differing social reach."],"deep":[["誤犯仍有後果，意圖不是唯一倫理尺度","Unintended harm still matters"],["領袖的錯誤會牽連群體","Leaders’ failures can affect the whole community"]],"caution":["祭祀條例屬古代以色列的敬拜生活；不要把每個禮儀細節直接等同今日實踐。","Sacrificial rules belong to ancient Israel’s worship; do not equate every ritual detail with present practice."],"question":["若無心造成傷害，責任應如何承擔？","How should unintended harm be addressed?"]},{"n":5,"refs":"5","title":["承認、補償與贖愆","Confession, restitution, and guilt offering"],"summary":["章節列出隱瞞證詞、接觸不潔與錯用聖物；窮人可獻較小祭物，財物過失須補償。","Concealed testimony, impurity, and misuse of holy property are addressed; smaller offerings are allowed for the poor, and property wrongs require restitution."],"deep":[["可負擔的祭物安排避免貧窮阻斷參與","Affordable offerings prevent poverty from excluding people"],["承認與償還使悔改超越內心感受","Confession and restitution make repentance concrete"]],"caution":["祭祀條例屬古代以色列的敬拜生活；不要把每個禮儀細節直接等同今日實踐。","Sacrificial rules belong to ancient Israel’s worship; do not equate every ritual detail with present practice."],"question":["承認錯誤與補償損失為何都重要？","Why do both confession and repair matter?"]},{"n":6,"refs":"6","title":["祭司管理祭壇與祭物","Priestly care of altar and offerings"],"summary":["前章的祭物規定轉向祭司的責任，火要常燒，祭物須按聖別方式處理。","Offering instructions turn to priestly duties; the altar fire is maintained and holy portions handled carefully."],"deep":[["敬拜需要長期而非只靠一時熱情","Worship requires sustained care"],["祭司受益也受規範，權力不能無限制","Priests receive portions under strict limits"]],"caution":["祭祀條例屬古代以色列的敬拜生活；不要把每個禮儀細節直接等同今日實 定自己已無需更新？","Why must ministers acknowledge their own need for renewal?"]},{"n":10,"refs":"10","title":["拿答、亞比戶與界線","Nadab, Abihu, and boundaries"],"summary":["兩位祭司擅獻異火而死亡；摩西論聖俗之分，亞倫對當日祭物另有回應。","Two priests die after unauthorized fire; Moses speaks of sacred boundaries, and Aaron offers his own explanation about that day."],"deep":[["死者與家屬的哀痛不可被儀式語言抹去","Ritual language must not erase grief"],["章末對祭物處置有對話，顯示條文與處境須辨識","The closing exchange shows discernment in context"]],"caution":["祭祀條例屬古代以色列的敬拜生活；不要把每個禮儀細節直接等同今日實踐。","Sacrificial rules belong to ancient Israel’s worship; do not equate every ritual detail with present practice."],"question":["如何嚴肅看待界線又不失去對哀傷者的同理？","How can boundaries be honored with compassion for grief?"]},{"n":11,"refs":"11","title":["潔淨與不潔淨的動物","Clean and unclean animals"],"summary":["食物與接觸屍體的規定，要求以色列在日常飲食中辨別聖俗。","Food and carcass-contact rules train Israel to distinguish categories in daily life."],"deep":[["潔淨分類是古代盟約生活的一部分","Purity categories belong to ancient covenant life"],["不潔不等於動物本身邪惡或人永久低賤","Impurity does not make an animal evil or a person worthless"]],"caution":["禮儀不潔與道德過犯並不相同；不要以身體狀態羞辱人。","Ritual impurity and moral wrong are distinct; do not shame people for bodily conditions."],"question":["日常飲食如何成為群體身分的記號？","How can eating habits mark communal identity?"]},{"n":12,"refs":"12","title":["生育後的潔淨程序","Purification after childbirth"],"summary":["生育後的時間與祭物規定處理禮儀狀態；貧者可獻較小祭物。","Time and offerings after childbirth regulate ritual status, with a provision for those with fewer means."],"deep":[["生育帶來生命，不應被說成道德罪","Childbirth brings life and is not moral sin"],["祭物的彈性顯示經濟差異被考慮","The alternative offering considers poverty"]],"caution":["禮儀不潔與道德過犯並不相同；不要以身體狀態羞辱人。","Ritual impurity and moral wrong are distinct; do not shame people for bodily conditions."],"question":["禮儀不潔與道德過犯如何區分？","How do ritual impurity and moral fault differ?"]},{"n":13,"refs":"13","title":["皮膚病變的辨認","Assessing skin conditions"],"summary":["祭司觀察皮膚、毛髮與擴散情況，延後判斷並設隔離規則。","Priests inspect skin, hair, and spread, sometimes delaying judgment and requiring separation."],"deep":[["古代「大痲瘋」不等同現代漢生病","The ancient term does not equal modern Hansen’s disease"],["反覆察看與暫候可避免倉促判定","Repeated inspection delays hasty decisions"]],"caution":["禮儀不潔與道德過犯並不相同；不要以身體狀態羞辱人。","Ritual impurity and moral wrong are distinct; do not shame people for bodily conditions."],"question":["群體如何在防護與尊嚴間保持平衡？","How can a community balance protection with dignity?"]},{"n":14,"refs":"14","title":["痊癒者重返群體","Restoring a healed person"],"summary":["痊癒者經察驗、洗濯與祭物重返營地；章末也處理房屋中的異狀。","Inspection, washing, and offerings restore a healed person to camp; house conditions are also assessed."],"deep":[["重返群體與辨認疾病同樣重要","Reintegration matters as much as diagnosis"],["經濟能力不同的人有不同祭物選項","Offerings are adjusted to a person’s means"]],"caution":["禮儀不潔與道德過犯並不相同；不要以身體狀態羞辱人。","Ritual impurity and moral wrong are distinct; do not shame people for bodily conditions."],"question":["群體是否把足夠資源用在重返而非只用在隔離？","Does the community invest in return as well as separation?"]},{"n":15,"refs":"15","title":["身體流出物與禮儀狀態","Bodily discharges and ritual status"],"summary":["各種流出物引發暫時不潔與洗濯規定，保護會幕空間的分別。","Bodily discharges involve temporary impurity and washing, guarding the sacred space."],"deep":[["正常生理現象與疾病都被納入禮儀秩序","Ordinary physiology and illness enter ritual order"],["不潔不是人格羞辱或永久污名","Impurity is not a moral insult or permanent stigma"]],"caution":["禮儀不潔與道德過犯並不相同；不要以身體狀態羞辱人。","Ritual impurity and moral wrong are distinct; do not shame people for bodily conditions."],"question":["如何講身體規定而不羞辱人的身體？","How can bodily regulations be taught without shame?"]},{"n":16,"refs":"16","title":["贖罪日的潔淨","Day of Atonement"],"summary":["大祭司一年一次進入至聖所；兩隻山羊象徵會幕潔淨與罪被帶離。","Once a year the high priest enters the inner sanctuary; two goats mark cleansing and the removal of sin."],"deep":[["祭司先處理自身過犯，不能站在群體之外","The priest addresses his own failure first"],["聖所也需潔淨，顯示罪有群體與空間面向","Even the sanctuary is cleansed, linking sin with communal space"]],"caution":["禮儀不潔與道德過犯並不相同；不要以身體狀態羞辱人。","Ritual impurity and moral wrong are distinct; do not shame people for bodily conditions."],"question":["為何罪的處理不只關乎個人內心？","Why does dealing with sin extend beyond inner feelings?"]},{"n":17,"refs":"17","title":["血、生命與獻祭場所","Blood, life, and sacred space"],"summary":["獻祭須在指定處進行，禁食血的理由連於生命屬神。","Sacrifices belong in the designated place, and the blood prohibition is tied to life."],"deep":[["中央獻祭避免任意使用流血儀式","The designated place limits casual blood rites"],["血與生命的關聯使敬拜不輕看生命","Blood’s link to life gives worship moral weight"]],"caution":["禮儀不潔與道德過犯並不相同；不要以身體狀態羞辱人。","Ritual impurity and moral wrong are distinct; do not shame people for bodily conditions."],"question":["敬拜中的生命觀如何影響待人之道？","How should reverence for life shape treatment of people?"]},{"n":18,"refs":"18","title":["親屬界線與土地","Kinship boundaries and land"],"summary":["親屬性關係與其他性行為禁令被列出，章末把群體行為與土地相連。","Prohibitions on kinship relations and other sexual conduct are listed, linking community behavior with the land."],"deep":[["這是古代以色列的盟約法，解讀要辨認文化與法律脈絡","These are ancient covenant laws that require historical context"],["不可用本章羞辱或傷害今日的人","Do not use this chapter to shame or harm people today"]],"caution":["聖潔法需要歷史、文學與倫理辨析；不要用古代刑罰支持今日暴力或歧視。","Holiness laws require historical and ethical discernment; do not use ancient penalties to justify violence or discrimination."],"question":["如何在忠於文本時避免把人變成辯論對象？","How can we read faithfully without making people into debate objects?"]},{"n":19,"refs":"19","title":["愛鄰舍的聖潔","Holiness and neighbor love"],"summary":["「你們要聖潔」貫穿家庭、敬拜、農業、公平與對寄居者的愛。","“Be holy” extends to family, worship, agriculture, fairness, and love for the immigrant."],"deep":[["收割留餘把敬拜與糧食公義相連","Leaving gleanings joins worship with food justice"],["愛鄰舍與愛寄居者並列，不可任意拆開","Neighbor-love and immigrant-love belong together"]],"caution":["聖潔法需要歷史、文學與倫理辨析；不要用古代刑罰支持今日暴力或歧視。","Holiness laws require historical and ethical discernment; do not use ancient penalties to justify violence or discrimination."],"question":["聖潔若包含田邊剩穗，今天會觸及哪些資源？","If holiness includes gleanings, what resources matter today?"]},{"n":20,"refs":"20","title":["刑罰與群體界線","Penalties and community boundaries"],"summary":["針對嚴重違約行為列出刑罰，強調以色列要與周邊習俗有別。","Penalties for serious covenant breaches reinforce Israel’s distinct communal identity."],"deep":[["刑罰屬古代以色列社會制度，不能直接變成今日私刑","Penalties belong to ancient Israel’s institutions, not private violence today"],["讀 19–20 章須同時看鄰舍愛與界線","Read chapters 19–20 together for love and boundary"]],"caution":["聖潔法需要歷史、文學與倫理辨析；不要用古代刑罰支持今日暴力或歧視。","Holiness laws require historical and ethical discernment; do not use ancient penalties to justify violence or discrimination."],"question":["如何區分古代群體法與當代倫理判斷？","How do ancient communal penalties relate to present ethical judgment?"]},{"n":21,"refs":"21","title":["祭司生活的聖別","Priestly life set apart"],"summary":["祭司的喪葬、婚姻與身體條件受到特別規範，顯出職分的代表性。","Priests receive distinct mourning, marriage, and bodily conditions because of their representative role."],"deep":[["不同職分有不同義務，不應變成所有人的標準","Different roles carry different duties"],["身體條件規定不可被拿來貶低身障者的尊嚴","Bodily rules must not demean disabled people"]],"caution":["聖潔法需要歷史、文學與倫理辨析；不要用古代刑罰支持今日暴力或歧視。","Holiness laws require historical and ethical discernment; do not use ancient penalties to justify violence or discrimination."],"question":["代表群體的職分有哪些特殊責任？","What special duties accompany a representative role?"]},{"n":22,"refs":"22","title":["祭司與聖物的處理","Priests and holy portions"],"summary":["祭司在不潔時不可吃聖物，供物須合規；家屬和受雇者資格也被界定。","Priests in impurity must not eat holy portions, and offerings must qualify; household eligibility is defined."],"deep":[["祭司有供應但不能任意取用","Priests are supported but cannot take without limits"],["供物的完整性標示敬拜的慎重","The offering’s integrity marks careful worship"]],"caution":["聖潔法需要歷史、文學與倫理辨析；不要用古代刑罰支持今日暴力或歧視。","Holiness laws require historical and ethical discernment; do not use ancient penalties to justify violence or discrimination."],"question":["供應服事者與限制其權力如何並存？","How do support and accountability coexist?"]},{"n":23,"refs":"23","title":["節期與公共時間","Festivals and communal time"],"summary":["安息日、逾越節、七七節、吹角日、贖罪日與住棚節塑造一年節奏。","Sabbath, Passover, Weeks, Trumpets, Atonement, and Booths shape the year."],"deep":[["節期讓拯救與收成有共同記憶","Festivals join rescue and harvest in shared memory"],["節期表中的留穗規定使慶祝與照顧窮人相連","The gleaning command ties celebration to care for the poor"]],"caution":["土地、節期與許願條例屬古代盟約社會；當代應用須先辨認核心原則。","Land, festival, and vow laws belong to an ancient covenant society; discern principles before application."],"question":["節慶如何避免只讓富足者歡樂？","How can festivals include those with little?"]},{"n":24,"refs":"24","title":["燈、陳設餅與褻瀆事件","Lamp, bread, and a blasphemy case"],"summary":["燈火與餅被持續照料；一場褻瀆爭議引出公義刑罰與寄居者同法的規定。","Lamp and bread receive ongoing care; a blasphemy case leads to rules of judgment and equal law for residents."],"deep":[["日常維護與突發衝突都屬群體聖潔問題","Routine care and crisis judgment both matter"],["刑罰原則有防止報復失控的功能","Penalty limits restrain runaway revenge"]],"caution":["土地、節期與許願條例屬古代盟約社會；當代應用須先辨認核心原則。","Land, festival, and vow laws belong to an ancient covenant society; discern principles before application."],"question":["同一法律適用本地人與寄居者有何意義？","What matters about one law for native and resident alien?"]},{"n":25,"refs":"25","title":["安息年與禧年","Sabbath year and Jubilee"],"summary":["土地休息、債務相關權利與產業贖回規範，提醒土地終屬神，人只是寄居者。","Land rest, property return, and redemption rules declare that the land belongs to God and people are tenants."],"deep":[["安息延伸到土地與受僱者","Rest extends to land and workers"],["「地是我的」限制永久剝奪他人的生計","“The land is mine” limits permanent dispossession"]],"caution":["土地、節期與許願條例屬古代盟約社會；當代應用須先辨認核心原則。","Land, festival, and vow laws belong to an ancient covenant society; discern principles before application."],"question":["土地不是絕對私產，會怎樣改變群體？","How might a community change if land is not absolute private possession?"]},{"n":26,"refs":"26","title":["祝福、警告與記念約","Blessings, warnings, and covenant memory"],"summary":["順服與悖逆的後果以遞進方式鋪陳；即使被擄，神仍說會記念祖先之約。","Blessings and escalating warnings trace covenant consequences; even in exile God says he will remember the ancestral covenant."],"deep":[["集體警告是盟約語言，不可套到每個受苦者身上","Communal warnings are covenant language, not a diagnosis of every sufferer"],["末段的記念約讓審判不是故事最後一句","Remembering the covenant keeps judgment from being final"]],"caution":["土地、節期與許願條例屬古代盟約社會；當代應用須先辨認核心原則。","Land, festival, and vow laws belong to an ancient covenant society; discern principles before application."],"question":["為何警告之後仍要留下「記念」？","Why does remembrance follow the warnings?"]},{"n":27,"refs":"27","title":["許願、估價與奉獻","Vows, valuation, and dedication"],"summary":["結尾規範許願之物、人與土地的估價及贖回，提醒奉獻需誠實且可管理。","The closing chapter regulates vows, valuation, and redemption of persons, land, and goods, making dedication concrete."],"deep":[["估價屬古代祭司制度，不能當人的本質價值","Valuations belong to an ancient ritual system, not human worth"],["衝動許願與實際履行之間需要制度","Vows require accountable follow-through"]],"caution":["土地、節期與許願條例屬古代盟約社會；當代應用須先辨認核心原則。","Land, festival, and vow laws belong to an ancient covenant society; discern principles before application."],"question":["熱心奉獻如何避免傷害自己與家人？","How can zealous giving remain responsible toward family?"]}],"themesIntro":["以下主題橫跨全書；先讀完整經文，再比較各段的不同聲音。","These themes run through the book; read full passages before comparing their distinct voices."],"themes":[{"refs":"1–7; 16","title":["祭物、贖罪與修復","Offerings, atonement, and repair"],"body":["不同祭物並非一種機制的重複，涵蓋感恩、相交與處理過犯。","Distinct offerings address gratitude, fellowship, and wrongdoing."],"caution":["不要把祭物當成可操控神的交易。","Do not present offerings as a way to control God."]},{"refs":"8–10; 21–22","title":["祭司權力與界線","Priestly power and limits"],"body":["祭司代表群體，也受儀式與倫理限制。","Priests represent the people and remain accountable to boundaries."],"caution":["職分尊榮不表示人有更高本質價值。","Office does not confer greater human worth."]},{"refs":"11–15","title":["潔淨與重返","Purity and restoration"],"body":["條例區分狀態並安排潔淨，旨在保護神居所與群體生活。","Rules distinguish states and provide restoration for sacred and communal life."],"caution":["不要把疾病或生育說成道德失敗。","Do not label illness or childbirth moral failure."]},{"refs":"19; 23–25","title":["鄰舍、時間與土地","Neighbor, time, and land"],"body":["留穗、安息與禧年顯出聖潔關乎弱者與資源。","Gleaning, rest, and Jubilee show holiness reaching the vulnerable and resources."],"caution":["古代土地制度不可直接照搬到現代政策。","Ancient land structures cannot be copied uncritically into modern policy."]}],"pastoral":{"title":["教師帶領提醒","Teaching care"],"body":["不要把古代敘事中的暴力、奴役或排斥直接當成今日的規範；讓學員辨認文本描述、神學評價與當代應用的距離。","Do not treat ancient violence, enslavement, or exclusion in narratives as direct present-day norms. Help learners distinguish description, theological evaluation, and application."]},"lessonsIntro":["八課可按班級時數拆分；每課先讀指定經文，再用問題引導觀察、討論與應用。","These eight lessons can be divided further; read the assigned text before observation, discussion, and application."],"lessons":[{"refs":"1–7","title":["第 1 課｜五種祭物","Lesson 1 | Five offerings"],"aim":["區分感恩、相交、過犯與補償的不同祭物。","Distinguish offerings for thanks, fellowship, wrong, and repair."],"flow":[["分組整理 1–3 章祭物的目的。","Sort aims in chapters 1–3. "],["讀 4–5 章，比較不同身分的責任。","Compare responsibility in chapters 4–5. "],["找出 5–7 章的承認與賠償。","Find confession and restitution in chapters 5–7."]],"question":["敬拜如何從心意走到實際修復？","How does worship move from intention to concrete repair?"],"practice":["不把祭物簡化為購買赦免。","Do not reduce sacrifice to buying forgiveness."]},{"refs":"8–10","title":["第 2 課｜祭司、榮光與危機","Lesson 2 | Priests, glory, and crisis"],"aim":["觀察祭司承接職分及其界線。","Observe ordination and limits on priestly power."],"flow":[["讀 8 章，整理公開委任程序。","Chart public ordination in chapter 8. "],["讀 9 章，指出祭司和百姓的角色。","Name priestly and public roles in chapter 9. "],["讀 10 章，討論界線與哀傷。","Discuss boundary and grief in chapter 10."]],"question":["職分如何同時需要尊榮與監督？","How do honor and oversight belong together?"],"practice":["尊重喪親的痛苦。","Treat bereavement with care."]},{"refs":"11–15","title":["第 3 課｜潔淨、身體與重返","Lesson 3 | Purity, bodies, and return"],"aim":["分辨禮儀不潔與道德罪，注意重返群體。","Distinguish ritual impurity from moral wrong and attend to return."],"flow":[["列出 11–15 章所涉及的日常情況。","List everyday situations in chapters 11–15. "],["對照 13 與 14 章的察驗、隔離、復歸。","Compare inspection, separation, and return in chapters 13–14. "],["討論窮人祭物選項。","Discuss affordable offerings."]],"question":["群體如何保護彼此又不污名化人？","How can a community protect without stigmatizing?"],"practice":["古代皮膚病名稱不可等同現代診斷。","Do not equate ancient skin terms with modern diagnosis."]},{"refs":"16–17","title":["第 4 課｜贖罪日與生命","Lesson 4 | Atonement and life"],"aim":["了解贖罪日兩隻山羊與血的象徵。","Understand the two goats and the symbolism of blood."],"flow":[["畫出 16 章祭司進入與離開的路徑。","Trace the priest’s path in chapter 16. "],["比較兩隻山羊的不同作用。","Compare the goats’ roles. "],["讀 17 章，討論生命與血的關聯。","Discuss life and blood in chapter 17."]],"question":["罪如何影響個人以外的群體空間？","How does wrongdoing affect communal space?"],"practice":["不要把儀式當成機械魔法。","Do not treat ritual as mechanical magic."]},{"refs":"18–20","title":["第 5 課｜聖潔與鄰舍","Lesson 5 | Holiness and neighbor"],"aim":["把家庭界線與愛鄰舍放在同一聖潔脈絡。","Read household boundaries and neighbor love together."],"flow":[["辨認 18 章的古代盟約脈絡。","Identify the ancient context of chapter 18. "],["讀 19 章，找出留穗、工價與寄居者。","Find gleaning, wages, and immigrants in chapter 19. "],["讀 20 章，分辨古代刑罰與今日倫理。","Distinguish ancient penalty and ethics in chapter 20."]],"question":["聖潔為何涉及經濟與人際公義？","Why does holiness include economic and social justice?"],"practice":["討論性與刑罰時避免羞辱學員。","Discuss sex and penalties without shaming learners."]},{"refs":"21–22","title":["第 6 課｜祭司的責任","Lesson 6 | Priestly responsibility"],"aim":["看職分尊榮與受約束同時存在。","See priestly honor alongside accountability."],"flow":[["列出祭司與一般人的不同義務。","List duties particular to priests. "],["讀 22 章，追蹤聖物資格與供物品質。","Trace holy portions and gifts in chapter 22. "],["討論身體條件與現代身障尊嚴。","Discuss disability dignity today."]],"question":["如何讓服事者被支持也被監督？","How are ministers supported and accountable?"],"practice":["不可用古代職分規定貶低身障者。","Do not demean disabled people through ancient office rules."]},{"refs":"23–25","title":["第 7 課｜節期、安息與禧年","Lesson 7 | Festivals, rest, and Jubilee"],"aim":["理解公共時間與土地制度的神學。","Understand communal time and land."],"flow":[["畫一年的節期節奏。","Map a year of festivals. "],["對照 23:22 留穗與 25 章土地休息。","Compare gleaning in 23:22 with land rest in 25. "],["討論禧年的理想與實施問題。","Discuss Jubilee’s ideal and implementation questions."]],"question":["誰能參與休息與慶祝？","Who gets to rest and celebrate?"],"practice":["不要把禧年簡化為現代政策口號。","Do not flatten Jubilee into a modern policy slogan."]},{"refs":"26–27","title":["第 8 課｜守約與奉獻","Lesson 8 | Fidelity and dedication"],"aim":["總結警告、記念與負責任的奉獻。","Synthesize warning, remembrance, and responsible giving."],"flow":[["讀 26 章，找出警告的遞進。","Trace escalating warnings in chapter 26. "],["討論 26:40–45 的認罪與記念。","Discuss confession and remembrance in 26:40–45. "],["讀 27 章，思考許願與家人責任。","Read chapter 27 for vows and family duty."]],"question":["在失敗之後，約如何仍保留盼望？","How does covenant retain hope after failure?"],"practice":["不要把病痛直接歸因於個人不順服。","Do not attribute illness directly to personal disobedience."]}],"questionsIntro":["請先讓學員指出經文根據，再討論詮釋與應用；困難經文可以保留開放問題。","Ask learners for textual evidence before interpretation and application; difficult passages may leave open questions."],"extraQuestions":[["禮儀不潔與道德過犯為何不能混為一談？","Why should ritual impurity and moral wrong not be confused?"],["利未記的聖潔如何保護貧者與寄居者？","How does Leviticus’s holiness protect the poor and immigrant?"],["贖罪日與禧年分別處理甚麼問題？","What distinct problems do Atonement and Jubilee address?"]],"sourceNote":["本站提供原創逐章摘要與教學建議，不轉載任何譯本的完整經文。中文經文連結預設新標點和合本（神版），英文預設 NASB 2020。","Original chapter summaries and teaching notes; no complete Bible translation is reproduced. Chinese Scripture links default to CUNP (Shen edition), English to NASB 2020."],"sources":[{"title":["BibleProject｜利未記導讀","BibleProject | Leviticus guide"],"url":"https://bibleproject.com/guides/book-of-leviticus/"},{"title":["耶魯公開課｜舊約導論","Open Yale Courses | Introduction to the Old Testament"],"url":"https://oyc.yale.edu/religious-studies/rlst-145"}],"footer":["利未記研讀 · 原創逐章摘要與成人主日學教師教案","Leviticus study · original chapter notes and adult class plans"],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-1" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
