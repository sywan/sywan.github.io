<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="以賽亞書成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>以賽亞書｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"ISA","category":["先知書","Prophetic Books"],"name":["以賽亞書","Isaiah"],"subtitle":["66 章從耶路撒冷的罪、列國審判走向安慰、僕人與新創造；逐章分辨歷史場景與盼望意象。","Sixty-six chapters move from Jerusalem’s injustice and national judgment to comfort, the servant, and new creation."],"overviewIntro":["先從全書結構掌握以賽亞書，再逐章研讀人物、事件與神學判斷。","Survey Isaiah as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["66 章；依照書卷原有次序逐章研讀。","66 chapters studied in canonical sequence."],"thesis":["審判不能取消更新的應許","Judgment does not cancel renewal"],"thesisDetail":["先知揭露敬拜與不義的矛盾，同時盼望從大衛家、僕人與更新的錫安流向萬民的公義。","The prophet exposes worship without justice while envisioning a Davidic ruler, servant, and renewed Zion bringing justice to nations."],"keyQuestion":["以賽亞書如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Isaiah portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["先知揭露敬拜與不義的矛盾，同時盼望從大衛家、僕人與更新的錫安流向萬民的公義。","The prophet exposes worship without justice while envisioning a Davidic ruler, servant, and renewed Zion bringing justice to nations."],"finalMovement":["結尾讓萬國前來敬拜，也保留審判的嚴肅；新創造不是忽略地上不義。","The ending joins worship by nations with serious judgment; new creation does not overlook injustice."],"readingKeys":[{"refs":"1–12","title":["耶路撒冷與盼望的王","Jerusalem and hoped-for king"],"body":["罪與敬拜失序被揭露；呼召、亞哈斯危機與大衛家盼望並進。","Injustice, prophetic call, Ahaz’s crisis, and Davidic hope unfold together."]},{"refs":"24–35","title":["世界審判與荒漠開花","Judgment and blooming wilderness"],"body":["審判、筵席、歌唱、錯誤聯盟與醫治的道路交錯。","Judgment, feast, song, failed alliances, and a healing highway interweave."]},{"refs":"40–48","title":["安慰、創造主與歸回","Comfort, Creator, and return"],"body":["流亡者得安慰，偶像受質疑，古列被提名作釋放工具。","Exiles hear comfort, idols are challenged, and Cyrus is named as an agent of release."]},{"refs":"60–66","title":["新錫安與新創造","New Zion and creation"],"body":["光照萬國、受膏者宣告、群體祈禱與新天新地構成結尾。","Light for nations, anointed proclamation, communal prayer, and new heavens and earth close the book."]}],"mapIntro":["沿八個段落觀察以賽亞書的敘事推進與轉折。","Trace the movement of Isaiah through eight teaching units."],"movements":[{"refs":"1–12","title":["耶路撒冷與盼望的王","Jerusalem and hoped-for king"],"body":["罪與敬拜失序被揭露；呼召、亞哈斯危機與大衛家盼望並進。","Injustice, prophetic call, Ahaz’s crisis, and Davidic hope unfold together."]},{"refs":"13–23","title":["列國的諭言","Oracles concerning nations"],"body":["巴比倫、摩押、埃及、推羅等受檢視；驕傲與脆弱並陳。","Babylon, Moab, Egypt, Tyre, and others face scrutiny of pride and fragility."]},{"refs":"24–35","title":["世界審判與荒漠開花","Judgment and blooming wilderness"],"body":["審判、筵席、歌唱、錯誤聯盟與醫治的道路交錯。","Judgment, feast, song, failed alliances, and a healing highway interweave."]},{"refs":"36–39","title":["希西家敘事橋梁","Hezekiah as narrative bridge"],"body":["亞述圍城、禱告、病癒與巴比倫使者連接前後兩大段。","Assyrian siege, prayer, healing, and Babylonian envoys bridge the book’s halves."]},{"refs":"40–48","title":["安慰、創造主與歸回","Comfort, Creator, and return"],"body":["流亡者得安慰，偶像受質疑，古列被提名作釋放工具。","Exiles hear comfort, idols are challenged, and Cyrus is named as an agent of release."]},{"refs":"49–55","title":["僕人與新的盟約邀請","Servant and covenant invitation"],"body":["僕人的使命、拒絕與受苦，以及錫安的更新和免費筵席相連。","The servant’s mission, rejection, suffering, Zion’s renewal, and free invitation belong together."]},{"refs":"56–59","title":["敬拜與公義","Worship and justice"],"body":["外邦人、太監、禁食者與受欺壓者進入群體更新的討論。","Foreigners, eunuchs, fasters, and oppressed people enter the renewal debate."]},{"refs":"60–66","title":["新錫安與新創造","New Zion and creation"],"body":["光照萬國、受膏者宣告、群體祈禱與新天新地構成結尾。","Light for nations, anointed proclamation, communal prayer, and new heavens and earth close the book."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["本書跨越不同歷史視野與詩歌體裁；不把每段都硬塞進單一年代，亦不把基督教後來的讀法取代原初語境。","The book spans historical horizons and poetic genres; avoid forcing every oracle into one date or replacing its first context with later Christian readings."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["悖逆與真正敬拜","Rebellion and true worship"],"summary":["先知控訴獻祭與血污並存，呼籲止惡行善、為孤兒寡婦伸冤。","The prophet condemns ritual joined to bloodshed and calls for justice for orphans and widows."],"deep":[["敬拜的真假由對弱者的公義接受檢驗。","Worship is tested by justice toward vulnerable people."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「敬拜的真假由對弱者的公義接受檢驗。」的觀察？","Which verse best supports the observation “Worship is tested by justice toward vulnerable people.”?"]},{"n":2,"refs":"2","title":["錫安的山與人的驕傲","Zion’s mountain and human pride"],"summary":["萬民流向受教的錫安，刀劍改為農具；同章也審視人的自高。","Nations seek instruction at Zion and swords become tools; human pride is judged."],"deep":[["和平異象與對驕傲的批判不可拆開。","The peace vision belongs with critique of pride."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「和平異象與對驕傲的批判不可拆開。」的觀察？","Which verse best supports the observation “The peace vision belongs with critique of pride.”?"]},{"n":3,"refs":"3","title":["領袖失職與壓迫","Failed leaders and oppression"],"summary":["耶路撒冷的支柱被移除，領袖欺壓窮人，虛榮的社會秩序受審。","Jerusalem’s supports fail as leaders oppress poor people and social vanity is exposed."],"deep":[["上層決策的代價落在貧窮者身上。","The poor bear the cost of elite decisions."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「上層決策的代價落在貧窮者身上。」的觀察？","Which verse best supports the observation “The poor bear the cost of elite decisions.”?"]},{"n":4,"refs":"4","title":["錫安餘民與潔淨","Zion’s remnant and cleansing"],"summary":["短詩描述審判後存留者、榮耀與遮蔽的雲火。","A short oracle pictures survivors, glory, and sheltering cloud and fire after cleansing."],"deep":[["盼望不是否認第三章的傷害，而在其後提出更新。","Hope follows rather than denies chapter 3’s harm."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「盼望不是否認第三章的傷害，而在其後提出更新。」的觀察？","Which verse best supports the observation “Hope follows rather than denies chapter 3’s harm.”?"]},{"n":5,"refs":"5","title":["葡萄園之歌","Song of the vineyard"],"summary":["神栽葡萄園卻得野葡萄；六個禍哉揭露貪地、醉酒與顛倒是非。","God’s vineyard yields bad fruit; woes expose land-grabbing, drunkenness, and moral reversal."],"deep":[["所期待的果子是公平公義，不只宗教熱情。","The desired fruit is justice, not merely zeal."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「所期待的果子是公平公義，不只宗教熱情。」的觀察？","Which verse best supports the observation “The desired fruit is justice, not merely zeal.”?"]},{"n":6,"refs":"6","title":["聖殿異象與先知蒙召","Temple vision and call"],"summary":["以賽亞見聖潔之主、承認污穢，炭火潔淨後受差，使命卻艱難。","Isaiah sees the Holy One, confesses, is cleansed by coal, and receives a hard commission."],"deep":[["蒙召並不保證聽眾立刻悔改。","A calling does not ensure immediate repentance."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「蒙召並不保證聽眾立刻悔改。」的觀察？","Which verse best supports the observation “A calling does not ensure immediate repentance.”?"]},{"n":7,"refs":"7","title":["亞哈斯與以馬內利","Ahaz and Immanuel"],"summary":["面對聯軍，先知勸亞哈斯信靠並提出以馬內利記號，王卻以政治策略回應。","Facing a coalition, Ahaz hears a call to trust and an Immanuel sign but pursues political strategy."],"deep":[["記號首先對當時危機中的王說話。","The sign first addresses a king in a present crisis."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「記號首先對當時危機中的王說話。」的觀察？","Which verse best supports the observation “The sign first addresses a king in a present crisis.”?"]},{"n":8,"refs":"8","title":["亞述洪水與微光","Assyrian flood and a glimmer"],"summary":["亞述如氾濫大水，先知卻受命等候，黑暗中仍有尋求的方向。","Assyria surges like floodwater; the prophet waits amid fear and darkness."],"deep":[["洪水意象揭示求援對象也可能變成威脅。","A sought ally can become a floodlike threat."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「洪水意象揭示求援對象也可能變成威脅。」的觀察？","Which verse best supports the observation “A sought ally can become a floodlike threat.”?"]},{"n":9,"refs":"9","title":["黑暗中的光與和平之子","Light and a child of peace"],"summary":["受壓之地見大光，孩子帶來公義盼望；後段仍重述審判。","An oppressed land sees light and a child of just rule, while judgment refrains return."],"deep":[["盼望的王須以公平公義治理。","The hoped-for ruler is defined by justice."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「盼望的王須以公平公義治理。」的觀察？","Which verse best supports the observation “The hoped-for ruler is defined by justice.”?"]},{"n":10,"refs":"10","title":["亞述之杖與餘民","Assyria as rod and the remnant"],"summary":["亞述被稱為工具，卻因傲慢受審；砍倒後仍有餘民歸回。","Assyria is used as a rod yet judged for arrogance; a remnant returns after cutting down."],"deep":[["作為工具不使帝國免於自身暴力的責任。","Being an instrument does not excuse imperial violence."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「作為工具不使帝國免於自身暴力的責任。」的觀察？","Which verse best supports the observation “Being an instrument does not excuse imperial violence.”?"]},{"n":11,"refs":"11","title":["耶西的枝與受造界和好","Shoot of Jesse and peace"],"summary":["耶西本生的枝以公義審判，狼與羊等動物圖像描繪和平。","A shoot from Jesse judges with justice; animal imagery pictures peace."],"deep":[["和平從不欺壓窮人的治理開始。","Peace begins with rule that does not oppress poor people."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「和平從不欺壓窮人的治理開始。」的觀察？","Which verse best supports the observation “Peace begins with rule that does not oppress poor people.”?"]},{"n":12,"refs":"12","title":["得救之歌","Song of salvation"],"summary":["短歌呼召人從救恩泉源取水、在萬民中傳揚神的作為。","A brief song calls people to draw water from salvation and proclaim God’s deeds among nations."],"deep":[["前段審判與盼望在讚美中得到回應。","Praise responds to earlier judgment and hope."],["第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Justice in chapter 1 anticipates the just ruler of chapter 11."]],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."],"question":["哪一節最能支持「前段審判與盼望在讚美中得到回應。」的觀察？","Which verse best supports the observation “Praise responds to earlier judgment and hope.”?"]},{"n":13,"refs":"13","title":["巴比倫的日子","Babylon’s day"],"summary":["對巴比倫的諭言描寫帝國傾覆，使用震動天地的詩歌語言。","An oracle of Babylon’s fall uses cosmic poetic imagery."],"deep":[["震動天地表達權力崩塌，不應機械化成天文預報。","Cosmic shaking is poetic judgment, not an astronomy forecast."],["列國不是陪襯；先知的倫理視野跨越猶大。","The nations are not scenery; prophetic ethics reaches beyond Judah."]],"caution":["不可把古代國名直接等同當代民族。","Do not identify ancient nations directly with modern peoples."],"question":["哪一節最能支持「震動天地表達權力崩塌，不應機械化成天文預報。」的觀察？","Which verse best supports the observation “Cosmic shaking is poetic judgment, not an astronomy forecast.”?"]},{"n":14,"refs":"14","title":["暴君的哀歌","Taunt over a tyrant"],"summary":["從被壓迫者的安息轉向對巴比倫王的諷刺，後有亞述與非利士諭言。","The oppressed find rest as a taunt mocks Babylon’s king; Assyria and Philistia also appear."],"deep":[["「晨星」首先在嘲諷地上暴君的詩歌中。","The “morning star” first belongs to a taunt of an earthly tyrant."],["列國不是陪襯；先知的倫理視野跨越猶大。","The nations are not scenery; prophetic ethics reaches beyond Judah."]],"caution":["不可把古代國名直接等同當代民族。","Do not identify ancient nations directly with modern peoples."],"question":["哪一節最能支持「「晨星」首先在嘲諷地上暴君的詩歌中。」的觀察？","Which verse best supports the observation “The “morning star” first belongs to a taunt of an earthly tyrant.”?"]},{"n":15,"refs":"15","title":["摩押的哀哭","Moab’s lament"],"summary":["摩押城邑逃難哭泣，先知細述崩潰與流離。","Moab’s towns wail, flee, and grieve through collapse."],"deep":[["審判諭言仍讓讀者聽見敵國的痛。","A judgment oracle still lets us hear an enemy nation’s pain."],["列國不是陪襯；先知的倫理視野跨越猶大。","The nations are not scenery; prophetic ethics reaches beyond Judah."]],"caution":["不可把古代國名直接等同當代民族。","Do not identify ancient nations directly with modern peoples."],"question":["哪一節最能支持「審判諭言仍讓讀者聽見敵國的痛。」的觀察？","Which verse best supports the observation “A judgment oracle still lets us hear an enemy nation’s pain.”?"]},{"n":16,"refs":"16","title" l together."],"deep":[["被審的國也能被稱為神的百姓。","A judged nation can still be called God’s people."],["列國不是陪襯；先知的倫理視野跨越猶大。","The nations are not scenery; prophetic ethics reaches beyond Judah."]],"caution":["不可把古代國名直接等同當代民族。","Do not identify ancient nations directly with modern peoples."],"question":["哪一節最能支持「被審的國也能被稱為神的百姓。」的觀察？","Which verse best supports the observation “A judged nation can still be called God’s people.”?"]},{"n":20,"refs":"20","title":["先知赤腳作記號","Barefoot prophetic sign"],"summary":["以賽亞以赤腳的象徵行動警告猶大不要倚賴埃及與古實。","Isaiah’s barefoot sign warns Judah against reliance on Egypt and Cush."],"deep":[["先知的身體承擔政治訊息的代價。","The prophet’s body bears the cost of a political message."],["列國不是陪襯；先知的倫理視野跨越猶大。","The nations are not scenery; prophetic ethics reaches beyond Judah."]],"caution":["不可把古代國名直接等同當代民族。","Do not identify ancient nations directly with modern peoples."],"question":["哪一節最能支持「先知的身體承擔政治訊息的代價。」的觀察？","Which verse best supports the observation “The prophet’s body bears the cost of a political message.”?"]},{"n":21,"refs":"21","title":["曠野與守望者","Wilderness and watchman"],"summary":["對巴比倫、以東與阿拉伯的短諭言借守望者傳達夜中的消息。","Short oracles on Babylon, Edom, and Arabia use watchmen reporting through the night."],"deep":[["等待消息的緊張感比帝國必勝的自信更突出。","Anxious watchfulness replaces imperial certainty."],["列國不是陪襯；先知的倫理視野跨越猶大。","The nations are not scenery; prophetic ethics reaches beyond Judah."]],"caution":["不可把古代國名直接等同當代民族。","Do not identify ancient nations directly with modern peoples."],"question":["哪一節最能支持「等待消息的緊張感比帝國必勝的自信更突出。」的觀察？","Which verse best supports the observation “Anxious watchfulness replaces imperial certainty.”?"]},{"n":22,"refs":"22","title":["異象谷與舍伯那","Valley of vision and Shebna"],"summary":["耶路撒冷在危機中修防禦卻不仰望神，舍伯那的自我紀念也受責。","Jerusalem repairs defenses without seeking God; Shebna’s self-monument is rebuked."],"deep":[["技術準備與敬拜責任不必互斥，問題在自恃。","Practical defense and trust need not be opposites; self-reliance is questioned."],["列國不是陪襯；先知的倫理視野跨越猶大。","The nations are observation “Poetic wasteland imagery cannot fuel modern ethnic hatred.”?"]},{"n":35,"refs":"35","title":["曠野開花與聖路","Desert blooms and holy way"],"summary":["曠野歡喜開花，軟弱者得鼓勵，得贖者走上回錫安的路。","The wilderness blooms, weak hands are strengthened, and the redeemed return to Zion."],"deep":[["盼望涉及身體、土地與安全通行。","Hope concerns bodies, land, and safe passage."],["第 25 章的筵席與第 35 章的歸回讓審判不是最後一句。","The feast of chapter 25 and return of chapter 35 prevent judgment from being the last word."]],"caution":["詩歌中的審判圖像不應變成對今日受害者的詛咒。","Do not weaponize poetic judgment against today’s sufferers."],"question":["哪一節最能支持「盼望涉及身體、土地與安全通行。」的觀察？","Which verse best supports the observation “Hope concerns bodies, land, and safe passage.”?"]},{"n":36,"refs":"36","title":["拉伯沙基的話術","Rabshakeh’s rhetoric"],"summary":["亞述使者向城中人喊話，企圖瓦解希西家與百姓的信任。","Assyria’s envoy addresses the city to undermine Hezekiah and the people’s trust."],"deep":[["圍城也透過語言操控恐懼。","Siege warfare also manipulates fear through speech."],["亞述危機得解並不保證巴比倫危機不會來。","Relief from Assyria does not prevent the Babylonian crisis."]],"caution":["個別得救故事不可當作對所有戰爭受害者的保證。","A particular deliverance is no universal war-time guarantee."],"question":["哪一節最能支持「圍城也透過語言操控恐懼。」的觀察？","Which verse best supports the observation “Siege warfare also manipulates fear through speech.”?"]},{"n":37,"refs":"37","title":["希西家的禱告","Hezekiah’s prayer"],"summary":["王在危機中求神，以賽亞傳達回應；亞述軍撤離。","The king prays, Isaiah responds, and Assyrian forces withdraw."],"deep":[["得救故事不能被套成任何危機都必有同樣結局。","This rescue is no universal guarantee in every crisis."],["亞述危機得解並不保證巴比倫危機不會來。","Relief from Assyria does not prevent the Babylonian crisis."]],"caution":["個別得救故事不可當作對所有戰爭受害者的保證。","A particular deliverance is no universal war-time guarantee."],"question":["哪一節最能支持「得救故事不能被套成任何危機都必有同樣結局。」的觀察？","Which verse best supports the observation “This rescue is no universal guarantee in every crisis.”?"]},{"n":38,"refs":"38","title":["病癒與感恩詩","Illness and thanksgiving song"],"summary":["希西家病危得醫治，寫詩談死亡恐懼與仍能讚美的生命。","Hezekiah recovers from mortal illness and sings of fear and renewed praise."],"deep":[["王的祈禱先承認脆弱，而非只有勝利。","The king’s prayer admits fragility before triumph."],["亞述危機得解並不保證巴比倫危機不會來。","Relief from Assyria does not prevent the Babylonian crisis."]],"caution":["個別得救故事不可當作對所有戰爭受害者的保證。","A particular deliverance is no universal war-time guarantee."],"question":["哪一節最能支持「王的祈禱先承認脆弱，而非只有勝利。」的觀察？","Which verse best supports the observation “The king’s prayer admits fragility before triumph.”?"]},{"n":39,"refs":"39","title":["巴比倫使者與預告","Babylonian envoys and warning"],"summary":["希西家向使者展示財寶，先知預告將來被擄至巴比倫。","Hezekiah shows treasures to Babylonian envoys; Isaiah warns of future exile."],"deep":[["前半卷以得救後的自滿與未來流亡作橋。","Complacency after rescue bridges toward coming exile."],["亞述危機得解並不保證巴比倫危機不會來。","Relief from Assyria does not prevent the Babylonian crisis."]],"caution":["個別得救故事不可當作對所有戰爭受害者的保證。","A particular deliverance is no universal war-time guarantee."],"question":["哪一節最能支持「前半卷以得救後的自滿與未來流亡作橋。」的觀察？","Which verse best supports the observation “Complacency after rescue bridges toward coming exile.”?"]},{"n":40,"refs":"40","title":["安慰我的百姓","Comfort my people"],"summary":["流亡者聽見安慰與曠野道路，造物主使疲乏者重新得力。","Exiles hear comfort and a wilderness road; the Creator renews the weary."],"deep":[["安慰不是說痛苦不存在，而是宣告新道路。","Comfort names a new way without denying pain."],["新出埃及語言使歸回與創造更新連結。","New-exodus language joins return to renewed creation."]],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."],"question":["哪一節最能支持「安慰不是說痛苦不存在，而是宣告新道路。」的觀察？","Which verse best supports the observation “Comfort names a new way without denying pain.”?"]},{"n":41,"refs":"41","title":["列國偶像與僕人","Nations, idols, and servant"],"summary":["神與偶像的對比中，以色列被稱僕人，得到「不要害怕」的勸勉。","Against idol claims, Israel is addressed as servant and told not to fear."],"deep":[["流亡者的軟弱被承認，也被重新命名。","The exiles’ weakness is acknowledged and renamed."],["新出埃及語言使歸回與創造更新連結。","New-exodus language joins return to renewed creation."]],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."],"question":["哪一節最能支持「流亡者的軟弱被承認，也被重新命名。」的觀察？","Which verse best supports the observation “The exiles’ weakness is acknowledged and renamed.”?"]},{"n":42,"refs":"42","title":["公義的僕人","Servant of justice"],"summary":["蒙揀選的僕人不喧嚷、不折斷壓傷的蘆葦，將公義帶給列國。","The chosen servant brings justice without crushing a bruised reed or shouting."],"deep":[["公義的方式與其目標同樣重要。","How justice comes matters alongside its goal."],["新出埃及語言使歸回與創造更新連結。","New-exodus language joins return to renewed creation."]],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."],"question":["哪一節最能支持「公義的方式與其目標同樣重要。」的觀察？","Which verse best supports the observation “How justice comes matters alongside its goal.”?"]},{"n":43,"refs":"43","title":["水火中的同在","Presence through water and fire"],"summary":["神呼喚以色列不要怕，說要在水火中同在並聚集散居者。","God tells Israel not to fear, promises presence through water and fire, and gathers the scattered."],"deep":[["同在不等於沒有水火，而是在危機中不被遺忘。","Presence does not remove all danger but refuses abandonment."],["新出埃及語言使歸回與創造更新連結。","New-exodus language joins return to renewed creation."]],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."],"question":["哪一節最能支持「同在不等於沒有水火，而是在危機中不被遺忘。」的觀察？","Which verse best supports the observation “Presence does not remove all danger but refuses abandonment.”?"]},{"n":44,"refs":"44","title":["倒水、偶像與古列","Water, idols, and Cyrus"],"summary":["靈與水澆灌後代；偶像匠人的自我矛盾被諷刺，古列被提名。","Spirit and water bless descendants; idol makers are satirized, and Cyrus is named."],"deep":[["創造主與人手製作之物形成反差。","The Creator contrasts with what human hands make."],["新出埃及語言使歸回與創造更新連結。","New-exodus language joins return to renewed creation."]],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."],"question":["哪一節最能支持「創造主與人手製作之物形成反差。」的觀察？","Which verse best supports the observation “The Creator contrasts with what human hands make.”?"]},{"n":45,"refs":"45","title":["古列與獨一的神","Cyrus and the one God"],"summary":["神呼召古列，又宣告自己獨一，地極的人皆被邀歸向。","God calls Cyrus and declares divine uniqueness while inviting earth’s ends to turn."],"deep":[["外邦統治者可成工具，但不成為崇拜對象。","A foreign ruler may serve a purpose without becoming an idol."],["新出埃及語言使歸回與創造更新連結。","New-exodus language joins return to renewed creation."]],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."],"question":["哪一節最能支持「外邦統治者可成工具，但不成為崇拜對象。」的觀察？","Which verse best supports the observation “A foreign ruler may serve a purpose without becoming an idol.”?"]},{"n":46,"refs":"46","title":["巴力、尼波與負重者","Bel, Nebo, and burdens"],"summary":["偶像須人背負，神卻說自己從胎中背負百姓到年老。","Idols must be carried; God says he carries the people from birth to old age."],"deep":[["誰背負誰，是偶像對比的核心問題。","Who carries whom is the chapter’s central contrast."],["新出埃及語言使歸回與創造更新連結。","New-exodus language joins return to renewed creation."]],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."],"question":["哪一節最能支持「誰背負誰，是偶像對比的核心問題。」的觀察？","Which verse best supports the observation “Who carries whom is the chapter’s central contrast.”?"]},{"n":47,"refs":"47","title":["巴比倫女子降卑","Babylon brought low"],"summary":["巴比倫以女性形象被迫下位，傲慢與殘酷受責。","Babylon is portrayed as a proud woman brought low for cruelty."],"deep":[["擬人化國家不是對真實女性的譴責。","A feminized city is not a verdict on actual women."],["新出埃及語言使歸回與創造更新連結。","New-exodus language joins return to renewed creation."]],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."],"question":["哪一節最能支持「擬人化國家不是對真實女性的譴責。」的觀察？","Which verse best supports the observation “A feminized city is not a verdict on actual women.”?"]},{"n":48,"refs":"48","title":["頑梗與新出埃及","Stubbornness and new exodus"],"summary":["神揭露以色列頑梗，仍呼召離開巴比倫並宣告救贖。","God names Israel’s stubbornness yet calls them out of Babylon in redemption."],"deep":[["歸回恩典不以群體完美為前提。","Return is offered without a claim of communal perfection."],["新出埃及語言使歸回與創造更新連結。","New-exodus language joins return to renewed creation."]],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."],"question":["哪一節最能支持「歸回恩典不以群體完美為前提。」的觀察？","Which verse best supports the observation “Return is offered without a claim of communal perfection.”?"]},{"n":49,"refs":"49","title":["僕人作萬民之光","Servant as light to nations"],"summary":["僕人自胎受召，即便勞苦似徒然，仍受命使以色列與萬國得光。","The servant is called from the womb, feels labor in vain, yet is sent to Israel and nations."],"deep":[["失望與使命在同一首詩中並存。","Disappointment and calling coexist."],["僕人身分在各詩中呈現不同面向，須連前後文細讀。","The servant’s identity and role vary across songs; read context closely."]],"caution":["不可把受苦本身浪漫化或合理化施暴。","Do not romanticize suffering or excuse abuse."],"question":["哪一節最能支持「失望與使命在同一首詩中並存。」的觀察？","Which verse best supports the observation “Disappointment and calling coexist.”?"]},{"n":50,"refs":"50","title":["受教者的耳與背","Listening ear and offered back"],"summary":["僕人早晨受教，面對羞辱仍不轉身，信靠神的幫助。","The servant listens as a disciple and does not turn back from abuse, trusting divine help."],"deep":[["先聽後說，是僕人言語的根基。","Listening precedes the servant’s speech."],["僕人身分在各詩中呈現不同面向，須連前後文細讀。","The servant’s identity and role vary across songs; read context closely."]],"caution":["不可把受苦本身浪漫化或合理化施暴。","Do not romanticize suffering or excuse abuse."],"question":["哪一節最能支持「先聽後說，是僕人言語的根基。」的觀察？","Which verse best supports the observation “Listening precedes the servant’s speech.”?"]},{"n":51,"refs":"51","title":["安慰錫安與醒起","Comfort and awakening"],"summary":["亞伯拉罕記憶與神的拯救激勵錫安，受苦之城被呼喚醒起。","Memory of Abraham and divine rescue comfort Zion and call the wounded city awake."],"deep":[["歷史記憶用來開啟未來，而非否認眼前荒涼。","Memory opens future without denying present ruin."],["僕人身分在各詩中呈現不同面向，須連前後文細讀。","The servant’s identity and role vary across songs; read context closely."]],"caution":["不可把受苦本身浪漫化或合理化施暴。","Do not romanticize suffering or excuse abuse."],"question":["哪一節最能支持「歷史記憶用來開啟未來，而非否認眼前荒涼。」的觀察？","Which verse best supports the observation “Memory opens future without denying present ruin.”?"]},{"n":52,"refs":"52","title":["報佳音與僕人序曲","Good news and servant prelude"],"summary":["錫安聽見和平佳音、離開污穢；末段預告僕人被高舉卻受驚駭。","Zion hears good news and is called to depart; the servant’s exaltation begins amid shock."],"deep":[["52:13 起與第 53 章同屬一首詩。","The poem beginning at 52:13 continues through chapter 53."],["僕人身分在各詩中呈現不同面向，須連前後文細讀。","The servant’s identity and role vary across songs; read context closely."]],"caution":["不可把受苦本身浪漫化或合理化施暴。","Do not romanticize suffering or excuse abuse."],"question":["哪一節最能支持「52:13 起與第 53 章同屬一首詩。」的觀察？","Which verse best supports the observation “The poem beginning at 52:13 continues through chapter 53.”?"]},{"n":53,"refs":"53","title":["受苦僕人的詩","Poem of the suffering servant"],"summary":["僕人被藐視、受創，詩人反思他與眾人的罪及神的旨意。","The servant is rejected and wounded as the speakers reflect on communal wrong and divine purpose."],"deep":[["先讀說話者、僕人與「我們」的關係，再談後來基督教詮釋。","First identify servant and “we,” then discuss later Christian interpretation."],["僕人身分在各詩中呈現不同面向，須連前後文細讀。","The servant’s identity and role vary across songs; read context closely."]],"caution":["不可把受苦本身浪漫化或合理化施暴。","Do not romanticize suffering or excuse abuse."],"question":["哪一節最能支持「先讀說話者、僕人與「我們」的關係，再談後來基督教詮釋。」的觀察？","Which verse best supports the observation “First identify servant and “we,” then discuss later Christian interpretation.”?"]},{"n":54,"refs":"54","title":["不再被棄的錫安","Zion no longer forsaken"],"summary":["以失婚婦人的意象安慰荒涼錫安，重申慈愛與平安之約。","A forsaken-wife image comforts desolate Zion with steadfast love and a covenant of peace."],"deep":[["女性意象描繪城市，不能據此規訓真實受虐婦女。","City-as-wife imagery must not discipline abused women."],["僕人身分在各詩中呈現不同面向，須連前後文細讀。","The servant’s identity and role vary across songs; read context closely."]],"caution":["不可把受苦本身浪漫化或合理化施暴。","Do not romanticize suffering or excuse abuse."],"question":["哪一節最能支持「女性意象描繪城市，不能據此規訓真實受虐婦女。」的觀察？","Which verse best supports the observation “City-as-wife imagery must not discipline abused women.”?"]},{"n":55,"refs":"55","title":["免費的水與永約","Free water and enduring covenant"],"summary":["口渴者無價得水糧，眾人受邀尋求神，神的話不徒然返回。","The thirsty receive free water and food, are invited to seek God, and hear that God’s word accomplishes its purpose."],"deep":[["免費宴席批判以勞碌購買不能使人飽足之物。","The free feast questions labor spent on what cannot satisfy."],["僕人身分在各詩中呈現不同面向，須連前後文細讀。","The servant’s identity and role vary across songs; read context closely."]],"caution":["不可把受苦本身浪漫化或合理化施暴。","Do not romanticize suffering or excuse abuse."],"question":["哪一節最能支持「免費宴席批判以勞碌購買不能使人飽足之物。」的觀察？","Which verse best supports the observation “The free feast questions labor spent on what cannot satisfy.”?"]},{"n":56,"refs":"56","title":["外邦人與太監的名字","Foreigners and eunuchs belong"],"summary":["守約的外邦人與太監被應許在神的殿有名分，領袖的失職也受責。","Covenant-keeping foreigners and eunuchs receive a place and name; failed leaders are rebuked."],"deep":[["群體邊界在此向原被排除者打開。","Boundaries open toward those formerly excluded."],["真正禁食與鬆開不義的鎖鏈相連。","True fasting is joined to loosening injustice."]],"caution":["勿用敬虔語言遮蓋制度性壓迫。","Do not let pious speech cover structural oppression."],"question":["哪一節最能支持「群體邊界在此向原被排除者打開。」的觀察？","Which verse best supports the observation “Boundaries open toward those formerly excluded.”?"]},{"n":57,"refs":"57","title":["偶像與痛悔的心","Idols and contrite heart"],"summary":["偶像敬拜受責；至高者說自己也與痛悔謙卑的人同居。","Idolatry is rebuked; the exalted God also dwells with the contrite and lowly."],"deep":[["神的高超與親近不是相反命題。","Divine transcendence and nearness are not opposites."],["真正禁食與鬆開不義的鎖鏈相連。","True fasting is joined to loosening injustice."]],"caution":["勿用敬虔語言遮蓋制度性壓迫。","Do not let pious speech cover structural oppression."],"question":["哪一節最能支持「神的高超與親近不是相反命題。」的觀察？","Which verse best supports the observation “Divine transcendence and nearness are not opposites.”?"]},{"n":58,"refs":"58","title":["真正的禁食","True fasting"],"summary":["百姓禁食卻仍欺壓工人；先知要求解開不義、分餅給飢餓者。","People fast while exploiting workers; the prophet calls for freeing the oppressed and feeding the hungry."],"deep":[["禮儀與經濟公義必須互相檢驗。","Ritual and economic justice must test each other."],["真正禁食與鬆開不義的鎖鏈相連。","True fasting is joined to loosening injustice."]],"caution":["勿用敬虔語言遮蓋制度性壓迫。","Do not let pious speech cover structural oppression."],"question":["哪一節最能支持「禮儀與經濟公義必須互相檢驗。」的觀察？","Which verse best supports the observation “Ritual and economic justice must test each other.”?"]},{"n":59,"refs":"59","title":["罪隔絕與求贖","Injustice, confession, and redemption"],"summary":["暴力、謊言與無公義被控訴，群體承認盲暗，神應許救贖。","Violence, lies, and missing justice are named; the community confesses darkness and hopes for redemption."],"deep":[["「光明」的缺乏與制度性不義相連。","Lack of light is connected to systemic injustice."],["真正禁食與鬆開不義的鎖鏈相連。","True fasting is joined to loosening injustice."]],"caution":["勿用敬虔語言遮蓋制度性壓迫。","Do not let pious speech cover structural oppression."],"question":["哪一節最能支持「「光明」的缺乏與制度性不義相連。」的觀察？","Which verse best supports the observation “Lack of light is connected to systemic injustice.”?"]},{"n":60,"refs":"60","title":["興起發光的錫安","Zion rises and shines"],"summary":["錫安受光照，列國帶來財物，城門敞開，悲哀轉為喜樂。","Zion receives light, nations bring gifts, gates open, and grief turns to joy."],"deep":[["列國走向錫安不是城自我發光，而是領受之光。","Zion receives rather than manufactures its light."],["盼望同時關乎敬拜、城市、勞動與公義。","Hope includes worship, city, labor, and justice."]],"caution":["新創造圖像不可用作逃避現世責任。","New-creation imagery must not evade present responsibilities."],"question":["哪一節最能支持「列國走向錫安不是城自我發光，而是領受之光。」的觀察？","Which verse best supports the observation “Zion receives rather than manufactures its light.”?"]},{"n":61,"refs":"61","title":["向貧窮者報佳音","Good news for the poor"],"summary":["受膏者宣告貧者得好消息、被擄者得自由、哀者得安慰。","The anointed herald announces good news to poor people, release to captives, and comfort to mourners."],"deep":[["好消息以具體受壓者為對象，不是抽象樂觀。","Good news addresses concrete sufferers, not vague optimism."],["盼望同時關乎敬拜、城市、勞動與公義。","Hope includes worship, city, labor, and justice."]],"caution":["新創造圖像不可用作逃避現世責任。","New-creation imagery must not evade present responsibilities."],"question":["哪一節最能支持「好消息以具體受壓者為對象，不是抽象樂觀。」的觀察？","Which verse best supports the observation “Good news addresses concrete sufferers, not vague optimism.”?"]},{"n":62,"refs":"62","title":["錫安的新名字","Zion’s new name"],"summary":["守望者不靜默，錫安得新名與新關係，救恩被宣告直到地極。","Watchers refuse silence as Zion receives a new name and salvation is announced abroad."],"deep":[["重命名象徵被羞辱者得到尊嚴。","A new name restores dignity to the shamed."],["盼望同時關乎敬拜、城市、勞動與公義。","Hope includes worship, city, labor, and justice."]],"caution":["新創造圖像不可用作逃避現世責任。","New-creation imagery must not evade present responsibilities."],"question":["哪一節最能支持「重命名象徵被羞辱者得到尊嚴。」的觀察？","Which verse best supports the observation “A new name restores dignity to the shamed.”?"]},{"n":63,"refs":"63","title":["踹酒醡者與追念","Winepress warrior and remembrance"],"summary":["嚴厲的戰士意象後，群體回想神慈愛，也感到神似乎遠離。","A fierce warrior image precedes communal recollection of mercy and felt distance."],"deep":[["審判圖像與群體的「你在哪裡」需一起閱讀。","Judgment imagery belongs beside “where are you?”"],["盼望同時關乎敬拜、城市、勞動與公義。","Hope includes worship, city, labor, and justice."]],"caution":["新創造圖像不可用作逃避現世責任。","New-creation imagery must not evade present responsibilities."],"question":["哪一節最能支持「審判圖像與群體的「你在哪裡」需一起閱讀。」的觀察？","Which verse best supports the observation “Judgment imagery belongs beside “where are you?””?"]},{"n":64,"refs":"64","title":["求神降臨","Prayer for God to come down"],"summary":["群體求神裂天而降，承認罪與荒涼，以陶匠與泥土意象求憐。","The community asks God to tear heaven, confesses ruin, and pleads as clay to potter."],"deep":[["認罪沒有消除對神沉默的追問。","Confession does not erase questions about silence."],["盼望同時關乎敬拜、城市、勞動與公義。","Hope includes worship, city, labor, and justice."]],"caution":["新創造圖像不可用作逃避現世責任。","New-creation imagery must not evade present responsibilities."],"question":["哪一節最能支持「認罪沒有消除對神沉默的追問。」的觀察？","Which verse best supports the observation “Confession does not erase questions about silence.”?"]},{"n":65,"refs":"65","title":["新天新地與公平生活","New heavens and earth"],"summary":["神回應悖逆與尋求者，描繪新耶路撒冷中長壽、建屋與栽種。","God responds to rebels and seekers and depicts a new Jerusalem of long life, building, and planting."],"deep":[["更新包括人能享用自己勞動的果實。","Renewal includes enjoying the fruit of one’s labor."],["盼望同時關乎敬拜、城市、勞動與公義。","Hope includes worship, city, labor, and justice."]],"caution":["新創造圖像不可用作逃避現世責任。","New-creation imagery must not evade present responsibilities."],"question":["哪一節最能支持「更新包括人能享用自己勞動的果實。」的觀察？","Which verse best supports the observation “Renewal includes enjoying the fruit of one’s labor.”?"]},{"n":66,"refs":"66","title":["神看顧謙卑者與萬國","The humble and all nations"],"summary":["神不受殿宇限制，注目謙卑者；萬國來看榮耀，結尾保留審判警告。","God is not housed by a building, regards the humble, draws nations to glory, and retains judgment."],"deep":[["末章呼應首章：敬拜須與謙卑和公義相連。","The final chapter echoes the first: worship requires humility and justice."],["盼望同時關乎敬拜、城市、勞動與公義。","Hope includes worship, city, labor, and justice."]],"caution":["新創造圖像不可用作逃避現世責任。","New-creation imagery must not evade present responsibilities."],"question":["哪一節最能支持「末章呼應首章：敬拜須與謙卑和公義相連。」的觀察？","Which verse best supports the observation “The final chapter echoes the first: worship requires humility and justice.”?"]}],"themesIntro":["以下主題由以賽亞書的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of Isaiah and complement the chapter studies."],"themes":[{"refs":"1–12","title":["耶路撒冷與盼望的王","Jerusalem and hoped-for king"],"body":["罪與敬拜失序被揭露；呼召、亞哈斯危機與大衛家盼望並進。","Injustice, prophetic call, Ahaz’s crisis, and Davidic hope unfold together."],"caution":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."]},{"refs":"24–35","title":["世界審判與荒漠開花","Judgment and blooming wilderness"],"body":["審判、筵席、歌唱、錯誤聯盟與醫治的道路交錯。","Judgment, feast, song, failed alliances, and a healing highway interweave."],"caution":["詩歌中的審判圖像不應變成對今日受害者的詛咒。","Do not weaponize poetic judgment against today’s sufferers."]},{"refs":"40–48","title":["安慰、創造主與歸回","Comfort, Creator, and return"],"body":["流亡者得安慰，偶像受質疑，古列被提名作釋放工具。","Exiles hear comfort, idols are challenged, and Cyrus is named as an agent of release."],"caution":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."]},{"refs":"56–59","title":["敬拜與公義","Worship and justice"],"body":["外邦人、太監、禁食者與受欺壓者進入群體更新的討論。","Foreigners, eunuchs, fasters, and oppressed people enter the renewal debate."],"caution":["勿用敬虔語言遮蓋制度性壓迫。","Do not let pious speech cover structural oppression."]},{"refs":"60–66","title":["新錫安與新創造","New Zion and creation"],"body":["光照萬國、受膏者宣告、群體祈禱與新天新地構成結尾。","Light for nations, anointed proclamation, communal prayer, and new heavens and earth close the book."],"caution":["新創造圖像不可用作逃避現世責任。","New-creation imagery must not evade present responsibilities."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["僕人受苦的段落不可用來要求受虐者接受傷害；要先辨明經文中的不義、救贖與被壓迫者聲音。","Do not use the servant’s suffering to demand that abuse victims endure harm; attend to injustice, redemption, and oppressed voices."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–12","title":["第 1 課｜耶路撒冷與盼望的王","Lesson 1 | Jerusalem and hoped-for king"],"aim":["罪與敬拜失序被揭露；呼召、亞哈斯危機與大衛家盼望並進。","Injustice, prophetic call, Ahaz’s crisis, and Davidic hope unfold together."],"flow":[["讀 1 章：敬拜的真假由對弱者的公義接受檢驗。","Read chapter 1: Worship is tested by justice toward vulnerable people."],["對照 1–12 章：第 1 章的公義呼召與第 11 章的公義之王相互呼應。","Compare chapters 1–12: Justice in chapter 1 anticipates the just ruler of chapter 11."],["討論：哪一節最能支持「前段審判與盼望在讚美中得到回應。」的觀察？","Discuss: Which verse best supports the observation “Praise responds to earlier judgment and hope.”?"]],"question":["哪一節最能支持「敬拜的真假由對弱者的公義接受檢驗。」的觀察？","Which verse best supports the observation “Worship is tested by justice toward vulnerable people.”?"],"practice":["不可把以馬內利經文完全脫離亞哈斯的歷史危機。","Do not detach Immanuel entirely from Ahaz’s historical crisis."]},{"refs":"13–23","title":["第 2 課｜列國的諭言","Lesson 2 | Oracles concerning nations"],"aim":["巴比倫、摩押、埃及、推羅等受檢視；驕傲與脆弱並陳。","Babylon, Moab, Egypt, Tyre, and others face scrutiny of pride and fragility."],"flow":[["讀 13 章：震動天地表達權力崩塌，不應機械化成天文預報。","Read chapter 13: Cosmic shaking is poetic judgment, not an astronomy forecast."],["對照 13–23 章：列國不是陪襯；先知的倫理視野跨越猶大。","Compare chapters 13–23: The nations are not scenery; prophetic ethics reaches beyond Judah."],["討論：哪一節最能支持「商業能力不能使城市免於歷史變局。」的觀察？","Discuss: Which verse best supports the observation “Commercial power cannot guarantee immunity from change.”?"]],"question":["哪一節最能支持「震動天地表達權力崩塌，不應機械化成天文預報。」的觀察？","Which verse best supports the observation “Cosmic shaking is poetic judgment, not an astronomy forecast.”?"],"practice":["不可把古代國名直接等同當代民族。","Do not identify ancient nations directly with modern peoples."]},{"refs":"24–35","title":["第 3 課｜世界審判與荒漠開花","Lesson 3 | Judgment and blooming wilderness"],"aim":["審判、筵席、歌唱、錯誤聯盟與醫治的道路交錯。","Judgment, feast, song, failed alliances, and a healing highway interweave."],"flow":[["讀 24 章：普世語言擴大視野，不等同一日內所有地點的紀錄。","Read chapter 24: Universal rhetoric widens scope, not a one-day global log."],["對照 24–35 章：第 25 章的筵席與第 35 章的歸回讓審判不是最後一句。","Compare chapters 24–35: The feast of chapter 25 and return of chapter 35 prevent judgment from being the last word."],["討論：哪一節最能支持「盼望涉及身體、土地與安全通行。」的觀察？","Discuss: Which verse best supports the observation “Hope concerns bodies, land, and safe passage.”?"]],"question":["哪一節最能支持「普世語言擴大視野，不等同一日內所有地點的紀錄。」的觀察？","Which verse best supports the observation “Universal rhetoric widens scope, not a one-day global log.”?"],"practice":["詩歌中的審判圖像不應變成對今日受害者的詛咒。","Do not weaponize poetic judgment against today’s sufferers."]},{"refs":"36–39","title":["第 4 課｜希西家敘事橋梁","Lesson 4 | Hezekiah as narrative bridge"],"aim":["亞述圍城、禱告、病癒與巴比倫使者連接前後兩大段。","Assyrian siege, prayer, healing, and Babylonian envoys bridge the book’s halves."],"flow":[["讀 36 章：圍城也透過語言操控恐懼。","Read chapter 36: Siege warfare also manipulates fear through speech."],["對照 36–39 章：亞述危機得解並不保證巴比倫危機不會來。","Compare chapters 36–39: Relief from Assyria does not prevent the Babylonian crisis."],["討論：哪一節最能支持「前半卷以得救後的自滿與未來流亡作橋。」的觀察？","Discuss: Which verse best supports the observation “Complacency after rescue bridges toward coming exile.”?"]],"question":["哪一節最能支持「圍城也透過語言操控恐懼。」的觀察？","Which verse best supports the observation “Siege warfare also manipulates fear through speech.”?"],"practice":["個別得救故事不可當作對所有戰爭受害者的保證。","A particular deliverance is no universal war-time guarantee."]},{"refs":"40–48","title":["第 5 課｜安慰、創造主與歸回","Lesson 5 | Comfort, Creator, and return"],"aim":["流亡者得安慰，偶像受質疑，古列被提名作釋放工具。","Exiles hear comfort, idols are challenged, and Cyrus is named as an agent of release."],"flow":[["讀 40 章：安慰不是說痛苦不存在，而是宣告新道路。","Read chapter 40: Comfort names a new way without denying pain."],["對照 40–48 章：新出埃及語言使歸回與創造更新連結。","Compare chapters 40–48: New-exodus language joins return to renewed creation."],["討論：哪一節最能支持「歸回恩典不以群體完美為前提。」的觀察？","Discuss: Which verse best supports the observation “Return is offered without a claim of communal perfection.”?"]],"question":["哪一節最能支持「安慰不是說痛苦不存在，而是宣告新道路。」的觀察？","Which verse best supports the observation “Comfort names a new way without denying pain.”?"],"practice":["不要把流亡者的安慰簡化成否認創傷。","Do not treat comfort as denial of trauma."]},{"refs":"49–55","title":["第 6 課｜僕人與新的盟約邀請","Lesson 6 | Servant and covenant invitation"],"aim":["僕人的使命、拒絕與受苦，以及錫安的更新和免費筵席相連。","The servant’s mission, rejection, suffering, Zion’s renewal, and free invitation belong together."],"flow":[["讀 49 章：失望與使命在同一首詩中並存。","Read chapter 49: Disappointment and calling coexist."],["對照 49–55 章：僕人身分在各詩中呈現不同面向，須連前後文細讀。","Compare chapters 49–55: The servant’s identity and role vary across songs; read context closely."],["討論：哪一節最能支持「免費宴席批判以勞碌購買不能使人飽足之物。」的觀察？","Discuss: Which verse best supports the observation “The free feast questions labor spent on what cannot satisfy.”?"]],"question":["哪一節最能支持「失望與使命在同一首詩中並存。」的觀察？","Which verse best supports the observation “Disappointment and calling coexist.”?"],"practice":["不可把受苦本身浪漫化或合理化施暴。","Do not romanticize suffering or excuse abuse."]},{"refs":"56–59","title":["第 7 課｜敬拜與公義","Lesson 7 | Worship and justice"],"aim":["外邦人、太監、禁食者與受欺壓者進入群體更新的討論。","Foreigners, eunuchs, fasters, and oppressed people enter the renewal debate."],"flow":[["讀 56 章：群體邊界在此向原被排除者打開。","Read chapter 56: Boundaries open toward those formerly excluded."],["對照 56–59 章：真正禁食與鬆開不義的鎖鏈相連。","Compare chapters 56–59: True fasting is joined to loosening injustice."],["討論：哪一節最能支持「「光明」的缺乏與制度性不義相連。」的觀察？","Discuss: Which verse best supports the observation “Lack of light is connected to systemic injustice.”?"]],"question":["哪一節最能支持「群體邊界在此向原被排除者打開。」的觀察？","Which verse best supports the observation “Boundaries open toward those formerly excluded.”?"],"practice":["勿用敬虔語言遮蓋制度性壓迫。","Do not let pious speech cover structural oppression."]},{"refs":"60–66","title":["第 8 課｜新錫安與新創造","Lesson 8 | New Zion and creation"],"aim":["光照萬國、受膏者宣告、群體祈禱與新天新地構成結尾。","Light for nations, anointed proclamation, communal prayer, and new heavens and earth close the book."],"flow":[["讀 60 章：列國走向錫安不是城自我發光，而是領受之光。","Read chapter 60: Zion receives rather than manufactures its light."],["對照 60–66 章：盼望同時關乎敬拜、城市、勞動與公義。","Compare chapters 60–66: Hope includes worship, city, labor, and justice."],["討論：哪一節最能支持「末章呼應首章：敬拜須與謙卑和公義相連。」的觀察？","Discuss: Which verse best supports the observation “The final chapter echoes the first: worship requires humility and justice.”?"]],"question":["哪一節最能支持「列國走向錫安不是城自我發光，而是領受之光。」的觀察？","Which verse best supports the observation “Zion receives rather than manufactures its light.”?"],"practice":["新創造圖像不可用作逃避現世責任。","New-creation imagery must not evade present responsibilities."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["以賽亞書最常被忽略的人物是誰？為何？","Which character in
