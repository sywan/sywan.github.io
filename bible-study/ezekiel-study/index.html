<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="以西結書成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>以西結書｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"EZK","category":["先知書","Prophetic Books"],"name":["以西結書","Ezekiel"],"subtitle":["從被擄者中看見神的榮耀、城的崩潰與更新聖殿；48 章逐章研讀。","Forty-eight chapters move from divine glory among exiles through Jerusalem’s fall to a renewed temple and land."],"overviewIntro":["先從全書結構掌握以西結書，再逐章研讀人物、事件與神學判斷。","Survey Ezekiel as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["48 章；依照書卷原有次序逐章研讀。","48 chapters studied in canonical sequence."],"thesis":["神的榮耀離開，也能回來","Divine glory departs and returns"],"thesisDetail":["被擄祭司以西結用異象與象徵行動揭露污穢和暴力，並以新心、新靈、枯骨復生與生命水宣告更新。","The exiled priest uses visions and sign acts to expose impurity and violence, then imagines new heart, new spirit, revived bones, and life-giving water."],"keyQuestion":["以西結書如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Ezekiel portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["被擄祭司以西結用異象與象徵行動揭露污穢和暴力，並以新心、新靈、枯骨復生與生命水宣告更新。","The exiled priest uses visions and sign acts to expose impurity and violence, then imagines new heart, new spirit, revived bones, and life-giving water."],"finalMovement":["最後的城名「耶和華的所在」回應最初流亡者以為失去神同在的恐懼。","The city’s final name, “The LORD Is There,” answers exiles’ fear that presence was lost."],"readingKeys":[{"refs":"1–3","title":["榮耀異象與守望者","Glory and watchman"],"body":["被擄者看見移動的榮耀，先知吃書卷、被設為守望者。","Exiles see mobile glory; the prophet eats a scroll and becomes a watchman."]},{"refs":"8–11","title":["聖殿污穢與榮耀離去","Temple corruption and departing glory"],"body":["異象揭露殿中偶像與暴力，榮耀漸離；流亡者得到新心應許。","Visions expose idolatry and violence; glory departs while exiles hear a promise of a new heart."]},{"refs":"25–32","title":["列國與帝國的傾覆","Oracles against nations"],"body":["鄰國、推羅與埃及也受審視，權勢和財富被揭露為脆弱。","Neighbors, Tyre, and Egypt face judgment that exposes fragile power and wealth."]},{"refs":"40–48","title":["新殿、地界與生命河","New temple, land, and river"],"body":["量度殿宇、榮耀歸回、分地與河水醫治，形成全書最後異象。","Temple measurements, returning glory, apportioned land, and healing water close the book."]}],"mapIntro":["沿八個段落觀察以西結書的敘事推進與轉折。","Trace the movement of Ezekiel through eight teaching units."],"movements":[{"refs":"1–3","title":["榮耀異象與守望者","Glory and watchman"],"body":["被擄者看見移動的榮耀，先知吃書卷、被設為守望者。","Exiles see mobile glory; the prophet eats a scroll and becomes a watchman."]},{"refs":"4–7","title":["圍城的象徵行動","Signs of siege"],"body":["側臥、缺糧、剃髮等行動顯出城的困境與審判迫近。","Lying down, rationed food, and shaved hair stage the coming siege."]},{"refs":"8–11","title":["聖殿污穢與榮耀離去","Temple corruption and departing glory"],"body":["異象揭露殿中偶像與暴力，榮耀漸離；流亡者得到新心應許。","Visions expose idolatry and violence; glory departs while exiles hear a promise of a new heart."]},{"refs":"12–24","title":["責任、比喻與城陷預告","Accountability and warning"],"body":["行李、葡萄樹、兩姊妹、牧人等意象質問百姓與領袖；先知妻子去世成記號。","Baggage, vines, sisters, and shepherds expose failures; the prophet’s wife dies as a sign."]},{"refs":"25–32","title":["列國與帝國的傾覆","Oracles against nations"],"body":["鄰國、推羅與埃及也受審視，權勢和財富被揭露為脆弱。","Neighbors, Tyre, and Egypt face judgment that exposes fragile power and wealth."]},{"refs":"33–37","title":["轉折、新心與枯骨","Turning, new heart, and dry bones"],"body":["城陷消息到來；守望者重申責任，神尋羊、換心、使枯骨復生。","News of the fall arrives; the watchman renews the call, God seeks sheep and revives dry bones."]},{"refs":"38–39","title":["歌革的最後威脅","Gog’s final threat"],"body":["歌革來襲卻敗亡，神宣告自己將被認識並重新聚集百姓。","Gog attacks and falls; God promises recognition and gathering."]},{"refs":"40–48","title":["新殿、地界與生命河","New temple, land, and river"],"body":["量度殿宇、榮耀歸回、分地與河水醫治，形成全書最後異象。","Temple measurements, returning glory, apportioned land, and healing water close the book."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["異象含高度象徵、具體歷史與祭司語言；不把殿宇尺寸直接變成現代建築藍圖。","Visions mix symbolism, history, and priestly language; temple dimensions are not a ready modern building plan."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["迦巴魯河邊的榮耀","Glory by the Chebar"],"summary":["以西結在被擄者中見風、活物、輪與寶座上的榮耀。","Among exiles Ezekiel sees storm, creatures, wheels, and enthroned glory."],"deep":[["可移動的寶座挑戰神只在殿中的想像。","A mobile throne challenges a temple-bound view of God."],["神的同在不受耶路撒冷地理限制。","Divine presence is not confined to Jerusalem."]],"caution":["異象中的輪與活物不要化成機械圖紙。","Do not reduce wheels and creatures to mechanical diagrams."],"question":["哪一節最能支持「可移動的寶座挑戰神只在殿中的想像。」的觀察？","Which verse best supports the observation “A mobile throne challenges a temple-bound view of God.”?"]},{"n":2,"refs":"2","title":["差往悖逆之家","Sent to a rebellious house"],"summary":["先知被差往難聽的百姓，須先站立並接受書卷。","The prophet is sent to resistant people and first receives a scroll."],"deep":[["使命不由聽眾是否歡迎決定。","Reception does not determine the mission."],["神的同在不受耶路撒冷地理限制。","Divine presence is not confined to Jerusalem."]],"caution":["異象中的輪與活物不要化成機械圖紙。","Do not reduce wheels and creatures to mechanical diagrams."],"question":["哪一節最能支持「使命不由聽眾是否歡迎決定。」的觀察？","Which verse best supports the observation “Reception does not determine the mission.”?"]},{"n":3,"refs":"3","title":["吃書卷與守望者","Scroll and watchman"],"summary":["以西結吃下書卷，味甜如蜜，後被派作守望者向人示警。","Ezekiel eats a sweet scroll and is appointed a watchman."],"deep":[["信息須先被先知內化。","The prophet must first internalize the message."],["神的同在不受耶路撒冷地理限制。","Divine presence is not confined to Jerusalem."]],"caution":["異象中的輪與活物不要化成機械圖紙。","Do not reduce wheels and creatures to mechanical diagrams."],"question":["哪一節最能支持「信息須先被先知內化。」的觀察？","Which verse best supports the observation “The prophet must first internalize the message.”?"]},{"n":4,"refs":"4","title":["圍城的身體圖像","Embodied siege"],"summary":["磚上的耶路撒冷、側臥與限量食物演出圍城將來。","A brick city, prolonged lying down, and rationed food enact siege."],"deep":[["身體行動使遠方戰事變得切近。","The prophet’s body brings distant war near."],["先知身體承載警告。","The prophet’s body bears the warning."]],"caution":["象徵行動不是邀請今日教師模仿傷害行為。","Sign acts do not invite harmful reenactment."],"question":["哪一節最能支持「身體行動使遠方戰事變得切近。」的觀察？","Which verse best supports the observation “The prophet’s body brings distant war near.”?"]},{"n":5,"refs":"5","title":["剃髮與分散","Shaved hair and scattering"],"summary":["頭髮被分成焚燒、刀砍與風吹，顯示城民不同命運。","Hair is burned, cut, and scattered to portray varied fates."],"deep":[["少量保存的頭髮預留餘民問題。","A few preserved hairs raise the remnant question."],["先知身體承載警告。","The prophet’s body bears the warning."]],"caution":["象徵行動不是邀請今日教師模仿傷害行為。","Sign acts do not invite harmful reenactment."],"question":["哪一節最能支持「少量保存的頭髮預留餘民問題。」的觀察？","Which verse best supports the observation “A few preserved hairs raise the remnant question.”?"]},{"n":6,"refs":"6","title":["群山與偶像","Mountains and idols"],"summary":["向以色列群山宣告邱壇毀壞，倖存者在列國中回想。","Israel’s mountains hear judgment on shrines; survivors remember in exile."],"deep":[["地理景觀成為信仰錯置的見證。","The landscape witnesses misplaced worship."],["先知身體承載警告。","The prophet’s body bears the warning."]],"caution":["象徵行動不是邀請今日教師模仿傷害行為。","Sign acts do not invite harmful reenactment."],"question":["哪一節最能支持「地理景觀成為信仰錯置的見證。」的觀察？","Which verse best supports the observation “The landscape witnesses misplaced worship.”?"]},{"n":7,"refs":"7","title":["結局臨近","The end approaches"],"summary":["多重「結局」宣告市場、戰爭與逃生秩序失效。","Repeated “end” announcements show commerce, war, and escape collapsing."],"deep":[["經 rt"],"summary":["領袖的安全比喻受駁；流亡者被應許除石心、得肉心。","Leaders’ pot metaphor is challenged; exiles are promised hearts of flesh."],"deep":[["新心先對被排除的流亡者宣告。","The new heart is promised to displaced exiles."],["神的離去與領袖失職相連。","Departure is linked to leaders’ failure."]],"caution":["不可將複雜的聖殿象徵簡化成對所有敬拜者的譴責。","Do not flatten temple symbols into a verdict on all worshipers."],"question":["哪一節最能支持「新心先對被排除的流亡者宣告。」的觀察？","Which verse best supports the observation “The new heart is promised to displaced exiles.”?"]},{"n":12,"refs":"12","title":["搬行李的記號","Exile baggage sign"],"summary":["先知白日搬行李、夜間穿牆，象徵王與城民逃亡被擄。","The prophet carries baggage and passes through a wall to portray flight and exile."],"deep":[["「日子還遠」的拖延心理受到挑戰。","The belief that judgment is far off is challenged."],["18 章強調各人回應，與群體責任並存。","Chapter 18 stresses response alongside communal responsibility."]],"caution":["16、23章的暴力隱喻須有創傷知情的說明。","Chapters 16 and 23 require trauma-aware handling."],"question":["哪一節最能支持「「日子還遠」的拖延心理受到挑戰。」的觀察？","Which verse best supports the observation “The belief that judgment is far off is challenged.”?"]},{"n":13,"refs":"13","title":["粉飾牆的假先知","Whitewashed-wall prophets"],"summary":["假先知宣稱平安，卻只粉刷將倒的牆；女術士亦受責。","False prophets promise peace and whitewash a failing wall; diviners face judgment."],"deep":[["漂亮外觀遮掩結構危險。","A pleasing surface hides structural danger."],["18 章強調各人回應，與群體責任並存。","Chapter 18 stresses response alongside communal responsibility."]],"caution":["16、23章的暴力隱喻須有創傷知情的說明。","Chapters 16 and 23 require trauma-aware handling."],"question":["哪一節最能支持「漂亮外觀遮掩結構危險。」的觀察？","Which verse best supports the observation “A pleasing surface hides structural danger.”?"]},{"n":14,"refs":"14","title":["長老與心中的偶像","Elders and heart-idols"],"summary":["長老求問時仍藏偶像；即便義人在城，不能替眾人回應。","Elders seek counsel with idols in heart; righteous figures cannot substitute for others’ response."],"deep":[["責任不可全數外包給英雄。","Responsibility cannot be outsourced to heroes."],["18 章強調各人回應，與群體責任並存。","Chapter 18 stresses response along 望者。","Exiles see mobile glory; the prophet eats a scroll and becomes a watchman."],"caution":["異象中的輪與活物不要化成機械圖紙。","Do not reduce wheels and creatures to mechanical diagrams."]},{"refs":"8–11","title":["聖殿污穢與榮耀離去","Temple corruption and departing glory"],"body":["異象揭露殿中偶像與暴力，榮耀漸離；流亡者得到新心應許。","Visions expose idolatry and violence; glory departs while exiles hear a promise of a new heart."],"caution":["不可將複雜的聖殿象徵簡化成對所有敬拜者的譴責。","Do not flatten temple symbols into a verdict on all worshipers."]},{"refs":"25–32","title":["列國與帝國的傾覆","Oracles against nations"],"body":["鄰國、推羅與埃及也受審視，權勢和財富被揭露為脆弱。","Neighbors, Tyre, and Egypt face judgment that exposes fragile power and wealth."],"caution":["古代國名不可直接等同當代民族。","Do not identify ancient nations with modern peoples."]},{"refs":"38–39","title":["歌革的最後威脅","Gog’s final threat"],"body":["歌革來襲卻敗亡，神宣告自己將被認識並重新聚集百姓。","Gog attacks and falls; God promises recognition and gathering."],"caution":["不可把歌革直接指認為當代國家。","Do not equate Gog with a present country."]},{"refs":"40–48","title":["新殿、地界與生命河","New temple, land, and river"],"body":["量度殿宇、榮耀歸回、分地與河水醫治，形成全書最後異象。","Temple measurements, returning glory, apportioned land, and healing water close the book."],"caution":["先讀作流亡後的神學盼望，再比較不同末世讀法。","Read it first as post-exilic hope, then compare later eschatologies."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["部分婚姻與性暴力隱喻會傷害讀者；教學應明確區分城市擬人化與真實女性，且留意受害者。","Marriage and sexual-violence metaphors can harm readers; distinguish personified cities from real women and attend to survivors."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–3","title":["第 1 課｜榮耀異象與守望者","Lesson 1 | Glory and watchman"],"aim":["被擄者看見移動的榮耀，先知吃書卷、被設為守望者。","Exiles see mobile glory; the prophet eats a scroll and becomes a watchman."],"flow":[["讀 1 章：可移動的寶座挑戰神只在殿中的想像。","Read chapter 1: A mobile throne challenges a temple-bound view of God."],["對照 1–3 章：神的同在不受耶路撒冷地理限制。","Compare chapters 1–3: Divine presence is not confined to Jerusalem."],["討論：哪一節最能支持「信息須先被先知內化。」的觀察？","Discuss: Which verse best supports the observation “The prophet must first internalize the message.”?"]],"question":["哪一節最能支持「可移動的寶座挑戰神只在殿中的想像。」的觀察？","Which verse best supports the observation “A mobile throne challenges a temple-bound view of God.”?"],"practice":["異象中的輪與活物不要化成機械圖紙。","Do not reduce wheels and creatures to mechanical diagrams."]},{"refs":"4–7","title":["第 2 課｜圍城的象徵行動","Lesson 2 | Signs of siege"],"aim":["側臥、缺糧、剃髮等行動顯出城的困境與審判迫近。","Lying down, rationed food, and shaved hair stage the coming siege."],"flow":[["讀 4 章：身體行動使遠方戰事變得切近。","Read chapter 4: The prophet’s body brings distant war near."],["對照 4–7 章：先知身體承載警告。","Compare chapters 4–7: The prophet’s body bears the warning."],["討論：哪一節最能支持「經濟活動無法免除社會崩潰。」的觀察？","Discuss: Which verse best supports the observation “Commerce cannot shield a collapsing society.”?"]],"question":["哪一節最能支持「身體行動使遠方戰事變得切近。」的觀察？","Which verse best supports the observation “The prophet’s body brings distant war near.”?"],"practice":["象徵行動不是邀請今日教師模仿傷害行為。","Sign acts do not invite harmful reenactment."]},{"refs":"8–11","title":["第 3 課｜聖殿污穢與榮耀離去","Lesson 3 | Temple corruption and departing glory"],"aim":["異象揭露殿中偶像與暴力，榮耀漸離；流亡者得到新心應許。","Visions expose idolatry and violence; glory departs while exiles hear a promise of a new heart."],"flow":[["讀 8 章：「神看不見」的自我安慰被揭穿。","Read chapter 8: The claim that God cannot see is exposed."],["對照 8–11 章：神的離去與領袖失職相連。","Compare chapters 8–11: Departure is linked to leaders’ failure."],["討論：哪一節最能支持「新心先對被排除的流亡者宣告。」的觀察？","Discuss: Which verse best supports the observation “The new heart is promised to displaced exiles.”?"]],"question":["哪一節最能支持「「神看不見」的自我安慰被揭穿。」的觀察？","Which verse best supports the observation “The claim that God cannot see is exposed.”?"],"practice":["不可將複雜的聖殿象徵簡化成對所有敬拜者的譴責。","Do not flatten temple symbols into a verdict on all worshipers."]},{"refs":"12–24","title":["第 4 課｜責任、比喻與城陷預告","Lesson 4 | Accountability and warning"],"aim":["行李、葡萄樹、兩姊妹、牧人等意象質問百姓與領袖；先知妻子去世成記號。","Baggage, vines, sisters, and shepherds expose failures; the prophet’s wife dies as a sign."],"flow":[["讀 12 章：「日子還遠」的拖延心理受到挑戰。","Read chapter 12: The belief that judgment is far off is challenged."],["對照 12–24 章：18 章強調各人回應，與群體責任並存。","Compare chapters 12–24: Chapter 18 stresses response alongside communal responsibility."],["討論：哪一節最能支持「不可把先知的個人損失當作可模仿的靈性技巧。」的觀察？","Discuss: Which verse best supports the observation “His loss is no spiritual technique to imitate.”?"]],"question":["哪一節最能支持「「日子還遠」的拖延心理受到挑戰。」的觀察？","Which verse best supports the observation “The belief that judgment is far off is challenged.”?"],"practice":["16、23章的暴力隱喻須有創傷知情的說明。","Chapters 16 and 23 require trauma-aware handling."]},{"refs":"25–32","title":["第 5 課｜列國與帝國的傾覆","Lesson 5 | Oracles against nations"],"aim":["鄰國、推羅與埃及也受審視，權勢和財富被揭露為脆弱。","Neighbors, Tyre, and Egypt face judgment that exposes fragile power and wealth."],"flow":[["讀 25 章：對別人苦難的態度也是倫理問題。","Read chapter 25: Response to another’s suffering matters ethically."],["對照 25–32 章：推羅與埃及的哀歌讓帝國崩潰可聽見。","Compare chapters 25–32: Laments make imperial collapse audible."],["討論：哪一節最能支持「哀歌讓不可一世的權力面對死亡。」的觀察？","Discuss: Which verse best supports the observation “Lament makes even imperial power face mortality.”?"]],"question":["哪一節最能支持「對別人苦難的態度也是倫理問題。」的觀察？","Which verse best supports the observation “Response to another’s suffering matters ethically.”?"],"practice":["古代國名不可直接等同當代民族。","Do not identify ancient nations with modern peoples."]},{"refs":"33–37","title":["第 6 課｜轉折、新心與枯骨","Lesson 6 | Turning, new heart, and dry bones"],"aim":["城陷消息到來；守望者重申責任，神尋羊、換心、使枯骨復生。","News of the fall arrives; the watchman renews the call, God seeks sheep and revives dry bones."],"flow":[["讀 33 章：城陷改變聽眾處境，也改變信息重心。","Read chapter 33: The fall changes the audience and the message’s emphasis."],["對照 33–37 章：枯骨首先代表被擄的以色列家。","Compare chapters 33–37: Dry bones first signify ologies."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["以西結書最常被忽略的人物是誰？為何？","Which character in Ezekiel is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜以西結書導讀","BibleProject | Ezekiel guide"],"url":"https://bibleproject.com/guides/book-of-ezekiel/"}],"footer":["以西結書 · 成人主日學教師版 · 請配合完整經文閱讀。","Ezekiel · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
