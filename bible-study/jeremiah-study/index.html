<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="耶利米書成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>耶利米書｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"JER","category":["先知書","Prophetic Books"],"name":["耶利米書","Jeremiah"],"subtitle":["從先知蒙召、猶大的崩潰與流亡，走到新約與歸回的盼望；52 章逐章研讀。","Fifty-two chapters trace prophetic calling, Judah’s collapse and exile, and promises of a new covenant and return."],"overviewIntro":["先從全書結構掌握耶利米書，再逐章研讀人物、事件與神學判斷。","Survey Jeremiah as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["52 章；依照書卷原有次序逐章研讀。","52 chapters studied in canonical sequence."],"thesis":["拆毀與栽植都在先知使命中","The prophet is called to uproot and to plant"],"thesisDetail":["耶利米揭露聖殿與政治安全感如何遮蔽不義；審判中仍傳出重新立約、重建與栽植的盼望。","Jeremiah exposes false security in temple and politics while announcing covenant renewal, rebuilding, and planting amid judgment."],"keyQuestion":["耶利米書如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Jeremiah portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["耶利米揭露聖殿與政治安全感如何遮蔽不義；審判中仍傳出重新立約、重建與栽植的盼望。","Jeremiah exposes false security in temple and politics while announcing covenant renewal, rebuilding, and planting amid judgment."],"finalMovement":["耶路撒冷陷落的附錄使盼望不能繞過歷史災難；約雅斤被釋放留下微弱開口。","The appendix on Jerusalem’s fall refuses hope that bypasses catastrophe; Jehoiachin’s release leaves a small opening."],"readingKeys":[{"refs":"1–6","title":["蒙召與婚約破裂","Call and broken covenant"],"body":["先知奉召拆毀與栽植，控訴百姓離棄活水並宣告北方災禍。","The prophet is called to uproot and plant, condemning forsaken living water and warning of danger from the north."]},{"refs":"11–20","title":["盟約、衝突與孤獨","Covenant, conflict, and isolation"],"body":["背約、暗殺圖謀、先知的控訴與監禁交替；神的話如火。","Broken covenant, plots, complaints, and confinement alternate; the word burns like fire."]},{"refs":"30–33","title":["安慰之書與新約","Book of consolation and new covenant"],"body":["雅各的傷得醫治，散居者聚集，新約寫在心上；買地行動預示未來。","Jacob’s wounds heal, the scattered return, covenant is written on hearts, and a field purchase enacts hope."]},{"refs":"46–52","title":["列國諭言與歷史附錄","Nations and historical appendix"],"body":["埃及至巴比倫的諭言表明帝國也受審；末章重述城陷與被擄。","Oracles from Egypt to Babylon judge empires; the final chapter recounts the fall and exile."]}],"mapIntro":["沿八個段落觀察耶利米書的敘事推進與轉折。","Trace the movement of Jeremiah through eight teaching units."],"movements":[{"refs":"1–6","title":["蒙召與婚約破裂","Call and broken covenant"],"body":["先知奉召拆毀與栽植，控訴百姓離棄活水並宣告北方災禍。","The prophet is called to uproot and plant, condemning forsaken living water and warning of danger from the north."]},{"refs":"7–10","title":["聖殿講章與偶像","Temple sermon and idols"],"body":["聖殿不能作不義的護身符；先知哀哭，偶像被指出無力。","The temple cannot shield injustice; the prophet weeps and exposes powerless idols."]},{"refs":"11–20","title":["盟約、衝突與孤獨","Covenant, conflict, and isolation"],"body":["背約、暗殺圖謀、先知的控訴與監禁交替；神的話如火。","Broken covenant, plots, complaints, and confinement alternate; the word burns like fire."]},{"refs":"21–29","title":["君王、假先知與流亡者","Kings, false prophets, and exiles"],"body":["統治者受責，真假平安話語碰撞；給流亡者的信勸其在異地求城的平安。","Rulers face judgment, rival claims of peace clash, and exiles are told to seek the city’s welfare."]},{"refs":"30–33","title":["安慰之書與新約","Book of consolation and new covenant"],"body":["雅各的傷得醫治，散居者聚集，新約寫在心上；買地行動預示未來。","Jacob’s wounds heal, the scattered return, covenant is written on hearts, and a field purchase enacts hope."]},{"refs":"34–39","title":["最後警告與城陷","Final warnings and fall"],"body":["釋奴反悔、書卷焚毀、先知被囚；耶路撒冷終於陷落。","Reversed manumission, a burned scroll, imprisonment, and Jerusalem’s fall reveal failed leadership."]},{"refs":"40–45","title":["流亡後的餘民與巴錄","Remnant after the fall and Baruch"],"body":["基大利被殺，餘民逃埃及；耶利米仍勸聽，巴錄也得到個人信息。","Gedaliah is murdered, survivors flee to Egypt, Jeremiah keeps speaking, and Baruch receives a word."]},{"refs":"46–52","title":["列國諭言與歷史附錄","Nations and historical appendix"],"body":["埃及至巴比倫的諭言表明帝國也受審；末章重述城陷與被擄。","Oracles from Egypt to Babylon judge empires; the final chapter recounts the fall and exile."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["本書編排不全依年代；敘事、詩歌與巴錄書寫互相穿插，須留意語境和說話者。","The arrangement is not strictly chronological; attend to changing speakers and the interplay of poetry, narrative, and Baruch’s writing."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["先知蒙召","Prophet called"],"summary":["耶利米自幼被揀選，受命拆毀與栽植；杏樹枝與沸騰鍋預示使命。","Jeremiah is called to uproot and plant; almond branch and boiling pot frame his task."],"deep":[["使命同時包括審判與重建。","The commission includes judgment and restoration."],["婚約與水泉意象呈現背約的關係層面。","Marriage and spring imagery make covenant failure relational."]],"caution":["不要把對古代猶大的控訴移作對任何民族的定罪。","Do not transfer charges against ancient Judah onto a modern people."],"question":["哪一節最能支持「使命同時包括審判與重建。」的觀察？","Which verse best supports the observation “The commission includes judgment and restoration.”?"]},{"n":2,"refs":"2","title":["活水與破池","Living water and broken cisterns"],"summary":["神追問百姓離棄活水，轉向不能存水的池與政治盟友。","God questions the people’s abandonment of living water for broken cisterns and alliances."],"deep":[["偶像與外交依賴並列為錯置的信靠。","Idolatry and alliances both reveal misplaced trust."],["婚約與水泉意象呈現背約的關係層面。","Marriage and spring imagery make covenant failure relational."]],"caution":["不要把對古代猶大的控訴移作對任何民族的定罪。","Do not transfer charges against ancient Judah onto a modern people."],"question":["哪一節最能支持「偶像與外交依賴並列為錯置的信靠。」的觀察？","Which verse best supports the observation “Idolatry and alliances both reveal misplaced trust.”?"]},{"n":3,"refs":"3","title":["呼召歸回","Call to return"],"summary":["婚約意象描繪背信，先知仍反覆呼召離去的人回來。","Marriage imagery exposes infidelity while repeated invitations call the people back."],"deep":[["責備與邀請在同章交錯。","Rebuke and invitation coexist."],["婚約與水泉意象呈現背約的關係層面。","Marriage and spring imagery make covenant failure relational."]],"caution":["不要把對古代猶大的控訴移作對任何民族的定罪。","Do not transfer charges against ancient Judah onto a modern people."],"question":["哪一節最能支持「責備與邀請在同章交錯。」的觀察？","Which verse best supports the observation “Rebuke and invitation coexist.”?"]},{"n":4,"refs":"4","title":["北方災禍","Disaster from the north"],"summary":["號角與荒涼圖像描述入侵，先知為百姓痛心。","Trumpets and desolation depict invasion as the prophet grieves."],"deep":[["先知不是冷眼旁觀審判。","The prophet does not observe judgment coldly."],["婚約與水泉意象呈現背約的關係層面。","Marriage and spring imagery make covenant failure relational."]],"caution":["不要把對古代猶大的控訴移作對任何民族的定罪。","Do not transfer charges against ancient Judah onto a modern people."],"question":["哪一節最能支持「先知不是冷眼旁觀審判。」的觀察？","Which verse best supports the observation “The prophet does not observe judgment coldly.”?"]},{"n":5,"refs":"5","title":["公義何處可尋","Where is justice?"],"summary":["街上尋不著誠實公義，領袖和先知共同助長欺壓。","The search for justice fails as leaders and prophets enable oppression."],"deep":[["群體敗壞也有制度層面。","Communal wrong has institutional dimensions."],["婚約與水泉意象呈現背約的關係層面。","Marriage and spring imagery make covenant failure relational."]],"caution":["不要把對古代猶大的控訴移作對任何民族的定罪。","Do not transfer charges against ancient Judah onto a modern people."],"question":["哪一節最能支持「群體敗壞也有制度層面。」的觀察？","Which verse best supports the observation “Communal wrong has institutional dimensions.”?"]},{"n":6,"refs":"6","title":["古道與拒聽","Ancient paths rejected"],"summary":["守望者警報與平安平安的空話對照；百姓拒絕古道。","Watchmen warn while empty claims of peace mask refusal to walk the ancient path."],"deep":[["「平安」須面對真實傷口。","Peace language must confront real wounds."],["婚約與水泉意象呈現背約的關係層面。","Marriage and spring imagery make covenant failure relational."]],"caution":["不要把對古代猶大的控訴移作對任何民族的定罪。","Do not transfer charges against ancient Judah onto a modern people."],"question":["哪一節最能支持「「平安」須面對真實傷口。」的觀察？","Which verse best supports the observation “Peace language must confront real wounds.”?"]},{"n":7,"refs":"7","title":["聖殿講章","Temple sermon"],"summary":["先知在殿門控訴欺壓寄居者、孤兒寡婦，否定建築可保安全。","At the temple gate, the prophet condemns oppression and denies that the building guarantees safety."],"deep":[["示羅是對虛假安全感的歷史反證。","Shiloh counters false confidence in sacred space."],["示羅的記憶挑戰不可毀壞的安全幻覺。","Memory of Shiloh challenges invulnerability claims."]],"caution":["聖殿批判並非對敬拜本身的否定。","Criticism of the temple does not reject worship itself."],"question":["哪一節最能支持「示羅是對虛假安全感的歷史反證。」的觀察？","Which verse best supports the observation “Shiloh counters false confidence in sacred space.”?"]},{"n":8,"refs":"8","title":["無醫治的傷","The unhealed wound"],"summary":["犯罪與拒悔使傷口仍在；先知以悲傷追問是否有醫治。","Refusal to repent leaves a wound unhealed; the prophet mourns and asks about healing."],"deep":[["哀哭是對苦難有感的神學回應。","Grief is a theological response to suffering."],["示羅的記憶挑戰不可毀壞的安全幻覺。","Memory of Shiloh challenges invulnerability claims."]],"caution":["聖殿批判並非對敬拜本身的否定。","Criticism of the temple does not reject worship itself."],"question":["哪一節最能支持「哀哭是對苦難有感的神學回應。」的觀察？","Which verse best supports the observation “Grief is a theological response to suffering.”?"]},{"n":9,"refs":"9","title":["誇口與真知識","Boasting and true knowledge"],"summary":["哭泣延續；人不可誇智慧權勢財富，而要認識施慈愛公義的神。","Lament continues; boasting in wisdom, might, or wealth yields to knowing God’s justice and love."],"deep":[["認識神須呈現慈愛、公平與公義。","Knowing God is measured by love and justice."],["示羅的記憶挑戰不可毀壞的安全幻覺。","Memory of Shiloh challenges invulnerability claims."]],"caution":["聖殿批判並非對敬拜本身的否定。","Criticism of the temple does not reject worship itself."],"question":["哪一節最能支持「認識神須呈現慈愛、公平與公義。」的觀察？","Which verse best supports the observation “Knowing God is measured by love and justice.”?"]},{"n":10,"refs":"10","title":["真神與偶像","Living God and idols"],"summary":["人手所造的偶像無力，創造天地的神與之形成鮮明對照。","Handmade idols are powerless beside the Creator of heaven and earth."],"deep":[["對比焦點是誰能創造、言說與行動。","The contrast asks who can create, speak, and act."],["示羅的記憶挑戰不可毀壞的安全幻覺。","Memory of Shiloh challenges invulnerability claims."]],"caution":["聖殿批判並非對敬拜本身的否定。","Criticism of the temple does not reject worship itself."],"question":["哪一節最能支持「對比焦點是誰能創造、言說與行動。」的觀察？","Which verse best supports the observation “The contrast asks who can create, speak, and act.”?"]},{"n":11,"refs":"11","title":["背約與陰謀","Covenant broken and plot"],"summary":["盟約的話被違背，亞拿突人謀害耶利米。","The covenant is broken and people of Anathoth plot against Jeremiah."],"deep":[["對先知的暴力也是拒絕信息的一部分。","Violence against the prophet is part of rejecting the message."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「對先知的暴力也是拒絕信息的一部分。」的觀察？","Which verse best supports the observation “Violence against the prophet is part of rejecting the message.”?"]},{"n":12,"refs":"12","title":["為何惡人亨通","Why do the wicked prosper?"],"summary":["耶利米質問惡人安穩，回答要求他在更艱難的路上持守。","Jeremiah questions wicked prosperity and hears of harder trials ahead."],"deep":[["先知可把困惑帶進禱告。","The prophet can bring perplexity to prayer."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「先知可把困惑帶進禱告。」的觀察？","Which verse best supports the observation “The prophet can bring perplexity to prayer.”?"]},{"n":13,"refs":"13","title":["腰帶與驕傲","Linen belt and pride"],"summary":["腐壞腰帶和酒器象徵猶大的驕傲與失去原本使命。","A ruined belt and wine jars portray Judah’s pride and lost purpose."],"deep":[["物件行動揭露關係破裂。","The symbolic act makes relational damage visible."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「物件行動揭露關係破裂。」的觀察？","Which verse best supports the observation “The symbolic act makes relational damage visible.”?"]},{"n":14,"refs":"14","title":["旱災與真假信息","Drought and rival messages"],"summary":["旱災使地與人民哀哭；假先知保證平安，耶利米代求。","Drought brings mourning while rival prophets promise peace and Jeremiah intercedes."],"deep":[["自然災害與政治謊言都影響弱者。","Drought and false assurance both harm the vulnerable."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「自然災害與政治謊言都影響弱者。」的觀察？","Which verse best supports the observation “Drought and false assurance both harm the vulnerable.”?"]},{"n":15,"refs":"15","title":["孤立先知的申訴","A lonely prophet’s complaint"],"summary":["耶利米承受孤立與痛楚，神再次呼召他回轉並說話。","Jeremiah laments isolation and pain and is recommissioned to speak."],"deep":[["蒙召不免除情緒與關係成本。","Calling does not remove emotional and social cost."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「蒙召不免除情緒與關係成本。」的觀察？","Which verse best supports the observation “Calling does not remove emotional and social cost.”?"]},{"n":16,"refs":"16","title":["不婚與將來歸回","Unmarried sign and future return"],"summary":["耶利米不婚作災難記號；審判後又宣告從列國召回。","Jeremiah’s unmarried life becomes a sign of disaster, followed by promised gathering."],"deep":[["象徵行動涉及先知自身生命的代價。","The sign act costs the prophet personally."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「象徵行動涉及先知自身生命的代價。」的觀察？","Which verse best supports the observation “The sign act costs the prophet personally.”?"]},{"n":17,"refs":"17","title":["刻在心上的罪","Sin engraved on the heart"],"summary":["人心、信靠、安息日與公義相連；倚靠神者如水旁之樹。","Heart, trust, Sabbath, and justice intersect; the trusting person is like a watered tree."],"deep":[["「人心詭詐」置於信靠與行為脈絡閱讀。","Read the deceitful-heart claim amid trust and conduct."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「「人心詭詐」置於信靠與行為脈絡閱讀。」的觀察？","Which verse best supports the observation “Read the deceitful-heart claim amid trust and conduct.”?"]},{"n":18,"refs":"18","title":["窯匠與陶土","Potter and clay"],"summary":["窯匠重作器皿，說明列國可因回轉而改變審判走向。","The potter remakes clay, illustrating that national outcomes can change with response."],"deep":[["比喻強調回應的可能，不是宿命。","The image emphasizes response rather than fatalism."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「比喻強調回應的可能，不是宿命。」的觀察？","Which verse best supports the observation “The image emphasizes response rather than fatalism.”?"]},{"n":19,"refs":"19","title":["打碎的瓶","Shattered jar"],"summary":["耶利米在欣嫩谷打碎瓶子，宣告城將因暴力與偶像敬拜受創。","Jeremiah breaks a jar in the Hinnom Valley to depict a city broken by violence and idolatry."],"deep":[["不可修補的瓶強化警告迫切性。","The irreparable jar intensifies the warning."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「不可修補的瓶強化警告迫切性。」的觀察？","Which verse best supports the observation “The irreparable jar intensifies the warning.”?"]},{"n":20,"refs":"20","title":["枷鎖與心中的火","Stocks and fire within"],"summary":["巴施戶珥拘禁先知；耶利米痛陳被嘲笑又無法止住神的話。","Pashhur confines the prophet; Jeremiah grieves mockery but cannot suppress the burning word."],"deep":[["末段的絕望與使命感必須一起聽見。","Hear both anguish and compulsion in the ending."],["先知的真實禱告包含困惑，不只是確定感。","Prophetic prayer includes distress, not only certainty."]],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."],"question":["哪一節最能支持「末段的絕望與使命感必須一起聽見。」的觀察？","Which verse best supports the observation “Hear both anguish and compulsion in the ending.”?"]},{"n":21,"refs":"21","title":["城的兩條路","Two ways for the city"],"summary":["西底家求問，耶利米宣告降服得生與抗拒致死，並責備王室。","Zedekiah asks for help; Jeremiah offers life through surrender and rebukes the royal house."],"deep":[["此處的選擇面對特定圍城，不宜抽象套用。","The choice addresses a particular siege, not every conflict."],["分辨預言要看是否面對不義和真實處境。","Test prophecy by its treatment of injustice and reality."]],"caution":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."],"question":["哪一節最能支持「此處的選擇面對特定圍城，不宜抽象套用。」的觀察？","Which verse best supports the observation “The choice addresses a particular siege, not every conflict.”?"]},{"n":22,"refs":"22","title":["君王與弱者","Kings and the vulnerable"],"summary":["君王須伸張公平，約雅敬的奢華與父親照顧窮人的榜樣對比。","Kings must act justly; Jehoiakim’s luxury contrasts with his father’s care for the poor."],"deep":[["王權的標準是為窮乏者伸冤。","Royal power is measured by justice for the poor."],["分辨預言要看是否面對不義和真實處境。","Test prophecy by its treatment of injustice and reality."]],"caution":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."],"question":["哪一節最能支持「王權的標準是為窮乏者伸冤。」的觀察？","Which verse best supports the observation “Royal power is measured by justice for the poor.”?"]},{"n":23,"refs":"23","title":["牧者與公義的苗裔","Shepherds and righteous branch"],"summary":["失職牧者遭責，公義苗裔受盼望；假先知編造平安夢。","Failed shepherds face judgment, a just branch is promised, and false prophets invent reassuring dreams."],"deep":[["真信息不能把群體傷口說成已痊癒。","True speech cannot call an unhealed wound healed."],["分辨預言要看是否面對不義和真實處境。","Test prophecy by its treatment of injustice and reality."]],"caution":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."],"question":["哪一節最能支持「真信息不能把群體傷口說成已痊癒。」的觀察？","Which verse best supports the observation “True speech cannot call an unhealed wound healed.”?"]},{"n":24,"refs":"24","title":["兩筐無花果","Two baskets of figs"],"summary":["好果象徵先前被擄者仍有歸回盼望，壞果指拒聽者。","Good figs represent exiles with a future; bad figs portray those refusing the warning."],"deep":[["流亡者未被神遺忘。","Exiles are not abandoned."],["分辨預言要看是否面對不義和真實處境。","Test prophecy by its treatment of injustice and reality."]],"caution":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."],"question":["哪一節最能支持「流亡者未被神遺忘。」的觀察？","Which verse best supports the observation “Exiles are not abandoned.”?"]},{"n":25,"refs":"25","title":["七十年與列國之杯","Seventy years and cup of nations"],"summary":["多年警告不被聽從，巴比倫掌權一段時期後也要受審。","Years of warnings go unheeded; Babylon rules for a time and then faces judgment."],"deep":[["神使用帝國不代表認可帝國暴行。","Using an empire does not approve its violence."],["分辨預言要看是否面對不義和真實處境。","Test prophecy by its treatment of injustice and reality."]],"caution":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."],"question":["哪一節最能支持「神使用帝國不代表認可帝國暴行。」的觀察？","Which verse best supports the observation “Using an empire does not approve its violence.”?"]},{"n":26,"refs":"26","title":["講章引發審判","Trial over the temple sermon"],"summary":["殿門講章使先知被告，長老引述彌迦作為保護性先例。","The temple sermon leads to trial; elders cite Micah as precedent for restraint."],"deep":[["公共爭辯中保存不同先知聲音。","Public debate preserves prophetic counterexamples."],["分辨預言要看是否面對不義和真實處境。","Test prophecy by its treatment of injustice and reality."]],"caution":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."],"question":["哪一節最能支持「公共爭辯中保存不同先知聲音。」的觀察？","Which verse best supports the observation “Public debate preserves prophetic counterexamples.”?"]},{"n":27,"refs":"27","title":["木軛與列國","Yoke and nations"],"summary":["耶利米戴木軛勸列國暫服巴比倫，以免更大毀滅。","Jeremiah wears a yoke to urge temporary submission to Babylon."],"deep":[["象徵行動說的是特定政治時刻。","The sign addresses a particular political moment."],["分辨預言要看是否面對不義和真實處境。","Test prophecy by its treatment of injustice and reality."]],"caution":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."],"question":["哪一節最能支持「象徵行動說的是特定政治時刻。」的觀察？","Which verse best supports the observation “The sign addresses a particular political moment.”?"]},{"n":28,"refs":"28","title":["哈拿尼雅折軛","Hananiah breaks the yoke"],"summary":["哈拿尼雅預言迅速歸回並折木軛；耶利米回以鐵軛與結果的檢驗。","Hananiah predicts quick return and breaks the wooden yoke; Jeremiah answers with iron."],"deep":[["願望強烈不等於信息真實。","A desired outcome does not validate a message."],["分辨預言要看是否面對不義和真實處境。","Test prophecy by its treatment of injustice and reality."]],"caution":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."],"question":["哪一節最能支持「願望強烈不等於信息真實。」的觀察？","Which verse best supports the observation “A desired outcome does not validate a message.”?"]},{"n":29,"refs":"29","title":["給被擄者的信","Letter to exiles"],"summary":["耶利米要流亡者建屋、栽種、求城平安，等待神所定時期。","Exiles are told to build, plant, seek the city’s welfare, and endure a long wait."],"deep":[["盼望包含當下的安居與共同利益。","Hope includes present life and the common good."],["分辨預言要看是否面對不義和真實處境。","Test prophecy by its treatment of injustice and reality."]],"caution":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."],"question":["哪一節最能支持「盼望包含當下的安居與共同利益。」的觀察？","Which verse best supports the observation “Hope includes present life and the common good.”?"]},{"n":30,"refs":"30","title":["傷口與復興","Wound and restoration"],"summary":["雅各的痛深且無人醫治，神仍應許折斷軛、重建城。","Jacob’s wound is severe, yet God promises release and rebuilding."],"deep":[["醫治承認傷口深度。","Healing begins by naming the wound."],["31:31–34 的新約連結赦罪、認識神與群體更新。","The new covenant joins forgiveness, knowing God, and communal renewal."]],"caution":["不可藉「新約」抹去猶太群體與原本受話者。","Do not erase Jewish communities or the original addressees."],"question":["哪一節最能支持「醫治承認傷口深度。」的觀察？","Which verse best supports the observation “Healing begins by naming the wound.”?"]},{"n":31,"refs":"31","title":["新約寫在心上","New covenant on hearts"],"summary":["拉結哭兒女，散居者歸回；神應許赦免並將律法寫入心。","Rachel mourns children, exiles return, and God promises forgiveness and law written on hearts."],"deep":[["新約回應破裂關係，不只提供新規則。","The new covenant repairs relationship, not merely rules."],["31:31–34 的新約連結赦罪、認識神與群體更新。","The new covenant joins forgiveness, knowing God, and communal renewal."]],"caution":["不可藉「新約」抹去猶太群體與原本受話者。","Do not erase Jewish communities or the original addressees."],"question":["哪一節最能支持「新約回應破裂關係，不只提供新規則。」的觀察？","Which verse best supports the observation “The new covenant repairs relationship, not merely rules.”?"]},{"n":32,"refs":"32","title":["買地作盼望記號","A field bought as hope"],"summary":["城正被圍，耶利米買亞拿突田地並保存契據，表明將來仍可買賣。","During siege, Jeremiah purchases a field and preserves deeds as a sign of future life."],"deep":[["具體行動使盼望可觸摸。","A concrete transaction makes hope tangible."],["31:31–34 的新約連結赦罪、認識神與群體更新。","The new covenant joins forgiveness, knowing God, and communal renewal."]],"caution":["不可藉「新約」抹去猶太群體與原本受話者。","Do not erase Jewish communities or the original addressees."],"question":["哪一節最能支持「具體行動使盼望可觸摸。」的觀察？","Which verse best supports the observation “A concrete transaction makes hope tangible.”?"]},{"n":33,"refs":"33","title":["重建與盟約","Rebuilding and covenant"],"summary":["神應許醫治城市，重申大衛家與祭司的未來。","God promises healing for the city and a future for Davidic and priestly service."],"deep":[["重建結合城市、敬拜與公義。","Restoration joins civic life, worship, and justice."],["31:31–34 的新約連結赦罪、認識神與群體更新。","The new covenant joins forgiveness, knowing God, and communal renewal."]],"caution":["不可藉「新約」抹去猶太群體與原本受話者。","Do not erase Jewish communities or the original addressees."],"question":["哪一節最能支持「重建結合城市、敬拜與公義。」的觀察？","Which verse best supports the observation “Restoration joins civic life, worship, and justice.”?"]},{"n":34,"refs":"34","title":["釋奴又反悔","Slaves freed and seized again"],"summary":["王與百姓曾釋放希伯來奴僕，危機稍緩又把人抓回。","Leaders free Hebrew slaves, then seize them again when pressure eases."],"deep":[["用人的自由衡量悔改是否真實。","The treatment of freed people tests repentance."],["書卷被燒卻重新書寫，凸顯話語的延續。","The rewritten scroll signals the persistence of the message."]],"caution":["城陷不可被當作對所有災民的個別罪責裁決。","The fall does not assign individual guilt to every victim."],"question":["哪一節最能支持「用人的自由衡量悔改是否真實。」的觀察？","Which verse best supports the observation “The treatment of freed people tests repentance.”?"]},{"n":35,"refs":"35","title":["利甲族的忠誠","Rechabite fidelity"],"summary":["利甲族守祖訓拒酒，與猶大拒聽先知話形成對照。","The Rechabites keep ancestral instruction, contrasting with Judah’s refusal to listen."],"deep":[["對比焦點在聽從，不在酒的普遍禁令。","The contrast concerns listening, not a universal alcohol rule."],["書卷被燒卻重新書寫，凸顯話語的延續。","The rewritten scroll signals the persistence of the message."]],"caution":["城陷不可被當作對所有災民的個別罪責裁決。","The fall does not assign individual guilt to every victim."],"question":["哪一節最能支持「對比焦點在聽從，不在酒的普遍禁令。」的觀察？","Which verse best supports the observation “The contrast concerns listening, not a universal alcohol rule.”?"]},{"n":36,"refs":"36","title":["被焚仍重寫的書卷","The scroll burned and rewritten"],"summary":["巴錄讀出耶利米話語，約雅敬割燒書卷，信息卻被重新記錄。","Baruch reads the scroll; Jehoiakim burns it, but the message is written again."],"deep":[["王能燒媒介，不能抹去警告。","The king can burn a medium, not erase the warning."],["書卷被燒卻重新書寫，凸顯話語的延續。","The rewritten scroll signals the persistence of the message."]],"caution":["城陷不可被當作對所有災民的個別罪責裁決。","The fall does not assign individual guilt to every victim."],"question":["哪一節最能支持「王能燒媒介，不能抹去警告。」的觀察？","Which verse best supports the observation “The king can burn a medium, not erase the warning.”?"]},{"n":37,"refs":"37","title":["被誤控的先知","The prophet falsely accused"],"summary":["耶利米因疑似投敵被逮捕，西底家暗中詢問後將他監禁。","Jeremiah is arrested on a false defection charge; Zedekiah consults him privately and confines him."],"deep":[["政治恐懼使真話成危險行為。","Political fear makes honest speech dangerous."],["書卷被燒卻重新書寫，凸顯話語的延續。","The rewritten scroll signals the persistence of the message."]],"caution":["城陷不可被當作對所有災民的個別罪責裁決。","The fall does not assign individual guilt to every victim."],"question":["哪一節最能支持「政治恐懼使真話成危險行為。」的觀察？","Which verse best supports the observation “Political fear makes honest speech dangerous.”?"]},{"n":38,"refs":"38","title":["井中的耶利米","Jeremiah in the cistern"],"summary":["官長把耶利米下在淤泥井裡；以伯米勒冒險救出他。","Officials lower Jeremiah into a muddy cistern; Ebed-melech risks helping him."],"deep":[["外來者的勇氣與本國領袖失職成對比。","An outsider’s courage contrasts with leaders’ failure."],["書卷被燒卻重新書寫，凸顯話語的延續。","The rewritten scroll signals the persistence of the message."]],"caution":["城陷不可被當作對所有災民的個別罪責裁決。","The fall does not assign individual guilt to every victim."],"question":["哪一節最能支持「外來者的勇氣與本國領袖失職成對比。」的觀察？","Which verse best supports the observation “An outsider’s courage contrasts with leaders’ failure.”?"]},{"n":39,"refs":"39","title":["耶路撒冷陷落","Jerusalem falls"],"summary":["巴比倫攻破城，西底家被擄，先知與以伯米勒得到保全。","Babylon breaches the city, Zedekiah is taken, and Jeremiah and Ebed-melech survive."],"deep":[["個別保全不能減輕全城災難。","Individual survival does not erase civic catastrophe."],["書卷被燒卻重新書寫，凸顯話語的延續。","The rewritten scroll signals the persistence of the message."]],"caution":["城陷不可被當作對所有災民的個別罪責裁決。","The fall does not assign individual guilt to every victim."],"question":["哪一節最能支持「個別保全不能減輕全城災難。」的觀察？","Which verse best supports the observation “Individual survival does not erase civic catastrophe.”?"]},{"n":40,"refs":"40","title":["基大利與倖存者","Gedaliah and survivors"],"summary":["基大利受命治理留下的人，邀請流散者收成；暗殺警報浮現。","Gedaliah governs survivors and invites return for harvest as an assassination warning arises."],"deep":[["戰後重建極其脆弱。","Postwar rebuilding is fragile."],["政治暴力與恐懼使倖存者的選擇格外艱難。","Political violence and fear complicate survivors’ choices."]],"caution":["不要把受驚群體的選擇簡化成膽怯。","Do not flatten terrified survivors into cowards."],"question":["哪一節最能支持「戰後重建極其脆弱。」的觀察？","Which verse best supports the observation “Postwar rebuilding is fragile.”?"]},{"n":41,"refs":"41","title":["基大利被殺","Gedaliah murdered"],"summary":["以實瑪利殺害基大利及多名人，約哈難追擊，餘民恐懼報復。","Ishmael kills Gedaliah and others; Johanan pursues him as survivors fear reprisals."],"deep":[["暴力會破壞剛萌芽的安定。","Violence destroys fragile stability."],["政治暴力與恐懼使倖存者的選擇格外艱難。","Political violence and fear complicate survivors’ choices."]],"caution":["不要把受驚群體的選擇簡化成膽怯。","Do not flatten terrified survivors into cowards."],"question":["哪一節最能支持「暴力會破壞剛萌芽的安定。」的觀察？","Which verse best supports the observation “Violence destroys fragile stability.”?"]},{"n":42,"refs":"42","title":["求問後拒聽","Asking yet refusing"],"summary":["餘民請耶利米求問神，得到留地而非赴埃及的勸告。","Survivors ask Jeremiah to seek God and hear counsel to remain rather than flee to Egypt."],"deep":[["求問的真誠也要由是否願聽來檢驗。","The willingness to listen tests the inquiry."],["政治暴力與恐懼使倖存者的選擇格外艱難。","Political violence and fear complicate survivors’ choices."]],"caution":["不要把受驚群體的選擇簡化成膽怯。","Do not flatten terrified survivors into cowards."],"question":["哪一節最能支持「求問的真誠也要由是否願聽來檢驗。」的觀察？","Which verse best supports the observation “The willingness to listen tests the inquiry.”?"]},{"n":43,"refs":"43","title":["逃往埃及","Flight to Egypt"],"summary":["領袖否認耶利米的話，帶餘民和先知赴埃及；先知埋石預告戰禍。","Leaders reject Jeremiah and take survivors to Egypt; he buries stones to signal future war."],"deep":[["逃避危險的選擇仍帶著恐懼與責任。","Flight reflects both fear and responsibility."],["政治暴力與恐懼使倖存者的選擇格外艱難。","Political violence and fear complicate survivors’ choices."]],"caution":["不要把受驚群體的選擇簡化成膽怯。","Do not flatten terrified survivors into cowards."],"question":["哪一節最能支持「逃避危險的選擇仍帶著恐懼與責任。」的觀察？","Which verse best supports the observation “Flight reflects both fear and responsibility.”?"]},{"n":44,"refs":"44","title":["埃及的爭辯","Debate in Egypt"],"summary":["群體為敬拜天后辯護，耶利米把災禍與偶像敬拜相連。","In Egypt, people defend worship of the queen of heaven while Jeremiah disputes them."],"deep":[["先聽見群體如何解讀自身災難，再評估先知回應。","Hear the people’s reading of disaster before weighing the prophetic reply."],["政治暴力與恐懼使倖存者的選擇格外艱難。","Political violence and fear complicate survivors’ choices."]],"caution":["不要把受驚群體的選擇簡化成膽怯。","Do not flatten terrified survivors into cowards."],"question":["哪一節最能支持「先聽見群體如何解讀自身災難，再評估先知回應。」的觀察？","Which verse best supports the observation “Hear the people’s reading of disaster before weighing the prophetic reply.”?"]},{"n":45,"refs":"45","title":["給巴錄的信息","Word for Baruch"],"summary":["巴錄因辛勞而悲傷；神沒有應許地位，卻應許在動亂中保全生命。","Baruch grieves his toil; he is promised life rather than prestige amid upheaval."],"deep":[["默默記錄者也有自己的恐懼。","The scribe has fears of his own."],["政治暴力與恐懼使倖存者的選擇格外艱難。","Political violence and fear complicate survivors’ choices."]],"caution":["不要把受驚群體的選擇簡化成膽怯。","Do not flatten terrified survivors into cowards."],"question":["哪一節最能支持「默默記錄者也有自己的恐懼。」的觀察？","Which verse best supports the observation “The scribe has fears of his own.”?"]},{"n":46,"refs":"46","title":["埃及的敗退","Egypt’s defeat"],"summary":["法老軍在迦基米施受挫，埃及的力量也受神審視。","Pharaoh’s army loses at Carchemish, and Egypt’s power is judged."],"deep":[["猶大依賴的強國並不可靠。","Judah’s favored power cannot guarantee security."],["巴比倫從神的工具變成受審對象。","Babylon moves from instrument to judged empire."]],"caution":["古代列國諭言不可直接貼到當代國家。","Do not map ancient national oracles directly onto present countries."],"question":["哪一節最能支持「猶大依賴的強國並不可靠。」的觀察？","Which verse best supports the observation “Judah’s favored power cannot guarantee security.”?"]},{"n":47,"refs":"47","title":["非利士受審","Philistia judged"],"summary":["北方洪水意象席捲非利士地，哀聲遍及沿海。","A flood from the north sweeps Philistia and grief reaches the coast."],"deep":[["戰爭圖像聚焦受害者的哀聲。","War imagery makes victims’ cries audible."],["巴比倫從神的工具變成受審對象。","Babylon moves from instrument to judged empire."]],"caution":["古代列國諭言不可直接貼到當代國家。","Do not map ancient national oracles directly onto present countries."],"question":["哪一節最能支持「戰爭圖像聚焦受害者的哀聲。」的觀察？","Which verse best supports the observation “War imagery makes victims’ cries audible.”?"]},{"n":48,"refs":"48","title":["摩押的驕傲與哀哭","Moab’s pride and lament"],"summary":["摩押因驕傲受審，篇章同時為其城邑哭泣，末尾仍有歸回話語。","Moab’s pride is judged, yet its towns are mourned and an ending promises future restoration."],"deep":[["對敵國的審判與哀憫可以並存。","Judgment of a rival can coexist with compassion."],["巴比倫從神的工具變成受審對象。","Babylon moves from instrument to judged empire."]],"caution":["古代列國諭言不可直接貼到當代國家。","Do not map ancient national oracles directly onto present countries."],"question":["哪一節最能支持「對敵國的審判與哀憫可以並存。」的觀察？","Which verse best supports the observation “Judgment of a rival can coexist with compassion.”?"]},{"n":49,"refs":"49","title":["周邊諸國","Neighboring nations"],"summary":["亞捫、以東、大馬士革、基達、夏瑣與以攔各有諭言。","Oracles address Ammon, Edom, Damascus, Kedar, Hazor, and Elam."],"deep":[["不同城邦的處境不可混成單一敵人。","Distinct peoples should not be collapsed into one enemy."],["巴比倫從神的工具變成受審對象。","Babylon moves from instrument to judged empire."]],"caution":["古代列國諭言不可直接貼到當代國家。","Do not map ancient national oracles directly onto present countries."],"question":["哪一節最能支持「不同城邦的處境不可混成單一敵人。」的觀察？","Which verse best supports the observation “Distinct peoples should not be collapsed into one enemy.”?"]},{"n":50,"refs":"50","title":["巴比倫必傾覆","Babylon will fall"],"summary":["曾攻破猶大的帝國也成審判對象，以色列與猶大被召歸回。","The empire that conquered Judah is itself judged as Israel and Judah are called home."],"deep":[["神使用強權不使它免於問責。","An instrument of judgment remains accountable."],["巴比倫從神的工具變成受審對象。","Babylon moves from instrument to judged empire."]],"caution":["古代列國諭言不可直接貼到當代國家。","Do not map ancient national oracles directly onto present countries."],"question":["哪一節最能支持「神使用強權不使它免於問責。」的觀察？","Which verse best supports the observation “An instrument of judgment remains accountable.”?"]},{"n":51,"refs":"51","title":["巴比倫的終局","Babylon’s end"],"summary":["長篇諭言宣告巴比倫崩潰；書卷繫石沉入幼發拉底河。","A long oracle announces Babylon’s fall; a scroll tied to a stone sinks into the Euphrates."],"deep":[["象徵動作讓帝國的短暫可見。","The symbolic act makes imperial impermanence visible."],["巴比倫從神的工具變成受審對象。","Babylon moves from instrument to judged empire."]],"caution":["古代列國諭言不可直接貼到當代國家。","Do not map ancient national oracles directly onto present countries."],"question":["哪一節最能支持「象徵動作讓帝國的短暫可見。」的觀察？","Which verse best supports the observation “The symbolic act makes imperial impermanence visible.”?"]},{"n":52,"refs":"52","title":["城陷的附錄","Appendix on the fall"],"summary":["耶路撒冷與聖殿被毀，流亡名單列出；約雅斤在巴比倫獲釋。","Jerusalem and temple are destroyed, deportations listed, and Jehoiachin released in Babylon."],"deep":[["微弱結尾不抹去被擄與失去家園的事實。","The small opening does not erase exile and loss."],["巴比倫從神的工具變成受審對象。","Babylon moves from instrument to judged empire."]],"caution":["古代列國諭言不可直接貼到當代國家。","Do not map ancient national oracles directly onto present countries."],"question":["哪一節最能支持「微弱結尾不抹去被擄與失去家園的事實。」的觀察？","Which verse best supports the observation “The small opening does not erase exile and loss.”?"]}],"themesIntro":["以下主題由耶利米書的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of Jeremiah and complement the chapter studies."],"themes":[{"refs":"1–6","title":["蒙召與婚約破裂","Call and broken covenant"],"body":["先知奉召拆毀與栽植，控訴百姓離棄活水並宣告北方災禍。","The prophet is called to uproot and plant, condemning forsaken living water and warning of danger from the north."],"caution":["不要把對古代猶大的控訴移作對任何民族的定罪。","Do not transfer charges against ancient Judah onto a modern people."]},{"refs":"11–20","title":["盟約、衝突與孤獨","Covenant, conflict, and isolation"],"body":["背約、暗殺圖謀、先知的控訴與監禁交替；神的話如火。","Broken covenant, plots, complaints, and confinement alternate; the word burns like fire."],"caution":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."]},{"refs":"30–33","title":["安慰之書與新約","Book of consolation and new covenant"],"body":["雅各的傷得醫治，散居者聚集，新約寫在心上；買地行動預示未來。","Jacob’s wounds heal, the scattered return, covenant is written on hearts, and a field purchase enacts hope."],"caution":["不可藉「新約」抹去猶太群體與原本受話者。","Do not erase Jewish communities or the original addressees."]},{"refs":"40–45","title":["流亡後的餘民與巴錄","Remnant after the fall and Baruch"],"body":["基大利被殺，餘民逃埃及；耶利米仍勸聽，巴錄也得到個人信息。","Gedaliah is murdered, survivors flee to Egypt, Jeremiah keeps speaking, and Baruch receives a word."],"caution":["不要把受驚群體的選擇簡化成膽怯。","Do not flatten terrified survivors into cowards."]},{"refs":"46–52","title":["列國諭言與歷史附錄","Nations and historical appendix"],"body":["埃及至巴比倫的諭言表明帝國也受審；末章重述城陷與被擄。","Oracles from Egypt to Babylon judge empires; the final chapter recounts the fall and exile."],"caution":["古代列國諭言不可直接貼到當代國家。","Do not map ancient national oracles directly onto present countries."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["哀哭、受迫害與被擄不能被簡化成個人失敗；討論審判時同時看見領袖責任和無辜者的痛。","Do not reduce grief, persecution, or exile to personal failure; notice leaders’ responsibility and the suffering of innocents."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–6","title":["第 1 課｜蒙召與婚約破裂","Lesson 1 | Call and broken covenant"],"aim":["先知奉召拆毀與栽植，控訴百姓離棄活水並宣告北方災禍。","The prophet is called to uproot and plant, condemning forsaken living water and warning of danger from the north."],"flow":[["讀 1 章：使命同時包括審判與重建。","Read chapter 1: The commission includes judgment and restoration."],["對照 1–6 章：婚約與水泉意象呈現背約的關係層面。","Compare chapters 1–6: Marriage and spring imagery make covenant failure relational."],["討論：哪一節最能支持「「平安」須面對真實傷口。」的觀察？","Discuss: Which verse best supports the observation “Peace language must confront real wounds.”?"]],"question":["哪一節最能支持「使命同時包括審判與重建。」的觀察？","Which verse best supports the observation “The commission includes judgment and restoration.”?"],"practice":["不要把對古代猶大的控訴移作對任何民族的定罪。","Do not transfer charges against ancient Judah onto a modern people."]},{"refs":"7–10","title":["第 2 課｜聖殿講章與偶像","Lesson 2 | Temple sermon and idols"],"aim":["聖殿不能作不義的護身符；先知哀哭，偶像被指出無力。","The temple cannot shield injustice; the prophet weeps and exposes powerless idols."],"flow":[["讀 7 章：示羅是對虛假安全感的歷史反證。","Read chapter 7: Shiloh counters false confidence in sacred space."],["對照 7–10 章：示羅的記憶挑戰不可毀壞的安全幻覺。","Compare chapters 7–10: Memory of Shiloh challenges invulnerability claims."],["討論：哪一節最能支持「對比焦點是誰能創造、言說與行動。」的觀察？","Discuss: Which verse best supports the observation “The contrast asks who can create, speak, and act.”?"]],"question":["哪一節最能支持「示羅是對虛假安全感的歷史反證。」的觀察？","Which verse best supports the observation “Shiloh counters false confidence in sacred space.”?"],"practice":["聖殿批判並非對敬拜本身的否定。","Criticism of the temple does not reject worship itself."]},{"refs":"11–20","title":["第 3 課｜盟約、衝突與孤獨","Lesson 3 | Covenant, conflict, and isolation"],"aim":["背約、暗殺圖謀、先知的控訴與監禁交替；神的話如火。","Broken covenant, plots, complaints, and confinement alternate; the word burns like fire."],"flow":[["讀 11 章：對先知的暴力也是拒絕信息的一部分。","Read chapter 11: Violence against the prophet is part of rejecting the message."],["對照 11–20 章：先知的真實禱告包含困惑，不只是確定感。","Compare chapters 11–20: Prophetic prayer includes distress, not only certainty."],["討論：哪一節最能支持「末段的絕望與使命感必須一起聽見。」的觀察？","Discuss: Which verse best supports the observation “Hear both anguish and compulsion in the ending.”?"]],"question":["哪一節最能支持「對先知的暴力也是拒絕信息的一部分。」的觀察？","Which verse best supports the observation “Violence against the prophet is part of rejecting the message.”?"],"practice":["耶利米的痛苦不可浪漫化為服事者必須忍受虐待。","Do not romanticize his suffering as a demand to endure abuse."]},{"refs":"21–29","title":["第 4 課｜君王、假先知與流亡者","Lesson 4 | Kings, false prophets, and exiles"],"aim":["統治者受責，真假平安話語碰撞；給流亡者的信勸其在異地求城的平安。","Rulers face judgment, rival claims of peace clash, and exiles are told to seek the city’s welfare."],"flow":[["讀 21 章：此處的選擇面對特定圍城，不宜抽象套用。","Read chapter 21: The choice addresses a particular siege, not every conflict."],["對照 21–29 章：分辨預言要看是否面對不義和真實處境。","Compare chapters 21–29: Test prophecy by its treatment of injustice and reality."],["討論：哪一節最能支持「盼望包含當下的安居與共同利益。」的觀察？","Discuss: Which verse best supports the observation “Hope includes present life and the common good.”?"]],"question":["哪一節最能支持「此處的選擇面對特定圍城，不宜抽象套用。」的觀察？","Which verse best supports the observation “The choice addresses a particular siege, not every conflict.”?"],"practice":["29 章的七十年不是給個人快速成功的時間表。","The seventy years are no timetable for personal success."]},{"refs":"30–33","title":["第 5 課｜安慰之書與新約","Lesson 5 | Book of consolation and new covenant"],"aim":["雅各的傷得醫治，散居者聚集，新約寫在心上；買地行動預示未來。","Jacob’s wounds heal, the scattered return, covenant is written on hearts, and a field purchase enacts hope."],"flow":[["讀 30 章：醫治承認傷口深度。","Read chapter 30: Healing begins by naming the wound."],["對照 30–33 章：31:31–34 的新約連結赦罪、認識神與群體更新。","Compare chapters 30–33: The new covenant joins forgiveness, knowing God, and communal renewal."],["討論：哪一節最能支持「重建結合城市、敬拜與公義。」的觀察？","Discuss: Which verse best supports the observation “Restoration joins civic life, worship, and justice.”?"]],"question":["哪一節最能支持「醫治承認傷口深度。」的觀察？","Which verse best supports the observation “Healing begins by naming the wound.”?"],"practice":["不可藉「新約」抹去猶太群體與原本受話者。","Do not erase Jewish communities or the original addressees."]},{"refs":"34–39","title":["第 6 課｜最後警告與城陷","Lesson 6 | Final warnings and fall"],"aim":["釋奴反悔、書卷焚毀、先知被囚；耶路撒冷終於陷落。","Reversed manumission, a burned scroll, imprisonment, and Jerusalem’s fall reveal failed leadership."],"flow":[["讀 34 章：用人的自由衡量悔改是否真實。","Read chapter 34: The treatment of freed people tests repentance."],["對照 34–39 章：書卷被燒卻重新書寫，凸顯話語的延續。","Compare chapters 34–39: The rewritten scroll signals the persistence of the message."],["討論：哪一節最能支持「個別保全不能減輕全城災難。」的觀察？","Discuss: Which verse best supports the observation “Individual survival does not erase civic catastrophe.”?"]],"question":["哪一節最能支持「用人的自由衡量悔改是否真實。」的觀察？","Which verse best supports the observation “The treatment of freed people tests repentance.”?"],"practice":["城陷不可被當作對所有災民的個別罪責裁決。","The fall does not assign individual guilt to every victim."]},{"refs":"40–45","title":["第 7 課｜流亡後的餘民與巴錄","Lesson 7 | Remnant after the fall and Baruch"],"aim":["基大利被殺，餘民逃埃及；耶利米仍勸聽，巴錄也得到個人信息。","Gedaliah is murdered, survivors flee to Egypt, Jeremiah keeps speaking, and Baruch receives a word."],"flow":[["讀 40 章：戰後重建極其脆弱。","Read chapter 40: Postwar rebuilding is fragile."],["對照 40–45 章：政治暴力與恐懼使倖存者的選擇格外艱難。","Compare chapters 40–45: Political violence and fear complicate survivors’ choices."],["討論：哪一節最能支持「默默記錄者也有自己的恐懼。」的觀察？","Discuss: Which verse best supports the observation “The scribe has fears of his own.”?"]],"question":["哪一節最能支持「戰後重建極其脆弱。」的觀察？","Which verse best supports the observation “Postwar rebuilding is fragile.”?"],"practice":["不要把受驚群體的選擇簡化成膽怯。","Do not flatten terrified survivors into cowards."]},{"refs":"46–52","title":["第 8 課｜列國諭言與歷史附錄","Lesson 8 | Nations and historical appendix"],"aim":["埃及至巴比倫的諭言表明帝國也受審；末章重述城陷與被擄。","Oracles from Egypt to Babylon judge empires; the final chapter recounts the fall and exile."],"flow":[["讀 46 章：猶大依賴的強國並不可靠。","Read chapter 46: Judah’s favored power cannot guarantee security."],["對照 46–52 章：巴比倫從神的工具變成受審對象。","Compare chapters 46–52: Babylon moves from instrument to judged empire."],["討論：哪一節最能支持「微弱結尾不抹去被擄與失去家園的事實。」的觀察？","Discuss: Which verse best supports the observation “The small opening does not erase exile and loss.”?"]],"question":["哪一節最能支持「猶大依賴的強國並不可靠。」的觀察？","Which verse best supports the observation “Judah’s favored power cannot guarantee security.”?"],"practice":["古代列國諭言不可直接貼到當代國家。","Do not map ancient national oracles directly onto present countries."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["耶利米書最常被忽略的人物是誰？為何？","Which character in Jeremiah is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜耶利米書導讀","BibleProject | Jeremiah guide"],"url":"https://bibleproject.com/guides/book-of-jeremiah/"}],"footer":["耶利米書 · 成人主日學教師版 · 請配合完整經文閱讀。","Jeremiah · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
