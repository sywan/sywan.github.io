<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="雅歌｜成人主日學教師版：全書總覽、逐章研讀、主題與八課教案。"><title>雅歌｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"SNG","name":["雅歌","Song of Songs"],"subtitle":["以愛情詩的眼光閱讀渴慕、尋找、互相欣賞與委身；尊重文本的詩性、歷代靈意讀法與現代課堂的牧養需要。","Read longing, searching, mutual delight, and commitment as love poetry, while respecting its literary form, historical interpretations, and pastoral needs."],"overviewIntro":["雅歌由多首彼此呼應的詩構成，女子、男子與群體聲音交織；書卷不必被強迫壓成一條毫無縫隙的故事線。","A sequence of interwoven poems brings together the woman, the man, and a chorus; it need not be forced into one seamless plot."],"lengthNote":["8 章；愛情詩歌，充滿花園、香氣、季節與尋找的意象。","Eight chapters of love poetry with gardens, fragrances, seasons, and searching."],"thesis":["愛是珍貴、強烈且不能買賣的禮物","Love is precious, powerful, and not for sale"],"thesisDetail":["詩歌肯定身體與彼此欣賞，也反覆提醒愛有其時機；8:6–7 以火與洪水收束全書的力量。書中有渴慕與失落，並非只有浪漫的理想化畫面。","The poems celebrate the body and mutual delight while repeatedly warning about timing. The fire-and-waters image in 8:6–7 gathers love’s power; longing and loss remain part of the book."],"keyQuestion":["如何在渴慕中尊重彼此與愛的時機？","How can desire honor each person and love’s timing?"],"keyAnswer":["先按古代愛情詩閱讀說話者、比喻與反覆句，再討論神學回聲。不要讓寓意解讀抹去文本對人的尊嚴、身體與互相性的重視。","First read speaker shifts, metaphors, and refrains as ancient love poetry; then consider theological echoes. Allegory should not erase dignity, embodiment, and mutuality."],"finalMovement":["8:6–7 宣告愛的強烈與不可購買；8:8–12 轉到守護與財富的對比；最後兩人的召喚沒有封閉結局。","Song 8:6–7 declares love’s strength and resistance to purchase; 8:8–12 contrasts care and wealth; the final exchange remains open-ended."],"readingKeys":[{"refs":"1:2–4; 2:7","title":["先辨認聲音","Listen for voices"],"body":["女子通常有鮮明的第一人稱；男子與耶路撒冷眾女子也輪流出現。譯本加的說話者標題可作提示，卻不是原文的一部分。","The woman often speaks in a strong first person; the man and daughters of Jerusalem also appear. Editorial speaker labels help but are not part of the Hebrew text."]},{"refs":"2:7; 3:5; 8:4","title":["留意反覆句","Notice the refrains"],"body":["「不要驚動愛情」的句子在不同場景出現，讓渴慕和節制並行；避免把它簡化為對每個人的同一時間表。","The refrain against awakening love appears in different scenes, holding desire and restraint together without supplying one schedule for everyone."]},{"refs":"1:12–14; 4:12–16; 7:11–13","title":["讀意象，不畫解剖圖","Read images, not anatomy charts"],"body":["香氣、園林、果實與季節喚起欣賞、生命力與親密。比喻的力量往往在感受與關係，不在逐物對照。","Fragrance, gardens, fruit, and seasons evoke delight, vitality, and intimacy. Their force lies in relationships and sensation, not item-by-item anatomy."]},{"refs":"8:6–7","title":["愛情有力量，也需要保護","Love is powerful and needs care"],"body":["全書不把愛縮成商品或技術；它是昂貴而深刻的人際委身。課堂要避免將經文用於施壓、羞辱或忽視同意。","The book refuses to reduce love to commodity or technique. It is deep, costly commitment; teaching must not pressure, shame, or ignore consent."]}],"mapIntro":["以下是一種可教學的詩歌地圖：各段意象會回返，邊界並非學界唯一共識。","This is one useful teaching map of recurring poetic movements, not a claim that every boundary is settled."],"movements":[{"refs":"1:1–2:7","title":["起首：相互渴慕與欣賞","Opening: desire and mutual praise"],"body":["女子首先發聲；園林、香氣與自我形象鋪陳愛情，首個「不要驚動」反覆句收束。","The woman speaks first; gardens, fragrance, and self-image shape desire before the first timing refrain."]},{"refs":"2:8–3:5","title":["春天邀請與夜間尋找","Spring invitation and night search"],"body":["聽見所愛者來到，也經歷不在場與尋找；期待、距離與相遇相互交替。","The beloved approaches, then absence and searching return; anticipation, distance, and meeting alternate."]},{"refs":"3:6–5:1","title":["華麗場景與花園之歌","Procession and garden poetry"],"body":["所羅門式的行列與詳盡的讚美並置；花園意象達到親密高潮。","A Solomonic procession stands beside elaborate praise, culminating in intimate garden imagery."]},{"refs":"5:2–6:3","title":["失落、傷害與再度稱讚","Loss, harm, and renewed praise"],"body":["女子夜間尋找時遭守望者傷害；眾女子的提問引出對所愛者的稱讚和重新定位。","The woman searches at night and is harmed by watchmen; the chorus’s questions lead to praise and renewed orientation."]},{"refs":"6:4–7:13","title":["反覆欣賞與同行的邀請","Repeated delight and invitation"],"body":["男女雙方的讚美互相回應，城市與田園的場景交錯，女子邀請一同出去。","Mutual praise returns across urban and rural settings, ending with the woman’s invitation to go out together."]},{"refs":"8:1–14","title":["愛的力量與開放式結尾","Love’s power and the open ending"],"body":["想要公開親近的渴望、印記與烈火、不能用財富購買的愛，最終形成彼此呼喚。","Longing for public closeness, seal and fire imagery, and love beyond purchase lead to a final mutual call."]}],"mapCaution":{"title":["關於人物與情節","About characters and plot"],"body":["「所羅門的歌」可解作關聯、傳統或作者指稱；3 章與 8 章對所羅門的提及也有不同解讀。本頁保留多聲部、詩歌循環的讀法，避免把每一節都固定到同一歷史婚禮。","“Of Solomon” can signal authorship, association, or tradition; his appearances in chapters 3 and 8 are debated. This guide treats the text as multivoiced poetic cycles rather than tying every verse to one historical wedding."]},"chaptersIntro":["每章先看詩歌的主要動向，再觀察三個意象或聲音線索。說話者標籤與段落名稱僅供研讀，需以經文本身核對。","Each chapter begins with its main poetic movement, then three image or voice clues. Speaker tags and section titles are study aids, not additions to Scripture."],"chapters":[{"n":1,"refs":"1:1–17","title":["渴慕、身份與雙方讚美","Longing, identity, and mutual praise"],"summary":["女子以想念和渴慕開篇，談到自己的膚色、勞作與被注視的經驗，也尋問所愛者在哪裡牧放羊群。男女相互以香氣、花朵、鴿眼等意象稱讚。","The woman opens with longing, speaks of her complexion, labor, and being looked at, and asks where her beloved shepherds. The pair exchange praise through fragrance, flowers, and dove-like eyes."],"deep":[["1:1 的「歌中之歌」是最高級表達；與所羅門的關係可有不同理解。","“Song of Songs” is a superlative; the relation to Solomon is interpreted in more than one way."],["1:5–6 的女子自述兼有自信與他人目光的壓力，應尊重其主體聲音。","In 1:5–6 the woman speaks both confidently and under others’ gaze; honor her agency."],["1:7–17 的尋問與回應將牧場、宴席、香氣與居所混合，讀者不必強迫地點完全一致。","Questions and responses in 1:7–17 mix pasture, banquet, fragrance, and dwelling; the scenes need not form one literal location."]],"caution":["譯本中的「新婦」「新郎」等說話標題通常是編輯提示，非希伯來原文。","Speaker labels such as “bride” and “groom” are editorial aids, not part of the Hebrew text."],"question":["女子如何描述自己？我們今天如何避免用外貌標準壓抑人的聲音？","How does the woman describe herself, and how can we avoid silencing people with appearance standards?"]},{"n":2,"refs":"2:1–17","title":["春天、邀請與愛的時機","Spring, invitation, and love’s timing"],"summary":["花、樹、酒宴與疾病般的思念形成強烈的愛情氛圍；男子以春天來臨邀請女子同行。狐狸與葡萄園意象提醒親密也需要守護，章末以彼此相屬和暫時分離收束。","Flowers, trees, feasting, and lovesickness intensify desire; the man invites the woman into spring. Foxes and vineyards suggest care for fragile intimacy; mutual belonging and temporary distance close the chapter."],"deep":[["2:2–6 把彼此的獨特與渴望寫入自然比喻，不宜逐物解成固定教義符號。","Nature images in 2:2–6 express uniqueness and longing; do not turn each object into a fixed doctrinal code."],["2:7 的反覆句把愛的力量與時機放在一起；後面 3:5、8:4 再次回響。","The refrain in 2:7 joins desire with timing and returns in 3:5 and 8:4."],["2:10–15 的春天邀請與小狐狸，讓喜悅和維護關係的責任並行。","The spring invitation and small foxes in 2:10–15 pair delight with care for the relationship."]],"caution":["「不要驚動愛情」不可被簡化為對所有人套用同一戀愛或婚姻時間表。","The timing refrain should not become a single romantic or marital timetable for everyone."],"question":["詩中的「春天」與「狐狸」如何同時表達喜悅和脆弱？","How do spring and foxes express both delight and vulnerability?"]},{"n":3,"refs":"3:1–11","title":["夜間尋找與華麗行列","Night search and royal procession"],"summary":["女子在夜間尋找所愛者，經過街市與守望的人，終於尋得；反覆句再次勸不要催促愛。接著詩境突轉，出現所羅門的華麗行列與婚禮意象。","The woman searches at night through streets and past watchmen until she finds her beloved; the timing refrain returns. The imagery then shifts to a splendid Solomonic procession and wedding language."],"deep":[["3:1–5 的夜間尋找可能帶有夢境或詩性想像；重點是失去、尋求與重逢。","The night search in 3:1–5 may be dreamlike; loss, seeking, and reunion are central."],["3:6–11 的華麗行列改變尺度與語氣，呼喚眾人觀看；不必確定它與前段是否同一事件。","The procession in 3:6–11 changes scale and voice; its exact relation to the prior scene is debated."],["兩段都涉及「看見／尋找」，但私人渴慕與公共榮華的張力值得保留。","Both scenes involve seeking and seeing, yet private longing and public splendor remain in tension."]],"caution":["不要把守望者在本章的中性角色，與 5 章的傷害場景混為一談。","Do not conflate the watchmen here with the violent watchmen scene in chapter 5."],"question":["華麗的公開場景會如何改變你對私人愛慕的理解？","How does public splendor alter the way you hear private longing?"]},{"n":4,"refs":"4:1–5:1","title":["身體讚美與上鎖的花園","Praise and the enclosed garden"],"summary":["男子以一連串詩性比喻讚美女子的美麗與獨特，花園、香料與水泉意象將親密描繪為珍貴而有生命力。女子也發聲邀請，5:1 將花園意象推至共享的歡喜。","The man praises the woman through a cascade of poetic metaphors; garden, spice, and spring images present intimacy as precious and life-giving. The woman responds with invitation, and 5:1 culminates in shared delight."],"deep":[["4:1–7 的形體讚美主要傳達欣賞與尊榮，不是讓讀者畫出一幅現代寫實肖像。","The body praise in 4:1–7 conveys admiration and honor, not a modern realistic portrait."],["4:8–11 的山、危險與香氣意象，讓吸引力帶有距離、探索與獨特性。","Mountains, danger, and fragrance in 4:8–11 bring distance, discovery, and uniqueness into desire."],["4:12–5:1 的花園既可象徵私密也象徵豐盛；注意女子在邀請中也有主動聲音。","The enclosed garden can suggest privacy and abundance; notice the woman’s active invitation."]],"caution":["課堂談身體時避免物化、公開評價學員外貌，並尊重不同婚姻處境。","When teaching embodiment, avoid objectifying people or evaluating students’ bodies; respect differing life situations."],"question":["這些比喻如何表達「被看見且受尊重」，而非單純被觀看？","How do the metaphors express being seen with respect rather than merely being looked at?"]},{"n":5,"refs":"5:2–16","title":["門外的失落與重新描述所愛","Loss at the door and renewed description"],"summary":["女子在夜間聽見所愛者敲門，遲疑之後發現他已離去；尋找時遭守望者傷害。眾女子問她所愛者有何特別，她以長篇讚美回答，讓失落轉化成記憶與宣認。","The woman hears her beloved knocking, delays, and finds him gone. During the search, watchmen harm her. Asked what makes him special, she answers in an extended praise poem, turning loss into remembered delight."],"deep":[["5:2–8 的敘述可能帶有夢的質感；讀者不必判定每個動作的現實時間線。","The scene in 5:2–8 feels dreamlike; a rigid real-time sequence is unnecessary."],["5:7 對守望者的暴力不應被淡化或屬靈化；那是女子受傷害的明確畫面。","The watchmen’s violence in 5:7 should not be minimized or spiritualized away."],["5:9–16 由眾女子的問題引出女子的主動描述；男子也成為被凝視與讚美的對象。","The chorus’s question in 5:9–16 prompts the woman’s active description; the man too becomes the object of praise."]],"caution":["不要把女子開門遲疑當作責備受暴者的理由；詩的意象與傷害都須謹慎對待。","Do not use her hesitation to blame someone harmed by violence; handle both image and harm carefully."],"question":["女子怎樣用語言記念所愛者？旁人的提問帶來甚麼作用？","How does the woman remember her beloved through words, and what does the chorus’s question do?"]},{"n":6,"refs":"6:1–13","title":["尋回、獨特與再次相望","Return, uniqueness, and mutual gaze"],"summary":["眾女子詢問所愛者的去處，女子回答他在園中，並重申彼此相屬。男子再次稱讚她，將其獨特置於眾多人物的背景中；結尾的「書拉密女」與觀看呼聲引出下一章。","The chorus asks where the beloved has gone; the woman places him in the garden and reaffirms mutual belonging. The man praises her uniqueness against a wider social backdrop; the Shulammite call leads into chapter 7."],"deep":[["6:1–3 與 2:16 互相呼應，尋找與相屬的句子在新情境中再現。","Verses 6:1–3 echo 2:16: seeking and belonging return in a new setting."],["6:4–10 的比喻與群體反應強調獨特性，也顯示公開目光的力量。","The images and chorus in 6:4–10 emphasize uniqueness and the force of public attention."],["6:11–13 的場景轉換迅速，說話者分配與地名解釋存在分歧。","The scene turns quickly in 6:11–13; speaker assignments and the place-name are debated."]],"caution":["不要把「獨一」誤讀成比較人的價值或要求所有關係複製同一模式。","Do not turn “unique” into a ranking of people’s worth or a universal relationship template."],"question":["本章的「尋找」與「相屬」和前面的場景有何不同？","How do seeking and belonging differ here from their earlier appearances?"]},{"n":7,"refs":"7:1–13","title":["相互欣賞與田園邀請","Mutual praise and the invitation outdoors"],"summary":["一段從腳到頭的讚美再次運用塔、果樹、酒與香氣等意象；男子表達渴望，女子也回應並邀請到田野、葡萄園與石榴花之處，讓親密從稱讚走向共同同行。","Praise from feet upward uses towers, fruit, wine, and fragrance. The man voices desire; the woman responds and invites him to fields, vineyards, and blossoms, moving from admiration toward shared life."],"deep":[["7:1–9 的身體比喻不依現代審美描摹，應從尊重、喜悅與詩的驚奇理解。","The bodily images in 7:1–9 are not modern beauty standards; hear respect, delight, and poetic surprise."],["7:10 回響彼此相屬的語言，但這次凸顯對方的渴慕指向自己。","Verse 7:10 echoes mutual belonging while emphasizing the beloved’s desire toward her."],["7:11–13 女子主動發出田園邀請，打破把她看成被動對象的讀法。","The woman’s invitation in 7:11–13 resists making her a passive object."]],"caution":["不宜把詩中的身體語言變成課堂玩笑或要求學員分享私人經驗。","Do not turn bodily language into classroom jokes or pressure for intimate disclosure."],"question":["女子的主動邀請如何改變你對全書男女聲音的印象？","How does the woman’s invitation reshape your sense of the two voices?"]},{"n":8,"refs":"8:1–14","title":["愛如烈火，無法買賣","Love like fire, beyond purchase"],"summary":["女子盼望能公開親近所愛者；反覆句最後再現。印記、死亡、烈火與洪水將愛的力量說到極致；後半談到年幼妹妹、所羅門的葡萄園與自己的葡萄園，最後男女互相呼喚而全書開放收尾。","The woman longs for unashamed public closeness; the timing refrain returns. Seal, death, fire, and floods gather love’s intensity. The younger-sister image and contrasting vineyards lead to a final open-ended call between the lovers."],"deep":[["8:6–7 把愛形容為極強、不可用財富購買的力量；力量需要忠誠與守護。","Verses 8:6–7 depict love as powerful and beyond purchase; such power calls for fidelity and care."],["8:8–12 的妹妹、牆與門、所羅門葡萄園意象有多種解讀；可先看自主、守護與商品化的張力。","The sister, wall/door, and Solomon’s vineyard invite several readings; begin with agency, care, and commodification."],["8:13–14 的呼喚沒有把故事完全封閉，讓渴慕與持續相識留在讀者耳中。","The exchange in 8:13–14 leaves the ending open, with desire and continuing discovery still audible."]],"caution":["「愛情如死之堅強」不應用來合理化控制、暴力或不尊重拒絕；詩歌稱讚的是有尊嚴的愛。","Love’s strength must not excuse control, violence, or refusal to honor consent; the poem celebrates dignified love."],"question":["為何詩人說財富不能換得愛？這對今日的關係有甚麼提醒？","Why can wealth not buy love, and what does this say to relationships today?"]}],"themesIntro":["以聲音、反覆句、身體與園林意象為入口，先尊重愛情詩，再討論其神學回聲。","Enter through voices, refrains, bodies, and gardens; honor the love poem before discussing theological echoes."],"themes":[{"refs":"1:2–4; 2:8–14; 5:2–8","title":["渴慕與尋找","Longing and seeking"],"body":["渴慕不是直線達成；詩歌在接近、離開、尋找與重逢之間往返，使愛的等待有聲音。","Desire is not a straight-line achievement; approach, absence, search, and reunion make waiting audible."],"caution":["不要把每次失去都歸咎於某一方的錯。","Do not assign every separation to one person’s fault."]},{"refs":"1:5–6; 4:1–7; 7:1–9","title":["身體、尊嚴與相互欣賞","Embodiment, dignity, and mutual praise"],"body":["女子與男子都稱讚彼此；女子也講述自身被觀看的壓力。詩中的身體語言可成為尊重與喜悅的課堂，而不是外貌競賽。","Both lovers praise each other; the woman also names the pressure of being watched. Bodily language can teach delight and respect rather than comparison."],"caution":["避免外貌羞辱、種族化的美貌標準與公開評斷身體。","Avoid body shaming, racialized beauty standards, and public assessment of bodies."]},{"refs":"2:7; 3:5; 8:4","title":["愛情的時機與節制","Love’s timing and restraint"],"body":["反覆句提醒愛不可被任意操縱或催逼；強烈的渴慕需要耐心、彼此尊重與辨識。","The recurring refrain resists manipulating or rushing love; intensity needs patience, respect, and discernment."],"caution":["不是用它替所有年齡、文化與處境訂單一規則。","It does not set one rule for every age, culture, and situation."]},{"refs":"4:12–16; 6:2–3; 7:11–13","title":["花園與豐盛","Garden and abundance"],"body":["園林、泉源、果實與香氣讓親密呈現生命力；也可與創世記的園子形成神學回聲，但先要讓詩在自身語境中說話。","Garden, spring, fruit, and fragrance render intimacy life-giving. Eden may be a theological echo, but let the poem speak in its own setting first."],"caution":["不要把每個植物都變成固定的寓意密碼。","Do not make every plant a fixed allegorical code."]},{"refs":"8:6–12","title":["愛的力量與不可購買","Love’s power and its refusal to be bought"],"body":["火與洪水意象凸顯愛的強度；財富不能取代自由而真誠的互相委身。","Fire and flood images convey love’s intensity; wealth cannot substitute for free, genuine mutual commitment."],"caution":["激烈情感不是控制、嫉妒傷害或暴力的許可。","Intense feeling does not license control, harmful jealousy, or violence."]},{"refs":"全書; 弗 5:25–33","title":["字面閱讀與屬靈回聲","Literal reading and spiritual echoes"],"body":["猶太與基督教傳統曾把雅歌讀為神與子民、基督與教會的愛；現代讀法也重視它是人的愛情詩。可對話，不必互相抹除。","Jewish and Christian traditions have read the lovers as God and his people or Christ and the church; modern readings also foreground human love poetry. These may be discussed without erasing the poem."],"caution":["不要把詩中每個身體細節都直接等同神學對象。","Do not map every bodily detail directly onto a theological referent."]}],"pastoral":{"title":["牧養帶領提醒","Pastoral facilitation"],"body":["雅歌涉及身體、渴慕、婚姻與傷害。教師應避免羞辱單身者、要求創傷揭露或把「愛如烈火」用來正當化控制。討論應尊重同意、界限與各人處境。","Song of Songs touches bodies, desire, marriage, and harm. Teachers should avoid shaming single people, demanding trauma disclosures, or using love’s intensity to justify control. Honor consent and boundaries."]},"lessonsIntro":["建議每課 75–90 分鐘：朗讀詩歌、辨認聲音與意象、討論不同讀法、以尊重他人的應用作結。可由教師按班級成熟度調整語言。","Suggested 75–90-minute pattern: read aloud, identify voices and images, compare interpretations, and close with respectful application. Adapt language to the class."],"lessons":[{"refs":"1:1–17","title":["第 1 課｜誰在說話？","Lesson 1 | Who is speaking?"],"aim":["認出愛情詩的形式、女子的主體聲音與說話者標題的編輯性。","Recognize love-poetry form, the woman’s agency, and the editorial status of speaker labels."],"flow":[["請三組分讀 1:2–7、1:8–11、1:12–17，標出可能的聲音轉換。","Read three units aloud in groups and mark possible voice changes."],["討論 1:5–6：女子如何自述？別人的目光又如何進入她的話？","Discuss how the woman describes herself in 1:5–6 and how others’ gaze enters her speech."],["從香氣與園林列出三個意象，練習先說效果、再談可能象徵。","Choose three images of scent or garden; discuss effect before symbolic meaning."]],"question":["誰有權定義女子的美麗與身份？","Who gets to define the woman’s beauty and identity?"],"practice":["建立課堂規則：尊重身體、關係與單身者，不要求分享私密經驗。","Establish class norms respecting bodies, relationships, and single people; no intimate disclosure is required."]},{"refs":"2:1–17","title":["第 2 課｜春天與不要催促","Lesson 2 | Spring and unhurried love"],"aim":["理解春天邀請、彼此獨特與反覆句的節奏。","Understand the spring invitation, mutual uniqueness, and the refrain’s rhythm."],"flow":[["朗讀 2:1–7，標出花、樹、宴席與思念的感官線索。","Read 2:1–7, marking flowers, trees, feasting, and sensory desire."],["讀 2:8–15，對照「出來」的邀請與狐狸帶來的脆弱。","Read 2:8–15, contrasting the invitation to come out with the vulnerability signaled by foxes."],["連結 2:7 與 3:5、8:4，討論反覆句何以出現在多個情境。","Connect 2:7 with 3:5 and 8:4, asking why the refrain returns."]],"question":["愛的時機是否只能以外在規定決定？經文如何保護彼此？","Can love’s timing be reduced to external rules? How does the poem protect both people?"],"practice":["讓學員以匿名紙條提出困惑，教師避免套用單一人生時間表。","Invite anonymous questions and avoid imposing one life timetable."]},{"refs":"3:1–11","title":["第 3 課｜夜間尋找與公共場景","Lesson 3 | Night search and public scene"],"aim":["看見詩境由私人尋找轉向華麗行列，保留場景連接的開放性。","Notice the shift from private seeking to splendid public procession without forcing a single chronology."],"flow":[["讀 3:1–5，記下「尋找」「遇見」「不放」的動詞。","Read 3:1–5 and track verbs of seeking, meeting, and holding."],["讀 3:6–11，記錄觀看者、香氣、護衛與婚禮語彙。","Read 3:6–11 and note spectators, fragrance, guards, and wedding language."],["讓兩組提出不同的兩段關係讀法，再檢查各自的證據。","Let two groups propose different links between the scenes and test their evidence."]],"question":["華麗是否必然等於親密？詩如何保留兩者的差別？","Does splendor equal intimacy? How does the poem keep them distinct?"],"practice":["教師可展示兩種合理讀法，訓練尊重文本不確定處。","Present two plausible readings and model respect for textual uncertainty."]},{"refs":"4:1–5:1","title":["第 4 課｜讚美、身體與花園","Lesson 4 | Praise, bodies, and garden"],"aim":["用尊重的方式閱讀身體比喻、女子的回應與花園意象。","Read bodily metaphors, the woman’s response, and garden imagery respectfully."],"flow":[["選 4:1–7 三個比喻，先問它們傳達何種尊榮感，不畫寫實肖像。","Select three images from 4:1–7 and ask what honor they convey rather than drawing a literal portrait."],["讀 4:8–16，追蹤山、香料、泉源與園子的轉換。","Trace mountain, spice, spring, and garden imagery in 4:8–16."],["讀 4:16–5:1，指出女子的邀請與共享的回應。","Read 4:16–5:1 and identify the woman’s invitation and shared response."]],"question":["被讚美與被物化差在哪裡？","What distinguishes being praised from being objectified?"],"practice":["明確說明課堂不對同學身體開玩笑、不公開評論私人關係。","State explicitly that jokes about bodies and public appraisal of private relationships are out of bounds."]},{"refs":"5:2–6:3","title":["第 5 課｜失落、傷害與再度尋見","Lesson 5 | Absence, harm, and renewed finding"],"aim":["誠實閱讀守望者暴力、女子的哀傷與重新描述所愛者。","Read the watchmen’s violence, the woman’s distress, and renewed praise honestly."],"flow":[["慢讀 5:2–8，辨識敲門、遲疑、尋找與受傷的次序，不急著裁判。","Read 5:2–8 slowly, tracing knock, hesitation, search, and harm without rushing to blame."],["讀 5:9–16，眾女子的問題如何引發女子的長篇回應？","In 5:9–16, how does the chorus’s question prompt extended praise?"],["對照 6:1–3 的花園與相屬，討論情感轉折是否需要被當作單一現實事件。","Compare the garden and belonging in 6:1–3; ask whether every turn must be one literal event."]],"question":["如何談論傷害而不把責任推給受傷的人？","How can we discuss harm without placing blame on the harmed person?"],"practice":["事先提供退出或私下談話的選項；不要要求創傷經驗分享。","Offer an opt-out or private conversation; never demand trauma disclosure."]},{"refs":"6:4–7:13","title":["第 6 課｜獨特、相互與邀請","Lesson 6 | Uniqueness, reciprocity, and invitation"],"aim":["比較男方與女方的主動語言，理解反覆讚美的詩性功能。","Compare the agency of both lovers and the poetic role of repeated praise."],"flow":[["讀 6:4–10，辨認讚美與群體觀看的不同聲音。","Read 6:4–10, distinguishing praise from the chorus’s public gaze."],["讀 7:1–9，討論比喻何以不是現代外貌標準。","Read 7:1–9 and discuss why poetic images are not modern appearance standards."],["讀 7:10–13，標出女子的回應和主動邀請。","Read 7:10–13 and mark the woman’s response and invitation."]],"question":["全書中的愛是否是單向凝視？請以兩段經文回答。","Is love in the book one-sided looking? Use two passages to answer."],"practice":["練習用能尊重對方主體性的語言表達欣賞。","Practice language of appreciation that honors another person’s agency."]},{"refs":"8:1–14","title":["第 7 課｜愛的力量與價值","Lesson 7 | Love’s power and value"],"aim":["連結印記、烈火、洪水與財富意象，討論愛的委身與不可購買。","Connect seal, fire, waters, and wealth to discuss commitment and love beyond purchase."],"flow":[["讀 8:1–4，最後一次聆聽「不要驚動」的反覆句。","Read 8:1–4 and hear the timing refrain a final time."],["細讀 8:5–7，逐個分析印記、死亡、火與洪水的力量，不長篇逐字引用。","Read 8:5–7 image by image: seal, death, fire, and waters."],["讀 8:8–14，分辨妹妹、葡萄園和最後呼喚的多種可能。","Read 8:8–14, exploring the sister, vineyards, and final call without forcing one solution."]],"question":["為甚麼真正的愛不能用財富換得？","Why cannot genuine love be bought with wealth?"],"practice":["清楚分辨強烈的愛與控制；討論尊重拒絕、界限與安全。","Distinguish strong love from control; discuss consent, boundaries, and safety."]},{"refs":"全書; 創 1–2; 弗 5:25–33","title":["第 8 課｜詩歌、神學與整卷統整","Lesson 8 | Poetry, theology, and synthesis"],"aim":["綜合字面與屬靈閱讀傳統，讓愛情詩作為經文保持自身聲音。","Synthesize literal and spiritual traditions while letting the love poem retain its own voice."],"flow":[["分組整理全書五個反覆意象：花園、香氣、尋找、觀看、葡萄園。","Groups trace five recurring motifs: garden, fragrance, seeking, seeing, and vineyard."],["比較古代愛情詩與神人之愛的寓意讀法，各說一項洞見與一項風險。","Compare love-poetry and allegorical readings, naming one insight and one risk in each."],["每人用兩句話回答：雅歌如何呈現愛的美與力量？它如何要求照顧他人的尊嚴？","Have each participant summarize the beauty and power of love and its implications for dignity."]],"question":["能否在不抹去人的愛情之下，聽見神學的回聲？","Can theological echoes be heard without erasing human love?"],"practice":["結束時尊重婚姻、單身、失戀與創傷等不同處境，提供不強迫的反思空間。","Close with space for married, single, grieving, and wounded people without pressure to speak."]}],"questionsIntro":["問題先引導觀察詩歌，再進入關係與神學討論；任何學員都可選擇不分享私人經驗。","Questions begin with poetic observation before relational or theological reflection; no participant must share private experience."],"extraQuestions":[["若把雅歌只當寓意，會失去甚麼？若只當愛情詩，又可能漏掉甚麼？","What is lost if the Song is only allegory? What might be missed if it is only love poetry?"],["女子在全書中有哪些主動聲音？請找出三處。","Where does the woman speak with agency? Find three passages."],["反覆出現的「不要驚動愛情」在不同場景中有何作用？","How does the recurring timing refrain function in different scenes?"],["8:6–7 的愛如何既是禮物，也需要被負責任地守護？","How is the love of 8:6–7 both a gift and something requiring responsible care?"]],"sourceNote":["本站提供原創摘要與教學建議，不轉載任何譯本的完整經文。中文經文連結預設新標點和合本（神版），英文連結預設 NASB 2020。說話者標題是譯本編輯提示，並非原文的一部分。","Original summaries and teaching notes only; no full translation is reproduced. Chinese links default to CUNP (Shen edition), English to NASB 2020. Speaker labels in translations are editorial aids."],"sources":[{"title":["BibleProject：雅歌導讀","BibleProject: Guide to Song of Songs"],"url":"https://bibleproject.com/guides/book-of-song-of-songs/"},{"title":["NASB 2020 雅歌第一章：說話者標題註解","NASB 2020 Song 1: note on speaker labels"],"url":"https://www.bible.com/bible/2692/SNG.1.NASB2020"}],"footer":["雅歌研讀 · 原創逐章摘要與成人主日學教師教案","Song of Songs study · original chapter notes and adult class plans"]};</script><script src="../assets/book-study.js" defer></script></body></html>
