<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="詩篇成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>詩篇｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"PSA","category":["詩歌智慧書","Poetry and Wisdom"],"name":["詩篇","Psalms"],"subtitle":["150 篇詩歌由兩條道路開篇，穿過五卷哀歌與讚美，終於萬物讚美；逐篇觀察。","One hundred fifty poems begin with two ways, traverse five books of lament and praise, and end in universal praise."],"overviewIntro":["先從全書結構掌握詩篇，再逐章研讀人物、事件與神學判斷。","Survey Psalms as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["150 章；依照書卷原有次序逐章研讀。","150 chapters studied in canonical sequence."],"thesis":["把整個人生帶到神面前","Bring the whole life before God"],"thesisDetail":["哀求、憤怒、感謝、智慧與讚美都進入禱告；五卷編排讓王權危機、流亡與盼望逐漸走向讚美。","Lament, anger, thanks, wisdom, and praise all become prayer; the five-book arrangement moves through royal crisis and exile toward praise."],"keyQuestion":["詩篇如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Psalms portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["哀求、憤怒、感謝、智慧與讚美都進入禱告；五卷編排讓王權危機、流亡與盼望逐漸走向讚美。","Lament, anger, thanks, wisdom, and praise all become prayer; the five-book arrangement moves through royal crisis and exile toward praise."],"finalMovement":["146–150 篇連續的哈利路亞結尾，不取消 88 篇的黑暗與 137 篇的流亡憤怒，而是把它們帶進更大的盼望。","The Hallelujah ending in Psalms 146–150 does not erase Psalm 88’s darkness or Psalm 137’s exile anger."],"readingKeys":[{"refs":"1–2","title":["入口：兩條道路與受膏者","Prologue: two ways and anointed king"],"body":["律法默想與列國反抗並置，定下個人與群體、智慧與王權的閱讀框架。","Torah meditation and rebellious nations frame personal wisdom and communal kingship."]},{"refs":"42–72","title":["卷二：渴慕、列國與公義之王","Book II: longing, nations, and just king"],"body":["渴慕聖所、群體挫敗與君王公義同在；結尾為所羅門王的祈禱。","Longing for sanctuary, communal defeat, and royal justice coexist, ending with prayer for Solomon."]},{"refs":"90–106","title":["卷四：神作王與歷史記憶","Book IV: divine kingship and memory"],"body":["摩西的生命短暫祈禱引入神作王的詩，創造和以色列歷史成為根基。","Moses’ mortality prayer opens songs of divine kingship, creation, and Israel’s history."]},{"refs":"146–150","title":["終曲：全地讚美","Finale: all creation praises"],"body":["五首哈利路亞詩從不倚靠君王，擴展到城、萬物與所有氣息。","Five Hallelujah poems move from mistrust of princes to city, creation, and every breath."]}],"mapIntro":["沿八個段落觀察詩篇的敘事推進與轉折。","Trace the movement of Psalms through eight teaching units."],"movements":[{"refs":"1–2","title":["入口：兩條道路與受膏者","Prologue: two ways and anointed king"],"body":["律法默想與列國反抗並置，定下個人與群體、智慧與王權的閱讀框架。","Torah meditation and rebellious nations frame personal wisdom and communal kingship."]},{"refs":"3–41","title":["卷一：危機中的大衛祈禱","Book I: Davidic prayer in crisis"],"body":["敵對、疾病、認罪與拯救交錯，個人哀歌尤其密集。","Enemies, illness, confession, and deliverance recur amid many individual laments."]},{"refs":"42–72","title":["卷二：渴慕、列國與公義之王","Book II: longing, nations, and just king"],"body":["渴慕聖所、群體挫敗與君王公義同在；結尾為所羅門王的祈禱。","Longing for sanctuary, communal defeat, and royal justice coexist, ending with prayer for Solomon."]},{"refs":"73–89","title":["卷三：聖所毀壞與盟約疑問","Book III: sanctuary loss and covenant question"],"body":["惡人興盛、城被毀、黑暗無答與大衛盟約危機推向全書低谷。","Prosperous wicked, ruined sanctuary, unanswered darkness, and Davidic covenant crisis form the collection’s low point."]},{"refs":"90–106","title":["卷四：神作王與歷史記憶","Book IV: divine kingship and memory"],"body":["摩西的生命短暫祈禱引入神作王的詩，創造和以色列歷史成為根基。","Moses’ mortality prayer opens songs of divine kingship, creation, and Israel’s history."]},{"refs":"107–119","title":["卷五前段：蒙救贖與妥拉","Book V: redemption and Torah"],"body":["四方聚集者感謝拯救，哈利路亞、出埃及與長篇律法詩互相交織。","Gathered people thank God; Hallelujah, exodus memory, and the long Torah poem interweave."]},{"refs":"120–145","title":["上行之詩與末段大衛詩","Ascents and final Davidic songs"],"body":["120–134 篇作朝聖組詩，隨後回顧出埃及、流亡與個人求助。","Psalms 120–134 form Songs of Ascents, followed by exodus memory, exile, and petitions."]},{"refs":"146–150","title":["終曲：全地讚美","Finale: all creation praises"],"body":["五首哈利路亞詩從不倚靠君王，擴展到城、萬物與所有氣息。","Five Hallelujah poems move from mistrust of princes to city, creation, and every breath."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["標題中的作者與歷史標示是詩篇正典的一部分，但不能據此確定每篇精確寫作日期；先辨認詩體與說話者。","Superscriptions matter in the canonical text but do not always establish precise dates; identify genre and voice first."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["兩條道路","Two ways"],"summary":["義人默想律法如栽在水旁的樹，惡人的道路終歸消失。","The Torah-meditating righteous person is a watered tree; the wicked path perishes."],"deep":[["以「道路」作全書智慧入口。","The image of a way opens the whole collection."],["1 篇的道路與 2 篇的王連到後續詩篇。","The way of Psalm 1 and king of Psalm 2 frame the collection."]],"caution":["詩歌中的王權語言先按古代語境閱讀。","Read royal language first in its ancient setting."],"question":["哪一節最能支持「以「道路」作全書智慧入口。」的觀察？","Which verse best supports the observation “The image of a way opens the whole collection.”?"]},{"n":2,"refs":"2","title":["列國與受膏者","Nations and anointed king"],"summary":["列國抗拒神與受膏君王，結尾呼籲掌權者尋求智慧與庇護。","Nations resist God and the anointed king; rulers are called to wisdom and refuge."],"deep":[["王權應在神面前受約束。","Kingship is accountable to God."],["1 篇的道路與 2 篇的王連到後續詩篇。","The way of Psalm 1 and king of Psalm 2 frame the collection."]],"caution":["詩歌中的王權語言先按古代語境閱讀。","Read royal language first in its ancient setting."],"question":["哪一節最能支持「王權應在神面前受約束。」的觀察？","Which verse best supports the observation “Kingship is accountable to God.”?"]},{"n":3,"refs":"3","title":["被圍中的安眠","Sleep amid enemies"],"summary":["逃亡者雖被眾人圍困，仍能躺下睡醒，求神拯救。","Surrounded by foes, the speaker sleeps and wakes while asking for rescue."],"deep":[["安眠成為信靠的具體動作。","Sleep embodies trust."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「安眠成為信靠的具體動作。」的觀察？","Which verse best supports the observation “Sleep embodies trust.”?"]},{"n":4,"refs":"4","title":["夜間的安穩","Evening safety"],"summary":["詩人對抗羞辱與虛妄，呼籲靜默思考，安然入睡。","Facing shame and empty claims, the speaker calls for reflection and rests at night."],"deep":[["真正安穩不等於外在豐收。","Security is more than material abundance."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「真正安穩不等於外在豐收。」的觀察？","Which verse best supports the observation “Security is more than material abundance.”?"]},{"n":5,"refs":"5","title":["清晨求引導","Morning petition"],"summary":["清晨的禱告求神帶領義路，並拒絕謊言與暴力。","A morning prayer seeks a straight path amid lies and violence."],"deep":[["求引導與辨別言語相連。","Guidance includes discernment of speech."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「求引導與辨別言語相連。」的觀察？","Which verse best supports the observation “Guidance includes discernment of speech.”?"]},{"n":6,"refs":"6","title":["病痛中的哀求","Lament in illness"],"summary":["詩人身心疲乏、夜裡流淚，轉向神求憐憫。","The speaker is worn down and weeps at night, appealing for mercy."],"deep":[["眼淚不等於信心失敗。","Tears do not signal failed faith."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「眼淚不等於信心失敗。」的觀察？","Which verse best supports the observation “Tears do not signal failed faith.”?"]},{"n":7,"refs":"7","title":["公義的審判者","Just judge"],"summary":["面對追逼與指控，詩人把案件交給審判全地的神。","Facing pursuit and accusation, the speaker entrusts the case to the judge."],"deep":[["先邀神檢驗自己，再求審判他人。","The speaker invites self-examination before judgment of others."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「先邀神檢驗自己，再求審判他人。」的觀察？","Which verse best supports the observation “The speaker invites self-examination before judgment of others.”?"]},{"n":8,"refs":"8","title":["人的尊嚴","Human dignity"],"summary":["觀看星月而驚奇，人雖微小卻受託照管受造界。","Under moon and stars, small humans are entrusted with care of creation."],"deep":[["權柄來自託付，不是掠奪許可。","Dominion is stewardship, not license to exploit."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「權柄來自託付，不是掠奪許可。」的觀察？","Which verse best supports the observation “Dominion is stewardship, not license to exploit.”?"]},{"n":9,"refs":"9","title":["為受欺壓者伸冤","Justice for oppressed"],"summary":["詩人稱謝神審判列國，求祂記念困苦者。","The speaker thanks God for judgment and asks remembrance of the afflicted."],"deep":[["讚美與求公義同在。","Praise and the plea for justice coexist."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「讚美與求公義同在。」的觀察？","Which verse best supports the observation “Praise and the plea for justice coexist.”?"]},{"n":10,"refs":"10","title":["惡人欺壓窮人","The wicked oppress the poor"],"summary":["惡人以為無人看見，設計捕捉弱者；詩人求神起來。","The arrogant prey on the poor and imagine no one sees; the speaker asks God to rise."],"deep":[["詩歌揭露權力者對隱形受害者的態度。","The poem unmasks how power treats unseen victims."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「詩歌揭露權力者對隱形受害者的態度。」的觀察？","Which verse best supports the observation “The poem unmasks how power treats unseen victims.”?"]},{"n":11,"refs":"11","title":["根基搖動時","When foundations shake"],"summary":["旁人勸逃，詩人堅信神仍察看義人和惡人的行為。","When advisers urge flight, the speaker trusts that God still observes human conduct."],"deep":[["危機中的信靠不是否認根基動搖。","Trust does not deny shaken foundations."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「危機中的信靠不是否認根基動搖。」的觀察？","Which verse best supports the observation “Trust does not deny shaken foundations.”?"]},{"n":12,"refs":"12","title":["謊言中的純淨話語","Truth amid lies"],"summary":["油滑舌頭欺壓窮人，神的話卻被比作煉淨的銀。","Flattering speech crushes the poor; divine words are like refined silver."],"deep":[["言語是否保護弱者是檢驗點。","Speech is tested by its effect on the vulnerable."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「言語是否保護弱者是檢驗點。」的觀察？","Which verse best supports the observation “Speech is tested by its effect on the vulnerable.”?"]},{"n":13,"refs":"13","title":["要到幾時","How long?"],"summary":["四次「要到幾時」表達被忘的恐懼，末了仍仰望慈愛。","Repeated “How long?” voices fear of abandonment before turning to love."],"deep":[["讚美沒有刪掉此前的困惑。","Trust does not erase the preceding question."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「讚美沒有刪掉此前的困惑。」的觀察？","Which verse best supports the observation “Trust does not erase the preceding question.”?"]},{"n":14,"refs":"14","title":["愚頑與社會敗壞","Folly and corruption"],"summary":["「沒有神」的心態連於欺壓百姓；詩人盼望救恩臨到。","The fool’s denial of God appears in oppression; the poet longs for rescue."],"deep":[["愚頑是倫理上的敗壞，不是智商判斷。","Folly is moral, not an intelligence score."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「愚頑是倫理上的敗壞，不是智商判斷。」的觀察？","Which verse best supports the observation “Folly is moral, not an intelligence score.”?"]},{"n":15,"refs":"15","title":["誰可住在聖山","Who may dwell?"],"summary":["進入神帳幕的人須誠實、公義、不傷鄰舍、不收賄賂。","The guest in God’s tent speaks truth, acts justly, and refuses bribes."],"deep":[["敬拜資格由公共倫理描述。","Public ethics defines worshipful life."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「敬拜資格由公共倫理描述。」的觀察？","Which verse best supports the observation “Public ethics defines worshipful life.”?"]},{"n":16,"refs":"16","title":["我的產業","My portion"],"summary":["詩人拒絕別神，稱神為杯與產業，在生死中信靠。","Rejecting rival gods, the speaker names God as cup and inheritance amid mortality."],"deep":[["喜樂來自與神的關係。","Joy grows from relationship with God."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「喜樂來自與神的關係。」的觀察？","Which verse best supports the observation “Joy grows from relationship with God.”?"]},{"n":17,"refs":"17","title":["求保護免受暴力","Protect me from violence"],"summary":["詩人求神察驗並護衛，敵人包圍時仍盼望見神面。","The speaker seeks examination and shelter while surrounded by violent foes."],"deep":[["「眼中瞳人」表達親密的保護需求。","The apple-of-the-eye image conveys sought protection."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「「眼中瞳人」表達親密的保護需求。」的觀察？","Which verse best supports the observation “The apple-of-the-eye image conveys sought protection.”?"]},{"n":18,"refs":"18","title":["長篇拯救感恩","Long thanksgiving for rescue"],"summary":["王回顧神從死亡水中救出自己，並談戰勝敵國。","The king recalls rescue from deathly waters and victory over foes."],"deep":[["王室軍事語言須放回其古代背景。","Read royal war language in its ancient setting."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「王室軍事語言須放回其古代背景。」的觀察？","Which verse best supports the observation “Read royal war language in its ancient setting.”?"]},{"n":19,"refs":"19","title":["天空與律法","Sky and instruction"],"summary":["日月無言宣告造物榮耀，律法帶來亮光；詩人求免隱而未現的錯。","The skies wordlessly declare glory, Torah gives light, and the speaker asks cleansing."],"deep":[["創造啟示與倫理教導互相補足。","Creation and instruction complement each other."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「創造啟示與倫理教導互相補足。」的觀察？","Which verse best supports the observation “Creation and instruction complement each other.”?"]},{"n":20,"refs":"20","title":["戰前為王代求","Prayer before battle"],"summary":["群體為王求幫助，拒絕單靠戰車馬匹。","The community prays for its king and refuses to trust only in chariots."],"deep":[["技術優勢不是最終信靠。","Military strength is not ultimate trust."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution ","Help against false accusers"],"summary":["無故受攻擊者求神爭戰、揭露惡證與幸災樂禍。","The falsely accused asks God to contest malicious witnesses and gloating foes."],"deep":[["把伸冤交給神，沒有抹去情緒強度。","Appeal to God preserves emotional force."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「把伸冤交給神，沒有抹去情緒強度。」的觀察？","Which verse best supports the observation “Appeal to God preserves emotional force.”?"]},{"n":36,"refs":"36","title":["惡念與慈愛","Wickedness and steadfast love"],"summary":["人心中的罪與無底深的慈愛形成鮮明對比。","Human wickedness contrasts with divine love reaching the heavens."],"deep":[["「生命的泉源」在對比中發光。","The fountain of life shines through contrast."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「「生命的泉源」在對比中發光。」的觀察？","Which verse best supports the observation “The fountain of life shines through contrast.”?"]},{"n":37,"refs":"37","title":["不要因惡人心懷不平","Do not fret over evildoers"],"summary":["字母詩勸義人等候，惡人的暫時成功不值得效法。","An alphabetic poem counsels waiting rather than imitating temporarily prosperous wrongdoers."],"deep":[["格言屬智慧勸勉，不是每人即時得地的保證。","Wisdom counsel is not an immediate land guarantee."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「格言屬智慧勸勉，不是每人即時得地的保證。」的觀察？","Which verse best supports the observation “Wisdom counsel is not an immediate land guarantee.”?"]},{"n":38,"refs":"38","title":["病中認罪","Confession in illness"],"summary":["身體病痛、朋友疏離與罪疚交錯，詩人求神不要遠離。","Illness, deserted friends, and guilt intertwine in a plea for help."],"deep":[["不可推論所有疾病都由個人罪造成。","Do not infer that every illness results from personal sin."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「不可推論所有疾病都由個人罪造成。」的觀察？","Which verse best supports the observation “Do not infer that every illness results from personal sin.”?"]},{"n":39,"refs":"39","title":["生命短暫","A fleeting life"],"summary":["沉默與衝動之間，詩人求明白日子有限並盼神垂聽。","Between silence and distress, the speaker asks to grasp life’s brevity."],"deep":[["有限性促使祈禱，不是虛無主義。","Mortality leads to prayer, not nihilism."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「有限性促使祈禱，不是虛無主義。」的觀察？","Which verse best supports the observation “Mortality leads to prayer, not nihilism.”?"]},{"n":40,"refs":"40","title":["從坑中被救仍求援","Lifted from pit, still in need"],"summary":["昔日得救成新歌，後段仍被困境包圍，急求幫助。","Past rescue yields a new song, yet present trouble prompts urgent prayer."],"deep":[["感恩者仍可再度求援。","The thankful may still need help."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「感恩者仍可再度求援。」的觀察？","Which verse best supports the observation “The thankful may still need help.”?"]},{"n":41,"refs":"41","title":["照顧貧者與病者","Care for the poor and sick"],"summary":["眷顧貧窮人的福分與詩人病中遭背叛相連。","Care for the poor is praised as the ill speaker faces betrayal."],"deep":[["社會倫理與病榻孤獨在同一首詩。","Social ethics and bedside isolation meet."],["22–24 篇由棄絕、牧養走向榮耀之王。","Psalms 22–24 move from abandonment to shepherding and royal glory."]],"caution":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."],"question":["哪一節最能支持「社會倫理與病榻孤獨在同一首詩。」的觀察？","Which verse best supports the observation “Social ethics and bedside isolation meet.”? elfare.”?"]},{"n":145,"refs":"145","title":["國度與憐憫","Kingdom and compassion"],"summary":["字母詩讚美神的國度，祂扶起跌倒者，供給萬物。","An alphabetic poem praises a kingdom that lifts the fallen and feeds creatures."],"deep":[["王權以憐憫與供養呈現。","Kingship is expressed in compassion and provision."],["137 篇把流亡憤怒留在祈禱集中。","Psalm 137 keeps exilic rage within the prayer collection."]],"caution":["137 篇的暴力願望不是傷害兒童的授權。","Psalm 137’s violent wish does not authorize harming children."],"question":["哪一節最能支持「王權以憐憫與供養呈現。」的觀察？","Which verse best supports the observation “Kingship is expressed in compassion and provision.”?"]},{"n":146,"refs":"146","title":["不要倚靠君王","Do not trust princes"],"summary":["哈利路亞終曲開始，勸人不靠會死的君王，神為受壓者伸冤。","The Hallelujah finale opens by rejecting mortal princes and praising justice for the oppressed."],"deep":[["終曲的讚美以公共公義開始。","The finale begins with public justice."],["最後讚美的廣度建立在前面哀歌被聽見之上。","The final praise has room for preceding laments."]],"caution":["結尾的喜樂不要求受苦者立刻停止哀哭。","The joyous end does not require sufferers to cease lament immediately."],"question":["哪一節最能支持「終曲的讚美以公共公義開始。」的觀察？","Which verse best supports the observation “The finale begins with public justice.”?"]},{"n":147,"refs":"147","title":["重建城與醫治人","Rebuilds city and heals hearts"],"summary":["神聚集流亡者、醫治傷心者，也數算星辰、降雪供糧。","God gathers exiles, heals broken hearts, names stars, and gives snow and food."],"deep":[["城市修復與個人療傷並列。","Civic repair and personal healing stand together."],["最後讚美的廣度建立在前面哀歌被聽見之上。","The final praise has room for preceding laments."]],"caution":["結尾的喜樂不要求受苦者立刻停止哀哭。","The joyous end does not require sufferers to cease lament immediately."],"question":["哪一節最能支持「城市修復與個人療傷並列。」的觀察？","Which verse best supports the observation “Civic repair and personal healing stand together.”?"]},{"n":148,"refs":"148","title":["萬物同讚","All creation praises"],"summary":["天使、日月、海獸、山樹、君王與百姓一同受邀讚美。","Angels, sun, moon, sea creatures, mountains, rulers, and people are called to praise."],"deep":[["沒有一類受造者被排除於邀請之外。","No class of creature is excluded."],["最後讚美的廣度建立在前面哀歌被聽見之上。","The final praise has room for preceding laments."]],"caution":["結尾的喜樂不要求受苦者立刻停止哀哭。","The joyous end does not require sufferers to cease lament immediately."],"question":["哪一節最能支持「沒有一類受造者被排除於邀請之外。」的觀察？","Which verse best supports the observation “No class of creature is excluded.”?"]},{"n":149,"refs":"149","title":["新歌與公義張力","New song and justice tension"],"summary":["會眾唱新歌並跳舞，結尾的審判與武器語言帶來倫理張力。","The congregation sings and dances; judgment and sword imagery complicate the ending."],"deep":[["不要以詩歌意象給今日私刑背書。","The poetic sword does not license vigilantism."],["最後讚美的廣度建立在前面哀歌被聽見之上。","The final praise has room for preceding laments."]],"caution":["結尾的喜樂不要求受苦者立刻停止哀哭。","The joyous end does not require sufferers to cease lament immediately."],"question":["哪一節最能支持「不要以詩歌意象給今日私刑背書。」的觀察？","Which verse best supports the observation “The poetic sword does not license vigilantism.”?"]},{"n":150,"refs":"150","title":["凡有氣息都讚美","Let everything that breathes praise"],"summary":["各種樂器在聖所響起，最後邀一切有氣息者讚美。","Instruments fill the sanctuary; every breathing being is invited to praise."],"deep":[["終章擴大主詞，完成全書從哀求到讚美的旅程。","The last line widens the singer and closes the journey."],["最後讚美的廣度建立在前面哀歌被聽見之上。","The final praise has room for preceding laments."]],"caution":["結尾的喜樂不要求受苦者立刻停止哀哭。","The joyous end does not require sufferers to cease lament immediately."],"question":["哪一節最能支持「終章擴大主詞，完成全書從哀求到讚美的旅程。」的觀察？","Which verse best supports the observation “The last line widens the singer and closes the journey.”?"]}],"themesIntro":["以下主題由詩篇的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of Psalms and complement the chapter studies."],"themes":[{"refs":"1–2","title":["入口：兩條道路與受膏者","Prologue: two ways and anointed king"],"body":["律法默想與列國反抗並置，定下個人與群體、智慧與王權的閱讀框架。","Torah meditation and rebellious nations frame personal wisdom and communal kingship."],"caution":["詩歌中的王權語言先按古代語境閱讀。","Read royal language first in its ancient setting."]},{"refs":"42–72","title":["卷二：渴慕、列國與公義之王","Book II: longing, nations, and just king"],"body":["渴慕聖所、群體挫敗與君王公義同在；結尾為所羅門王的祈禱。","Longing for sanctuary, communal defeat, and royal justice coexist, ending with prayer for Solomon."],"caution":["婚禮與戰爭詩不宜一律當作今日政治藍圖。","Wedding and war poems are not ready modern political blueprints."]},{"refs":"90–106","title":["卷四：神作王與歷史記憶","Book IV: divine kingship and memory"],"body":["摩西的生命短暫祈禱引入神作王的詩，創造和以色列歷史成為根基。","Moses’ mortality prayer opens songs of divine kingship, creation, and Israel’s history."],"caution":["91 篇的保護詩不能保證信徒絕不受害。","Psalm 91 is not a guarantee against all harm."]},{"refs":"120–145","title":["上行之詩與末段大衛詩","Ascents and final Davidic songs"],"body":["120–134 篇作朝聖組詩，隨後回顧出埃及、流亡與個人求助。","Psalms 120–134 form Songs of Ascents, followed by exodus memory, exile, and petitions."],"caution":["137 篇的暴力願望不是傷害兒童的授權。","Psalm 137’s violent wish does not authorize harming children."]},{"refs":"146–150","title":["終曲：全地讚美","Finale: all creation praises"],"body":["五首哈利路亞詩從不倚靠君王，擴展到城、萬物與所有氣息。","Five Hallelujah poems move from mistrust of princes to city, creation, and every breath."],"caution":["結尾的喜樂不要求受苦者立刻停止哀哭。","The joyous end does not require sufferers to cease lament immediately."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["哀歌與咒詛詩容許受害者說出憤怒；不要把詩人的報復願望直接當成今日暴力命令。","Laments and imprecations give victims words for anger; do not turn poetic cries for vengeance into commands to harm."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–2","title":["第 1 課｜入口：兩條道路與受膏者","Lesson 1 | Prologue: two ways and anointed king"],"aim":["律法默想與列國反抗並置，定下個人與群體、智慧與王權的閱讀框架。","Torah meditation and rebellious nations frame personal wisdom and communal kingship."],"flow":[["讀 1 章：以「道路」作全書智慧入口。","Read chapter 1: The image of a way opens the whole collection."],["對照 1–2 章：1 篇的道路與 2 篇的王連到後續詩篇。","Compare chapters 1–2: The way of Psalm 1 and king of Psalm 2 frame the collection."],["討論：哪一節最能支持「王權應在神面前受約束。」的觀察？","Discuss: Which verse best supports the observation “Kingship is accountable to God.”?"]],"question":["哪一節最能支持「以「道路」作全書智慧入口。」的觀察？","Which verse best supports the observation “The image of a way opens the whole collection.”?"],"practice":["詩歌中的王權語言先按古代語境閱讀。","Read royal language first in its ancient setting."]},{"refs":"3–41","title":["第 2 課｜卷一：危機中的大衛祈禱","Lesson 2 | Book I: Davidic prayer in crisis"],"aim":["敵對、疾病、認罪與拯救交錯，個人哀歌尤其密集。","Enemies, illness, confession, and deliverance recur amid many individual laments."],"flow":[["讀 3 章：安眠成為信靠的具體動作。","Read chapter 3: Sleep embodies trust."],["對照 3–41 章：22–24 篇由棄絕、牧養走向榮耀之王。","Compare chapters 3–41: Psalms 22–24 move from abandonment to shepherding and royal glory."],["討論：哪一節最能支持「社會倫理與病榻孤獨在同一首詩。」的觀察？","Discuss: Which verse best supports the observation “Social ethics and bedside isolation meet.”?"]],"question":["哪一節最能支持「安眠成為信靠的具體動作。」的觀察？","Which verse best supports the observation “Sleep embodies trust.”?"],"practice":["不要把每一處「仇敵」都直接指向現實中的某個人。","Do not assign every poetic enemy to a real person."]},{"refs":"42–72","title":["第 3 課｜卷二：渴慕、列國與公義之王","Lesson 3 | Book II: longing, nations, and just king"],"aim":["渴慕聖所、群體挫敗與君王公義同在；結尾為所羅門王的祈禱。","Longing for sanctuary, communal defeat, and royal justice coexist, ending with prayer for Solomon."],"flow":[["讀 42 章：自我勸勉不表示痛苦已過。","Read chapter 42: Self-address does not mean grief has ended."],["對照 42–72 章：72 篇以窮乏者得伸冤衡量王權。","Compare chapters 42–72: Psalm 72 measures kingship by justice for the poor."],["討論：哪一節最能支持「衡量王權的首要標準是窮乏者。」的觀察？","Discuss: Which verse best supports the observation “The poor are the measure of kingship.”?"]],"question":["哪一節最能支持「自我勸勉不表示痛苦已過。」的觀察？","Which verse best supports the observation “Self-address does not mean grief has ended.”?"],"practice":["婚禮與戰爭詩不宜一律當作今日政治藍圖。","Wedding and war poems are not ready modern political blueprints."]},{"refs":"73–89","title":["第 4 課｜卷三：聖所毀壞與盟約疑問","Lesson 4 | Book III: sanctuary loss and covenant question"],"aim":["惡人興盛、城被毀、黑暗無答與大衛盟約危機推向全書低谷。","Prosperous wicked, ruined sanctuary, unanswered darkness, and Davidic covenant crisis form the collection’s low point."],"flow":[["讀 73 章：信仰可容納對不公平的嫉妒與追問。","Read chapter 73: Faith can contain envy and questions of unfairness."],["對照 73–89 章：73 篇的困惑與 89 篇的追問呼應。","Compare chapters 73–89: Psalm 73’s perplexity echoes Psalm 89’s covenant question."],["討論：哪一節最能支持「「你曾應許」成為哀求的根據。」的觀察？","Discuss: Which verse best supports the observation “The promise itself grounds lament.”?"]],"question":["哪一節最能支持「信仰可容納對不公平的嫉妒與追問。」的觀察？","Which verse best supports the observation “Faith can contain envy and questions of unfairness.”?"],"practice":["88 篇沒有明亮結尾，教學也不應補造。","Psalm 88 lacks a bright ending; do not manufacture one."]},{"refs":"90–106","title":["第 5 課｜卷四：神作王與歷史記憶","Lesson 5 | Book IV: divine kingship and memory"],"aim":["摩西的生命短暫祈禱引入神作王的詩，創造和以色列歷史成為根基。","Moses’ mortality prayer opens songs of divine kingship, creation, and Israel’s history."],"flow":[["讀 90 章：數算日子是為求智慧與勞苦有意義。","Read chapter 90: Counting days seeks wisdom and meaningful work."],["對照 90–106 章：90 篇回應 89 篇王朝危機，轉向永恆的神。","Compare chapters 90–106: Psalm 90 answers Psalm 89’s royal crisis by turning to the eternal God."],["討論：哪一節最能支持「與 105 篇並讀可見歷史的兩面。」的觀察？","Discuss: Which verse best supports the observation “Read beside Psalm 105 for two sides of memory.”?"]],"question":["哪一節最能支持「數算日子是為求智慧與勞苦有意義。」的觀察？","Which verse best supports the observation “Counting days seeks wisdom and meaningful work.”?"],"practice":["91 篇的保護詩不能保證信徒絕不受害。","Psalm 91 is not a guarantee against all harm."]},{"refs":"107–119","title":["第 6 課｜卷五前段：蒙救贖與妥拉","Lesson 6 | Book V: redemption and Torah"],"aim":["四方聚集者感謝拯救，哈利路亞、出埃及與長篇律法詩互相交織。","Gathered people thank God; Hallelujah, exodus memory, and the long Torah poem interweave."],"flow":[["讀 107 章：副歌邀不同受難者共同稱謝。","Read chapter 107: The refrain gathers diverse sufferers in thanks."],["對照 107–119 章：119 篇以字母詩形式反覆操 oyous end does not require sufferers to cease lament immediately."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["詩篇最常被忽略的人物是誰？為何？","Which character in Psalms is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜詩篇導讀","BibleProject | Psalms guide"],"url":"https://bibleproject.com/guides/book-of-psalms/"}],"footer":["詩篇 · 成人主日學教師版 · 請配合完整經文閱讀。","Psalms · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
