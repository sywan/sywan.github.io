<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="箴言成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>箴言｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"PRO","category":["智慧文學","Wisdom Literature"],"name":["箴言","Proverbs"],"subtitle":["31 章從智慧的邀請走到日常格言與才德婦人：練習辨識話語、工作、金錢、公義與關係。","Thirty-one chapters move from Wisdom’s invitation to daily sayings and a capable woman, training discernment in speech, work, money, justice, and relationships."],"overviewIntro":["先從全書結構掌握箴言，再逐章研讀人物、事件與神學判斷。","Survey Proverbs as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["31 章；依照書卷原有次序逐章研讀。","31 chapters studied in canonical sequence."],"thesis":["敬畏神使智慧有方向","Fear of the Lord gives wisdom direction"],"thesisDetail":["箴言提供生活中的常態觀察與道德訓練，不能被誤用為每一個好人必然得福的保證。","Proverbs offers ordinary-life patterns and moral formation, not a guarantee that every good person will prosper."],"keyQuestion":["箴言如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Proverbs portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["箴言提供生活中的常態觀察與道德訓練，不能被誤用為每一個好人必然得福的保證。","Proverbs offers ordinary-life patterns and moral formation, not a guarantee that every good person will prosper."],"finalMovement":["最後的婦人以經營、慷慨與言語呈現智慧；讚美指向品格與工作，不是對所有女性的單一角色規定。","The final woman embodies wisdom in enterprise, generosity, and speech; the poem praises character without imposing one role on all women."],"readingKeys":[{"refs":"1–4","title":["智慧的入口","Entering wisdom"],"body":["父親的訓誨與智慧之聲邀人遠離惡友，重視敬畏、信靠與教導。","Parental instruction and Wisdom’s voice invite avoidance of violence and trust in God."]},{"refs":"8–9","title":["智慧與愚昧的邀請","Two invitations"],"body":["智慧與愚昧被擬人化為兩位邀請者；智慧說自己與創造同在。","Wisdom and Folly become rival hosts; Wisdom is portrayed alongside creation."]},{"refs":"13–17","title":["家庭、權力與言語","Family, power, and speech"],"body":["教養、君王、貧窮、溫柔回答與神的主權反覆出現。","Parenting, kingship, poverty, gentle speech, and divine sovereignty recur."]},{"refs":"30–31","title":["亞古珥、利慕伊勒與婦人","Agur, Lemuel, and the woman"],"body":["數字箴言、王的責任與才德婦人詩為全書作結。","Numerical sayings, royal counsel, and the capable woman close the book."]}],"mapIntro":["沿八個段落觀察箴言的敘事推進與轉折。","Trace the movement of Proverbs through eight teaching units."],"movements":[{"refs":"1–4","title":["智慧的入口","Entering wisdom"],"body":["父親的訓誨與智慧之聲邀人遠離惡友，重視敬畏、信靠與教導。","Parental instruction and Wisdom’s voice invite avoidance of violence and trust in God."]},{"refs":"5–7","title":["親密關係與風險","Intimacy and risk"],"body":["父親警告不忠與誘惑，也教導勤奮及守約。","Instructions warn about infidelity and seduction while teaching diligence."]},{"refs":"8–9","title":["智慧與愚昧的邀請","Two invitations"],"body":["智慧與愚昧被擬人化為兩位邀請者；智慧說自己與創造同在。","Wisdom and Folly become rival hosts; Wisdom is portrayed alongside creation."]},{"refs":"10–12","title":["格言中的日常","Daily patterns in sayings"],"body":["短句比較言語、誠實、勞動、施與和義惡。","Short sayings contrast speech, integrity, work, generosity, and justice."]},{"refs":"13–17","title":["家庭、權力與言語","Family, power, and speech"],"body":["教養、君王、貧窮、溫柔回答與神的主權反覆出現。","Parenting, kingship, poverty, gentle speech, and divine sovereignty recur."]},{"refs":"18–22","title":["友誼、貧富與公義","Friendship, wealth, and justice"],"body":["舌頭、朋友、法庭、錢財與名聲成為智慧的試場。","Tongue, friendship, court, money, and reputation test wisdom."]},{"refs":"23–29","title":["勸誡與希西家集","Warnings and Hezekiah collection"],"body":["飲酒、結交、法庭證言、愚昧與治理的格言交替。","Sayings on drink, friends, testimony, folly, and government alternate."]},{"refs":"30–31","title":["亞古珥、利慕伊勒與婦人","Agur, Lemuel, and the woman"],"body":["數字箴言、王的責任與才德婦人詩為全書作結。","Numerical sayings, royal counsel, and the capable woman close the book."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["第 10–29 章多為短句集錦；相鄰兩節未必構成連續論證。箴言是一般觀察，應與《約伯記》《傳道書》一起讀。","Most of chapters 10–29 collect short sayings; adjacent lines need not form one argument. Read these patterns with Job and Ecclesiastes."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["敬畏與智慧的呼聲","Fear and Wisdom’s call"],"summary":["序言界定智慧、敬畏與學習；父親警告暴力同夥，智慧在街上呼喚。","The prologue defines wisdom and fear; a father warns of violent companions while Wisdom calls publicly."],"deep":[["智慧不是秘密技術，而公開邀人回應。","Wisdom is a public invitation, not secret technique."],["第 1 章「敬畏耶和華」是全書讀法的起點。","Fear of the Lord in chapter 1 frames the book."]],"caution":["不可把父親對兒子的話當作只屬男性的智慧。","Do not restrict wisdom to men because of the father-son frame."],"question":["哪一節最能支持「智慧不是秘密技術，而公開邀人回應。」的觀察？","Which verse best supports the observation “Wisdom is a public invitation, not secret technique.”?"]},{"n":2,"refs":"2","title":["尋求智慧如尋寶","Seeking wisdom as treasure"],"summary":["呼籲讀者殷勤尋求智慧，讓公義保護腳步，遠離惡路。","The reader is urged to seek wisdom like treasure; discernment guards against unjust paths."],"deep":[["「尋找」和「領受」並存，智慧既要努力也要謙卑。","Seeking and receiving belong together."],["第 1 章「敬畏耶和華」是全書讀法的起點。","Fear of the Lord in chapter 1 frames the book."]],"caution":["不可把父親對兒子的話當作只屬男性的智慧。","Do not restrict wisdom to men because of the father-son frame."],"question":["哪一節最能支持「「尋找」和「領受」並存，智慧既要努力也要謙卑。」的觀察？","Which verse best supports the observation “Seeking and receiving belong together.”?"]},{"n":3,"refs":"3","title":["信靠與慈愛","Trust and steadfast love"],"summary":["吩咐人專心信靠神、行慈愛誠實，善待鄰舍並接受管教。","Trust in God, loyal love, neighbor care, and correction are joined."],"deep":[["不可把 3:5–6 當作永不遇到曲折的保證。","Trust in 3:5–6 is no promise of an obstacle-free life."],["第 1 章「敬畏耶和華」是全書讀法的起點。","Fear of the Lord in chapter 1 frames the book."]],"caution":["不可把父親對兒子的話當作只屬男性的智慧。","Do not restrict wisdom to men because of the father-son frame."],"question":["哪一節最能支持「不可把 3:5–6 當作永不遇到曲折的保證。」的觀察？","Which verse best supports the observation “Trust in 3:5–6 is no promise of an obstacle-free life.”?"]},{"n":4,"refs":"4","title":["守心與道路","Guard the heart and path"],"summary":["父親傳承智慧，勸人保守心、口、眼與腳，不走惡路。","Parental instruction urges guarding heart, mouth, eyes, and feet."],"deep":[["身體意象使智慧成為全人生活方向。","Body imagery makes wisdom a whole-life direction."],["第 1 章「敬畏耶和華」是全書讀法的起點。","Fear of the Lord in chapter 1 frames the book."]],"caution":["不可把父親對兒子的話當作只屬男性的智慧。","Do not restrict wisdom to men because of the father-son frame."],"question":["哪一節最能支持「身體意象使智慧成為全人生活方向。」的觀察？","Which verse best supports the observation “Body imagery makes wisdom a whole-life direction.”?"]},{"n":5,"refs":"5","title":["婚姻中的忠誠","Fidelity in marriage"],"summary":["警戒不忠關係的代價，並以自己配偶的親密喜樂作對比。","Warnings about infidelity contrast with joy in one’s spouse."],"deep":[["倫理核心是守約而非恐懼女性。","The ethical center is fidelity, not fear of women."],["性倫理與守約關係相連，而非把女性當危險本身。","Sexual ethics concerns covenant fidelity, not women as inherent threats."]],"caution":["不要將誘惑者形象用於貶低所有女性或羞辱受害者。","Do not stigmatize women or shame victims."],"question":["哪一節最能支持「倫理核心是守約而非恐懼女性。」的觀察？","Which verse best supports the observation “The ethical center is fidelity, not fear of women.”?"]},{"n":6,"refs":"6","title":["保證、懶惰與誘惑","Debt, sloth, and seduction"],"summary":["勸人謹慎擔保、向螞蟻學勤勞，末段再警告不忠。","The chapter warns about surety, laziness, and infidelity."],"deep":[["多段短訓彼此並列，不必勉強成單一故事。","Several instructions sit together, not one continuous story."],["性倫理與守約關係相連，而非把女性當危險本身。","Sexual ethics concerns covenant fidelity, not women as inherent threats."]],"caution":["不要將誘惑者形象用於貶低所有女性或羞辱受害者。","Do not stigmatize women or shame victims."],"question":["哪一節最能支持「多段短訓彼此並列，不必勉強成單一故事。」的觀察？","Which verse best supports the observation “Several instructions sit together, not one continuous story.”?"]},{"n":7,"refs":"7","title":["愚昧者的誘惑","A seduction scene"],"summary":["父親從窗邊觀察少年走向誘惑，以生動故事勸人警醒。","A father watches a youth move toward seduction and warns vividly."],"deep":[["敘事讓讀者看見一步步走近風險的過程。","The narrative tracks gradual movement toward risk."],["性倫理與守約關係相連，而非把女性當危險本身。","Sexual ethics concerns covenant fidelity, not women as inherent threats."]],"caution":["不要將誘惑者形象用於貶低所有女性或羞辱受害者。","Do not stigmatize women or shame victims."],"question":["哪一節最能支持「敘事讓讀者看見一步步走近風險的過程。」的觀察？","Which verse best supports the observation “The narrative tracks gradual movement toward risk.”?"]},{"n":8,"refs":"8","title":["智慧與創造","Wisdom and creation"],"summary":["智慧在城門呼叫，宣稱自己比金銀寶貴，並在創造之初與神同在。","Wisdom speaks at the gate, outvalues wealth, and is pictured at creation."],"deep":[["擬人化智慧將倫理抉擇放進創造秩序。","Personified Wisdom places ethics within creation."],["第 9 章兩場宴席要求讀者選擇聽誰。","The two meals of chapter 9 ask whose invitation readers accept."]],"caution":["擬人化是詩歌修辭，不宜草率做成單一系統神學。","Personification is poetic imagery, not a ready-made systematic theology."],"question":["哪一節最能支持「擬人化智慧將倫理抉擇放進創造秩序。」的觀察？","Which verse best supports the observation “Personified Wisdom places ethics within creation.”?"]},{"n":9,"refs":"9","title":["兩場宴席","Two rival feasts"],"summary":["智慧與愚昧都邀單純人赴宴；敬畏神與受教決定生命方向。","Wisdom and Folly each invite the naive to a meal; teachability marks the choice."],"deep":[["兩個邀請看似相近，結果卻不同。","The two invitations look similar but lead apart."],["第 9 章兩場宴席要求讀者選擇聽誰。","The two meals of chapter 9 ask whose invitation readers accept."]],"caution":["擬人化是詩歌修辭，不宜草率做成單一系統神學。","Personification is poetic imagery, not a ready-made systematic theology."],"question":["哪一節最能支持「兩個邀請看似相近，結果卻不同。」的觀察？","Which verse best supports the observation “The two invitations look similar but lead apart.”?"]},{"n":10,"refs":"10","title":["所羅門格言開始","Solomonic sayings begin"],"summary":["勤惰、言語與義惡的對比短句開啟新的格言集合。","Short contrasts on work, speech, and justice open the Solomonic sayings."],"deep":[["逐句比較前後半句，尋找對應與反轉。","Compare each proverb’s two halves for contrast."],["每句須留意對比兩半，不要只摘一句當萬用公式。","Attend to both halves of each contrast, not isolated formulas."]],"caution":["一般規律不是對個人命運的保證。","General patterns are not personal guarantees."],"question":["哪一節最能支持「逐句比較前後半句，尋找對應與反轉。」的觀察？","Which verse best supports the observation “Compare each proverb’s two halves for contrast.”?"]},{"n":11,"refs":"11","title":["誠實與慷慨","Integrity and generosity"],"summary":["公道天平、謙卑、施與及城中義人連在一章。","Honest scales, humility, generosity, and communal welfare recur."],"deep":[["個人誠實影響整座城。","Private integrity affects a whole city."],["每句須留意對比兩半，不要只摘一句當萬用公式。","Attend to both halves of each contrast, not isolated formulas."]],"caution":["一般規律不是對個人命運的保證。","General patterns are not personal guarantees."],"question":["哪一節最能支持「個人誠實影響整座城。」的觀察？","Which verse best supports the observation “Private integrity affects a whole city.”?"]},{"n":12,"refs":"12","title":["言語與勤勞","Speech and diligence"],"summary":["喜愛管教、誠實說話、勤作與顧惜牲畜交錯。","Correction, truthful speech, work, and care for animals alternate."],"deep":[["義人的憐憫延及不會替自己說話的生命。","Compassion reaches beings unable to speak for themselves."],["每句須留意對比兩半，不要只摘一句當萬用公式。","Attend to both halves of each contrast, not isolated formulas."]],"caution":["一般規律不是對個人命運的保證。","General patterns are not personal guarantees."],"question":["哪一節最能支持「義人的憐憫延及不會替自己說話的生命。」的觀察？","Which verse best supports the observation “Compassion reaches beings unable to speak for themselves.”?"]},{"n":13,"refs":"13","title":["受教與財富","Teachability and wealth"],"summary":["智慧子聽勸，勤奮、言語與財富如何使用被比較。","A teachable child, work, speech, and the use of wealth are compared."],"deep":[["富足與貧乏的句子須放在全書其他公義箴言旁讀。","Read wealth sayings beside the book’s justice sayings."],["相似主題散布多章，可用索引式讀法比較差異。","Recurring themes invite comparison across chapters."]],"caution":["不要以單節教養箴言判定某家庭成敗。","Do not use one parenting saying to judge a family."],"question": 濟、家庭與社會行動。","The final woman turns wisdom into economic, household, and civic action."]],"caution":["不可把末章讀成每位女性必須完成的工作清單。","Do not make chapter 31 a mandatory checklist for every woman."],"question":["哪一節最能支持「承認不知道也是智慧的一部分。」的觀察？","Which verse best supports the observation “Admitting ignorance can be wisdom.”?"]},{"n":31,"refs":"31","title":["利慕伊勒與才德婦人","Lemuel and the capable woman"],"summary":["母親教王為貧者發聲；才德婦人以經營、施與、智慧與敬畏受稱讚。","A mother tells a king to defend poor people; a capable woman is praised for enterprise, generosity, wisdom, and reverence."],"deep":[["結尾的婦人不是靜態角色，而是主動經營並關懷社群。","The final woman acts in enterprise and community care."],["末章的婦人把智慧轉為經濟、家庭與社會行動。","The final woman turns wisdom into economic, household, and civic action."]],"caution":["不可把末章讀成每位女性必須完成的工作清單。","Do not make chapter 31 a mandatory checklist for every woman."],"question":["哪一節最能支持「結尾的婦人不是靜態角色，而是主動經營並關懷社群。」的觀察？","Which verse best supports the observation “The final woman acts in enterprise and community care.”?"]}],"themesIntro":["以下主題由箴言的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of Proverbs and complement the chapter studies."],"themes":[{"refs":"1–4","title":["智慧的入口","Entering wisdom"],"body":["父親的訓誨與智慧之聲邀人遠離惡友，重視敬畏、信靠與教導。","Parental instruction and Wisdom’s voice invite avoidance of violence and trust in God."],"caution":["不可把父親對兒子的話當作只屬男性的智慧。","Do not restrict wisdom to men because of the father-son frame."]},{"refs":"8–9","title":["智慧與愚昧的邀請","Two invitations"],"body":["智慧與愚昧被擬人化為兩位邀請者；智慧說自己與創造同在。","Wisdom and Folly become rival hosts; Wisdom is portrayed alongside creation."],"caution":["擬人化是詩歌修辭，不宜草率做成單一系統神學。","Personification is poetic imagery, not a ready-made systematic theology."]},{"refs":"13–17","title":["家庭、權力與言語","Family, power, and speech"],"body":["教養、君王、貧窮、溫柔回答與神的主權反覆出現。","Parenting, kingship, poverty, gentle speech, and divine sovereignty recur."],"caution":["不要以單節教養箴言判定某家庭成敗。","Do not use one parenting saying to judge a family."]},{"refs":"23–29","title":["勸誡與希西家集","Warnings and Hezekiah collection"],"body":["飲酒、結交、法庭證言、愚昧與治理的格言交替。","Sayings on drink, friends, testimony, folly, and government alternate."],"caution":["針對愚人的話必須依情境判斷，不能照字面互相抵銷。","Apparently conflicting sayings about fools require context."]},{"refs":"30–31","title":["亞古珥、利慕伊勒與婦人","Agur, Lemuel, and the woman"],"body":["數字箴言、王的責任與才德婦人詩為全書作結。","Numerical sayings, royal counsel, and the capable woman close the book."],"caution":["不可把末章讀成每位女性必須完成的工作清單。","Do not make chapter 31 a mandatory checklist for every woman."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["不要用勤勞、教養或財富箴言責備貧窮者、病人與父母；問具體處境、制度與例外。","Do not use sayings on work, parenting, or wealth to blame poor people, patients, or parents; attend to circumstances and exceptions."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–4","title":["第 1 課｜智慧的入口","Lesson 1 | Entering wisdom"],"aim":["父親的訓誨與智慧之聲邀人遠離惡友，重視敬畏、信靠與教導。","Parental instruction and Wisdom’s voice invite avoidance of violence and trust in God."],"flow":[["讀 1 章：智慧不是秘密技術，而公開邀人回應。","Read chapter 1: Wisdom is a public invitation, not secret technique."],["對照 1–4 章：第 1 章「敬畏耶和華」是全書讀法的起點。","Compare chapters 1–4: Fear of the Lord in chapter 1 frames the book."],["討論：哪一節最能支持「身體意象使智慧成為全人生活方向。」的觀察？","Discuss: Which verse best supports the observation “Body imagery makes wisdom a whole-life direction.”?"]],"question":["哪一節最能支持「智慧不是秘密技術，而公開邀人回應。」的觀察？","Which verse best supports the observation “Wisdom is a public invitation, not secret technique.”?"],"practice":["不可把父親對兒子的話當作只屬男性的智慧。","Do not restrict wisdom to men because of the father-son frame."]},{"refs":"5–7","title":["第 2 課｜親密關係與風險","Lesson 2 | Intimacy and risk"],"aim":["父親警告不忠與誘惑，也教導勤奮及守約。","Instructions warn about infidelity and seduction while teaching diligence."],"flow":[["讀 5 章：倫理核心是守約而非恐懼女性。","Read chapter 5: The ethical center is fidelity, not fear of women."],["對照 5–7 章：性倫理與守約關係相連，而非把女性當危險本身。","Compare chapters 5–7: Sexual ethics concerns covenant fidelity, not women as inherent threats."],["討論：哪一節最能支持「敘事讓讀者看見一步步走近風險的過程。」的觀察？","Discuss: Which verse best supports the observation “The narrative tracks gradual movement toward risk.”?"]],"question":["哪一節最能支持「倫理核心是守約而非恐懼女性。」的觀察？","Which verse best supports the observation “The ethical center is fidelity, not fear of women.”?"],"practice":["不要將誘惑者形象用於貶低所有女性或羞辱受害者。","Do not stigmatize women or shame victims."]},{"refs":"8–9","title":["第 3 課｜智慧與愚昧的邀請","Lesson 3 | Two invitations"],"aim":["智慧與愚昧被擬人化為兩位邀請者；智慧說自己與創造同在。","Wisdom and Folly become rival hosts; Wisdom is portrayed alongside creation."],"flow":[["讀 8 章：擬人化智慧將倫理抉擇放進創造秩序。","Read chapter 8: Personified Wisdom places ethics within creation."],["對照 8–9 章：第 9 章兩場宴席要求讀者選擇聽誰。","Compare chapters 8–9: The two meals of chapter 9 ask whose invitation readers accept."],["討論：哪一節最能支持「兩個邀請看似相近，結果卻不同。」的觀察？","Discuss: Which verse best supports the observation “The two invitations look similar but lead apart.”?"]],"question":["哪一節最能支持「擬人化智慧將倫理抉擇放進創造秩序。」的觀察？","Which verse best supports the observation “Personified Wisdom places ethics within creation.”?"],"practice":["擬人化是詩歌修辭，不宜草率做成單一系統神學。","Personification is poetic imagery, not a ready-made systematic theology."]},{"refs":"10–12","title":["第 4 課｜格言中的日常","Lesson 4 | Daily patterns in sayings"],"aim":["短句比較言語、誠實、勞動、施與和義惡。","Short sayings contrast speech, integrity, work, generosity, and justice."],"flow":[["讀 10 章：逐句比較前後半句，尋找對應與反轉。","Read chapter 10: Compare each proverb’s two halves for contrast."],["對照 10–12 章：每句須留意對比兩半，不要只摘一句當萬用公式。","Compare chapters 10–12: Attend to both halves of each contrast, not isolated formulas."],["討論：哪一節最能支持「義人的憐憫延及不會替自己說話的生命。」的觀察？","Discuss: Which verse best supports the observation “Compassion reaches beings unable to speak for themselves.”?"]],"question":["哪一節最能支持「逐句比較前後半句，尋找對應與反轉。」的觀察？","Which verse best supports the observation “Compare each proverb’s two halves for contrast.”?"],"practice":["一般規律不是對個人命運的保證。","General patterns are not personal guarantees."]},{"refs":"13–17","title":["第 5 課｜家庭、權力與言語","Lesson 5 | Family, power, and speech"],"aim":["教養、君王、貧窮、溫柔回答與神的主權反覆出現。","Parenting, kingship, poverty, gentle speech, and divine sovereignty recur."],"flow":[["讀 13 章：富足與貧乏的句子須放在全書其他公義箴言旁讀。","Read chapter 13: Read wealth sayings beside the book’s justice sayings."],["對照 13–17 章：相似主題散布多章，可用索引式讀法比較差異。","Compare chapters 13–17: Recurring themes invite comparison across chapters."],["討論：哪一節最能支持「「遮掩」過失不可成為掩護傷害的藉口。」的觀察？","Discuss: Which verse best supports the observation “Concealing offense must not cover abuse.”?"]],"question":["哪一節最能支持「富足與貧乏的句子須放在全書其他公義箴言旁讀。」的觀察？","Which verse best supports the observation “Read wealth sayings beside the book’s justice sayings.”?"],"practice":["不要以單節教養箴言判定某家庭成敗。","Do not use one parenting saying to judge a family."]},{"refs":"18–22","title":["第 6 課｜友誼、貧富與公義","Lesson 6 | Friendship, wealth, and justice"],"aim":["舌頭、朋友、法庭、錢財與名聲成為智慧的試場。","Tongue, friendship, court, money, and reputation test wisdom."],"flow":[["讀 18 章：話語可能造成真實後果，不能只當作個性問題。","Read chapter 18: Speech has real consequences beyond personality."],["對照 18–22 章：22:17 後轉入「智慧人的言語」，留意集合編排。","Compare chapters 18–22: At 22:17 the sayings of the wise begin; notice editorial groupings."],["討論：哪一節最能支持「留意 22:17 的編輯轉場。」的觀察？","Discuss: Which verse best supports the observation “Notice the collection shift at 22:17.”?"]],"question":["哪一節最能支持「話語可能造成真實後果，不能只當作個性問題。」的觀察？","Which verse best supports the observation “Speech has real consequences beyond personality.”?"],"practice":["不要把貧窮一概歸咎懶惰；書中也責備欺壓。","Do not blame poverty solely on laziness; the book also condemns oppression."]},{"refs":"23–29","title":["第 7 課｜勸誡與希西家集","Lesson 7 | Warnings and Hezekiah collection"],"aim":["飲酒、結交、法庭證言、愚昧與治理的格言交替。","Sayings on drink, friends, testimony, folly, and government alternate."],"flow":[["讀 23 章：宴席可成權力關係，智慧需要辨別。","Read chapter 23: A meal can carry power dynamics requiring discernment."],["對照 23–29 章：25 章標明另一收集階段，顯示傳承與編纂。","Compare chapters 23–29: Chapter 25 marks another collection and editorial transmission."],["討論：哪一節最能支持「領袖品格有集體後果。」的觀察？","Discuss: Which verse best supports the observation “A ruler’s character has collective consequences.”?"]],"question":["哪一節最能支持「宴席可成權力關係，智慧需要辨別。」的觀察？","Which verse best supports the observation “A meal can carry power dynamics requiring discernment.”?"],"practice":["針對愚人的話必須依情境判斷，不能照字面互相抵銷。","Apparently conflicting sayings about fools require context."]},{"refs":"30–31","title":["第 8 課｜亞古珥、利慕伊勒與婦人","Lesson 8 | Agur, Lemuel, and the woman"],"aim":["數字箴言、王的責任與才德婦人詩為全書作結。","Numerical sayings, royal counsel, and the capable woman close the book."],"flow":[["讀 30 章：承認不知道也是智慧的一部分。","Read chapter 30: Admitting ignorance can be wisdom."],["對照 30–31 章：末章的婦人把智慧轉為經濟、家庭與社會行動。","Compare chapters 30–31: The final woman turns wisdom into economic, household, and civic action."],["討論：哪一節最能支持「結尾的婦人不是靜態角色，而是主動經營並關懷社群。」的觀察？","Discuss: Which verse best supports the observation “The final woman acts in enterprise and community care.”?"]],"question":["哪一節最能支持「承認不知道也是智慧的一部分。」的觀察？","Which verse best supports the observation “Admitting ignorance can be wisdom.”?"],"practice":["不可把末章讀成每位女性必須完成的工作清單。","Do not make chapter 31 a mandatory checklist for every woman."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["箴言最常被忽略的人物是誰？為何？","Which character in Proverbs is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜箴言導讀","BibleProject | Proverbs guide"],"url":"https://bibleproject.com/guides/book-of-proverbs/"}],"footer":["箴言 · 成人主日學教師版 · 請配合完整經文閱讀。","Proverbs · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
