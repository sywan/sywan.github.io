<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="約書亞記成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>約書亞記｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"JOS","category":["歷史敘事 · 舊約","OLD TESTAMENT · NARRATIVE"],"name":["約書亞記","Joshua"],"subtitle":["從過約旦河到示劍立約，讀入地、征戰、分地與下一代的選擇；同時正視古代戰爭語言的倫理難題。","From the Jordan crossing to covenant at Shechem, read entry, conflict, allotment, and the next generation’s choice while facing the ethical difficulty of war."],"overviewIntro":["從過約旦河到示劍立約，讀入地、征戰、分地與下一代的選擇；同時正視古代戰爭語言的倫理難題。","From the Jordan crossing to covenant at Shechem, read entry, conflict, allotment, and the next generation’s choice while facing the ethical difficulty of war."],"lengthNote":["24 章；請按文學單元和整卷脈絡閱讀。","24 chapters; read each literary unit within the whole book."],"thesis":["應許中的土地與持續的忠誠","Land of promise and ongoing fidelity"],"thesisDetail":["土地不是故事的終點：律法、保護、記念與公義決定群體如何在其中生活。","Land is not the story’s endpoint; Torah, protection, remembrance, and justice shape communal life within it."],"keyQuestion":["承受應許之後，群體如何生活？","How should a community live after receiving a promise?"],"keyAnswer":["約書亞記以征戰與分地的張力，將領導者與全體百姓的忠誠放在同一問題中。","Joshua holds conflict and allocation in tension, asking both leader and people for fidelity."],"finalMovement":["示劍的選擇與領袖的葬事把故事交給士師記：應許已宣告，世代的忠誠仍需檢驗。","The Shechem covenant and leaders’ burials hand the story to Judges: promise is declared, but later fidelity remains to be tested."],"readingKeys":[{"refs":"1; 23–24","title":["首尾呼應","Opening and closing"],"body":["開頭吩咐約書亞守律法，結尾則要求全體持續抉擇。","The opening charges Joshua to keep Torah; the ending calls the whole people to choose."]},{"refs":"4; 22","title":["記念與解說","Memory and explanation"],"body":["石頭與祭壇的意義不是自明，需要代際對話與查證。","Stones and altar need intergenerational explanation and verification."]},{"refs":"13–21","title":["分地不是附錄","Allotment is central"],"body":["地界、逃城與利未城將應許轉成社會空間與司法制度。","Boundaries, refuge, and Levitical towns turn promise into social and legal space."]},{"refs":"6; 9; 20","title":["留意邊緣人物","Attend to marginal figures"],"body":["喇合、基遍人與誤殺者使讀者追問保護與歸屬。","Rahab, Gibeonites, and accidental killers raise questions of protection and belonging."]}],"mapIntro":["以下分段是教學導覽，章界有助查找，並非每一段論述的天然邊界。","These movements guide study; chapter divisions are useful but do not always mark a natural literary boundary."],"movements":[{"refs":"1–3","title":["第 1 課｜承接與過河","Lesson 1 | Succession and crossing"],"body":["比較摩西交棒、喇合的抉擇與約旦河的過渡。","Compare Joshua’s succession, Rahab’s choice, and the Jordan crossing."]},{"refs":"4–6","title":["第 2 課｜記念與耶利哥","Lesson 2 | Memory and Jericho"],"body":["從石頭、逾越節與耶利哥看身分更新及征戰難題。","Read stones, Passover, and Jericho as renewal alongside the moral challenge of war."]},{"refs":"7–9","title":["第 3 課｜失敗、重來與承諾","Lesson 3 | Failure, renewal, and promise"],"body":["艾城失敗與再戰，接上以巴路的讀經和基遍條約。","Set Ai’s defeat and renewal beside Torah reading and the Gibeonite treaty."]},{"refs":"10–12","title":["第 4 課｜征戰敘事與總結","Lesson 4 | Campaigns and summaries"],"body":["讀南北征戰、詩歌與諸王清單，辨認敘事總括語言。","Read campaigns, poetry, and king lists with attention to summary language."]},{"refs":"13–15","title":["第 5 課｜未完成的產業","Lesson 5 | Inheritance still unfinished"],"body":["從未得之地、迦勒與押撒看應許、等待和生活資源。","Read remaining land, Caleb, and Achsah for promise, waiting, and livelihood."]},{"refs":"16–19","title":["第 6 課｜分地、公平與差異","Lesson 6 | Allocation and difference"],"body":["讀以法蓮、瑪拿西與七支派的分配，注意女性承產與實際限制。","Study tribal allotments with attention to daughters’ inheritance and practical limits."]},{"refs":"20–22","title":["第 7 課｜避難、教導與誤會","Lesson 7 | Refuge and misunderstanding"],"body":["把逃城、利未城與河東祭壇作為共同生活的制度案例。","Read refuge cities, Levitical towns, and the eastern altar as structures for community."]},{"refs":"23–24","title":["第 8 課｜記憶、選擇與交棒","Lesson 8 | Memory, choice, and succession"],"body":["比較兩篇告別講話與三場葬事，看下一代的責任。","Compare two farewell speeches and three burials to consider the next generation."]}],"mapCaution":{"title":["歷史與文學提醒","Historical and literary note"],"body":["本書以古代敘事、神學評價與編排方式說話；章節與年代問題宜參照整卷上下文，避免把故事當作現代新聞紀錄。","This ancient narrative communicates through theological evaluation and literary design; read episodes in context rather than as modern reporting."]},"chaptersIntro":["每章有摘要、兩個深入重點、詮釋提醒與課堂提問。章名與分段是本站的研讀提示。","Each chapter has a summary, two close-reading points, an interpretive caution, and a teaching question. Titles and divisions are study aids."],"chapters":[{"n":1,"refs":"1","title":["新領袖與律法書","A new leader and the Torah"],"summary":["摩西死後，神命約書亞帶領百姓過河；剛強的命令與晝夜默想律法相連，河東支派也承諾同行。","After Moses dies, Joshua is charged to lead across the Jordan; courage is tied to meditating on Torah, and eastern tribes pledge solidarity."],"deep":[["「剛強」不等於任意行動，須受律法約束","Courage is constrained by Torah rather than impulse"],["河東支派先協助別人得地才回自己的產業","Eastern tribes must help others receive land before returning home"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["領導者的勇敢與忠於教導如何相連？","How are leadership courage and fidelity to instruction joined?"]},{"n":2,"refs":"2","title":["喇合保護探子","Rahab protects the scouts"],"summary":["兩名探子進耶利哥，喇合藏匿他們並承認耶和華的作為；她為全家求保護，以朱紅繩作記號。","Two scouts enter Jericho; Rahab shelters them, acknowledges Israel’s God, and seeks protection for her household marked by a scarlet cord."],"deep":[["外族女性的信心對比以色列早期探子的恐懼","A foreign woman’s trust contrasts with earlier Israelite fear"],["她的冒險選擇也為家人爭取生存","Her risky action seeks survival for her household"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["敘事為何讓喇合成為入地故事的關鍵人物？","Why does the entry story give Rahab such a decisive role?"]},{"n":3,"refs":"3","title":["約旦河前的預備與過河","Preparation and crossing the Jordan"],"summary":["祭司抬約櫃先入河，水停住，百姓在旱地過約旦；神藉此堅立約書亞的領導。","Priests carrying the ark enter first; waters stop and Israel crosses dry ground, confirming Joshua’s leadership."],"deep":[["約櫃在前凸顯神的同在而非軍事技巧","The ark foregrounds divine presence rather than military skill"],["百姓須等候祭司踏水，信靠與行動相扣","Waiting for priests to step into water connects trust and action"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["過河敘事如何回應出埃及記的過海？","How does the crossing echo the exodus through the sea?"]},{"n":4,"refs":"4","title":["十二塊石頭作記號","Twelve stones for remembrance"],"summary":["每支派取石立記念，供日後子孫發問；河中與吉甲的石頭把過河經驗變成跨代教導。","One stone per tribe becomes a memorial for children’s questions; stones in the river and at Gilgal turn crossing into intergenerational teaching."],"deep":[["記號需要解說才不會只是地景","Memorials need explanation, not mere display"],["十二支派共同紀念，避免將成功歸一人","Twelve tribes remember together rather than crediting one hero"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["你的群體如何把經驗轉成可被追問的記憶？","How can a community turn experience into teachable memory?"]},{"n":5,"refs":"5","title":["吉甲更新與耶和華軍隊的元帥","Renewal at Gilgal and the divine commander"],"summary":["新一代受割禮、守逾越節，嗎哪停止；約書亞遇見持刀者，被命脫鞋，預備面對耶利哥。","The new generation is circumcised and keeps Passover; manna ceases, and Joshua meets a sword-bearing commander who commands reverence."],"deep":[["入地先有盟約記念，後有城戰","Covenant remembrance precedes battle"],["「你是幫助我們的嗎」被反問，神不受領袖操控","Joshua’s question is overturned; God is not a leader’s instrument"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["敬拜與順服如何重新界定將來的行動？","How do worship and obedience reframe what follows?"]},{"n":6,"refs":"6","title":["耶利哥與喇合得救","Jericho and Rahab’s rescue"],"summary":["百姓繞城、吹角、呼喊，城牆倒塌；喇合一家被救出，城的毀滅與保護並列。","Israel marches, blows trumpets, and shouts; Jericho falls while Rahab’s household is spared amid destruction."],"deep":[["繞城次序讓勝利歸神而非攻城技術","The procession attributes victory to God, not siege craft"],["喇合得救使外族人並非單一被排除類別","Rahab’s rescue resists a single category for outsiders"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["如何誠實講述得勝與毀滅同在的段落？","How can we teach victory and destruction together honestly?"]},{"n":7,"refs":"7","title":["亞干的隱藏與艾城失敗","Achan’s hidden theft and Ai’s defeat"],"summary":["艾城小戰失利，約書亞哀求；抽籤揭露亞干私取當滅之物，審判凸顯群體與個人責任。","A small campaign at Ai fails; Joshua laments, and lots expose Achan’s taking of banned goods, raising communal and personal responsibility."],"deep":[["戰敗打破一路凱旋的敘事","Defeat interrupts triumphalism"],["隱藏的財物與公開的認罪形成尖銳對比","Concealed goods contrast with public confession"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["群體責任如何避免變成對無辜者的任意懲罰？","How can communal accountability avoid punishing the innocent?"]},{"n":8,"refs":"8","title":["艾城再戰與以巴路山讀律法","Ai revisited and Torah read at Ebal"],"summary":["神重新指示戰術，艾城被攻下；約書亞在以巴路山築壇，向全會眾宣讀律法的祝福與咒詛。","God gives new battle instructions; Ai falls, and Joshua builds an altar at Ebal, reading Torah’s blessings and curses to the whole assembly."],"deep":[["埋伏與前章輕敵形成對比","The ambush contrasts with earlier overconfidence"],["婦女、孩子與寄居者同聽律法，盟約不是精英私產","Women, children, and resident foreigners hear Torah together"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["為何征戰之後要讓全體聽見律法？","Why follow battle with a public reading of Torah?"]},{"n":9,"refs":"9","title":["基遍人的計謀與守約","Gibeon’s deception and an oath kept"],"summary":["基遍人裝作遠客求盟，以色列未求問神便立約；真相揭露後，領袖仍守誓，基遍人服役。","Gibeonites pose as distant visitors; Israel makes a treaty without inquiry and keeps its oath after discovering the deception."],"deep":[["破舊食物與衣物是說服工具，卻不足以取代辨識","Worn provisions persuade, but evidence needs discernment"],["錯誤決策之後守誓仍有倫理重量","Keeping an oath still matters after a flawed decision"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["承認決策錯誤與守住承諾如何並存？","How can admitting a mistake coexist with keeping a promise?"]},{"n":10,"refs":"10","title":["南方聯盟與日月詩歌","Southern coalition and the sun-and-moon poem"],"summary":["五王攻基遍，以色列應盟友求援；敘事記載冰雹、日月停住與南方多城戰事。","Five kings attack Gibeon; Israel responds to its ally, and the account includes hail, the sun-and-moon poem, and southern campaigns."],"deep":[["援助基遍落實第九章的誓言","Aid to Gibeon enacts the oath of chapter 9"],["日月段落引用雅煞珥書，應留意詩歌與敘事的交織","The Jasher citation blends poetry with narrative"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["讀者如何在神學宣稱與難解的天象描寫間保持謹慎？","How can readers handle the theological claim and puzzling celestial language carefully?"]},{"n":11,"refs":"11","title":["北方聯盟與仍待得之地","Northern coalition and remaining land"],"summary":["夏瑣領導北方聯軍，約書亞突襲並延續征戰；章末說地得享太平，卻仍需與後文未得之地同讀。","Hazor heads a northern coalition; Joshua attacks, and the land rests from war, though later chapters still name land remaining."],"deep":[["王與戰車的規模襯托神「不要懼怕」的命令","The scale of kings and chariots frames the command not to fear"],["「全地」是敘事總括，須與分地細節互讀","The summary of all the land must be read beside later incomplete possession"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["全書如何同時說「得地」與「尚未得地」？","How can the book speak of land gained and land yet remaining?"]},{"n":12,"refs":"12","title":["兩岸諸王清單","List of defeated kings on both banks"],"summary":["摩西與約書亞時期被擊敗的諸王依約旦河東西列出，將長期衝突整理成共同記憶。","A list of defeated kings east and west of the Jordan turns many campaigns into a shared account."],"deep":[["清單接合摩西與約書亞的帶領","The list joins Moses’ and Joshua’s leadership"],["王名不是可任意套用今日國族敵人的名冊","Ancient king names are not a template for modern enemies"]],"caution":["征戰與「當滅」語言屬古代敘事；不可用於合理化今日宗教、民族或土地暴力。","Ancient warfare and destruction language cannot authorize modern religious, ethnic, or territorial violence."],"question":["清單在敘事中承擔甚麼記憶功能？","What work does this list do in the narrative?"]},{"n":13,"refs":"13","title":["未得之地與河東產業","Remaining land and eastern inheritances"],"summary":["約書亞年老，神指出尚待得之地；本章先回顧摩西分給河東支派的產業，也說利未人以神為產業。","As Joshua ages, God names land still remaining; the chapter reviews eastern allotments and the Levites’ distinct inheritance."],"deep":[["「尚未」限制了速勝想像","Remaining land limits triumphal claims"],["分地敘事仍保留利未人與其他支派的差異","The Levites’ inheritance differs from territorial allotments"]],"caution":["地界與清單是古代產業編排，不可直接映射到現代國界或排斥政策。","Ancient allotments must not be mapped directly onto modern borders or exclusion."],"question":["未完成的應許如何改變對成功的定義？","How does unfinished promise reshape success?"]},{"n":14,"refs":"14","title":["迦勒求希伯崙","Caleb asks for Hebron"],"summary":["迦勒重述探地時的忠誠，年老仍求山地；約書亞把希伯崙給他，敘事將長久等待與產業相連。","Caleb recalls his loyal report and, though old, asks for the hill country; Joshua grants Hebron after decades of waiting."],"deep":[["迦勒的請求回應民數記十四章","Caleb’s request echoes Numbers 14"],["山地仍有亞衲人，得地不是免除困難","Anakim remain, so inheritance does not erase difficulty"]],"caution":["地界與清單是古代產業編排，不可直接映射到現代國界或排斥政策。","Ancient allotments must not be mapped directly onto modern borders or exclusion."],"question":["長久等待如何不被簡化成一帆風順的獎賞？","How can long waiting be taught without promising easy reward?"]},{"n":15,"refs":"15","title":["猶大地界、押撒與耶布斯人","Judah’s boundaries, Achsah, and Jebusites"],"summary":["猶大地界與城邑詳列；迦勒家中押撒求水泉，而耶布斯人仍住耶路撒冷。","Judah’s borders and towns are detailed; Achsah asks for springs, while Jebusites remain in Jerusalem."],"deep":[["押撒主動求水使土地與生計連在一起","Achsah’s request joins land to livelihood"],["耶布斯人未被趕出提醒分配與實際控制有距離","Jebusites remaining expose the gap between allotment and control"]],"caution":["地界與清單是古代產業編排，不可直接映射到現代國界或排斥政策。","Ancient allotments must not be mapped directly onto modern borders or exclusion."],"question":["分得土地與能在土地上生活有何差別？","What differs between receiving land and living well on it?"]},{"n":16,"refs":"16","title":["以法蓮地界與未逐居民","Ephraim’s boundaries and remaining residents"],"summary":["約瑟子孫中以法蓮的地界列出；基色的迦南人未被趕出，而成為服役者。","Ephraim’s allotment is recorded, but Canaanites at Gezer remain and are put to forced labor."],"deep":[["簡短的地界表也留有不完整的尾聲","Even a short boundary list ends with incompletion"],["強制服役不應被當成今日可仿效的勞動制度","Forced labor is not a present-day model"]],"caution":["地界與清單是古代產業編排，不可直接映射到現代國界或排斥政策。","Ancient allotments must not be mapped directly onto modern borders or exclusion."],"question":["一句「沒有趕出」如何預備士師記的問題？","How does one line about remaining residents anticipate Judges?"]},{"n":17,"refs":"17","title":["瑪拿西、女兒承產與山地","Manasseh, daughters’ inheritance, and hills"],"summary":["瑪拿西的地界包括西羅非哈女兒的承產；約瑟子孫嫌土地不足，約書亞要求開墾山地。","Manasseh’s inheritance includes Zelophehad’s daughters; Joseph’s descendants seek more room and are told to clear hill country."],"deep":[["女兒承產承接民數記中的申訴與修法","The daughters’ allotment fulfills an earlier legal claim"],["鐵車難題使土地分配與實際能力相撞","Iron chariots bring allotment into contact with real obstacles"]],"caution":["地界與清單是古代產業編排，不可直接映射到現代國界或排斥政策。","Ancient allotments must not be mapped directly onto modern borders or exclusion."],"question":["何時需要制度承認，何時還需要實際資源？","When does legal recognition still need practical resources?"]},{"n":18,"refs":"18","title":["示羅會幕與七支派分地","Shiloh and the seven remaining tribes"],"summary":["會眾在示羅立會幕，七支派尚未領受地業；派人測繪後抽籤，先列便雅憫地界。","The assembly sets the tent at Shiloh; seven tribes still lack allotments, so surveyors map the land before lots assign Benjamin."],"deep":[["敬拜中心與分配工作同在示羅進行","Worship and land allocation meet at Shiloh"],["測繪把抽籤之前的行政責任凸顯出來","Surveying shows human administrative work before lots"]],"caution":["地界與清單是古代產業編排，不可直接映射到現代國界或排斥政策。","Ancient allotments must not be mapped directly onto modern borders or exclusion."],"question":["信靠神與仔細調查為何可以同時存在？","Why can trust in God coexist with careful surveying?"]},{"n":19,"refs":"19","title":["其餘支派與約書亞的產業","Remaining tribes and Joshua’s allotment"],"summary":["西緬、以西布倫、以薩迦、亞設、拿弗他利、但分得地界，最後約書亞自己得城。","Simeon, Zebulun, Issachar, Asher, Naphtali, and Dan receive allotments; Joshua receives a town last."],"deep":[["西緬分在猶大境內顯示地界非同質","Simeon’s portion within Judah shows varied geography"],["領袖最後領受，與爭先奪利的模式不同","The leader receives last rather than first"]],"caution":["地界與清單是古代產業編排，不可直接映射到現代國界或排斥政策。","Ancient allotments must not be mapped directly onto modern borders or exclusion."],"question":["分地清單如何讓讀者看見公平與差異？","How can allotment lists reveal both equity and difference?"]},{"n":20,"refs":"20","title":["逃城與限制報復","Refuge cities and restrained vengeance"],"summary":["指定約旦兩岸的逃城，讓誤殺者可先逃避血仇並在會眾前受審。","Cities of refuge on both sides of the Jordan shelter those who kill unintentionally until trial before the assembly."],"deep":[["逃城不等於取消審理，而是先防止即刻報復","Refuge does not replace trial; it delays revenge"],["寄居者也可使用，保護不只為本族","Resident foreigners also have access"]],"caution":["盟約宣誓與警告要放在神先行拯救的故事中，避免把信仰變成強迫表態。","Read vows and warnings within the prior story of deliverance; do not coerce declarations of faith."],"question":["司法程序如何保護受害者與被指控者？","How can process protect both victims and accused persons?"]},{"n":21,"refs":"21","title":["利未城、應許與未竟張力","Levitical towns and the promise’s tension"],"summary":["各支派給利未人城邑與郊野；結尾強調神所應許的土地與安息，須與先前未得地的細節一同閱讀。","Tribes give towns to the Levites; the conclusion celebrates promised land and rest while earlier unfinished details remain."],"deep":[["利未人的分散使教導與敬拜進入各地","Levitical dispersion brings instruction across the land"],["總結是神學肯定，不應抹去第十三章的「尚未」","The theological summary does not erase chapter 13’s remaining land"]],"caution":["盟約宣誓與警告要放在神先行拯救的故事中，避免把信仰變成強迫表態。","Read vows and warnings within the prior story of deliverance; do not coerce declarations of faith."],"question":["如何尊重總結的喜樂又不否認未完成？","How can we honor the conclusion without denying incompletion?"]},{"n":22,"refs":"22","title":["河東祭壇與衝突化解","The eastern altar and averted conflict"],"summary":["河東支派回家後築大祭壇，河西支派懷疑背叛；雙方對話得知它是見證，不是另立獻祭中心。","Eastern tribes build a large altar; western tribes suspect rebellion, but dialogue reveals it as a witness, not a rival sacrifice site."],"deep":[["使團先質問再聽解釋，避免內戰","A delegation confronts and then listens, averting civil war"],["同一宗教符號可被不同社群讀成不同意思","The same symbol can carry different meanings"]],"caution":["盟約宣誓與警告要放在神先行拯救的故事中，避免把信仰變成強迫表態。","Read vows and warnings within the prior story of deliverance; do not coerce declarations of faith."],"question":["面對令人不安的行動，群體如何先查證再定罪？","How can a community investigate before condemning?"]},{"n":23,"refs":"23","title":["約書亞晚年的警告","Joshua’s farewell warning"],"summary":["約書亞提醒領袖記念神的幫助、守住律法與約，並警告偏離會使土地失去。","Joshua reminds leaders of divine help, Torah, and covenant, warning that turning aside endangers life in the land."],"deep":[["「一人追趕千人」回顧恩典而非炫耀軍力","The battle image recalls help rather than boasting"],["應許與警告同時構成未來的選擇","Promise and warning frame future choices"]],"caution":["盟約宣誓與警告要放在神先行拯救的故事中，避免把信仰變成強迫表態。","Read vows and warnings within the prior story of deliverance; do not coerce declarations of faith."],"question":["成功以後為何仍需要警醒？","Why is vigilance needed after apparent success?"]},{"n":24,"refs":"24","title":["示劍立約與三場埋葬","Covenant at Shechem and three burials"],"summary":["約書亞重述由先祖至入地的歷史，要求百姓選擇所事奉者；立約後記下約書亞、約瑟與以利亞撒的葬事。","Joshua retells the history from the ancestors to the land and calls for a choice of worship; the book closes with three burials."],"deep":[["「至於我和我家」置於神先行作為的敘事後","The household declaration follows a history of prior divine action"],["三場埋葬把領袖世代結束與後續試驗連起來","Three burials close a generation and open the next test"]],"caution":["盟約宣誓與警告要放在神先行拯救的故事中，避免把信仰變成強迫表態。","Read vows and warnings within the prior story of deliverance; do not coerce declarations of faith."],"question":["群體宣誓之後，甚麼能幫助下一代記得？","What helps a new generation remember after a public vow?"]}],"themesIntro":["以下主題橫跨全書；先讀完整經文，再比較各段的不同聲音。","These themes run through the book; read full passages before comparing their distinct voices."],"themes":[{"refs":"1:7–9; 8:30–35; 23:6","title":["律法與領導","Torah and leadership"],"body":["領袖的勇氣須受神的教導約束，全體聽經使權力不只掌握在軍事領袖手中。","A leader’s courage is bounded by instruction, and public reading keeps teaching beyond military power."],"caution":["不可將剛強讀成領袖永不受質疑。","Courage does not make leaders immune to critique."]},{"refs":"2; 6; 9; 20","title":["外族人與保護","Outsiders and protection"],"body":["喇合、基遍人與逃城中的寄居者讓入地故事不只是內外二分。","Rahab, Gibeon, and resident foreigners in refuge cities complicate an inside/outside binary."],"caution":["不要用個案抹平征戰中的苦難。","Individual exceptions do not erase the suffering of war."]},{"refs":"13:1; 15:63; 21:43–45","title":["應許與未竟","Promise and incompletion"],"body":["全書既宣告土地與安息，也持續指出尚未取得、未能安居的地點。","The book declares land and rest while repeatedly naming places still unconquered or unsettled."],"caution":["勿強迫所有張力在單一經文中解決。","Do not flatten literary tension into one verse."]},{"refs":"4; 22; 24","title":["記號、見證與下一代","Memorials, witnesses, and heirs"],"body":["石頭、祭壇與立約儀式都需解說，否則可被遺忘或誤解。","Stones, an altar, and ]},{"refs":"7–9","title":["第 3 課｜失敗、重來與承諾","Lesson 3 | Failure, renewal, and promise"],"aim":["艾城失敗與再戰，接上以巴路的讀經和基遍條約。","Set Ai’s defeat and renewal beside Torah reading and the Gibeonite treaty."],"flow":[["比較 7 與 8 章的戰前判斷","Compare the decisions before Ai in chapters 7–8"],["找出 8 章誰聽到律法","List who hears Torah in chapter 8"],["討論 9 章錯誤決策後的守約","Discuss keeping a flawed oath in chapter 9"]],"question":["失誤後如何負責且重新開始？","How can a group take responsibility and begin again?"],"practice":["避免把團體失敗歸咎無辜者。","Avoid assigning collective failure to innocent people."]},{"refs":"10–12","title":["第 4 課｜征戰敘事與總結","Lesson 4 | Campaigns and summaries"],"aim":["讀南北征戰、詩歌與諸王清單，辨認敘事總括語言。","Read campaigns, poetry, and king lists with attention to summary language."],"flow":[["標出第 10 章援助基遍的理由","Identify why Gibeon is aided in chapter 10"],["比較第 11 章結尾與 13:1","Compare 11’s ending with 13:1"],["查考第 12 章東西兩岸排列","Trace both banks in chapter 12"]],"question":["「全地得勝」如何與未得之地並存？","How does total victory language coexist with remaining land?"],"practice":["討論古代戰爭時要留意受害者與今日倫理距離。","Attend to victims and the ethical distance between ancient war and today."]},{"refs":"13–15","title":["第 5 課｜未完成的產業","Lesson 5 | Inheritance still unfinished"],"aim":["從未得之地、迦勒與押撒看應許、等待和生活資源。","Read remaining land, Caleb, and Achsah for promise, waiting, and livelihood."],"flow":[["圈出 13:1 的尚未","Mark the “remaining” of 13:1"],["比較迦勒與押撒的請求","Compare Caleb’s and Achsah’s requests"],["找出第 15 章未被趕出的居民","Identify residents still remaining in chapter 15"]],"question":["分得地和能居住有何差別？","What differs between allotment and viable life?"],"practice":["避免把古代產業等同今日土地權利宣言。","Do not use ancient allotment as a present-day land claim."]},{"refs":"16–19","title":["第 6 課｜分地、公平與差異","Lesson 6 | Allocation and difference"],"aim":["讀以法蓮、瑪拿西與七支派的分配，注意女性承產與實際限制。","Study tribal allotments with attention to daughters’ inheritance and practical limits."],"flow":[["讀 17:3–6，回想民數記的女兒","Read 17:3–6 alongside Numbers"],["比較 17:14–18 與 18 章測繪","Compare Jos
