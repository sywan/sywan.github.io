<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="舊約總覽成人主日學教師版：從多種角度研讀舊約的文學、歷史、地理、正典編排與核心主題，含八堂教案與延伸閱讀。"><title>舊約總覽｜聖經研讀資源中心</title><link rel="stylesheet" href="../assets/book-study.css"><style>
body{overflow-x:hidden}.hero h1{max-width:none}.hero-lead{max-width:86ch}.overview-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:26px 0 0}.overview-strip div{border:1px solid #a0c2cd;background:#ffffff14;border-radius:12px;padding:12px 16px}.overview-strip strong{display:block;font-size:23px;line-height:1.3}.overview-strip span{font-size:13px;color:#d7e9ed}.tab-panel[hidden]{display:none}.section-head{margin-bottom:20px}.stack{display:grid;gap:15px}.timeline{counter-reset:time}.timeline .movement{position:relative;border-left:4px solid #b99867}.timeline .movement::before{counter-increment:time;content:counter(time,decimal-leading-zero);display:inline-block;color:#986a31;font-weight:850;font-size:12px;letter-spacing:.12em}.question{border-left:3px solid #c09b66;padding:8px 0 8px 13px;color:#405768}.source-note{border-left:4px solid #b89560;background:#fff9ed;border-radius:0 12px 12px 0;padding:17px 21px;margin:0 0 24px}.source-note p{margin:4px 0}.canon-banner{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}.canon-banner span{background:#e6f0f3;border:1px solid #cbdde4;border-radius:999px;padding:7px 13px;color:#235b74;font-weight:800}.lesson details{margin-top:12px;border-top:1px solid #dce5e9;padding-top:10px}.lesson summary{cursor:pointer;color:#245f7c;font-weight:800}.lesson .refs{font-size:14px}.lesson ul{margin:6px 0 0}.reading-links{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 25px}.reading-links a{background:#e5f1f5;border-radius:9px;padding:9px 13px;text-decoration:none;font-weight:800}.reading-links a:hover{background:#d2e7ef}.content-card p{max-width:90ch}.backtop{display:none}@media(max-width:620px){.overview-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-strip strong{font-size:19px}.source-note{padding:14px 16px}.reading-links a{flex:1 1 140px;text-align:center}}
</style></head><body><a class="skip" href="#main">跳至內容</a><header class="hero"><div class="crumbs"><a href="/" id="home-link">← 個人首頁</a><a href="/bible-study/" id="center-link">← 聖經研讀</a></div><div class="eyebrow">OLD TESTAMENT · TEACHER EDITION</div><h1 id="title">舊約總覽</h1><p class="hero-lead" id="subtitle"></p><div class="edition" id="edition"></div></header><nav class="nav" aria-label="研讀頁面"><div class="nav-inner"><div class="tabs" role="tablist" aria-label="研讀內容" id="tabs"></div><button type="button" class="lang" id="language">English</button><button type="button" class="lang" data-refresh-page id="refresh">↻ 更新</button></div></nav><main id="main"><div id="panel"></div><footer class="footer" id="footer"></footer></main><script>window.OT_DATA={"title": ["舊約總覽", "Old Testament Overview"], "subtitle": ["從書卷、土地、歷史與正典編排進入舊約；先看全景，再沿著每一卷經文深入研讀。", "Explore the Old Testament through its books, places, history, and canonical shape; see the whole, then study each book."], "intro": ["舊約不是一條單純的年表，也不是一袋可以任意抽取的金句。讀者需要辨認每卷書的文體、處境與位置，再聆聽它與其他書卷的對話。", "The Old Testament is more than a single timeline or a collection of isolated verses. Each book has a literary form, setting, and place in a larger conversation."], "ideas": [{"title": ["一套書卷", "A library of books"], "body": ["敘事、律法、詩歌、智慧與先知信息用不同方式見證以色列與上帝的關係。先讀整卷，再解釋單段。", "Narrative, instruction, poetry, wisdom, and prophecy speak in different ways. Read the book before isolating a passage."]}, {"title": ["一個地理舞台", "A geographical setting"], "body": ["埃及、黎凡特與美索不達米亞的相對位置，幫助讀者理解遷徙、貿易、戰爭與被擄。地圖提供背景，不替代經文。", "Egypt, the Levant, and Mesopotamia help explain movement, trade, conflict, and exile. Geography gives context without deciding interpretation."]}, {"title": ["一條有轉折的故事線", "A story with turning points"], "body": ["族長、出埃及、進入土地、王國、被擄與歸回可作導航。各卷成書與編輯時間未必等同它所敘述的年代。", "Ancestors, exodus, land, monarchy, exile, and return are useful landmarks. A book’s composition date may differ from the events it narrates."]}, {"title": ["兩種常見編排", "Two familiar arrangements"], "body": ["希伯來聖經按妥拉、先知書、聖卷分組；常見新教舊約則按律法、歷史、詩歌智慧與先知書排列。相同書卷的閱讀順序會影響讀者如何看見全書走向。", "The Hebrew Bible groups Torah, Prophets, and Writings. The common Protestant order groups Law, History, Poetry and Wisdom, and Prophets. Order shapes the reading experience."]}], "lenses": [{"title": ["文學與文體", "Literary forms"], "body": ["先分辨敘事、律法、詩歌、智慧、先知宣告與異象；同一句話在不同文體中可能承擔不同功能。", "Distinguish narrative, law, poetry, wisdom, prophetic speech, and visions; similar words work differently across forms."]}, {"title": ["歷史與地理", "History and place"], "body": ["把人物與事件放回古代近東的地理與政治處境，同時分清經文所敘述的年代和書卷形成的過程。", "Set people and events within the ancient Near East while distinguishing narrated time from a book’s literary formation."]}, {"title": ["猶太正典與閱讀", "Jewish canon and reading"], "body": ["留意妥拉、先知書、聖卷的編排，也尊重猶太傳統持續以自身方式閱讀這些經文。", "Notice Torah, Prophets, and Writings, and respect the living Jewish tradition of reading these texts."]}, {"title": ["基督教正典與閱讀", "Christian canon and reading"], "body": ["比較新教、天主教與東正教舊約的範圍與排列；基督徒也可追問新約如何承接舊約。", "Compare Protestant, Catholic, and Orthodox arrangements, and ask how the New Testament engages older Scripture."]}, {"title": ["倫理、敬拜與生活", "Ethics, worship, and life"], "body": ["從律法、先知與智慧書追問公義、聖潔、受苦與群體責任，並分辨經文的描述與命令。", "Ask about justice, holiness, suffering, and communal responsibility, distinguishing description from command."]}, {"title": ["書卷彼此對話", "Books in conversation"], "body": ["箴言、約伯記與傳道書對智慧提出不同問題；一種聲音不能取代整套書卷的複調。", "Proverbs, Job, and Ecclesiastes ask different wisdom questions; one voice cannot replace the collection’s many voices."]}], "arc": [{"name": ["起源與族長", "Origins and ancestors"], "ref": "創 1–50 / Gen 1–50", "body": ["創世記從創造、人類破裂與萬國轉到亞伯拉罕一家。應許關乎土地、後裔與萬族得福，卻一路遭遇不孕、飢荒、衝突與遷徙。", "Genesis moves from creation and humanity’s fracture to Abraham’s family. Promises of land, descendants, and blessing meet barrenness, famine, conflict, and migration."], "question": ["創 12:1–3 如何承接創 1–11 的世界性問題？", "How does Genesis 12:1–3 address the world-sized problems of Genesis 1–11?"]}, {"name": ["出埃及與立約", "Exodus and covenant"], "ref": "出 1–20 / Exod 1–20", "body": ["以色列在埃及受壓迫，出埃及敘事把拯救與敬拜連在一起；西奈之約為新群體塑造身份。律法既規範生活，也要求對弱者實行公義。", "Israel’s oppression and deliverance connect rescue with worship. The Sinai covenant shapes communal identity and calls for justice toward vulnerable people."], "question": ["出埃及的拯救如何影響以色列對律法的理解？", "How does rescue from Egypt frame Israel’s understanding of instruction?"]}, {"name": ["曠野、土地與士師", "Wilderness, land, and judges"], "ref": "民 13–14；書 1；士 2 / Num 13–14; Josh 1; Judg 2", "body": ["曠野世代在信任與懼怕間掙扎；進入土地後，士師記描寫反覆失序。各書也要求讀者面對土地、戰爭與群體倫理的艱難問題。", "The wilderness generation struggles with trust. After entry into the land, Judges portrays repeated disorder. These books also raise hard questions about land, war, and community ethics."], "question": ["敘事記載某件事，是否等於贊成那件事？", "Does a narrative’s report of an event mean it approves of it?"]}, {"name": ["王國、聖殿與分裂", "Kingdom, temple, and division"], "ref": "撒上 8；撒下 7；王上 8, 12 / 1 Sam 8; 2 Sam 7; 1 Kgs 8, 12", "body": ["求立王、對大衛家的應許與聖殿建立，帶出君王責任和敬拜中心；王國分裂提醒人，權力與宗教形式都不能保證忠誠。", "The request for a king, the Davidic promise, and the temple raise questions of leadership and worship. Division shows that power and religious form do not guarantee faithfulness."], "question": ["撒上 8 章與撒下 7 章如何同時提供對王權的警告和盼望？", "How do 1 Samuel 8 and 2 Samuel 7 hold warning and hope about kingship together?"]}, {"name": ["先知的控訴與盼望", "Prophetic critique and hope"], "ref": "摩 5；賽 1, 40；耶 31 / Amos 5; Isa 1, 40; Jer 31", "body": ["先知置身具體歷史，指責偶像崇拜與社會不義，也宣告上帝仍願更新祂的百姓。預言不只是未來事件表，更是對當代群體的呼召。", "Prophets address real crises, condemning idolatry and injustice while announcing renewal. Prophecy is not merely a timetable of later events."], "question": ["先知如何把敬拜與社會公義連在一起？", "How do prophets connect worship and social justice?"]}, {"name": ["被擄、歸回與未竟的盼望", "Exile, return, and unfinished hope"], "ref": "王下 25；拉 1；尼 8；該 2 / 2 Kgs 25; Ezra 1; Neh 8; Hag 2", "body": ["耶路撒冷陷落與被擄迫使群體重新思考土地、聖殿和約；歸回及重建並未使所有問題消失。讀者可留意失落與新開始如何並存。", "Jerusalem’s fall reframes land, temple, and covenant. Return and rebuilding do not resolve every question; loss and new beginnings remain intertwined."], "question": ["歸回之後，哪些盼望仍未完全實現？", "After the return, which hopes remain open?"]}], "regions": [{"name": ["埃及與尼羅河", "Egypt and the Nile"], "body": ["創世記末段與出埃及記開頭把以色列帶到埃及。尼羅河流域是西南方向的重要政治與農業力量。", "Genesis ends and Exodus begins in Egypt. The Nile region forms a major political and agricultural center to the southwest."]}, {"name": ["迦南／黎凡特走廊", "Canaan and the Levant corridor"], "body": ["地中海東岸連接非洲與西亞。舊約敘事中的土地不是抽象背景；道路、城邑和鄰邦影響以色列的日常與政治抉擇。", "The eastern Mediterranean corridor links Africa and western Asia. Roads, towns, and neighbors matter to Israel’s everyday and political choices."]}, {"name": ["美索不達米亞", "Mesopotamia"], "body": ["底格里斯河與幼發拉底河流域涉及亞述、巴比倫等帝國，也是族長傳統與被擄敘事的重要背景。", "The Tigris and Euphrates region includes Assyria and Babylon and matters to ancestral traditions and exile narratives."]}], "canon": [{"name": ["妥拉／律法書", "Torah / Instruction"], "books": ["創世記、出埃及記、利未記、民數記、申命記", "Genesis, Exodus, Leviticus, Numbers, Deuteronomy"], "note": ["兩種編排都以摩西五經開頭。先看各卷的整體功能，再討論其中的律法條文。", "Both arrangements begin with the five books of Moses. Read each whole book before isolating its laws."]}, {"name": ["先知書", "Prophets / Nevi’im"], "books": ["前先知書含約書亞記、士師記、撒母耳記、列王紀；後先知書含以賽亞書、耶利米書、以西結書與十二先知。", "Former Prophets include Joshua, Judges, Samuel, and Kings. Latter Prophets include Isaiah, Jeremiah, Ezekiel, and the Twelve."], "note": ["希伯來編排把部分基督教舊約常稱為「歷史書」的書卷放在先知書。這提醒讀者留意敘事的神學取向。", "The Hebrew order places books often called “History” in Christian Bibles among the Prophets, highlighting their interpretive aims."]}, {"name": ["聖卷", "Writings / Ketuvim"], "books": ["詩篇、箴言、約伯記、雅歌、傳道書等詩歌智慧書，以及路得記、以斯帖記、但以理書、以斯拉—尼希米記、歷代志等。", "Psalms, Proverbs, Job, Song of Songs, Ecclesiastes, Ruth, Esther, Daniel, Ezra–Nehemiah, Chronicles, and other writings."], "note": ["希伯來編排的最後一卷是歷代志；常見新教舊約的最後一卷是瑪拉基書。兩者結尾帶來不同的閱讀回聲。", "The Hebrew order ends with Chronicles; the common Protestant order ends with Malachi. Each ending frames the collection differently."]}], "reading": [{"title": ["先辨認整卷", "Locate the whole book"], "body": ["確認書卷名稱、文體、主要段落與反覆主題。約伯記是智慧辯論與詩歌，不能用讀敘事書的方法處理每一句話。", "Identify genre, major movements, and recurring themes. Job’s speeches need a different approach from narrative scenes."]}, {"title": ["問誰在說話", "Identify the speaker"], "body": ["敘事者、人物、詩人與先知的話不總是同一層次。神在約伯記結尾責備三友，提醒我們不能把三友每句話直接當成作者立場。", "Narrator, character, poet, and prophet speak from different positions. God’s rebuke of Job’s friends warns against treating every speech as the book’s verdict."]}, {"title": ["看前後文", "Read the context"], "body": ["至少讀前後一段；若是反覆句、盟約或先知宣告，還要追問它在全卷的作用。避免從單節直接跳到今日應用。", "Read the surrounding passage and ask how a refrain, covenant claim, or prophetic speech works in the book before applying it today."]}, {"title": ["留意歷史與地理", "Attend to setting"], "body": ["辨認人物所處的政權、地點與危機。年代與地圖幫助定位，但教材中的整數年份只宜作記憶線索。", "Identify a scene’s political setting, place, and crisis. Dates and maps orient us, but rounded teaching dates are memory aids."]}, {"title": ["比較書卷間的對話", "Compare books"], "body": ["箴言的智慧常態、約伯記的義人受苦和傳道書的不可預測彼此補足；不要以一卷書取消另一卷。", "Proverbs’ patterns, Job’s innocent suffering, and Ecclesiastes’ uncertainty inform one another. One book need not cancel another."]}, {"title": ["區分經文、詮釋、應用", "Separate text, interpretation, and application"], "body": ["先指出經文實際寫甚麼，再說明自己如何理解，最後討論當代處境；讓學員能看見推論的步驟。", "State what the text says, explain how you understand it, and then discuss application so learners can inspect each step."]}], "teacherNotes": [{"title": ["年代是教學示意", "Dates are teaching approximations"], "body": ["常見舊約時間軸有助記憶重大轉折，卻不是所有書卷的成書年表。約伯記的背景、編寫與定稿時間尤其不能直接固定在族長時期。", "Old Testament timelines can help mark narrative turns, but they are not composition timelines; Job’s setting and literary history cannot simply be fixed in the patriarchal period."]}, {"title": ["「沉默」是修辭", "“Silence” is a teaching metaphor"], "body": ["瑪拉基書至新約之間的時期常被稱作「四百年沉默」，但第二聖殿時期有猶太文獻、敬拜與歷史變化。不要把此說法講成上帝完全沒有行動，或把所有次經放在同一年代。", "The period between Malachi and the New Testament is often called “400 silent years,” yet Second Temple Jewish texts, worship, and history continued. Do not teach the phrase as proof that God was inactive or date all deuterocanonical works to one interval."]}, {"title": ["不同傳統的舊約範圍", "Different Old Testament canons"], "body": ["本站的書卷按常見新教順序排列；天主教與東正教傳統對第二正典／次經的收錄不同。希伯來聖經與新教舊約多有相同核心書卷，但分卷及排序不一。", "This site lists books in the common Protestant order. Catholic and Orthodox traditions differ regarding deuterocanonical books. The Hebrew Bible and Protestant Old Testament share core material but divide and order it differently."]}, {"title": ["「先知歷史」是讀法", "“Prophetic history” is an interpretive lens"], "body": ["約書亞記至列王紀在希伯來編排中屬「前先知書」；說它們從信仰角度解釋事件，是一個有用的閱讀方向。仍需檢查每卷如何選材與評價人物。", "Joshua through Kings belong to the Former Prophets in the Hebrew order. Their theological shaping is a useful lens, but each book’s selection and evaluation of events still deserves close reading."]}, {"title": ["利未記的核心位置", "Leviticus at the center of Torah"], "body": ["利未記位於五經中間，可從敬拜、聖潔與同在切入；這是一種閱讀角度，不等於其他四卷較不重要。", "Leviticus stands in the middle of the Torah and invites attention to worship, holiness, and divine presence. Its position is a reading lens, not a ranking of the five books."]}, {"title": ["從舊約到新約須有橋樑", "Build a careful bridge to the New Testament"], "body": ["基督徒可比較新約如何重讀舊約，但先讓舊約經文在自身脈絡中說話；也尊重猶太傳統對同一經文的閱讀。", "Christians can study how the New Testament rereads the Old, while first hearing the older text in its own setting and respecting Jewish readings of the same Scriptures."]}], "lessons": [{"title": ["一｜一套書，而非金句集", "1 | A library, not a verse collection"], "refs": "創 12:1–3；路 24:44 / Gen 12:1–3; Luke 24:44", "aim": ["能說出整卷、段落與單節的關係，認識舊約的不同文體。", "Explain how a verse belongs to a passage and a book, and identify major literary forms."], "flow": [["用一節熟悉經文請學員猜前後文，再共同閱讀整段。", "Begin with a familiar verse, then read its surrounding paragraph together."], ["用創世記 12:1–3 示範：人物、應許、前十一章背景。", "Model context with Genesis 12:1–3: speaker, promise, and Genesis 1–11."], ["按敘事、律法、詩歌、智慧與先知信息分類數卷熟悉的書。", "Sort familiar books by narrative, instruction, poetry, wisdom, and prophecy."]], "question": ["一句經文離開書卷脈絡後，意思可能如何改變？", "How can a verse’s meaning shift when detached from its book?"], "watch": ["不要把「按卷讀」誤解為不能研讀單節；重點是讓單節受上下文約束。", "Book-level reading does not forbid close study of a verse; it provides the needed context."]}, {"title": ["二｜土地與周邊世界", "2 | Land and neighboring powers"], "refs": "創 12:1–3；出 1；王下 17 / Gen 12:1–3; Exod 1; 2 Kgs 17", "aim": ["能在簡圖上辨認埃及、迦南與美索不達米亞，連結遷徙與帝國壓力。", "Locate Egypt, Canaan, and Mesopotamia on a simple map and connect place to movement and empire."], "flow": [["先畫三個相對位置，不要求記每條古代邊界。", "Sketch three relative locations without demanding exact ancient borders."], ["追蹤族長入埃及、出埃及、亞述／巴比倫壓力三條路徑。", "Trace movement into Egypt, the exodus, and later imperial pressure."], ["討論土地作為禮物、責任與衝突場域。", "Discuss land as gift, responsibility, and arena of conflict."]], "question": ["地理資訊如何幫助讀經，又有哪些問題不能靠地圖解決？", "What does geography clarify, and what questions remain beyond a map?"], "watch": ["避免把現代國界直接投射到古代文本。", "Do not project modern borders onto ancient narratives."]}, {"title": ["三｜從族長到出埃及", "3 | Ancestors to exodus"], "refs": "創 12, 50；出 1–20 / Gen 12, 50; Exod 1–20", "aim": ["用應許、遷徙、拯救與立約四個詞說明故事早期的轉折。", "Describe early movements through promise, migration, rescue, and covenant."], "flow": [["對讀創 12 的應許與創 50 的埃及處境。", "Compare the promise in Genesis 12 with the Egyptian setting of Genesis 50."], ["讀出 1–3 的受壓迫與呼召，再概覽出 12–20 的拯救與立約。", "Read Exodus 1–3 and survey rescue and covenant in Exodus 12–20."], ["讓學員指出律法故事出現以前已發生的恩典。", "Ask what grace precedes the giving of instruction."]], "question": ["為甚麼出埃及故事不能只當成離開埃及的旅行記？", "Why is Exodus more than a travel story out of Egypt?"], "watch": ["年代圖表可作定位，授課時避免把概略年號當作各事件的確定日期。", "Use rounded dates as orientation, not certain dates for every event."]}, {"title": ["四｜王國與先知", "4 | Kingdom and prophets"], "refs": "撒上 8；撒下 7；王上 12；摩 5 / 1 Sam 8; 2 Sam 7; 1 Kgs 12; Amos 5", "aim": ["比較王權的應許與失敗，認識先知如何評論敬拜和公義。", "Compare the promise and failure of kingship and observe prophetic critique of worship and justice."], "flow": [["讀撒上 8，列出對王權的擔心。", "Read 1 Samuel 8 and list concerns about kingship."], ["以撒下 7 和王上 12 比較盼望與分裂。", "Compare hope in 2 Samuel 7 with division in 1 Kings 12."], ["從摩 5 看先知對敬拜與生活不一致的指控。", "Use Amos 5 to examine the gap between worship and conduct."]], "question": ["君王與宗教制度為何仍需要先知的批判？", "Why do kings and religious institutions still need prophetic critique?"], "watch": ["避免把大衛時代描寫為毫無問題的黃金時代。", "Avoid presenting David’s reign as free of moral and political conflict."]}, {"title": ["五｜被擄、歸回與第二聖殿", "5 | Exile, return, and Second Temple"], "refs": "王下 25；拉 1；尼 8 / 2 Kgs 25; Ezra 1; Neh 8", "aim": ["理解失去土地與聖殿的衝擊，並說明歸回後盼望仍未結束。", "Understand the loss of land and temple, and explain why hope remains after the return."], "flow": [["讀王下 25，請學員辨認失去的事物。", "Read 2 Kings 25 and identify what is lost."], ["讀拉 1、尼 8，追蹤歸回、重建與重新聆聽律法。", "Trace return, rebuilding, and renewed hearing of Torah in Ezra 1 and Nehemiah 8."], ["解釋「沉默時期」只是課堂簡稱，補入第二聖殿文獻的存在。", "Explain “silent years” as shorthand and note the literature of the Second Temple era."]], "question": ["重建聖殿是否等於所有應許都已實現？", "Does rebuilding the temple fulfill every hope?"], "watch": ["次經／第二正典在不同基督宗派的地位不同，介紹時不作一刀切判斷。", "Different Christian traditions view deuterocanonical works differently."]}, {"title": ["六｜兩種書卷編排", "6 | Two book arrangements"], "refs": "路 24:44；詩 1；代下 36 / Luke 24:44; Ps 1; 2 Chr 36", "aim": ["分辨希伯來聖經的妥拉、先知書、聖卷，和常見新教舊約的四類編排。", "Distinguish Torah, Prophets, and Writings from the familiar Protestant four-part order."], "flow": [["用本頁表格把約書亞記、但以理書、歷代志放進兩種編排。", "Place Joshua, Daniel, and Chronicles in both arrangements."], ["讀路 24:44，討論「律法、先知與詩篇」的表述。", "Read Luke 24:44 and discuss Law, Prophets, and Psalms."], ["比較以歷代志或瑪拉基書收尾的閱讀效果。", "Compare the effect of endings in Chronicles and Malachi."]], "question": ["書卷順序如何影響我們對「舊約結尾」的感受？", "How does book order affect our sense of the Old Testament’s ending?"], "watch": ["不要宣稱只有一種編排才是真正的聖經。", "Do not claim that only one arrangement is legitimate."]}, {"title": ["七｜摩西五經與利未記", "7 | Torah and Leviticus"], "refs": "創 1；出 19；利 19；民 14；申 6 / Gen 1; Exod 19; Lev 19; Num 14; Deut 6", "aim": ["概覽五經各卷功能，探索敬拜、聖潔與群體生活的連結。", "Survey Torah’s five books and explore worship, holiness, and communal life."], "flow": [["每組用一句話概括一卷五經，再彼此補充。", "Have groups summarize one Torah book in a sentence."], ["以利 19 為例，觀察聖潔如何觸及人際關係。", "Use Leviticus 19 to observe holiness in relationships."], ["比較五經各卷如何描寫上帝同在，再討論利未記在整體中的位置。", "Compare divine presence across the five books, then discuss Leviticus’s place in the whole."]], "question": ["為甚麼不能把利未記只當作過時的儀式手冊？", "Why is Leviticus more than an obsolete ritual manual?"], "watch": ["五經各卷的地點與時間跨度都需要仔細核對；不可用單一表格取代經文細讀。", "Charts of places and periods are schematic; they cannot replace close reading."]}, {"title": ["八｜總結與未來逐卷研讀", "8 | Synthesis and future book studies"], "refs": "提後 3:16–17；路 24:44 / 2 Tim 3:16–17; Luke 24:44", "aim": ["把地理、故事線、正典編排與讀經方法合成一份逐卷研讀路線。", "Combine geography, narrative landmarks, canon order, and reading method into a plan for future book studies."], "flow": [["讓學員畫出六個故事轉折，不要求精確年號。", "Have learners draw six narrative turning points without exact dates."], ["每人選一卷書，說出文體、背景與一個想追問的問題。", "Ask each person to choose a book, identify genre and setting, and pose one question."], ["讀提後 3:16–17，討論研讀的目標如何落在生命與行動。", "Read 2 Timothy 3:16–17 and discuss how study shapes life and action."]], "question": ["下一卷最想研讀哪一卷？為甚麼？", "Which book should be studied next, and why?"], "watch": ["基督徒可看見新約與舊約的關連，也應先尊重舊約原有的歷史與文學脈絡。", "Christian connections to the New Testament should begin with the Old Testament’s own context."]}], "discussion": [{"q": ["「聖經是一套書」會如何改變你的查經習慣？", "How would treating the Bible as a library change your study habits?"], "a": ["先問經文屬於哪一卷、誰在說話、段落如何運作，再做主題比較或應用。", "Identify book, speaker, and passage function before topical comparison or application."]}, {"q": ["出埃及記中的律法為甚麼出現在拯救敘事之後？", "Why does instruction in Exodus follow the rescue story?"], "a": ["敘事順序讓讀者先看見群體被拯救，然後才看見新身份如何塑造生活。", "The sequence presents a rescued community before describing how its new identity shapes life."]}, {"q": ["說「以色列的土地在交通要道」能解釋甚麼？不能解釋甚麼？", "What can and cannot be explained by Israel’s location on a corridor?"], "a": ["它幫助理解列國接觸與帝國壓力；經文對上帝、人與倫理的意義仍要由文本判斷。", "It clarifies contact and imperial pressure; theological and ethical meaning still requires reading the text."]}, {"q": ["約伯記可否直接放進族長年代？", "Can Job simply be dated to the patriarchal period?"], "a": ["不宜。故事的古代背景、文本寫作與後來的編輯是不同問題，確切年代有爭議。", "No. The story’s setting, composition, and editing are distinct questions, with disputed dates."]}, {"q": ["「四百年沉默」可能遮蔽了甚麼？", "What can the phrase “400 silent years” obscure?"], "a": ["它可能使人忽略第二聖殿時期的歷史、猶太文獻與不同正典傳統。", "It can obscure Second Temple history, Jewish literature, and differing canon traditions."]}, {"q": ["希伯來聖經把約書亞記至列王紀列入先知書，提醒讀者甚麼？", "What does placing Joshua–Kings among the Prophets suggest?"], "a": ["讀者可留意這些敘事如何評價領袖與群體的忠誠，而非只查事件先後。", "Readers can notice how these narratives assess leaders and communal faithfulness, beyond chronology."]}, {"q": ["讀詩歌智慧書時，為甚麼不能把每句話都當歷史報告？", "Why not read every line of wisdom poetry as a historical report?"], "a": ["詩歌和辯論會透過比喻、對話與誇張提出問題；必須先辨認文體與說話者。", "Poetry and debate use image, dialogue, and intensification; genre and speaker matter."]}, {"q": ["同一段舊約在猶太與基督教傳統中可能怎樣被不同閱讀？", "How might Jewish and Christian traditions read the same passage differently?"], "a": ["書卷編排、正典範圍和後來的詮釋傳統不同。課堂先辨認差異，再尊重地比較。", "Book order, canon scope, and later interpretation differ. Identify the differences before comparing respectfully."]}], "sources": [{"title": ["BibleProject｜如何閱讀聖經", "BibleProject | How to Read the Bible"], "desc": ["以文體與全書敘事為入口，適合配合經文逐卷閱讀。", "A visual introduction to literary styles and the larger biblical story."], "url": "https://bibleproject.com/videos/collections/how-to-read-the-bible/"}, {"title": ["耶魯公開課｜舊約／希伯來聖經導論", "Open Yale Courses | Introduction to the Old Testament"], "desc": ["從歷史、古代近東背景、文學與正典研究的角度，提供完整公開課程。", "A full academic course on history, ancient Near Eastern context, literature, and canon."], "url": "https://oyc.yale.edu/religious-studies/rlst-145"}, {"title": ["My Jewish Learning｜希伯來聖經入門", "My Jewish Learning | Bible 101"], "desc": ["從猶太傳統認識妥拉、先知書與聖卷，並看見這套書卷內的多種聲音。", "A Jewish introduction to Torah, Prophets, and Writings and the collection’s diverse voices."], "url": "https://www.myjewishlearning.com/article/bible-101/"}, {"title": ["BibleProject｜希伯來聖經的編排", "BibleProject | The Shape of the Hebrew Bible"], "desc": ["認識妥拉、先知書與聖卷如何構成猶太聖經。", "Explore how Torah, Prophets, and Writings form the Hebrew Bible."], "url": "https://bibleproject.com/classroom/introduction-to-the-hebrew-bible/modules/1/"}, {"title": ["BibleProject｜第二正典與不同正典傳統", "BibleProject | Deuterocanon and canon traditions"], "desc": ["比較不同基督教傳統的舊約範圍，避免把一種書卷目錄當成唯一版本。", "Compare the scope of Old Testament collections across Christian traditions."], "url": "https://bibleproject.com/articles/why-deuterocanon-apocrypha-some-bibles-and-not-others/"}, {"title": ["大衛鮑森｜舊約總覽", "David Pawson | Old Testament Overview"], "desc": ["以牧養與整卷研讀的角度觀看舊約，適合與其他導讀互相對照。", "A pastoral, whole-book survey to compare with the other approaches above."], "url": "https://davidpawson.org/resources/resource/52"}, {"title": ["大衛鮑森｜舊約縱覽投影片（PDF）", "David Pawson | Old Testament Survey slides (PDF)"], "desc": ["可直接開啟課堂投影片，配合本站的經文導覽與其他延伸資源閱讀。", "Open the course slides alongside the biblical guide and other perspectives here."], "url": "./舊約綜覽-00_縱覽.pdf"}]};</script><script src="../assets/ot-overview.js?v=20261103-2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
