<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="但以理書成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>但以理書｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"DAN","category":["啟示文學與敘事","Apocalyptic Literature and Narrative"],"name":["但以理書","Daniel"],"subtitle":["六章流亡宮廷故事、六章異象與禱告：在帝國權力中持守信仰，也謹慎閱讀象徵。","Six chapters of court stories and six of visions and prayer: faithfulness under empire and careful reading of symbols."],"overviewIntro":["先從全書結構掌握但以理書，再逐章研讀人物、事件與神學判斷。","Survey Daniel as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["12 章；依照書卷原有次序逐章研讀。","12 chapters studied in canonical sequence."],"thesis":["帝國不是終極的王","Empire is not the final king"],"thesisDetail":["故事描寫流亡者在危險中持守，異象則以獸與國度的圖像指向神對暴力權勢的終極限制。","Stories portray exiles remaining faithful under threat; beastly visions place violent power under divine limits."],"keyQuestion":["但以理書如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Daniel portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["故事描寫流亡者在危險中持守，異象則以獸與國度的圖像指向神對暴力權勢的終極限制。","Stories portray exiles remaining faithful under threat; beastly visions place violent power under divine limits."],"finalMovement":["末章沒有給但以理完整時間表，卻叫他去等候，並盼望在末了得自己的分。","The ending gives Daniel no complete timetable, but calls him to wait and hope for his allotted end."],"readingKeys":[{"refs":"1","title":["流亡中的餐桌","Food and identity in exile"],"body":["四名青年在巴比倫受教育，仍尋求不玷污自己的飲食方式。","Four youths are trained in Babylon while seeking a way to remain faithful at the royal table."]},{"refs":"3","title":["火窯中的三人","Three in the furnace"],"body":["三人拒拜金像，承認即便不被救仍不屈服，之後從火窯得救。","Three refuse the image, confess they will not bow even if not rescued, and emerge from the furnace."]},{"refs":"6","title":["獅子坑與禱告","Prayer and lions"],"body":["但以理在法令下仍照常禱告，遭陷害入獅子坑而得保全。","Daniel continues prayer despite the decree, is trapped in the lions’ den, and survives."]},{"refs":"10–12","title":["最後異象與等待","Final vision and waiting"],"body":["天使向但以理解釋戰事與困難；末章談復活盼望，也承認他尚未完全明白。","An angel describes conflict and suffering; the final chapter offers resurrection hope while Daniel still lacks full understanding."]}],"mapIntro":["沿八個段落觀察但以理書的敘事推進與轉折。","Trace the movement of Daniel through eight teaching units."],"movements":[{"refs":"1","title":["流亡中的餐桌","Food and identity in exile"],"body":["四名青年在巴比倫受教育，仍尋求不玷污自己的飲食方式。","Four youths are trained in Babylon while seeking a way to remain faithful at the royal table."]},{"refs":"2","title":["夢中的像與國度","Statue and kingdoms"],"body":["尼布甲尼撒夢見大像；但以理得啟示，指出帝國終將讓位於神的國。","Nebuchadnezzar dreams of a statue; Daniel interprets successive kingdoms yielding to God’s kingdom."]},{"refs":"3","title":["火窯中的三人","Three in the furnace"],"body":["三人拒拜金像，承認即便不被救仍不屈服，之後從火窯得救。","Three refuse the image, confess they will not bow even if not rescued, and emerge from the furnace."]},{"refs":"4–5","title":["兩位王與驕傲","Two kings and pride"],"body":["尼布甲尼撒如獸後悔悟；伯沙撒在宴席中輕慢聖器並迅速倒台。","Nebuchadnezzar becomes beastlike and humbles himself; Belshazzar desecrates vessels and falls."]},{"refs":"6","title":["獅子坑與禱告","Prayer and lions"],"body":["但以理在法令下仍照常禱告，遭陷害入獅子坑而得保全。","Daniel continues prayer despite the decree, is trapped in the lions’ den, and survives."]},{"refs":"7","title":["四獸與人子樣式","Four beasts and one like a son of man"],"body":["但以理看見獸國、審判庭與一位像人子的得國；他自己仍驚惶。","Daniel sees beastly kingdoms, a heavenly court, and one like a human receiving dominion, yet remains troubled."]},{"refs":"8–9","title":["公綿羊、公山羊與禱告","Ram, goat, and prayer"],"body":["異象指向瑪代波斯與希臘衝突；但以理又以認罪禱告尋求耶路撒冷的未來。","A ram and goat evoke Medo-Persia and Greece; Daniel then prays confessionally about Jerusalem’s future."]},{"refs":"10–12","title":["最後異象與等待","Final vision and waiting"],"body":["天使向但以理解釋戰事與困難；末章談復活盼望，也承認他尚未完全明白。","An angel describes conflict and suffering; the final chapter offers resurrection hope while Daniel still lacks full understanding."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["第 2 章後半至第 7 章以亞蘭文寫成；異象的歷史對應有不同學術與教會解讀，勿把象徵硬化成唯一現代時間表。","Daniel 2:4b–7 is in Aramaic; historical identifications of visions differ. Do not force symbols into a single modern timetable."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["宮廷飲食與身分","Court food and identity"],"summary":["但以理與同伴在巴比倫學習，婉拒王膳而以蔬食試驗，仍獲智慧。","Daniel and companions learn in Babylon, decline royal food through a trial, and receive wisdom."],"deep":[["文化學習與宗教忠誠在敘事中同時存在。","Cultural learning and religious loyalty coexist."],["保留身分與學習異國語言並不互斥。","Keeping identity and learning a foreign language are not opposites."]],"caution":["勿把飲食敘事當作普遍健康療法。","Do not make the food episode a universal health regimen."],"question":["他們如何在宮廷內作有節制的抗議？","How do they resist within the court without spectacle?"]},{"n":2,"refs":"2","title":["大像之夢","Dream of the statue"],"summary":["王要求解夢，但以理禱告後述夢：像的各部分終被非人手鑿出的石頭擊碎。","Daniel prays and recounts a statue smashed by a stone not cut by human hands."],"deep":[["石頭的來源與帝國金屬的堆疊形成對比。","The stone’s origin contrasts with the stacked imperial metals."],["夢的重點是人造權勢有限，不只是金屬對照表。","The dream stresses limited human power, not only a metal chart."]],"caution":["帝國對應有爭議，不宜宣稱唯一確定。","Empire identifications are debated."],"question":["夢中的權力何者是暫時的？","Which powers in the dream are temporary?"]},{"n":3,"refs":"3","title":["金像與火窯","Image and furnace"],"summary":["三人拒拜金像，說即便神不救也不拜；王把他們投入火窯，卻見他們存活。","The three refuse to worship the image even without guaranteed rescue and survive the furnace."],"deep":[["堅持發生在結果未明之時，不應只在得救後理解。","Their resolve precedes knowledge of the outcome."],["「即或不然」比神蹟結局更能呈現信心自由。","“Even if not” expresses fidelity beyond the miracle ending."]],"caution":["不可向受迫害者保證必定免難。","Do not promise persecuted people certain escape."],"question":["「即或不然」如何改變信心的定義？","How does “even if not” reshape faith?"]},{"n":4,"refs":"4","title":["王成為野獸","The king becomes beastlike"],"summary":["尼布甲尼撒夢見大樹被砍，經驕傲與降卑後承認天的權柄。","Nebuchadnezzar dreams of a felled tree, is humbled, and acknowledges heaven’s rule."],"deep":[["樹、獸與人共同描繪統治者失去合宜人性的過程。","Tree, beast, and human imagery portray distorted rule."],["兩位王的不同回應使驕傲的後果清晰。","The two rulers’ contrasting responses expose pride’s consequences."]],"caution":["勿把精神疾病等同神學上的驕傲懲罰。","Do not equate mental illness with punishment for pride."],"question":["王在哪裡把成就全歸給自己？","Where does the king claim total credit?"]},{"n":5,"refs":"5","title":["宴席與牆上字","Banquet and writing on the wall"],"summary":["伯沙撒用聖殿器皿飲酒，牆上出現文字；但以理解釋後王當夜失國。","Belshazzar drinks from temple vessels, sees writing on the wall, and loses his kingdom that night."],"deep":[["與第 4 章相比，伯沙撒知道先例卻不謙卑。","Unlike chapter 4, Belshazzar knows the precedent yet will not humble himself."],["兩位王的不同回應使驕傲的後果清晰。","The two rulers’ contrasting responses expose pride’s consequences."]],"caution":["勿把精神疾病等同神學上的驕傲懲罰。","Do not equate mental illness with punishment for pride."],"question":["他忽略了前王的什麼教訓？","What lesson from his predecessor does he ignore?"]},{"n":6,"refs":"6","title":["但以理在獅子坑","Daniel among lions"],"summary":["有人利用禁禱法令陷害但以理；他照常禱告，被投獅子坑後得保全。","A decree traps Daniel for his regular prayer; he is cast among lions and survives."],"deep":[["陷阱利用制度，並非單靠私人仇恨。","The plot exploits law, not merely personal jealousy."],["公開規律的祈禱比戲劇化反抗更受敘事強調。","Regular prayer, rather than theatrical defiance, is foregrounded."]],"caution":["被保全的結局不可責備未得保全的人。","Do not blame those not similarly delivered."],"question":["誰把法律變成陷害工具？","Who turns law into a trap?"]},{"n":7,"refs":"7","title":["四獸與天上法庭","Four beasts and heavenly court"],"summary":["四獸從海上來，亙古常在者施行審判，像人子的得永遠國度。","Four beasts rise from the sea; the Ancient of Days judges, and one like a human receives enduring rule."],"deep":[["第 2 章的國度主題以更令人不安的獸像重現。","The kingdom theme of chapter 2 returns in disturbing beast imagery."],["獸性與人性構成權力圖像的對照。","Beastliness and humanity contrast rival models of rule."]],"caution":["象徵語言不宜用於妖魔化當代民族。","Do not use beast imagery to demonize modern peoples."],"question":["為何權力被畫成獸？","Why depict power as beasts?"]},{"n":8,"refs":"8","title":["公綿羊與公山羊","Ram and goat"],"summary":["但以理看見公綿羊、公山羊與小角攻擊聖所，解釋指出瑪代波斯與希臘。","Daniel sees a ram, goat, and horn attacking the sanctuary; the vision names Medo-Persia and Greece."],"deep":[["聖所受侵犯讓政治暴力有敬拜層面的傷害。","Attack on the sanctuary makes political violence a worship crisis."],["第 9 章把時間問題放回悔改與神的憐憫中。","Chapter 9 situates timing questions within confession and mercy."]],"caution":["七十個七的解釋有爭論，勿只給一種確定說法。","The seventy weeks are debated; avoid a single claimed certainty."],"question":["異象中誰承受帝國衝突？","Who suffers in the vision’s imperial conflict?"]},{"n":9,"refs":"9","title":["認罪禱告與七十個七","Confession and seventy weeks"],"summary":["但以理讀耶利米預言後為群體認罪，天使以七十個七回應其疑問。","Reading Jeremiah, Daniel confesses communal sin; an angel answers with seventy weeks."],"deep":[["禱告先承認責任，才尋問時間。","Prayer acknowledges responsibility before asking about timing."],["第 9 章把時間問題放回悔改與神的憐憫中。","Chapter 9 situates timing questions within confession and mercy."]],"caution":["七十個七的解釋有爭論，勿只給一種確定說法。","The seventy weeks are debated; avoid a single claimed certainty."],"question":["但以理的禱告重點真是計算日期嗎？","Is the prayer chiefly about calculating dates?"]},{"n":10,"refs":"10","title":["天使來訪","Angelic visitor"],"summary":["但以理禁食悲傷，異象中一位使者安慰並說明他來遲的原因。","Daniel mourns and fasts; a heavenly visitor strengthens him and explains a delay."],"deep":[["啟示始於身體疲弱與被扶起，不是掌控未來。","Vision begins amid weakness and being strengthened, not mastery."],["得啟示的人也需要謙卑承認不知道。","Even a visionary must admit incomplete understanding."]],"caution":["不要用神秘數字預測當代日期或煽動恐懼。","Do not use symbolic numbers to predict dates or stir fear."],"question":["使者如何回應但以理的懼怕？","How does the visitor address Daniel’s fear?"]},{"n":11,"refs":"11","title":["南北王的爭戰","Conflicts of north and south"],"summary":["長篇預告列國與南北王的戰事、權謀及褻瀆聖所的王。","A lengthy vision depicts rival kings, intrigue, wars, and desecration of the sanctuary."],"deep":[["密集政治細節不可蓋過受壓聖民的處境。","Dense political detail must not eclipse the oppressed faithful."],["得啟示的人也需要謙卑承認不知道。","Even a visionary must admit incomplete understanding."]],"caution":["不要用神秘數字預測當代日期或煽動恐懼。","Do not use symbolic numbers to predict dates or stir fear."],"question":["哪些人承受王權爭奪的後果？","Who bears the consequences of royal rivalry?"]},{"n":12,"refs":"12","title":["末後與復活盼望","The end and resurrection hope"],"summary":["艱難時刻後，有人醒起得生命；但以理仍未全懂，受命安歇等候。","After distress some awaken to life; Daniel remains unsure and is told to rest and await his portion."],"deep":[["最後的盼望與「我不明白」並存。","Final hope coexists with “I did not understand.”"],["得啟示的人也需要謙卑承認不知道。","Even a visionary must admit incomplete understanding."]],"caution":["不要用神秘數字預測當代日期或煽動恐懼。","Do not use symbolic numbers to predict dates or stir fear."],"question":["不完全明白時如何保持盼望？","How can hope persist without full understanding?"]}],"themesIntro":["以下主題由但以理書的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of Daniel and complement the chapter studies."],"themes":[{"refs":"1","title":["流亡中的餐桌","Food and identity in exile"],"body":["四名青年在巴比倫受教育，仍尋求不玷污自己的飲食方式。","Four youths are trained in Babylon while seeking a way to remain faithful at the royal table."],"caution":["勿把飲食敘事當作普遍健康療法。","Do not make the food episode a universal health regimen."]},{"refs":"3","title":["火窯中的三人","Three in the furnace"],"body":["三人拒拜金像，承認即便不被救仍不屈服，之後從火窯得救。","Three refuse the image, confess they will not bow even if not rescued, and emerge from the furnace."],"caution":["不可向受迫害者保證必定免難。","Do not promise persecuted people certain escape."]},{"refs":"6","title":["獅子坑與禱告","Prayer and lions"],"body":["但以理在法令下仍照常禱告，遭陷害入獅子坑而得保全。","Daniel continues prayer despite the decree, is trapped in the lions’ den, and survives."],"caution":["被保全的結局不可責備未得保全的人。","Do not blame those not similarly delivered."]},{"refs":"8–9","title":["公綿羊、公山羊與禱告","Ram, goat, and prayer"],"body":["異象指向瑪代波斯與希臘衝突；但以理又以認罪禱告尋求耶路撒冷的未來。","A ram and goat evoke Medo-Persia and Greece; Daniel then prays confessionally about Jerusalem’s future."],"caution":["七十個七的解釋有爭論，勿只給一種確定說法。","The seventy weeks are debated; avoid a single claimed certainty."]},{"refs":"10–12","title":["最後異象與等待","Final vision and waiting"],"body":["天使向但以理解釋戰事與困難；末章談復活盼望，也承認他尚未完全明白。","An angel describes conflict and suffering; the final chapter offers resurrection hope while Daniel still lacks full understanding."],"caution":["不要用神秘數字預測當代日期或煽動恐懼。","Do not use symbolic numbers to predict dates or stir fear."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["火窯與獅子坑是特定敘事，不保證每位受迫害者都會免於死亡；陪伴受苦者時不可責怪未蒙解救的人。","The furnace and den are particular stories, not guarantees that every persecuted person survives; do not blame those who are not rescued."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1","title":["第 1 課｜流亡中的餐桌","Lesson 1 | Food and identity in exile"],"aim":["四名青年在巴比倫受教育，仍尋求不玷污自己的飲食方式。","Four youths are trained in Babylon while seeking a way to remain faithful at the royal table."],"flow":[["讀 1 章：文化學習與宗教忠誠在敘事中同時存在。","Read chapter 1: Cultural learning and religious loyalty coexist."],["對照 1 章：保留身分與學習異國語言並不互斥。","Compare chapters 1: Keeping identity and learning a foreign language are not opposites."],["討論：他們如何在宮廷內作有節制的抗議？","Discuss: How do they resist within the court without spectacle?"]],"question":["他們如何在宮廷內作有節制的抗議？","How do they resist within the court without spectacle?"],"practice":["勿把飲食敘事當作普遍健康療法。","Do not make the food episode a universal health regimen."]},{"refs":"2","title":["第 2 課｜夢中的像與國度","Lesson 2 | Statue and kingdoms"],"aim":["尼布甲尼撒夢見大像；但以理得啟示，指出帝國終將讓位於神的國。","Nebuchadnezzar dreams of a statue; Daniel interprets successive kingdoms yielding to God’s kingdom."],"flow":[["讀 2 章：石頭的來源與帝國金屬的堆疊形成對比。","Read chapter 2: The stone’s origin contrasts with the stacked imperial metals."],["對照 2 章：夢的重點是人造權勢有限，不只是金屬對照表。","Compare chapters 2: The dream stresses limited human power, not only a metal chart."],["討論：夢中的權力何者是暫時的？","Discuss: Which powers in the dream are temporary?"]],"question":["夢中的權力何者是暫時的？","Which powers in the dream are temporary?"],"practice":["帝國對應有爭議，不宜宣稱唯一確定。","Empire identifications are debated."]},{"refs":"3","title":["第 3 課｜火窯中的三人","Lesson 3 | Three in the furnace"],"aim":["三人拒拜金像，承認即便不被救仍不屈服，之後從火窯得救。","Three refuse the image, confess they will not bow even if not rescued, and emerge from the furnace."],"flow":[["讀 3 章：堅持發生在結果未明之時，不應只在得救後理解。","Read chapter 3: Their resolve precedes knowledge of the outcome."],["對照 3 章：「即或不然」比神蹟結局更能呈現信心自由。","Compare chapters 3: “Even if not” expresses fidelity beyond the miracle ending."],["討論：「即或不然」如何改變信心的定義？","Discuss: How does “even if not” reshape faith?"]],"question":["「即或不然」如何改變信心的定義？","How does “even if not” reshape faith?"],"practice":["不可向受迫害者保證必定免難。","Do not promise persecuted people certain escape."]},{"refs":"4–5","title":["第 4 課｜兩位王與驕傲","Lesson 4 | Two kings and pride"],"aim":["尼布甲尼撒如獸後悔悟；伯沙撒在宴席中輕慢聖器並迅速倒台。","Nebuchadnezzar becomes beastlike and humbles himself; Belshazzar desecrates vessels and falls."],"flow":[["讀 4 章：樹、獸與人共同描繪統治者失去合宜人性的過程。","Read chapter 4: Tree, beast, and human imagery portray distorted rule."],["對照 4–5 章：兩位王的不同回應使驕傲的後果清晰。","Compare chapters 4–5: The two rulers’ contrasting responses expose pride’s consequences."],["討論：他忽略了前王的什麼教訓？","Discuss: What lesson from his predecessor does he ignore?"]],"question":["王在哪裡把成就全歸給自己？","Where does the king claim total credit?"],"practice":["勿把精神疾病等同神學上的驕傲懲罰。","Do not equate mental illness with punishment for pride."]},{"refs":"6","title":["第 5 課｜獅子坑與禱告","Lesson 5 | Prayer and lions"],"aim":["但以理在法令下仍照常禱告，遭陷害入獅子坑而得保全。","Daniel continues prayer despite the decree, is trapped in the lions’ den, and survives."],"flow":[["讀 6 章：陷阱利用制度，並非單靠私人仇恨。","Read chapter 6: The plot exploits law, not merely personal jealousy."],["對照 6 章：公開規律的祈禱比戲劇化反抗更受敘事強調。","Compare chapters 6: Regular prayer, rather than theatrical defiance, is foregrounded."],["討論：誰把法律變成陷害工具？","Discuss: Who turns law into a trap?"]],"question":["誰把法律變成陷害工具？","Who turns law into a trap?"],"practice":["被保全的結局不可責備未得保全的人。","Do not blame those not similarly delivered."]},{"refs":"7","title":["第 6 課｜四獸與人子樣式","Lesson 6 | Four beasts and one like a son of man"],"aim":["但以理看見獸國、審判庭與一位像人子的得國；他自己仍驚惶。","Daniel sees beastly kingdoms, a heavenly court, and one like a human receiving dominion, yet remains troubled."],"flow":[["讀 7 章：第 2 章的國度主題以更令人不安的獸像重現。","Read chapter 7: The kingdom theme of chapter 2 returns in disturbing beast imagery."],["對照 7 章：獸性與人性構成權力圖像的對照。","Compare chapters 7: Beastliness and humanity contrast rival models of rule."],["討論：為何權力被畫成獸？","Discuss: Why depict power as beasts?"]],"question":["為何權力被畫成獸？","Why depict power as beasts?"],"practice":["象徵語言不宜用於妖魔化當代民族。","Do not use beast imagery to demonize modern peoples."]},{"refs":"8–9","title":["第 7 課｜公綿羊、公山羊與禱告","Lesson 7 | Ram, goat, and prayer"],"aim":["異象指向瑪代波斯與希臘衝突；但以理又以認罪禱告尋求耶路撒冷的未來。","A ram and goat evoke Medo-Persia and Greece; Daniel then prays confessionally about Jerusalem’s future."],"flow":[["讀 8 章：聖所受侵犯讓政治暴力有敬拜層面的傷害。","Read chapter 8: Attack on the sanctuary makes political violence a worship crisis."],["對照 8–9 章：第 9 章把時間問題放回悔改與神的憐憫中。","Compare chapters 8–9: Chapter 9 situates timing questions within confession and mercy."],["討論：但以理的禱告重點真是計算日期嗎？","Discuss: Is the prayer chiefly about calculating dates?"]],"question":["異象中誰承受帝國衝突？","Who suffers in the vision’s imperial conflict?"],"practice":["七十個七的解釋有爭論，勿只給一種確定說法。","The seventy weeks are debated; avoid a single claimed certainty."]},{"refs":"10–12","title":["第 8 課｜最後異象與等待","Lesson 8 | Final vision and waiting"],"aim":["天使向但以理解釋戰事與困難；末章談復活盼望，也承認他尚未完全明白。","An angel describes conflict and suffering; the final chapter offers resurrection hope while Daniel still lacks full understanding."],"flow":[["讀 10 章：啟示始於身體疲弱與被扶起，不是掌控未來。","Read chapter 10: Vision begins amid weakness and being strengthened, not mastery."],["對照 10–12 章：得啟示的人也需要謙卑承認不知道。","Compare chapters 10–12: Even a visionary must admit incomplete understanding."],["討論：不完全明白時如何保持盼望？","Discuss: How can hope persist without full understanding?"]],"question":["使者如何回應但以理的懼怕？","How does the visitor address Daniel’s fear?"],"practice":["不要用神秘數字預測當代日期或煽動恐懼。","Do not use symbolic numbers to predict dates or stir fear."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["但以理書最常被忽略的人物是誰？為何？","Which character in Daniel is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜但以理書導讀","BibleProject | Daniel guide"],"url":"https://bibleproject.com/guides/book-of-daniel/"}],"footer":["但以理書 · 成人主日學教師版 · 請配合完整經文閱讀。","Daniel · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
