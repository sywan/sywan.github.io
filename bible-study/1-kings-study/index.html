<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="列王紀上成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>列王紀上｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"1KI","category":["歷史書","Historical Books"],"name":["列王紀上","1 Kings"],"subtitle":["從大衛王位交接、聖殿建立到王國分裂與先知對抗：22 章追問權力是否聽從盟約。","From Davidic succession and the temple to a divided kingdom and prophetic challenge: 22 chapters ask whether power will heed the covenant."],"overviewIntro":["先沿王位、聖殿與先知三條線索讀全書，再比較各王的選擇。","Follow the throne, temple, and prophets, then compare each ruler’s choices."],"lengthNote":["22 章；與《列王紀下》構成一個連續敘事。","22 chapters; one continuous narrative with 2 Kings."],"thesis":["智慧與權力需要受盟約約束","Wisdom and power require covenant accountability"],"thesisDetail":["所羅門的智慧與建殿沒有阻止背離；分裂後先知持續指出偶像與不義。","Solomon’s wisdom and temple did not prevent disloyalty; prophets challenge idolatry and injustice after division."],"keyQuestion":["誰有權定義「成功的君王」？","Who defines a successful king?"],"keyAnswer":["敘事重點不只是版圖、財富與工程，也在王是否聽從神並公正對待人。","The narrative weighs more than territory, wealth, and building: obedience to God and justice toward people matter."],"finalMovement":["亞哈拒絕米該雅的警告而陣亡；王權終須面對它不願聽的真話。","Ahab rejects Micaiah’s warning and dies; kingship must answer to the truth it resists."],"readingKeys":[{"refs":"1–11","title":["所羅門的雙面圖像","Solomon’s double portrait"],"body":["求智慧、建殿與敬拜並存於徵稅、強制勞役與後來的背離。","Wisdom, temple, and worship coexist with taxation, labor, and later disloyalty."]},{"refs":"8–9","title":["聖殿與條件","Temple and condition"],"body":["獻殿禱告向萬民敞開，但神也警告離棄與審判。","The dedication prayer reaches the nations, yet God warns against apostasy."]},{"refs":"12–16","title":["分裂與重複模式","Division and recurring patterns"],"body":["兩國王權都須接受同一個敬拜與公義的評估。","Both kingdoms face evaluation by worship and justice."]},{"refs":"17–22","title":["先知的反聲","Prophetic countervoice"],"body":["以利亞與米該雅指出王權所遮蔽的真相。","Elijah and Micaiah expose truths royal power conceals."]}],"mapIntro":["全書由統一王國走向分裂，在以利亞事蹟中把焦點轉向先知與王權的衝突。","The book moves from united monarchy to division, then focuses on prophetic confrontation with royal power."],"movements":[{"refs":"1–2","title":["繼位與整肅","Succession and consolidation"],"body":["從亞多尼雅的擁立到所羅門的整肅，辨明王位合法性與暴力之間的張力。","Trace Adonijah’s bid and Solomon’s consolidation; examine legitimacy and violence."]},{"refs":"3–4","title":["智慧與王國","Wisdom and kingdom"],"body":["比較審判、行政秩序、豐饒與資源負擔。","Compare judgment, administration, abundance, and its costs."]},{"refs":"5–8","title":["建殿與獻殿","Building and dedication"],"body":["查考材料、勞役、建築與所羅門禱告中的神學。","Study materials, labor, architecture, and Solomon’s theology of prayer."]},{"refs":"9–11","title":["榮耀與裂痕","Splendor and fracture"],"body":["由神的警告、國際聲望與外邦敬拜，追問所羅門統治的轉折。","Trace warning, international fame, and foreign worship in Solomon’s turn."]},{"refs":"12–14","title":["分裂與競爭敬拜","Division and rival worship"],"body":["對比羅波安的重軛、耶羅波安的祭壇及先知警告。","Compare Rehoboam’s harsh rule, Jeroboam’s shrines, and prophetic warnings."]},{"refs":"15–16","title":["兩國王朝評估","Evaluating two kingdoms"],"body":["以亞撒改革及北國連續政變，理解敘事的評價準則。","Read Asa’s reforms and northern coups through the book’s evaluative lens."]},{"refs":"17–19","title":["以利亞與亞哈","Elijah and Ahab"],"body":["旱災、迦密山與何烈山呈現供應、公開爭論與先知疲乏。","Drought, Carmel, and Horeb show provision, public contest, and prophetic exhaustion."]},{"refs":"20–22","title":["戰爭、土地與真話","War, land, and truth"],"body":["由亞蘭戰爭、拿伯葡萄園與米該雅，檢驗王如何回應限制。","Use the Aramean wars, Naboth’s vineyard, and Micaiah to test royal response to limits."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["《列王紀》從盟約神學評價諸王；歷史事件與神學詮釋應分層討論。","Kings evaluates rulers through covenant theology; distinguish narrated events from theological interpretation."]},"chaptersIntro":["每章先抓人物與事件，再觀察敘事對權力、敬拜及公義的判斷。","Track people and events first, then the narrative’s judgments on power, worship, and justice."],"chapters":[{"n":1,"refs":"1","title":["亞多尼雅與繼位","Adonijah and succession"],"summary":["大衛年老，亞多尼雅自立為王；拿單與拔示巴促成所羅門公開受膏。","As David ages, Adonijah claims the throne; Nathan and Bathsheba secure Solomon’s public anointing."],"deep":[["比較宴席擁立與基訓受膏的支持者及政治訊號。","Compare the supporters and political signals of the banquet and Gihon anointing."],["留意先知、王后與軍事首領都參與交棒。","Notice prophets, queens, and commanders in the transfer of power."]],"caution":["不要把所有被殺者的命運稱作無爭議的神旨意。","Do not call every execution an unambiguous divine mandate."],"question":["誰有權決定王位交接，哪些人被排除？","Who decides succession, and who is excluded?"]},{"n":2,"refs":"2","title":["大衛遺命與王權整肅","David’s charge and royal consolidation"],"summary":["大衛囑咐所羅門遵行律法，也交代約押與示每等人的處置；所羅門鞏固王位。","David charges Solomon to keep Torah and addresses Joab and Shimei; Solomon consolidates his rule."],"deep":[["分辨遵行律法的命令與清算政敵的命令。","Distinguish the Torah charge from instructions about political rivals."],["留意先知、王后與軍事首領都參與交棒。","Notice prophets, queens, and commanders in the transfer of power."]],"caution":["不要把所有被殺者的命運稱作無爭議的神旨意。","Do not call every execution an unambiguous divine mandate."],"question":["敘事如何同時呈現秩序與暴力？","How does the narrative show both order and violence?"]},{"n":3,"refs":"3","title":["求智慧與兩位婦人","Wisdom and two women"],"summary":["所羅門在基遍求能判斷的心；兩位婦人的案件試出他的辨識力。","At Gibeon Solomon asks for a discerning heart; the dispute between two women tests it."],"deep":[["求智慧的中心是聽辨與公正，而非單純增加知識。","The request concerns hearing and justice, not mere information."],["「智慧」在判案與治理兩處接受檢驗。","Wisdom is tested in both adjudication and governance."]],"caution":["繁榮圖像也應追問誰承擔代價。","Ask who bears the cost of prosperity."],"question":["這個判案為何成為王權的檢驗？","Why does this judgment test kingship?"]},{"n":4,"refs":"4","title":["官員、供應與繁榮","Administration and abundance"],"summary":["列出官員、地區供應與王國疆域，並描寫所羅門的智慧與豐饒。","Officials, district provisions, territory, wisdom, and abundance depict Solomon’s kingdom."],"deep":[["地區輪流供應王室，繁榮也有行政成本。","Rotating district supplies reveal the administrative cost of abundance."],["「智慧」在判案與治理兩處接受檢驗。","Wisdom is tested in both adjudication and governance."]],"caution":["繁榮圖像也應追問誰承擔代價。","Ask who bears the cost of prosperity."],"question":["誰從繁榮得益，誰負責供應？","Who benefits from prosperity, and who supplies it?"]},{"n":5,"refs":"5","title":["與希蘭合作","Alliance with Hiram"],"summary":["所羅門與推羅王希蘭商議香柏木、工匠與糧食，組織勞工準備建殿。","Solomon arranges timber, artisans, food, and labor with Hiram of Tyre to prepare the temple."],"deep":[["國際合作與徵用勞力同在，不宜只見宏偉成果。","International cooperation and labor conscription accompany the grand project."],["第 8 章承認天和天上的天也不足容納神。","Chapter 8 says even the highest heaven cannot contain God."]],"caution":["勿以建築規模直接衡量敬拜真實。","Do not measure authentic worship by building size."],"question":["建殿的材料從何而來？","Where do the temple’s materials come from?"]},{"n":6,"refs":"6","title":["聖殿建造","Building the temple"],"summary":["聖殿的尺寸、內殿與裝飾被詳述；神應許同在與遵行律法相連。","Temple dimensions, inner sanctuary, and ornament are detailed; divine presence is linked with obedience."],"deep":[["建築敘述中穿插盟約條件，提醒讀者不可只看外觀。","The covenant condition interrupts architectural description."],["第 8 章承認天和天上的天也不足容納神。","Chapter 8 says even the highest heaven cannot contain God."]],"caution":["勿以建築規模直接衡量敬拜真實。","Do not measure authentic worship by building size."],"question":["為何建殿敘事中要插入聽命的話？","Why interrupt construction with a call to obedience?"]},{"n":7,"refs":"7","title":["王宮與器物","Palace and furnishings"],"summary":["所羅門興建王宮，戶蘭製作銅柱、銅海與器皿。","Solomon builds his palace; Huram crafts pillars, the bronze sea, and furnishings."],"deep":[["比較聖殿與王宮的篇幅、時間與功能。","Compare temple and palace in scale, timing, and purpose."],["第 8 章承認天和天上的天也不足容納神。","Chapter 8 says even the highest heaven cannot contain God."]],"caution":["勿以建築規模直接衡量敬拜真實。","Do not measure authentic worship by building size."],"question":["王宮與聖殿並置有何敘事效果？","What is the effect of placing palace and temple together?"]},{"n":8,"refs":"8","title":["約櫃與獻殿禱告","Ark and dedication prayer"],"summary":["約櫃入殿，榮光充滿；所羅門禱告求神垂聽悔改者與外邦人的祈求。","The ark enters, glory fills the temple, and Solomon prays for penitents and foreigners."],"deep":[["反覆的「從天垂聽」表明神不被殿宇限制。","Repeated “hear from heaven” refuses to confine God to the building."],["第 8 章承認天和天上的天也不足容納神。","Chapter 8 says even the highest heaven cannot contain God."]],"caution":["勿以建築規模直接衡量敬拜真實。","Do not measure authentic worship by building size."],"question":["禱告中的外邦人與被擄者為何重要？","Why include foreigners and exiles in the prayer?"]},{"n":9,"refs":"9","title":["應許、警告與工程","Promise, warning, and projects"],"summary":["神再次應許並警告所羅門；敘事記錄城邑、勞役、航海與財富。","God renews promise and warning; the text records cities, labor, shipping, and wealth."],"deep":[["神的警告先於第 11 章的背離。","The warning anticipates chapter 11’s disloyalty."],["第 9 章警告與第 11 章背離相互照應。","The warning of chapter 9 frames the disloyalty in chapter 11."]],"caution":["勿把外籍女性一概當作問題根源；敘事責任落在王的選擇。","Do not blame foreign women as a group; the narrative holds the king responsible."],"question":["工程成功能否抵消盟約警告？","Can successful projects cancel the covenant warning?"]},{"n":10,"refs":"10","title":["示巴女王來訪","Queen of Sheba visits"],"summary":["女王考驗所羅門智慧並讚賞其國，財富與貿易的描寫達到高峰。","The queen tests Solomon’s wisdom; royal splendor, trade, and wealth reach a peak."],"deep":[["外邦女王的稱讚與讀者已知的警告形成張力。","The foreign queen’s praise stands beside the warning readers have heard."],["第 9 章警告與第 11 章背離相互照應。","The warning of chapter 9 frames the disloyalty in chapter 11."]],"caution":["勿把外籍女性一概當作問題根源；敘事責任落在王的選擇。","Do not blame foreign women as a group; the narrative holds the king responsible."],"question":["讚賞與批判如何同時閱讀？","How can admiration and critique be held together?"]},{"n":11,"refs":"11","title":["所羅門背離","Solomon turns away"],"summary":["所羅門隨從別神；神宣告國將分裂，耶羅波安得先知預告。","Solomon turns to other gods; the kingdom’s division is announced, and Jeroboam receives a prophetic word."],"deep":[["王的選擇與後代承受的政治後果相連。","The king’s decisions create political consequences for later generations."],["第 9 章警告與第 11 章背離相互照應。","The warning of chapter 9 frames the disloyalty in chapter 11."]],"caution":["勿把外籍女性一概當作問題根源；敘事責任落在王的選擇。","Do not blame foreign women as a group; the narrative holds the king responsible."],"question":["為何智慧未能保守所羅門的忠誠？","Why did wisdom fail to sustain Solomon’s fidelity?"]},{"n":12,"refs":"12","title":["重軛、分裂與金牛犢","Heavy yoke, division, and calves"],"summary":["羅波安拒絕減輕負擔，北方另立耶羅波安；後者在但與伯特利設敬拜中心。","Rehoboam refuses relief, northern tribes choose Jeroboam, and he establishes shrines at Dan and Bethel."],"deep":[["耶羅波安出於政治恐懼安排宗教，不能只讀成私人偏好。","Jeroboam’s worship policy responds to political fear, not just private taste."],["分裂含政治負擔與宗教安排兩層。","Division has both economic-political and worship dimensions."]],"caution":["勿將國家分裂全歸咎單一人物或事件。","Do not reduce division to one person or event."],"question":["經濟壓力與敬拜安排如何促成分裂？","How do economic burdens and worship policy shape division?"]},{"n":13,"refs":"13","title":["伯特利的神人","Man of God at Bethel"],"summary":["先知斥責祭壇，卻因另一先知的話違反原先命令，途中身亡。","A prophet condemns the altar but trusts another prophet against his original charge and dies on the road."],"deep":[["兩個先知的相反話語要求讀者辨別權威。","Conflicting prophetic claims require discernment about authority."],["分裂含政治負擔與宗教安排兩層。","Division has both economic-political and worship dimensions."]],"caution":["勿將國家分裂全歸咎單一人物或事件。","Do not reduce division to one person or event."],"question":["為何故事同時審視祭壇與傳話者？","Why scrutinize both the altar and the messenger?"]},{"n":14,"refs":"14","title":["耶羅波安與羅波安","Jeroboam and Rehoboam"],"summary":["亞希雅宣告耶羅波安家敗落；羅波安在猶大作王，埃及侵襲耶路撒冷。","Ahijah announces judgment on Jeroboam’s house; Rehoboam rules Judah as Egypt raids Jerusalem."],"deep":[["兩國都被評估，沒有一國因起源而自動正當。","Both kingdoms are evaluated; neither is automatically vindicated by origin."],["分裂含政治負擔與宗教安排兩層。","Division has both economic-political and worship dimensions."]],"caution":["勿將國家分裂全歸咎單一人物或事件。","Do not reduce division to one person or event."],"question":["兩國敘事如何互相照鏡？","How do the two kingdoms mirror one another?"]},{"n":15,"refs":"15","title":["亞比央、亞撒與北國","Abijam, Asa, and the north"],"summary":["猶大王亞比央後，亞撒推動改革；北國拿答與巴沙的王朝更替帶來流血。","After Abijam, Asa reforms Judah; Nadab and Baasha mark bloody northern succession."],"deep":[["改革、聯盟與戰事交錯，不能用單一標籤概括亞撒。","Reform, alliance, and war intersect in Asa’s portrait."],["姓名、年數與母親資訊構成王朝對照。","Names, reign lengths, and family details form a royal comparison."]],"caution":["年代與同步表是編年工具，不等於詳盡現代史。","Synchronisms are narrative chronology, not exhaustive modern history."],"question":["王朝更替與忠誠評價如何不同？","How does dynastic change differ from covenant evaluation?"]},{"n":16,"refs":"16","title":["政變、暗利與亞哈","Coups, Omri, and Ahab"],"summary":["巴沙後有以拉、心利短命政權，暗利建立撒馬利亞，亞哈推行巴力敬拜。","Elah and Zimri follow Baasha; Omri founds Samaria, and Ahab promotes Baal worship."],"deep":[["政治能力與敘事中的屬靈評價不是同一把尺。","Political achievement and covenant evaluation use different measures."],["姓名、年數與母親資訊構成王朝對照。","Names, reign lengths, and family details form a royal comparison."]],"caution":["年代與同步表是編年工具，不等於詳盡現代史。","Synchronisms are narrative chronology, not exhaustive modern history."],"question":["為何強盛的暗利王朝仍受批評？","Why is a powerful Omride line still criticized?"]},{"n":17,"refs":"17","title":["旱災與寡婦","Drought and the widow"],"summary":["以利亞宣告旱災，神藉溪水與撒勒法寡婦供應；寡婦兒子復生。","Elijah announces drought; God sustains him by a brook and a Zarephath widow, whose son is restored."],"deep":[["外邦寡婦既供應先知，也是自己有需要的人。","The foreign widow both supports the prophet and has urgent needs herself."],["以利亞既勇敢也會恐懼；神在兩種處境中與他相遇。","Elijah is courageous and afraid; God meets him in both states."]],"caution":["迦密山的暴力情節不可作為今日迫害異信者的藉口。","Carmel’s violence cannot justify persecuting people of other beliefs today."],"question":["這位寡婦的聲音如何改變故事焦點？","How does the widow’s voice shift the focus?"]},{"n":18,"refs":"18","title":["迦密山的抉擇","Carmel’s contest"],"summary":["以利亞面對亞哈與巴力先知；祭壇之火後有雨，百姓被要求作出選擇。","Elijah confronts Ahab and Baal’s prophets; fire and then rain call the people to choose."],"deep":[["祭壇修復、禱告與雨水共同呈現對耶和華的依靠。","Altar repair, prayer, and rain portray dependence on the Lord."],["以利亞既勇敢也會恐懼；神在兩種處境中與他相遇。","Elijah is courageous and afraid; God meets him in both states."]],"caution":["迦密山的暴力情節不可作為今日迫害異信者的藉口。","Carmel’s violence cannot justify persecuting people of other beliefs today."],"question":["敘事如何區分表演與禱告？","How does the narrative contrast performance and prayer?"]},{"n":19,"refs":"19","title":["何烈山與疲乏","Horeb and exhaustion"],"summary":["以利亞逃亡求死；神供應食物，在何烈山向他發問並交付後續使命。","Elijah flees and wishes to die; God feeds him, questions him at Horeb, and gives a further commission."],"deep":[["先知的疲乏被認真對待，不是用責備瞬間消除。","Prophetic exhaustion is met with care, not instantly dismissed."],["以利亞既勇敢也會恐懼；神在兩種處境中與他相遇。","Elijah is courageous and afraid; God meets him in both states."]],"caution":["迦密山的暴力情節不可作為今日迫害異信者的藉口。","Carmel’s violence cannot justify persecuting people of other beliefs today."],"question":["神如何回應疲乏而孤單的僕人？","How does God address an exhausted, isolated servant?"]},{"n":20,"refs":"20","title":["亞蘭戰爭與亞哈","Aram’s wars and Ahab"],"summary":["亞哈兩次勝過亞蘭，卻與便哈達立約；先知指出他放走被交付的人。","Ahab defeats Aram twice but makes terms with Ben-hadad; a prophet challenges his release."],"deep":[["軍事勝利不等於領袖每個決定都正確。","Military success does not validate every royal decision."],["亞哈的悔改、再起與死亡呈現複雜人物。","Ahab’s grief, renewed action, and death complicate a one-note reading."]],"caution":["拿伯被殺不可只當作亞哈個人品格的例證。","Naboth’s murder is more than an illustration of Ahab’s character."],"question":["戰後和約為何遭先知批評？","Why does the prophet challenge the postwar agreement?"]},{"n":21,"refs":"21","title":["拿伯的葡萄園","Naboth’s vineyard"],"summary":["耶洗別策劃假見證使拿伯被殺，亞哈奪地；以利亞宣告審判，亞哈自卑。","Jezebel arranges false testimony and Naboth’s death; Ahab takes the land, Elijah confronts him, and Ahab humbles himself."],"deep":[["土地、法庭與王權聯手壓迫一個拒絕出售產業的人。","Land, court, and crown combine against a man unwilling to sell his inheritance."],["亞哈的悔改、再起與死亡呈現複雜人物。","Ahab’s grief, renewed action, and death complicate a one-note reading."]],"caution":["拿伯被殺不可只當作亞哈個人品格的例證。","Naboth’s murder is more than an illustration of Ahab’s character."],"question":["誰的證詞在這場案件中被操縱？","Whose testimony is manipulated in this case?"]},{"n":22,"refs":"22","title":["米該雅與亞哈之死","Micaiah and Ahab’s death"],"summary":["多數先知贊同出戰，米該雅說相反的話；亞哈在基列的拉末陣亡。","Most prophets favor battle, Micaiah dissents, and Ahab dies at Ramoth-gilead."],"deep":[["少數聲音不一定真；本章要求檢查它與事件如何相互印證。","Dissent is not automatically true; test how a word and events relate."],["亞哈的悔改、再起與死亡呈現複雜人物。","Ahab’s grief, renewed action, and death complicate a one-note reading."]],"caution":["拿伯被殺不可只當作亞哈個人品格的例證。","Naboth’s murder is more than an illustration of Ahab’s character."],"question":["王為何聽見真話卻仍拒絕？","Why does the king hear the warning yet reject it?"]}],"themesIntro":["以王權、聖殿、偶像、先知與弱者五條路徑回讀全書。","Revisit the book through kingship, temple, idols, prophecy, and vulnerable people."],"themes":[{"refs":"1–2; 12; 22","title":["王位與責任","Throne and responsibility"],"body":["繼位、分裂與戰死都顯出王權無法保證自身正當性。","Succession, division, and death show that kingship cannot justify itself."],"caution":["勿將敘事中的政治清洗當成今日做法的命令。","Do not treat narrated political violence as a command for today."]},{"refs":"3–4; 10–11","title":["智慧的限制","Limits of wisdom"],"body":["智慧須落實於持續聽命，不能由早期成就保證終身忠誠。","Wisdom needs continued obedience; early achievement guarantees no lifelong fidelity."],"caution":["不要把所羅門簡化為純粹榜樣或純粹反面角色。","Avoid flattening Solomon into only a model or only a villain."]},{"refs":"5–9","title":["聖殿與同在","Temple and presence"],"body":["神的同在不能被建築控制；第 8 章禱告反覆盼望赦免與回轉。","Divine presence cannot be controlled by a building; chapter 8 repeatedly seeks forgiveness and return."],"caution":["獻殿不等於制度自動獲神認可。","Dedication does not make an institution automatically approved."]},{"refs":"12–18","title":["偶像與忠誠","Idolatry and loyalty"],"body":["金牛犢與巴力敬拜既是宗教抉擇，也與政治穩定及權力綁定。","Calves and Baal worship are religious choices entangled with political stability and power."],"caution":["不可把任何當代群體直接等同經文中的偶像崇拜者。","Do not equate a modern group directly with the text’s idolaters."]},{"refs":"17; 21–22","title":["弱者與真話","The vulnerable and truth"],"body":["寡婦、拿伯與受孤立的先知讓讀者看見權力代價。","The widow, Naboth, and isolated prophets show the cost of power."],"caution":["以受害者視角討論，不把傷害只當王室情節。","Discuss harm from victims’ perspectives, not only as royal intrigue."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["勿把政治強盛當成神認可的直接證據；尤其要讓拿伯與寡婦的處境發聲。","Do not treat political strength as automatic divine approval; hear Naboth and the widow as well as kings."]},"lessonsIntro":["八課依敘事順序，從繼位走到米該雅的警告；每課保留經文觀察與倫理辨析。","Eight sequential lessons move from succession to Micaiah’s warning, combining textual observation and ethical discernment."],"lessons":[{"refs":"1–2","title":["第 1 課｜繼位與整肅","Lesson 1 | Succession and consolidation"],"aim":["從亞多尼雅的擁立到所羅門的整肅，辨明王位合法性與暴力之間的張力。","Trace Adonijah’s bid and Solomon’s consolidation; examine legitimacy and violence."],"flow":[["讀 1 章：比較宴席擁立與基訓受膏的支持者及政治訊號。","Read chapter 1: Compare the supporters and political signals of the banquet and Gihon anointing."],["對照 1–2 章：留意先知、王后與軍事首領都參與交棒。","Compare chapters 1–2: Notice prophets, queens, and commanders in the transfer of power."],["討論：敘事如何同時呈現秩序與暴力？","Discuss: How does the narrative show both order and violence?"]],"question":["誰有權決定王位交接，哪些人被排除？","Who decides succession, and who is excluded?"],"practice":["不要把所有被殺者的命運稱作無爭議的神旨意。","Do not call every execution an unambiguous divine mandate."]},{"refs":"3–4","title":["第 2 課｜智慧與王國","Lesson 2 | Wisdom and kingdom"],"aim":["比較審判、行政秩序、豐饒與資源負擔。","Compare judgment, administration, abundance, and its costs."],"flow":[["讀 3 章：求智慧的中心是聽辨與公正，而非單純增加知識。","Read chapter 3: The request concerns hearing and justice, not mere information."],["對照 3–4 章：「智慧」在判案與治理兩處接受檢驗。","Compare chapters 3–4: Wisdom is tested in both adjudication and governance."],["討論：誰從繁榮得益，誰負責供應？","Discuss: Who benefits from prosperity, and who supplies it?"]],"question":["這個判案為何成為王權的檢驗？","Why does this judgment test kingship?"],"practice":["繁榮圖像也應追問誰承擔代價。","Ask who bears the cost of prosperity."]},{"refs":"5–8","title":["第 3 課｜建殿與獻殿","Lesson 3 | Building and dedication"],"aim":["查考材料、勞役、建築與所羅門禱告中的神學。","Study materials, labor, architecture, and Solomon’s theology of prayer."],"flow":[["讀 5 章：國際合作與徵用勞力同在，不宜只見宏偉成果。","Read chapter 5: International cooperation and labor conscription accompany the grand project."],["對照 5–8 章：第 8 章承認天和天上的天也不足容納神。","Compare chapters 5–8: Chapter 8 says even the highest heaven cannot contain God."],["討論：禱告中的外邦人與被擄者為何重要？","Discuss: Why include foreigners and exiles in the prayer?"]],"question":["建殿的材料從何而來？","Where do the temple’s materials come from?"],"practice":["勿以建築規模直接衡量敬拜真實。","Do not measure authentic worship by building size."]},{"refs":"9–11","title":["第 4 課｜榮耀與裂痕","Lesson 4 | Splendor and fracture"],"aim":["由神的警告、國際聲望與外邦敬拜，追問所羅門統治的轉折。","Trace warning, international fame, and foreign worship in Solomon’s turn."],"flow":[["讀 9 章：神的警告先於第 11 章的背離。","Read chapter 9: The warning anticipates chapter 11’s disloyalty."],["對照 9–11 章：第 9 章警告與第 11 章背離相互照應。","Compare chapters 9–11: The warning of chapter 9 frames the disloyalty in chapter 11."],["討論：為何智慧未能保守所羅門的忠誠？","Discuss: Why did wisdom fail to sustain Solomon’s fidelity?"]],"question":["工程成功能否抵消盟約警告？","Can successful projects cancel the covenant warning?"],"practice":["勿把外籍女性一概當作問題根源；敘事責任落在王的選擇。","Do not blame foreign women as a group; the narrative holds the king responsible."]},{"refs":"12–14","title":["第 5 課｜分裂與競爭敬拜","Lesson 5 | Division and rival worship"],"aim":["對比羅波安的重軛、耶羅波安的祭壇及先知警告。","Compare Rehoboam’s harsh rule, Jeroboam’s shrines, and prophetic warnings."],"flow":[["讀 12 章：耶羅波安出於政治恐懼安排宗教，不能只讀成私人偏好。","Read chapter 12: Jeroboam’s worship policy responds to political fear, not just private taste."],["對照 12–14 章：分裂含政治負擔與宗教安排兩層。","Compare chapters 12–14: Division has both economic-political and worship dimensions."],["討論：兩國敘事如何互相照鏡？","Discuss: How do the two kingdoms mirror one another?"]],"question":["經濟壓力與敬拜安排如何促成分裂？","How do economic burdens and worship policy shape division?"],"practice":["勿將國家分裂全歸咎單一人物或事件。","Do not reduce division to one person or event."]},{"refs":"15–16","title":["第 6 課｜兩國王朝評估","Lesson 6 | Evaluating two kingdoms"],"aim":["以亞撒改革及北國連續政變，理解敘事的評價準則。","Read Asa’s reforms and northern coups through the book’s evaluative lens."],"flow":[["讀 15 章：改革、聯盟與戰事交錯，不能用單一標籤概括亞撒。","Read chapter 15: Reform, alliance, and war intersect in Asa’s portrait."],["對照 15–16 章：姓名、年數與母親資訊構成王朝對照。","Compare chapters 15–16: Names, reign lengths, and family details form a royal comparison."],["討論：為何強盛的暗利王朝仍受批評？","Discuss: Why is a powerful Omride line still criticized?"]],"question":["王朝更替與忠誠評價如何不同？","How does dynastic change differ from covenant evaluation?"],"practice":["年代與同步表是編年工具，不等於詳盡現代史。","Synchronisms are narrative chronology, not exhaustive modern history."]},{"refs":"17–19","title":["第 7 課｜以利亞與亞哈","Lesson 7 | Elijah and Ahab"],"aim":["旱災、迦密山與何烈山呈現供應、公開爭論與先知疲乏。","Drought, Carmel, and Horeb show provision, public contest, and prophetic exhaustion."],"flow":[["讀 17 章：外邦寡婦既供應先知，也是自己有需要的人。","Read chapter 17: The foreign widow both supports the prophet and has urgent needs herself."],["對照 17–19 章：以利亞既勇敢也會恐懼；神在兩種處境中與他相遇。","Compare chapters 17–19: Elijah is courageous and afraid; God meets him in both states."],["討論：神如何回應疲乏而孤單的僕人？","Discuss: How does God address an exhausted, isolated servant?"]],"question":["這位寡婦的聲音如何改變故事焦點？","How does the widow’s voice shift the focus?"],"practice":["迦密山的暴力情節不可作為今日迫害異信者的藉口。","Carmel’s violence cannot justify persecuting people of other beliefs today."]},{"refs":"20–22","title":["第 8 課｜戰爭、土地與真話","Lesson 8 | War, land, and truth"],"aim":["由亞蘭戰爭、拿伯葡萄園與米該雅，檢驗王如何回應限制。","Use the Aramean wars, Naboth’s vineyard, and Micaiah to test royal response to limits."],"flow":[["讀 20 章：軍事勝利不等於領袖每個決定都正確。","Read chapter 20: Military success does not validate every royal decision."],["對照 20–22 章：亞哈的悔改、再起與死亡呈現複雜人物。","Compare chapters 20–22: Ahab’s grief, renewed action, and death complicate a one-note reading."],["討論：王為何聽見真話卻仍拒絕？","Discuss: Why does the king hear the warning yet reject it?"]],"question":["戰後和約為何遭先知批評？","Why does the prophet challenge the postwar agreement?"],"practice":["拿伯被殺不可只當作亞哈個人品格的例證。","Naboth’s murder is more than an illustration of Ahab’s character."]}],"questionsIntro":["先請學員指出經文證據，再比較不同人物的資訊與動機。","Ask for textual evidence before comparing what characters know and why they act."],"extraQuestions":[["所羅門的智慧與後來的背離應如何一起閱讀？","How should Solomon’s wisdom and later disloyalty be read together?"],["聖殿有何價值，又有哪些不能保證的事？","What is the temple’s value, and what can it not guarantee?"],["先知對王說真話時承擔什麼風險？","What risks do prophets take in telling kings the truth?"]],"sourceNote":["本頁是依經文編寫的原創研讀摘要；延伸閱讀供比較結構與詮釋，請以完整經文核對。","These are original study summaries based on the text; compare the further guide with the full biblical text."],"sources":[{"title":["BibleProject｜列王紀上、下導讀","BibleProject | Books of Kings guide"],"url":"https://bibleproject.com/guides/books-of-kings/"}],"footer":["列王紀上 · 成人主日學教師版 · 請配合完整經文閱讀。","1 Kings · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
