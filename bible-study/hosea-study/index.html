<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="何西阿書成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>何西阿書｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"HOS","category":["十二小先知","The Twelve Minor Prophets"],"name":["何西阿書","Hosea"],"subtitle":["14 章逐章研讀；從歷史處境、詩歌與異象觀察先知的公義、悔改和盼望。","Explore all 14 chapters through historical setting, poetic imagery, justice, repentance, and hope."],"overviewIntro":["先從全書結構掌握何西阿書，再逐章研讀人物、事件與神學判斷。","Survey Hosea as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["14 章；依照書卷原有次序逐章研讀。","14 chapters studied in canonical sequence."],"thesis":["背約之中仍有醫治的愛","Healing love amid broken covenant"],"thesisDetail":["婚姻、親子與政治圖像揭露北國以色列的偶像與不義；審判並非神最後的心意，結尾召人歸回。","Marriage, parenthood, and politics expose Israel’s idols and injustice; judgment is not the last word, and the ending calls for return."],"keyQuestion":["何西阿書如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Hosea portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["婚姻、親子與政治圖像揭露北國以色列的偶像與不義；審判並非神最後的心意，結尾召人歸回。","Marriage, parenthood, and politics expose Israel’s idols and injustice; judgment is not the last word, and the ending calls for return."],"finalMovement":["第 14 章以醫治背道、甘露滋養和智慧結語收束，讓前面尖銳控訴指向更新。","Chapter 14 ends with healing, dew, and a wisdom epilogue that directs fierce accusations toward renewal."],"readingKeys":[{"refs":"1–2","title":["象徵婚姻與名字","Marriage and names"],"body":["婚姻與孩子名字揭露破約，隨後出現重新立約的言語。","Marriage and child names expose rupture and lead to covenant renewal."]},{"refs":"4–5","title":["祭司、領袖與公義","Priests, rulers, and justice"],"body":["失去對神的認識表現在社會暴力與領袖設網。","Lost knowledge appears in violence and failed leadership."]},{"refs":"7–8","title":["政治與偶像的風","Alliances and idols"],"body":["陰謀、錯誤王權及靠強國的選擇終有後果。","Plots, kingship, and reliance on empires bring consequences."]},{"refs":"14","title":["歸回與智慧結尾","Return and wisdom ending"],"body":["帶著話語歸回，並從醫治與甘露重新理解全書。","Repentant words and healing dew recast the whole book."]}],"mapIntro":["八個教學單元幫助辨識何西阿書的推進；短卷按經文小段細讀。","Eight teaching units trace the movement of Hosea; short books are divided by passages."],"movements":[{"refs":"1–2","title":["象徵婚姻與名字","Marriage and names"],"body":["婚姻與孩子名字揭露破約，隨後出現重新立約的言語。","Marriage and child names expose rupture and lead to covenant renewal."]},{"refs":"3","title":["等待中的尋回","Seeking during waiting"],"body":["尋回行動與暫時失去王權的預告並列。","Seeking again is paired with waiting without kingship."]},{"refs":"4–5","title":["祭司、領袖與公義","Priests, rulers, and justice"],"body":["失去對神的認識表現在社會暴力與領袖設網。","Lost knowledge appears in violence and failed leadership."]},{"refs":"6","title":["慈愛與短暫悔意","Love and fleeting loyalty"],"body":["早晨雲霧比喻暫時悔改，慈愛與認識才是核心。","Morning-mist loyalty contrasts with covenant love and knowledge."]},{"refs":"7–8","title":["政治與偶像的風","Alliances and idols"],"body":["陰謀、錯誤王權及靠強國的選擇終有後果。","Plots, kingship, and reliance on empires bring consequences."]},{"refs":"9–10","title":["豐收變流亡","Harvest to exile"],"body":["節期、葡萄樹與祭壇圖像反轉成失地危機。","Festival, vine, and altar imagery turns toward displacement."]},{"refs":"11–13","title":["父親的憐憫與歷史追問","Parental mercy and historical reckoning"],"body":["神不忍棄絕兒子，卻也揭露世代延續的自滿。","Divine compassion and generational complacency stand together."]},{"refs":"14","title":["歸回與智慧結尾","Return and wisdom ending"],"body":["帶著話語歸回，並從醫治與甘露重新理解全書。","Repentant words and healing dew recast the whole book."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."]},"chaptersIntro":["按何西阿書的正典章次逐章閱讀；各章提供摘要、兩個細讀方向、提醒和教學問題。","Read Hosea in canonical sequence; each chapter has a summary, two close-reading points, a caution, and a teaching question."],"chapters":[{"n":1,"refs":"1","title":["婚姻與三個名字","Marriage and three names"],"summary":["先知的婚姻與耶斯列、羅路哈瑪、羅阿米三名顯出破裂關係，末段預告逆轉。","The marriage and three child names dramatize broken relationship before a promised reversal."],"deep":[["姓名的否定與後來的恢復應連讀。","Read the negative names with their later reversal."],["姓名的否定與後來的恢復應連讀。","Read the negative names with their later reversal."]],"caution":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."],"question":["哪一節最能支持「姓名的否定與後來的恢復應連讀。」的觀察？","Which verse best supports the observation “Read the negative names with their later reversal.”?"]},{"n":2,"refs":"2","title":["控訴與再立約","Accusation and renewed covenant"],"summary":["農產被誤認為巴力所賜，神將引群體到曠野重新說話、再立約。","Produce is credited to Baal, yet the people are drawn into wilderness and covenant renewed."],"deep":[["曠野既是失去供應之處，也是重新認識之處。","Wilderness is both loss and a place of renewed knowing."],["姓名的否定與後來的恢復應連讀。","Read the negative names with their later reversal."]],"caution":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."],"question":["哪一節最能支持「曠野既是失去供應之處，也是重新認識之處。」的觀察？","Which verse best supports the observation “Wilderness is both loss and a place of renewed knowing.”?"]},{"n":3,"refs":"3","title":["重新尋回","Seeking again"],"summary":["先知以象徵行動尋回妻子，預告以色列經過無王無祭的等待後歸回。","A sign act of seeking again anticipates Israel’s long wait without king or cult before return."],"deep":[["重新開始需要等待，並非立即恢復舊秩序。","Renewal includes waiting, not instant restoration."],["重新開始需要等待，並非立即恢復舊秩序。","Renewal includes waiting, not instant restoration."]],"caution":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."],"question":["哪一節最能支持「重新開始需要等待，並非立即恢復舊秩序。」的觀察？","Which verse best supports the observation “Renewal includes waiting, not instant restoration.”?"]},{"n":4,"refs":"4","title":["沒有認識神","No knowledge of God"],"summary":["祭司與百姓一同違約，流血、偷竊與淫亂污染土地。","Priests and people alike fail; bloodshed, theft, and infidelity wound the land."],"deep":[["「認識神」以公共倫理表現。","Knowing God is visible in public ethics."],["「認識神」以公共倫理表現。","Knowing God is visible in public ethics."]],"caution":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."],"question":["哪一節最能支持「「認識神」以公共倫理表現。」的觀察？","Which verse best supports the observation “Knowing God is visible in public ethics.”?"]},{"n":5,"refs":"5","title":["領袖與虛假的求尋","Leaders and false seeking"],"summary":["祭司與王室如網羅，宗教行動不能掩飾驕傲與暴力。","Priests and rulers become snares, and ritual cannot hide pride or violence."],"deep":[["有求問動作不等於願意回轉。","Seeking rites do not equal repentance."],["「認識神」以公共倫理表現。","Knowing God is visible in public ethics."]],"caution":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."],"question":["哪一節最能支持「有求問動作不等於願意回轉。」的觀察？","Which verse best supports the observation “Seeking rites do not equal repentance.”?"]},{"n":6,"refs":"6","title":["慈愛勝於祭物","Love over sacrifice"],"summary":["短暫悔意如早晨雲霧；神要的是慈愛與認識，不是只有祭物。","Fleeting loyalty is morning mist; God desires covenant love and knowledge over ritual alone."],"deep":[["重點不是廢除禮儀，而是拒絕空洞禮儀。","The critique targets empty ritual, not worship itself."],["重點不是廢除禮儀，而是拒絕空洞禮儀。","The critique targets empty ritual, not worship itself."]],"caution":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."],"question":["哪一節最能支持「重點不是廢除禮儀，而是拒絕空洞禮儀。」的觀察？","Which verse best supports the observation “The critique targets empty ritual, not worship itself.”?"]},{"n":7,"refs":"7","title":["熱鍋與政治搖擺","Hot oven and political wavering"],"summary":["內部陰謀、醉酒和倚靠埃及亞述，使以法蓮像未翻的餅。","Plots, drunkenness, and unstable alliances make Ephraim like an unturned cake."],"deep":[["一連串比喻描繪失去判斷力。","The metaphors portray lost discernment."],["一連串比喻描繪失去判斷力。","The metaphors portray lost discernment."]],"caution":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."],"question":["哪一節最能支持「一連串比喻描繪失去判斷力。」的觀察？","Which verse best supports the observation “The metaphors portray lost discernment.”?"]},{"n":8,"refs":"8","title":["收割所撒的風","Reaping the wind"],"summary":["偶像、錯誤王權與依賴強國被控；撒風的必收暴風。","Idols, contested kingship, and reliance on powers lead from sown wind to whirlwind."],"deep":[["因果語言指向集體決策的後果。","Cause and effect concerns communal choices."],["一連串比喻描繪失去判斷力。","The metaphors portray lost discernment."]],"caution":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."],"question":["哪一節最能支持「因果語言指向集體決策的後果。」的觀察？","Which verse best supports the observation “Cause and effect concerns communal choices.”?"]},{"n":9,"refs":"9","title":["節期變成流亡","Festivals in exile"],"summary":["豐收節將變為流離，食物與生育意象承載失地悲痛。","Harvest celebration turns into exile, and food and birth imagery bear loss."],"deep":[["不要把生育審判直接加在不孕者身上。","Do not direct fertility judgment at infertile people."],["不要把生育審判直接加在不孕者身上。","Do not direct fertility judgment at infertile people."]],"caution":["婚姻與性暴力隱喻屬對古代群體的詩歌指控；不得用以責備受虐者或合理化控制。","Marriage and sexualized images address an ancient community; do not use them to blame survivors or justify control."],"question":["哪一節最能支持「不要把生育審判直
