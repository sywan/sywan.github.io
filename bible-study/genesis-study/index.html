rts, and dreams intensify rivalry"],["兄弟處置約瑟不因其言行稚嫩而被合理化","Joseph’s immaturity cannot excuse his brothers’ abuse"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["家庭偏愛如何成為暴力的土壤？","How can favoritism nourish violence?"]},{"n":38,"refs":"38","title":["猶大與他瑪","Judah and Tamar"],"summary":["猶大未履行對他瑪的責任，她用冒險方式求取權利；猶大最後承認自己的不義。","Judah fails his duty to Tamar; she takes a risky path to secure her claim, and Judah admits his wrongdoing."],"deep":[["夾在約瑟故事中的本章使猶大的性格發展可見","Inserted into Joseph’s story, this chapter develops Judah’s character"],["他瑪的行動要放在寡婦脆弱處境中閱讀","Tamar acts within the vulnerability of widowhood"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["猶大的「她比我有義」改變了甚麼？","What changes when Judah admits Tamar was more righteous?"]},{"n":39,"refs":"39","title":["約瑟在波提乏家","Joseph in Potiphar’s house"],"summary":["約瑟在埃及得信任，拒絕主母的要求，卻因誣告下監；神的同在未使他免於冤屈。","Joseph gains trust in Egypt, rejects an illicit demand, and is imprisoned on false accusation; divine presence does not prevent injustice."],"deep":[["「耶和華與約瑟同在」與苦難同時被敘述","Divine presence is narrated alongside suffering"],["權力不對等使拒絕付出沉重代價","Power imbalance makes refusal costly"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["忠誠為何不保證即時的公平結果？","Why does integrity not ensure immediate fairness?"]},{"n":40,"refs":"40","title":["監中兩個夢","Two dreams in prison"],"summary":["約瑟替酒政與膳長解夢，結果應驗；酒政重得職位卻忘記約瑟。","Joseph interprets the cupbearer’s and baker’s dreams, which come true; restored to office, the cupbearer forgets him."],"deep":[["解夢被描述為出於神而非約瑟自有能力","Joseph credits interpretation to God rather than himself"],["「忘記」延長被囚者的等待","The cupbearer’s forgetting prolongs imprisonment"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["在等待中，經文如何描寫人的盼望？","How does the narrative portray hope during delay?"]},{"n":41,"refs":"41","title":["法老之夢與糧食治理","Pharaoh’s dreams and food policy"],"summary":["約瑟解釋七年豐收與七年饑荒，並提出儲糧政策，被立為埃及高官。","Joseph interprets seven years of abundance and famine, proposes storage, and becomes an Egyptian official."],"deep":[["夢的重複加強訊息確定性","Dream repetition underscores urgency"],["解釋與治理連在一起，洞見要落為公共準備","Interpretation leads to public planning"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["洞見如何轉化成對群眾有益的準備？","How can insight become preparation that serves people?"]},{"n":42,"refs":"42","title":["兄弟初赴埃及","Brothers’ first journey to Egypt"],"summary":["饑荒迫使兄弟求糧；約瑟認出他們卻未表明身分，西緬留下作保。","Famine sends the brothers to Egypt; Joseph recognizes them but remains concealed, keeping Simeon as surety."],"deep":[["兄弟回想昔日對約瑟的罪，良心被喚起","The brothers remember their wrong, awakening conscience"],["約瑟的試探究竟是復仇還是辨識，應保留張力","Joseph’s tests retain tension between revenge and discernment"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["承認過錯與真正改變之間還差甚麼？","What lies between admitting wrong and real change?"]},{"n":43,"refs":"43","title":["便雅憫同行與宴席","Benjamin travels and the feast"],"summary":["雅各終於允便雅憫同行；兄弟回埃及受到款待，卻仍不知道掌權者是約瑟。","Jacob allows Benjamin to travel; the brothers receive hospitality in Egypt without knowing their host is Joseph."],"deep":[["猶大承擔帶回便雅憫的責任","Judah accepts responsibility for Benjamin"],["宴席中的座次和份量讓關係測試延續","Seating and portions continue the relational test"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["猶大的擔保是否顯示他已開始改變？","Does Judah’s pledge suggest a changed character?"]},{"n":44,"refs":"44","title":["銀杯試驗與猶大代求","The cup test and Judah’s plea"],"summary":["約瑟使銀杯出現在便雅憫袋中；猶大以願作奴僕代替弟弟的話，保護父親與兄弟。","Joseph’s cup is found in Benjamin’s sack; Judah offers himself in place of his brother, protecting both Benjamin and their father."],"deep":[["試驗重現放棄一個受偏愛弟弟的可能","The test recreates the choice to abandon a favored brother"],["猶大的長篇發言與 37–38 章形成強烈對照","Judah’s speech contrasts sharply with chapters 37–38"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["本章如何讓「悔改」成為可觀察的行動？","How does repentance become visible action here?"]},{"n":45,"refs":"45","title":["約瑟表明身分","Joseph reveals himself"],"summary":["約瑟向兄弟顯明身分，哭泣並邀全家遷埃及；他把上帝的保存生命放進往事的理解中。","Joseph reveals himself, weeps, and invites the family to Egypt, interpreting his past through God’s preservation of life."],"deep":[["「神差我」不能用來否認兄弟當年的罪","Joseph’s providence language does not erase the brothers’ wrongdoing"],["和解包括供應、安全與重新相見","Reconciliation includes provision, safety, and reunion"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["天意的語言如何避免變成傷害的藉口？","How can providence language avoid excusing harm?"]},{"n":46,"refs":"46","title":["雅各下埃及","Jacob goes to Egypt"],"summary":["神在別是巴應許與雅各同去埃及；家譜與重逢使家族遷徙成為新階段。","God promises to accompany Jacob to Egypt; genealogy and reunion mark a new phase for the family."],"deep":[["離開應許之地不等於神同在終止","Leaving the promised land does not end divine presence"],["家譜保留家族各支，預備出埃及的群體身分","The genealogy preserves the lines that become Israel’s community"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["神的應許如何陪伴離開熟悉土地的人？","How can promise accompany people leaving familiar land?"]},{"n":47,"refs":"47","title":["歌珊安置與饑荒政策","Goshen settlement and famine policy"],"summary":["雅各家安置歌珊；約瑟治理饑荒，埃及人以財物、土地與勞役換糧。","Jacob’s family settles in Goshen; Joseph manages famine as Egyptians exchange wealth, land, and labor for food."],"deep":[["雅各祝福法老，顯出寄居者仍可帶來祝福","Jacob blesses Pharaoh, so a migrant can bless a ruler"],["政策保存生命，也集中權力與土地，值得倫理討論","Policy saves lives while concentrating land and power"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["救災政策應如何兼顧生存與公平？","How should famine policy balance survival and fairness?"]},{"n":48,"refs":"48","title":["以法蓮與瑪拿西蒙福","Ephraim and Manasseh blessed"],"summary":["雅各收納約瑟兩子，交叉雙手祝福較年幼的以法蓮；再次出現長幼次序的翻轉。","Jacob adopts Joseph’s sons and crosses his hands to bless younger Ephraim, repeating a reversal of expected order."],"deep":[["收納兩子使約瑟在支派傳承中有雙重位置","Adoption gives Joseph a doubled tribal place"],["雅各的交叉祝福回響家族早期故事但不等同欺騙","The crossed hands echo earlier reversals without repeating deception"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["翻轉傳統次序一定是不公嗎？","Is overturning expected order always unjust?"]},{"n":49,"refs":"49","title":["雅各臨終對眾子說話","Jacob’s final words to his sons"],"summary":["雅各對各子說預言式評語，既稱許也揭露暴力與失責；十二支派的未來因此帶著複雜記憶。","Jacob’s final words assess each son, praising some and naming violence and failure; the tribes inherit a complex memory."],"deep":[["對流便、西緬、利未的評語保留家族過錯","Comments on Reuben, Simeon, and Levi preserve wrongdoing"],["猶大與約瑟的段落帶出王權和繁盛盼望","Judah and Joseph evoke future leadership and fruitfulness"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["家族祝福為何也需要誠實記念傷害？","Why must family blessing honestly remember harm?"]},{"n":50,"refs":"50","title":["埋葬、饒恕與未竟應許","Burial, forgiveness, and unfinished promise"],"summary":["雅各葬於迦南，兄弟擔心報復；約瑟拒絕自居神位，以保存生命解釋自己的選擇，臨終仍指向未來歸回。","Jacob is buried in Canaan; the brothers fear revenge. Joseph refuses God’s place, chooses life-preserving care, and dies looking toward a future return."],"deep":[["50:20 同時承認人的惡意與神的良善，不抹去責任","Genesis 50:20 names human evil and divine good without erasing responsibility"],["棺木留在埃及使創世記以等待出埃及結束","Joseph’s coffin in Egypt leaves the book awaiting exodus"]],"caution":["約瑟故事談神的保守，也保留人造成的傷害；不可用天意語言逼受害者立即饒恕。","Joseph’s story includes providence and human harm; never pressure victims toward immediate forgiveness."],"question":["全書為何以埃及的棺木而非迦南的安居結束？","Why end with a coffin in Egypt rather than settled life in Canaan?"]}],"themesIntro":["以下主題橫跨全書；先讀完整經文，再比較各段的不同聲音。","These themes run through the book; read full passages before comparing their distinct voices."],"themes":[{"refs":"1–2; 9","title":["創造與生命","Creation and life"],"body":["世界的良善、安息與神形象構成全書的倫理背景。","Goodness, rest, and divine image form the book’s ethical backdrop."],"caution":["不可把古代創造敘事簡化為現代科學教科書。","Do not reduce ancient creation narrative to a modern science textbook."]},{"refs":"3–11","title":["罪與擴散","Sin and its spread"],"body":["不信任從園子傳到兄弟、城邑與列國。","Distrust spreads from garden to brothers, city, and nations."],"caution":["經文中的判斷要按各段敘事聲音辨識。","Distinguish each narrative’s evaluative voice."]},{"refs":"12; 15; 17; 22","title":["應許、約與等待","Promise, covenant, and waiting"],"body":["土地、後裔與萬族祝福在長久未見結果時仍被重申。","Land, descendants, and blessing recur through long periods without fulfillment."],"caution":["應許不可用來否認他人的土地與傷害問題。","Promise must not be used to dismiss others’ land and harm concerns."]},{"refs":"16; 21; 29–30; 38","title":["家庭中的權力","Power within households"],"body":["婦女、奴婢與幼子承受家族策略的壓力，也有自己的故事。","Women, enslaved people, and younger sons bear family strategies while retaining their own stories."],"caution":["不把受傷者只當作主角成長的道具。","Do not turn harmed people into props for a protagonist’s growth."]},{"refs":"27–33; 37–50","title":["衝突、轉變與和解","Conflict, change, and reconciliation"],"body":["雅各與以掃、約瑟與兄弟的相遇展示不同形式的責任與修復。","The encounters of Jacob and Esau and of Joseph and brothers show varied forms of responsibility and repair."],"caution":["和解不等於要求立即恢復親密。","Reconciliation need not demand instant closeness."]}],"pastoral":{"title":["教師帶領提醒","Teaching care"],"body":["不要把古代敘事中的暴力、奴役或排斥直接當成今日的規範；讓學員辨認文本描述、神學評價與當代應用的距離。","Do not treat ancient violence, enslavement, or exclusion in narratives as direct present-day norms. Help learners distinguish description, theological evaluation, and application."]},"lessonsIntro":["八課可按班級時數拆分；每課先讀指定經文，再用問題引導觀察、討論與應用。","These eight lessons can be divided further; read the assigned text before observation, discussion, and application."],"lessons":[{"refs":"1–2","title":["第 1 課｜創造、形象與安息","Lesson 1 | Creation, image, and rest"],"aim":["看見世界良善、人的使命與安息節奏。","Trace creation’s goodness, human vocation, and rest."],"flow":[["分組讀 1 章，列出重複句與順序。","Read Genesis 1 in groups and mark refrains. "],["比較 1:26–28 與 2:15 的治理和看守。","Compare rule and tending in 1:26–28 and 2:15. "],["討論 2:1–3 的安息如何回應工作。","Discuss how rest in 2:1–3 frames work."]],"question":["神形象如何影響我們對人的尊嚴的理解？","How does the divine image shape human dignity?"],"practice":["避免把不同創造敘述硬拼成現代時間表。","Do not force the creation accounts into a modern timetable."]},{"refs":"3–11","title":["第 2 課｜從園子到巴別","Lesson 2 | From garden to Babel"],"aim":["追蹤破裂如何擴展，並留意神保存生命的行動。","Trace expanding fracture and divine preservation."],"flow":[["為 3、4、6–9、11 章畫一條故事線。","Map chapters 3, 4, 6–9, and 11. "],["比較各段中的懷疑、暴力與求名。","Compare distrust, violence, and self-made names. "],["指出每段中限制暴力或保留盼望的細節。","Find details that restrain violence or keep hope alive."]],"question":["人類如何在不同場景重複同一類失序？","How does similar disorder recur in new settings?"],"practice":["洪水與所多瑪等暴力場景要尊重學員感受。","Handle flood and other violent scenes with care."]},{"refs":"12–18","title":["第 3 課｜蒙召與長久等待","Lesson 3 | Call and long waiting"],"aim":["理解亞伯拉罕之約如何指向萬族。","Understand how Abraham’s promise reaches all families."],"flow":[["讀 12:1–3，圈出土地、後裔與萬族。","Read 12:1–3 and mark land, descendants, and all families. "],["對照 15、17 章應許如何在疑惑中重申。","Compare renewed promises in chapters 15 and 17. "],["讀 16 章，討論家庭策略對夏甲的影響。","Read chapter 16 with attention to Hagar."]],"question":["應許的等待如何影響人對弱者的責任？","How does waiting on promise affect care for the vulnerable?"],"practice":["不要把夏甲的苦難當作旁枝。","Do not treat Hagar’s suffering as incidental."]},{"refs":"19–25","title":["第 4 課｜危機、供應與承接","Lesson 4 | Crisis, provision, and succession"],"aim":["比較審判、保護、以撒出生與下一代安排。","Compare judgment, protection, Isaac’s birth, and succession."],"flow":[["讀 19 章，分辨暴力與審判。","Read chapter 19 and distinguish violence from judgment. "],["讀 21–22 章，討論喜笑、放逐與試驗的張力。","Discuss laughter, expulsion, and testing in chapters 21–22. "],["讀 23–24 章，觀察土地與婚姻如何具體化應許。","Trace land and marriage in chapters 23–24."]],"question":["當應許實現時，誰可能被遺忘？","Who can be forgotten when a promise is fulfilled?"],"practice":["22 章不可用來合理化傷害兒童。","Chapter 22 cannot justify harm to children."]},{"refs":"25–33","title":["第 5 課｜兩兄弟與雅各轉變","Lesson 5 | Brothers and Jacob’s change"],"aim":["追蹤長子名分、欺騙、逃亡、摔跤與和解。","Trace birthright, deception, flight, wrestling, and reunion."],"flow":[["整理 25 與 27 章兩兄弟的選擇。","Compare the brothers’ choices in chapters 25 and 27. "],["對照 28 與 32 章兩次夜間相遇。","Contrast night encounters in chapters 28 and 32. "],["讀 33 章，辨認接納與界限。","Read chapter 33 for welcome and boundaries."]],"question":["雅各的改變如何被敘事呈現？","How does the narrative show Jacob changing?"],"practice":["不要把欺騙描寫為蒙福的必要手段。","Do not praise deception as a necessary path to blessing."]},{"refs":"34–38","title":["第 6 課｜家族傷害與權力","Lesson 6 | Household harm and power"],"aim":["正視底拿、他瑪與約瑟的故事中權力不對等。","Attend to power imbalance in the stories of Dinah, Tamar, and Joseph."],"flow":[["讀 34 章，分辨傷害與報復。","Read chapter 34, distinguishing harm and retaliation. "],["讀 37 章，辨認偏愛與出賣。","Read chapter 37 for favoritism and betrayal. "],["讀 38 章，追蹤猶大承認責任的轉折。","Read chapter 38 for Judah’s admission."]],"question":["聖經敘事如何記下受傷者未被聽見的聲音？","How does a narrative signal voices we cannot hear?"],"practice":["讓學員可不分享私人創傷。","Do not require personal trauma disclosure."]},{"refs":"39–45","title":["第 7 課｜約瑟、饑荒與兄弟","Lesson 7 | Joseph, famine, and brothers"],"aim":["比較神同在、公共治理與可見的悔改。","Compare divine presence, public policy, and visible repentance."],"flow":[["讀 39–41 章，記下冤屈與升遷。","Read chapters 39–41 for injustice and promotion. "],["讀 42–44 章，追蹤兄弟如何面對便雅憫。","Track the brothers’ treatment of Benjamin in chapters 42–44. "],["讀 45 章，比較天意語言與人類責任。","Read chapter 45 for providence and responsibility."]],"question":["猶大的行動如何顯示改變？","How do Judah’s actions show change?"],"practice":["不要用 45 章迫使受傷者饒恕。","Do not use chapter 45 to force forgiveness."]},{"refs":"46–50","title":["第 8 課｜在埃及等待未來","Lesson 8 | Awaiting the future in Egypt"],"aim":["把祝福、遷徙、死亡與出埃及的伏筆合起來看。","Connect blessing, migration, death, and the coming exodus."],"flow":[["讀 46 章，畫出家族下埃及的路。","Map the family’s journey in chapter 46. "],["討論 47 章救荒政策的益處與代價。","Discuss gains and costs of famine policy in chapter 47. "],["讀 49–50 章，比較家族記憶與約瑟臨終盼望。","Read chapters 49–50 for family memory and future hope."]],"question":["為何創世記在未完成的應許中結束？","Why does Genesis end before the promise is complete?"],"practice":["區分敘事的盼望與今日政治主張。","Distinguish narrative hope from present political claims."]}],"questionsIntro":["請先讓學員指出經文根據，再討論詮釋與應用；困難經文可以保留開放問題。","Ask learners for textual evidence before interpretation and application; difficult passages may leave open questions."],"extraQuestions":[["創世記 1–11 章如何為亞伯拉罕的呼召提出問題？","How do chapters 1–11 set up Abraham’s call?"],["女性與弱勢者的故事如何改變我們對族長敘事的閱讀？","How do women and vulnerable people reshape our reading of the ancestors?"],["何處看見神的保守，何處仍必須承認人的責任？","Where is divine care visible, and where must human responsibility remain?"]],"sourceNote":["本站提供原創逐章摘要與教學建議，不轉載任何譯本的完整經文。中文經文連結預設新標點和合本（神版），英文預設 NASB 2020。","Original chapter summaries and teaching notes; no complete Bible translation is reproduced. Chinese Scripture links default to CUNP (Shen edition), English to NASB 2020."],"sources":[{"title":["BibleProject｜創世記導讀","BibleProject | Genesis guide"],"url":"https://bibleproject.com/guides/book-of-genesis/"},{"title":["耶魯公開課｜舊約導論","Open Yale Courses | Introduction to the Old Testament"],"url":"https://oyc.yale.edu/religious-studies/rlst-145"}],"footer":["創世記研讀 · 原創逐章摘要與成人主日學教師教案","Genesis study · original chapter notes and adult class plans"],"pdfFiles":[{"file":"舊約綜覽-01_創世紀-1.pdf","title":["大衛鮑森舊約縱覽｜創世記 1 · PDF ↗","David Pawson’s Old Testament Survey | Genesis 1 · PDF ↗"]},{"file":"舊約綜覽-02_創世紀-2-造物主和受造物.pdf","title":["大衛鮑森舊約縱覽｜創世記 2｜造物主和受造物 · PDF ↗","David Pawson’s Old Testament Survey | Genesis 2 | Creator and creation · PDF ↗"]},{"file":"舊約綜覽-03_創世紀-3.pdf","title":["大衛鮑森舊約縱覽｜創世記 3 · PDF ↗","David Pawson’s Old Testament Survey | Genesis 3 · PDF ↗"]},{"file":"舊約綜覽-04_創世紀-4-從伊甸園到巴別塔.pdf","title":["大衛鮑森舊約縱覽｜創世記 4｜從伊甸園到巴別塔 · PDF ↗","David Pawson’s Old Testament Survey | Genesis 4 | From Eden to Babel · PDF ↗"]},{"file":"舊約綜覽-05_創世紀-5-亞伯拉罕以撒和雅各.pdf","title":["大衛鮑森舊約縱覽｜創世記 5｜亞伯拉罕、以撒和雅各 · PDF ↗","David Pawson’s Old Testament Survey | Genesis 5 | Abraham, Isaac, and Jacob · PDF ↗"]},{"file":"舊約綜覽-06_創世紀-6-創世紀中的基督身影.pdf","title":["大衛鮑森舊約縱覽｜創世記 6｜創世記中的基督身影 · PDF ↗","David Pawson’s Old Testament Survey | Genesis 6 | Christological readings · PDF ↗"]}]};</script><script src="../assets/book-study.js?v=20261103-language" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
