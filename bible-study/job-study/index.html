const parts=[
['1–2',B('序幕：天上議會、兩波災難、朋友抵達','Prologue: heavenly council, two waves of loss, friends arrive'),B('讀者先知道約伯「完全正直」，也得知控告者的質疑；約伯本人卻不知道天上發生的事。','Readers hear that Job is blameless and see the accuser’s challenge; Job knows nothing about the heavenly scene.')],

['4–14',B('第一輪：三友逐一論辯','First cycle: three friends speak'),B('以利法、比勒達、瑣法相繼發言，約伯依次回答。','Eliphaz, Bildad and Zophar speak in turn; Job answers each.')],

const chapters=[
['序幕','Prologue','敬虔的約伯；天上會議；牲畜、僕人與十名兒女在接連噩耗中失去；約伯哀痛卻敬拜。','Righteous Job; heavenly council; successive losses of livestock, servants, and ten children; Job grieves yet worships.'],
['序幕','Prologue','控告者再挑戰；約伯全身長毒瘡；妻子痛苦發言；三友來到，靜坐七日七夜。','A second challenge; Job is afflicted with sores; his wife speaks from anguish; friends sit silently for seven days and nights.'],

['第一輪','Cycle 1','約伯向神直接傾訴：生命如勞役；我為何成了你的箭靶？','Job addresses God directly: life is hard service; why have you made me a target?'],
['第一輪','Cycle 1','比勒達強調神不會屈枉公義，甚至將兒女之死與罪連結。','Bildad insists God does not pervert justice, even linking the children’s deaths to sin.'],
['第一輪','Cycle 1','約伯承認神強大，卻問：渺小的人怎能與神辯論？渴望有仲裁者。','Job acknowledges God’s power but wonders how mortals can argue with him; longs for an arbiter.'],

['第一輪','Cycle 1','約伯反駁朋友自以為智慧，指出神的主權不可被簡單公式化。','Job rebukes the friends’ presumed wisdom and stresses that God’s sovereignty resists formulas.'],
['第一輪','Cycle 1','約伯指責朋友替神說不實的話，仍盼望在神面前陳明案件。','Job calls out the friends’ false advocacy for God and seeks a hearing.'],
['第一輪','Cycle 1','人如花短暫、如影消逝；約伯對死後盼望與人生苦短發出質問。','Human life fades like a flower; Job questions mortality and possible hope beyond death.'],
['第二輪','Cycle 2','以利法加劇指責，描繪惡人必終生受苦。','Eliphaz escalates his accusation, portraying the wicked as tormented.'],
['第二輪','Cycle 2','約伯稱朋友是「使人愁煩的安慰者」，呼求天上有人為他作證。','Job calls them miserable comforters and longs for a witness in heaven.'],
['第二輪','Cycle 2','約伯描述希望近乎破滅，認為朋友無法帶來智慧。','Job says his hope is nearly gone and his friends offer no wisdom.'],
['第二輪','Cycle 2','比勒達描繪惡人的道路漸暗、記念被除。','Bildad describes the wicked losing light and remembrance.'],
['第二輪','Cycle 2','約伯描述被神與人隔絕；在痛苦中宣告「我知道我的救贖主活著」（19:25），其具體所指有解經討論。','Job describes alienation and declares “my Redeemer lives” (19:25); the precise referent is debated.'],

['終辯','Final defense','約伯述說如今被嘲笑、失去尊榮，向神傾訴遭棄之感。','Job describes ridicule, humiliation, and feeling abandoned by God.'],
['終辯','Final defense','約伯用嚴肅的自我起誓列出倫理生活：眼目、誠實、公義、照顧弱勢、金錢、待客等。','Job takes a solemn oath of innocence regarding lust, truthfulness, justice, the vulnerable, wealth, and hospitality.'],
['以利戶','Elihu','年輕的以利戶因三友不能回答、約伯堅稱無辜而發怒，開始發言。','Young Elihu is angry that the friends cannot answer and Job maintains innocence.'],

['以利戶','Elihu','以利戶論苦難也可能是教育與拯救的途徑，描述雷雨與神的偉大。','Elihu suggests suffering may teach and rescue, moving toward storm imagery.'],
['以利戶','Elihu','以利戶繼續談大自然、雷電、雲雨，為旋風中的神言作鋪陳。','Elihu considers thunder, clouds, and weather, preparing for the whirlwind.'],
['神回答','God replies','耶和華從旋風中首次發言：大地根基、海、晨光、星辰與天象。','God speaks from the whirlwind: earth’s foundations, sea, dawn, stars, and skies.'],
['神回答','God replies','神連續問及山羊、野驢、野牛、鴕鳥、馬、鷹等受造物，世界不以人為唯一中心。','God questions Job about mountain goats, wild donkeys, oxen, ostriches, horses, and eagles.'],
['神回答','God replies','神第一輪發言結束，約伯承認自己卑微而不再爭辯；神第二輪發言展開，提及河馬（Behemoth）。','The first speech ends; Job briefly answers, then God begins a second speech and describes Behemoth.'],
['神回答','God replies','神詳細描繪利維坦（Leviathan）的威勢，凸顯人無法控制受造界的一切。','God describes Leviathan’s fearsome strength, underscoring limits of human control.'],
['結局','Epilogue','42:1–6 約伯承認自己的認識有限，從「風聞」進入「親眼看見」；42:7–17 神責備三友、約伯代禱、生命與家業獲恢復。','42:1–6 Job confesses limited understanding: from hearing to seeing; 42:7–17 God rebukes the three friends, Job intercedes, and his life and household are restored.']
];

[B('三友：第一輪','Three friends: first round'),'4–14',B('以利法→約伯；比勒達→約伯；瑣法→約伯','Eliphaz→Job; Bildad→Job; Zophar→Job'),B('經驗、傳統與強烈斥責都圍繞「苦難必有個人的罪」的假設。','Experience, tradition, and rebuke circle the assumption that suffering proves personal sin.')],
[B('三友：第二輪','Three friends: second round'),'15–21',B('以利法→約伯；比勒達→約伯；瑣法→約伯','Eliphaz→Job; Bildad→Job; Zophar→Job'),B('朋友刻畫惡人下場；約伯以惡人亨通的現實反問。','Friends describe doom for the wicked; Job challenges them with wicked prosperity.')],
[B('三友：第三輪','Three friends: third round'),'22–27',B('以利法→約伯；比勒達→約伯；瑣法缺席','Eliphaz→Job; Bildad→Job; no third Zophar speech'),B('對話不再對稱，激烈控告並未證明約伯犯有被指控的罪。','The cycle is incomplete, and harsh allegations do not establish Job’s guilt.')],
[B('以利戶四篇發言','Elihu’s four speeches'),'32–37',B('以利戶→約伯及旁觀者','Elihu→Job and listeners'),B('他批評雙方，提出苦難的教育作用；神在42:7明確責備三友，但未同樣點名以利戶，其評價有不同看法。','He criticizes both sides and suggests formative suffering. God explicitly rebukes the three in 42:7, not Elihu; interpreters differ on his role.')],
[B('神與約伯：第一回合','God and Job: first exchange'),'38:1–40:5',B('神從旋風中發問→約伯短答','God questions from the whirlwind→Job answers briefly'),B('神提問關乎宇宙秩序與野生動物，而非揭露第一、二章幕後的緣由。','God asks about cosmic order and wild creatures rather than explaining chapters 1–2.')],
[B('神與約伯：第二回合','God and Job: second exchange'),'40:6–42:6',B('神再次發言→約伯承認有限','God speaks again→Job acknowledges his limits'),B('Behemoth 與 Leviathan 的詮釋有多種可能；核心是不能把神的治理縮成可操控的人類公式。','Behemoth and Leviathan admit multiple interpretations; divine governance exceeds human control.')],
[B('神、三友與約伯','God, the friends, and Job'),'42:7–17',B('神責備三友→約伯代禱→結尾復原','God rebukes friends→Job intercedes→restoration'),B('神指出朋友論神不如約伯說得正確；結尾恩典不能抹去此前真實的死亡與哀痛。','God says the friends did not speak rightly as Job did; restoration does not erase earlier death and grief.')]
];
const themes=[
[B('苦難是否等於犯罪？','Does suffering prove sin?'),B('不能。序幕明言約伯完全正直；朋友把一般性的道德秩序變成對特定人的無證據定罪。','No. The prologue calls Job blameless; the friends turn moral patterns into unproven accusations of a particular person.'),'1:1,8; 4:7–8; 42:7'],
[B('為什麼敬畏神？','Why fear God?'),B('「約伯敬畏神，豈是無故呢？」將問題指向：敬拜是交易，還是超越報償的信靠？','“Does Job fear God for nothing?” asks whether worship is transactional or trusts beyond reward.'),'1:9–11; 2:4–5'],
[B('可以向神申訴嗎？','May believers lament?'),B('約伯有極尖銳的哀歌與控訴；經文既不粉飾痛苦，也不將每句情緒性的話等同正確教義。','Job speaks searing lament and protest; Scripture neither sanitizes pain nor endorses every emotional claim as doctrine.'),'3; 7; 13; 38:2; 42:7'],
[B('人能掌握神全部的智慧嗎？','Can humans grasp all divine wisdom?'),B('第28章的智慧之詩與38–41章的創造質問互相呼應，指向受造者認識的有限。','The wisdom poem (28) and creation questions (38–41) highlight creaturely limitations.'),'28:12–28; 38:1–41:34'],
[B('神為什麼不解釋？','Why no direct explanation?'),B('神確實回答約伯，但沒有告訴約伯天上議會的試驗；回應重點由「找出單一原因」轉向「認識掌管廣大受造界的主」。','God responds, but does not reveal the heavenly test to Job; the focus shifts from a single causal answer to the Creator’s vast governance.'),'38:1; 40:6; 42:1–6'],
[B('42:6 的「懊悔」怎麼理解？','How should 42:6 be translated?'),B('希伯來文用語可譯作「厭惡／撤回」與「懊悔／得安慰」，對象和語氣有不同解讀。應避免武斷聲稱約伯承認三友指控為真。','Hebrew wording admits different readings (“repent,” “retract,” “find comfort”); do not assume Job concedes the friends’ charges.'),'42:5–6'],
[B('結局是不是「好人終有好報」？','Is the ending a simple prosperity formula?'),B('不是。42章恢復與祝福是真實敘事，但不能倒過來把三友的報應神學變成全書正解；失去的兒女也不是可替換的物品。','No. Restoration is part of the story but does not validate the friends’ simplistic retribution scheme; lost children are not replaceable goods.'),'42:7–17'],
[B('以利戶究竟說對了嗎？','Was Elihu right?'),B('他比三友更強調苦難可能有教育性，仍有可能超出文本證據而解釋約伯。神對他的沉默不等於明確稱讚或定罪。','He emphasizes suffering’s instructive possibilities, yet may still over-explain Job’s case. God’s silence about him is neither explicit praise nor condemnation.'),'32–37; 42:7']
];
const verses=[['1:1',B('約伯的品格','Job’s character'),B('完全正直、敬畏神、遠離惡事','Blameless and upright; fears God and turns from evil')],['1:9',B('控告者的核心問題','The accuser’s central challenge'),B('敬畏神是否為了利益？','Is reverence for God merely for benefit?')],['1:20–22',B('第一波災難的回應','Response to first losses'),B('撕裂外袍、剃頭、伏地下拜；在哀痛中沒有以犯罪的話控告神','Job grieves, worships, and does not sin with his words')],['2:11–13',B('朋友初來的陪伴','The friends’ initial presence'),B('七日七夜與他同坐，不發一言','They sit silently with him seven days and nights')],['3:1–3',B('哀歌的開端','Opening lament'),B('約伯咒詛自己的生日','Job curses the day of his birth')],['9:32–35',B('渴望仲裁者','Longing for an arbiter'),B('無法直接與神對簿，盼有調停者','Job longs for one to mediate between him and God')],['13:15',B('信靠或爭辯','Trust or defense'),B('不同古抄與譯本有「仍要仰望」／「不再有盼望」的差別','Textual variants yield “hope in him” or “no hope”')],['19:25–27',B('救贖主的盼望','Hope in a redeemer'),B('「救贖主活著」的意義與時間性有不同詮釋','“My redeemer lives” has multiple debated interpretations')],['21:7',B('惡人為何亨通？','Why do the wicked prosper?'),B('直接挑戰簡化的善惡報應','A direct challenge to simple retribution')],['28:28',B('智慧的總結','The poem’s conclusion'),B('敬畏主、遠離惡是智慧','Fearing the Lord and turning from evil is wisdom')],['31:1',B('倫理生活的誓約','Oath of integrity'),B('與自己的眼睛立約，強調個人操守','Job makes a covenant with his eyes')],['38:4',B('神第一輪質問','First divine questioning'),B('神問大地立根基時約伯在哪裡','God asks where Job was when the earth was founded')],['40:4–5',B('約伯首次回應','Job’s first reply'),B('承認自己有限，止住爭辯','Job acknowledges limits and ceases speaking')],['42:5',B('全書的轉折','The turning point'),B('「我從前風聞有你，現在親眼看見你」','From hearing about God to seeing him')],['42:7–10',B('神責備三友與代禱','God rebukes the friends'),B('神命三友獻祭、請約伯代求，並使約伯的景況轉回','God directs the friends to seek Job’s prayer and restores him')]];
const refs=[['USCCB — Introduction to Job','https://bible.usccb.org/bible/job/0'],['BibleProject — Guide to Job','https://bibleproject.com/guides/book-of-job/'],['Bible.org — Poetic books outline','https://bible.org/seriespage/poetical-books']];

const lessons=[
{r:'1–2',title:B('苦難序幕：我們知道，約伯不知道','The prologue: what we know and Job does not'),aim:B('辨認敘事的知識差；理解敬虔非報酬交易。','Recognize dramatic irony and non-transactional faith.'),read:'1:1–22; 2:1–13',flow:[10,15,20,15,10],talk:B('開場先問：如果敬虔的人遭遇重大損失，這是否證明他犯罪？請暫時不要回答。作者先宣告約伯完全正直，接著轉到天上的場景。控告者的問題不是約伯有沒有敬拜，而是他為何敬拜：若祝福都撤去，敬畏是否仍然成立？第一波四位報信者接連到來，財產與十名兒女都失去。第二波是身體痛苦；朋友前七天的陪伴是一個值得肯定的細節。教師應清楚指出：讀者知道的幕後資訊，並不曾告訴約伯。','Ask whether loss proves wrongdoing, then resist answering prematurely. The narrator affirms Job’s integrity before introducing the accuser’s challenge: Is devotion merely transactional? Four messengers report catastrophic losses, including Job’s children; later comes bodily affliction. The friends’ seven days of silence matter. Job never receives the prologue’s inside information.'),questions:[[B('控告者真正質疑的是什麼？','What is the accuser challenging?'),B('不是約伯行為是否敬虔，而是其敬虔是否只為獲得好處（1:9–11）。','Not the outward piety but its motivation (1:9–11).')],[B('朋友最初做對了什麼？','What did the friends first do well?'),B('來、同哭、同坐、安靜陪伴（2:11–13）；後來的問題是過度解釋。','They came, wept, sat and remained silent (2:11–13); over-explanation comes later.')]],cross:'詩 34:18；雅 5:11；約 9:1–3',caution:B('不要把每個悲劇推定為神與撒但的一次同樣交易；序幕描述此事件，不授權診斷他人的苦難。','Do not treat every tragedy as the same heavenly wager; the prologue does not authorize diagnosing others.')},
{r:'3–14',title:B('哀歌與第一輪爭論','Lament and the first debate cycle'),aim:B('區分哀歌與不信；辨認三友各自的推理。','Differentiate lament from unbelief and map the friends’ logic.'),read:'3; 4:7–8; 8:3–7; 11:5–6; 13:15',flow:[10,15,20,15,10],talk:B('約伯在第三章沒有咒詛神，而是咒詛自己出生的日子。他的哀歌為真實的痛苦提供語言。以利法訴諸經驗與異象，比勒達訴諸傳統與神的公平，瑣法強調人理解有限，卻反而斷定約伯受的苦還不夠重。三人都抓住了一部分真理：神公義，罪可能有後果。但他們的錯在於把普遍原則套用在特定案例，且缺乏證據。約伯一面不明白，一面要求能與神申訴。','Job curses his birth, not God. His lament makes room for suffering. Eliphaz appeals to experience, Bildad to tradition, and Zophar to divine knowledge, while each leaps from a general moral pattern to a specific unsupported verdict. Job seeks a hearing before God without understanding his situation.'),questions:[[B('三友說的話全部錯嗎？','Are all the friends’ claims false?'),B('不是；他們將可能真實的一般性原則，錯誤變成對約伯的定罪。','No; they misapply partial truths as evidence-free accusations.')],[B('信徒能否向神哀求？','Can believers lament to God?'),B('能；參照詩篇哀歌與耶穌在十字架的呼喊。哀歌不等於一切指控都正確。','Yes; compare lament psalms and Jesus’ cry, while recognizing that not every accusation is correct.')]],cross:'詩 13；詩 22:1；太 27:46；羅 12:15',caution:B('13:15 的古抄與譯法有差異，不要僅用中文一句話建立整套神學。','Job 13:15 has textual/translation variants; avoid building a doctrine from one rendition.')},
{r:'15–21',title:B('第二輪：惡人真的都立刻受報嗎？','Second cycle: do the wicked always suffer now?'),aim:B('看見報應公式與現實觀察的衝突。','Test simplistic retribution against observed reality.'),read:'16–17; 19:23–27; 21',flow:[10,15,20,15,10],talk:B('第二輪辯論中，三友更強烈描繪惡人必然滅亡，卻沒有真正聽見約伯的敘述。約伯稱他們為使人愁煩的安慰者；第21章直接指出惡人也可能長壽、富足。第19章有盼望的語句，其中「救贖主」的翻譯及指涉仍需注意語境。從基督教整本聖經閱讀，可以作為盼望的呼應；但不應直接斷定約伯已完整理解新約基督論。','The friends intensify portraits of the wicked, but Job calls them miserable comforters and points to the prosperity of the wicked in chapter 21. Chapter 19 voices hope in a redeemer/vindicator; Christian canonical connections are possible, but avoid claiming Job articulated a fully developed New Testament Christology.'),questions:[[B('為何21章對三友構成挑戰？','Why does chapter 21 challenge the friends?'),B('因現實中確有作惡仍順利者，顯示即時善惡報應不是萬用判準。','The wicked can prosper, falsifying a universal rule of immediate retribution.')],[B('19:25 應如何教導？','How should 19:25 be taught?'),B('先說明原段落中約伯盼有申冤者，再介紹基督徒可能的預表式閱讀。','Begin with Job’s longing for vindication; then explain possible Christian typological readings.')]],cross:'詩 73；傳 8:14；羅 8:31–39',caution:B('「救贖主」不是免除希伯來文及原始語境討論的捷徑。','The word “redeemer” does not eliminate translation and context questions.')},
{r:'22–28',title:B('第三輪破裂與智慧之詩','Broken third cycle and the wisdom poem'),aim:B('辨認對話不對稱；理解智慧的邊界。','Recognize the broken cycle and wisdom’s limits.'),read:'22; 25–28',flow:[10,15,20,15,10],talk:B('第三輪以利法甚至列出無證據的罪行指控；比勒達在第25章只有短短六節，瑣法沒有清楚記載第三次講話。這種破裂值得帶領學員觀察：當既有理論不容許事實存在，對話就逐漸失去交流功能。第28章轉向智慧：人會探礦、挖掘寶藏，但終極智慧不是靠技術取得。結論指向敬畏主、遠離惡。第28章究竟由誰朗誦，研究上有不同意見。','Eliphaz escalates unsubstantiated accusations; Bildad speaks only six verses in chapter 25; Zophar has no clear third speech. The dialogue breaks down when a theory refuses contrary evidence. Chapter 28 asks where wisdom may be found: humans mine riches but cannot mine ultimate wisdom. Its speaker attribution is debated.'),questions:[[B('對話破裂帶來何種牧養警訊？','What pastoral warning emerges?'),B('當我們執意維護理論，就容易停止傾聽人的經驗。','Protecting a theory can silence listening.')],[B('28:28 的智慧觀是什麼？','What is wisdom in 28:28?'),B('敬畏主、遠離惡；不是宣稱可以解開所有苦難的原因。','Fear the Lord and turn from evil, not solve every cause of suffering.')]],cross:'箴 1:7；申 29:29；雅 3:13–18',caution:B('不要武斷指稱第28章必定由約伯或某特定旁白說出。','Avoid stating an undisputed speaker for chapter 28.')},
{r:'29–31',title:B('約伯最後的申訴：真實正直與有限認識','Job’s final defense: integrity and limits'),aim:B('區分正當的清白申述與要求神接受人法庭框架。','Distinguish credible integrity from demanding God submit to human litigation.'),read:'29; 30; 31',flow:[10,15,20,15,10],talk:B('約伯先回憶過往的尊嚴與照顧弱勢的日子（29章），再描述今日的羞辱（30章），最後列舉自己的倫理實踐與起誓申述（31章）。這裡值得特別讀31章如何談眼目、財富、公義、僕人、寡婦與寄居者：正直不只是宗教儀式，也與社會倫理相關。然而，即使人確實無辜，也不代表可以掌握神治理全世界的全貌。','Job recalls honor and social responsibility (29), describes disgrace (30), and swears an oath of innocence spanning personal, economic, and social ethics (31). Genuine innocence does not grant exhaustive knowledge of God’s governance.'),questions:[[B('31章的正直有哪些面向？','What dimensions of integrity appear in chapter 31?'),B('性倫理、財富、受雇者及弱勢者之公義、拒絕偶像等。','Sexual ethics, wealth, fairness to workers and the vulnerable, and rejecting idolatry.')],[B('為何真實清白仍非全知？','Why is integrity not omniscience?'),B('道德清白與理解全宇宙的治理是不同問題。','Moral integrity and exhaustive knowledge are different matters.')]],cross:'彌 6:8；雅 1:27；伯 1:1',caution:B('勿因約伯後來謙卑，就倒推朋友對他犯罪的指控是正確的。','Do not retroactively vindicate the friends’ accusations.')},
{r:'32–37',title:B('以利戶：苦難可能有教導作用嗎？','Elihu: can suffering teach?'),aim:B('公平評估以利戶的不同觀點與界限。','Evaluate Elihu’s contribution and limits fairly.'),read:'32:1–22; 33; 36–37',flow:[10,15,20,15,10],talk:B('以利戶較年輕，憤怒於約伯自以為義，也不滿三友無法回答卻仍然定罪。他提出苦難或可作為警告與教育的可能性，並強調神的偉大與公義。他的發言在文學上引向旋風中的神，然而神在42章沒有像責備三友那樣直接對以利戶下判語。教師應呈現不同學者的評價，而非宣稱以利戶一定全部正確或完全錯誤。','Elihu, younger, is angry with both Job and the failed friends. He proposes disciplinary or instructive dimensions of suffering and stresses divine greatness, leading literarily toward the storm. God offers no explicit verdict on Elihu in chapter 42, so assessments differ.'),questions:[[B('以利戶與三友有什麼不同？','How does Elihu differ?'),B('較強調苦難的警戒或塑造面向，而非僅將其等同過去罪的刑罰。','He stresses warning or formation rather than only punishment for past sin.')],[B('以利戶的限制在哪裡？','What is Elihu’s limit?'),B('他仍沒有得知1–2章幕後的真正敘事資訊。','He too lacks the prologue’s heavenly information.')]],cross:'來 12:5–11；箴 3:11–12',caution:B('「苦難可能教導」不等於「每一個人的苦難都由某一個錯誤導致」。','“Suffering may teach” does not mean every sufferer caused their affliction.')},
{r:'38–41',title:B('旋風中的回答：創造與人的有限','God’s answer from the whirlwind'),aim:B('掌握神兩輪發言並辨識神回答了什麼、沒回答什麼。','Trace both divine speeches and the distinction between response and explanation.'),read:'38:1–40:5; 40:6–41:34',flow:[10,15,20,15,10],talk:B('這是全書神學高潮。神第一輪從創造大地、海的邊界、晨光、天象、野獸的生活發問（38–39），並在40:1–5讓約伯回應。第二輪聚焦公義權能，以及河馬與鱷魚／利維坦的可畏形象（40:6–41:34），解釋這些動物時需留意翻譯和象徵層次。神確實兩次回答約伯；但神沒有告訴他天上議會的事情，也沒有把災難逐件解釋。回答不是逃避，而是將人從狹窄的訴訟框架帶向廣闊的受造世界。','This is the theological climax. God’s first speech surveys creation, sea, light, weather, astronomy, and animals (38–39), followed by Job’s reply (40:1–5). The second addresses power, justice, Behemoth and Leviathan (40:6–41:34). Translators and interpreters debate the creatures’ identities and imagery. God answers twice, but does not disclose the heavenly council or itemize causes.'),questions:[[B('神是否完全沒有回答？','Did God fail to answer at all?'),B('不是：38:1與40:6明說神發言兩次；祂未給約伯事件原因的說明。','No: 38:1 and 40:6 mark two responses, not a causal report.')],[B('創造世界的質問為何重要？','Why do creation questions matter?'),B('揭示治理世界的複雜性、非以人為中心，以及人知識的界限。','They reveal complex, non-anthropocentric providence and limited human knowledge.')]],cross:'詩 104；賽 40:12–31；羅 11:33–36',caution:B('不可用「神很偉大」一句話否定受苦者的哀傷與提問。','Do not use “God is great” to silence grief or questions.')},
{r:'42',title:B('親眼看見：謙卑、代禱與恢復','Seeing God: humility, intercession, restoration'),aim:B('理解42:5–7及結尾祝福，避免落入成功神學。','Interpret Job 42:5–7 and restoration without prosperity theology.'),read:'42:1–17',flow:[10,15,20,15,10],talk:B('約伯承認神能作萬事，自己過去談論超出理解的事，說出「從前風聞有你，現在親眼看見你」（42:5）。42:6的動詞與受詞解讀有不同譯法，要審慎講解。神在42:7明確責備以利法與另兩位朋友沒有像約伯那樣說得對，要求他們獻祭並由約伯代求。結尾記錄家庭與財產的恢復，但原先死去的兒女不是可互換的物品。這不是保證所有受苦信徒今世都會物質翻倍。全書終點是與神相遇、認識有限，以及更新與人的關係。','Job confesses divine power and limited understanding: “now my eye sees you” (42:5). Verse 6 is translation-sensitive. In 42:7 God rebukes the three friends and appoints Job to intercede. Material and familial restoration closes the narrative, but those who died are not interchangeable, and the ending promises no universal earthly doubling. The central transformation is an encounter with God.'),questions:[[B('42:7 對三友是什麼判斷？','What does 42:7 say about the friends?'),B('神明確批評三友關於祂的說話，不允許將他們的因果公式當成全書答案。','God rebukes the friends’ speech about him; their formula is not the book’s verdict.')],[B('「親眼看見」意味著什麼？','What does “seeing” convey?'),B('以神親自臨在與自我認識的更新，取代對苦難原因全知的期待。','A personal encounter and revised self-understanding, not exhaustive causal knowledge.')]],cross:'雅 5:11；彼前 5:10；林後 1:3–5',caution:B('不要宣稱失去的人可以用更多財產或新生命「補回」。','Never suggest persons lost can be replaced by assets or additional children.')}
];

if(tab==='overview')body=H('section',{},lead(t(B('一眼讀懂《約伯記》','The whole book at a glance')),t(B('先讀清楚敘事的轉折，再進入每個人的論證。','Follow the story’s turning points before evaluating each speaker.'))),H('div',{className:'grid'},card(t(B('全書篇幅','Length')),H('div',{className:'stat'},'42'),H('p',{},t(B('章，序幕與結局主要用敘事文；核心大量使用希伯來詩歌。','chapters: narrative frame around extensive Hebrew poetry.')))),card(t(B('核心張力','Central tension')),H('p',{className:'quote'},t(B('義人為何受苦？','Why do the righteous suffer?'))),H('p',{},t(B('更深的問題：人能否在不理解原因時仍敬畏神？','A deeper question: can humans revere God without knowing why?')))),card(t(B('敘事終點','Destination')),H('p',{className:'quote'},t(B('「現在親眼看見你」','“Now my eyes have seen you.”'))),H('p',{},t(B('42:5；不是取得完整苦難解釋，而是面對神自己。','42:5; encounter, not a complete theory of suffering.'))))),H('div',{className:'ribbon'},H('strong',{},t(B('讀者比約伯知道得多','Readers know more than Job'))),H('p',{},t(B('只有讀者看到第1–2章的天上場景；朋友不知、約伯不知。從始至終，神也沒有向約伯揭露那段幕後對話。','Only readers witness the heavenly council of chapters 1–2. Job and the friends do not; God never discloses it to Job.')))),H('h3',{},t(B('全書九個段落 · 點擊前往逐章','Nine movements · click to explore chapters'))),H('div',{className:'timeline'},...parts.map((p,i)=>H('button',{key:i,className:'seg',onClick:()=>{setFilter('all');nav('chapters')}},H('span',{},p[0]),t(p[1])))),H('div',{className:'card'},...parts.map((p,i)=>H('div',{key:i,className:'part'},H('b',{},p[0]),H('div',{},H('strong',{},t(p[1])),H('div',{className:'muted'},t(p[2]))))),H('div',{className:'bigpoint'},H('h3',{},t(B('全書最重要的閱讀鑰匙','The essential interpretive key'))),H('p',{},t(B('約伯的朋友往往說出「部分真理」，卻錯誤地用它們診斷一位具體受苦者。神回答約伯的方式，不是讓他看見苦難的完整因果圖，而是讓他在真實相遇中看見自己的認知邊界。','The friends sometimes state partial truths but misuse them to diagnose a particular sufferer. God does not provide Job a full causal diagram; he encounters Job and exposes the limits of human perspective.'))))));
else if(tab==='story')body=H('section',{},lead(t(B('故事進程與角色視角','The story and its viewpoints')),t(B('刻意區分「發生了什麼」、「角色知道什麼」、「角色誤以為什麼」。','Distinguish what happened, what each character knows, and what they merely assume.'))),H('div',{className:'grid two'},card(t(B('① 第一幕：敬虔與試驗（1–2章）','① Integrity and testing (1–2)')),H('p',{},t(B('約伯居住烏斯地，有七個兒子、三個女兒，擁有大量牲畜與僕人，經常為兒女獻祭。天上議會中，控告者懷疑約伯的忠誠只是受福所換來的。神允許考驗但設有限制。','Job of Uz has seven sons, three daughters, many animals and servants. The accuser questions whether his reverence is purchased by blessing; the test has limits.')))),card(t(B('② 第一波損失（1:13–22）','② First wave of losses (1:13–22)')),H('p',{},t(B('示巴人掠走牛驢、天火燒毀羊群、迦勒底人擄走駱駝、狂風吹倒房屋，七子三女死去。四名報信者接連而至。約伯撕裂衣袍、剃頭、俯伏敬拜。','Raiders take oxen and donkeys; fire destroys sheep; other raiders seize camels; a wind collapses a house, killing seven sons and three daughters. Four messengers arrive in succession; Job grieves and worships.')))),card(t(B('③ 第二波損失（2章）','③ Second wave (chapter 2)')),H('p',{},t(B('約伯從腳掌到頭頂長毒瘡，以瓦片刮身；妻子痛問信仰是否還值得持守。三位朋友先與他同哭，再靜坐七日。最初的安靜陪伴，反而比後來的話語更有力量。','Painful sores cover Job’s body. He scrapes himself with pottery; his wife voices anguish. Three friends weep and sit seven silent days—arguably their best act of care.')))),card(t(B('④ 申訴與辯論（3–31章）','④ Protest and debate (3–31)')),H('p',{},t(B('約伯先咒詛生日，再和三友激烈辯論：他不自認無罪至完美，而是反駁自己必曾犯下足以解釋災禍的惡行。最後他要求神親自審理。','Job laments his birth, then debates his friends. He does not claim sinless perfection but rejects the alleged wrongdoing used to explain his disaster; he demands a hearing.')))),card(t(B('⑤ 年輕人發言（32–37章）','⑤ A younger voice (32–37)')),H('p',{},t(B('以利戶先說明自己因年輕而等待，接著發言。與「一切苦難都是犯罪報應」相比，他額外強調苦難也可能警醒與塑造人；但此解釋並不能確定約伯的個案。','Elihu waits because he is younger, then speaks. He adds suffering as warning and discipline, but this does not settle Job’s specific case.')))),card(t(B('⑥ 旋風與結局（38–42章）','⑥ Whirlwind and epilogue (38–42)')),H('p',{},t(B('神兩次發問，約伯兩次回答。神沒有交代天上試驗，卻在宇宙與生態萬物中展示治理的豐富和人的有限。之後神責備三友，接納約伯為三友代求，並使他重新得福。','God qu
