<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="馬太福音成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>馬太福音｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"MAT","category":["四福音","The Four Gospels"],"name":["馬太福音","Matthew"],"subtitle":["28 章從家譜與以馬內利開始，經五段教導與受難復活，走向萬民作門徒。","Twenty-eight chapters move from genealogy and Immanuel through major teaching discourses, death, resurrection, and a mission to all nations."],"overviewIntro":["先從全書結構掌握馬太福音，再逐章研讀人物、事件與神學判斷。","Survey Matthew as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["28 章；依照書卷原有次序逐章研讀。","28 chapters studied in canonical sequence."],"thesis":["耶穌是「與我們同在」的彌賽亞教師","Jesus is the Messiah and teacher who is “with us”"],"thesisDetail":["馬太將耶穌放在亞伯拉罕、大衛與以色列經卷的故事中；天國的公義在教導、醫治、憐憫與十字架上具體可見。","Matthew locates Jesus within Abraham, David, and Israel’s Scriptures; kingdom righteousness takes shape in teaching, healing, mercy, and the cross."],"keyQuestion":["馬太福音如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Matthew portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["馬太將耶穌放在亞伯拉罕、大衛與以色列經卷的故事中；天國的公義在教導、醫治、憐憫與十字架上具體可見。","Matthew locates Jesus within Abraham, David, and Israel’s Scriptures; kingdom righteousness takes shape in teaching, healing, mercy, and the cross."],"finalMovement":["最後的「我常與你們同在」呼應 1 章以馬內利；使命以持續學習和實踐耶穌教導為內容。","The closing promise of presence echoes Immanuel in chapter 1; mission includes learning and practicing Jesus’ teaching."],"readingKeys":[{"refs":"1–2","title":["家譜、出生與流亡","Genealogy, birth, and displacement"],"body":["耶穌的身份與亞伯拉罕、大衛、以馬內利相連，故事同時有外邦博士與難民家庭。","Jesus is linked to Abraham, David, and Immanuel amid Gentile visitors and a refugee family."]},{"refs":"5–7","title":["山上寶訓","Sermon on the Mount"],"body":["八福、律法、禱告、金錢與兩條道路描繪天國生活。","Beatitudes, Torah, prayer, money, and two ways describe kingdom life."]},{"refs":"11–13","title":["反對、安息與比喻","Opposition, rest, and parables"],"body":["約翰發問，安息日爭議升高，天國比喻同時揭示與隱藏。","John questions, Sabbath disputes intensify, and kingdom parables both reveal and conceal."]},{"refs":"26–28","title":["受難、復活與使命","Passion, resurrection, and mission"],"body":["最後晚餐、客西馬尼、審判與十字架後，婦女見空墳並受差。","The meal, Gethsemane, trials, and cross lead to women at the empty tomb and mission."]}],"mapIntro":["沿八個段落觀察馬太福音的敘事推進與轉折。","Trace the movement of Matthew through eight teaching units."],"movements":[{"refs":"1–2","title":["家譜、出生與流亡","Genealogy, birth, and displacement"],"body":["耶穌的身份與亞伯拉罕、大衛、以馬內利相連，故事同時有外邦博士與難民家庭。","Jesus is linked to Abraham, David, and Immanuel amid Gentile visitors and a refugee family."]},{"refs":"3–4","title":["預備、試探與呼召","Preparation, testing, and calling"],"body":["施洗約翰、受洗、曠野試探與門徒蒙召為公開事工定調。","John, baptism, wilderness testing, and first disciples prepare the public ministry."]},{"refs":"5–7","title":["山上寶訓","Sermon on the Mount"],"body":["八福、律法、禱告、金錢與兩條道路描繪天國生活。","Beatitudes, Torah, prayer, money, and two ways describe kingdom life."]},{"refs":"8–10","title":["醫治、憐憫與差派","Healings, mercy, and mission"],"body":["醫治與趕鬼顯明權柄；稅吏蒙召，十二使徒被差往以色列。","Healing and exorcism reveal authority; a tax collector is called and twelve are sent."]},{"refs":"11–13","title":["反對、安息與比喻","Opposition, rest, and parables"],"body":["約翰發問，安息日爭議升高，天國比喻同時揭示與隱藏。","John questions, Sabbath disputes intensify, and kingdom parables both reveal and conceal."]},{"refs":"14–18","title":["身份、群體與赦免","Identity, community, and forgiveness"],"body":["餵飽群眾、彼得認信與變像後，耶穌教導十字架道路和群體中的小者。","Feeding, Peter’s confession, and transfiguration lead to cross-shaped discipleship and care for little ones."]},{"refs":"19–25","title":["進城、衝突與等候","Entering Jerusalem and waiting"],"body":["婚姻、財富、僕人領導、進城、聖殿辯論和末世教導交錯。","Marriage, wealth, servant leadership, entry, temple debates, and future-oriented teaching unfold."]},{"refs":"26–28","title":["受難、復活與使命","Passion, resurrection, and mission"],"body":["最後晚餐、客西馬尼、審判與十字架後，婦女見空墳並受差。","The meal, Gethsemane, trials, and cross lead to women at the empty tomb and mission."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["馬太使用「應驗」與對猶太領袖的辯論，須先讀當時猶太語境，不把它變成基督徒反猶太的理由。","Read fulfillment and disputes within Jewish settings; do not turn them into Christian anti-Judaism."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["家譜與以馬內利","Genealogy and Immanuel"],"summary":["家譜連結亞伯拉罕與大衛，約瑟在夢中接受孩子，名字顯示神與人同在。","Genealogy connects Abraham and David; Joseph receives the child, whose names signal divine presence."],"deep":[["家譜中的意外人物預告更廣的群體。","Unexpected people in the genealogy anticipate a wider community."],["家譜中的女性與外邦人使身份敘述更複雜。","Women and Gentiles complicate a narrow reading of lineage."]],"caution":["希律屠殺孩童須正視真實政治暴力。","Herod’s killing of children is political violence, not decorative detail."],"question":["哪一節最能支持「家譜中的意外人物預告更廣的群體。」的觀察？","Which verse best supports the observation “Unexpected people in the genealogy anticipate a wider community.”?"]},{"n":2,"refs":"2","title":["博士、希律與逃亡","Magi, Herod, and flight"],"summary":["東方博士尋王，希律暴力威脅嬰孩；一家逃往埃及再返拿撒勒。","Magi seek the king while Herod threatens children; the family flees to Egypt and returns."],"deep":[["神學應驗語言與難民處境同時閱讀。","Read fulfillment language alongside refugee experience."],["家譜中的女性與外邦人使身份敘述更複雜。","Women and Gentiles complicate a narrow reading of lineage."]],"caution":["希律屠殺孩童須正視真實政治暴力。","Herod’s killing of children is political violence, not decorative detail."],"question":["哪一節最能支持「神學應驗語言與難民處境同時閱讀。」的觀察？","Which verse best supports the observation “Read fulfillment language alongside refugee experience.”?"]},{"n":3,"refs":"3","title":["悔改與受洗","Repentance and baptism"],"summary":["施洗約翰召人結悔改的果子，耶穌受洗時被稱為蒙愛之子。","John calls for repentant fruit, and Jesus is named beloved Son at baptism."],"deep":[["兒子身份在公開能力展現之前被宣告。","Sonship is declared before public display of power."],["天國臨近與悔改從起頭就相連。","The nearness of the kingdom is joined to repentance."]],"caution":["曠野試探不能化作對受苦者的簡單「更努力」勸告。","Do not reduce wilderness testing to “try harder” advice."],"question":["哪一節最能支持「兒子身份在公開能力展現之前被宣告。」的觀察？","Which verse best supports the observation “Sonship is declared before public display of power.”?"]},{"n":4,"refs":"4","title":["曠野試探與第一批門徒","Wilderness testing and disciples"],"summary":["耶穌拒絕用權力滿足自己或試探神，隨後宣告天國臨近並召門徒。","Jesus refuses self-serving power and testing God, then proclaims the kingdom and calls disciples."],"deep":[["三次試探重問兒子如何使用權柄。","Three tests ask how the Son uses authority."],["天國臨近與悔改從起頭就相連。","The nearness of the kingdom is joined to repentance."]],"caution":["曠野試探不能化作對受苦者的簡單「更努力」勸告。","Do not reduce wilderness testing to “try harder” advice."],"question":["哪一節最能支持「三次試探重問兒子如何使用權柄。」的觀察？","Which verse best supports the observation “Three tests ask how the Son uses authority.”?"]},{"n":5,"refs":"5","title":["八福與更深公義","Beatitudes and deeper righteousness"],"summary":["山上寶訓以有福、鹽光開篇，再談怒氣、和好、誠實與愛仇敵。","The sermon opens with blessings and salt/light, then probes anger, reconciliation, truth, and enemy-love."],"deep":[["天國公義從關係與內心進到公共行動。","Kingdom righteousness moves from relation and heart into action."],["「你們聽見…只是我告訴」深化而非抹除妥拉。","“You have heard… but I say” deepens rather than erases Torah."]],"caution":["不可把貧窮或受迫害浪漫化。","Do not romanticize poverty or persecution."],"question":["哪一節最能支持「天國公義從關係與內心進到公共行動。」的觀察？","Which verse best supports the observation “Kingdom righteousness moves from relation and heart into action.”?"]},{"n":6,"refs":"6","title":["暗中的施予與主禱文","Giving, prayer, and the Lord’s Prayer"],"summary":["施捨、禱告與禁食不為表演；主禱文把神國、日糧、赦免放在一起。","Giving, prayer, and fasting reject display; the Lord’s Prayer joins kingdom, bread, and forgiveness."],"deep":[["金錢與憂慮討論連於先求神的國。","Money and anxiety connect with seeking the kingdom first."],["「你們聽見…只是我告訴」深化而非抹除妥拉。","“You have heard… but I say” deepens rather than erases Torah."]],"caution":["不可把貧窮或受迫害浪漫化。","Do not romanticize poverty or persecution."],"question":["哪一節最能支持「金錢與憂慮討論連於先求神的國。」的觀察？","Which verse best supports the observation “Money and anxiety connect with seeking the kingdom first.”?"]},{"n":7,"refs":"7","title":["兩條道路與實踐","Two ways and doing"],"summary":["耶穌談論論斷、祈求、窄門與果子，最後以建房比喻要求聽而行。","Judgment, asking, the narrow way, and fruit lead to a house image calling for practice."],"deep":[["聽見與遵行的差距是結尾焦點。","The gap between hearing and doing closes the sermon."],["「你們聽見…只是我告訴」深化而非抹除妥拉。","“You have heard… but I say” deepens rather than erases Torah."]],"caution":["不可把貧窮或受迫害浪漫化。","Do not romanticize poverty or persecution."],"question":["哪一節最能支持「聽見與遵行的差距是結尾焦點。」的觀察？","Which verse best supports the observation “The gap between hearing and doing closes the sermon.”?"]},{"n":8,"refs":"8","title":["權柄使人得醫治","Authority that heals"],"summary":["痲瘋病人、百夫長僕人與彼得岳母得醫治；風浪平靜、鬼被逐。","A leper, a centurion’s servant, and Peter’s mother-in-law are healed; storm and demons yield."],"deep":[["百夫長的信心打開外邦人參與的問題。","The centurion’s faith raises Gentile inclusion."],["憐憫的行動與差派的教導互相詮釋。","Mercy in action and mission teaching interpret each other."]],"caution":["疾病敘事不可使病者被當作屬靈失敗者。","Illness narratives do not mark sick people as spiritual failures."],"question":["哪一節最能支持「百夫長的信心打開外邦人參與的問題。」的觀察？","Which verse best supports the observation “The centurion’s faith raises Gentile inclusion.”?"]},{"n":9,"refs":"9","title":["赦罪、飯桌與憐憫","Forgiveness, table, and mercy"],"summary":["癱子得赦與醫治，稅吏被召；耶穌與被排斥者同席，醫治多人。","A paralyzed man is forgiven and healed; a tax collector is called and excluded people share a table."],"deep":[["「我要的是憐憫」解釋耶穌的飯桌。","“I desire mercy” explains Jesus’ table."],["憐憫的行動與差派的教導互相詮釋。","Mercy in action and mission teaching interpret each other."]],"caution":["疾病敘事不可使病者被當作屬靈失敗者。","Illness narratives do not mark sick people as spiritual failures."],"question":["哪一節最能支持「「我要的是憐憫」解釋耶穌的飯桌。」的觀察？","Which verse best supports the observation ““I desire mercy” explains Jesus’ table.”?"]},{"n":10,"refs":"10","title":["十二使徒受差","Twelve sent"],"summary":["十二門徒得到醫治與宣告權柄，也被提醒面對拒絕、逼迫與恐懼。","The twelve receive authority to heal and announce, while facing rejection and fear."],"deep":[["暫向以色列的差派與末章萬民使命須按敘事次序讀。","Read Israel-focused mission beside the later mission to nations."],["憐憫的行動與差派的教導互相詮釋。","Mercy in action and mission teaching interpret each other."]],"caution":["疾病敘事不可使病者被當作屬靈失敗者。","Illness narratives do not mark sick people as spiritual failures."],"question":["哪一節最能支持「暫向以色列的差派與末章萬民使命須按敘事次序讀。」的觀察？","Which verse best supports the observation “Read Israel-focused mission beside the later mission to nations.”?"]},{"n":11,"refs":"11","title":["約翰的疑問與安息","John’s question and rest"],"summary":["被囚約翰問耶穌身份；耶穌指向醫治，責備不回應的城，邀負重者得安息。","Imprisoned John asks about Jesus; healing answers, unresponsive towns are warned, and the burdened are invited to rest."],"deep":[["疑問可以與忠誠共存。","Questioning and fidelity can coexist."],["芥菜種與麵酵讓小開始具有未來張力。","Mustard seed and leaven turn small starts toward future growth."]],"caution":["「硬心」指具體爭論，不宜泛指整個民族。","Hard-heartedness concerns particular disputes, not a whole people."],"question":["哪一節最能支持「疑問可以與忠誠共存。」的觀察？","Which verse best supports the observation “Questioning and fidelity can coexist.”?"]},{"n":12,"refs":"12","title":["安息日、僕人與家人","Sabbath, servant, and family"],"summary":["安息日醫治引發爭議；耶穌引用僕人詩，指出心與言語的果子。","Sabbath healing sparks dispute; servant imagery and speech reveal the heart."],"deep":[["「伸手救人」比規則爭勝更能解釋安息日。","Healing a person clarifies the Sabbath dispute."],["芥菜種與麵酵讓小開始具有未來張力。","Mustard seed and leaven turn small starts toward future growth."]],"caution":["「硬心」指具體爭論，不宜泛指整個民族。","Hard-heartedness concerns particular disputes, not a whole people."],"question":["哪一節最能支持「「伸手救人」比規則爭勝更能解釋安息日。」的觀察？","Which verse best supports the observation “Healing a person clarifies the Sabbath dispute.”?"]},{"n":13,"refs":"13","title":["天國比喻群","Parables of the kingdom"],"summary":["撒種、稗子、芥菜種、麵酵與珍珠等比喻探問聆聽與天國價值。","Sower, weeds, mustard seed, leaven, and pearl probe hearing and kingdom value."],"deep":[["比喻不是單一密碼表，而要按情境聽。","Parables are not one-to-one code charts."],["芥菜種與麵酵讓小開始具有未來張力。","Mustard seed and leaven turn small starts toward future growth."]],"caution":["「硬心」指具體爭論，不宜泛指整個民族。","Hard-heartedness concerns particular disputes, not a whole people."],"question":["哪一節最能支持「比喻不是單一密碼表，而要按情境聽。」的觀察？","Which verse best supports the observation “Parables are not one-to-one code charts.”?"]},{"n":14,"refs":"14","title":["餵飽與水上行走","Feeding and walking on water"],"summary":["約翰之死後，耶穌憐憫群眾並餵飽他們；門徒在風浪中驚懼。","After John’s death, Jesus feeds the crowd compassionately and meets frightened disciples on water."],"deep":[["憐憫發生在政治暴力的陰影中。","Compassion unfolds under the shadow of political violence."],["18 章把尋回迷羊與處理傷害放在同一群體脈絡。","Chapter 18 joins seeking the lost to addressing harm."]],"caution":["赦免不可取消受害者安全與問責。","Forgiveness does not cancel survivor safety or accountability."],"question":["哪一節最能支持「憐憫發生在政治暴力的陰影中。」的觀察？","Which verse best supports the observation “Compassion unfolds under the shadow of political violence.”?"]},{"n":15,"refs":"15","title":["口中的污穢與外邦婦人","Speech and a Canaanite woman"],"summary":["耶穌談口出之惡，迦南婦人堅持求女兒得醫治，另有餵飽群眾。","Jesus locates defilement in speech and action; a Canaanite woman persists for her daughter, and another crowd is fed."],"deep":[["婦人的回應推動讀者思考邊界。","The woman’s response pushes readers to examine boundaries."],["18 章把尋回迷羊與處理傷害放在同一群體脈絡。","Chapter 18 joins seeking the lost to addressing harm."]],"caution":["赦免不可取消受害者安全與問責。","Forgiveness does not cancel survivor safety or accountability."],"question":["哪一節最能支持「婦人的回應推動讀者思考邊界。」的觀察？","Which verse best supports the observation “The woman’s response pushes readers to examine boundaries.”?"]},{"n":16,"refs":"16","title":["認信與十字架","Confession and the cross"],"summary":["彼得認耶穌為基督，旋即拒絕受苦道路；耶穌呼召背十字架。","Peter confesses Jesus as Messiah but resists suffering; Jesus calls for cross-bearing."],"deep":[["正確稱號仍需由耶穌的道路重新定義。","A correct title needs definition by Jesus’ path."],["18 章把尋回迷羊與處理傷害放在同一群體脈絡。","Chapter 18 joins seeking the lost to addressing harm."]],"caution":["赦免不可取消受害者安全與問責。","Forgiveness does not cancel survivor safety or accountability."],"question":["哪一節最能支持「正確稱號仍需由耶穌的道路重新定義。」的觀察？","Which verse best supports the observation “A correct title needs definition by Jesus’ path.”?"]},{"n":17,"refs":"17","title":["變像與小信","Transfiguration and little faith"],"summary":["山上榮光與山下受苦孩子形成對照；耶穌再預告受難。","Mountain glory contrasts with a suffering child below; Jesus again predicts his death."],"deep":[["榮光不能使門徒忽略山下需求。","Glory must not hide need below the mountain."],["18 章把尋回迷羊與處理傷害放在同一群體脈絡。","Chapter 18 joins seeking the lost to addressing harm."]],"caution":["赦免不可取消受害者安全與問責。","Forgiveness does not cancel survivor safety or accountability."],"question":["哪一節最能支持「榮光不能使門徒忽略山下需求。」的觀察？","Which verse best supports the observation “Glory must not hide need below the mountain.”?"]},{"n":18,"refs":"18","title":["小者、迷羊與赦免","Little ones, lost sheep, forgiveness"],"summary":["耶穌以孩子和迷羊談群體尊嚴，再教導處理得罪與不饒恕僕人。","A child and lost sheep frame community care, conflict resolution, and an unforgiving servant."],"deep":[["饒恕與保護小者、真實處理傷害同在。","Forgiveness belongs with protecting little ones and naming harm."],["18 章把尋回迷羊與處理傷害放在同一群體脈絡。","Chapter 18 joins seeking the lost to addressing harm."]],"caution":["赦免不可取消受害者安全與問責。","Forgiveness does not cancel survivor safety or accountability."],"question":["哪一節最能支持「饒恕與保護小者、真實處理傷害同在。」的觀察？","Which verse best supports the observation “Forgiveness belongs with protecting little ones and naming harm.”?"]},{"n":19,"refs":"19","title":["婚姻、孩子與財富","Marriage, children, and wealth"],"summary":["耶穌回答休妻問題、祝福孩子，富人卻難放下財富跟隨。","Jesus addresses divorce, welcomes children, and challenges a wealthy seeker."],"deep":[["跟隨者不能把財富當生命保障。","Disciples cannot make wealth ultimate security."],["24–25 章的等候以警醒、忠誠與照顧最小者表達。","Waiting in chapters 24–25 involves vigilance, fidelity, and care for the least."]],"caution":["審判比喻不可變成預測日期的工具。","Judgment parables are not date-setting devices."],"question":["哪一節最能支持「跟隨者不能把財富當生命保障。」的觀察？","Which verse best supports the observation “Disciples cannot make wealth ultimate security.”?"]},{"n":20,"refs":"20","title":["後者在前與僕人領導","Last first and servant leadership"],"summary":["葡萄園工人比喻挑戰比較心，門徒爭高位時耶穌指出服事道路。","The vineyard workers challenge comparison, and ambition is answered with service."],"deep":[["同章恩典與領導權力相互照映。","Grace and leadership power mirror each other."],["24–25 章的等候以警醒、忠誠與照顧最小者表達。","Waiting in chapters 24–25 involves vigilance, fidelity, and care for the least."]],"caution":["審判比喻不可變成預測日期的工具。","Judgment parables are not date-setting devices."],"question":["哪一節最能支持「同章恩典與領導權力相互照映。」的觀察？","Which verse best supports the observation “Grace and leadership power mirror each other.”?"]},{"n":21,"refs":"21","title":["進城與聖殿爭辯","Entry and temple debates"],"summary":["耶穌騎驢進城，潔淨聖殿；無花果樹與兩子比喻質問果子。","Jesus enters on a donkey, challenges temple practice, and asks about fruit through fig tree and parables."],"deep":[["對聖殿的批判來自以色列內部的先知傳統。","Temple critique arises within Israel’s prophetic tradition."],["24–25 章的等候以警醒、忠誠與照顧最小者表達。","Waiting in chapters 24–25 involves vigilance, fidelity, and care for the least."]],"caution":["審判比喻不可變成預測日期的工具。","Judgment parables are not date-setting devices."],"question":["哪一節最能支持「對聖殿的批判來自以色列內部的先知傳統。」的觀察？","Which verse best supports the observation “Temple critique arises within Israel’s prophetic tradition.”?"]},{"n":22,"refs":"22","title":["筵席、稅與最大誡命","Banquet, tax, and greatest command"],"summary":["婚筵比喻後，耶穌面對納稅、復活、最大誡命與大衛之子問題。","A banquet parable leads into disputes over tax, resurrection, greatest command, and David’s son."],"deep":[["愛神愛鄰舍是爭論中的詮釋中心。","Love of God and neighbor centers the debates."],["24–25 章的等候以警醒、忠誠與照顧最小者表達。","Waiting in chapters 24–25 involves vigilance, fidelity, and care for the least."]],"caution":["審判比喻不可變成預測日期的工具。","Judgment parables are not date-setting devices."],"question":["哪一節最能支持「愛神愛鄰舍是爭論中的詮釋中心。」的觀察？","Which verse best supports the observation “Love of God and neighbor centers the debates.”?"]},{"n":23,"refs":"23","title":["領袖的沉重責備","Woes against leaders"],"summary":["耶穌責備假冒為善與加重人負擔的領袖，末尾為耶路撒冷哀哭。","Jesus rebukes leaders who burden others and ends in lament over Jerusalem."],"deep":[["責備針對具體領導行為，不是猶太民族。","The rebuke targets leadership conduct, not Jewish people."],["24–25 章的等候以警醒、忠誠與照顧最小者表達。","Waiting in chapters 24–25 involves vigilance, fidelity, and care for the least."]],"caution":["審判比喻不可變成預測日期的工具。","Judgment parables are not date-setting devices."],"question":["哪一節最能支持「責備針對具體領導行為，不是猶太民族。」的觀察？","Which verse best supports the observation “The rebuke targets leadership conduct, not Jewish people.”?"]},{"n":24,"refs":"24","title":["災難、警醒與時間","Disaster and vigilance"],"summary":["聖殿將毀的預告與未來降臨語言交錯；門徒被勸不要被假消息迷惑。","Temple-destruction warning and future-coming language interweave; disciples are urged not to be deceived."],"deep":[["歷史災難與終末圖像須分辨。","Distinguish historical disaster from eschatological imagery."],["24–25 章的等候以警醒、忠誠與照顧最小者表達。","Waiting in chapters 24–25 involves vigilance, fidelity, and care for the least."]],"caution":["審判比喻不可變成預測日期的工具。","Judgment parables are not date-setting devices."],"question":["哪一節最能支持「歷史災難與終末圖像須分辨。」的觀察？","Which verse best supports the observation “Distinguish historical disaster from eschatological imagery.”?"]},{"n":25,"refs":"25","title":["等候時照顧最小者","Waiting and the least"],"summary":["童女、才幹與綿羊山羊比喻探問警醒、忠誠及對飢餓、監禁者的照顧。","Virgins, talents, and sheep/goats probe vigilance, faithful service, and care for hungry and imprisoned people."],"deep":[["末世警醒具體表現在對弱者的行動。","Future hope becomes care for vulnerable people."],["24–25 章的等候以警醒、忠誠與照顧最小者表達。","Waiting in chapters 24–25 involves vigilance, fidelity, and care for the least."]],"caution":["審判比喻不可變成預測日期的工具。","Judgment parables are not date-setting devices."],"question":["哪一節最能支持「末世警醒具體表現在對弱者的行動。」的觀察？","Which verse best supports the observation “Future hope becomes care for vulnerable people.”?"]},{"n":26,"refs":"26","title":["晚餐、客西馬尼與審判","Meal, Gethsemane, and trial"],"summary":["女人膏耶穌、逾越節晚餐、門徒逃離，耶穌禱告後被捕受審。","A woman anoints Jesus; the Passover meal, Gethsemane prayer, arrest, and trial follow."],"deep":[["耶穌的順服伴隨深切憂傷。","Jesus’ obedience includes deep anguish."],["復活敘事以婦女的見證和同在應許作框架。","Women’s witness and promised presence frame the resurrection."]],"caution":["「他的血歸到我們」不可用作對猶太人的集體罪責。","Never use “his blood be on us” for collective blame of Jews."],"question":["哪一節最能支持「耶穌的順服伴隨深切憂傷。」的觀察？","Which verse best supports the observation “Jesus’ obedience includes deep anguish.”?"]},{"n":27,"refs":"27","title":["十字架與墳墓","Cross and tomb"],"summary":["彼拉多判決、兵丁嘲弄、耶穌被釘與安葬，婦女在場見證。","Pilate’s verdict, mockery, crucifixion, burial, and women’s witness unfold."],"deep":[["法律與群眾責任不可轉成對猶太人的集體指控。","Do not turn trial scenes into collective blame of Jews."],["復活敘事以婦女的見證和同在應許作框架。","Women’s witness and promised presence frame the resurrection."]],"caution":["「他的血歸到我們」不可用作對猶太人的集體罪責。","Never use “his blood be on us” for collective blame of Jews."],"question":["哪一節最能支持「法律與群眾責任不可轉成對猶太人的集體指控。」的觀察？","Which verse best supports the observation “Do not turn trial scenes into collective blame of Jews.”?"]},{"n":28,"refs":"28","title":["復活與萬民使命","Resurrection and all nations"],"summary":["婦女首先聽見復活消息，門徒在加利利受命使萬民作門徒。","Women first hear resurrection news; disciples in Galilee receive a mission to all nations."],"deep":[["同在應許與第一章「以馬內利」相呼應。","The promise of presence echoes Immanuel in chapter 1."],["復活敘事以婦女的見證和同在應許作框架。","Women’s witness and promised presence frame the resurrection."]],"caution":["「他的血歸到我們」不可用作對猶太人的集體罪責。","Never use “his blood be on us” for collective blame of Jews."],"question":["哪一節最能支持「同在應許與第一章「以馬內利」相呼應。」的觀察？","Which verse best supports the observation “The promise of presence echoes Immanuel in chapter 1.”?"]}],"themesIntro":["以下主題由馬太福音的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of Matthew and complement the chapter studies."],"themes":[{"refs":"1–2","title":["家譜、出生與流亡","Genealogy, birth, and displacement"],"body":["耶穌的身份與亞伯拉罕、大衛、以馬內利相連，故事同時有外邦博士與難民家庭。","Jesus is linked to Abraham, David, and Immanuel amid Gentile visitors and a refugee family."],"caution":["希律屠殺孩童須正視真實政治暴力。","Herod’s killing of children is political violence, not decorative detail."]},{"refs":"5–7","title":["山上寶訓","Sermon on the Mount"],"body":["八福、律法、禱告、金錢與兩條道路描繪天國生活。","Beatitudes, Torah, prayer, money, and two ways describe kingdom life."],"caution":["不可把貧窮或受迫害浪漫化。","Do not romanticize poverty or persecution."]},{"refs":"11–13","title":["反對、安息與比喻","Opposition, rest, and parables"],"body":["約翰發問，安息日爭議升高，天國比喻同時揭示與隱藏。","John questions, Sabbath disputes intensify, and kingdom parables both reveal and conceal."],"caution":["「硬心」指具體爭論，不宜泛指整個民族。","Hard-heartedness concerns particular disputes, not a whole people."]},{"refs":"19–25","title":["進城、衝突與等候","Entering Jerusalem and waiting"],"body":["婚姻、財富、僕人領導、進城、聖殿辯論和末世教導交錯。","Marriage, wealth, servant leadership, entry, temple debates, and future-oriented teaching unfold."],"caution":["審判比喻不可變成預測日期的工具。","Judgment parables are not date-setting devices."]},{"refs":"26–28","title":["受難、復活與使命","Passion, resurrection, and mission"],"body":["最後晚餐、客西馬尼、審判與十字架後，婦女見空墳並受差。","The meal, Gethsemane, trials, and cross lead to women at the empty tomb and mission."],"caution":["「他的血歸到我們」不可用作對猶太人的集體罪責。","Never use “his blood be on us” for collective blame of Jews."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["山上寶訓與婚姻教導不能用來責備貧者或困在暴力關係中的人；先留意耶穌如何保護弱者。","Do not use the Sermon or marriage teaching to shame the poor or trap abuse survivors; attend to Jesus’ care for the vulnerable."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–2","title":["第 1 課｜家譜、出生與流亡","Lesson 1 | Genealogy, birth, and displacement"],"aim":["耶穌的身份與亞伯拉罕、大衛、以馬內利相連，故事同時有外邦博士與難民家庭。","Jesus is linked to Abraham, David, and Immanuel amid Gentile visitors and a refugee family."],"flow":[["讀 1 章：家譜中的意外人物預告更廣的群體。","Read chapter 1: Unexpected people in the genealogy anticipate a wider community."],["對照 1–2 章：家譜中的女性與外邦人使身份敘述更複雜。","Compare chapters 1–2: Women and Gentiles complicate a narrow reading of lineage."],["討論：哪一節最能支持「神學應驗語言與難民處境同時閱讀。」的觀察？","Discuss: Which verse best supports the observation “Read fulfillment language alongside refugee experience.”?"]],"question":["哪一節最能支持「家譜中的意外人物預告更廣的群體。」的觀察？","Which verse best supports the observation “Unexpected people in the genealogy anticipate a wider community.”?"],"practice":["希律屠殺孩童須正視真實政治暴力。","Herod’s killing of children is political violence, not decorative detail."]},{"refs":"3–4","title":["第 2 課｜預備、試探與呼召","Lesson 2 | Preparation, testing, and calling"],"aim":["施洗約翰、受洗、曠野試探與門徒蒙召為公開事工定調。","John, baptism, wilderness testing, and first disciples prepare the public ministry."],"flow":[["讀 3 章：兒子身份在公開能力展現之前被宣告。","Read chapter 3: Sonship is declared before public display of power."],["對照 3–4 章：天國臨近與悔改從起頭就相連。","Compare chapters 3–4: The nearness of the kingdom is joined to repentance."],["討論：哪一節最能支持「三次試探重問兒子如何使用權柄。」的觀察？","Discuss: Which verse best supports the observation “Three tests ask how the Son uses authority.”?"]],"question":["哪一節最能支持「兒子身份在公開能力展現之前被宣告。」的觀察？","Which verse best supports the observation “Sonship is declared before public display of power.”?"],"practice":["曠野試探不能化作對受苦者的簡單「更努力」勸告。","Do not reduce wilderness testing to “try harder” advice."]},{"refs":"5–7","title":["第 3 課｜山上寶訓","Lesson 3 | Sermon on the Mount"],"aim":["八福、律法、禱告、金錢與兩條道路描繪天國生活。","Beatitudes, Torah, prayer, money, and two ways describe kingdom life."],"flow":[["讀 5 章：天國公義從關係與內心進到公共行動。","Read chapter 5: Kingdom righteousness moves from relation and heart into action."],["對照 5–7 章：「你們聽見…只是我告訴」深化而非抹除妥拉。","Compare chapters 5–7: “You have heard… but I say” deepens rather than erases Torah."],["討論：哪一節最能支持「聽見與遵行的差距是結尾焦點。」的觀察？","Discuss: Which verse best supports the observation “The gap between hearing and doing closes the sermon.”?"]],"question":["哪一節最能支持「天國公義從關係與內心進到公共行動。」的觀察？","Which verse best supports the observation “Kingdom righteousness moves from relation and heart into action.”?"],"practice":["不可把貧窮或受迫害浪漫化。","Do not romanticize poverty or persecution."]},{"refs":"8–10","title":["第 4 課｜醫治、憐憫與差派","Lesson 4 | Healings, mercy, and mission"],"aim":["醫治與趕鬼顯明權柄；稅吏蒙召，十二使徒被差往以色列。","Healing and exorcism reveal authority; a tax collector is called and twelve are sent."],"flow":[["讀 8 章：百夫長的信心打開外邦人參與的問題。","Read chapter 8: The centurion’s faith raises Gentile inclusion."],["對照 8–10 章：憐憫的行動與差派的教導互相詮釋。","Compare chapters 8–10: Mercy in action and mission teaching interpret each other."],["討論：哪一節最能支持「暫向以色列的差派與末章萬民使命須按敘事次序讀。」的觀察？","Discuss: Which verse best supports the observation “Read Israel-focused mission beside the later mission to nations.”?"]],"question":["哪一節最能支持「百夫長的信心打開外邦人參與的問題。」的觀察？","Which verse best supports the observation “The centurion’s faith raises Gentile inclusion.”?"],"practice":["疾病敘事不可使病者被當作屬靈失敗者。","Illness narratives do not mark sick people as spiritual failures."]},{"refs":"11–13","title":["第 5 課｜反對、安息與比喻","Lesson 5 | Opposition, rest, and parables"],"aim":["約翰發問，安息日爭議升高，天國比喻同時揭示與隱藏。","John questions, Sabbath disputes intensify, and kingdom parables both reveal and conceal."],"flow":[["讀 11 章：疑問可以與忠誠共存。","Read chapter 11: Questioning and fidelity can coexist."],["對照 11–13 章：芥菜種與麵酵讓小開始具有未來張力。","Compare chapters 11–13: Mustard seed and leaven turn small starts toward future growth."],["討論：哪一節最能支持「比喻不是單一密碼表，而要按情境聽。」的觀察？","Discuss: Which verse best supports the observation “Parables are not one-to-one code charts.”?"]],"question":["哪一節最能支持「疑問可以與忠誠共存。」的觀察？","Which verse best supports the observation “Questioning and fidelity can coexist.”?"],"practice":["「硬心」指具體爭論，不宜泛指整個民族。","Hard-heartedness concerns particular disputes, not a whole people."]},{"refs":"14–18","title":["第 6 課｜身份、群體與赦免","Lesson 6 | Identity, community, and forgiveness"],"aim":["餵飽群眾、彼得認信與變像後，耶穌教導十字架道路和群體中的小者。","Feeding, Peter’s confession, and transfiguration lead to cross-shaped discipleship and care for little ones."],"flow":[["讀 14 章：憐憫發生在政治暴力的陰影中。","Read chapter 14: Compassion unfolds under the shadow of political violence."],["對照 14–18 章：18 章把尋回迷羊與處理傷害放在同一群體脈絡。","Compare chapters 14–18: Chapter 18 joins seeking the lost to addressing harm."],["討論：哪一節最能支持「饒恕與保護小者、真實處理傷害同在。」的觀察？","Discuss: Which verse best supports the observation “Forgiveness belongs with protecting little ones and naming harm.”?"]],"question":["哪一節最能支持「憐憫發生在政治暴力的陰影中。」的觀察？","Which verse best supports the observation “Compassion unfolds under the shadow of political violence.”?"],"practice":["赦免不可取消受害者安全與問責。","Forgiveness does not cancel survivor safety or accountability."]},{"refs":"19–25","title":["第 7 課｜進城、衝突與等候","Lesson 7 | Entering Jerusalem and waiting"],"aim":["婚姻、財富、僕人領導、進城、聖殿辯論和末世教導交錯。","Marriage, wealth, servant leadership, entry, temple debates, and future-oriented teaching unfold."],"flow":[["讀 19 章：跟隨者不能把財富當生命保障。","Read chapter 19: Disciples cannot make wealth ultimate security."],["對照 19–25 章：24–25 章的等候以警醒、忠誠與照顧最小者表達。","Compare chapters 19–25: Waiting in chapters 24–25 involves vigilance, fidelity, and care for the least."],["討論：哪一節最能支持「末世警醒具體表現在對弱者的行動。」的觀察？","Discuss: Which verse best supports the observation “Future hope becomes care for vulnerable people.”?"]],"question":["哪一節最能支持「跟隨者不能把財富當生命保障。」的觀察？","Which verse best supports the observation “Disciples cannot make wealth ultimate security.”?"],"practice":["審判比喻不可變成預測日期的工具。","Judgment parables are not date-setting devices."]},{"refs":"26–28","title":["第 8 課｜受難、復活與使命","Lesson 8 | Passion, resurrection, and mission"],"aim":["最後晚餐、客西馬尼、審判與十字架後，婦女見空墳並受差。","The meal, Gethsemane, trials, and cross lead to women at the empty tomb and mission."],"flow":[["讀 26 章：耶穌的順服伴隨深切憂傷。","Read chapter 26: Jesus’ obedience includes deep anguish."],["對照 26–28 章：復活敘事以婦女的見證和同在應許作框架。","Compare chapters 26–28: Women’s witness and promised presence frame the resurrection."],["討論：哪一節最能支持「同在應許與第一章「以馬內利」相呼應。」的觀察？","Discuss: Which verse best supports the observation “The promise of presence echoes Immanuel in chapter 1.”?"]],"question":["哪一節最能支持「耶穌的順服伴隨深切憂傷。」的觀察？","Which verse best supports the observation “Jesus’ obedience includes deep anguish.”?"],"practice":["「他的血歸到我們」不可用作對猶太人的集體罪責。","Never use “his blood be on us” for collective blame of Jews."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["馬太福音最常被忽略的人物是誰？為何？","Which character in Matthew is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜馬太福音導讀","BibleProject | Matthew guide"],"url":"https://bibleproject.com/guides/book-of-matthew/"}],"footer":["馬太福音 · 成人主日學教師版 · 請配合完整經文閱讀。","Matthew · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
