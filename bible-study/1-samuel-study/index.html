<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="撒母耳記上成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>撒母耳記上｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"1SA","category":["歷史敘事 · 舊約","OLD TESTAMENT · NARRATIVE"],"name":["撒母耳記上","1 Samuel"],"subtitle":["從哈拿的禱告與撒母耳蒙召，到掃羅興衰、大衛受膏與逃亡；閱讀王權如何興起、失控並受檢驗。","From Hannah’s prayer and Samuel’s call to Saul’s rise and fall and David’s exile, read how monarchy emerges and is tested."],"overviewIntro":["從哈拿的禱告與撒母耳蒙召，到掃羅興衰、大衛受膏與逃亡；閱讀王權如何興起、失控並受檢驗。","From Hannah’s prayer and Samuel’s call to Saul’s rise and fall and David’s exile, read how monarchy emerges and is tested."],"lengthNote":["31 章；請按文學單元和整卷脈絡閱讀。","31 chapters; read each literary unit within the whole book."],"thesis":["王權不能取代忠誠與公義","Kingship cannot replace fidelity and justice"],"thesisDetail":["百姓求王有真實理由，但掃羅的故事顯示軍事成功、宗教姿態與外在形象都不足以保證良善領導。","The king request has real causes, yet Saul’s story shows military success, religious performance, and appearance do not secure good rule."],"keyQuestion":["甚麼樣的權力能保護百姓而不吞噬百姓？","What power protects without consuming the people?"],"keyAnswer":["哈拿之歌與撒母耳的警告反覆檢驗君王：弱者是否得照顧，領袖是否受限制。","Hannah’s song and Samuel’s warnings test rulers by care for the vulnerable and accountability."],"finalMovement":["掃羅與約拿單戰死，基列雅比人收屍；下一卷先以大衛哀歌而非慶功開始。","Saul and Jonathan die and are buried by Jabesh; the next book begins with David’s lament, not triumph."],"readingKeys":[{"refs":"1–2; 16","title":["哈拿之歌讀王權","Hannah’s song reads kingship"],"body":["神使強者失勢、弱者得力，預備掃羅與大衛的對照。","Divine reversal prepares the comparison of Saul and David."]},{"refs":"4–7","title":["約櫃不受人操控","The ark is not controlled"],"body":["宗教象徵被帶入戰場仍不能替代忠誠。","Bringing a symbol into battle cannot replace fidelity."]},{"refs":"8–12","title":["求王是複雜問題","The king request is complex"],"body":["司法失敗是真問題，王權帶來的徵用也是真風險。","Judicial failure is real, and so is the risk of royal extraction."]},{"refs":"18–31","title":["大衛也受檢驗","David is also tested"],"body":["逃亡敘事不只評掃羅，也呈現大衛的謊言、報復誘惑與克制。","Flight scrutinizes David’s deception, temptation to retaliate, and restraint."]}],"mapIntro":["以下分段是教學導覽，章界有助查找，並非每一段論述的天然邊界。","These movements guide study; chapter divisions are useful but do not always mark a natural literary boundary."],"movements":[{"refs":"1–3","title":["第 1 課｜哈拿與新的聲音","Lesson 1 | Hannah and a new voice"],"body":["由哈拿的禱告、翻轉之歌與撒母耳蒙召進入全卷。","Enter through Hannah’s prayer, reversal song, and Samuel’s call."]},{"refs":"4–7","title":["第 2 課｜約櫃與神的自由","Lesson 2 | The ark and divine freedom"],"body":["從戰敗、約櫃流轉到米斯巴悔改，辨認宗教操控與記念。","Move from defeat and the ark’s journey to Mizpah’s repentance."]},{"refs":"8–12","title":["第 3 課｜求王與王權警告","Lesson 3 | Asking for a king"],"body":["分析正當改革需求、掃羅初期表現與撒母耳的公開問責。","Analyze a real reform need, Saul’s early actions, and Samuel’s public accountability."]},{"refs":"13–15","title":["第 4 課｜恐懼、誓言與被棄","Lesson 4 | Fear, vows, and rejection"],"body":["比較掃羅與約拿單的行動，面對獻祭辯解及戰爭倫理。","Compare Saul and Jonathan and face the sacrificial excuse and war ethics."]},{"refs":"16–20","title":["第 5 課｜新王受膏與友情","Lesson 5 | Anointing and friendship"],"body":["大衛受膏、戰勝與掃羅嫉妒，約拿單及米甲選擇保護。","Read David’s anointing, victory, Saul’s jealousy, and protective choices by Jonathan and Michal."]},{"refs":"21–26","title":["第 6 課｜逃亡與克制","Lesson 6 | Flight and restraint"],"body":["追蹤祭司遇害、亞比該勸阻與兩次放過掃羅。","Trace the slain priests, Abigail’s intervention, and two times Saul is spared."]},{"refs":"27–29","title":["第 7 課｜政治避難的兩難","Lesson 7 | Exile’s divided loyalties"],"body":["讀大衛在非利士地的欺瞞與掃羅在隱多珥的絕望。","Read David’s deception among Philistines and Saul’s desperation at Endor."]},{"refs":"30–31","title":["第 8 課｜救援、分配與死亡","Lesson 8 | Rescue, sharing, and death"],"body":["比較大衛救回家眷與公平分配，以及掃羅與約拿單戰死後的哀傷。","Compare David’s rescue and equal sharing with grief after Saul and Jonathan die."]}],"mapCaution":{"title":["歷史與文學提醒","Historical and literary note"],"body":["本書以古代敘事、神學評價與編排方式說話；章節與年代問題宜參照整卷上下文，避免把故事當作現代新聞紀錄。","This ancient narrative communicates through theological evaluation and literary design; read episodes in context rather than as modern reporting."]},"chaptersIntro":["每章有摘要、兩個深入重點、詮釋提醒與課堂提問。章名與分段是本站的研讀提示。","Each chapter has a summary, two close-reading points, an interpretive caution, and a teaching question. Titles and divisions are study aids."],"chapters":[{"n":1,"refs":"1","title":["哈拿的哀求與許願","Hannah’s prayer and vow"],"summary":["哈拿因不育及毗尼拿刺激痛苦，在示羅向神傾心；以利先誤解她，後為她祝福，撒母耳出生。","Grieved by infertility and Peninnah’s provocation, Hannah prays at Shiloh; Eli first misreads her, then blesses her, and Samuel is born."],"deep":[["哈拿的沉默禱告對比祭司的先入判斷","Hannah’s silent prayer contrasts with Eli’s hasty judgment"],["她向神求子並不意味所有不育者都會得到相同結局","Her answered prayer is not a universal guarantee of children"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["以利的誤判提醒帶領者甚麼？","What does Eli’s misreading teach spiritual leaders?"]},{"n":2,"refs":"2","title":["哈拿之歌與以利家敗壞","Hannah’s song and Eli’s corrupt sons"],"summary":["哈拿讚美神翻轉強弱貧富；以利的兒子奪祭物、欺壓敬拜者，神人宣告祭司家將受審。","Hannah sings of reversals, while Eli’s sons seize offerings and abuse worshipers; a messenger announces judgment on the priestly house."],"deep":[["詩歌預告全書對傲慢權力的審視","The song anticipates scrutiny of proud power"],["撒母耳成長與以利兒子敗壞交錯呈現","Samuel’s growth is interwoven with the sons’ corruption"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["哈拿之歌如何成為讀後續王權故事的鑰匙？","How does Hannah’s song guide the coming monarchy story?"]},{"n":3,"refs":"3","title":["撒母耳夜間蒙召","Samuel called at night"],"summary":["少年撒母耳夜聞呼喚，以利教他回應；神告知以利家審判，撒母耳雖害怕仍把話說出。","Young Samuel hears a call at night; Eli teaches him to respond, and Samuel reluctantly speaks a judgment against Eli’s house."],"deep":[["以利雖失職，仍幫助撒母耳辨認呼召","Despite failure, Eli helps discern the call"],["神的話先是難說的審判，不只是鼓舞","The first message is hard judgment, not easy encouragement"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["忠實說出難聽的話需要甚麼支持？","What support helps someone speak a difficult truth?"]},{"n":4,"refs":"4","title":["約櫃被擄與以利之死","The ark captured and Eli dies"],"summary":["以色列戰敗後把約櫃帶上戰場，仍再敗、失去約櫃；以利與媳婦聞訊而亡，孩子名叫以迦博。","Israel brings the ark into battle after defeat but loses again and the ark is captured; Eli and his daughter-in-law die, and a child is named Ichabod."],"deep":[["約櫃被當成保障勝利的工具","The ark is treated as a victory device"],["婦人的臨終命名表達「榮耀離開」的集體哀傷","A dying woman’s naming voices communal loss"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["宗教物件何時被當作操控神的手段？","When does a sacred object become a tool for controlling God?"]},{"n":5,"refs":"5","title":["約櫃在非利士地","The ark in Philistine territory"],"summary":["非利士人把約櫃置於大袞廟，神像倒下，城邑接連遭災，非利士領袖決定送走約櫃。","Philistines place the ark in Dagon’s temple; the idol falls and calamity spreads, leading leaders to return the ark."],"deep":[["沒有以色列軍隊，神仍非俘虜","Without Israel’s army, God is no captive"],["大袞倒下以諷刺方式顛倒勝敗想像","Dagon’s fall ironically overturns the apparent victory"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["約櫃被擄的故事如何仍談神的自由？","How does a captured ark narrative speak of divine freedom?"]},{"n":6,"refs":"6","title":["約櫃歸回與伯示麥","The ark returns to Beth-shemesh"],"summary":["非利士人以新車和母牛送回約櫃並附賠罪禮；伯示麥歡迎，卻因不敬而有哀痛。","Philistines return the ark with guilt offerings on a new cart led by cows; Beth-shemesh rejoices but also suffers after irreverence."],"deep":[["送還方法試驗災禍是否出於耶和華","The return tests whether the calamities came from the Lord"],["歡喜與畏懼同在，神的同在不等於可隨意佔有","Joy and fear coexist; presence is not possession"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["何以約櫃歸回仍引出畏懼？","Why does the ark’s return also bring fear?"]},{"n":7,"refs":"7","title":["米斯巴悔改與以便以謝","Mizpah, repentance, and Ebenezer"],"summary":["撒母耳呼籲除去外邦神，以色列在米斯巴認罪；非利士人來攻，神使其潰敗，立石記念幫助。","Samuel calls Israel away from other gods; the people confess at Mizpah, and God routs Philistine attackers, prompting a memorial stone."],"deep":[["悔改有除偶像的具體行動","Repentance includes removing idols"],["以便以謝石頭記念「到如今」的幫助，不保證將來不用忠誠","Ebenezer remembers help thus far, not automatic future safety"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["記念恩典與持續責任如何相連？","How do remembered help and ongoing responsibility relate?"]},{"n":8,"refs":"8","title":["百姓要求立王","Israel asks for a king"],"summary":["撒母耳兒子不公，長老要求像列國一樣有王；神容許，撒母耳警告王將徵人、徵地與徵稅。","Samuel’s sons act unjustly, and elders ask for a king like other nations; God permits it while Samuel warns of conscription and seizure."],"deep":[["百姓對司法不公的抱怨有真實原因","The complaint about unjust judges is real"],["「像列國」的願望與王的索取形成諷刺","The wish to be like other nations is ironically answered by royal extraction"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["正當的改革需求如何可能引出新的濫權？","How can a legitimate reform demand create new abuse?"]},{"n":9,"refs":"9","title":["掃羅尋驢遇撒母耳","Saul seeks donkeys and meets Samuel"],"summary":["掃羅尋找失驢時遇上撒母耳；神已指示撒母耳膏立一位便雅憫人，日常差事轉向王權故事。","Searching for lost donkeys, Saul meets Samuel, who has been told to anoint a Benjaminite; an ordinary errand enters the monarchy story."],"deep":[["掃羅高大俊美，符合外在王者期待","Saul’s stature fits visible royal expectations"],["找驢與找王交錯，帶有敘事反諷","The donkey search intertwines with the search for a king"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["外表與真正的領導資格如何被這章區分？","How does the chapter distinguish appearance from leadership?"]},{"n":10,"refs":"10","title":["掃羅受膏與公開抽中","Saul anointed and selected"],"summary":["撒母耳私下膏掃羅，預告三個記號；靈感動掃羅說預言，之後公開抽籤選他，但有人質疑。","Samuel anoints Saul privately and gives signs; the spirit moves Saul to prophesy, and a public lot selects him amid skepticism."],"deep":[["私下膏立與公開認可並不完全相同","Private anointing and public recognition differ"],["掃羅躲在器具中，複雜化高大勇王的形象","Saul hiding among baggage complicates the tall-king image"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["領袖被選出與取得信任之間還缺甚麼？","What lies between being selected and earning trust?"]},{"n":11,"refs":"11","title":["基列雅比得救","Jabesh-gilead rescued"],"summary":["亞捫人威脅雅比，掃羅召聚以色列出兵救援；得勝後他拒絕處死先前反對者，王位在吉甲更新。","Ammon threatens Jabesh; Saul rallies Israel and rescues the town, then refuses to execute earlier opponents as kingship is renewed at Gilgal."],"deep":[["掃羅早期表現符合保護受壓者的王者角色","Saul initially protects the vulnerable"],["拒絕報復使勝利未即刻變成清算","Refusing revenge prevents victory becoming a purge"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["得勝後拒絕清算有何政治意義？","What is politically significant about refusing a purge after victory?"]},{"n":12,"refs":"12","title":["撒母耳的告別與雷雨","Samuel’s farewell and thunderstorm"],"summary":["撒母耳公開申明自己未欺壓百姓，回顧拯救歷史並指出求王之罪；雷雨使百姓懼怕，撒母耳應許繼續代求。","Samuel declares he has not exploited the people, rehearses rescue history, critiques the king request, and promises prayer after a thunderstorm."],"deep":[["領袖可受公開檢驗財物與職務","A leader submits financial conduct to public scrutiny"],["即使有王，君民仍需忠於神","King and people alike remain accountable"]],"caution":["立王與求王的描寫包含真實司法問題與王權風險；不要把任何政治體制直接等同神的旨意。","The king request reflects real injustice and royal risks; do not equate a modern political system with divine will."],"question":["撒母耳的自我檢驗對今日領導有何啟發？","What can modern leaders learn from Samuel’s public accounting?"]},{"n":13,"refs":"13","title":["掃羅越權獻祭","Saul offers sacrifice at Gilgal"],"summary":["非利士壓境、士兵分散，掃羅未等撒母耳而獻祭；撒母耳宣告其王位不能長久，戰爭仍待進行。","With Philistines threatening and troops scattering, Saul offers sacrifice without waiting; Samuel announces his dynasty will not last."],"deep":[["恐懼與戰略壓力是真實的，但不免除受命者責任","Fear and strategic pressure are real but do not erase accountability"],["以色列缺鐵器凸顯軍事弱勢","The iron shortage underscores military weakness"]],"caution":["對亞瑪力的當滅命令和掃羅對大衛的暴力不可成為今日宗教或政治迫害的藉口。","The Amalek destruction command and Saul’s violence cannot license present religious or political persecution."],"question":["壓力下的「不得不」如何接受檢驗？","How should claims of necessity under pressure be tested?"]},{"n":14,"refs":"14","title":["約拿單突襲與掃羅的誓言","Jonathan’s raid and Saul’s oath"],"summary":["約拿單憑信心突襲，非利士營混亂；掃羅禁止士兵進食，使民疲乏並險些處死約拿單。","Jonathan attacks with trust, sowing confusion; Saul’s ban on eating exhausts the army and nearly costs Jonathan his life."],"deep":[["約拿單的行動與掃羅的命令形成領導對比","Jonathan’s action contrasts with Saul’s order"],["百姓介入救約拿單，限制王的魯莽誓言","The people intervene against the rash royal vow"]],"caution":["對亞瑪力的當滅命令和掃羅對大衛的暴力不可成為今日宗教或政治迫害的藉口。","The Amalek destruction command and Saul’s violence cannot license present religious or political persecution."],"question":["群體何時必須制止領袖的宗教誓言？","When must a community resist a leader’s religious vow?"]},{"n":15,"refs":"15","title":["亞瑪力戰事與掃羅被棄","Amalek campaign and Saul rejected"],"summary":["掃羅沒有照命令處置亞甲與牲畜，卻以獻祭解釋；撒母耳責備他，宣告神厭棄其王權。","Saul spares Agag and prized livestock and invokes sacrifice; Samuel confronts him and announces rejection of his kingship."],"deep":[["「聽命勝於獻祭」針對以敬拜遮掩不順服","Obedience over sacrifice exposes worship as an excuse"],["當滅命令本身仍有深刻倫理難題，不可用於今日暴力","The destruction command remains ethically difficult and cannot authorize modern violence"]],"caution":["對亞瑪力的當滅命令和掃羅對大衛的暴力不可成為今日宗教或政治迫害的藉口。","The Amalek destruction command and Saul’s violence cannot license present religious or political persecution."],"question":["如何同時面對掃羅的辯解與戰爭經文的難題？","How can we face Saul’s excuse and the moral difficulty of the war text together?"]},{"n":16,"refs":"16","title":["大衛受膏與掃羅受擾","David anointed; Saul troubled"],"summary":["撒母耳到伯利恆膏耶西幼子大衛；神看內心而非外貌，大衛之後以琴藝服事受擾的掃羅。","Samuel anoints Jesse’s youngest, David; God looks beyond appearance, and David later plays music for the distressed Saul."],"deep":[["撒母耳也先被以利押外表吸引","Samuel too is drawn by Eliab’s appearance"],["同一章把新王蒙召與舊王困境放在一起","The new king’s call and old king’s distress share a chapter"]],"caution":["對亞瑪力的當滅命令和掃羅對大衛的暴力不可成為今日宗教或政治迫害的藉口。","The Amalek destruction command and Saul’s violence cannot license present religious or political persecution."],"question":["「看內心」如何約束我們對人物外表的判斷？","How does the inward focus constrain judgments by appearance?"]},{"n":17,"refs":"17","title":["大衛迎戰歌利亞","David faces Goliath"],"summary":["歌利亞挑戰以色列，大衛帶著牧者經驗與投石器迎戰；非利士人敗退，大衛名聲興起。","Goliath challenges Israel; David draws on shepherd experience and a sling, defeating him as Philistines flee."],"deep":[["大衛拒穿不合身的甲冑，並非反對一切預備","David rejects ill-fitting armor, not all preparation"],["戰鬥言語把勝負指向神，卻不能化為鼓勵霸凌他人的口號","His battle speech points to God but must not become a bullying slogan"]],"caution":["對亞瑪力的當滅命令和掃羅對大衛的暴力不可成為今日宗教或政治迫害的藉口。","The Amalek destruction command and Saul’s violence cannot license present religious or political persecution."],"question":["大衛的信靠與他已有的技能如何並用？","How do David’s trust and practiced skill work together?"]},{"n":18,"refs":"18","title":["約拿單之愛與掃羅嫉妒","Jonathan’s bond and Saul’s jealousy"],"summary":["約拿單與大衛結盟，百姓讚大衛的戰功；掃羅因嫉妒多次設計陷害，米甲成為婚姻政治的一環。","Jonathan binds himself to David while public praise fuels Saul’s jealousy; Saul schemes against David and uses Michal in dynastic politics."],"deep":[["約拿單讓出象徵王位的衣袍武器","Jonathan gives royal-symbolic garments and weapons"],["掃羅以婚姻和戰功條件操控他人","Saul manipulates marriage and military achievement"]],"caution":["對亞瑪力的當滅命令和掃羅對大衛的暴力不可成為今日宗教或政治迫害的藉口。","The Amalek destruction command and Saul’s violence cannot license present religious or political persecution."],"question":["嫉妒如何把有功的部屬變成威脅？","How does jealousy turn a capable subordinate into a threat?"]},{"n":19,"refs":"19","title":["大衛逃亡與米甲保護","David flees; Michal protects him"],"summary":["掃羅公開命殺大衛，約拿單求情一度奏效；米甲幫大衛逃走，撒母耳住處成為避難地。","Saul orders David killed; Jonathan briefly intercedes, Michal helps David escape, and Samuel’s town offers refuge."],"deep":[["米甲的行動承擔對父王說謊的風險","Michal risks deceiving her father to protect David"],["掃羅的暴力從暗中設計走向公開命令","Saul’s violence moves from covert plotting to open command"]],"caution":["對亞瑪力的當滅命令和掃羅對大衛的暴力不可成為今日宗教或政治迫害的藉口。","The Amalek destruction command and Saul’s violence cannot license present religious or political persecution."],"question":["家人如何在濫權者與受害者之間作選擇？","How do family members navigate an abusive ruler and a threatened person?"]},{"n":20,"refs":"20","title":["新月宴席與友情告別","New moon feast and friends’ farewell"],"summary":["大衛與約拿單以宴席缺席和箭的記號試探掃羅；掃羅暴怒，約拿單確認危險，兩友立約分別。","David and Jonathan use a feast absence and arrow signal to test Saul; his rage confirms danger, and the friends renew their covenant before parting."],"deep":[["約拿單試圖忠於父親又保護大衛，處境兩難","Jonathan is torn between father and friend"],["彼此後裔的承諾延伸友誼至政治未來","Their promise includes each other’s descendants and future politics"]],"caution":["對亞瑪力的當滅命令和掃羅對大衛的暴力不可成為今日宗教或政治迫害的藉口。","The Amalek destruction command and Saul’s violence cannot license present religious or political persecution."],"question":["友情如何在權力衝突中承擔代價？","What does friendship cost amid a struggle for power?"]},{"n":21,"refs":"21","title":["挪伯的餅與迦特的裝瘋","Bread at Nob and feigned madness"],"summary":["逃亡的大衛從祭司亞希米勒得餅和歌利亞刀，後在迦特裝瘋逃脫；多益在場埋下危機。","Fleeing David receives bread and Goliath’s sword from Ahimelech, then feigns madness in Gath; Doeg’s presence foreshadows danger."],"deep":[["祭司未完全知情，後果不應由他獨自承擔","The priest lacks full knowledge and should not bear all blame"],["大衛以謊言求生，也使他人暴露於掃羅怒火","David’s survival lie exposes others to Saul’s anger"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["逃亡者的抉擇如何影響幫助他的人？","How do a fugitive’s choices affect helpers?"]},{"n":22,"refs":"22","title":["亞杜蘭與挪伯祭司被殺","Adullam and the slaughter at Nob"],"summary":["大衛聚集困苦者；多益告發祭司，掃羅命殺挪伯祭司與居民，只有亞比亞他逃到大衛那裡。","David gathers distressed people; Doeg reports the priests, and Saul orders the slaughter of Nob, with Abiathar escaping to David."],"deep":[["掃羅把協助逃亡者等同叛國，擴大集體懲罰","Saul equates aid to a fugitive with treason and expands punishment"],["大衛承認自己的責任，卻不能替代對王權罪行的追究","David admits responsibility, though royal guilt remains central"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["權力如何把懷疑變成集體殺戮？","How can power turn suspicion into collective killing?"]},{"n":23,"refs":"23","title":["基伊拉得救與西弗出賣","Keilah rescued; Ziph informs Saul"],"summary":["大衛救基伊拉卻仍可能被交給掃羅；他求問神後離開，約拿單鼓勵，西弗人提供情報。","David rescues Keilah yet learns the town may hand him over; he leaves after inquiry, receives Jonathan’s encouragement, and faces Ziphite informants."],"deep":[["保護一城不保證得到安全回報","Saving a town does not guarantee safety in return"],["求問與撤退顯示領導不等於逞強","Inquiry and withdrawal show leadership need not be bravado"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["受人幫助與有能力保護幫助者為何不同？","Why do gratitude and capacity to protect differ?"]},{"n":24,"refs":"24","title":["洞中放過掃羅","David spares Saul in the cave"],"summary":["大衛在洞中有機會殺掃羅，只割下衣襟；他遠距陳明無意加害，掃羅暫認自己的不義。","David can kill Saul in a cave but cuts only a robe corner; he declares innocence from a distance, and Saul briefly acknowledges wrongdoing."],"deep":[["衣襟象徵王權與良心不安","The robe corner evokes royal status and David’s conscience"],["克制殺人不等於安全恢復，兩人仍分路","Refusing to kill does not restore safety; they part ways"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["不報復與重新信任有何差別？","How does refusing revenge differ from restored trust?"]},{"n":25,"refs":"25","title":["撒母耳之死、亞比該與拿八","Samuel dies; Abigail and Nabal"],"summary":["撒母耳去世；拿八羞辱大衛的求助，大衛帶兵欲報復，亞比該迅速供應糧食並勸止流血。","Samuel dies; Nabal insults David’s request, and David moves to retaliate, but Abigail brings provisions and restrains bloodshed."],"deep":[["亞比該的智慧阻止未來君王濫殺","Abigail’s judgment averts future royal bloodshed"],["她的調停不意味女性總須負責修補男性暴力","Her mediation does not make women responsible for men’s violence"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["亞比該的話如何改變大衛的行動？","How does Abigail’s speech redirect David?"]},{"n":26,"refs":"26","title":["曠野再度放過掃羅","David spares Saul again"],"summary":["大衛與亞比篩夜入掃羅營，拿走槍與水瓶，不殺睡中的王；雙方隔谷交談後各走各路。","David and Abishai enter Saul’s camp at night and take his spear and water jar, sparing him; the two speak across a valley and separate."],"deep":[["重複場景強調拒殺並非偶然","The repeated refusal is no accident"],["大衛質疑亞比尼珥的守衛，揭露王權周邊失職","David questions Abner’s failed guard duty"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["同一衝突重演卻未真正和解，說明甚麼？","What does repeated conflict without reconciliation reveal?"]},{"n":27,"refs":"27","title":["大衛在非利士境內","David among Philistines"],"summary":["大衛避難於亞吉治下的洗革拉，對外聲稱攻擊猶大南地，實際襲擊別處；亞吉誤信他已與以色列決裂。","David shelters under Achish at Ziklag, reports raids in Judah’s south while attacking elsewhere, and wins Achish’s misplaced trust."],"deep":[["逃亡使大衛陷入政治欺瞞與暴力","Exile entangles David in deception and violence"],["敘事沒有要求讀者視每項生存策略為榜樣","The narrator does not make every survival tactic exemplary"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["逃亡壓力如何使道德選擇複雜化？","How does exile pressure complicate moral decisions?"]},{"n":28,"refs":"28","title":["掃羅求問隱多珥婦人","Saul consults the woman at Endor"],"summary":["非利士軍臨近，神不回答掃羅；他違反自己禁令求助招魂婦人，聽見撒母耳宣告敗亡。","As Philistines gather and God gives no answer, Saul violates his own ban by consulting a medium and hears Samuel announce defeat."],"deep":[["掃羅先迫害招魂者又向她求助，顯出權力自相矛盾","Saul bans mediums then seeks one, exposing contradiction"],["婦人最後供食，也使她不只是情節工具","The woman later feeds him, showing more than a plot device"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["絕望中的領袖如何暴露自己過去的矛盾？","How does desperation expose a ruler’s contradictions?"]},{"n":29,"refs":"29","title":["非利士首領拒大衛參戰","Philistine commanders reject David"],"summary":["亞吉願帶大衛攻以色列，其他非利士首領不信任他，迫使大衛退出，免於直接對抗掃羅軍。","Achish trusts David for battle against Israel, but Philistine commanders reject him, forcing his withdrawal before the clash with Saul."],"deep":[["大衛的雙重位置終於遭到檢驗","David’s divided position reaches a test"],["退場是他人拒絕，不可簡單描寫成大衛主動道德選擇","His exit comes through others’ refusal, not a clear voluntary moral stand"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["這章如何暴露政治避難的界線？","What limits of political refuge does this chapter reveal?"]},{"n":30,"refs":"30","title":["洗革拉被掠與公平分贓","Ziklag raided and spoil shared"],"summary":["亞瑪力人掠走家眷，大衛求問後追擊救回；疲乏留守者與出戰者同分戰利品，並贈禮給長老。","Amalekites raid Ziklag and take families; David pursues and rescues them, shares spoil with exhausted guards, and sends gifts to elders."],"deep":[["家眷不是只作為男性財產列舉，應注意她們的安危","Family members’ safety matters beyond property lists"],["同分制度拒絕把疲弱者排除在恢復之外","Equal sharing refuses to exclude the exhausted"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["為何疲乏留守者仍應同分？","Why should exhausted guards share equally?"]},{"n":31,"refs":"31","title":["掃羅與約拿單戰死","Saul and Jonathan die"],"summary":["非利士人在基利波擊潰以色列；掃羅及兒子死去，屍身受辱，基列雅比人冒險取回安葬。","Philistines defeat Israel at Gilboa; Saul and sons die, their bodies are shamed, and the people of Jabesh-gilead risk retrieving them for burial."],"deep":[["雅比人記念第十一章掃羅的救援","Jabesh remembers Saul’s rescue in chapter 11"],["掃羅的悲劇結尾不抹去約拿單的忠誠與人的哀傷","Saul’s tragic end does not erase Jonathan’s loyalty or grief"]],"caution":["逃亡、祭司被殺、家眷被擄與掃羅自盡涉及傷害與創傷；避免以領袖興衰抹去受害者。","Flight, priests’ murder, abducted families, and Saul’s suicide involve trauma; keep victims visible beyond leadership arcs."],"question":["為何故事讓受過掃羅恩惠的人為他收屍？","Why do those once rescued by Saul recover his body?"]}],"themesIntro":["以下主題橫跨全書；先讀完整經文，再比較各段的不同聲音。","These themes run through the book; read full passages before comparing their distinct voices."],"themes":[{"refs":"1:1–2:10; 16","title":["神顛倒人的期待","Reversal of expectations"],"body":["哈拿之歌與大衛受膏都使讀者不按身分、外貌與軍力評判。","Hannah’s song and David’s anointing resist judgments by status, appearance, or force."],"caution":["顛倒不保證受苦者立即得公平結局。","Reversal does not guarantee immediate justice for sufferers."]},{"refs":"8; 12–15; 22","title":["王權與問責","Kingship and accountability"],"body":["百姓有司法困境，王卻能徵用、越權與屠殺；君王和百姓皆受檢驗。","Real judicial problems coexist with royal extraction, overreach, and massacre; king and people are accountable."],"caution":["切勿把王的宗教身份當免責牌。","Religious office is no immunity from scrutiny."]},{"refs":"18–20; 23; 25","title":["忠誠的多種形式","Forms of loyalty"],"body":["約拿單、米甲與亞比該以不同方式保護生命、說真話或阻止報復。","Jonathan, Michal, and Abigail variously protect life, speak truth, and avert retaliation."],"caution":["別要求受害者永遠以留在危險中證明忠誠。","Do not demand victims remain in danger to prove loyalty."]},{"refs":"4–7; 21–30","title":["神的同在與人的策略","Presence and human strategy"],"body":["約櫃不能保證勝利；逃亡時的人也必須在風險中作具體判斷。","The ark does not secure victory, and fugitives still make concrete choices under risk."],"caution":["不可將每一成功策略都宣稱神直接批准。","Do not claim divine approval for every successful tactic."]}],"pastoral":{"title":["教師帶領提醒","Teaching care"],"body":["對不育、祭司濫權、挪伯屠殺、家眷被擄與掃羅自盡應敏感處理。讓人物的哀傷和受害者被看見，不把他們只當王朝更迭的背景。","Teach infertility, clerical abuse, Nob’s massacre, abducted families, and Saul’s suicide with care; do not reduce sufferers to backdrop for dynastic change."]},"lessonsIntro":["八課可按班級時數調整。先讀指定經文與相鄰段落，再檢視人物、敘事者評價及今日應用的界線。","Adjust eight lessons to class time. Read assigned and adjacent passages, then distinguish character actions, narrator evaluation, and responsible application."],"lessons":[{"refs":"1–3","title":["第 1 課｜哈拿與新的聲音","Lesson 1 | Hannah and a new voice"],"aim":["由哈拿的禱告、翻轉之歌與撒母耳蒙召進入全卷。","Enter through Hannah’s prayer, reversal song, and Samuel’s call."],"flow":[["讀哈拿與以利的對話","Read Hannah and Eli’s exchange"],["找出詩歌中的強弱對比","Mark reversals in the song"],["比較撒母耳與以利兒子","Compare Samuel with Eli’s sons"]],"question":["誰的聲音先揭露領袖的問題？","Whose voice first reveals failures in leadership?"],"practice":["不要把不孕與得子變成信心成績表。","Do not make infertility and childbirth a faith scorecard."]},{"refs":"4–7","title":["第 2 課｜約櫃與神的自由","Lesson 2 | The ark and divine freedom"],"aim":["從戰敗、約櫃流轉到米斯巴悔改，辨認宗教操控與記念。","Move from defeat and the ark’s journey to Mizpah’s repentance."],"flow":[["討論為何抬約櫃仍戰敗","Ask why bringing the ark did not win"],["比較大袞與伯示麥反應","Compare Dagon and Beth-shemesh"],["讀以便以謝的記念","Read the Ebenezer memorial"]],"question":["神的同在能否被當成勝利工具？","Can divine presence be used as a victory device?"],"practice":["不要把疾病與災難直接歸因個人不敬。","Do not directly blame every illness or disaster on irreverence."]},{"refs":"8–12","title":["第 3 課｜求王與王權警告","Lesson 3 | Asking for a king"],"aim":["分析正當改革需求、掃羅初期表現與撒母耳的公開問責。","Analyze a real reform need, Saul’s early actions, and Samuel’s public accountability."],"flow":[["找出 8 章兒子不義與王的徵用","Identify unjust sons and royal extraction in chapter 8"],["比較 9–11 章掃羅形象","Compare Saul in chapters 9–11"],["模擬 12 章領袖公開受檢驗","Examine Samuel’s accounting in chapter 12"]],"question":["怎樣設計能制衡領袖的群體？","How can a community restrain its leaders?"],"practice":["勿將君主制直接套用當代政黨主張。","Do not transfer ancient monarchy into a modern party argument."]},{"refs":"13–15","title":["第 4 課｜恐懼、誓言與被棄","Lesson 4 | Fear, vows, and rejection"],"aim":["比較掃羅與約拿單的行動，面對獻祭辯解及戰爭倫理。","Compare Saul and Jonathan and face the sacrificial excuse and war ethics."],"flow":[["讀 13 章等待失敗","Read failed waiting in chapter 13"],["比較 14 章兩人的領導","Compare leadership in chapter 14"],["討論 15 章「聽命勝於獻祭」與當滅難題","Discuss obedience and the destruction problem in chapter 15"]],"question":["敬拜言語如何被用來掩飾失職？","How can worship language mask failure?"],"practice":["不可把古代當滅命令轉成今日暴力實踐。","Never turn ancient destruction language into present violence."]},{"refs":"16–20","title":["第 5 課｜新王受膏與友情","Lesson 5 | Anointing and friendship"],"aim":["大衛受膏、戰勝與掃羅嫉妒，約拿單及米甲選擇保護。","Read David’s anointing, victory, Saul’s jealousy, and protective choices by Jonathan and Michal."],"flow":[["比較 16 章外貌與內心","Compare appearance and heart in chapter 16"],["討論 17 章技能與信靠","Discuss skill and trust in chapter 17"],["追蹤 18–20 章從嫉妒到追殺","Trace jealousy into pursuit in chapters 18–20"]],"question":["如何在掌權者錯誤時忠於關係與公義？","How can loyalty and justice coexist when a ruler is wrong?"],"practice":["不要用大衛得勝淡化米甲與約拿單承擔的風險。","Do not let David’s success eclipse Michal’s and Jonathan’s risks."]},{"refs":"21–26","title":["第 6 課｜逃亡與克制","Lesson 6 | Flight and restraint"],"aim":["追蹤祭司遇害、亞比該勸阻與兩次放過掃羅。","Trace the slain priests, Abigail’s intervention, and two times Saul is spared."],"flow":[["讀挪伯祭司如何受牽連","Read how Nob’s priests are implicated"],["細讀亞比該的勸說","Analyze Abigail’s argument"],["比較 24 與 26 章相似和差異","Compare chapters 24 and 26"]],"question":["不報復是否等於恢復信任？","Does refusing revenge mean trust is restored?"],"practice":["處理挪伯屠殺時讓無辜者仍可見。","Keep Nob’s innocent victims visible."]},{"refs":"27–29","title":["第 7 課｜政治避難的兩難","Lesson 7 | Exile’s divided loyalties"],"aim":["讀大衛在非利士地的欺瞞與掃羅在隱多珥的絕望。","Read David’s deception among Philistines and Saul’s desperation at Endor."],"flow":[["列出大衛告訴亞吉與實際所做","Compare David’s reports to Achish with his actions"],["比較掃羅禁令與求助","Compare Saul’s ban and his request"],["問大衛退出戰場是否自願","Ask whether David chose to leave battle"]],"question":["生存壓力如何影響誠實與忠誠？","How does survival pressure affect truth and loyalty?"],"practice":["不把招魂婦人當成只供掃羅情節使用的符號。","Do not reduce the medium to a mere device for Saul’s story."]},{"refs":"30–31","title":["第 8 課｜救援、分配與死亡","Lesson 8 | Rescue, sharing, and death"],"aim":["比較大衛救回家眷與公平分配，以及掃羅與約拿單戰死後的哀傷。","Compare David’s rescue and equal sharing with grief after Saul and Jonathan die."],"flow":[["討論留守者同分的理由","Discuss equal sharing for those left behind"],["追蹤基列雅比與掃羅的前史","Recall Jabesh and Saul’s past"],["預備撒母耳記下的大衛哀歌","Prepare for David’s lament in 2 Samuel"]],"question":["如何記念一位有功也有嚴重失敗的領袖？","How can one remember a leader with real service and grave failure?"],"practice":["不要浪漫化掃羅的自殺或把它變成道德標籤。","Do not romanticize or morally label Saul’s suicide."]}],"questionsIntro":["請先讓學員指出經文根據，再討論詮釋與應用；困難經文可以保留開放問題。","Ask learners for textual evidence before interpretation and application; difficult passages may leave open questions."],"extraQuestions":[["哈拿之歌如何評價掃羅與大衛的權力？","How does Hannah’s song evaluate Saul and David?"],["掃羅的失敗能否使所有大衛行動自動正當化？","Does Saul’s failure automatically justify David’s actions?"],["約拿單、米甲與亞比該各如何限制暴力？","How do Jonathan, Michal, and Abigail each restrain violence?"]],"sourceNote":["本站提供原創逐章研讀摘要與教學建議，不轉載現代聖經譯本經文。中文經文連結預設新標點和合本（神版），英文預設 NASB 2020。","Original chapter notes and teaching suggestions; no modern translation text is reproduced. Scripture links default to CUNP (Shen edition) in Chinese and NASB 2020 in English."],"sources":[{"title":["BibleProject｜撒母耳記上導讀","BibleProject | 1 Samuel guide"],"url":"https://bibleproject.com/guides/books-of-samuel/"},{"title":["耶魯公開課｜舊約導論","Open Yale Courses | Introduction to the Old Testament"],"url":"https://oyc.yale.edu/religious-studies/rlst-145"}],"footer":["撒母耳記上研讀 · 原創逐章摘要與成人主日學教師教案","1 Samuel study · original chapter notes and adult class plans"],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
