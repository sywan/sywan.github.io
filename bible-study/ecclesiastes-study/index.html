<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="傳道書｜成人主日學教師版：全書總覽、逐章研讀、主題與八課教案。"><title>傳道書｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"ECC","name":["傳道書","Ecclesiastes"],"subtitle":["在時間、勞碌、享樂與死亡之間，學習敬畏神、領受當下的恩賜，並誠實面對人的有限。","Amid time, work, pleasure, and death, learn to fear God, receive ordinary gifts, and face human limits honestly."],"overviewIntro":["全書以傳道者的觀察挑戰「努力就能掌控結果」的假設，結語把讀者帶回敬畏神與審判的地平線。","The Teacher challenges the belief that effort can secure outcomes; the epilogue brings readers back to reverence and divine judgment."],"lengthNote":["12 章；智慧文學中的思辨、詩歌與勸勉。","Twelve chapters of reflection, poetry, and exhortation within wisdom literature."],"thesis":["生命如霧，卻不是毫無價值","Life is vapor, yet not worthless"],"thesisDetail":["「虛空」對應希伯來文 hevel，可指短暫、難以捉摸與悖論。傳道者揭露人無法把工作、智慧或財富變成永恆保證；反覆出現的「享受」段落則提醒人把今日視為神的禮物。","The Hebrew hevel suggests vapor: fleeting, elusive, and sometimes paradoxical. Work, wisdom, and wealth cannot guarantee permanence; the recurring calls to enjoy life present the present as God’s gift."],"keyQuestion":["人在日光之下究竟能掌握多少？","How much can humans control under the sun?"],"keyAnswer":["傳道者不是否定智慧與善，而是追問它們是否足以保證公平、長久與安全。結語要求在不確定中仍敬畏神、行正直。","The Teacher does not reject wisdom or goodness; he asks whether they guarantee justice, duration, or safety. The epilogue calls for reverence and integrity amid uncertainty."],"finalMovement":["12:9–14 的結語由編者聲音評估傳道者的話：智慧言語能刺痛並引導；最後是敬畏神、遵守祂的命令，並記得祂會審判隱藏的事。","In 12:9–14 an editorial voice evaluates the Teacher: wise words can prod and guide. The final summons is to fear God, keep his commands, and remember that hidden deeds come under judgment."],"readingKeys":[{"refs":"1:2; 12:8","title":["先讀框架，再讀辯證","Read the frame before the arguments"],"body":["開頭與結尾重複「虛空」，12:9–14 又另加總評。課堂上要分清傳道者的探索、詩歌的聲音與編者結語。","The opening and 12:8 repeat the vapor refrain; 12:9–14 adds a closing evaluation. Distinguish the Teacher’s explorations from the framing voice."]},{"refs":"1:3; 3:11","title":["日光之下是一種觀察角度","Under the sun is a vantage point"],"body":["這個片語經常指出人從有限時間和視野看世界。不要把每一個觀察句都當成全書最後的神學宣告。","The phrase often marks the limits of human observation. Do not turn every observational sentence into the book’s final theological claim."]},{"refs":"2:24; 3:12–13; 5:18–20; 9:7–10","title":["享受段落不是插曲","Enjoyment is not an afterthought"],"body":["飲食、工作與相伴被反覆視為領受之物。喜樂不是否認不公或死亡，而是在有限中對神的恩賜作出回應。","Food, work, and companionship recur as gifts to receive. Joy does not erase injustice or death; it is a response to God’s gifts within limits."]},{"refs":"7:15; 8:14; 12:13–14","title":["與約伯記和箴言對讀","Read alongside Job and Proverbs"],"body":["箴言強調智慧的常態益處，約伯記揭露義人受苦，傳道書直視例外與不可預測；三卷書彼此校正簡化的因果論。","Proverbs stresses wisdom’s ordinary benefits, Job exposes righteous suffering, and Ecclesiastes faces exceptions and unpredictability. Together they challenge simple cause-and-effect formulas."]}],"mapIntro":["以下按論證轉折劃分；章界便於查找，並非每個思想的原始分段。","The map follows argumentative turns; chapter divisions aid navigation but do not always mark original units of thought."],"movements":[{"refs":"1:1–11","title":["題旨與循環","Title and cycles"],"body":["世代、日月、風與江河的循環，襯出人對「益處」與被記念的渴望。","Cycles of generations, sun, wind, and rivers expose the longing for lasting gain and remembrance."]},{"refs":"1:12–2:26","title":["智慧、享樂、成就的實驗","Experiments in wisdom, pleasure, and achievement"],"body":["傳道者試過智慧、歡樂、工程和財富；死亡與繼承使這些都無法保證終極收益。","Wisdom, pleasure, projects, and wealth fail to secure ultimate gain in the face of death and inheritance."]},{"refs":"3:1–4:16","title":["定時、永恆與社會不公","Times, eternity, and injustice"],"body":["萬事有時；人看不透神的全局。壓迫、競爭與孤獨使「單靠努力」的樂觀變得脆弱。","There is a time for everything, yet humans cannot grasp the whole. Oppression, rivalry, and loneliness complicate easy optimism."]},{"refs":"5:1–6:12","title":["敬拜、財富與知足","Worship, wealth, and contentment"],"body":["慎言與敬畏神對照空洞宗教；財富能積累，卻不能製造享受的能力。","Reverent speech counters empty religion; wealth may accumulate without giving the capacity to enjoy it."]},{"refs":"7:1–8:17","title":["智慧的價值與界限","Wisdom’s value and limits"],"body":["哀傷能教導人；過度簡化的義惡報應卻解釋不了現實。人也無法完全查明神所做的事。","Sorrow can teach, but simplistic reward formulas fail. Humans cannot fully trace God’s work."]},{"refs":"9:1–12:14","title":["死亡、行動與記念造主","Mortality, action, and remembering the Creator"],"body":["共同的死亡不取消今日的責任；人要行動、分享、歡喜，也要趁年少記念造主。編者作出結語。","Shared mortality does not cancel present responsibility: act, share, rejoice, and remember the Creator. The editorial conclusion follows."]}],"mapCaution":{"title":["讀法提醒","Reading caution"],"body":["傳道書不是一串彼此無關的悲觀名句。要觀察每段如何提出問題、推進反例，又在何處出現領受喜樂和敬畏神的回應。","Ecclesiastes is not a bag of detached pessimistic quotations. Track each argument, its counterexamples, and recurring responses of received joy and reverence."]},"chaptersIntro":["每章先給全章摘要，再展開三個深入重點、詮釋提醒與課堂問題。章名是研讀提示，不是經文本身的標題。","Each chapter has a short summary, three close-reading points, an interpretive caution, and a teaching question. Study titles are editorial aids."],"chapters":[{"n":1,"refs":"1:1–18","title":["循環世界與智慧的重擔","Cycles and the burden of wisdom"],"summary":["開篇以「有甚麼益處」追問勞碌的最終收穫；自然循環與世代遺忘使人的成就難以永久。傳道者轉向智慧研究，卻發現洞察越多，愁煩也越多。","The opening asks what lasting gain work produces. Cycles in nature and forgotten generations shrink the permanence of achievement. The Teacher turns to wisdom and finds that greater insight also brings grief."],"deep":[["1:2–3 的「虛空」與「益處」形成全書問題：難以抓住的生命能否留下淨收益？","The pairing of vapor and gain in 1:2–3 frames the book’s central question."],["1:4–11 的重複不是說科技毫無新意，而是比較人短暫的記憶與不斷運行的世界。","The repetitions of 1:4–11 compare short human memory with the world’s ongoing rhythms; they do not deny all innovation."],["1:12–18 以王者式的智慧實驗開場，為下一章的歡樂與成就實驗鋪路。","The royal-style wisdom experiment in 1:12–18 prepares for the tests of pleasure and achievement in chapter 2."]],"caution":["不要把「虛空」只譯成「毫無意義」；它也有短暫與不可控制的意味。","Do not reduce hevel to “nothing has meaning”; transience and elusiveness matter."],"question":["如果人終會被遺忘，今天的工作還能有甚麼價值？","If people will be forgotten, what value can their work still have today?"]},{"n":2,"refs":"2:1–26","title":["享樂與成就無法留住生命","Pleasure and achievement cannot secure life"],"summary":["傳道者測試歡笑、美酒、園林、財富與智慧，仍因死亡和繼承而難以留下永久益處。章末首次明確轉向：吃喝與在勞碌中享福，是出於神手的恩賜。","The Teacher tests laughter, wine, gardens, riches, and wisdom, but death and inheritance undo lasting gain. The chapter ends by identifying enjoyment of work and food as a gift from God."],"deep":[["2:4–11 羅列工程與收藏，不是禁止建造或藝術，而是測試成就能否成為終極保障。","The catalogue in 2:4–11 tests achievement as ultimate security; it does not ban building or art."],["2:12–17 承認智慧勝過愚昧，卻指出二者都不能免於死亡；「有益」不等於「可保證」。","Wisdom is better than folly in 2:12–17, yet neither escapes death: benefit is not guarantee."],["2:18–23 對繼承者與失眠的憂慮，使工作問題具體化；2:24–26 隨後重定義享受為領受。","Anxiety over heirs and sleepless labor makes the work problem concrete; 2:24–26 reframes enjoyment as reception."]],"caution":["不要把章末讀成放縱享樂；重點是神所賜、有限而感恩的享受。","The ending is not a license for indulgence; it describes grateful, finite enjoyment received from God."],"question":["你如何分辨「努力工作」與「用工作保證自身價值」？","How can you distinguish diligent work from using work to guarantee your worth?"]},{"n":3,"refs":"3:1–22","title":["萬事有時，卻無法看透全局","A time for everything, but not a total view"],"summary":["著名的時序詩列出相對的生活時刻。神使萬物各按其時成為美好，人卻不能從始至終參透祂的作為；不義與死亡仍在，故人應敬畏神並領受今日的份。","The time poem sets contrary seasons side by side. God makes things fitting in their time, but humans cannot grasp his work from beginning to end. Injustice and mortality remain, calling for reverence and present enjoyment."],"deep":[["3:1–8 的詩不是命令人去做每一件事，而是在有限時間裡承認境遇的變化。","The poem of 3:1–8 observes changing seasons; it does not command every listed action."],["3:11 同時保留「美好」與「不能參透」：對神的信任不等於擁有完整解釋。","Verse 3:11 holds together fittingness and inability to comprehend: trust is not exhaustive explanation."],["3:16–22 把不公與人獸共同死亡放在神審判的盼望旁，拒絕廉價的樂觀。","Verses 3:16–22 place injustice and shared mortality beside the hope of judgment, resisting cheap optimism."]],"caution":["「凡事都有定時」不可拿來安慰受虐或受苦者，彷彿不義本身是神所喜悅。","Do not use “a time for everything” to tell a victim that injustice itself delights God."],"question":["遇見不公時，敬畏神與享受今日如何同時存在？","How can reverence and present enjoyment coexist when we encounter injustice?"]},{"n":4,"refs":"4:1–16","title":["壓迫、競爭與同伴","Oppression, rivalry, and companionship"],"summary":["傳道者看見受壓迫者無人安慰，又看見競爭催生勞碌、孤單的人擁有財富卻沒有可分享之人。兩人相扶與三股合成的繩子，成為對孤立的現實回應；末段提醒權勢也會轉瞬失去支持。","The Teacher sees the oppressed without comfort, rivalry driving work, and a solitary worker with wealth but no one to share it. Mutual support answers isolation; the closing royal story shows how quickly status fades."],"deep":[["4:1–3 以受害者視角看權力，教會教學不應急著用抽象因果跳過哀痛。","Verses 4:1–3 see power from the victim’s side; teaching should not skip grief with abstractions."],["4:4–8 並非反對勤奮，而是指出嫉妒與孤立能扭曲工作目的。","Verses 4:4–8 do not condemn diligence; envy and isolation distort work’s purpose."],["4:9–12 的同伴之益可用於友誼、家庭與群體；經文並未只限定婚姻。","The benefits of partnership in 4:9–12 apply to friendship, family, and community, not marriage alone."]],"caution":["不要把「三股合成的繩子」硬說成固定的三個對象；經文意在強調結伴的力量。","Do not force the three-strand cord into a fixed three-person formula; its point is strengthened companionship."],"question":["我們的群體有哪些人正在「無人安慰」？","Who in our community is experiencing life “without a comforter”?"]},{"n":5,"refs":"5:1–20","title":["慎言敬拜與財富的限度","Reverent worship and wealth’s limits"],"summary":["前半要求進神的殿時謹慎聽、少說話、守所許的願；後半觀察官僚壓迫、金錢無法使人飽足、財富易失。能吃、喝並享受勞碌成果，是神所賜的份。","The first half calls for listening, restrained speech, and keeping vows before God. The second sees institutional oppression, money’s inability to satisfy, and fragile wealth. Enjoyment of work is God’s gift."],"deep":[["5:1–7 的敬拜論與全書一致：敬畏神不是口號，而是說話與承諾上的誠實。","Worship in 5:1–7 makes fear of God concrete in speech and promises."],["5:8–9 對官僚層層相護的觀察，提醒讀者信仰並未使制度性問題消失。","Verses 5:8–9 acknowledge layered official power; faith does not erase structural injustice."],["5:10–17 把「多而不滿足」與失去財富後的空手並置，拆解占有就能安心的錯覺。","Verses 5:10–17 set unsatisfied abundance beside loss and empty hands, exposing the illusion of security through possession."]],"caution":["5:18–20 的喜樂不是富人的特權；重點是神使人能享受其份。","Joy in 5:18–20 is not a privilege purchased by wealth; God grants the capacity to enjoy one’s portion."],"question":["在敬拜與財務上，甚麼承諾或期待最需要誠實面對？","What promises or expectations in worship and finances require honest attention?"]},{"n":6,"refs":"6:1–12","title":["擁有與享受之間的落差","The gap between possession and enjoyment"],"summary":["有人有資財、尊榮與長壽，卻不能享受；傳道者以尖銳比較揭露「擁有很多」與「活得豐盛」不是同一回事。章末連問誰知道人真正的好處、誰能告訴人身後之事，凸顯人的知識界限。","Someone can have wealth, honor, and long life yet lack enjoyment. The Teacher sharply separates having much from living well, then asks who knows what is good for a person or what comes afterward."],"deep":[["6:1–6 用極端例子描述享受能力的缺失，並非貶低生育或壽命本身。","The extreme case in 6:1–6 concerns inability to enjoy; it does not disparage children or longevity themselves."],["6:7–9 的口腹與眼目意象，說明欲望並不總隨供應增加而平息。","Appetite and sight in 6:7–9 show that desire does not always settle when supply increases."],["6:10–12 以連續問題收尾，讓讀者承認命名、爭辯與預測都有限。","The closing questions of 6:10–12 expose limits of naming, arguing, and prediction."]],"caution":["不要把不能享受簡化為當事人「缺乏信心」；經文也承認困境可以臨到人。","Do not blame an inability to enjoy on a person’s lack of faith; the text acknowledges affliction."],"question":["哪些外在成功指標，容易遮蔽一個人真實的困苦？","Which outward measures of success can hide someone’s real distress?"]},{"n":7,"refs":"7:1–29","title":["喪事、智慧與不可靠的報應公式","Mourning, wisdom, and unreliable formulas"],"summary":["一連串「勝過」的箴言讓讀者正視死亡與責備的教益。傳道者承認智慧能保護人，卻看見義人早亡、惡人長壽；因此警告自以為能用極端表現控制結局，也承認人難完全查明神的作為。","A chain of “better than” sayings values mortality-awareness and correction. Wisdom protects, but the righteous may perish early while the wicked endure. The Teacher warns against treating extreme conduct as a way to control outcomes and admits the limits of discovery."],"deep":[["7:1–6 不是叫人憎恨喜宴，而是說喪禮能揭露終局，使心變得清醒。","Verses 7:1–6 do not condemn celebration; mourning can disclose the human end and sober the heart."],["7:13–14 將順境與逆境都置於神主權下，卻明說人不能知曉將來。","Verses 7:13–14 place prosperity and adversity under God’s providence without claiming knowledge of the future."],["7:15–22 承認報應例外與人人有罪，提醒人別把自義或世故變成操縱命運的策略。","Verses 7:15–22 admit exceptions and universal moral failure; neither self-righteousness nor cynicism controls fate."]],"caution":["7:16 不是「不要太公義」的道德許可；應連同 7:15、7:18–20 讀，避免把它變成勸人少行善。","Verse 7:16 is not permission to be less righteous; read it with 7:15 and 7:18–20."],"question":["當好人遭難時，我們會如何修正過度簡單的因果說法？","When good people suffer, how should we revise overly simple moral formulas?"]},{"n":8,"refs":"8:1–17","title":["權勢與公義遲延","Power and delayed justice"],"summary":["傳道者談到面對王權的謹慎、人的有限與死亡不可躲避，又指出惡人得葬禮、善惡報應顛倒的現象。雖然他仍勸人敬畏神，也承認人無法查明神在日光之下的全套作為。","The Teacher counsels prudence before royal power, notes mortality, and sees the wicked honored and moral outcomes reversed. He still urges fear of God while admitting that humans cannot fully discover God’s work."],"deep":[["8:2–6 的王命段落屬現實政治智慧，不等於每個權力命令都合神心意。","The counsel about kings in 8:2–6 is political prudence, not blanket approval of every command."],["8:10–14 提出敬虔期待與所見現實之間的裂縫；不要刪去這個張力。","Verses 8:10–14 expose a gap between expected justice and observed outcomes; keep the tension visible."],["8:15–17 再談喜樂與無法參透，顯示享受與求知謙卑可並存。","Verses 8:15–17 join enjoyment with epistemic humility rather than opposing them."]],"caution":["不要用「神終會審判」阻止受壓迫者尋求現今的公義與保護。","Do not use future judgment to silence a person seeking present justice and protection."],"question":["在權力不對等時，智慧的謹慎與道德的勇氣如何平衡？","How should prudent caution and moral courage relate when power is unequal?"]},{"n":9,"refs":"9:1–18","title":["共同的死亡與今日的生命","Common death and present life"],"summary":["義人與惡人都面對死亡，因此人不可把人生結果當作可靠的品德報表。傳道者邀請人歡喜吃喝、愛所愛的人、盡力做手中之事，同時指出競賽與戰爭的結果也受時機與意外影響；末段展示被忽略的窮人智慧。","Righteous and wicked alike die, so outcomes are not reliable moral scorecards. The Teacher invites enjoyment of food, relationships, and work while noting the role of time and chance; a poor wise man’s insight is overlooked."],"deep":[["9:1–6 的死亡觀來自「日光之下」的有限視角，重點是此生機會不會無限延長。","The death reflections in 9:1–6 speak from an under-the-sun perspective and press the urgency of finite opportunity."],["9:7–10 是全書最鮮明的領受喜樂段落之一；喜樂與死亡意識緊密相連。","Verses 9:7–10 vividly connect received joy with awareness of mortality."],["9:11–18 的時機、意外與被遺忘的智慧，修正「成功必然出自能力」的說法。","Time, chance, and forgotten wisdom in 9:11–18 complicate the claim that success always mirrors ability."]],"caution":["9:5 的「死人毫無所知」不可單獨拿來建立完整死後論；先看上下文對地上活動的觀察。","Do not build a complete doctrine of the afterlife from 9:5 alone; attend to its observations about earthly participation."],"question":["知道結果無法保證，會使你退縮，還是更珍惜今天？","Does uncertain outcome make you withdraw, or value today more deeply?"]},{"n":10,"refs":"10:1–20","title":["愚昧的外溢與領袖的責任","The spillover of folly and leadership"],"summary":["短篇箴言顯示一點愚昧可破壞長久建立的名聲；權柄若錯置、領袖若懶惰，整個群體會承受代價。對說話和行事的謹慎也貫穿本章。","Short sayings show how a little folly can spoil a reputation. Misplaced authority and negligent leaders harm a community, while speech and action require care."],"deep":[["10:1–4 以香膏、心向和掌權者的怒氣，說明微小失誤也可能產生不成比例的影響。","Verses 10:1–4 use perfume, orientation, and a ruler’s anger to show disproportionate consequences."],["10:5–11 看到權位錯置與工作工具失當；智慧包含預備與修整，不只事後補救。","Verses 10:5–11 connect misplaced rank with poorly prepared labor; wisdom includes preparation."],["10:16–20 同時批評失職領袖與草率言語，提醒在公共生活中辨識風險。","Verses 10:16–20 critique negligent leaders and careless speech in public life."]],"caution":["本章箴言情境多樣，不宜把每一句都升格成無例外的政治律法。","These sayings address varied situations; do not turn each into an exceptionless political law."],"question":["群體中哪些「小愚昧」已造成了大傷害？如何修補？","What small acts of folly have caused large harm in a group, and how can they be repaired?"]},{"n":11,"refs":"11:1–10","title":["不確定中慷慨播種","Generous action amid uncertainty"],"summary":["人不知風雲與神造作的奧祕，卻仍要分散風險、早晚播種、享受光明與青春，同時記得行動須向神交帳。未知不是不作為的理由。","People cannot predict wind, weather, or God’s hidden work; nevertheless they should distribute, sow morning and evening, enjoy light and youth, and remember accountability to God. Uncertainty need not paralyze action."],"deep":[["11:1–2 的「投糧在水面」有商業投資或慷慨分享等不同理解；共同點是面向不可控的將來作開放行動。","“Cast your bread on the waters” in 11:1–2 has investment and generosity readings; both involve action toward an uncertain future."],["11:4–6 反對等到所有條件完美才開始；人能盡責，卻不能規定哪次播種必成功。","Verses 11:4–6 resist waiting for perfect conditions; responsibility does not entail control of outcomes."],["11:7–10 把喜樂、青春與審判放在一起，避免把快樂和責任拆開。","Verses 11:7–10 hold delight, youth, and judgment together."]],"caution":["「凡事憑信心冒險」不能取代倫理判斷或對脆弱者的保護。","A slogan of reckless risk-taking must not replace ethical judgment or protection of vulnerable people."],"question":["面對不確定，你現在能做哪一件具體而負責任的事？","What concrete, responsible action can you take amid uncertainty?"]},{"n":12,"refs":"12:1–14","title":["記念造主與全書的結語","Remember the Creator and hear the epilogue"],"summary":["詩歌以衰老與死亡的圖像勸人趁年少記念造主；塵土歸地、靈歸賜靈的神。12:9–14 轉向編者評語，肯定智慧言語的引導，最後呼籲敬畏神、遵守命令，並面對審判。","A poem of aging and death urges readers to remember the Creator while young; dust returns to earth and breath to God. The editorial voice in 12:9–14 commends wisdom’s goading role and ends with reverence, obedience, and judgment."],"deep":[["12:1–7 的家屋、磨坊、銀鍊等意象可聯想到衰老與死亡，不必為每個細節指定唯一生理對應。","The house, mill, cord, and vessel evoke aging and death; avoid insisting on one anatomical referent for every image."],["12:8 回應 1:2 的「虛空」，形成首尾框架；12:9–14 則是另一層評估聲音。","Verse 12:8 echoes 1:2 as an inclusio; 12:9–14 adds a distinct evaluating voice."],["12:13–14 不抹去前文的困惑，而是指出在未完全明白時仍可採取的倫理姿態。","Verses 12:13–14 do not erase earlier puzzles; they locate an ethical posture within them."]],"caution":["不要以「趁年輕」羞辱年長者；詩的目的在於及時記念創造主。","Do not use “while young” to shame older people; the poem urges timely remembrance of the Creator."],"question":["全書結語如何改變你對前十一章「虛空」的理解？","How does the epilogue change your reading of the earlier “vapor” refrain?"]}],"themesIntro":["從重複詞、互相拉扯的經驗與最後結語入手，讓智慧文學保持真實張力。","Read recurring vocabulary, conflicting experiences, and the epilogue together so wisdom retains its tension."],"themes":[{"refs":"1:2; 12:8","title":["hevel：短暫與難測","Hevel: fleeting and elusive"],"body":["「虛空」比單純「沒有意義」更有層次：生命像氣息，能看見卻抓不牢。這使人謙卑，也促使人珍惜眼前。","Hevel is richer than “meaningless”: life resembles breath, visible yet ungraspable. The metaphor humbles and sharpens attention to the present."],"caution":["不同譯本用「虛空」「無常」「徒勞」等語；比較語境，而非以單一字義解決全書。","Translations differ; use context rather than one gloss to solve the book."]},{"refs":"1:3; 2:18–23; 4:4–8","title":["勞碌、益處與競爭","Work, gain, and rivalry"],"body":["書中反覆問勞碌能留下甚麼，並揭露工作受嫉妒、繼承與死亡制約。工作仍有價值，但不應承擔拯救身份的重負。","The book asks what labor can leave behind and sees its limits under rivalry, inheritance, and death. Work retains value but cannot save identity."],"caution":["不可將批判勞碌簡化為反對學習、職業或努力。","Critique of anxious toil is not a rejection of learning, vocation, or effort."]},{"refs":"2:24; 3:12–13; 5:18–20; 9:7–10","title":["喜樂是恩賜","Joy as gift"],"body":["反覆出現的吃喝、勞碌與愛，並非輕浮逃避，而是在無法控制全局時領受神給人的份。","Repeated meals, work, and love are not frivolous escape; they are portions received when the whole cannot be controlled."],"caution":["不要把享受段落用來要求受苦者立刻開心。","Do not use joy passages to require immediate happiness from someone in pain."]},{"refs":"3:16–17; 8:10–14; 12:13–14","title":["不公與審判","Injustice and judgment"],"body":["傳道者屢次看見公義未得到立即回報；最後的審判盼望讓倫理仍有重量，卻不消除現今行義與保護弱者的責任。","The Teacher repeatedly sees delayed justice; final judgment gives ethics weight without canceling present duties to act justly and protect the vulnerable."],"caution":["不要把終末盼望作為忽略現實傷害的藉口。","Do not use future hope as an excuse to ignore present harm."]},{"refs":"3:11; 7:13–14; 8:17; 11:5","title":["知識的界限","Limits of knowledge"],"body":["人能尋求智慧、辨別較好之路，卻無法掌握神作為的全貌或預報明日。這不是反智，而是反對過度自信。","Humans can seek wisdom and discern better ways, but cannot map all God does or predict tomorrow. This is humility, not anti-intellectualism."],"caution":["承認有限不等於拒絕證據、責任或追問。","Admitting limits does not mean rejecting evidence, responsibility, or inquiry."]},{"refs":"4:1–12; 5:8–9","title":["社會壓迫與共同體","Oppression and community"],"body":["孤單與壓迫不是純粹個人的情緒。傳道者的觀察要求群體看見權力、安慰與互相扶持的結構。","Isolation and oppression are more than private feelings. The observations invite attention to power, comfort, and mutual support."],"caution":["不可只用「要有朋友」回答制度性不義。","Do not answer structural injustice merely with “make friends.”"]}],"pastoral":{"title":["牧養帶領提醒","Pastoral facilitation"],"body":["傳道書適合陪伴失落、過勞與對信仰困惑的人，但課堂不可替受苦者快速下診斷。先聆聽，再讓經文中的疑問與恩賜同時發聲。","Ecclesiastes can accompany loss, burnout, and spiritual perplexity. Do not diagnose a sufferer too quickly; listen first, then let the text’s questions and gifts speak together."]},"lessonsIntro":["建議每課 75–90 分鐘：10 分鐘開場、20 分鐘朗讀觀察、25 分鐘討論與對讀、15 分鐘統整、10 分鐘祈禱或反思。時間可按班級調整。","Suggested 75–90-minute pattern: opening, close reading, comparison, synthesis, and optional prayer or reflection. Adapt timing to the class."],"lessons":[{"refs":"1:1–2:26","title":["第 1 課｜追問「益處」","Lesson 1 | What counts as gain?"],"aim":["建立全書「虛空／益處」問題，辨認傳道者對智慧、享樂與工作的實驗。","Frame the vapor/gain question and trace the tests of wisdom, pleasure, and work."],"flow":[["朗讀 1:1–11，圈出循環與遺忘意象；請學員用自己的話定義「益處」。","Read 1:1–11 and mark cycles and forgotten generations; define “gain” in ordinary language."],["分組比較 2:1–11 與 2:12–23：哪種期待落空？死亡與繼承如何改變評估？","Compare 2:1–11 with 2:12–23: what expectations fail, and how do death and inheritance change the appraisal?"],["以 2:24–26 收束：把享受視為領受，與把成就當作保證有何不同？","Close with 2:24–26: how does received enjoyment differ from achievement as guarantee?"]],"question":["傳道者否定的是工作本身，還是工作能給人永恆保障的想像？","Does the Teacher reject work itself, or the fantasy that work grants permanent security?"],"practice":["請學員寫下一項自己最想用來證明價值的成就，並為感恩與界限禱告。","Invite each student to identify an achievement used to prove worth, then pray about gratitude and limits."]},{"refs":"3:1–22","title":["第 2 課｜時間與看不透的神","Lesson 2 | Time and the God we cannot map"],"aim":["讀懂時序詩、3:11 的張力與對不義的觀察，避免把「定時」當作宿命。","Read the time poem, the tension of 3:11, and the observation of injustice without making timing fatalistic."],"flow":[["兩人交替讀 3:1–8，標出成對對照；問哪些是人能選擇、哪些是人要承受。","Read 3:1–8 antiphonally, marking pairs; ask what is chosen and what is endured."],["討論 3:9–15：神使萬物各按其時，人為何仍不能參透？","Discuss 3:9–15: if God makes things fitting, why can humans not grasp the whole?"],["把 3:16–22 與實際不公連結，練習誠實哀嘆而不急著下結論。","Bring 3:16–22 alongside real injustice and practice honest lament without premature closure."]],"question":["「萬事有時」能否被用來替壓迫辯護？為什麼？","Can “a time for everything” be used to excuse oppression? Why not?"],"practice":["帶領者先聽見學員的失落，再談盼望；不要要求個人公開創傷。","Listen to losses before speaking of hope; do not require anyone to disclose trauma."]},{"refs":"4:1–5:20","title":["第 3 課｜同伴、敬拜與財富","Lesson 3 | Companionship, worship, and wealth"],"aim":["把無人安慰、孤單勞碌、草率敬拜與財富焦慮放在一張圖上。","Connect oppression without comfort, lonely labor, careless worship, and anxious wealth."],"flow":[["讀 4:1–12，畫出「一人」與「兩人」的對比，指出經文談及的不只婚姻。","Read 4:1–12 and contrast one person with two; note that companionship extends beyond marriage."],["讀 5:1–7，列出敬畏神在聽、說和許願上的具體表現。","Read 5:1–7 and list concrete forms of reverence in listening, speech, and vows."],["讀 5:10–20，辨認「增加財產」與「能夠享受」之間的差異。","Read 5:10–20 and distinguish increased possessions from the ability to enjoy."]],"question":["教會如何讓受壓迫或孤單的人有真正的安慰，而非只有勸告？","How can a church offer real comfort to oppressed or lonely people rather than advice alone?"],"practice":["小組各自提出一項可實行的陪伴行動，並設計追蹤方式。","Ask groups to propose one concrete act of companionship and a way to follow through."]},{"refs":"6:1–7:29","title":["第 4 課｜擁有、失去與智慧的邊界","Lesson 4 | Possession, loss, and wisdom’s boundary"],"aim":["辨認「擁有但不能享受」的悖論與 7 章箴言的處境性。","Recognize the paradox of possessing without enjoying and the situational nature of chapter 7’s sayings."],"flow":[["從 6:1–12 記錄傳道者的問題句，讓學員看到未解答之處。","List the questions in 6:1–12 and notice what remains unanswered."],["比較 7:1–6 的喪家與宴樂之地，討論死亡意識如何教導活人。","Compare mourning and feasting in 7:1–6; discuss what mortality awareness teaches."],["把 7:15–20 與約伯記對讀，查驗義惡報應的簡化公式。","Read 7:15–20 beside Job and test simplified reward formulas."]],"question":["7:16 能否作為「少行義」的理由？請用上下文回答。","Can 7:16 justify being less righteous? Answer from its context."],"practice":["討論失落時避免責怪當事人；承認智慧有益卻不能保證結局。","Avoid blame in stories of loss; affirm wisdom’s value without promising outcomes."]},{"refs":"8:1–9:18","title":["第 5 課｜不義、死亡與今日的喜樂","Lesson 5 | Injustice, death, and joy today"],"aim":["在報應延遲、死亡共同性與享受今日的呼喚之間保持張力。","Hold together delayed justice, common mortality, and the call to enjoy the present."],"flow":[["讀 8:10–14，整理傳道者「應當」與「實際」的落差。","Read 8:10–14 and chart expected versus observed outcomes."],["讀 9:1–10，討論死亡意識如何改變人對餐桌、工作與關係的態度。","Read 9:1–10 and ask how mortality reshapes meals, work, and relationships."],["讀 9:11–18，討論機會、意外與被忽略的智慧。","Read 9:11–18 and discuss chance, timing, and neglected wisdom."]],"question":["既然不能保證結果，為何仍要行公義、守誠信？","Why pursue justice and integrity if results cannot be guaranteed?"],"practice":["邀請學員記下一件今日可感謝的人或事，並安排具體回應。","Invite each student to name one gift today and respond to it concretely."]},{"refs":"10:1–11:6","title":["第 6 課｜小愚昧與大行動","Lesson 6 | Small folly and bold responsibility"],"aim":["從領袖、言語與工作預備看智慧；再面對不確定而不癱瘓。","Study wisdom in leadership, speech, and preparation, then act responsibly amid uncertainty."],"flow":[["從 10 章選三個箴言，指出行動、結果與例外；避免做成機械公式。","Choose three proverbs from chapter 10; identify action, consequence, and possible exceptions."],["把 11:1–2 的不同解讀放在一起：慷慨、投資與分散風險共有甚麼倫理核心？","Compare readings of 11:1–2 as generosity, investment, and diversification."],["討論 11:4–6：何時等待是謹慎，何時成為逃避？","Discuss 11:4–6: when is waiting prudence, and when is it avoidance?"]],"question":["在不確定中，何種行動既有勇氣又有責任感？","What action is both courageous and responsible amid uncertainty?"],"practice":["用一個小型行動計畫收尾：目標、下一步、風險與所需同伴。","Close with a small action plan: aim, next step, risks, and companions."]},{"refs":"11:7–12:8","title":["第 7 課｜青春、衰老與記念造主","Lesson 7 | Youth, aging, and remembrance"],"aim":["讀懂喜樂與審判並列，以及 12 章衰老詩的整體力量。","Read joy alongside accountability and hear the aging poem as a whole."],"flow":[["朗讀 11:7–10，討論喜樂、除愁和向神交帳如何彼此約束。","Read 11:7–10 and discuss how joy, care, and accountability belong together."],["慢讀 12:1–7，讓學員自由指出意象帶來的情緒，而不急著逐一解碼。","Read 12:1–7 slowly; invite responses to the images before decoding them."],["回到 12:8 與 1:2，辨認首尾框架。","Compare 12:8 with 1:2 and identify the book’s framing refrain."]],"question":["記念造主是否只屬年輕人？經文如何向不同年齡說話？","Is remembering the Creator only for the young? How does the text address every age?"],"practice":["對年長、病弱或哀傷者使用尊重語言，避免把衰老比喻當成羞辱。","Use respectful language with older or grieving participants; do not turn aging imagery into shame."]},{"refs":"12:9–14; 全書回顧","title":["第 8 課｜結語、敬畏與整卷統整","Lesson 8 | Epilogue, reverence, and synthesis"],"aim":["分清傳道者與編者聲音，從全書困惑走向有根據的敬畏與倫理行動。","Distinguish the Teacher and the frame narrator, moving from honest perplexity toward reverence and ethical action."],"flow":[["辨認 12:9–12 對傳道者智慧言語的評價：刺痛、引導，也有閱讀界限。","Identify how 12:9–12 assesses the Teacher’s words: painful, guiding, and not limitless."],["把 12:13–14 與 3:16–17、8:14 並讀，討論神審判如何回應人看見的不公。","Compare 12:13–14 with 3:16–17 and 8:14; ask how judgment addresses observed injustice."],["學員用一句話完成全書摘要，並指出一個自己仍不明白的問題。","Have students write a one-sentence whole-book summary and name one unresolved question."]],"question":["敬畏神如何避免變成掩蓋問題的口號？","How can fear of God avoid becoming a slogan that hides hard questions?"],"practice":["課末邀請安靜默想與互相代禱；不強迫說出私人經歷。","End with quiet reflection and optional prayer without demanding personal disclosure."]}],"questionsIntro":["先請學員指出經文依據，再討論應用；若涉及失落、創傷或財務壓力，尊重分享界限。","Ask for textual evidence before application. Respect boundaries when loss, trauma, or financial pressure arises."],"extraQuestions":[["「虛空」若是短暫與難測，而非毫無價值，整卷書的語氣會如何改變？","How does the book change if vapor means fleeting and elusive rather than simply worthless?"],["傳道書的喜樂段落是否與它的悲觀觀察矛盾？請指出兩處經文。","Do the joy passages contradict the bleak observations? Support your answer with two texts."],["與約伯記和箴言一起讀時，智慧、苦難與公平的關係有何改變？","How do Job and Proverbs reshape Ecclesiastes’ treatment of wisdom, suffering, and fairness?"],["12:13–14 的審判盼望如何促進當下公義，而不是拖延它？","How can the judgment hope of 12:13–14 motivate present justice instead of postponing it?"]],"sourceNote":["本站提供原創摘要與教學建議，不轉載任何譯本的完整經文。中文經文連結預設新標點和合本（神版），英文連結預設 NASB 2020。章節詮釋請回到完整經文核對。","Original summaries and teaching notes only; no full translation is reproduced. Chinese links default to CUNP (Shen edition), English to NASB 2020. Check interpretations against the full text."],"sources":[{"title":["BibleProject：傳道書導讀","BibleProject: Guide to Ecclesiastes"],"url":"https://bibleproject.com/guides/book-of-ecclesiastes/"},{"title":["BibleProject：智慧文學系列","BibleProject: Wisdom series"],"url":"https://bibleproject.com/videos/collections/wisdom/"}],"footer":["傳道書研讀 · 原創逐章摘要與成人主日學教師教案","Ecclesiastes study · original chapter notes and adult class plans"],"pdfFiles":[{"file":"舊約縱覽-29_傳道書.pdf","title":["大衛鮑森舊約縱覽｜傳道書 · PDF ↗","David Pawson’s Old Testament Survey | Ecclesiastes · PDF ↗"]}]};</script><script src="../assets/book-study.js?v=20261103-language" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
