<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="申命記成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>申命記｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"DEU","category":["摩西五經 · TORAH","TORAH · PENTATEUCH"],"name":["申命記","Deuteronomy"],"subtitle":["摩西在摩押平原向新一代重述曠野路程與盟約：聽、愛、記念、公義與選擇生命是進入土地前的核心呼召。","On Moab’s plains Moses retells the journey and covenant to a new generation: hear, love, remember, pursue justice, and choose life."],"overviewIntro":["摩西在摩押平原向新一代重述曠野路程與盟約：聽、愛、記念、公義與選擇生命是進入土地前的核心呼召。","On Moab’s plains Moses retells the journey and covenant to a new generation: hear, love, remember, pursue justice, and choose life."],"lengthNote":["34 章；請按文學單元和整卷脈絡閱讀。","34 chapters; read each literary unit within the whole book."],"thesis":["把聽見化為愛與公義","Turn hearing into love and justice"],"thesisDetail":["這卷書把出埃及、曠野與即將入地的生活連成講論；律法不只管理儀式，也限制君王並保護寄居者與窮人。","The speeches join exodus, wilderness, and life in the land; Torah shapes worship, limits kings, and protects immigrants and the poor."],"keyQuestion":["下一代如何把承受的故事活成自己的約？","How does a new generation make an inherited covenant its own?"],"keyAnswer":["摩西反覆要求聽、愛與教導；每一代都要在新的土地與權力處境中重新回應。","Moses repeatedly calls for hearing, loving, and teaching; each generation responds amid new land and power."],"finalMovement":["摩西看見土地卻未進入，約書亞承接；五經以未完成的路收尾，邀請讀者進入約書亞記。","Moses sees but does not enter; Joshua succeeds. The Torah ends with an unfinished road into Joshua."],"readingKeys":[{"refs":"1:1–5; 5:1–3","title":["向下一代說話","Addressing a new generation"],"body":["摩西重述過去，使未親歷西奈的人也成為約的聽者。","Moses retells the past so those who did not experience Sinai become covenant hearers."]},{"refs":"6:4–9; 11:18–21","title":["聽與愛","Hearing and love"],"body":["示瑪把全心忠誠放進家庭教導、日常路途與群體記憶。","The Shema puts wholehearted loyalty into home, journey, and communal memory."]},{"refs":"10:17–19; 15; 24","title":["寄居者與窮人","Immigrants and the poor"],"body":["出奴的記憶要求公義對待無地者、寡婦與欠債者。","Memory of slavery demands justice for landless people, widows, and debtors."]},{"refs":"17:14–20; 31:9–13","title":["權力受律法限制","Power under Torah"],"body":["王須讀律法，百姓亦須定期公開聆聽。","The king reads Torah, and the whole people hears it publicly."]}],"mapIntro":["以下分段是教學導覽，章界有助查找，並非每一段論述的天然邊界。","These movements guide study; chapter divisions are useful but do not always mark a natural literary boundary."],"movements":[{"refs":"1–4","title":["回望旅程","Looking back"],"body":["摩西以曠野失敗、邊界與神的憐憫教導下一代。","Moses teaches a new generation through wilderness failure, boundaries, and mercy."]},{"refs":"5–11","title":["聽、愛與記念","Hear, love, and remember"],"body":["十誡與示瑪把愛神、教導兒女和照顧寄居者連成生活。","Commandments and Shema join love, teaching, and care for immigrants."]},{"refs":"12–16","title":["敬拜、分享與節期","Worship, sharing, and festivals"],"body":["選定敬拜場所、豁免債務與公共節期塑造群體。","Central worship, debt release, and festivals shape communal life."]},{"refs":"17–20","title":["領袖與司法、戰爭","Leaders, courts, and war"],"body":["君王受律法約束，先知與法庭也須辨識；戰爭條文提出難題。","Kings are under Torah; prophets, courts, and war rules demand discernment."]},{"refs":"21–26","title":["日常生活中的公義","Justice in daily life"],"body":["家庭、工價、市場與收成都要顧及弱者。","Household, wages, markets, and harvest must consider the vulnerable."]},{"refs":"27–30","title":["約的選擇與歸回","Covenant choice and return"],"body":["公開宣讀祝福警告，卻在流散可能中留下歸回與生命之選。","Public blessings and warnings still leave a path of return and life."]},{"refs":"31–34","title":["交接、詩歌與摩西之死","Succession, song, and Moses’ death"],"body":["約書亞、公開讀經、詩歌與祝福讓使命越過摩西個人生命。","Joshua, public reading, song, and blessing carry the vocation beyond Moses."]}],"mapCaution":{"title":["讀法提醒","Reading caution"],"body":["先觀察敘事與律法在各自的歷史、文學脈絡中如何運作，再進入神學比較與今日應用。","Observe how narrative and instruction work in their historical and literary contexts before drawing theological comparisons or present-day applications."]},"chaptersIntro":["每章有摘要、兩個深入重點、詮釋提醒與課堂提問。章名與分段是本站的研讀提示。","Each chapter has a summary, two close-reading points, an interpretive caution, and a teaching question. Titles and divisions are study aids."],"chapters":[{"n":1,"refs":"1","title":["從何烈到加低斯的回顧","From Horeb to Kadesh"],"summary":["摩西向新一代回顧設立審判官與探子事件，說明拒入土地如何改變上一代命運。","Moses recalls appointed judges and the scouts, explaining the first generation’s refusal to enter."],"deep":[["摩西重述不是逐字複製民數記，而是為新一代勸勉","Moses’ retelling interprets the past for a new generation"],["分擔審判工作與入地判斷同屬領導責任","Shared judging and entry decisions both concern leadership"]],"caution":["摩西的回顧是帶有勸勉目的的重述；與前四卷差異值得並讀，不必硬抹平。","Moses retells events for exhortation; compare differences with the earlier books rather than flattening them."],"question":["重述失敗歷史如何避免只變成指責？","How can retelling failure teach rather than only blame?"]},{"n":2,"refs":"2","title":["繞過鄰國與逐步前行","Passing neighboring lands"],"summary":["摩西回顧繞行以東、摩押、亞捫，並與西宏交戰，顯示旅途含限制與衝突。","Moses recalls bypassing Edom, Moab, and Ammon before conflict with Sihon."],"deep":[["神限定某些鄰國土地不可奪取","Some neighboring lands are explicitly off limits"],["上一代消逝與新一代前進並列","The old generation’s passing accompanies new movement"]],"caution":["摩西的回顧是帶有勸勉目的的重述；與前四卷差異值得並讀，不必硬抹平。","Moses retells events for exhortation; compare differences with the earlier books rather than flattening them."],"question":["界線如何限制群體對土地的渴望？","How do boundaries restrain a people’s desire for land?"]},{"n":3,"refs":"3","title":["河東戰事與摩西不得入地","Eastern battles and Moses’ limit"],"summary":["摩西回顧戰勝噩、分河東土地，並把帶領責任交給約書亞；他自己不能入地。","Moses recalls defeat of Og, eastern allotments, and Joshua’s commissioning while acknowledging he cannot enter."],"deep":[["河東支派得地仍需與其他支派同行","Eastern tribes’ land includes shared obligation"],["摩西與約書亞交接使盼望不繫於一人","Succession keeps hope from depending on one person"]],"caution":["摩西的回顧是帶有勸勉目的的重述；與前四卷差異值得並讀，不必硬抹平。","Moses retells events for exhortation; compare differences with the earlier books rather than flattening them."],"question":["好領袖如何面對自己不能完成的工作？","How does a good leader face unfinished work?"]},{"n":4,"refs":"4","title":["記念、禁止偶像與歸回","Remember, resist idols, return"],"summary":["摩西要求記念西奈經歷，不雕刻神像；即使流散，尋求神仍有歸回盼望。","Moses calls Israel to remember Sinai and reject images; even after scattering, seeking God remains possible."],"deep":[["神在火中說話而無可見形像，是禁偶像論據","The voice without a visible form grounds the image ban"],["警告流散之後仍留神憐憫的可能","Scattering warnings retain a path of mercy"]],"caution":["摩西的回顧是帶有勸勉目的的重述；與前四卷差異值得並讀，不必硬抹平。","Moses retells events for exhortation; compare differences with the earlier books rather than flattening them."],"question":["記念過去如何幫助下一代不製造偶像？","How can memory resist idol-making?"]},{"n":5,"refs":"5","title":["十誡重述與中保","Commandments retold"],"summary":["摩西重述十誡，提醒新一代自己也站在約中；百姓因火與聲音而求摩西作中保。","Moses retells the commandments as a present covenant; the people seek mediation after hearing the voice and seeing fire."],"deep":[["安息日理由在此連到出奴之家","Sabbath here recalls release from slavery"],["重述的措辭與出埃及記有差異，值得並讀","Wording differs from Exodus and invites comparison"]],"caution":["摩西的回顧是帶有勸勉目的的重述；與前四卷差異值得並讀，不必硬抹平。","Moses retells events for exhortation; compare differences with the earlier books rather than flattening them."],"question":["重述誡命如何讓新一代成為當事人？","How does retelling make a new generation participants?"]},{"n":6,"refs":"6","title":["以色列啊，你要聽","Hear, O Israel"],"summary":["示瑪宣告獨一的主，要求全心愛神，並在家中、路上與日常物件中教導下一代。","The Shema calls for wholehearted love of the one Lord and teaching across home and journey."],"deep":[["「聽」包含回應與遵行，不是單純聲音接收","Hearing includes response, not sound reception alone"],["日常教導將信仰從節期帶進家庭","Daily teaching takes faith beyond festivals"]],"caution":["摩西的回顧是帶有勸勉目的的重述；與前四卷差異值得並讀，不必 ,"question":["歷史記憶如何避免成為自我稱義？","How can historical memory resist self-righteousness?"]},{"n":10,"refs":"10","title":["新法版與愛寄居者","New tablets and love for the immigrant"],"summary":["新法版與利未人職分被重述，摩西問百姓當敬畏、愛神並愛寄居者。","Moses recalls renewed tablets and Levite service, then calls Israel to revere God and love the immigrant."],"deep":[["神不受賄也為孤兒寡婦伸冤","God takes no bribe and defends orphan and widow"],["愛寄居者的理由是「你們在埃及作過寄居的」","Immigrant love rests on Israel’s own history"]],"caution":["摩西的回顧是帶有勸勉目的的重述；與前四卷差異值得並讀，不必硬抹平。","Moses retells events for exhortation; compare differences with the earlier books rather than flattening them."],"question":["敬畏神為何應表現在對寄居者的態度？","Why should reverence for God show in treatment of immigrants?"]},{"n":11,"refs":"11","title":["擺在面前的祝福與警告","Blessing and warning ahead"],"summary":["摩西以過去的神蹟、將入之地的雨水與兩山宣告，催促百姓愛神並記念命令。","Moses recalls past acts, describes rain-dependent land, and sets blessing and warning before Israel."],"deep":[["埃及灌溉與迦南倚雨形成土地對照","Egyptian irrigation contrasts with rain-dependent land"],["家庭教導再次與公共選擇相連","Home teaching connects with public choice"]],"caution":["摩西的回顧是帶有勸勉目的的重述；與前四卷差異值得並讀，不必硬抹平。","Moses retells events for exhortation; compare differences with the earlier books rather than flattening them."],"question":["日常環境如何塑造信任與感恩？","How does environment shape trust and gratitude?"]},{"n":12,"refs":"12","title":["選定敬拜之處","The chosen place of worship"],"summary":["入地後須拆除偶像場所，在神所選之處獻祭；日常食肉與血的禁令亦被區分。","Israel must reject local shrines and sacrifice at a chosen place, distinguishing ordinary meals from sacrificial acts."],"deep":[["集中敬拜為防止混雜與任意獻祭","Centralization limits mixed and casual worship"],["對日常食肉的放寬與禁食血並列","Ordinary meat is permitted while blood remains restricted"]],"caution":["古代盟約律法與戰爭條文須有歷史與倫理辨析；不能作今日宗教暴力的直接命令。","Ancient covenant law and war rules require historical and ethical discernment, not direct modern religious violence."],"question":["敬拜制度如何保護群體又可能產生新權力？","How can central worship protect and also concentrate power?"]},{"n":13,"refs":"13","title":["假先知與忠誠試驗","False prophets and loyalty"],"summary":["即使有神蹟或親密關係的勸誘，也不可隨從別神；刑罰條文顯得格外嚴苛。","Even impressive signs or close relatives must not draw Israel to other gods; penalty clauses are severe."],"deep":[["神蹟不能單獨作真理判準","Signs alone do not establish truth"],["嚴刑屬古代盟約社會，不可用作今日宗教暴力","Ancient penalties cannot justify religious violence today"]],"caution":["古代盟約律法與戰爭條文須有歷史與倫理辨析；不能作今日宗教暴力的直接命令。","Ancient covenant law and war rules require historical and ethical discernment, not direct modern religious violence."],"question":["如何檢驗有吸引力的屬靈宣稱？","How can attractive spiritual claims be tested?"]},{"n":14,"refs":"14","title":["飲食、十分之一與窮人","Food, tithe, and poor"],"summary":["潔淨飲食形成群體生活；十分之一的用法兼顧節期歡慶、利未人與貧乏者。","Food rules shape communal identity; tithes support festivals, Levites, and vulnerable people."],"deep":[["飲食界線有身分功能，不等於食物本身邪惡","Food boundaries mark identity, not intrinsic evil"],["分享食物和照顧窮人屬敬拜一部分","Sharing food and care belong to worship"]],"caution":["古代盟約律法與戰爭條文須有歷史與倫理辨析；不能作今日宗教暴力的直接命令。","Ancient covenant law and war rules require historical and ethical discernment, not direct modern religious violence."],"question":["喜樂的節期如何包含沒有土地的人？","How can festivals include the landless?"]},{"n":15,"refs":"15","title":["豁免年、開手與釋放奴僕","Debt release and openhandedness"],"summary":["第七年豁免債務，對窮人不可硬心；希伯來奴僕得釋放時也須帶著供應。","Debt release and openhanded aid are commanded; released Hebrew servants are to leave with provision."],"deep":[["「你們中間不應有窮人」與「窮人常有」並列，呼召持續行動","The vision of no poor and the reality of ongoing poverty create obligation"],["釋放需要資源，不只是口頭許可","Release requires resources, not words alone"]],"caution":["古代盟約律法與戰爭條文須有歷史與倫理辨析；不能作今日宗教暴力的直接命令。","Ancient covenant law and war rules require historical and ethical discernment, not direct modern religious violence."],"question":["怎樣的釋放才真正使人能重新生活？","What kind of release enables a real new start?"]},{"n":16,"refs":"16","title":["節期與公正審判","Festivals and just judges"],"summary":["逾越節、七七節、住棚節召集群體；章末要求審判官不可受賄、不可屈枉正直。","Passover, Weeks, and Booths gather the community; judges must reject bribes and pursue justice."],"deep":[["節慶的歡樂要包含寄居者、孤兒與寡婦","Festive joy includes immigrant, orphan, and widow"],["「公義，公義」讓敬拜連到司法","Justice belongs beside worship"]],"caution":["古代盟約律法與戰爭條文須有歷史與倫理辨析；不能作今日宗教暴力的直接命令。","Ancient covenant law and war rules require historical and ethical discernment, not direct modern religious violence."],"question":["熱鬧的節期如何不遮蔽法庭的不公？","How can festivals avoid hiding courtroom injustice?"]},{"n":17,"refs":"17","title":["審判與王權的限制","Judgment and restrained kingship"],"summary":["難判案件交給指定權威，王不可多馬、多妻、多金銀，須抄寫並讀律法。","Hard cases go to appointed authorities; the king must limit horses, wives, and wealth and read the law."],"deep":[["申命記不把王置於律法之上","The king is under rather than above Torah"],["大量馬匹與埃及往返連到權力依賴的危險","Horses and return to Egypt evoke risky dependencies"]],"caution":["古代盟約律法與戰爭條文須有歷史與倫理辨析；不能作今日宗教暴力的直接命令。","Ancient covenant law and war rules require historical and ethical discernment, not direct modern religious violence."],"question":["領袖如何以閱讀律法限制自己的權力？","How might regular reading restrain a leader’s power?"]},{"n":18,"refs":"18","title":["利未人、占卜與先知","Levites, divination, and prophets"],"summary":["利未人得群體供應；摩西警告占卜術，並說神將興起像他的先知。","Levites receive support; Moses rejects divination and announces a prophet like him."],"deep":[["沒有產業的利未人仍須得供應","Landless Levites need material support"],["辨認先知不能只看口才或神祕感","Prophets require discernment beyond eloquence or mystique"]],"caution":["古代盟約律法與戰爭條文須有歷史與倫理辨析；不能作今日宗教暴力的直接命令。","Ancient covenant law and war rules require historical and ethical discernment, not direct modern religious violence."],"question":["群體如何辨認既有權柄又可受檢驗的話語？","How can authoritative speech remain testable?"]},{"n":19,"refs":"19","title":["逃城、地界與證人","Refuge, boundaries, and witnesses"],"summary":["逃城區分故殺與誤殺；不可移地界，也不可憑單一證人判罪。","Refuge cities distinguish murder from accidental killing; landmarks and multiple witnesses guard justice."],"deep":[["逃城限制報復卻不取消審判","Refuge limits revenge without canceling judgment"],["不移地界保護鄰舍的生計與產權","Landmark rules protect a neighbor’s livelihood"]],"caution":["古代盟約律法與戰爭條文須有歷史與倫理辨析；不能作今日宗教暴力的直接命令。","Ancient covenant law and war rules require historical and ethical discernment, not direct modern religious violence."],"question":["對死者與被告都公平需要甚麼程序？","What process serves both victims and accused?"]},{"n":20,"refs":"20","title":["戰爭規範與難題","War rules and difficult questions"],"summary":["戰前有豁免與求和條款，對近遠城邑作不同處理；毀滅命令形成倫理難題。","Exemptions and peace offers precede war, but different treatment of cities and destruction commands pose moral problems."],"deep":[["新屋、葡萄園與新婚豁免使人的生活不被戰爭全吞沒","Exemptions protect ordinary life from total militarization"],["古代戰爭命令不可轉成今日軍事正當化","Ancient commands are no warrant for modern campaigns"]],"caution":["古代盟約律法與戰爭條文須有歷史與倫理辨析；不能作今日宗教暴力的直接命令。","Ancient covenant law and war rules require historical and ethical discernment, not direct modern religious violence."],"question":["如何誠實面對文本中的毀滅語言？","How can readers face language of destruction honestly?"]},{"n":21,"refs":"21","title":["無名死者、戰俘與家法","Unknown victim, captive, and household law"],"summary":["無名兇案、女戰俘、長子權利與頑梗兒子等案例使群體面對司法及家戶權力。","Cases about an unsolved killing, captive woman, firstborn rights, and a rebellious son expose public and household power."],"deep":[["無名死者的血不能被當作無人負責","An unknown victim still demands public responsibility"],["女戰俘與兒子的處境顯示古代法仍有嚴重倫理張力","Captive women and sons expose hard ethical tensions"]],"caution":["家戶、性與財產法反映古代權力結構；不可用經文傷害弱勢者。","Household, sexual, and property law reflect ancient power structures; do not use them to harm vulnerable people."],"question":["古代法的限制措施與今日人權如何區分？","How do ancient legal limits differ from present human rights?"]},{"n":22,"refs":"22","title":["失物、屋頂與性法","Lost property, roof safety, and sexual law"],"summary":["失物須歸還，屋頂要設欄杆；後半婚姻與性犯罪案例需要注意證據與權力。","Lost property must be returned and roofs made safe; later sexual cases demand attention to evidence and power."],"deep":[["欄杆要求預防可避免的傷害","A parapet prevents foreseeable harm"],["性案例中的女子處境各異，不可混為一談或羞辱受害者","The women in sexual cases occupy different situations and must not be conflated"]],"caution":["家戶、性與財產法反映古代權力結構；不可用經文傷害弱勢者。","Household, sexual, and property law reflect ancient power structures; do not use them to harm vulnerable people."],"question":["生活中的安全責任與公義如何連結？","How do everyday safety and justice connect?"]},{"n":23,"refs":"23","title":["營地、逃奴、利息與許願","Camp, escaped slaves, loans, and vows"],"summary":["營中潔淨、逃奴庇護、不可向弟兄取利與守願等規定並列。","Camp sanitation, shelter for escaped slaves, lending, and keeping vows appear together."],"deep":[["不可把逃奴交還主人，是值得特別注意的保護條款","The escaped-slave protection deserves close attention"],["衛生規定顯示神同在也關乎營地日常","Sanitation connects divine presence with daily camp life"]],"caution":["家戶、性與財產法反映古代權力結構；不可用經文傷害弱勢者。","Household, sexual, and property law reflect ancient power structures; do not use them to harm vulnerable people."],"question":["一個群體如何讓求庇護者真正安全？","How can a community make refuge genuinely safe?"]},{"n":24,"refs":"24","title":["婚姻、工價與弱者權利","Marriage, wages, and vulnerable people"],"summary":["離婚、抵押與工價規定之後，收割需留給寄居者、孤兒與寡婦。","Divorce, pledges, and timely wages lead into harvest rights for immigrants, orphans, and widows."],"deep":[["不可拿磨石作抵押，因那是維生工具","A millstone cannot be pledged because it sustains life"],["「你在埃及作過奴僕」再次成為弱者保護理由","Former slavery again grounds protection"]],"caution":["家戶、性與財產法反映古代權力結構；不可用經文傷害弱勢者。","Household, sexual, and property law reflect ancient power structures; do not use them to harm vulnerable people."],"question":["律法如何保護人不失去維生能力？","How does law prevent loss of livelihood?"]},{"n":25,"refs":"25","title":["公平尺度與家族承續","Fair measures and family continuity"],"summary":["杖責限度、牛踹穀、兄弟娶寡嫂及公平法碼，將權利與羞辱問題放入日常經濟。","Limits on lashes, care for threshing oxen, levirate marriage, and honest weights address economy and kinship."],"deep":[["公平法碼反對交易中的隱性剝削","Honest weights resist hidden exploitation"],["寡嫂婚姻制度需按古代繼承與女性處境討論","Levirate rules require attention to ancient inheritance and women’s position"]],"caution":["家戶、性與財產法反映古代權力結構；不可用經文傷害弱勢者。","Household, sexual, and property law reflect ancient power structures; do not use them to harm vulnerable people."],"question":["公平不只在法庭，也在市場如何體現？","How does justice operate in markets as well as courts?"]},{"n":26,"refs":"26","title":["初熟果子與十分之一宣認","Firstfruits and tithe confession"],"summary":["獻初熟果子時重述從流亡、受壓到得地的故事；十分之一要照顧利未人與弱者。","Firstfruits prompt a story from wandering and oppression to land; tithes support Levites and vulnerable neighbors."],"deep":[["敬拜中的「我祖原是一個將亡的亞蘭人」把私人收成放進群體記憶","The firstfruit confession joins personal harvest to shared history"],["奉獻要能說明是否照顧無地者","Giving is tested by care for landless people"]],"caution":["家戶、性與財產法反映古代權力結構；不可用經文傷害弱勢者。","Household, sexual, and property law reflect ancient power structures; do not use them to harm vulnerable people."],"question":["我們的感恩如何包括那些沒能收穫的人？","How can gratitude include those without a harvest?"]},{"n":27,"refs":"27","title":["石碑、祭壇與咒詛","Stones, altar, and curses"],"summary":["入地後要立石記律法，在山上宣讀咒詛，公開宣示群體行為的界線。","Israel is to inscribe the law on stones and speak curses publicly, making communal boundaries visible."],"deep":[["寫在石上讓律法可公開閱讀","Inscription makes law publicly accessible"],["多項咒詛關注暗中侵害弱者與顛倒公義","Many curses target hidden harm to vulnerable people"]],"caution":["祝福咒詛與摩西之死屬群體盟約敘事；不可用來直接診斷個人疾病或災難。","Blessings, curses, and Moses’ death belong to a communal covenant narrative, not diagnosis of individual illness or disaster."],"question":["公開宣讀如何補足私人良心？","How can public reading support individual conscience?"]},{"n":28,"refs":"28","title":["祝福與長篇咒詛","Blessings and extended curses"],"summary":["遵行與背約的群體後果以極不對稱篇幅描述；飢荒、圍城與被擄畫出恐怖未來。","Blessings and much longer curses describe communal consequences, including siege, famine, and exile."],"deep":[["咒詛篇幅與語氣為震動集體聽眾","The long warning aims to shake a people"],["不可把每個現代災難歸因於受害者不順服","Do not blame every modern disaster on victims’ disobedience"]],"caution":["祝福咒詛與摩西之死屬群體盟 s, and Moses’ death belong to a communal covenant narrative, not diagnosis of individual illness or disaster."],"question":["如何讓一代人的信仰知識不依賴單一領袖？","How can knowledge outlast one leader?"]},{"n":32,"refs":"32","title":["摩西之歌與記憶警告","Song of Moses and warning memory"],"summary":["詩歌回顧神的信實與以色列的偏離，將審判、憐憫與列國放在一幅宏大圖像中。","The song recalls divine faithfulness and Israel’s deviation, framing judgment and mercy among the nations."],"deep":[["詩歌以磐石、鷹與荒野意象教人記憶","Rock, eagle, and wilderness imagery teach memory"],["詩句有強烈戰爭語言，不能單作現代政治預測","War language is not a modern political forecast"]],"caution":["祝福咒詛與摩西之死屬群體盟約敘事；不可用來直接診斷個人疾病或災難。","Blessings, curses, and Moses’ death belong to a communal covenant narrative, not diagnosis of individual illness or disaster."],"question":["詩歌比條文更能讓甚麼被記住？","What can song preserve that a legal code may not?"]},{"n":33,"refs":"33","title":["摩西祝福各支派","Moses blesses the tribes"],"summary":["摩西臨終為支派祝福，各支派獲不同意象；全章以神作以色列庇護結束。","Moses blesses the tribes with varied images, ending with God as Israel’s refuge."],"deep":[["各支派不是完全相同，祝福保留差異","The tribes retain distinct roles and images"],["與創世記 49 章雅各祝福可比較異同","Jacob’s blessings in Genesis 49 invite comparison"]],"caution":["祝福咒詛與摩西之死屬群體盟約敘事；不可用來直接診斷個人疾病或災難。","Blessings, curses, and Moses’ death belong to a communal covenant narrative, not diagnosis of individual illness or disaster."],"question":["群體祝福如何容納不同角色而非追求一致？","How can communal blessing honor difference?"]},{"n":34,"refs":"34","title":["摩西之死與未完成的路","Moses dies before entry"],"summary":["摩西從尼波山看見土地而未進入；約書亞承接領導，敘事追念摩西的獨特地位。","Moses sees the land from Nebo but does not enter; Joshua succeeds, and the narrative remembers Moses’ distinct role."],"deep":[["看見卻未得到，讓全書帶著未完成感","Seeing without entering keeps the ending open"],["領袖之死與新一代前行並列，故事不止於一人","A leader’s death and a people’s future stand together"]],"caution":["祝福咒詛與摩西之死屬群體盟約敘事；不可用來直接診斷個人疾病或災難。","Blessings, curses, and Moses’ death belong to a communal covenant narrative, not diagnosis of individual illness or disaster."],"question":["未完成的使命如何交給下一代？","How can an unfinished vocation be passed on?"]}],"themesIntro":["以下主題橫跨全書；先讀完整經文，再比較各段的不同聲音。","These themes run through the book; read full passages before comparing their distinct voices."],"themes":[{"refs":"5–6; 11","title":["愛神與日常教導","Love of God and daily teaching"],"body":["愛不是抽象感覺，而包含聽、回應與代際講述。","Love is not only feeling; it includes hearing, response, and intergenerational teaching."],"caution":["教導下一代不可只靠強迫背誦。","Teaching the next generation requires more than coercive memorization."]},{"refs":"8–10; 26","title":["記念與謙卑","Memory and humility"],"body":["嗎哪、金牛犢與初熟果子使富足者不忘依賴與過錯。","Manna, the calf, and firstfruits challenge prosperous self-sufficiency."],"caution":["回顧失敗不應成為羞辱後代。","Remembering failure need not shame later generations."]},{"refs":"12–16; 24","title":["分享與弱者保護","Sharing and protection"],"body":["節期、豁免、工價與留穗把敬拜落實於資源分配。","Festivals, release, wages, and gleaning make worship a matter of resources."],"caution":["古代制度不可跳過脈絡直接套到現代。","Ancient institutions need context before modern use."]},{"refs":"17–20; 27–30","title":["權力、公義與選擇","Power, justice, and choice"],"body":["君王受限、司法求證、公共宣讀與選擇生命共同塑造盟約政治。","Bounded kingship, evidence, public reading, and choosing life shape covenant politics."],"caution":["戰爭與刑罰條文不能授權今日暴力。","War and penalty rules do not authorize violence today."]}],"pastoral":{"title":["教師帶領提醒","Teaching care"],"body":["不要把古代敘事中的暴力、奴役或排斥直接當成今日的規範；讓學員辨認文本描述、神學評價與當代應用的距離。","Do not treat ancient violence, enslavement, or exclusion in narratives as direct present-day norms. Help learners distinguish description, theological evaluation, and application."]},"lessonsIntro":["八課可按班級時數拆分；每課先讀指定經文，再用問題引導觀察、討論與應用。","These eight lessons can be divided further; read the assigned text before observation, discussion, and application."],"lessons":[{"refs":"1–4","title":["第 1 課｜重述路程","Lesson 1 | Retelling the road"],"aim":["看摩西如何向新一代解釋失敗、限制與盼望。","See how Moses teaches failure, boundaries, and hope."],"flow":[["比較 1 章與民數記 13–14 章。","Compare chapter 1 with Numbers 13–14. "],["找出 2–3 章的土地界線與接班。","Find land limits and succession in chapters 2–3. "],["讀 4 章的禁偶像與歸回。","Read chapter 4 for image ban and return."]],"question":["重述歷史如何形塑下一代？","How does retelling form a new generation?"],"practice":["差異可作詮釋而非錯誤簡化。","Treat retelling differences as interpretation, not something to erase."]},{"refs":"5–6","title":["第 2 課｜十誡與示瑪","Lesson 2 | Commandments and Shema"],"aim":["連結拯救、聽命與全心愛神。","Connect rescue, responsive hearing, and love."],"flow":[["並讀出 20 與申 5 的安息日理由。","Compare Sabbath reasons in Exodus 20 and Deuteronomy 5. "],["慢讀 6:4–9，標出聽、愛、教導。","Mark hear, love, and teach in 6:4–9. "],["討論家庭與公共生活的實踐。","Discuss home and public life."]],"question":["愛神如何在聽與行動中被看見？","How is love visible in hearing and action?"],"practice":["不要把示瑪縮成只需背的口號。","Do not reduce the Shema to a slogan."]},{"refs":"7–11","title":["第 3 課｜揀選、富足與記憶","Lesson 3 | Election, abundance, memory"],"aim":["辨認揀選不等於自義，並關注寄居者。","See election without self-righteousness and care for immigrants."],"flow":[["讀 7 章，區分愛與優越感。","Read chapter 7 for love versus superiority. "],["讀 8–9 章，比較嗎哪與金牛犢。","Compare manna and calf in chapters 8–9. "],["讀 10:17–19，討論對寄居者的愛。","Discuss immigrant love in 10:17–19."]],"question":["富足為何更需要記念？","Why does abundance require memory?"],"practice":["7 章戰爭語言不可作今日暴力命令。","Chapter 7 war language cannot authorize present violence."]},{"refs":"12–16","title":["第 4 課｜敬拜與分享","Lesson 4 | Worship and sharing"],"aim":["觀察敬拜集中、豁免年與節期的共同倫理。","Read central worship, release, and festivals together."],"flow":[["讀 12 章，問為何指定敬拜之處。","Ask about the chosen place in chapter 12. "],["讀 15 章，討論債務、窮人與釋奴。","Discuss debt, poverty, and release in chapter 15. "],["讀 16 章，找出節期與公正審判的連結。","Join festivals and courts in chapter 16."]],"question":["節期如何成為弱者也能參與的喜樂？","How can festivals include the vulnerable?"],"practice":["13 章刑罰條文不可直接施於今日。","Do not apply chapter 13 penalties today."]},{"refs":"17–20","title":["第 5 課｜權力受約束","Lesson 5 | Power under limits"],"aim":["從王、先知、法庭和戰爭看權力的界線。","Study limits on kings, prophets, courts, and war."],"flow":[["列出 17 章君王不可累積的事物。","List royal accumulation limits in chapter 17. "],["讀 18–19 章，比較先知辨識與證人要求。","Compare prophets and witnesses in chapters 18–19. "],["讀 20 章，面對戰爭條文的倫理難處。","Face the moral difficulty of chapter 20."]],"question":["權力如何透過文本和程序受限制？","How can texts and process restrain power?"],"practice":["不以古代毀滅命令合理化今日戰爭。","Do not justify modern war through ancient destruction commands."]},{"refs":"21–26","title":["第 6 課｜日常公義","Lesson 6 | Everyday justice"],"aim":["從家庭、工價、失物與收成看公義。","Read justice in households, wages, lost goods, and harvest."],"flow":[["分組選 22–25 章一條法例，說明所處問題。","Choose one case from chapters 22–25 and name the problem. "],["找出弱者、受雇者與寄居者的保護。","Find protections for workers and immigrants. "],["讀 26 章初熟果子的歷史宣認。","Read the firstfruit confession in chapter 26."]],"question":["感恩如何落實為資源分享？","How does gratitude become resource sharing?"],"practice":["性法與家法討論要避免責怪受害者。","Avoid victim-blaming in sexual and household cases."]},{"refs":"27–30","title":["第 7 課｜警告與選擇生命","Lesson 7 | Warning and choosing life"],"aim":["理解公開盟約、嚴厲警告與歸回盼望。","Understand public covenant, severe warning, and hope of return."],"flow":[["讀 27 章，找出暗中侵害弱者的咒詛。","Read chapter 27 for hidden harm to the vulnerable. "],["觀察 28 章祝福咒詛篇幅差異。","Notice the imbalance of blessing and curse in 28. "],["讀 30 章，討論心與選擇生命。","Discuss heart and life in chapter 30."]],"question":["警告如何促使公義而非責怪受苦者？","How can warning motivate justice without blaming sufferers?"],"practice":["不可把個人疾病等同 28 章咒詛。","Do not equate personal illness with chapter 28 curses."]},{"refs":"31–34","title":["第 8 課｜交接與未竟之路","Lesson 8 | Succession and unfinished road"],"aim":["用讀律法、詩歌、祝福和摩西之死總結五經。","Synthesize public Torah reading, song, blessing, and Moses’ death."],"flow":[["讀 31 章，設計跨代公開讀經方式。","Design intergenerational reading from chapter 31. "],["比較 32 章歌與 33 章祝福。","Compare song in 32 and blessing in 33. "],["讀 34 章，討論看見未進之地。","Discuss seeing but not entering in 34."]],"question":["如何把未完成的使命交給下一代？","How is an unfinished vocation entrusted to others?"],"practice":["不要把摩西簡化為毫無限制的英雄。","Do not portray Moses as a hero without limits."]}],"questionsIntro":["請先讓學員指出經文根據，再討論詮釋與應用；困難經文可以保留開放問題。","Ask learners for textual evidence before interpretation and application; difficult passages may leave open questions."],"extraQuestions":[["申命記如何把「愛神」與「愛寄居者」連在一起？","How does Deuteronomy connect love of God with love of immigrants?"],["重述十誡與曠野往事為何要有不同側重？","Why does retelling the commandments and journey shift emphasis?"],["「選擇生命」如何落實於權力、司法與資源？","How does choosing life shape power, courts, and resources?"]],"sourceNote":["本站提供原創逐章摘要與教學建議，不轉載任何譯本的完整經文。中文經文連結預設新標點和合本（神版），英文預設 NASB 2020。","Original chapter summaries and teaching notes; no complete Bible translation is reproduced. Chinese Scripture links default to CUNP (Shen edition), English to NASB 2020."],"sources":[{"title":["BibleProject｜申命記導讀","BibleProject | Deuteronomy guide"],"url":"https://bibleproject.com/guides/book-of-deuteronomy/"},{"title":["耶魯公開課｜舊約導論","Open Yale Courses | Introduction to the Old Testament"],"url":"https://oyc.yale.edu/religious-studies/rlst-145"}],"footer":["申命記研讀 · 原創逐章摘要與成人主日學教師教案","Deuteronomy study · original chapter notes and adult class plans"],"pdfFiles":[{"file":"舊約綜覽-13_申命記-1.pdf","title":["大衛鮑森舊約縱覽｜申命記 1 · PDF ↗","David Pawson’s Old Testament Survey | Deuteronomy 1 · PDF ↗"]},{"file":"舊約綜覽-14_申命記-2.pdf","title":["大衛鮑森舊約縱覽｜申命記 2 · PDF ↗","David Pawson’s Old Testament Survey | Deuteronomy 2 · PDF ↗"]}]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
