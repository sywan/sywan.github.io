body{overflow-x:hidden}.hero h1{max-width:none}.hero-lead{max-width:86ch}.overview-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:26px 0 0}.overview-strip div{border:1px solid #a0c2cd;background:#ffffff14;border-radius:12px;padding:12px 16px}.overview-strip strong{display:block;font-size:23px;line-height:1.3}.overview-strip span{font-size:13px;color:#d7e9ed}.tab-panel[hidden]{display:none}.section-head{margin-bottom:20px}.stack{display:grid;gap:15px}.timeline{counter-reset:time}.timeline .movement{position:relative;border-left:4px solid #b99867}.timeline .movement::before{counter-increment:time;content:counter(time,decimal-leading-zero);display:inline-block;color:#986a31;font-weight:850;font-size:12px;letter-spacing:.12em}.question{border-left:3px solid #c09b66;padding:8px 0 8px 13px;color:#405768}.source-note{border-left:4px solid #b89560;background:#fff9ed;border-radius:0 12px 12px 0;padding:17px 21px;margin:0 0 24px}.source-note p{margin:4px 0}.canon-banner{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}.canon-banner span{background:#e6f0f3;border:1px solid #cbdde4;border-radius:999px;padding:7px 13px;color:#235b74;font-weight:800}.lesson details{margin-top:12px;border-top:1px solid #dce5e9;padding-top:10px}.lesson summary{cursor:pointer;color:#245f7c;font-weight:800}.lesson .refs{font-size:14px}.lesson ul{margin:6px 0 0}.reading-links{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 25px}.reading-links a{background:#e5f1f5;border-radius:9px;padding:9px 13px;text-decoration:none;font-weight:800}.reading-links a:hover{background:#d2e7ef}.content-card p{max-width:90ch}.backtop{display:none}@media(max-width:620px){.overview-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-strip strong{font-size:19px}.source-note{padding:14px 16px}.reading-links a{flex:1 1 140px;text-align:center}}
</style></head><body><a class="skip" href="#main">跳至內容</a><header class="hero"><div class="crumbs"><a href="/" id="home-link">← 個人首頁</a><a href="/bible-study/" id="center-link">← 聖經研讀</a></div><div class="eyebrow">NEW TESTAMENT · TEACHER EDITION</div><h1 id="title">新約總覽</h1><p class="hero-lead" id="subtitle"></p><div class="edition" id="edition"></div></header><nav class="nav" aria-label="研讀頁面"><div class="nav-inner"><div class="tabs" role="tablist" aria-label="研讀內容" id="tabs"></div><button type="button" class="language-switch" id="language" role="switch" aria-checked="false" aria-label="語言：繁中，切換至英文"><span class="language-switch__option" data-lang-option="zh">繁中</span><span class="language-switch__option" data-lang-option="en">EN</span><span class="language-switch__thumb" aria-hidden="true"></span></button><button type="button" class="lang" data-refresh-page id="refresh">↻ 更新</button></div></nav><main id="main"><div id="panel"></div><footer class="footer" id="footer"></footer></main><script>window.NT_DATA={"title":["新約總覽","New Testament Overview"],"subtitle":["從四福音、使徒行傳、書信到啟示錄，認識新約 27 卷的歷史處境、文學形式與彼此對話。","Explore the settings, literary forms, and conversations among the 27 New Testament books, from the Gospels through Revelation."],"intro":["新約是一套成書於第一世紀的多聲部文獻：四福音從不同角度講述耶穌，使徒行傳描寫群體擴展，書信回應真實教會，啟示錄以異象鼓勵受壓者。先問每卷在對誰說話、用甚麼文體，再比較全書主題。","The New Testament is a first-century collection with many voices: four Gospels tell Jesus’ story, Acts follows communities, letters address real churches, and Revelation uses visions to encourage pressured readers. Ask whom each book addresses and how its genre works before comparing themes."],"ideas":[{"title":["四個福音，四種敘事角度","Four Gospels, four narrative angles"],"body":["馬太強調耶穌與以色列經卷，馬可聚焦十字架道路，路加關注失喪者與萬民，約翰以神蹟和對話探討生命。四卷並列，不能拼成一卷沒有差異的故事。","Matthew foregrounds Israel’s Scriptures, Mark the way of the cross, Luke the lost and nations, and John life through signs and dialogue. The four accounts should not be flattened into one."]},{"title":["一段延伸的故事","A continuing story"],"body":["路加福音與使徒行傳連結耶穌的工作與聖靈帶領的群體。耶路撒冷、猶太、撒瑪利亞與地中海城市構成敘事舞台。","Luke and Acts connect Jesus’ work to Spirit-led communities across Jerusalem, Judea, Samaria, and Mediterranean cities."]},{"title":["寫給真實群體的書信","Letters to real communities"],"body":["保羅書信與其他書信討論信心、群體衝突、金錢、權力和盼望。讀者需先辨認收信人與當時問題，再問今日如何回應。","Pauline and other letters address faith, conflict, money, power, and hope. Identify recipients and occasion before asking how they speak today."]},{"title":["盼望的異象","Visions of hope"],"body":["啟示錄以象徵與舊約意象批判帝國，呼喚群體忠誠。它不宜被化成逐條現代新聞對照表。","Revelation uses symbols and older scriptural images to critique empire and call for faithfulness; it is not a codebook for matching modern headlines."]}],"lenses":[{"title":["文體先於應用","Genre before application"],"body":["福音敘事、歷史敘事、書信、講道與啟示文學的語言功能不同；先看整卷如何安排材料。","Gospel, narrative, letter, sermon, and apocalypse work differently; examine each book’s design."]},{"title":["猶太根源與第二聖殿背景","Jewish roots and Second Temple context"],"body":["耶穌、使徒與最早的群體都在第一世紀猶太世界中生活。留意經文如何引用希伯來聖經，也要拒絕反猶太的讀法。","Jesus, the apostles, and the earliest movement lived in a Jewish world. Trace Scripture use and reject anti-Jewish readings."]},{"title":["羅馬帝國下的地方生活","Local life under Rome"],"body":["稅、軍人、城市與巡迴交通塑造故事背景；「羅馬世界」不是單一文化，各地語言、階層和習俗不同。","Taxes, soldiers, cities, and travel shape the accounts; the Roman world was not culturally uniform."]},{"title":["誰在說話，對誰說話","Speaker and audience"],"body":["耶穌的比喻、敘事者的評語、對手的控訴與使徒的書信各有聲音；不可把人物每句話都當作者立場。","Distinguish Jesus’ parables, narratorial comments, opponents’ claims, and apostolic letters; a character’s line is not always the book’s verdict."]},{"title":["群體、權力與弱者","Community, power, and vulnerability"],"body":["觀察婦女、貧者、病者、外邦人與奴僕如何出現；讀赦免與順服經文時不可抹去問責和安全。","Attend to women, poor people, the ill, Gentiles, and enslaved people; forgiveness and submission must not erase accountability or safety."]},{"title":["經文傳抄與翻譯","Manuscripts and translation"],"body":["新約希臘文文本透過抄本傳承；馬可 16:9–20、約翰 7:53–8:11 等著名段落需附抄本說明。本站中文經文連結採新標點和合本（神版），英文採 NASB 2020。","Greek manuscripts transmit the text; passages such as Mark 16:9–20 and John 7:53–8:11 require textual notes. Study links use CUNP (Shen edition) and NASB 2020."]}],"arc":[{"name":["耶穌的降生與身份","Birth and identity"],"ref":"太 1–2；路 1–2；約 1 / Matt 1–2; Luke 1–2; John 1","body":["馬太與路加從不同角度敘述降生；約翰以道成肉身開篇；馬可直接從好消息與施洗約翰開始。","Matthew and Luke tell distinct birth stories, John opens with the Word made flesh, and Mark begins with John the Baptist and good news."],"question":["四卷福音的開頭如何分別提出「耶穌是誰」？","How does each opening ask who Jesus is?"]},{"name":["加利利的宣告、醫治與飯桌","Galilean teaching, healing, and tables"],"ref":"可 1–8；太 5–10；路 4–8 / Mark 1–8; Matt 5–10; Luke 4–8","body":["耶穌宣告天國、醫治與召門徒，也和被排斥者同桌；權柄與憐憫並行。","Jesus announces the kingdom, heals, calls disciples, and shares tables with excluded people; authority and mercy belong together."],"question":["耶穌的飯桌如何顯出祂宣告的國？","How do Jesus’ meals embody the kingdom he announces?"]},{"name":["走向耶路撒冷與門徒學習","Journey to Jerusalem and discipleship"],"ref":"可 8–10；路 9:51–19:27 / Mark 8–10; Luke 9:51–19:27","body":["認信、變像與受難預告使「彌賽亞」有新含義；路加的旅程段落詳述鄰舍、財富與禱告。","Confession and passion predictions redefine Messiah; Luke’s travel account develops neighbor-love, wealth, and prayer."],"question":["為何門徒知道稱號仍常不明白道路？","Why do disciples know a title yet miss the path?"]},{"name":["耶路撒冷、受難與復活","Jerusalem, passion, and resurrection"],"ref":"太 21–28；可 11–16；路 19–24；約 12–21 / Matt 21–28; Mark 11–16; Luke 19–24; John 12–21","body":["四福音各自安排進城、最後晚餐、審判、十字架與復活見證；相同事件的敘事焦點不盡相同。","Each Gospel shapes entry, meal, trial, cross, and resurrection witness differently; compare emphases without forcing identical sequences."],"question":["各卷如何讓婦女、門徒及外人見證復活？","How do women, disciples, and outsiders function as witnesses?"]},{"name":["從耶路撒冷到萬民","From Jerusalem toward nations"],"ref":"徒 1–2, 8, 10, 13, 28 / Acts 1–2, 8, 10, 13, 28","body":["使徒行傳描寫聖靈與群體在不同城市擴展，彼得、腓利、保羅等人面對跨文化和群體界線。","Acts follows Spirit-led communities through cities and boundary crossings involving Peter, Philip, Paul, and others."],"question":["使徒行傳如何描寫外邦人進入群體？","How does Acts portray Gentile inclusion?"]},{"name":["書信與啟示中的群體盼望","Communal hope in letters and vision"],"ref":"羅 12；林前 12–13；雅 2；啟 21–22 / Rom 12; 1 Cor 12–13; Jas 2; Rev 21–22","body":["書信關注各地教會的真實分歧與倫理；啟示錄以新天新地及生命水的圖像描繪盼望。","Letters address real communal tensions and ethics; Revelation closes with new creation and the river of life."],"question":["當盼望遇見不義與衝突時，經文要求甚麼行動？","What actions does hope call for amid injustice and conflict?"]}],"regions":[{"title":["加利利與猶太","Galilee and Judea"],"body":["加利利的村鎮、湖邊與會堂是許多事工場景；耶路撒冷則是聖殿、節期與受難復活的重要舞台。","Galilean villages, lake, and synagogues host much ministry; Jerusalem centers temple, festivals, passion, and resurrection."]},{"title":["撒瑪利亞與地中海東岸","Samaria and eastern Mediterranean"],"body":["撒瑪利亞、敘利亞安提阿與小亞細亞城市展示猶太與非猶太群體接觸的多種方式。","Samaria, Antioch, and cities of Asia Minor show varied Jewish and Gentile encounters."]},{"title":["希臘城市與羅馬","Greek cities and Rome"],"body":["腓立比、哥林多、以弗所等城市是書信的重要背景；羅馬既是帝國權力中心，也是早期基督徒群體所在地。","Philippi, Corinth, and Ephesus matter to letters; Rome is both imperial center and home to early Christian communities."]}],"canon":[{"name":["四福音","Four Gospels"],"books":["馬太、馬可、路加、約翰；四卷各有敘事設計與神學重點。","Matthew, Mark, Luke, John; each has its own literary design and theological emphasis."],"note":["前三卷常被並稱「對觀福音」；約翰的敘述與對話風格不同。這是比較方法，不是價值高低。","The first three are often called Synoptic Gospels; John’s style differs. This is a comparative tool, not a ranking."]},{"name":["使徒行傳與書信","Acts and letters"],"books":["使徒行傳；保羅書信（羅馬書至腓利門書）；希伯來書與一般書信（雅各書至猶大書）。","Acts; Pauline letters (Romans–Philemon); Hebrews and General Epistles (James–Jude)."],"note":["書信在常見新教次序中大致按群體與個人收信對象分組，不代表寫作年代順序。","The common order groups letters by traditional categories, not chronological composition."]},{"name":["啟示錄","Revelation"],"books":["新約最後一卷；給七間教會的信與異象，結於新天新地。","The final book addresses seven churches through letters and visions, ending with new creation."],"note":["啟示文學以圖像和舊約回聲工作；先讀其最初聽眾，再討論未來盼望。","Apocalyptic imagery echoes older Scripture; first read for its early audiences, then discuss future hope."]}],"reading":[{"title":["先讀整卷輪廓","Begin with the whole book"],"body":["找出開頭、轉折、結尾與重複主題。馬可的「誰是耶穌」與約翰的神蹟需要放回各卷結構。","Locate opening, turning points, ending, and motifs; read Mark’s identity question and John’s signs within their designs."]},{"title":["分辨平行與差異","Compare parallels and differences"],"body":["讀四福音相似故事時，記錄共同核心與各自新增或省略的細節；差異可顯示敘事重點。","When comparing Gospel parallels, note common core and distinct additions or omissions; differences can reveal emphasis."]},{"title":["留意舊約經文回聲","Listen for older Scripture"],"body":["馬太的應驗、路加的以賽亞宣言與約翰的節期圖像都借用以色列經卷；先看原文，再問新約如何重讀。","Matthew’s fulfillment, Luke’s Isaiah proclamation, and John’s festivals reuse Israel’s Scriptures; read the earlier context first."]},{"title":["問收信人與情境","Ask about addressees and occasion"],"body":["書信的勸勉回應真實爭端；不要把給某群體的指示直接變成所有時代的一條孤立規則。","Letters address real disputes; do not turn one community’s instruction into an isolated timeless rule without context."]},{"title":["看見有權與無權者","Notice power and vulnerability"],"body":["追問誰能說話、誰被排除、誰受醫治、誰承受稅與戰爭。應用時也要問弱勢者如何聽見這段經文。","Ask who speaks, who is excluded, who is healed, and who bears taxes or war; consider how vulnerable readers hear the passage."]},{"title":["讓文本差異被說清楚","Make textual questions visible"],"body":["讀馬可較長結尾及行淫婦人段落時，尊重譯本註記與抄本證據；區分經文、詮釋與應用。","For the longer Mark ending and adultery passage, attend to translation notes and manuscript evidence; separate text, reading, and application."]}],"teacherNotes":[{"title":["四福音不是四份逐字筆錄","The Gospels are not four verbatim transcripts"],"body":["四卷使用不同選材、編排、直接引語與敘事策略來見證耶穌。比較差異時先問各自希望讀者看見甚麼。","Each Gospel selects and arranges material to witness to Jesus. Ask what each author foregrounds when accounts differ."]},{"title":["年代是範圍，不是逐節日期","Dates are ranges, not verse-level timestamps"],"body":["新約書卷成書和流傳有歷史研究中的爭論；福音所敘述的事件時期也不等於福音成書日期。","Composition and transmission dates are debated; the time narrated by a Gospel is not the date it was written."]},{"title":["避免反猶太讀法","Prevent anti-Jewish readings"],"body":["耶穌與第一批門徒是猶太人。福音中的宗教爭辯常是猶太社群內部的辯論；不可把某些領袖行動加在所有猶太人身上。","Jesus and his first followers were Jewish. Gospel disputes often occur within Jewish communities; never assign a leader’s act to all Jews."]},{"title":["抄本註記有教學價值","Manuscript notes are teachable"],"body":["馬可 16:9–20 和約翰 7:53–8:11 的抄本狀況不同於一般段落。說明證據與譯本處理方式，無需隱藏。","Mark 16:9–20 and John 7:53–8:11 have distinctive manuscript histories. Explain the evidence and how translations present them."]},{"title":["比喻不等於密碼表","Parables are not code charts"],"body":["比喻藉故事和意外轉折挑戰聽者；不是每一件物品都必定對應一個固定教義。","Parables challenge hearers through story and reversal; every object need not map to a fixed doctrine."]},{"title":["新約與舊約的對話","New Testament in conversation with the Old"],"body":["基督徒可比較應驗與重讀，但要先讀舊約文本自身脈絡，也尊重猶太傳統持續閱讀同一經文。","Christians may compare fulfillment and rereading, while first hearing older texts in context and respecting living Jewish readings."]}],"lessons":[{"title":["一｜27 卷的地圖","1 | Map of 27 books"],"refs":"路 1:1–4；約 20:30–31 / Luke 1:1–4; John 20:30–31","aim":["能說出四福音、使徒行傳、書信與啟示錄的基本位置和文體。","Locate Gospels, Acts, letters, and Revelation by order and genre."],"flow":[["讓學員按書卷名稱把新約分成四類。","Have learners group the 27 books into four kinds."],["讀路 1:1–4 和約 20:30–31，對比作者如何交代寫作目的。","Compare Luke 1:1–4 and John 20:30–31 on purpose."],["每人選一卷提出想追問的問題。","Ask each learner to pose a question about one book."]],"question":["書卷排列和成書時間有何不同？","How does canon order differ from composition order?"],"watch":["不要把類別當成每卷沒有獨特性的標籤。","Categories do not erase individual books."]},{"title":["二｜第一世紀的地理與猶太背景","2 | Place and Jewish setting"],"refs":"路 2:1–7；可 1:14–15；徒 1:8 / Luke 2:1–7; Mark 1:14–15; Acts 1:8","aim":["認識加利利、耶路撒冷、撒瑪利亞與帝國交通背景。","Locate Galilee, Jerusalem, Samaria, and imperial travel routes."],"flow":[["畫簡圖標出三地與羅馬世界的連結。","Sketch the locations and their imperial connections."],["比較耶穌的猶太身份與羅馬行政背景。","Compare Jesus’ Jewish setting with Roman administration."],["讀徒 1:8，觀察敘事如何擴展地理範圍。","Read Acts 1:8 as a widening geographical frame."]],"question":["哪些地理資訊有助讀經？哪些問題仍須靠文本回答？","What can geography clarify, and what requires close reading?"],"watch":["勿把現代國界投射回第一世紀。","Do not project modern borders back into the first century."]},{"title":["三｜四福音的共同與差異","3 | Four Gospels together and apart"],"refs":"太 1；可 1；路 1；約 1 / Matt 1; Mark 1; Luke 1; John 1","aim":["能比較四卷開頭如何提出耶穌身份。","Compare how each opening introduces Jesus."],"flow":[["四組各讀一卷第一章並列三個焦點。","Assign each group a Gospel opening and three focal points."],["對比家譜、施洗者、降生敘事和道成肉身。","Compare genealogies, John the Baptist, birth stories, and Word made flesh."],["討論差異如何幫助研讀而非造成混亂。","Discuss how differences aid study."]],"question":["為何需要保留四卷而不是合成一卷？","Why preserve four accounts rather than merge them?"],"watch":["不要把福音書稱作逐字錄音稿。","Do not portray the Gospels as verbatim recordings."]},{"title":["四｜天國、醫治與門徒","4 | Kingdom, healing, and disciples"],"refs":"太 5:1–12；可 2:1–17；路 4:16–21 / Matt 5:1–12; Mark 2:1–17; Luke 4:16–21","aim":["能連結耶穌的教導、醫治與社會接納。","Connect Jesus’ teaching, healing, and social welcome."],"flow":[["讀三段，標出窮人、病人與被排斥者的位置。","Locate the poor, sick, and excluded in three passages."],["討論天國宣告如何由行動表現。","Discuss how kingdom announcement becomes action."],["練習區分敘事描述與今日應用。","Practice distinguishing narrative and application."]],"question":["耶穌的權柄為誰帶來好消息？","For whom is Jesus’ authority good news?"],"watch":["勿責備沒有得醫治的人缺乏信心。","Do not blame those who remain ill."]},{"title":["五｜走向十字架與復活","5 | Toward cross and resurrection"],"refs":"可 8:27–38；路 24:13–35；約 20:19–29 / Mark 8:27–38; Luke 24:13–35; John 20:19–29","aim":["理解認信、受難、復活見證與門徒理解的轉變。","Trace confession, passion, resurrection witness, and changed understanding."],"flow":[["讀馬可認信與首次受難預告。","Read Mark’s confession and first passion prediction."],["對照以馬忤斯與多馬的不同認識道路。","Compare Emmaus and Thomas as paths to understanding."],["提出馬可 16 結尾的抄本問題。","Introduce the manuscript question at Mark 16."]],"question":["十字架如何重新定義「彌賽亞」？","How does the cross redefine “Messiah”?"],"watch":["不可將背十字架用作壓迫受虐者。","Do not use cross-bearing to pressure abuse survivors."]},{"title":["六｜聖靈與使徒行傳","6 | Spirit and Acts"],"refs":"徒 2；10；15 / Acts 2; 10; 15","aim":["認識耶路撒冷到外邦群體的擴展與爭議。","Understand the expansion and disputes from Jerusalem to Gentile communities."],"flow":[["讀五旬節與哥尼流故事，找說話者與聽眾。","Read Pentecost and Cornelius with speakers and audiences in view."],["觀察十五章如何以討論處理邊界。","Examine how chapter 15 negotiates boundaries."],["在地圖上追蹤敘事路線。","Trace the route on a map."]],"question":["群體如何分辨新的成員可以被接納？","How does the community discern inclusion?"],"watch":["勿將使徒行傳每一事件當所有教會的必然公式。","Not every event in Acts is a required formula."]},{"title":["七｜書信中的真實教會","7 | Real churches in letters"],"refs":"羅 12；林前 12–13；雅 2 / Rom 12; 1 Cor 12–13; Jas 2","aim":["能辨認書信如何處理身體、恩賜、愛與貧富。","See how letters address community, gifts, love, and wealth."],"flow":[["找出各段的收信群體與問題。","Identify addressees and issues."],["比較保羅的身體圖像與雅各對偏待人的批判。","Compare Paul’s body image with James on favoritism."],["請學員說出文本、推論、應用三步。","Have learners state text, interpretation, and application."]],"question":["為何不能把一節勸勉與其收信處境分開？","Why not detach a line from its audience?"],"watch":["不要把書信的次序當作寫作日期次序。","Canon order is not composition order."]},{"title":["八｜啟示、盼望與下一卷","8 | Revelation and future study"],"refs":"啟 1:9–20；21–22 / Rev 1:9–20; 21–22","aim":["能認識啟示文學的象徵性，規劃後續逐卷研讀。","Recognize apocalyptic imagery and plan book-by-book study."],"flow":[["讀七教會背景與新天新地圖像。","Read the seven churches and new creation imagery."],["分辨受迫處境、舊約回聲與今日盼望。","Distinguish early pressure, scriptural echoes, and present hope."],["每人選下一卷，說明文體和問題。","Each learner chooses a next book, its genre, and a question."]],"question":["盼望如何成為當下忠誠，而非逃避責任？","How can hope shape present fidelity rather than escape?"],"watch":["勿用象徵直接標注當代政客或精確日期。","Do not map symbols to current leaders or exact dates."]}],"discussion":[{"q":["四福音同樣講述耶穌，為何開頭卻如此不同？","Why do four accounts of Jesus open differently?"],"a":["各卷選擇不同入口呈現身份與使命；比較選材有助理解其敘事目的。","Each account selects an opening that frames identity and mission."]},{"q":["馬可沒有降生敘事，代表甚麼？","What does Mark’s lack of a birth narrative mean?"],"a":["馬可直接從施洗約翰和耶穌公開事工開始；不等於否定其他福音的敘事。","Mark starts with John and public ministry; omission does not deny other accounts."]},{"q":["路加如何連結耶穌事工與使徒行傳？","How does Luke connect the Gospel and Acts?"],"a":["兩卷以聖靈、見證與地理擴展相連，但仍各有敘事結構。","The Spirit, witness, and widening geography link two volumes with distinct designs."]},{"q":["約翰福音的「猶太人」可以指所有猶太人嗎？","Does “the Jews” in John mean all Jewish people?"],"a":["不可一概而論。要辨認具體場景與人物；耶穌和第一批門徒本身就是猶太人。","No blanket reading is warranted; identify each context, remembering Jesus and earliest disciples were Jewish."]},{"q":["使徒行傳與書信是否同一種文體？","Are Acts and letters the same kind of writing?"],"a":["前者是敘事，後者是寄給特定群體的勸勉；讀法與問題不同。","Acts narrates; letters address particular communities and require attention to occasion."]},{"q":["新約書卷順序是否反映寫作先後？","Does New Testament order show writing chronology?"],"a":["不是。常見正典排列先福音、使徒行傳、書信、啟示錄；各卷成書研究另需證據。","No. Canon order groups genres and traditions; composition requires separate evidence."]},{"q":["如何帶領馬可較長結尾的討論？","How should one teach Mark’s longer ending?"],"a":["說明 16:8 的早期結尾與 16:9–20 的較晚抄本見證；避免隱藏差異或用其危險語言試探信心。","Explain the early ending at 16:8 and later witness to 16:9–20; do not hide the issue or test faith through dangerous acts."]},{"q":["啟示錄的象徵能否直接對照今天新聞？","Can Revelation’s symbols be mapped directly to current news?"],"a":["先聽當時七教會如何理解帝國、忠誠和盼望，再謹慎討論今日處境。","Start with the seven churches, empire, fidelity, and hope before careful modern reflection."]}],"sources":[{"title":["BibleProject｜馬太福音導讀","BibleProject | Matthew guide"],"desc":["提供馬太福音的全書結構與主要主題。","A literary overview of Matthew’s structure and themes."],"url":"https://bibleproject.com/guides/book-of-matthew/"},{"title":["BibleProject｜馬可福音導讀","BibleProject | Mark guide"],"desc":["觀察身份問題、門徒不明白與十字架道路。","Explore identity, misunderstanding, and the cross."],"url":"https://bibleproject.com/guides/book-of-mark/"},{"title":["BibleProject｜路加福音導讀","BibleProject | Luke guide"],"desc":["幫助追蹤路加福音的旅程與弱者關懷。","Trace Luke’s journey and concern for the vulnerable."],"url":"https://bibleproject.com/guides/book-of-luke/"},{"title":["BibleProject｜約翰福音導讀","BibleProject | John guide"],"desc":["以神蹟、對話與受難復活進入約翰的敘事。","Enter John through signs, conversations, passion, and resurrection."],"url":"https://bibleproject.com/guides/book-of-john/"},{"title":["耶魯公開課｜新約歷史與文學","Open Yale Courses | New Testament History and Literature"],"desc":["提供第一世紀背景與文學歷史研究角度，可與本頁神學閱讀互相對照。","An academic historical and literary perspective on the first century."],"url":"https://oyc.yale.edu/religious-studies/rlst-152"}]};</script><script src="../assets/nt-overview.js?v=20261103a" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
