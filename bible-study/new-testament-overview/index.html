body{overflow-x:hidden}.hero h1{max-width:none}.hero-lead{max-width:86ch}.overview-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:26px 0 0}.overview-strip div{border:1px solid #a0c2cd;background:#ffffff14;border-radius:12px;padding:12px 16px}.overview-strip strong{display:block;font-size:23px;line-height:1.3}.overview-strip span{font-size:13px;color:#d7e9ed}.tab-panel[hidden]{display:none}.section-head{margin-bottom:20px}.stack{display:grid;gap:15px}.timeline{counter-reset:time}.timeline .movement{position:relative;border-left:4px solid #b99867}.timeline .movement::before{counter-increment:time;content:counter(time,decimal-leading-zero);display:inline-block;color:#986a31;font-weight:850;font-size:12px;letter-spacing:.12em}.question{border-left:3px solid #c09b66;padding:8px 0 8px 13px;color:#405768}.source-note{border-left:4px solid #b89560;background:#fff9ed;border-radius:0 12px 12px 0;padding:17px 21px;margin:0 0 24px}.source-note p{margin:4px 0}.canon-banner{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}.canon-banner span{background:#e6f0f3;border:1px solid #cbdde4;border-radius:999px;padding:7px 13px;color:#235b74;font-weight:800}.lesson details{margin-top:12px;border-top:1px solid #dce5e9;padding-top:10px}.lesson summary{cursor:pointer;color:#245f7c;font-weight:800}.lesson .refs{font-size:14px}.lesson ul{margin:6px 0 0}.reading-links{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 25px}.reading-links a{background:#e5f1f5;border-radius:9px;padding:9px 13px;text-decoration:none;font-weight:800}.reading-links a:hover{background:#d2e7ef}.content-card p{max-width:90ch}.backtop{display:none}@media(max-width:620px){.overview-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-strip strong{font-size:19px}.source-note{padding:14px 16px}.reading-links a{flex:1 1 140px;text-align:center}}
</style></head><body><a class="skip" href="#main">跳至內容</a><header class="hero"><div class="crumbs"><a href="/" id="home-link">← 個人首頁</a><a href="/bible-study/" id="center-link">← 聖經研讀</a></div><div class="eyebrow">NEW TESTAMENT · TEACHER EDITION</div><h1 id="title">新約總覽</h1><p class="hero-lead" id="subtitle"></p><div class="edition" id="edition"></div></header><nav class="nav" aria-label="研讀頁面"><div class="nav-inner"><div class="tabs" role="tablist" aria-label="研讀內容" id="tabs"></div><button type="button" class="language-switch" id="language" role="switch" aria-checked="false" aria-label="語言：繁中，切換至英文"><span class="language-switch__option" data-lang-option="zh">繁中</span><span class="language-switch__option" data-lang-option="en">EN</span><span class="language-switch__thumb" aria-hidden="true"></span></button><button type="button" class="lang" data-refresh-page id="refresh">↻ 更新</button></div></nav><main id="main"><div id="panel"></div><footer class="footer" id="footer"></footer></main><script>window.NT_DATA={"title":["新約總覽","New Testament Overview"],"subtitle":["從福音書、使徒行傳、保羅與其他書信到啟示錄，逐組認識新約 27 卷的文體、歷史處境與神學對話。","Survey all 27 New Testament books: Gospels, Acts, Pauline and other letters, and Revelation in their literary and historical contexts."],"intro":["新約有多種聲音：四福音見證耶穌，使徒行傳敘述跨文化群體；正典中傳統歸入保羅名下的十三卷書信，從羅馬與哥林多的群體爭論，延伸到加拉太的外邦歸屬、腓立比的同工、提摩太與提多的領導，以及腓利門與阿尼西母的奴役關係。希伯來書、雅各、彼得、約翰和猶大書信各有不同處境；啟示錄則以寫給七教會的異象帶出公義與新創造。按文體、收信人和權力關係閱讀，才能看見各卷彼此呼應又各有焦點。","The New Testament speaks in many voices: four Gospels witness to Jesus and Acts narrates communities crossing cultures. Thirteen letters traditionally grouped as Pauline address Roman and Corinthian disputes, Gentile belonging in Galatia, coworkers in Philippi, leadership with Timothy and Titus, and enslavement in Philemon. Hebrews and the letters of James, Peter, John, and Jude have distinct settings; Revelation speaks in visions to seven churches about justice and new creation. Read for genre, recipients, and power relationships to hear both dialogue and difference."],"ideas":[{"title":["耶穌與四卷見證","Jesus and four witnesses"],"body":["四福音各自選材、編排、對話；一起見證耶穌的天國事工、十字架與復活。","The Gospels arrange different material and conversations around Jesus’ kingdom work, cross, and resurrection."]},{"title":["聖靈與跨界群體","Spirit and communities across boundaries"],"body":["使徒行傳從耶路撒冷延伸到羅馬，寫出見證、寡婦照顧、外邦接納、會議與衝突。","Acts moves from Jerusalem toward Rome through witness, care for widows, Gentile inclusion, councils, and conflict."]},{"title":["十三卷保羅書信：福音進入地方生活","Thirteen Pauline letters: gospel in local life"],"body":["羅馬書至腓利門書既有神學論證，也有紛爭處理、募款、同工問安與個人求情；正典編組不等於寫作年代，也不解決個別作者爭論。","Romans through Philemon include argument, conflict, collection, coworkers, and a personal appeal; canon grouping is neither a writing timeline nor a solution to individual authorship debates."]},{"title":["十字架、身體與共同資源","Cross, body, and shared resources"],"body":["哥林多前書以十字架、主餐與復活衡量群體地位；哥林多後書以瓦器、和好與耶路撒冷奉獻檢驗使徒權柄。","First Corinthians tests communal status by cross, Lord’s meal, and resurrection; Second Corinthians tests authority through clay jars, reconciliation, and the Jerusalem collection."]},{"title":["猶太與外邦、律法與恩典","Jew and Gentile, Torah and grace"],"body":["羅馬書與加拉太書追問外邦信徒如何加入神的應許；「稱義」「自由」「新約」應放回飯桌與共同生活，不成為反猶太口號。","Romans and Galatians ask how Gentiles share in promise; justification, freedom, and covenant belong to tables and communal life, not anti-Jewish slogans."]},{"title":["同工、家戶與脆弱者","Coworkers, households, and vulnerable people"],"body":["腓立比、歌羅西、以弗所及教牧書信涉及女性同工、家戶、寡婦與領袖；腓利門書迫使讀者面對阿尼西母被奴役的處境。","Philippians, Colossians, Ephesians, and the Pastorals raise women coworkers, households, widows, and leadership; Philemon confronts Onesimus’s enslavement."]},{"title":["希伯來書與一般書信","Hebrews and other letters"],"body":["希伯來書重讀祭司、會幕與立約；雅各、彼得、約翰、猶大關注行道、苦難、相愛、真理與敗壞領導。","Hebrews rereads priesthood, sanctuary, and covenant; James, Peter, John, and Jude address action, suffering, love, truth, and corrupt leadership."]},{"title":["啟示錄：寫給七教會的異象","Revelation: visions for seven churches"],"body":["羔羊、獸、巴比倫與新耶路撒冷以舊約圖像揭露帝國暴力，宣告列國得醫治的盼望。","Lamb, beasts, Babylon, and New Jerusalem use older imagery to unmask imperial violence and envision healing of nations."]}],"lenses":[{"title":["文體先於應用","Genre before application"],"body":["福音敘事、歷史敘事、書信、講道與啟示文學的語言功能不同；先看整卷如何安排材料。","Gospel, narrative, letter, sermon, and apocalypse work differently; examine each book’s design."]},{"title":["猶太根源與第二聖殿背景","Jewish roots and Second Temple context"],"body":["耶穌、使徒與最早的群體都在第一世紀猶太世界中生活。留意經文如何引用希伯來聖經，也要拒絕反猶太的讀法。","Jesus, the apostles, and the earliest movement lived in a Jewish world. Trace Scripture use and reject anti-Jewish readings."]},{"title":["羅馬帝國下的地方生活","Local life under Rome"],"body":["稅、軍人、城市與巡迴交通塑造故事背景；「羅馬世界」不是單一文化，各地語言、階層和習俗不同。","Taxes, soldiers, cities, and travel shape the accounts; the Roman world was not culturally uniform."]},{"title":["誰在說話，對誰說話","Speaker and audience"],"body":["耶穌的比喻、敘事者的評語、對手的控訴與使徒的書信各有聲音；不可把人物每句話都當作者立場。","Distinguish Jesus’ parables, narratorial comments, opponents’ claims, and apostolic letters; a character’s line is not always the book’s verdict."]},{"title":["書信中的對話與權力","Letters as dialogue amid power"],"body":["先問誰寫給誰、誰被排除、哪些指示回應當時衝突；順服與赦免經文不可抹去受害者安全。","Ask who writes to whom, who is excluded, and what conflict a directive addresses; submission and forgiveness must not erase safety."]},{"title":["經文引用與猶太根源","Scriptural echoes and Jewish roots"],"body":["希伯來書、猶大書和啟示錄大量重讀以色列經文；討論基督徒詮釋時拒絕反猶太式取代論。","Hebrews, Jude, and Revelation reread Israel’s Scriptures extensively; resist anti-Jewish replacement claims."]},{"title":["異象與現實","Vision and lived reality"],"body":["啟示錄的數字與象徵先在第一世紀羅馬世界解釋，再討論今日意義；切忌逐項配對新聞。","Read Revelation’s symbols in first-century Roman context before modern application; avoid news-code readings."]},{"title":["經文傳抄與翻譯","Manuscripts and translation"],"body":["新約希臘文文本透過抄本傳承；馬可 16:9–20、約翰 7:53–8:11 等著名段落需附抄本說明。本站中文經文連結採新標點和合本（神版），英文採 NASB 2020。","Greek manuscripts transmit the text; passages such as Mark 16:9–20 and John 7:53–8:11 require textual notes. Study links use CUNP (Shen edition) and NASB 2020."]}],"arc":[{"name":["耶穌的事工、受難與復活","Jesus’ ministry, death, and resurrection"],"ref":"可 1, 8, 15–16；約 1, 20 / Mark 1, 8, 15–16; John 1, 20","body":["四福音從不同入口回答耶穌是誰，以及祂如何顯明神的國。","Four accounts ask who Jesus is and how he reveals God’s reign."],"question":["四卷敘事如何保留不同焦點？","How do the accounts retain distinct emphases?"]},{"name":["聖靈、五旬節與外邦接納","Spirit, Pentecost, and Gentile welcome"],"ref":"徒 1–2, 6, 8, 10, 15 / Acts 1–2, 6, 8, 10, 15","body":["多語言與寡婦分配問題、撒瑪利亞和哥尼流事件，迫使群體重新辨認邊界。","Many languages, neglected widows, Samaria, and Cornelius force renewed discernment of boundaries."],"question":["群體如何處理內部不公與外部接納？","How does the community address internal inequity and welcome?"]},{"name":["保羅與地中海城市教會","Paul and Mediterranean communities"],"ref":"徒 13–28；羅 1；林前 1 / Acts 13–28; Rom 1; 1 Cor 1","body":["行傳敘述保羅的旅程；書信讓我們聽見羅馬、哥林多、加拉太等地的具體問題，兩種文體不可混同。","Acts narrates Paul’s journeys while letters address specific questions in Rome, Corinth, Galatia, and elsewhere; genres differ."],"question":["書信可補充而不能簡化使徒行傳甚麼？","What do letters add without flattening Acts?"]},{"name":["恩典、群體與同工","Grace, communities, and coworkers"],"ref":"加 2–3；腓 2；門 8–21 / Gal 2–3; Phil 2; Phlm 8–21","body":["保羅書信從福音論證走到飯桌、合一、同工與阿尼西母的接納。","Pauline arguments move from gospel claims to tables, unity, coworkers, and Onesimus’s welcome."],"question":["腓利門書如何使「弟兄」稱呼碰觸奴役制度？","How does “brother” confront enslavement in Philemon?"]},{"name":["哥林多：十字架、主餐與身體","Corinth: cross, meal, and bodies"],"ref":"林前 1, 11–15；林後 4–5, 8–9 / 1 Cor 1, 11–15; 2 Cor 4–5, 8–9","body":["結黨、富貧分席、恩賜競爭、軟弱的使徒與跨地區奉獻，在兩封信中連成共同生活的考驗。","Factions, rich-poor divisions at the meal, gifts, apostolic weakness, and the collection test shared life across two letters."],"question":["復活盼望如何改變資源與權柄的使用？","How does resurrection hope reshape resources and authority?"]},{"name":["監禁、同工、家戶與領導","Prison, coworkers, households, leadership"],"ref":"腓 2, 4；西 3–4；弗 2, 5–6；提前 5；門 8–21 / Phil 2, 4; Col 3–4; Eph 2, 5–6; 1 Tim 5; Phlm 8–21","body":["喜樂與奉獻、跨族群的和平、家戶權力、寡婦照顧和阿尼西母的接納，顯示福音需要進入脆弱者的日常。","Joy and giving, interethnic peace, household power, widows’ care, and welcome of Onesimus show how gospel claims touch vulnerable lives."],"question":["哪些經文要特別顧及身分與權力差？","Which texts need special attention to status and unequal power?"]},{"name":["希伯來書的勸勉與祭司圖像","Hebrews: exhortation and priesthood"],"ref":"來 2, 4, 8–10, 13 / Heb 2, 4, 8–10, 13","body":["這篇講道式作品以舊約故事、祭司和立約圖像勸受壓群體持守。","This sermon-like work rereads Scripture, priesthood, and covenant to encourage a pressured community."],"question":["警告與安慰如何一起發揮作用？","How do warning and comfort work together?"]},{"name":["雅各與彼得的生活倫理","James and Peter on communal ethics"],"ref":"雅 2–3；彼前 2–5；彼後 1–3 / Jas 2–3; 1 Pet 2–5; 2 Pet 1–3","body":["偏待、言語、苦難、接待及敗壞教師使信仰成為公共生活的問題。","Favoritism, speech, suffering, hospitality, and corrupt teaching make faith a public matter."],"question":["哪些教導需要顧及權力差距？","Which teachings require attention to power differences?"]},{"name":["約翰與猶大書信的分辨","Johannine letters and Jude on discernment"],"ref":"約壹 3–4；約貳；約參；猶 20–25 / 1 John 3–4; 2 John; 3 John; Jude 20–25","body":["相愛、道成肉身、接待界線與憐憫，在群體分裂時彼此拉扯。","Love, incarnation, hospitality boundaries, and mercy are tested amid communal rupture."],"question":["辨識傷害與保持憐憫如何並行？","How can accountability and mercy coexist?"]},{"name":["羔羊、巴比倫與新創造","Lamb, Babylon, and new creation"],"ref":"啟 1–5, 13, 18, 21–22 / Rev 1–5, 13, 18, 21–22","body":["寫給七教會的異象將敬拜與帝國經濟連結，最後看見神同住及列國得醫治。","Visions for seven churches link worship and imperial economics, ending in divine dwelling and healing."],"question":["被殺羔羊如何重新定義「得勝」？","How does the slain Lamb redefine conquest?"]}],"regions":[{"title":["加利利與猶太","Galilee and Judea"],"body":["加利利的村鎮、湖邊與會堂是許多事工場景；耶路撒冷則是聖殿、節期與受難復活的重要舞台。","Galilean villages, lake, and synagogues host much ministry; Jerusalem centers temple, festivals, passion, and resurrection."]},{"title":["撒瑪利亞與地中海東岸","Samaria and eastern Mediterranean"],"body":["撒瑪利亞、敘利亞安提阿與小亞細亞城市展示猶太與非猶太群體接觸的多種方式。","Samaria, Antioch, and cities of Asia Minor show varied Jewish and Gentile encounters."]},{"title":["希臘城市與羅馬","Greek cities and Rome"],"body":["腓立比、哥林多、以弗所等城市是書信的重要背景；羅馬既是帝國權力中心，也是早期基督徒群體所在地。","Philippi, Corinth, and Ephesus matter to letters; Rome is both imperial center and home to early Christian communities."]}],"canon":[{"name":["四福音","Four Gospels"],"books":["馬太福音、馬可福音、路加福音、約翰福音。","Matthew, Mark, Luke, John."],"note":["四種耶穌敘事；路加與使徒行傳形成兩卷作品。","Four Jesus narratives; Luke and Acts form a two-volume work."]},{"name":["使徒行傳","Acts"],"books":["使徒行傳。","Acts."],"note":["記錄群體從耶路撒冷向外擴展，不等於所有使徒的傳記。","Narrates communities spreading from Jerusalem, not biographies of every apostle."]},{"name":["保羅書信：教會與同工","Pauline letters: churches and coworkers"],"books":["羅馬書、哥林多前／後書、加拉太書、以弗所書、腓立比書、歌羅西書、帖撒羅尼迦前／後書、提摩太前／後書、提多書、腓利門書，共十三卷。","Romans; 1–2 Corinthians; Galatians; Ephesians; Philippians; Colossians; 1–2 Thessalonians; 1–2 Timothy; Titus; Philemon: thirteen books."],"note":["傳統編組並非寫作時間表；個別書信作者問題可在逐卷研讀中討論。","Traditional grouping is not a composition timeline; individual authorship questions belong in book studies."]},{"name":["希伯來書","Hebrews"],"books":["希伯來書。","Hebrews."],"note":["作者未署名，以講道式勸勉和書信結語重讀祭司、立約與堅忍。","Anonymous sermon-like exhortation with an epistolary ending rereads priesthood, covenant, and endurance."]},{"name":["雅各至猶大：一般書信","James through Jude: General Epistles"],"books":["雅各書、彼得前／後書、約翰一／二／三書、猶大書，共七卷。","James; 1–2 Peter; 1–3 John; Jude: seven books."],"note":["不同收信人與處境；「一般書信」是便利的分組名稱，不表示內容相同。","Different audiences and settings; “General Epistles” is a grouping, not a claim of sameness."]},{"name":["啟示錄","Revelation"],"books":["啟示錄。","Revelation."],"note":["兼具致七教會的書信、預言及啟示文學，結於新天新地。","A letter to seven churches, prophecy, and apocalypse ending with new creation."]}],"reading":[{"title":["先讀整卷輪廓","Begin with the whole book"],"body":["找出開頭、轉折、結尾與重複主題。馬可的「誰是耶穌」與約翰的神蹟需要放回各卷結構。","Locate opening, turning points, ending, and motifs; read Mark’s identity question and John’s signs within their designs."]},{"title":["辨認文體與收信人","Identify genre and audience"],"body":["使徒行傳是敘事，保羅與其他書信是具體往來，希伯來書近於講道，啟示錄以異象說話；先問誰最初收到它。","Acts is narrative, letters address people, Hebrews is sermon-like, and Revelation speaks in visions; ask who first received each."]},{"title":["追蹤舊約回聲","Trace Israel’s Scriptures"],"body":["從福音的引文、希伯來書的祭司論證到啟示錄圖像，先讀被引用經文的原有脈絡。","From Gospel quotations through Hebrews’ priestly argument to Revelation’s imagery, first read the earlier context."]},{"title":["找出地方爭議","Locate local disputes"],"body":["哥林多的分黨、雅各的偏待、約翰書信的分裂與啟示錄七教會的不同警告，都不能合併成單一問題。","Corinth’s factions, James’s favoritism, Johannine rupture, and the seven churches’ distinct warnings cannot be collapsed into one issue."]},{"title":["檢視權力與弱者","Examine power and the vulnerable"],"body":["留意寡婦、奴僕、窮人、病人與受害者；順服、赦免和忍耐不可作為保護加害者的工具。","Notice widows, enslaved and poor people, the sick, and survivors; submission, forgiveness, and patience must not protect abusers."]},{"title":["分辨文本、詮釋、應用","Separate text, interpretation, application"],"body":["先引用整段，再說明歷史推論，最後才討論今日處境；抄本與作者問題應誠實標示。","Cite whole passages, explain historical inference, and then consider today; be candid about manuscript and authorship questions."]},{"title":["把書信放回往來與同工網絡","Read letters within correspondence and networks"],"body":["讀林前與林後、帖前與帖後時比較相同與不同的問題；讀歌羅西與腓利門時留意阿尼西母；看羅馬書 16 章的非比、百基拉、猶尼亞。","Compare shared and distinct questions in the Corinthian and Thessalonian pairs; connect Onesimus across Colossians and Philemon; attend to Phoebe, Priscilla, and Junia in Romans 16."]}],"teacherNotes":[{"title":["四福音各有敘事設計","Distinct Gospel designs"],"body":["差異不必硬湊成單一時間線；也需說明福音與書信並非同一文體。","Do not force one seamless timeline; Gospel and letter are different genres."]},{"title":["行傳與保羅書信互補","Acts and Paul complement each other"],"body":["行傳是路加的敘事，保羅書信直接面對收信群體；兩者可比較，但不能把書信全部塞進行傳時序。","Acts is Luke’s narrative while Paul’s letters address recipients directly; compare without forcing every letter into Acts’ timeline."]},{"title":["保羅書信的編組、作者與年代","Pauline grouping, authorship, and date"],"body":["正典從羅馬書到腓利門書共十三卷。以弗所、歌羅西、帖撒羅尼迦後書與教牧書信的直接作者、日期和寫作情境在學界有不同看法；逐卷頁面按文本研讀並標示推論。","The canon groups thirteen letters from Romans through Philemon. Direct authorship, dates, and settings of Ephesians, Colossians, 2 Thessalonians, and the Pastorals are debated; the book pages read the received texts while flagging inference."]},{"title":["先問收信人，再應用家戶段落","Household texts need recipients and power analysis"],"body":["以弗所書、歌羅西書、提多書等談妻子、丈夫、奴僕、主人；腓利門書更讓被奴役的阿尼西母成為焦點。古代規範不可拿來保護今日家暴或奴役。","Ephesians, Colossians, and Titus discuss wives, husbands, enslaved people, and masters; Philemon centers Onesimus. Ancient household instructions must not protect modern abuse or enslavement."]},{"title":["女性同工與教導爭議","Women coworkers and disputed teaching texts"],"body":["羅馬書 16 章、腓立比書 4 章記錄女性同工；哥林多前書 11 與 14 章、提摩太前書 2–3 章涉及聚會教導爭議，應公開比較脈絡與不同詮釋。","Romans 16 and Philippians 4 name women coworkers; 1 Corinthians 11 and 14 and 1 Timothy 2–3 contain disputed gathering and teaching texts requiring contextual and interpretive comparison."]},{"title":["希伯來書不是反猶太宣言","Hebrews is not anti-Jewish"],"body":["「新約」「更美」要放在作者對以色列經文的內部詮釋中，避免宣稱猶太人被神棄絕。","Place new covenant and better language within interpretation of Israel’s Scriptures; do not declare Jews rejected."]},{"title":["一般書信彼此不同","General Epistles are diverse"],"body":["雅各的智慧、彼得的受苦、約翰的群體分裂、猶大的警告各有問題；也須避免把所有反對者都稱為假教師。","James’s wisdom, Peter’s suffering, Johannine rupture, and Jude’s warning address distinct situations; avoid labeling every opponent false."]},{"title":["啟示錄先是給七教會的信","Revelation first addresses seven churches"],"body":["獸與數字先在羅馬世界和舊約回聲中讀；千年等末世觀點可比較，不以一種時間表壟斷文本。","Read beasts and numbers in Roman and scriptural contexts; compare views of the millennium without one timetable monopolizing the text."]},{"title":["文字傳承需誠實呈現","Teach manuscript evidence candidly"],"body":["馬可 16:9–20、約翰 7:53–8:11 等段落有重要抄本註記，可用譯本說明；來源差異不是教學障礙。","Mark 16:9–20 and John 7:53–8:11 have important textual notes; explain them with translation apparatus."]},{"title":["避免反猶太與傷害性應用","Avoid anti-Judaism and harmful applications"],"body":["耶穌與第一批門徒都是猶太人；關於順服、殉道、疾病與審判的教學應尊重受創者及當代安全。","Jesus and his first followers were Jewish; teaching submission, martyrdom, sickness, and judgment must respect survivor safety."]}],"lessons":[{"title":["一｜27 卷的閱讀地圖","1 | A map of 27 books"],"refs":"路 1:1–4；徒 1:1–8；來 1:1–4；啟 1:1–4 / Luke 1:1–4; Acts 1:1–8; Heb 1:1–4; Rev 1:1–4","aim":["能辨認福音、敘事、書信、講道式勸勉與啟示文學。","Identify Gospels, narrative, letters, sermon-like exhortation, and apocalypse."],"flow":[["按六類排列 27 卷。","Group the 27 books in six sets."],["比較四個開頭的收信人與文體。","Compare recipients and genres in four openings."],["選一卷指出最想問的歷史問題。","Choose one historical question for a book."]],"question":["正典編排是否等於寫作順序？","Is canon order a writing timeline?"],"watch":["希伯來書不宜簡單標為保羅所寫。","Do not simply assign Hebrews to Paul."]},{"title":["二｜四福音與耶穌","2 | Four Gospels and Jesus"],"refs":"太 1；可 1；路 1；約 1 / Matt 1; Mark 1; Luke 1; John 1","aim":["比較四種敘事開頭和耶穌身份的焦點。","Compare four openings and their focal claims about Jesus."],"flow":[["四組各讀一卷開頭。","Assign each group one opening."],["找出以色列經文的引用或回聲。","Find Israel’s scriptural echoes."],["回到受難復活看各卷如何收束。","Consider each ending at passion and resurrection."]],"question":["差異如何幫助閱讀而不強迫同化？","How can differences help rather than demand harmonization?"],"watch":["避免對猶太人物作集體歸責。","Avoid collective blame of Jews."]},{"title":["三｜使徒行傳的跨界群體","3 | Acts and boundary crossings"],"refs":"徒 2；6；10；15；28 / Acts 2; 6; 10; 15; 28","aim":["觀察聖靈、資源分配、外邦人接納與會議。","Trace Spirit, resource distribution, Gentile welcome, and council debate."],"flow":[["在地圖上標出敘事移動。","Map the narrative movement."],["比較寡婦與哥尼流的處境。","Compare widows and Cornelius."],["討論會議如何形成共同決定。","Discuss how the council reaches a shared decision."]],"question":["誰需要改變，群體才能更加公義？","Who must change for a more just community?"],"watch":["敘事中的做法不必全變成永久制度。","Not every narrated practice is a permanent rule."]},{"title":["四｜十三卷保羅書信的閱讀路線","4 | Reading the thirteen Pauline letters"],"refs":"羅 3, 12, 16；林前 11–13；加 2, 5；腓 2；提前 5；門 8–21 / Rom 3, 12, 16; 1 Cor 11–13; Gal 2, 5; Phil 2; 1 Tim 5; Phlm 8–21","aim":["能按正典順序找到十三卷，分辨群體書信、同工書信及腓利門書的具體關係問題。","Locate all thirteen in canon order and distinguish community letters, coworker letters, and Philemon’s relational appeal."],"flow":[["沿羅馬、哥林多、加拉太、腓立比、提摩太與腓利門標出收信人和問題。","Map recipients and issues in Romans, Corinth, Galatia, Philippi, Timothy, and Philemon."],["比較「稱義／自由」「身體／主餐」「同工／寡婦／阿尼西母」三組主題。","Compare justification/freedom, body/meal, and coworkers/widows/Onesimus."],["每組從一卷逐章研讀選一章，說明其歷史推論與今日應用的界線。","Let each group select a chapter study and separate historical inference from present application."]],"question":["哪一封信最明顯使福音碰觸權力與資源？","Which letter most clearly brings the gospel into power and resources?"],"watch":["作者問題與正典編組是兩件事；奴僕和女性段落須顧及權力與安全。","Canon grouping and authorship are different questions; discuss slavery and women texts with power and safety in view."]},{"title":["五｜希伯來書與堅忍","5 | Hebrews and perseverance"],"refs":"來 2；4:14–16；8；10:19–25；13 / Heb 2; 4:14–16; 8; 10:19–25; 13","aim":["追蹤憐憫祭司、新約、警告與群體扶持。","Trace the merciful priest, covenant, warning, and mutual support."],"flow":[["找出舊約引文。","Find older scriptural quotations."],["將嚴厲警告與安慰並讀。","Read warning beside reassurance."],["討論款待與囚犯照顧。","Discuss hospitality and prisoners."]],"question":["作者如何讓神學成為群體行動？","How does theology become communal action?"],"watch":["「新」不等於猶太人被棄絕。","New does not mean Jews are rejected."]},{"title":["六｜雅各與彼得：信心與受苦","6 | James and Peter: action and suffering"],"refs":"雅 2–3；彼前 2:4–12；彼後 2–3 / Jas 2–3; 1 Pet 2:4–12; 2 Pet 2–3","aim":["比較偏待、舌頭、寄居與辨別敗壞教師。","Compare favoritism, speech, exile identity, and discernment of corrupt teaching."],"flow":[["讀雅各的貧富場景。","Read James’s rich/poor scene."],["比較彼得前書的群體身份。","Compare 1 Peter’s community identity."],["評估彼得後書所指的剝削行為。","Assess exploitative acts in 2 Peter."]],"question":["如何避免把受苦理想化？","How can suffering be taught without romanticizing it?"],"watch":["奴僕順服經文不可要求人留在暴力中。","Servant submission must never demand staying in violence."]},{"title":["七｜約翰、猶大：愛與分辨","7 | John and Jude: love and discernment"],"refs":"約壹 3–4；約貳 5–11；約參 5–12；猶 20–25 / 1 John 3–4; 2 John 5–11; 3 John 5–12; Jude 20–25","aim":["在群體分裂中分辨真理、接待界線與憐憫。","Discern truth, hospitality boundaries, and mercy amid rupture."],"flow":[["比較三封約翰書信的收信情境。","Compare the three Johannine settings."],["找出猶大書末段的實際行動。","Find Jude’s closing actions."],["討論接待與保護如何並存。","Discuss welcome alongside protection."]],"question":["如何辨識具體傷害而不獵巫？","How can we identify harm without witch hunts?"],"watch":["「敵基督」不可泛化為對異見者的標籤。","Do not use antichrist as a generic label for dissenters."]},{"title":["八｜啟示錄與整部新約的盼望","8 | Revelation and New Testament hope"],"refs":"啟 1–3；5；13；18；21–22 / Rev 1–3; 5; 13; 18; 21–22","aim":["從七教會、被殺羔羊、帝國經濟到新創造收束總覽。","Move from seven churches and slain Lamb through empire and new creation."],"flow":[["辨認書信、預言與異象的層次。","Distinguish letter, prophecy, and vision."],["比較獸、巴比倫和羔羊。","Compare beast, Babylon, and Lamb."],["讀列國得醫治，回顧二十七卷的共同問題。","Read nations healed and revisit the 27-book questions."]],"question":["盼望如何影響今日的忠誠與公義？","How does hope shape fidelity and justice today?"],"watch":["不要把數字和獸直接配對當代人事。","Do not map numbers and beasts directly onto current events."]}],"discussion":[{"q":["為何需要四卷福音，而非一份拼合傳記？","Why four Gospels rather than one merged biography?"],"a":["各卷選材與編排不同；保留差異可看見各自的神學關懷。","Distinct selection and design reveal each account’s concerns."]},{"q":["使徒行傳主要是「彼得與保羅傳」嗎？","Is Acts simply a life of Peter and Paul?"],"a":["路加也寫聖靈、寡婦、司提反、腓利、百基拉等，以及群體決策。","Luke also includes the Spirit, widows, Stephen, Philip, Priscilla, and communal decisions."]},{"q":["新約中的保羅書信有幾卷？腓利門書屬哪一組？","How many Pauline letters, and where does Philemon belong?"],"a":["傳統正典分類有十三卷，羅馬書至腓利門書；腓利門書是保羅書信。","The traditional canon grouping has thirteen, Romans through Philemon; Philemon is Pauline."]},{"q":["希伯來書是保羅寫的嗎？","Was Hebrews written by Paul?"],"a":["書卷沒有署名，傳統與現代研究對作者有不同看法；總覽不作確定歸屬。","The work is anonymous; traditions and scholarship differ, so avoid a certain attribution."]},{"q":["雅各與保羅的信心／行為是否只能對立？","Must James and Paul on faith and works be opposed?"],"a":["先辨認各自處理的問題：雅各反對空洞口號，保羅論證外邦人與律法等處境。","Identify their distinct issues: James challenges empty words; Paul discusses Gentiles, Torah, and more."]},{"q":["約翰二書與三書為何對接待的態度不同？","Why do 2 and 3 John differ in hospitality?"],"a":["兩卷面對不同的巡迴教師與權力問題；愛與分辨不能抽成單一句口號。","They address different travelers and power conflicts; love and discernment cannot be reduced to one slogan."]},{"q":["猶大書引用以諾傳統代表甚麼？","What does Jude’s Enoch reference show?"],"a":["它反映當時猶太文獻環境；引用文字不自動決定整卷書的正典地位。","It reflects Jewish literary culture; quotation does not itself settle canon status."]},{"q":["啟示錄首先是給誰的？","Who first received Revelation?"],"a":["書卷寫給七個小亞細亞教會；解讀象徵應先考慮其羅馬時代處境。","Seven Asia Minor churches received it; interpret imagery first in their Roman setting."]},{"q":["新約正典順序是否等於成書時間？","Does canon order equal composition order?"],"a":["不是；常見編排以書卷群組導讀，個別成書日期需另行研究。","No; common order groups books, while dating each requires separate study."]},{"q":["教「順服」「苦難」「忍耐」時如何顧及安全？","How should teaching submission and suffering protect safety?"],"a":["先辨認權力不平等和受害者需要；任何經文都不授權施暴或阻止求助。","Name power imbalances and survivor needs; no passage authorizes abuse or blocks help."]},{"q":["哥林多前後書面對同一種問題嗎？","Do 1 and 2 Corinthians address the same issue?"],"a":["前書處理結黨、身體與聚會等問題；後書深談受傷關係、使徒權柄與奉獻。","The first letter addresses factions, bodies, and gatherings; the second focuses on strained relations, authority, and the collection."]},{"q":["羅馬書 13 章是否要求無條件服從政府？","Does Romans 13 require unconditional obedience to rulers?"],"a":["段落談公共秩序與責任，但不能使權柄免於問責；仍須與 12 章愛仇敵及 13 章愛鄰舍連讀。","It treats public order without exempting rulers from accountability; read with love of enemies in chapter 12 and neighbor-love in chapter 13."]},{"q":["「我靠著那加給我力量的，凡事都能做」在腓立比書指甚麼？","What does “I can do all things” mean in Philippians?"],"a":["4:10–13 談保羅在豐富與缺乏中學知足，並感謝同工的供應；不是任何願望必成的保證。","Philippians 4:10–13 concerns contentment in plenty and need amid partners’ support, not a promise of every desired outcome."]},{"q":["腓利門書明說阿尼西母已經獲自由嗎？","Does Philemon state that Onesimus was freed?"],"a":["沒有。保羅要求接納他「不再是奴僕，乃是高過奴僕」；結果未記錄，應保留張力並正視奴役。","No. Paul asks for welcome “no longer as a slave” but records no outcome; retain the tension and confront enslavement."]}],"sources":[{"title":["BibleProject｜新約書卷導讀","BibleProject | New Testament guides"],"desc":["依書卷查閱各種文體與結構；可與本頁比較。","Book-by-book literary overviews to compare with this page."],"url":"https://bibleproject.com/guides/categories/new-testament/"},{"title":["BibleProject｜使徒行傳","BibleProject | Acts"],"desc":["聖靈、地理擴展與群體邊界。","Spirit, geographic spread, and communal boundaries."],"url":"https://bibleproject.com/guides/book-of-acts/"},{"title":["BibleProject｜羅馬書","BibleProject | Romans"],"desc":["保羅書信的一個入口，提示收信人與論證。","An entry to Paul’s letters and their argumentative design."],"url":"https://bibleproject.com/guides/book-of-romans/"},{"title":["BibleProject｜希伯來書","BibleProject | Hebrews"],"desc":["祭司、立約與堅忍的論證。","Priesthood, covenant, and perseverance."],"url":"https://bibleproject.com/guides/book-of-hebrews/"},{"title":["BibleProject｜雅各書","BibleProject | James"],"desc":["智慧、言語、偏待與實踐。","Wisdom, speech, favoritism, and practice."],"url":"https://bibleproject.com/guides/book-of-james/"},{"title":["BibleProject｜彼得前書","BibleProject | 1 Peter"],"desc":["寄居、群體身份與受苦。","Sojourning, identity, and suffering."],"url":"https://bibleproject.com/guides/book-of-1-peter/"},{"title":["BibleProject｜約翰一至三書","BibleProject | 1–3 John"],"desc":["三封書信的相愛、真理及接待問題。","Love, truth, and hospitality in three letters."],"url":"https://bibleproject.com/guides/books-of-1-3-john/"},{"title":["BibleProject｜猶大書","BibleProject | Jude"],"desc":["猶太文獻回聲、警告與憐憫。","Jewish literary echoes, warning, and mercy."],"url":"https://bibleproject.com/guides/book-of-jude/"},{"title":["BibleProject｜啟示錄","BibleProject | Revelation"],"desc":["七教會、異象與新創造。","Seven churches, visions, and new creation."],"url":"https://bibleproject.com/guides/book-of-revelation/"},{"title":["耶魯公開課｜新約歷史與文學","Open Yale Courses | New Testament History and Literature"],"desc":["歷史與文學研究角度。","A historical and literary academic perspective."],"url":"https://oyc.yale.edu/religious-studies/rlst-152"},{"title":["BibleProject｜哥林多前書","BibleProject | 1 Corinthians"],"desc":["分裂、身體、恩賜和復活的全書結構。","Divisions, bodies, gifts, and resurrection."],"url":"https://bibleproject.com/guides/book-of-1-corinthians/"},{"title":["BibleProject｜哥林多後書","BibleProject | 2 Corinthians"],"desc":["受傷關係、使徒權柄與跨地區奉獻。","Strained relationship, authority, and collection."],"url":"https://bibleproject.com/guides/book-of-2-corinthians/"},{"title":["BibleProject｜加拉太書","BibleProject | Galatians"],"desc":["外邦人歸屬、自由與聖靈。","Gentile belonging, freedom, and Spirit."],"url":"https://bibleproject.com/guides/book-of-galatians/"},{"title":["BibleProject｜以弗所書","BibleProject | Ephesians"],"desc":["和平、合一與新生活。","Peace, unity, and new life."],"url":"https://bibleproject.com/guides/book-of-ephesians/"},{"title":["BibleProject｜腓立比書","BibleProject | Philippians"],"desc":["同工、謙卑與患難中的喜樂。","Partnership, humility, and joy under pressure."],"url":"https://bibleproject.com/guides/book-of-philippians/"},{"title":["BibleProject｜歌羅西書","BibleProject | Colossians"],"desc":["基督首位與群體生活。","Christ’s preeminence and shared life."],"url":"https://bibleproject.com/guides/book-of-colossians/"},{"title":["BibleProject｜帖撒羅尼迦前後書","BibleProject | 1–2 Thessalonians"],"desc":["復活盼望、末世焦慮與工作。","Resurrection hope, end-time anxiety, and work."],"url":"https://bibleproject.com/guides/book-of-1-thessalonians/"},{"title":["BibleProject｜提摩太前書","BibleProject | 1 Timothy"],"desc":["教導、領袖與群體照顧。","Teaching, leaders, and community care."],"url":"https://bibleproject.com/guides/book-of-1-timothy/"},{"title":["BibleProject｜提多書","BibleProject | Titus"],"desc":["可靠教導、恩典與善行。","Sound teaching, grace, and good work."],"url":"https://bibleproject.com/guides/book-of-titus/"},{"title":["BibleProject｜腓利門書","BibleProject | Philemon"],"desc":["阿尼西母、伙伴關係與奴役的倫理問題。","Onesimus, partnership, and the ethics of enslavement."],"url":"https://bibleproject.com/guides/book-of-philemon/"}]};</script><script src="../assets/nt-overview.js?v=20261103-paul" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
