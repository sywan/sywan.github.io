復；殿基立下時有人歡呼有人哭。","The altar rises first; feasts resume, and the foundation draws both cheers and tears."]},{"refs":"5–6","title":["先知、調查與完工","Prophets, inquiry, and completion"],"body":["哈該與撒迦利亞鼓勵重建；省長調查，波斯檔案確認詔令，殿完工。","Haggai and Zechariah spur rebuilding; an inquiry confirms the decree, and the temple is completed."]},{"refs":"9–10","title":["婚姻危機與未竟結尾","Marriage crisis and unfinished ending"],"body":["以斯拉哀禱，群體決議離絕部分妻子；名單結尾沒有交代受影響者後續。","Ezra laments; the assembly decides to separate some wives, and the final list leaves affected families’ futures untold."]}],"mapIntro":["沿八個段落觀察以斯拉記的敘事推進與轉折。","Trace the movement of Ezra through eight teaching units."],"movements":[{"refs":"1","title":["古列與歸回","Cyrus and return"],"body":["波斯王允許歸回並歸還殿器，開啟復建。","The Persian king permits return and restores temple vessels."]},{"refs":"2","title":["回歸者的名字","Names of returnees"],"body":["名冊列出家庭、祭司、利未人與資格待查者。","The list records families, priests, Levites, and disputed credentials."]},{"refs":"3","title":["祭壇與根基","Altar and foundation"],"body":["祭壇先立，節期恢復；殿基立下時有人歡呼有人哭。","The altar rises first; feasts resume, and the foundation draws both cheers and tears."]},{"refs":"4","title":["反對與停工","Opposition and delay"],"body":["當地人提議參與遭拒，控告與行政命令使工程受阻。","Local people offer participation and are rejected; accusations and decrees halt work."]},{"refs":"5–6","title":["先知、調查與完工","Prophets, inquiry, and completion"],"body":["哈該與撒迦利亞鼓勵重建；省長調查，波斯檔案確認詔令，殿完工。","Haggai and Zechariah spur rebuilding; an inquiry confirms the decree, and the temple is completed."]},{"refs":"7","title":["以斯拉受委任","Ezra’s commission"],"body":["以斯拉被介紹為律法學者，亞達薛西派他教導與治理。","Ezra is introduced as a Torah scholar and commissioned by Artaxerxes to teach and govern."]},{"refs":"8","title":["旅途與托付","Journey and entrusted goods"],"body":["以斯拉召集利未人、禁食求保護，記錄金銀交付與抵達。","Ezra gathers Levites, fasts for protection, and records the transfer of valuables and safe arrival."]},{"refs":"9–10","title":["婚姻危機與未竟結尾","Marriage crisis and unfinished ending"],"body":["以斯拉哀禱，群體決議離絕部分妻子；名單結尾沒有交代受影響者後續。","Ezra laments; the assembly decides to separate some wives, and the final list leaves affected families’ futures untold."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["第 4 章匯集跨時期的反對事件，不應誤讀為嚴格逐年連續記錄。","Chapter 4 collects opposition across periods; do not assume strict year-by-year sequence."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["古列的詔書","Cyrus’s decree"],"summary":["古列允許猶大人回耶路撒冷建殿，歸還被掠的器皿。","Cyrus permits Judeans to return and rebuild the temple and restores sacred vessels."],"deep":[["詔書使先知盼望進入波斯帝國的行政現實。","The decree places prophetic hope within Persian administration."],["神的主導藉異國統治者的政策展開。","Divine agency works through a foreign ruler’s policy."]],"caution":["不可把所有帝國政策自動視為無私善意。","Do not assume imperial policy is altruistic."],"question":["誰能返回，誰可能留在原地？","Who can return, and who may remain?"]},{"n":2,"refs":"2","title":["歸回名冊","Returnee register"],"summary":["名單記錄家庭、祭司、利未人、僕役與財物，有人無法證明家譜。","The register records families, priests, Levites, servants, and gifts; some cannot verify ancestry."],"deep":[["名單既確認身分，也顯出制度邊界。","The list confirms belonging while exposing institutional boundaries."],["名單是群體重建的記憶與制度文件。","The list is both memory and institutional record."]],"caution":["缺席名單者並非沒有生命或價值。","Those absent from a list still matter."],"question":["資格待查者在群體中如何被對待？","How are people with uncertain records treated?"]},{"n":3,"refs":"3","title":["祭壇與殿基","Altar and temple foundation"],"summary":["百姓先築祭壇守節，殿基立下時歡呼與哭泣交織。","The people restore altar and feasts; cheers and weeping mingle at the foundation."],"deep":[["老一代的眼淚不可被新一代的歡呼蓋過。","The elders’ tears should not be drowned by newer celebration."],["同一事件可以是新開始，也喚起舊失落。","One event can be new hope and remembered loss."]],"caution":["不要要求所有歸回者表現同一種情緒。","Do not demand one emotional response from all returnees."],"question":["為何同一根基引發相反情緒？","Why does one foundation evoke opposite emotions?"]},{"n":4,"refs":"4","title":["反對與停工","Opposition and work halted"],"summary":["鄰近群體提議協助遭拒，控告書與王命使工程停下；篇章跨越不同王朝。","Neighbors’ offer is rejected; accusations and royal orders halt work across different reigns."],"deep":[["閱讀公文時追問控告者、收件人與時間。","Ask who writes each letter, to whom, and when."],["拒絕、敵意與帝國公文都影響工程。","Refusal, hostility, and imperial paperwork shape the project."]],"caution":["對「敵人」稱呼須保留歷史與敘事角度的距離。","Read “adversaries” with attention to viewpoint and context."],"question":["哪些因素使合作變成衝突？","What turns possible cooperation into conflict?"]},{"n":5,"refs":"5","title":["先知與省長調查","Prophets and inquiry"],"summary":["哈該、撒迦利亞勉勵百姓重建；省長達乃詢問王的授權。","Haggai and Zechariah spur rebuilding; Governor Tattenai asks about authorization."],"deep":[["先知鼓勵和行政審查同時塑造工程進程。","Prophetic encouragement and official review both shape progress."],["先知話語與行政證據都在故事中起作用。","Prophetic speech and administrative evidence both matter."]],"caution":["完工不等於全部先知盼望已實現。","Completion does not fulfill every prophetic hope."],"question":["百姓如何回答省長的質問？","How do the builders answer the governor?"]},{"n":6,"refs":"6","title":["詔令確認與獻殿","Decree confirmed and dedication"],"summary":["大利烏查得古列詔書，支持工程；殿完工，百姓獻殿並守逾越節。","Darius finds Cyrus’s decree, supports work, and the people dedicate the temple and keep Passover."],"deep":[["獻殿與逾越節把新的開始接回出埃及記憶。","Dedication and Passover connect renewal to exodus memory."],["先知話語與行政證據都在故事中起作用。","Prophetic speech and administrative evidence both matter."]],"caution":["完工不等於全部先知盼望已實現。","Completion does not fulfill every prophetic hope."],"question":["重建之後為何守逾越節？","Why celebrate Passover after rebuilding?"]},{"n":7,"refs":"7","title":["以斯拉的使命","Ezra’s commission"],"summary":["以斯拉的祭司與律法學者身分被介紹，波斯王委他教導與審判。","Ezra’s priestly and scholarly lineage is introduced, and the Persian king commissions him to teach and judge."],"deep":[["「研究、遵行、教導」構成以斯拉的自我定位。","Study, practice, and teaching frame Ezra’s vocation."],["律法教導與帝國授權並存，須辨明兩種權力。","Torah teaching and imperial authorization coexist as distinct powers."]],"caution":["不要把政治授權等同神學無誤。","Political authorization is not theological infallibility."],"question":["教導者為何要先遵行？","Why must a teacher first practice?"]},{"n":8,"refs":"8","title":["禁食、旅途與財物","Fasting, journey, and goods"],"summary":["以斯拉召集人員、禁食求平安，托付金銀給祭司並抵達耶路撒冷。","Ezra gathers companions, fasts for safety, entrusts silver and gold, and reaches Jerusalem."],"deep":[["財物逐項點交顯示敬虔與問責並行。","Itemized transfer links piety and accountability."],["祈求保護與可核算的財物移交並行。","Prayer for safety accompanies accountable handling of resources."]],"caution":["不可把一次平安旅程當成所有旅者必得安全的應許。","Do not promise every traveler an identical outcome."],"question":["旅途中的信任如何具體落實？","How is trust made practical on the journey?"]},{"n":9,"refs":"9","title":["以斯拉的哀禱","Ezra’s lament"],"summary":["以斯拉得知通婚情況，撕衣、俯伏，為群體的過犯與恩典禱告。","Hearing of marriages, Ezra tears his clothes and prays over communal wrongdoing and grace."],"deep":[["禱告採第一人稱複數，領袖把自己放在群體之中。","The prayer says “we,” placing the leader within the community."],["危機關乎盟約忠誠與群體邊界，也伴隨具體家庭傷害。","The crisis concerns covenant boundaries and real harm to families."]],"caution":["不可將婦女與兒童僅當成抽象神學問題。","Do not reduce women and children to an abstract theological issue."],"question":["以斯拉如何把歷史與當下連接？","How does Ezra connect past and present?"]},{"n":10,"refs":"10","title":["離絕的決議","The separation decision"],"summary":["百姓聚集承認問題，設程序處理婚姻，最後列出涉事者；婦女兒童的後續未述。","The assembly acknowledges the crisis, sets procedures for marriages, and lists men involved; women’s and children’s futures are not narrated."],"deep":[["程序存在不代表被迫分離者的痛苦已得到解答。","A formal process does not resolve the suffering of separated families."],["危機關乎盟約忠誠與群體邊界，也伴隨具體家庭傷害。","The crisis concerns covenant boundaries and real harm to families."]],"caution":["不可將婦女與兒童僅當成抽象神學問題。","Do not reduce women and children to an abstract theological issue."],"question":["哪些聲音沒有出現在結尾名單中？","Whose voices are missing from the final list?"]}],"themesIntro":["以下主題由以斯拉記的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of Ezra and complement the chapter studies."],"themes":[{"refs":"1","title":["古列與歸回","Cyrus and return"],"body":["波斯王允許歸回並歸還殿器，開啟復建。","The Persian king permits return and restores temple vessels."],"caution":["不可把所有帝國政策自動視為無私善意。","Do not assume imperial policy is altruistic."]},{"refs":"3","title":["祭壇與根基","Altar and foundation"],"body":["祭壇先立，節期恢復；殿基立下時有人歡呼有人哭。","The altar rises first; feasts resume, and the foundation draws both cheers and tears."],"caution":["不要要求所有歸回者表現同一種情緒。","Do not demand one emotional response from all returnees."]},{"refs":"5–6","title":["先知、調查與完工","Prophets, inquiry, and completion"],"body":["哈該與撒迦利亞鼓勵重建；省長調查，波斯檔案確認詔令，殿完工。","Haggai and Zechariah spur rebuilding; an inquiry confirms the decree, and the temple is completed."],"caution":["完工不等於全部先知盼望已實現。","Completion does not fulfill every prophetic hope."]},{"refs":"8","title":["旅途與托付","Journey and entrusted goods"],"body":["以斯拉召集利未人、禁食求保護，記錄金銀交付與抵達。","Ezra gathers Levites, fasts for protection, and records the transfer of valuables and safe arrival."],"caution":["不可把一次平安旅程當成所有旅者必得安全的應許。","Do not promise every traveler an identical outcome."]},{"refs":"9–10","title":["婚姻危機與未竟結尾","Marriage crisis and unfinished ending"],"body":["以斯拉哀禱，群體決議離絕部分妻子；名單結尾沒有交代受影響者後續。","Ezra laments; the assembly decides to separate some wives, and the final list leaves affected families’ futures untold."],"caution":["不可將婦女與兒童僅當成抽象神學問題。","Do not reduce women and children to an abstract theological issue."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["第 9–10 章涉及婦女與兒童的離散；教學必須看見他們，避免把經文當作今日對跨族群婚姻的普遍禁令。","Chapters 9–10 involve women and children separated from families; do not turn the episode into a blanket modern ban on interethnic marriage."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."], ting, journey, and goods.”"],["比較 8 章的角色、場景與重複語詞。","Compare characters, settings, and repeated words in chapters 8."],["讀 8 章，整理這段如何接續全書。","Read chapter 8 and connect this unit to the whole book."]],"question":["旅途中的信任如何具體落實？","How is trust made practical on the journey?"],"practice":["不可把一次平安旅程當成所有旅者必得安全的應許。","Do not promise every traveler an identical outcome."]},{"refs":"9–10","title":["第 8 課｜婚姻危機與未竟結尾","Lesson 8 | Marriage crisis and unfinished ending"],"aim":["以斯拉哀禱，群體決議離絕部分妻子；名單結尾沒有交代受影響者後續。","Ezra laments; the assembly decides to separate some wives, and the final list leaves affected families’ futures untold."],"flow":[["讀 9 章，找出「以斯拉的哀禱」的轉折。","Read chapter 9 and trace the turn in “Ezra’s lament.”"],["比較 9–10 章的角色、場景與重複語詞。","Compare characters, settings, and repeated words in chapters 9–10."],["讀 10 章，整理這段如何接續全書。","Read chapter 10 and connect this unit to the whole book."]],"question":["以斯拉如何把歷史與當下連接？","How does Ezra connect past and present?"],"practice":["不可將婦女與兒童僅當成抽象神學問題。","Do not reduce women and children to an abstract theological issue."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["以斯拉記最常被忽略的人物是誰？為何？","Which character in Ezra is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜以斯拉—尼希米記導讀","BibleProject | Ezra-Nehemiah guide"],"url":"https://bibleproject.com/guides/book-of-ezra-nehemiah/"}],"footer":["以斯拉記 · 成人主日學教師版 · 請配合完整經文閱讀。","Ezra · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
