<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="士師記成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>士師記｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"JDG","category":["歷史敘事 · 舊約","OLD TESTAMENT · NARRATIVE"],"name":["士師記","Judges"],"subtitle":["以士師循環與越來越黑暗的敘事，看群體失序、領袖缺陷及暴力如何由外部衝突蔓延成內部傷害。","Through a spiraling cycle, Judges portrays communal disorder, flawed deliverers, and violence that spreads inward."],"overviewIntro":["以士師循環與越來越黑暗的敘事，看群體失序、領袖缺陷及暴力如何由外部衝突蔓延成內部傷害。","Through a spiraling cycle, Judges portrays communal disorder, flawed deliverers, and violence that spreads inward."],"lengthNote":["21 章；請按文學單元和整卷脈絡閱讀。","21 chapters; read each literary unit within the whole book."],"thesis":["拯救反覆來臨，群體卻未被治癒","Deliverance recurs, but the community is not healed"],"thesisDetail":["神的憐憫使拯救者出現；士師與百姓的行動卻證明軍事脫困不等於忠誠、公義或安全。","Mercy raises deliverers, yet escape from oppression does not guarantee fidelity, justice, or safety."],"keyQuestion":["誰能阻止報復、濫權與遺忘？","Who can interrupt revenge, power abuse, and forgetting?"],"keyAnswer":["全書末句引向王權的盼望與危險；撒母耳記會繼續檢驗君王，而不是直接給出簡單答案。","The ending raises hope and risk around kingship; Samuel tests kings rather than giving a simple solution."],"finalMovement":["全書以女性被擄與支派近乎滅絕作結；路得記在「士師秉政」時呈現另一種忠誠，撒母耳記則追問王權。","The book ends with seized women and a near-lost tribe; Ruth shows another kind of loyalty in those days, and Samuel tests kingship."],"readingKeys":[{"refs":"1–2","title":["由未竟到遺忘","From incomplete to forgotten"],"body":["開篇把地理上的未完成與世代記憶的斷裂連起來。","The opening joins unfinished settlement to broken memory."]},{"refs":"3–16","title":["英雄並不穩定","Deliverers are unstable"],"body":["早期到後期的士師逐漸更難被當成純粹榜樣。","Judges become increasingly hard to read as simple models."]},{"refs":"17–21","title":["結尾不是附錄","The ending is no appendix"],"body":["私設敬拜、掠奪、性暴力與內戰揭露整體失序。","Private cult, seizure, sexual assault, and civil war reveal systemic disorder."]},{"refs":"11; 19–21","title":["讓受害者可見","Keep victims visible"],"body":["閱讀者須面對敘事中常被沉默的女性與弱者。","Readers must attend to women and vulnerable people often denied a voice."]}],"mapIntro":["以下分段是教學導覽，章界有助查找，並非每一段論述的天然邊界。","These movements guide study; chapter divisions are useful but do not always mark a natural literary boundary."],"movements":[{"refs":"1–2","title":["第 1 課｜未完成與遺忘","Lesson 1 | Incompletion and forgetting"],"body":["比較未趕出的居民與新一代不認識神作為的敘事。","Compare remaining inhabitants with a generation that does not know the story."]},{"refs":"3–5","title":["第 2 課｜拯救、領導與歌","Lesson 2 | Deliverance, leadership, and song"],"body":["比較早期士師、底波拉與雅億，並讀勝利詩歌的多重聲音。","Compare early judges, Deborah, and Jael, then read the victory song’s varied voices."]},{"refs":"6–7","title":["第 3 課｜基甸的恐懼與得勝","Lesson 3 | Gideon’s fear and victory"],"body":["觀察蒙召、求證、縮軍和夜間鼓勵。","Observe calling, signs, reduced troops, and reassurance at night."]},{"refs":"8–10","title":["第 4 課｜領袖變質與亞比米勒","Lesson 4 | Corrupted leadership"],"body":["讀基甸後期、亞比米勒與以色列再次呼求，評估權力的副作用。","Read Gideon’s later years, Abimelech, and renewed cries to assess power."]},{"refs":"11–12","title":["第 5 課｜耶弗他的女兒與內戰","Lesson 5 | Jephthah’s daughter and civil war"],"body":["以女兒的處境及口音屠殺討論誓言與身分排斥。","Center the daughter’s situation and shibboleth killings in a discussion of vows and exclusion."]},{"refs":"13–16","title":["第 6 課｜參孫的能力與失控","Lesson 6 | Samson’s strength and unraveling"],"body":["從出生宣告到死亡追蹤能力、慾望、報復與脆弱。","Trace calling, desire, revenge, and vulnerability from birth to death."]},{"refs":"17–18","title":["第 7 課｜私設敬拜與掠奪","Lesson 7 | Private shrine and seizure"],"body":["觀察米迦神堂與但支派如何讓宗教服務私利和暴力。","Observe how Micah’s shrine and Dan’s migration make religion serve gain and force."]},{"refs":"19–21","title":["第 8 課｜暴行、內戰與女性被奪","Lesson 8 | Assault, civil war, and seized women"],"body":["以創傷知情方式讀全書最黑暗的結尾，分析以暴制暴。","Read the book’s darkest ending with trauma care and analyze escalating retaliation."]}],"mapCaution":{"title":["歷史與文學提醒","Historical and literary note"],"body":["本書以古代敘事、神學評價與編排方式說話；章節與年代問題宜參照整卷上下文，避免把故事當作現代新聞紀錄。","This ancient narrative communicates through theological evaluation and literary design; read episodes in context rather than as modern reporting."]},"chaptersIntro":["每章有摘要、兩個深入重點、詮釋提醒與課堂提問。章名與分段是本站的研讀提示。","Each chapter has a summary, two close-reading points, an interpretive caution, and a teaching question. Titles and divisions are study aids."],"chapters":[{"n":1,"refs":"1","title":["各支派未竟的征服","Incomplete tribal campaigns"],"summary":["猶大等支派出戰，但多處迦南居民仍留下；全章以重複的「沒有趕出」揭示未完成。","Judah and other tribes campaign, but many Canaanite residents remain; the repeated failure to drive them out marks incompletion."],"deep":[["開頭與約書亞記的得地總結形成對照","The opening contrasts with Joshua’s settlement summary"],["清單不是單純地理，還預備後文相處與同化問題","The list prepares later coexistence and assimilation problems"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["反覆的未完成如何塑造全書起點？","How does repeated incompletion shape the book’s opening?"]},{"n":2,"refs":"2","title":["波金責備與世代循環","Bochim and the generational cycle"],"summary":["耶和華使者責備百姓，約書亞一代之後興起不認識神作為的世代；離棄、壓迫、呼求與拯救循環展開。","A divine messenger rebukes Israel; after Joshua’s generation, a new generation does not know the story, and the cycle of apostasy and rescue begins."],"deep":[["2:10 強調記憶與傳承失敗","Verse 10 points to failed transmission"],["士師的出現是憐憫，不表示百姓或士師已成熟","Judges’ rise shows mercy, not moral maturity"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["這個循環中哪一步最容易被教學忽略？","Which stage of the cycle is easiest to overlook?"]},{"n":3,"refs":"3","title":["俄陀聶、以笏與珊迦","Othniel, Ehud, and Shamgar"],"summary":["三名拯救者以不同方式對抗壓迫；以笏刺殺摩押王的敘事充滿諷刺與身體細節。","Three deliverers resist oppression in different ways; Ehud’s assassination of Moab’s king uses irony and bodily detail."],"deep":[["俄陀聶的模式最接近簡潔的拯救公式","Othniel fits the simple deliverer pattern"],["以笏的左手與密室安排使讀者注意權力的脆弱","Ehud’s left hand and private chamber expose royal vulnerability"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["敘事描寫成功是否等於讚許所有手段？","Does narrating success approve every method?"]},{"n":4,"refs":"4","title":["底波拉、巴拉與雅億","Deborah, Barak, and Jael"],"summary":["女先知底波拉召巴拉迎戰西西拉；勝局由雅億在帳棚中完成，顛倒對軍事英雄的預期。","Deborah summons Barak against Sisera; Jael ends the conflict in a tent, overturning expectations of martial heroism."],"deep":[["底波拉兼具先知與審判角色","Deborah acts as prophet and judge"],["勝利敘事由多名女性共同推進，不能歸功一位男性將領","Several women move the victory forward; one male commander cannot claim all credit"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["這章如何重新分配領導與功勞？","How does the chapter redistribute leadership and credit?"]},{"n":5,"refs":"5","title":["底波拉與巴拉之歌","The song of Deborah and Barak"],"summary":["詩歌歌頌願意參戰者、責問缺席支派，並以西西拉母親等待兒子的畫面結尾。","The song praises willing participants, questions absent tribes, and ends with Sisera’s mother waiting for her son."],"deep":[["詩歌不是第四章的逐字重述","The poem is not a verbatim replay of chapter 4"],["母親的等待提醒得勝歌中仍有失去與暴力","The waiting mother keeps loss visible within a victory song"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["為何詩歌以敵方母親的視角收尾？","Why does the poem end with the enemy’s mother?"]},{"n":6,"refs":"6","title":["基甸蒙召與疑問","Gideon’s call and questions"],"summary":["米甸壓迫時，基甸在酒醡打麥；神呼召他，他質問神的同在，拆毀巴力壇並求羊毛記號。","Under Midianite pressure Gideon threshes in a winepress; called by God, he questions divine presence, tears down Baal’s altar, and seeks fleece signs."],"deep":[["「大能勇士」稱呼與基甸恐懼形成張力","The “mighty warrior” address contrasts with fear"],["多次求證顯示不安，不宜當作普遍求神旨意公式","Repeated signs display anxiety, not a universal decision formula"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["神如何回應基甸的疑問與恐懼？","How does God meet Gideon’s doubt and fear?"]},{"n":7,"refs":"7","title":["三百人與米甸營","Three hundred against Midian"],"summary":["軍隊縮減至三百人，基甸夜聽敵營夢境，隨後用角、瓶與火把造成潰逃。","The force is reduced to three hundred; Gideon hears an enemy dream and then uses trumpets, jars, and torches to rout the camp."],"deep":[["縮軍理由是避免以色列自誇","The reduction prevents boasting"],["基甸夜間仍需再次被鼓勵，勇敢不是沒有恐懼","Gideon still needs reassurance at night; courage is not fearlessness"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["縮小軍隊的敘事目的是甚麼？","What purpose does the reduced army serve?"]},{"n":8,"refs":"8","title":["基甸的勝利與以弗得","Gideon’s victory and ephod"],"summary":["基甸追敵、懲罰拒助的城邑，拒絕王號卻造以弗得；以色列被它引誘，基甸死後再度離棄。","Gideon pursues enemies, punishes towns, rejects a royal title but makes an ephod that ensnares Israel; apostasy follows his death."],"deep":[["拒絕王號與王者般的報復、財富形成矛盾","Refusing a crown contrasts with kinglike revenge and wealth"],["以弗得把勝利紀念變成敬拜陷阱","The ephod turns victory memory into a worship trap"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["怎樣評估一位有功卻也造成傷害的領袖？","How should a successful yet harmful leader be assessed?"]},{"n":9,"refs":"9","title":["亞比米勒的血腥王權","Abimelech’s violent kingship"],"summary":["基甸之子亞比米勒殺兄弟奪權；約坦以樹木寓言批評他，示劍與亞比米勒最後互相毀滅。","Gideon’s son Abimelech murders brothers for power; Jotham’s tree parable condemns him, and his alliance with Shechem ends in mutual ruin."],"deep":[["約坦寓言把權力的誘惑說成荊棘的火","Jotham’s bramble parable exposes power’s lure"],["敘事反覆指出暴力如何回到施暴者身上","The narrative shows violence returning upon its agents"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["亞比米勒的故事如何預告王權的危險？","How does Abimelech foreshadow dangers of kingship?"]},{"n":10,"refs":"10","title":["兩位小士師與新的呼求","Two minor judges and renewed distress"],"summary":["陀拉、睚珥後，以色列再拜諸神而遭亞捫壓迫；神責備後百姓除去外邦神，仍急尋領袖。","After Tola and Jair, Israel again worships other gods and suffers Ammonite pressure; the people remove idols but still seek a leader."],"deep":[["眾神名單呈現忠誠的破碎","The list of gods depicts fractured allegiance"],["神的責備與憐憫同時出現，沒有簡單保證","Rebuke and compassion coexist without easy guarantee"]],"caution":["士師記描述拯救者的行為，並不表示神學上全然肯定；古代暴力也不可作今日行動準則。","Judges narrates deliverers’ actions without necessarily endorsing them; ancient violence is not a model for today."],"question":["危機時的悔改如何超過短暫求助？","How can repentance in crisis be more than temporary relief?"]},{"n":11,"refs":"11","title":["耶弗他與女兒","Jephthah and his daughter"],"summary":["被逐出的耶弗他成為將領，先與亞捫王辯論，卻以魯莽誓言造成女兒的悲劇。","The rejected Jephthah becomes leader and debates Ammon’s king, but his rash vow brings tragedy upon his daughter."],"deep":[["外交辯論有歷史論證，不表示後來誓言合理","His historical argument does not vindicate his vow"],["女兒承受父親決定的代價，敘事不要求讀者讚美此舉","His daughter bears the cost of his decision; the story does not demand praise"]],"caution":["耶弗他女兒與參孫故事涉及家庭、性別及暴力；切勿責怪受害者或把誓言傷害浪漫化。","Jephthah’s daughter and Samson episodes involve gender and violence; do not blame victims or romanticize harmful vows."],"question":["如何把女兒的遭遇放在講授中心？","How can teaching center the daughter’s experience?"]},{"n":12,"refs":"12","title":["以法蓮衝突與口音試驗","Ephraim conflict and the shibboleth"],"summary":["耶弗他與以法蓮人內戰，以口音辨人造成屠殺；其後三名小士師短暫接續。","Jephthah’s conflict with Ephraim becomes civil war, where a pronunciation test enables killing; three minor judges follow."],"deep":[["內部流血顯示拯救者也能傷害自己的民","Civil bloodshed shows deliverers can harm their own people"],["口音變成排除與殺戮工具，具強烈倫理警示","Accent becomes a lethal exclusion tool"]],"caution":["耶弗他女兒與參孫故事涉及家庭、性別及暴力；切勿責怪受害者或把誓言傷害浪漫化。","Jephthah’s daughter and Samson episodes involve gender and violence; do not blame victims or romanticize harmful vows."],"question":["語言或身分標記如何被權力濫用？","How can language or identity markers be abused by power?"]},{"n":13,"refs":"13","title":["參孫出生的宣告","Announcement of Samson’s birth"],"summary":["一位不生育的婦人領受使者的宣告；參孫從母腹歸神，父母反覆尋問如何養育他。","A barren woman receives a messenger’s announcement; Samson is consecrated from the womb, and his parents ask how to raise him."],"deep":[["母親先領受並轉述信息，並非被動背景","The mother receives and conveys the message first"],["受託身分不等於日後行為必定合宜","Consecration does not guarantee later conduct"]],"caution":["耶弗他女兒與參孫故事涉及家庭、性別及暴力；切勿責怪受害者或把誓言傷害浪漫化。","Jephthah’s daughter and Samson episodes involve gender and violence; do not blame victims or romanticize harmful vows."],"question":["蒙召的起點與人的選擇有何關係？","How does a calling relate to later choices?"]},{"n":14,"refs":"14","title":["參孫的婚事與謎語","Samson’s marriage and riddle"],"summary":["參孫堅持與非利士女子結婚；獅子與蜜成為婚宴謎語，威脅、洩密與報復使關係破裂。","Samson insists on marrying a Philistine woman; lion and honey become a wedding riddle, and threats, disclosure, and retaliation unravel relationships."],"deep":[["參孫父母的擔心與敘事中更大衝突並存","The parents’ concern coexists with a wider conflict"],["女子受威脅才透露答案，不能簡單歸咎於她","The woman reveals the answer under threat, not mere disloyalty"]],"caution":["耶弗他女兒與參孫故事涉及家庭、性別及暴力；切勿責怪受害者或把誓言傷害浪漫化。","Jephthah’s daughter and Samson episodes involve gender and violence; do not blame victims or romanticize harmful vows."],"question":["威脅如何改變我們對婚宴事件的判斷？","How do threats change our reading of the wedding story?"]},{"n":15,"refs":"15","title":["報復連鎖與驢腮骨","Cycles of revenge and a jawbone"],"summary":["參孫縱火報復，非利士人殺害女子與父親，猶大人交出參孫；他以驢腮骨擊殺多人後求水。","Samson’s retaliation prompts the killing of his former wife and her father; Judah hands him over, and he kills with a jawbone before crying for water."],"deep":[["每次報復都宣稱回應前一傷害，暴力卻擴大","Each retaliation answers a prior wrong yet widens violence"],["求水暴露所謂強者的脆弱","His plea for water exposes the strongman’s fragility"]],"caution":["耶弗他女兒與參孫故事涉及家庭、性別及暴力；切勿責怪受害者或把誓言傷害浪漫化。","Jephthah’s daughter and Samson episodes involve gender and violence; do not blame victims or romanticize harmful vows."],"question":["這段如何揭露以報復維持尊嚴的代價？","What cost of honor through retaliation does this expose?"]},{"n":16,"refs":"16","title":["大利拉、失力與參孫之死","Delilah, lost strength, and Samson’s death"],"summary":["參孫向大利拉洩露頭髮秘密，被擒、失明與羞辱；最後推倒殿柱，自己與眾人同死。","Samson discloses his secret to Delilah, is captured and blinded, and finally collapses the temple pillars, dying with many others."],"deep":[["敘事明說耶和華離開他，力量非自有","The text says the Lord left him; strength was not his own"],["結局混合審判、報復與自我犧牲，不能化成簡單英雄口號","The ending mixes judgment, revenge, and self-destruction"]],"caution":["耶弗他女兒與參孫故事涉及家庭、性別及暴力；切勿責怪受害者或把誓言傷害浪漫化。","Jephthah’s daughter and Samson episodes involve gender and violence; do not blame victims or romanticize harmful vows."],"question":["參孫的結局使你如何重新評估他的整段人生？","How does Samson’s ending reshape the whole story?"]},{"n":17,"refs":"17","title":["米迦的私設神堂","Micah’s private shrine"],"summary":["米迦用失而復得的銀子造像與神堂，先立兒子、再雇利未人作祭司，自稱蒙福。","Micah builds a shrine with recovered silver, appoints his son and then hires a Levite priest, assuming divine blessing."],"deep":[["重複的宗教用語不等於正確敬拜","Religious language does not prove faithful worship"],["金錢與祭司職分被用來保障私人利益","Money and priesthood serve private security"]],"caution":["最後五章涉及性暴力、人口掠奪與集體報復；教學需顧及受創學員，不可把敘事描寫當成命令。","The final chapters include sexual violence and collective revenge; teach with trauma care and never turn description into command."],"question":["甚麼使米迦自以為「必蒙福」？","What makes Micah assume he will be blessed?"]},{"n":18,"refs":"18","title":["但支派奪像與拉億","Dan seizes the idol and Laish"],"summary":["但支派探地，搶走米迦的像與祭司，再攻取拉億；宗教與武力一起服務新的定居。","Dan’s scouts seek territory, steal Micah’s idol and priest, and seize Laish; cult and force serve new settlement."],"deep":[["祭司選擇更大群體的職位，暴露利益邏輯","The priest follows a larger constituency, exposing self-interest"],["「安居無慮」的拉億人遭攻擊，不可抹去受害者","The unsuspecting people of Laish remain victims"]],"caution":["最後五章涉及性暴力、人口掠奪與集體報復；教學需顧及受創學員，不可把敘事描寫當成命令。","The final chapters include sexual violence and collective revenge; teach with trauma care and never turn description into command."],"question":["宗教資源如何被拿來合理化掠奪？","How can religious resources be made to justify seizure?"]},{"n":19,"refs":"19","title":["利未人、妾與基比亞暴行","The Levite, his concubine, and Gibeah"],"summary":["利未人與妾在基比亞投宿，暴民施暴；女子死亡後，她的身體被分送各支派，引發全國震動。","A Levite and his concubine stay in Gibeah; a mob assaults her, and after her death the Levite sends her body to the tribes."],"deep":[["經文主要透過男性行動敘述，女子的聲音極少","Her voice is largely absent in the male-centered narration"],["利未人將她推出、後又利用遺體，不能被當作單純正義控訴者","The Levite exposes and later uses her; he is not a simple righteous witness"]],"caution":["最後五章涉及性暴力、人口掠奪與集體報復；教學需顧及受創學員，不可把敘事描寫當成命令。","The final chapters include sexual violence and collective revenge; teach with trauma care and never turn description into command."],"question":["如何讓受害女子不再次成為課堂工具？","How can teaching avoid using the victim again?"]},{"n":20,"refs":"20","title":["便雅憫內戰","Civil war against Benjamin"],"summary":["各支派聚集追究基比亞罪行，便雅憫拒交兇手；兩度慘敗後聯軍得勝，戰事幾乎滅絕一支派。","The tribes gather to address Gibeah’s crime; Benjamin refuses the perpetrators, and after two defeats the coalition nearly destroys the tribe."],"deep":[["求問神也沒有免去錯誤與死傷","Seeking God does not remove casualties or error"],["集體報復越過追究個別罪犯的範圍","Collective retaliation outstrips accountability for perpetrators"]],"caution":["最後五章涉及性暴力、人口掠奪與集體報復；教學需顧及受創學員，不可把敘事描寫當成命令。","The final chapters include sexual violence and collective revenge; teach with trauma care and never turn description into command."],"question":["公義訴求何時變成新的傷害？","When can a demand for justice become a new harm?"]},{"n":21,"refs":"21","title":["以暴力修補誓言","Violence used to repair a vow"],"summary":["聯軍因誓言與便雅憫將滅而困擾，先屠殺雅比基列人，再讓便雅憫人擄走示羅女子；全書以「各人任意而行」收尾。","Troubled by an oath and Benjamin’s survival, the coalition attacks Jabesh-gilead and arranges the seizure of women at Shiloh; the book ends with everyone doing what seems right."],"deep":[["補救方案犧牲女性與另一城邑，暴力並未止息","Their solution sacrifices women and another town; violence continues"],["末句不是對全書人物的嘉許，而是深刻控訴","The closing line is an indictment, not approval"]],"caution":["最後五章涉及性暴力、人口掠奪與集體報復；教學需顧及受創學員，不可把敘事描寫當成命令。","The final chapters include sexual violence and collective revenge; teach with trauma care and never turn description into command."],"question":["為何一個看似解決問題的方案仍可能極不公義？","Why can an apparent solution remain deeply unjust?"]}],"themesIntro":["以下主題橫跨全書；先讀完整經文，再比較各段的不同聲音。","These themes run through the book; read full passages before comparing their distinct voices."],"themes":[{"refs":"2:10–23; 3–16","title":["循環與下滑","Cycles and decline"],"body":["離棄、壓迫、求救、拯救反覆出現，但士師本人的品格與群體狀態逐漸惡化。","A repeated rescue cycle unfolds alongside declining judges and communal ethics."],"caution":["循環圖是閱讀工具，不可遮蔽各故事的差異。","The cycle is a guide, not a way to flatten each story."]},{"refs":"4–5; 11; 19–21","title":["女性與敘事沉默","Women and narrative silence"],"body":["底波拉與雅億推動故事，耶弗他的女兒與基比亞女子則承受權力決策的代價。","Deborah and Jael act decisively, while Jephthah’s daughter and the woman at Gibeah bear the cost of power."],"caution":["不要把女子的苦難變成男性英雄的背景。","Do not turn women’s suffering into a male hero’s backdrop."]},{"refs":"8–9; 17–18","title":["宗教、權力與私利","Religion, power, and self-interest"],"body":["以弗得、米迦神堂及亞比米勒王權揭露宗教語言能與貪婪結盟。","The ephod, Micah’s shrine, and Abimelech show religious claims joined to gain."],"caution":["宗教措辭本身不是行動正當性的證據。","Religious words alone cannot validate an action."]},{"refs":"12; 15; 19–21","title":["報復與內部暴力","Revenge and internal violence"],"body":["外敵故事最後轉向以色列內部屠殺；每一次「補救」都可能再製傷害。","External conflict turns into internal slaughter; each proposed remedy may reproduce harm."],"caution":["受害者安全應先於抽象的群體名譽。","Victims’ safety comes before abstract group honor."]},{"refs":"17:6; 21:25","title":["沒有王的結語","The no-king refrain"],"body":["「各人任意而行」既指出社會失序，也引向撒母耳記的王權問題；它不保證任何王都會良善。","The refrain diagnoses disorder and raises the monarchy question; it does not promise that any king will be good."],"caution":["不可把王權當成自動解方。","Monarchy is not an automatic cure."]}],"pastoral":{"title":["教師帶領提醒","Teaching care"],"body":["第 11、19–21 章涉及對女性的重大傷害；帶領前提供內容提醒與退出選項，避免責怪受害者，並容許學員提出對經文與神學的艱難問題。","Chapters 11 and 19–21 include severe harm to women. Give a content warning and opt-out, avoid victim-blaming, and allow difficult questions about text and theology."]},"lessonsIntro":["八課可按班級時數調整。先讀指定經文與相鄰段落，再檢視人物、敘事者評價及今日應用的界線。","Adjust eight lessons to class time. Read assigned and adjacent passages, then distinguish character actions, narrator evaluation, and responsible application."],"lessons":[{"refs":"1–2","title":["第 1 課｜未完成與遺忘","Lesson 1 | Incompletion and forgetting"],"aim":["比較未趕出的居民與新一代不認識神作為的敘事。","Compare remaining inhabitants with a generation that does not know the story."],"flow":[["標出第一章重複句","Mark repeated phrases in chapter 1"],["讀 2:10–19 的循環","Trace the cycle in 2:10–19"],["討論記憶如何傳承","Discuss how memory is transmitted"]],"question":["未完成的任務如何連到世代遺忘？","How can unfinished tasks relate to generational forgetting?"],"practice":["不可把複雜社會史歸為單一世代的過錯。","Do not reduce complex social history to one generation’s fault."]},{"refs":"3–5","title":["第 2 課｜拯救、領導與歌","Lesson 2 | Deliverance, leadership, and song"],"aim":["比較早期士師、底波拉與雅億，並讀勝利詩歌的多重聲音。","Compare early judges, Deborah, and Jael, then read the victory song’s varied voices."],"flow":[["比較俄陀聶與以笏敘事長短","Compare Othniel and Ehud’s narrative space"],["找出第 4 章女性角色","Identify women’s roles in chapter 4"],["讀第 5 章末的母親視角","Read the mother’s viewpoint at the end of chapter 5"]],"question":["勝利詩歌如何容納痛苦？","How can a victory song include grief?"],"practice":["別把詩歌當歷史事件逐字紀錄。","Do not treat poetry as a verbatim event log."]},{"refs":"6–7","title":["第 3 課｜基甸的恐懼與得勝","Lesson 3 | Gideon’s fear and victory"],"aim":["觀察蒙召、求證、縮軍和夜間鼓勵。","Observe calling, signs, reduced troops, and reassurance at night."],"flow":[["比較基甸的自我評價與呼召","Compare Gideon’s self-view with his call"],["整理羊毛記號的脈絡","Locate fleece signs in context"],["列出縮軍理由","Name why the force is reduced"]],"question":["勇敢是否需要沒有恐懼？","Does courage require the absence of fear?"],"practice":["不可把羊毛試驗當作通用決策技巧。","Do not make the fleece a universal decision technique."]},{"refs":"8–10","title":["第 4 課｜領袖變質與亞比米勒","Lesson 4 | Corrupted leadership"],"aim":["讀基甸後期、亞比米勒與以色列再次呼求，評估權力的副作用。","Read Gideon’s later years, Abimelech, and renewed cries to assess power."],"flow":[["比較基甸拒王與其行動","Compare Gideon’s anti-kingship words and deeds"],["解讀約坦的樹木寓言","Interpret Jotham’s tree parable"],["找出第 10 章悔改跡象","Identify signs of repentance in chapter 10"]],"question":["有功的領袖如何仍須受約束？","How must even successful leaders be held accountable?"],"practice":["不要因拯救者地位掩蓋其傷害。","Do not hide harms behind deliverer status."]},{"refs":"11–12","title":["第 5 課｜耶弗他的女兒與內戰","Lesson 5 | Jephthah’s daughter and civil war"],"aim":["以女兒的處境及口音屠殺討論誓言與身分排斥。","Center the daughter’s situation and shibboleth killings in a discussion of vows and exclusion."],"flow":[["分開耶弗他的外交論證與誓言","Separate Jephthah’s diplomacy from his vow"],["問女兒有哪些選擇","Ask what choices his daughter had"],["讀 12 章口音如何成為武器","Trace how accent becomes a weapon"]],"question":["宗教言語何時遮蔽了對人的責任？","When does religious language hide duty toward people?"],"practice":["先告知學員內容敏感；勿合理化殺女或排斥異己。","Give a content note; never justify sacrificing a daughter or targeting identity."]},{"refs":"13–16","title":["第 6 課｜參孫的能力與失控","Lesson 6 | Samson’s strength and unraveling"],"aim":["從出生宣告到死亡追蹤能力、慾望、報復與脆弱。","Trace calling, desire, revenge, and vulnerability from birth to death."],"flow":[["比較母親與參孫對呼召的回應","Compare mother and son in response to the call"],["畫出 14–15 章報復鏈","Map retaliation in chapters 14–15"],["讀 16 章的失力與結局","Read lost strength and the ending in chapter 16"]],"question":["能力如何與品格脫節？","How can ability become detached from character?"],"practice":["不要把遭威脅的女子簡化為誘惑者。","Do not reduce women acting under threats to temptresses."]},{"refs":"17–18","title":["第 7 課｜私設敬拜與掠奪","Lesson 7 | Private shrine and seizure"],"aim":["觀察米迦神堂與但支派如何讓宗教服務私利和暴力。","Observe how Micah’s shrine and Dan’s migration make religion serve gain and force."],"flow":[["列出第 17 章金錢與聖職的交換","List money and priestly exchanges in chapter 17"],["追蹤神像被搶的路線","Trace the stolen image"],["辨認拉億人的處境","Attend to Laish’s inhabitants"]],"question":["甚麼時候「神與我同在」只是利益語言？","When is “God is with me” merely language of advantage?"],"practice":["不得把拉億的居民消失在得地敘事中。","Do not erase Laish’s people from the settlement story."]},{"refs":"19–21","title":["第 8 課｜暴行、內戰與女性被奪","Lesson 8 | Assault, civil war, and seized women"],"aim":["以創傷知情方式讀全書最黑暗的結尾，分析以暴制暴。","Read the book’s darkest ending with trauma care and analyze escalating retaliation."],"flow":[["事先說明內容並允許退出","Give a content warning and allow opting out"],["辨認第 19 章誰有話語權","Identify who can speak in chapter 19"],["比較第 20–21 章公義訴求與新傷害","Compare justice claims and new harms in chapters 20–21"]],"question":["誰在「解決」中再次被犧牲？","Who is sacrificed again in the proposed solutions?"],"practice":["不要朗讀暴行細節作煽情效果；可提供課後支持。","Do not read assault details for effect; offer support after class."]}],"questionsIntro":["請先讓學員指出經文根據，再討論詮釋與應用；困難經文可以保留開放問題。","Ask learners for textual evidence before interpretation and application; difficult passages may leave open questions."],"extraQuestions":[["士師循環為何沒有帶來持久更新？","Why does the judges cycle fail to produce durable renewal?"],["哪些人物被稱為拯救者，卻仍傷害他人？","Which deliverers also harm others?"],["「沒有王」是否就是全書所開出的唯一答案？","Is the lack of a king the book’s only proposed answer?"]],"sourceNote":["本站提供原創逐章研讀摘要與教學建議，不轉載現代聖經譯本經文。中文經文連結預設新標點和合本（神版），英文預設 NASB 2020。","Original chapter notes and teaching suggestions; no modern translation text is reproduced. Scripture links default to CUNP (Shen edition) in Chinese and NASB 2020 in English."],"sources":[{"title":["BibleProject｜士師記導讀","BibleProject | Judges guide"],"url":"https://bibleproject.com/guides/book-of-judges/"},{"title":["耶魯公開課｜舊約導論","Open Yale Courses | Introduction to the Old Testament"],"url":"https://oyc.yale.edu/religious-studies/rlst-145"}],"footer":["士師記研讀 · 原創逐章摘要與成人主日學教師教案","Judges study · original chapter notes and adult class plans"],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
