<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="歷代志上成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>歷代志上｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"1CH","category":["歷史書","Historical Books"],"name":["歷代志上","1 Chronicles"],"subtitle":["從亞當家譜到大衛預備聖殿：29 章以被擄後的眼光重述群體身分與敬拜。","From Adam’s genealogy to David’s temple preparations: 29 chapters retell communal identity and worship from a later perspective."],"overviewIntro":["先從全書結構掌握歷代志上，再逐章研讀人物、事件與神學判斷。","Survey 1 Chronicles as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["29 章；依照書卷原有次序逐章研讀。","29 chapters studied in canonical sequence."],"thesis":["記憶使群體重新定位","Memory reorients a community"],"thesisDetail":["家譜、王權與利未人的服事共同指出：群體在失去舊政治秩序後，仍可從應許與敬拜理解自己。","Genealogies, kingship, and Levitical service show how a community can understand itself through promise and worship after political loss."],"keyQuestion":["歷代志上如何在複雜歷史中呈現忠誠、失敗與盼望？","How does 1 Chronicles portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["家譜、王權與利未人的服事共同指出：群體在失去舊政治秩序後，仍可從應許與敬拜理解自己。","Genealogies, kingship, and Levitical service show how a community can understand itself through promise and worship after political loss."],"finalMovement":["大衛公開獻上財物並禱告，所羅門繼位；讀者將在《歷代志下》看見建殿及其後果。","David gives, prays, and passes the throne to Solomon; 2 Chronicles carries the temple story onward."],"readingKeys":[{"refs":"1–4","title":["從亞當到猶大","From Adam to Judah"],"body":["家譜從全人類起頭，聚焦以色列與猶大，為大衛故事鋪路。","Genealogies move from humanity to Israel and Judah, preparing for David."]},{"refs":"10–12","title":["掃羅之終與大衛興起","Saul’s end and David’s rise"],"body":["掃羅死亡、大衛受擁立，勇士與支派支持者被記念。","Saul dies, David is enthroned, and warriors and tribal supporters are remembered."]},{"refs":"17–20","title":["大衛之約與國勢","Davidic promise and victories"],"body":["神應許大衛家，大衛禱告；戰爭與王室使者的遭遇接續。","God promises David’s line; David prays, and campaigns follow."]},{"refs":"28–29","title":["交棒、奉獻與禱告","Succession, giving, and prayer"],"body":["大衛交付殿宇計畫、勸勉所羅門，百姓自願奉獻並同心敬拜。","David passes temple plans and counsel to Solomon; the people give willingly and worship."]}],"mapIntro":["沿八個段落觀察歷代志上的敘事推進與轉折。","Trace the movement of 1 Chronicles through eight teaching units."],"movements":[{"refs":"1–4","title":["從亞當到猶大","From Adam to Judah"],"body":["家譜從全人類起頭，聚焦以色列與猶大，為大衛故事鋪路。","Genealogies move from humanity to Israel and Judah, preparing for David."]},{"refs":"5–9","title":["支派、利未與歸回","Tribes, Levites, and returnees"],"body":["約旦河東、利未與其他支派的名單連到被擄及歸回後的住處。","Lists of tribes and Levites connect exile with return and settlement."]},{"refs":"10–12","title":["掃羅之終與大衛興起","Saul’s end and David’s rise"],"body":["掃羅死亡、大衛受擁立，勇士與支派支持者被記念。","Saul dies, David is enthroned, and warriors and tribal supporters are remembered."]},{"refs":"13–16","title":["約櫃與敬拜","Ark and worship"],"body":["第一次搬運約櫃失敗，後按規定迎入耶路撒冷並安排讚美。","A first ark transfer fails; the ark later enters Jerusalem with ordered worship."]},{"refs":"17–20","title":["大衛之約與國勢","Davidic promise and victories"],"body":["神應許大衛家，大衛禱告；戰爭與王室使者的遭遇接續。","God promises David’s line; David prays, and campaigns follow."]},{"refs":"21–22","title":["數點與聖殿預備","Census and temple preparation"],"body":["數點帶來災難；大衛在禾場築壇，預備所羅門建殿。","The census brings disaster; David builds an altar at the threshing floor and prepares Solomon to build."]},{"refs":"23–27","title":["利未人與治理分工","Levites and service"],"body":["利未人、祭司、歌者、守門者與官員被編排服事。","Levites, priests, singers, gatekeepers, and officials are assigned duties."]},{"refs":"28–29","title":["交棒、奉獻與禱告","Succession, giving, and prayer"],"body":["大衛交付殿宇計畫、勸勉所羅門，百姓自願奉獻並同心敬拜。","David passes temple plans and counsel to Solomon; the people give willingly and worship."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["與《撒母耳記》並讀時，留意《歷代志》的選材與重點；省略的事件並非否認它們存在。","Compare Samuel: Chronicles selects and reshapes material; omission does not deny that earlier events occurred."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["從亞當到以色列","From Adam to Israel"],"summary":["家譜從亞當、挪亞與列國展開，最後聚焦以掃與以色列的支系。","Genealogies move from Adam, Noah, and the nations toward Esau and Israel."],"deep":[["開卷以全人類而非單一王朝開始。","The book opens with humanity rather than one dynasty."],["留意家譜如何選擇支系，而非把它當完整人口普查。","Notice selected lines rather than treating genealogies as a census."]],"caution":["勿以名單中的缺席判斷個人不重要。","Absence from a list does not make a person unimportant."],"question":["從亞當起筆如何改變讀者的視野？","How does beginning with Adam widen the horizon?"]},{"n":2,"refs":"2","title":["猶大支派與大衛家","Judah and David’s line"],"summary":["猶大子孫的名單逐步連到耶西與大衛，也保留其他家庭支系。","Judah’s descendants lead toward Jesse and David while preserving other families."],"deep":[["大衛並非孤立人物，而被放進多代家族記憶。","David stands within generations of family memory."],["留意家譜如何選擇支系，而非把它當完整人口普查。","Notice selected lines rather than treating genealogies as a census."]],"caution":["勿以名單中的缺席判斷個人不重要。","Absence from a list does not make a person unimportant."],"question":["為何在大衛之外仍保留許多名字？","Why preserve many names beyond David?"]},{"n":3,"refs":"3","title":["大衛後裔","David’s descendants"],"summary":["記載大衛子孫與後續王室支系，將王朝線索延伸到被擄之後。","David’s descendants and royal lines extend the story past exile."],"deep":[["家譜越過亡國，為延續的盼望留下位置。","The genealogy reaches beyond the fall of the kingdom."],["留意家譜如何選擇支系，而非把它當完整人口普查。","Notice selected lines rather than treating genealogies as a census."]],"caution":["勿以名單中的缺席判斷個人不重要。","Absence from a list does not make a person unimportant."],"question":["亡國後家譜仍有何功能？","What can a royal genealogy mean after exile?"]},{"n":4,"refs":"4","title":["猶大與西緬家族","Judah and Simeon families"],"summary":["補充猶大與西緬的家族、居住與遷移記錄，其中有雅比斯的祈求。","Further Judah and Simeon families, places, and migrations include Jabez’s prayer."],"deep":[["雅比斯祈禱位於家譜中，不是脫離上下文的致富公式。","Jabez’s prayer belongs inside a genealogy, not a wealth formula."],["留意家譜如何選擇支系，而非把它當完整人口普查。","Notice selected lines rather than treating genealogies as a census."]],"caution":["勿以名單中的缺席判斷個人不重要。","Absence from a list does not make a person unimportant."],"question":["名單中的短禱告起什麼作用？","What does the brief prayer do within the list?"]},{"n":5,"refs":"5","title":["河東支派","East-Jordan tribes"],"summary":["流便、迦得與瑪拿西半支派的土地、戰事與被擄被記錄。","Reuben, Gad, and half-Manasseh are traced through land, conflict, and deportation."],"deep":[["名單不只談起源，也記錄失地與流亡。","These lists remember lost land and exile as well as origins."],["家譜把過去、流亡與當下住民連成一條線。","Genealogies link past, exile, and present residents."]],"caution":["不要將支派名單讀成純粹的血統優越論。","Do not turn tribal lists into claims of blood superiority."],"question":["地理與被擄如何塑造支派記憶？","How do land and exile shape tribal memory?"]},{"n":6,"refs":"6","title":["利未與祭司","Levites and priests"],"summary":["從利未家系、祭司、歌者到居住城邑，描述聖所服事的傳承。","Levi’s lines, priests, singers, and towns map the inheritance of sanctuary service."],"deep":[["利未人的「產業」與其他支派的地土安排不同。","Levitical inheritance differs from landholding patterns elsewhere."],["家譜把過去、流亡與當下住民連成一條線。","Genealogies link past, exile, and present residents."]],"caution":["不要將支派名單讀成純粹的血統優越論。","Do not turn tribal lists into claims of blood superiority."],"question":["為何服事與居所都被記下？","Why record both service and dwelling places?"]},{"n":7,"refs":"7","title":["其餘支派","Other tribes"],"summary":["列出以薩迦、便雅憫、拿弗他利、瑪拿西、以法蓮與亞設等支系。","The lines of Issachar, Benjamin, Naphtali, Manasseh, Ephraim, and Asher appear."],"deep":[["各支派篇幅不等，反映編者資料與關切。","Uneven coverage reflects available memory and editorial focus."],["家譜把過去、流亡與當下住民連成一條線。","Genealogies link past, exile, and present residents."]],"caution":["不要將支派名單讀成純粹的血統優越論。","Do not turn tribal lists into claims of blood superiority."],"question":["篇幅不等是否意味價值不等？","Does uneven coverage imply unequal worth?"]},{"n":8,"refs":"8","title":["便雅憫與掃羅","Benjamin and Saul"],"summary":["便雅憫的家譜再次展開，特別通向掃羅家。","Benjamin’s genealogy turns toward Saul’s family."],"deep":[["掃羅的家世先被確認，之後才敘述其死亡。","Saul’s ancestry is established before his death is narrated."],["家譜把過去、流亡與當下住民連成一條線。","Genealogies link past, exile, and present residents."]],"caution":["不要將支派名單讀成純粹的血統優越論。","Do not turn tribal lists into claims of blood superiority."],"question":["家譜如何預備第 10 章的轉折？","How does genealogy prepare chapter 10?"]},{"n":9,"refs":"9","title":["歸回後的住民","Residents after return"],"summary":["被擄後的耶路撒冷住民、祭司、利未人與守門者列名，末尾回到掃羅家。","Postexilic Jerusalem residents, priests, Levites, and gatekeepers are named before Saul’s line returns."],"deep":[["「首先居住」將古老名單接到當下的群體。","The resident list connects ancestral memory with a present community."],["家譜把過去、流亡與當下住民連成一條線。","Genealogies link past, exile, and present residents."]],"caution":["不要將支派名單讀成純粹的血統優越論。","Do not turn tribal lists into claims of blood superiority."],"question":["歸回者為何需要被具名？","Why name those who returned?"]},{"n":10,"refs":"10","title":["掃羅之死","Saul’s death"],"summary":["掃羅與兒子戰死；敘事把敗亡連於他未忠於神與未求問神。","Saul and his sons die; the narrator links defeat to his unfaithfulness and failed inquiry."],"deep":[["本章快速從王朝終結轉入大衛王權。","The chapter swiftly turns dynastic ending toward David."],["大衛王權建立於群體參與，而非單一英雄。","David’s rule emerges with broad communal participation."]],"caution":["對掃羅的神學評價不可用來抹去戰死者的悲痛。","Do not let Saul’s evaluation erase grief over the dead."],"question":["作者如何解釋掃羅的結局？","How does the narrator explain Saul’s end?"]},{"n":11,"refs":"11","title":["大衛與勇士","David and mighty warriors"],"summary":["眾人擁大衛為王，他攻取耶路撒冷，勇士的名字與事蹟被記錄。","All Israel makes David king; he takes Jerusalem and the mighty warriors are named."],"deep":[["勇士名單讓王權故事保留集體的身影。","The warrior list keeps collective actors in the royal story."],["大衛王權建立於群體參與，而非單一英雄。","David’s rule emerges with broad communal participation."]],"caution":["對掃羅的神學評價不可用來抹去戰死者的悲痛。","Do not let Saul’s evaluation erase grief over the dead."],"question":["大衛的成就由哪些人共同承擔？","Who shares in David’s achievements?"]},{"n":12,"refs":"12","title":["支派加入大衛","Tribes join David"],"summary":["各支派武士在不同時期投向大衛，最後同心赴希伯崙。","Warriors from many tribes join David over time and gather at Hebron."],"deep":[["「同心」是敘事理想，也建立在具體政治選擇上。","Unity is a narrative ideal shaped by concrete political choices."],["大衛王權建立於群體參與，而非單一英雄。","David’s rule emerges with broad communal participation."]],"caution":["對掃羅的神學評價不可用來抹去戰死者的悲痛。","Do not let Saul’s evaluation erase grief over the dead."],"question":["哪些支派被特別強調，為何？","Which tribes receive attention, and why?"]},{"n":13,"refs":"13","title":["第一次迎約櫃","First ark transfer"],"summary":["搬運約櫃時烏撒伸手扶櫃而死，大衛懼怕，約櫃暫留俄別以東家。","Uzzah dies during the ark’s transport; David is afraid and leaves it with Obed-edom."],"deep":[["停頓使下一次迎櫃必須重新思考方式。","The interruption forces reconsideration before another transfer."],["第 13 與 15 章要連讀，避免把烏撒事件孤立。","Read chapters 13 and 15 together rather than isolating Uzzah."]],"caution":["不可把烏撒之死當成草率責怪事故受害者的理由。","Do not use Uzzah’s death to blame accident victims casually."],"question":["大衛的恐懼如何改變計畫？","How does David’s fear change the plan?"]},{"n":14,"refs":"14","title":["大衛家與非利士人","David’s house and Philistines"],"summary":["推羅王支持大衛建宮，非利士人來攻；大衛兩次求問並得勝。","Tyre helps David build; Philistines attack, and David inquires twice before victory."],"deep":[["兩次戰役的指示不同，避免把昨日經驗當固定方法。","The two battles receive different instructions; past success is no formula."],["第 13 與 15 章要連讀，避免把烏撒事件孤立。","Read chapters 13 and 15 together rather than isolating Uzzah."]],"caution":["不可把烏撒之死當成草率責怪事故受害者的理由。","Do not use Uzzah’s death to blame accident victims casually."],"question":["大衛為何要再次求問？","Why does David inquire again?"]},{"n":15,"refs":"15","title":["按次序迎約櫃","Ark brought in order"],"summary":["大衛安排利未人扛抬約櫃、歌者奏樂，約櫃終進耶路撒冷。","David assigns Levites to carry the ark and singers to celebrate its entry into Jerusalem."],"deep":[["與第 13 章並讀，觀察搬運方式的更改。","Read with chapter 13 and observe the changed method."],["第 13 與 15 章要連讀，避免把烏撒事件孤立。","Read chapters 13 and 15 together rather than isolating Uzzah."]],"caution":["不可把烏撒之死當成草率責怪事故受害者的理由。","Do not use Uzzah’s death to blame accident victims casually."],"question":["群體如何從失敗中調整？","How does the community learn from failure?"]},{"n":16,"refs":"16","title":["詩歌與敬拜職分","Song and worship"],"summary":["約櫃安置後，大衛安排敬拜，頌歌回顧神作為並呼召列國讚美。","After the ark is placed, David appoints worship and a song recalls God’s works and summons nations."],"deep":[["詩歌把以色列的記憶連向萬國。","The hymn connects Israel’s memory to the nations."],["第 13 與 15 章要連讀，避免把烏撒事件孤立。","Read chapters 13 and 15 together rather than isolating Uzzah."]],"caution":["不可把烏撒之死當成草率責怪事故受害者的理由。","Do not use Uzzah’s death to blame accident victims casually."],"question":["讚美如何成為群體記憶？","How does praise become communal memory?"]},{"n":17,"refs":"17","title":["大衛之約","Davidic covenant"],"summary":["大衛想建殿，先知傳達神將為他建立家室的應許；大衛以禱告回應。","David proposes a house for God; the prophet announces God’s promise to build David a house, and David prays."],"deep":[["「家」在建築與王朝兩義之間轉換。","“House” shifts between building and dynasty."],["應許之後仍有國際衝突，盼望不是免於歷史。","Promise does not remove international conflict or history."]],"caution":["古代戰爭勝利不授權今日宗教暴力。","Ancient victories do not license modern religious violence."],"question":["是誰先為誰建立「家」？","Who first builds a “house” for whom?"]},{"n":18,"refs":"18","title":["大衛諸戰績","David’s victories"],"summary":["記載大衛對周邊敵人的勝利與朝廷官員。","David’s campaigns against neighboring powers and his officials are listed."],"deep":[["戰績中的行政名單提醒勝利需要治理後續。","Officials after campaigns point to the work of governing."],["應許之後仍有國際衝突，盼望不是免於歷史。","Promise does not remove international conflict or history."]],"caution":["古代戰爭勝利不授權今日宗教暴力。","Ancient victories do not license modern religious violence."],"question":["戰爭敘事如何連到治理？","How does war connect to governance?"]},{"n":19,"refs":"19","title":["使者受辱與戰事","Humiliated envoys and war"],"summary":["亞捫王羞辱大衛使者，約押率軍與亞捫、亞蘭交戰。","Ammon’s king humiliates David’s envoys; Joab fights Ammonite and Aramean forces."],"deep":[["外交誤判與羞辱引發擴大的衝突。","Diplomatic misreading and humiliation widen conflict."],["應許之後仍有國際衝突，盼望不是免於歷史。","Promise does not remove international conflict or history."]],"caution":["古代戰爭勝利不授權今日宗教暴力。","Ancient victories do not license modern religious violence."],"question":["誤解與羞辱如何升高戰爭？","How do misreading and shame escalate war?"]},{"n":20,"refs":"20","title":["拉巴與巨人後裔","Rabbah and giant descendants"],"summary":["約押攻取拉巴，大衛得冠冕；另記與非利士勇士的戰事。","Joab captures Rabbah; David takes a crown, and later battles with Philistine champions are recalled."],"deep":[["與《撒母耳記下》平行段落比較人物焦點。","Compare the parallel in 2 Samuel for shifts in focus."],["應許之後仍有國際衝突，盼望不是免於歷史。","Promise does not remove international conflict or history."]],"caution":["古代戰爭勝利不授權今日宗教暴力。","Ancient victories do not license modern religious violence."],"question":["編者選擇哪些細節來描寫王？","Which details shape this royal portrait?"]},{"n":21,"refs":"21","title":["數點與禾場","Census and threshing floor"],"summary":["大衛數點百姓引來災難，認罪後在阿珥楠禾場築壇，止住瘟疫。","David’s census brings disaster; he confesses and builds an altar at Ornan’s floor, ending the plague."],"deep":[["王的行動影響群體，而壇址起於危機與認罪。","A king’s act harms the community; the altar site emerges through crisis and confession."],["殿址與悔罪記憶相連，而不只與政治權威相連。","The temple site is tied to repentance, not just royal power."]],"caution":["注意《撒母耳記下》平行敘事的差異，勿勉強抹平。","Notice differences from 2 Samuel rather than forcing identical accounts."],"question":["王如何承擔數點後果？","How does the king own the consequences of the census?"]},{"n":22,"refs":"22","title":["預備所羅門建殿","Preparing Solomon"],"summary":["大衛聚集材料與工匠，囑咐所羅門和首領建造殿宇。","David gathers materials and workers and charges Solomon and leaders to build the temple."],"deep":[["不能親手完成的工作仍可透過預備與交棒參與。","Preparation and delegation matter even when one cannot finish the work."],["殿址與悔罪記憶相連，而不只與政治權威相連。","The temple site is tied to repentance, not just royal power."]],"caution":["注意《撒母耳記下》平行敘事的差異，勿勉強抹平。","Notice differences from 2 Samuel rather than forcing identical accounts."],"question":["大衛如何把願望交給下一代？","How does David hand his vision to the next generation?"]},{"n":23,"refs":"23","title":["利未人職責","Levitical duties"],"summary":["大衛統計利未人，安排管理、審判、守門與歌唱等職分。","David counts Levites and assigns administration, judging, gatekeeping, and song."],"deep":[["敬拜秩序包含行政與日常工作。","Worship order includes administration and daily tasks."],["職分細節強調共同敬拜由多人維繫。","Detailed roles show worship sustained by many people."]],"caution":["職分分工不可成為貶低未具名服事者的理由。","Roles should not devalue unnamed contributors."],"question":["哪些不顯眼的工作維繫敬拜？","Which less visible tasks sustain worship?"]},{"n":24,"refs":"24","title":["祭司班次","Priestly divisions"],"summary":["亞倫後代按班次抽籤分派祭司服事，也列利未其他家系。","Aaron’s descendants are assigned priestly courses by lot alongside other Levitical lines."],"deep":[["抽籤與班次讓職責超越個人喜好。","Lots and courses distribute duties beyond personal preference."],["職分細節強調共同敬拜由多人維繫。","Detailed roles show worship sustained by many people."]],"caution":["職分分工不可成為貶低未具名服事者的理由。","Roles should not devalue unnamed contributors."],"question":["班次安排如何限制權力集中？","How might courses limit concentration of power?"]},{"n":25,"refs":"25","title":["歌者班次","Musicians’ divisions"],"summary":["亞薩、希幔與耶杜頓家族組成歌者，按班次服事。","Families of Asaph, Heman, and Jeduthun serve as musicians by courses."],"deep":[["藝術與教導同在敬拜職分中。","Music and instruction belong within worship service."],["職分細節強調共同敬拜由多人維繫。","Detailed roles show worship sustained by many people."]],"caution":["職分分工不可成為貶低未具名服事者的理由。","Roles should not devalue unnamed contributors."],"question":["歌唱為何也需要培訓與次序？","Why does song require training and order?"]},{"n":26,"refs":"26","title":["守門與財庫","Gatekeepers and treasuries"],"summary":["守門者、財庫管理者與外務官員被分派。","Gatekeepers, treasury stewards, and outside officers receive assignments."],"deep":[["保管財物與守護門戶也是公共信任。","Treasury and gatekeeping are forms of public trust."],["職分細節強調共同敬拜由多人維繫。","Detailed roles show worship sustained by many people."]],"caution":["職分分工不可成為貶低未具名服事者的理由。","Roles should not devalue unnamed contributors."],"question":["財物管理如何成為屬靈議題？","How is stewardship of goods a spiritual matter?"]},{"n":27,"refs":"27","title":["軍隊與官員","Military and officials"],"summary":["列出軍隊輪值、支派首領與王室財產管理人。","Military rotations, tribal leaders, and managers of royal estates are listed."],"deep":[["王國靠多層次治理，並非只有聖殿職分。","The kingdom involves many levels of governance beyond temple service."],["職分細節強調共同敬拜由多人維繫。","Detailed roles show worship sustained by many people."]],"caution":["職分分工不可成為貶低未具名服事者的理由。","Roles should not devalue unnamed contributors."],"question":["名單如何使權力結構可見？","How do lists make power structures visible?"]},{"n":28,"refs":"28","title":["大衛勸勉所羅門","David charges Solomon"],"summary":["大衛向會眾說明建殿責任，交付殿的樣式，勸所羅門尋求神。","David addresses the assembly, passes temple plans, and charges Solomon to seek God."],"deep":[["交棒包括資源、設計與道德勸勉。","Succession passes resources, plans, and moral counsel."],["第 29 章承認一切所有都來自神。","Chapter 29 says gifts return to God what already comes from God."]],"caution":["不要把自願奉獻故事轉為施壓募款公式。","Do not turn voluntary giving into a coercive fundraising formula."],"question":["所羅門收到的是什麼樣的責任？","What responsibilities does Solomon receive?"]},{"n":29,"refs":"29","title":["奉獻、禱告與繼位","Giving, prayer, succession"],"summary":["首領和百姓樂意奉獻，大衛禱告承認萬物來自神；所羅門繼位。","Leaders and people give willingly; David prays that all comes from God, and Solomon succeeds him."],"deep":[["王的禱告把功勞歸給神與群體。","The king’s prayer returns credit to God and the community."],["第 29 章承認一切所有都來自神。","Chapter 29 says gifts return to God what already comes from God."]],"caution":["不要把自願奉獻故事轉為施壓募款公式。","Do not turn voluntary giving into a coercive fundraising formula."],"question":["「我們把從你而得的獻給你」如何理解奉獻？","How does “from your hand we give” frame generosity?"]}],"themesIntro":["以下主題由歷代志上的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of 1 Chronicles and complement the chapter studies."],"themes":[{"refs":"1–4","title":["從亞當到猶大","From Adam to Judah"],"body":["家譜從全人類起頭，聚焦以色列與猶大，為大衛故事鋪路。","Genealogies move from humanity to Israel and Judah, preparing for David."],"caution":["勿以名單中的缺席判斷個人不重要。","Absence from a list does not make a person unimportant."]},{"refs":"10–12","title":["掃羅之終與大衛興起","Saul’s end and David’s rise"],"body":["掃羅死亡、大衛受擁立，勇士與支派支持者被記念。","Saul dies, David is enthroned, and warriors and tribal supporters are remembered."],"caution":["對掃羅的神學評價不可用來抹去戰死者的悲痛。","Do not let Saul’s evaluation erase grief over the dead."]},{"refs":"17–20","title":["大衛之約與國勢","Davidic promise and victories"],"body":["神應許大衛家，大衛禱告；戰爭與王室使者的遭遇接續。","God promises David’s line; David prays, and campaigns follow."],"caution":["古代戰爭勝利不授權今日宗教暴力。","Ancient victories do not license modern religious violence."]},{"refs":"23–27","title":["利未人與治理分工","Levites and service"],"body":["利未人、祭司、歌者、守門者與官員被編排服事。","Levites, priests, singers, gatekeepers, and officials are assigned duties."],"caution":["職分分工不可成為貶低未具名服事者的理由。","Roles should not devalue unnamed contributors."]},{"refs":"28–29","title":["交棒、奉獻與禱告","Succession, giving, and prayer"],"body":["大衛交付殿宇計畫、勸勉所羅門，百姓自願奉獻並同心敬拜。","David passes temple plans and counsel to Solomon; the people give willingly and worship."],"caution":["不要把自願奉獻故事轉為施壓募款公式。","Do not turn voluntary giving into a coercive fundraising formula."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["家譜的名字指向群體記憶；勿把血統名單當作當代人身價值或排除他人的標準。","Genealogies preserve community memory; do not use ancestry lists to rank or exclude people today."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–4","title":["第 1 課｜從亞當到猶大","Lesson 1 | From Adam to Judah"],"aim":["家譜從全人類起頭，聚焦以色列與猶大，為大衛故事鋪路。","Genealogies move from humanity to Israel and Judah, preparing for David."],"flow":[["讀 1 章：開卷以全人類而非單一王朝開始。","Read chapter 1: The book opens with humanity rather than one dynasty."],["對照 1–4 章：留意家譜如何選擇支系，而非把它當完整人口普查。","Compare chapters 1–4: Notice selected lines rather than treating genealogies as a census."],["討論：名單中的短禱告起什麼作用？","Discuss: What does the brief prayer do within the list?"]],"question":["從亞當起筆如何改變讀者的視野？","How does beginning with Adam widen the horizon?"],"practice":["勿以名單中的缺席判斷個人不重要。","Absence from a list does not make a person unimportant."]},{"refs":"5–9","title":["第 2 課｜支派、利未與歸回","Lesson 2 | Tribes, Levites, and returnees"],"aim":["約旦河東、利未與其他支派的名單連到被擄及歸回後的住處。","Lists of tribes and Levites connect exile with return and settlement."],"flow":[["讀 5 章：名單不只談起源，也記錄失地與流亡。","Read chapter 5: These lists remember lost land and exile as well as origins."],["對照 5–9 章：家譜把過去、流亡與當下住民連成一條線。","Compare chapters 5–9: Genealogies link past, exile, and present residents."],["討論：歸回者為何需要被具名？","Discuss: Why name those who returned?"]],"question":["地理與被擄如何塑造支派記憶？","How do land and exile shape tribal memory?"],"practice":["不要將支派名單讀成純粹的血統優越論。","Do not turn tribal lists into claims of blood superiority."]},{"refs":"10–12","title":["第 3 課｜掃羅之終與大衛興起","Lesson 3 | Saul’s end and David’s rise"],"aim":["掃羅死亡、大衛受擁立，勇士與支派支持者被記念。","Saul dies, David is enthroned, and warriors and tribal supporters are remembered."],"flow":[["讀 10 章：本章快速從王朝終結轉入大衛王權。","Read chapter 10: The chapter swiftly turns dynastic ending toward David."],["對照 10–12 章：大衛王權建立於群體參與，而非單一英雄。","Compare chapters 10–12: David’s rule emerges with broad communal participation."],["討論：哪些支派被特別強調，為何？","Discuss: Which tribes receive attention, and why?"]],"question":["作者如何解釋掃羅的結局？","How does the narrator explain Saul’s end?"],"practice":["對掃羅的神學評價不可用來抹去戰死者的悲痛。","Do not let Saul’s evaluation erase grief over the ll text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜歷代志上、下導讀","BibleProject | Books of Chronicles guide"],"url":"https://bibleproject.com/guides/books-of-chronicles/"}],"footer":["歷代志上 · 成人主日學教師版 · 請配合完整經文閱讀。","1 Chronicles · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
