<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="出埃及記成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>出埃及記｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"EXO","category":["摩西五經 · TORAH","TORAH · PENTATEUCH"],"name":["出埃及記","Exodus"],"subtitle":["從奴役中的呼求到神住在百姓中間：拯救、立約、安息與敬拜構成一條完整的故事線。","From cries under slavery to God dwelling among the people, Exodus joins rescue, covenant, rest, and worship."],"overviewIntro":["從奴役中的呼求到神住在百姓中間：拯救、立約、安息與敬拜構成一條完整的故事線。","From cries under slavery to God dwelling among the people, Exodus joins rescue, covenant, rest, and worship."],"lengthNote":["40 章；請按文學單元和整卷脈絡閱讀。","40 chapters; read each literary unit within the whole book."],"thesis":["被拯救，為要與神同行","Rescued to dwell with God"],"thesisDetail":["全書不止記錄離開埃及；西奈之約與會幕使自由成為有公義、有記憶、有同在的群體生活。","The book does not stop at leaving Egypt; covenant and tabernacle turn freedom into communal life marked by justice, memory, and presence."],"keyQuestion":["得自由之後，百姓要成為怎樣的群體？","What kind of people should the liberated become?"],"keyAnswer":["十誡的序言先宣告神已帶領百姓出奴之家；律法因此是蒙救者回應，不是購買自由的條件。","The commandments begin by recalling deliverance; instruction is a response of the rescued, not the price of freedom."],"finalMovement":["雲彩充滿會幕，卻使摩西不能進入；利未記接續回答不聖潔的人如何與聖潔的神同住。","The cloud fills the tent, yet Moses cannot enter; Leviticus continues the question of living with a holy God."],"readingKeys":[{"refs":"1–3","title":["神看見受苦","God sees suffering"],"body":["神的自我啟示由奴隸的哀聲開始。","Divine self-disclosure begins with enslaved people’s cries."]},{"refs":"12–16","title":["拯救需要記念","Rescue requires memory"],"body":["逾越節、無酵餅與嗎哪把自由刻入日常節奏。","Passover, unleavened bread, and manna form everyday memory."]},{"refs":"19–24","title":["先恩典後誡命","Rescue before instruction"],"body":["立約律法發生在出埃及之後；順服是蒙救群體的生活。","Covenant instruction follows deliverance; obedience shapes rescued life."]},{"refs":"25–40","title":["同在與聖潔","Presence and holiness"],"body":["會幕是全書後半核心，金牛犢使同住問題更加尖銳。","The tabernacle dominates the second half; the calf crisis sharpens the question of dwelling."]}],"mapIntro":["以下分段是教學導覽，章界有助查找，並非每一段論述的天然邊界。","These movements guide study; chapter divisions are useful but do not always mark a natural literary boundary."],"movements":[{"refs":"1–4","title":["奴役、呼求與呼召","Oppression, cry, and call"],"body":["受壓迫者的呼求與神對摩西的呼召互相連接。","The people’s cry and Moses’ call are bound together."]},{"refs":"5–11","title":["法老抗拒與災禍","Pharaoh’s resistance and plagues"],"body":["法老反覆拒絕釋放，災禍揭露帝國權力的頑固。","Pharaoh’s recurring refusal exposes the hard grip of empire."]},{"refs":"12–18","title":["逾越、過海與曠野","Passover, sea, and wilderness"],"body":["被拯救的群體學習記念、信任與分享領導。","A rescued people learn memory, trust, and shared leadership."]},{"refs":"19–24","title":["西奈立約","Covenant at Sinai"],"body":["神以拯救為先，呼召百姓以敬拜與公義回應。","Rescue precedes a call to worship and justice."]},{"refs":"25–31","title":["會幕與祭司的設計","Tabernacle and priestly design"],"body":["器具、衣袍與安息日共同預備神在群體中居住。","Furnishings, garments, and Sabbath prepare for divine dwelling."]},{"refs":"32–34","title":["金牛犢與重立約","Calf and covenant renewal"],"body":["背約使同在受威脅，摩西代求，神宣告憐憫與公義。","Idolatry threatens presence; Moses intercedes, and God declares mercy and justice."]},{"refs":"35–40","title":["建造與榮光","Construction and glory"],"body":["甘心奉獻與工匠智慧使設計成真，雲彩充滿會幕。","Willing gifts and skilled craft realize the design, and cloud fills the tent."]}],"mapCaution":{"title":["讀法提醒","Reading caution"],"body":["先觀察敘事與律法在各自的歷史、文學脈絡中如何運作，再進入神學比較與今日應用。","Observe how narrative and instruction work in their historical and literary contexts before drawing theological comparisons or present-day applications."]},"chaptersIntro":["每章有摘要、兩個深入重點、詮釋提醒與課堂提問。章名與分段是本站的研讀提示。","Each chapter has a summary, two close-reading points, an interpretive caution, and a teaching question. Titles and divisions are study aids."],"chapters":[{"n":1,"refs":"1","title":["在埃及受壓迫","Oppression in Egypt"],"summary":["以色列人口增長，法老以勞役與殺嬰政策控制他們；收生婆拒絕配合。","Israel multiplies, and Pharaoh responds with forced labor and infanticide; the midwives refuse his order."],"deep":[["人口增長回響創造的繁衍祝福","Population growth echoes creation’s blessing"],["收生婆的不服從讓弱者保護生命","The midwives’ refusal protects life"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["權力如何把繁衍當成威脅？","How does power turn flourishing into a threat?"]},{"n":2,"refs":"2","title":["摩西出生、逃亡與呼求","Moses born, exiled, and the people cry"],"summary":["摩西得救、長大後殺死埃及人而逃往米甸；神聽見以色列的哀聲並記念約。","Moses is rescued as an infant, flees after killing an Egyptian, and settles in Midian; God hears Israel’s cry and remembers the covenant."],"deep":[["女性的行動保存摩西生命","Women preserve Moses’ life"],["摩西的救人衝動與殺人後果需一同閱讀","His defense of another and his killing must both be faced"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["神「記念」與人的呼求如何連在一起？","How are divine remembering and human cries linked?"]},{"n":3,"refs":"3","title":["荊棘火焰中的呼召","Call from the burning bush"],"summary":["神在荊棘中呼召摩西，宣告看見苦情，差他帶百姓出埃及並啟示自己的名。","God calls Moses from the bush, says he has seen suffering, sends him to lead Israel out, and reveals his name."],"deep":[["聖地由神的臨在而非地點本身形成","God’s presence makes the ground holy"],["神的自我介紹連到祖先之約與受壓迫者","Divine identity connects ancestral promise to the oppressed"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["神的名如何與解救行動相連？","How is God’s name tied to rescue?"]},{"n":4,"refs":"4","title":["摩西抗拒與亞倫同行","Moses resists and Aaron joins"],"summary":["摩西以不被信任和口才不足推辭；神賜記號，亞倫成為同工，兩人回埃及。","Moses objects that he will not be believed and cannot speak well; God gives signs and Aaron as a partner."],"deep":[["呼召並未抹去人的恐懼與限制","Calling does not erase fear and limits"],["途中割禮插曲困難，應避免假裝所有細節清楚","The circumcision episode is difficult and should not be flattened"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["同工與記號如何回應摩西的疑慮？","How do partnership and signs answer Moses’ objections?"]},{"n":5,"refs":"5","title":["首次向法老交涉失敗","First encounter with Pharaoh fails"],"summary":["摩西與亞倫要求放人，法老反增苦工；百姓責怪二人，摩西向神抱怨。","Moses and Aaron ask Pharaoh to release Israel, but labor grows harsher; the people blame them, and Moses protests to God."],"deep":[["「容我的百姓去」關乎敬拜與自由","The release demand concerns worship and freedom"],["首次行動使情況更糟，拒絕廉價成功敘事","The first effort worsens conditions, resisting easy success stories"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["當順服帶來更大壓力，領袖如何回應？","How should leaders respond when action intensifies suffering?"]},{"n":6,"refs":"6","title":["神重申名字與應許","God renews his name and promise"],"summary":["神以「我是耶和華」重申拯救與土地之約；家譜確認摩西、亞倫的家族位置。","God renews the promises of rescue and land with his name; a genealogy situates Moses and Aaron."],"deep":[["拯救動詞連串表明神主動行動","The sequence of rescue verbs stresses divine initiative"],["百姓因苦工不聽，提醒領袖理解創傷中的聆聽困難","Crushing labor makes hearing difficult"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["為何受壓迫者此刻難以相信好消息？","Why might oppressed people struggle to hear hope?"]},{"n":7,"refs":"7","title":["杖變蛇與水變血","Staff sign and the Nile turned to blood"],"summary":["亞倫在法老前顯出記號；尼羅河水變血，法老仍不聽從。","Aaron performs a sign before Pharaoh; the Nile turns to blood, yet Pharaoh refuses to listen."],"deep":[["尼羅河是埃及生計中心，審判觸及帝國秩序","The Nile is central to Egypt’s life"],["法老術士模仿記號卻不能解除災禍","Pharaoh’s magicians mimic signs without removing the crisis"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["權力對明顯破壞為何仍可麻木？","Why can power remain unmoved by visible harm?"]},{"n":8,"refs":"8","title":["蛙、虱與蠅災","Frogs, gnats, and flies"],"summary":["災禍連續衝擊埃及，法老一再答應又反悔，開始出現埃及與歌珊的區分。","Successive plagues strike Egypt; Pharaoh repeatedly promises and retracts, while Goshen begins to be distinguished."],"deep":[["暫時讓步不等於真正放手","Temporary concessions are not genuine release"],["術士承認「神的手指」而法老仍硬心","The magicians acknowledge divine power while Pharaoh remains resistant"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["怎樣辨認談判中的真誠改變？","How can genuine change be distinguished from temporary concession?"]},{"n":9,"refs":"9","title":["牲畜疫、瘡與冰雹","Livestock disease, boils, and hail"],"summary":["災禍加重，部分埃及人開始重視警告，把僕人牲畜避入屋內；法老仍反覆。","Plagues intensify; some Egyptians heed warnings and shelter servants and animals, while Pharaoh keeps reversing course."],"deep":[["埃及人不是毫無差別的一群，有人回應警告","Egyptians respond differently, some heeding warning"],["冰雹災中仍有躲避的可能，審判敘事含選擇","Shelter remains possible amid hail"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["本章如何避免把埃及人都描寫成一樣？","How does this chapter differentiate Egyptians?"]},{"n":10,"refs":"10","title":["蝗災與黑暗","Locusts and darkness"],"summary":["蝗蟲吞噬剩餘作物，黑暗籠罩埃及；法老提出有限放行但仍控制牲畜。","Locusts consume what remains, darkness covers Egypt, and Pharaoh proposes release while retaining control over livestock."],"deep":[["法老臣僕亦求他正視國土破敗","Pharaoh’s officials see the land’s ruin"],["有限放行保留經濟控制，不等於自由","Partial release retains economic leverage"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["為何「可以走，但留下財產」仍不是自由？","Why is departure without property not freedom?"]},{"n":11,"refs":"11","title":["最後一災的預告","Announcement of the final plague"],"summary":["摩西預告長子之死與以色列離境；敘事為逾越節與出埃及作準備。","Moses announces the death of firstborns and Israel’s departure, preparing the Passover narrative."],"deep":[["災禍的嚴重性要求課堂誠實處理死亡","The coming deaths require honest ethical discussion"],["以色列向鄰舍取物不可脫離奴役背景講述","Israel’s taking of goods belongs in the slavery context"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["如何讀這段審判而不輕看失去親人的痛苦？","How can the judgment be read without minimizing bereavement?"]},{"n":12,"refs":"12","title":["逾越節與出埃及","Passover and departure"],"summary":["逾越節羊羔、血與無酵餅成為記憶方式；長子之災後，百姓急速離開埃及。","Lamb, blood, and unleavened bread shape remembrance; after the final plague, Israel leaves Egypt in haste."],"deep":[["節期把一次拯救變成跨代講述","The festival turns one rescue into intergenerational memory"],["參與逾越節的規定反映群體身分的邊界","Participation rules mark communal boundaries"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["為何拯救需要被每一代重新講述？","Why must each generation retell rescue?"]},{"n":13,"refs":"13","title":["奉獻頭生與雲火引路","Firstborn and guidance by cloud and fire"],"summary":["神要求記念頭生與無酵節；百姓繞道前行，雲柱火柱引路。","Israel is told to remember firstborns and unleavened bread; the route bends, guided by cloud and fire."],"deep":[["繞道顯示神的帶領不總是最短路線","The detour shows guidance is not always shortest"],["對兒女的解釋讓儀式與歷史相連","Explaining rituals to children joins practice to his  resources?"]},{"n":17,"refs":"17","title":["磐石出水與亞瑪力戰","Water from rock and Amalek battle"],"summary":["百姓缺水爭鬧，神供應水；與亞瑪力人交戰時，摩西需要同伴扶持。","The people quarrel over water and receive it; in battle with Amalek, Moses depends on others’ support."],"deep":[["缺水是真實危機，抱怨不能被單純嘲笑","Water scarcity is real, not laughable"],["扶手的畫面顯出領導需要群體","Supporting Moses’ arms portrays leadership as shared"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["領袖何時需要承認自己不能獨撐？","When must leaders admit they cannot stand alone?"]},{"n":18,"refs":"18","title":["葉忒羅的建議","Jethro’s counsel"],"summary":["葉忒羅聽見神的作為，見摩西獨自審判百姓，建議設立分層的公正治理。","Jethro hears of deliverance and advises Moses to share the work of judging disputes."],"deep":[["外族親屬成為治理智慧來源","A foreign relative brings wisdom"],["委派不是卸責，而是為百姓提供可及的公正","Delegation can make justice accessible rather than evade responsibility"]],"caution":["災禍與戰爭敘事包含真實苦難；不要把埃及人的死亡變成輕率勝利口號。","Plagues and war portray suffering; do not turn Egyptian deaths into a careless victory slogan."],"question":["一個群體如何使求助與公義更容易取得？","How can a community make help and justice accessible?"]},{"n":19,"refs":"19","title":["西奈山預備立約","Preparing for Sinai covenant"],"summary":["神宣告以色列將作祭司國度與聖潔國民；百姓預備，在雷轟與界線中迎接神臨在。","God calls Israel a priestly kingdom and holy nation; the people prepare for divine presence amid thunder and boundaries."],"deep":[["受拯救後才受召成為祭司國度","Rescue precedes the priestly vocation"],["山的界線強調親近與敬畏同時存在","Boundaries hold nearness and reverence together"]],"caution":["古代約書應按其社會與出奴背景閱讀；不可用它為今日奴役或傷害辯護。","Read ancient case laws in their setting; do not use them to defend modern enslavement or harm."],"question":["成為祭司國度意味要向列國呈現甚麼？","What might a priestly people show the nations?"]},{"n":20,"refs":"20","title":["十誡與敬畏","Ten commandments and awe"],"summary":["神以出埃及作序宣告誡命；百姓懼怕雷轟，摩西解釋敬畏與試驗。","God prefaces the commandments with deliverance; the people fear the thunder, and M  without presence"],"summary":["神命百姓前行，摩西卻求神親自同去並渴望見祂榮耀；神以恩慈回應又設限。","God tells Israel to move, but Moses asks for God’s own presence and glory; mercy is given with limits."],"deep":[["摩西把群體命運與神同在連在一起","Moses ties communal future to divine presence"],["「見面」與「不能見面」語言表達親近的界限","Seeing and not seeing express nearness with limit"]],"caution":["會幕細節表達神同在與敬拜秩序；不要把每個尺寸轉成無經文根據的祕密寓意。","Tabernacle details concern presence and ordered worship; do not assign unsupported hidden meanings to every measurement."],"question":["一條有方向卻沒有神同在的路值得走嗎？","Is a clear route enough without God’s presence?"]},{"n":34,"refs":"34","title":["重立約與神的性情","Covenant renewed and divine character"],"summary":["神宣告憐憫、公義與守約的性情，重刻法版；摩西下山時面容發光。","God declares mercy, justice, and covenant loyalty, renews the tablets, and Moses descends with a shining face."],"deep":[["34:6–7 把慈愛與追究並列，不能只保留一半","Mercy and accountability stand together in 34:6–7"],["重立約不是抹去金牛犢事件","Renewal does not erase the calf episode"]],"caution":["會幕細節表達神同在與敬拜秩序；不要把每個尺寸轉成無經文根據的祕密寓意。","Tabernacle details concern presence and ordered worship; do not assign unsupported hidden meanings to every measurement."],"question":["神的憐憫與公義如何彼此約束？","How do mercy and justice belong together?"]},{"n":35,"refs":"35","title":["甘心奉獻與建造開始","Willing gifts and construction begins"],"summary":["安息日吩咐後，百姓甘心獻材料，男女工匠參與會幕建造。","After the Sabbath command, people freely bring materials and artisans begin work."],"deep":[["安息再次放在工作之前","Rest again precedes work"],["甘心而非強迫成為建造神居所的方式","Voluntary gifts replace coerced labor"]],"caution":["會幕細節表達神同在與敬拜秩序；不要把每個尺寸轉成無經文根據的祕密寓意。","Tabernacle details concern presence and ordered worship; do not assign unsupported hidden meanings to every measurement."],"question":["哪些建造方式與出埃及的自由相稱？","What kinds of building match a people freed from slavery?"]},{"n":36,"refs":"36","title":["工匠與過量奉獻","Artisans and more than enough"],"summary":["百姓奉獻超過需要，摩西叫他們停止；工匠製作幕幔與結構。","Gifts exceed the need and Moses stops further giving; artisans make the curtains and frame."],"deep":[["足夠就停止與無限攫取相反","Stopping at enough opposes endless extraction"],["技藝與秩序共同服務會幕目的","Skill and order serve the tabernacle’s purpose"]],"caution":["會幕細節表達神同在與敬拜秩序；不要把每個尺寸轉成無經文根據的祕密寓意。","Tabernacle details concern presence and ordered worship; do not assign unsupported hidden meanings to every measurement."],"question":["群體何時應說「已經夠了」？","When should a community say, “We have enough”?"]},{"n":37,"refs":"37","title":["約櫃、桌、燈臺製成","Ark, table, and lampstand made"],"summary":["工匠按吩咐製作至聖所與聖所器具；建造的重複讓讀者看見命令落實。","Artisans make the ark, table, and lampstand; repetition shows instruction becoming concrete."],"deep":[["25 章的設計在此成為實物","Chapter 25’s design becomes tangible"],["重複不是無意義冗贅，而是記錄完成","The repetition records faithful completion"]],"caution":["會幕細節表達神同在與敬拜秩序；不要把每個尺寸轉成無經文根據的祕密寓意。","Tabernacle details concern presence and ordered worship; do not assign unsupported hidden meanings to every measurement."],"question":["閱讀重複段落時應找哪種變化？","What changes should readers notice in repeated instructions?"]},{"n":38,"refs":"38","title":["祭壇、院子與材料清單","Altar, courtyard, and material accounting"],"summary":["祭壇與院子完成，材料重量公開列出，顯示建造涉及可追蹤的資源。","The altar and court are made, and materials are counted openly, making resources traceable."],"deep":[["材料清單提醒敬拜建造也有財務責任","The inventory links worship with financial accountability"],["外院形成與神相遇的公共邊界","The court marks a shared threshold"]],"caution":["會幕細節表達神同在與敬拜秩序；不要把每個尺寸轉成無經文根據的祕密寓意。","Tabernacle details concern presence and ordered worship; do not assign unsupported hidden meanings to every measurement."],"question":["為何屬靈工程仍需要公開資源帳目？","Why does sacred building still need transparent accounting?"]},{"n":39,"refs":"39","title":["祭司衣袍與驗收","Garments and inspection"],"summary":["祭司衣袍完成，工人把各件帶到摩西面前，摩西察看後祝福。","Priestly garments are finished, and the work is presented to Moses for inspection and blessing."],"deep":[["「照耶和華所吩咐」反覆標示完成與原設計對照","The repeated “as commanded” compares work with design"],["祝福發生在檢視之後而非代替檢視","Blessing follows inspection rather than replacing it"]],"caution":["會幕細節表達神同在與敬拜秩序；不要把每個尺寸轉成無經文根據的祕密寓意。","Tabernacle details concern presence and ordered worship; do not assign unsupported hidden meanings to every measurement."],"question":["驗收與祝福如何一同表達責任？","How can inspection and blessing work together?"]},{"n":40,"refs":"40","title":["會幕立起與榮光充滿","Tabernacle raised and filled with glory"],"summary":["摩西立起會幕，雲彩與榮光充滿其中；神的同在引導以色列日後起行與停留。","Moses erects the tabernacle; cloud and glory fill it, directing when Israel moves or stays."],"deep":[["40:35 摩西不能進入會幕，為利未記的問題開場","Moses’ inability to enter in 40:35 sets up Leviticus"],["出埃及以同住和引導而非單純脫離埃及收尾","Exodus ends with presence and guidance, not escape alone"]],"caution":["會幕細節表達神同在與敬拜秩序；不要把每個尺寸轉成無經文根據的祕密寓意。","Tabernacle details concern presence and ordered worship; do not assign unsupported hidden meanings to every measurement."],"question":["全書為何以神住在百姓中間作結？","Why does the book end with God dwelling among the people?"]}],"themesIntro":["以下主題橫跨全書；先讀完整經文，再比較各段的不同聲音。","These themes run through the book; read full passages before comparing their distinct voices."],"themes":[{"refs":"1–15","title":["從奴役到自由","From slavery to freedom"],"body":["救贖面對制度性勞役與殺嬰，不只是個人感受改善。","Rescue faces forced labor and infanticide, not merely a change of feeling."],"caution":["不要忽略埃及人的苦難或把民族敵意帶到今日。","Do not ignore Egyptian suffering or transfer ethnic hostility to today."]},{"refs":"12–13; 20","title":["跨代的記憶","Memory across generations"],"body":["逾越節與十誡序言使下一代知道自由由何而來。","Passover and the commandments’ preface tell later generations where freedom began."],"caution":["記念不可變成排斥異己的藉口。","Memory must not become an excuse to exclude outsiders."]},{"refs":"16; 20; 23; 31","title":["安息與夠用","Rest and sufficiency"],"body":["嗎哪、安息日與土地休息把供應、公正和信任連起來。","Manna, Sabbath, and land rest join provision, fairness, and trust."],"caution":["不要用安息命令羞辱必須工作的人。","Do not shame those whose circumstances require work."]},{"refs":"19–24","title":["盟約與鄰舍公義","Covenant and neighbor justice"],"body":["敬拜神的群體也必須處理貧窮、寄居者與審判公平。","A worshiping community must also address poverty, immigrants, and fair judgment."],"caution":["古代法例與現代法律並非逐條等同。","Ancient cases are not identical to modern statutes."]},{"refs":"25–40","title":["神居住在百姓中間","God dwelling among the people"],"body":["會幕的預備、危機與完成，使拯救的目的落在同住與同行。","Design, crisis, and completion of the tabernacle make shared presence the goal of rescue."],"caution":["不要把每件器具都當作固定預言密碼。","Do not turn every furnishing into a fixed prophetic code."]}],"pastoral":{"title":["教師帶領提醒","Teaching care"],"body":["不要把古代敘事中的暴力、奴役或排斥直接當成今日的規範；讓學員辨認文本描述、神學評價與當代應用的距離。","Do not treat ancient violence, enslavement, or exclusion in narratives as direct present-day norms. Help learners distinguish description, theological evaluation, and application."]},"lessonsIntro":["八課可按班級時數拆分；每課先讀指定經文，再用問題引導觀察、討論與應用。","These eight lessons can be divided further; read the assigned text before observation, discussion, and application."],"lessons":[{"refs":"1–4","title":["第 1 課｜看見受壓迫者","Lesson 1 | Seeing the oppressed"],"aim":["認識奴役背景與摩西呼召。","Understand the oppression and Moses’ call."],"flow":[["讀 1 章，辨認法老的恐懼與政策。","Read chapter 1 for Pharaoh’s fear and policy. "],["追蹤 2 章保護摩西的女性。","Trace the women who protect Moses in chapter 2. "],["讀 3–4 章，列出神與摩西各說了甚麼。","List God’s and Moses’ words in chapters 3–4."]],"question":["神的呼召如何回應群體的哀聲？","How does the call answer the people’s cry?"],"practice":["尊重曾受壓迫者的感受，不要求分享創傷。","Respect those harmed by oppression without demanding disclosure."]},{"refs":"5–11","title":["第 2 課｜法老的抗拒","Lesson 2 | Pharaoh’s resistance"],"aim":["追蹤談判、災禍與硬心的反覆。","Trace negotiations, plagues, and repeated refusal."],"flow":[["對照 5 章的加重勞役與 6 章的重申應許。","Compare harsher labor in chapter 5 with renewed promise in 6. "],["分組整理 7–10 章法老的承諾與反悔。","Chart Pharaoh’s promises and reversals in chapters 7–10. "],["讀 11 章，討論最後災禍的倫理重量。","Discuss the moral weight of chapter 11."]],"question":["權力如何在危機中仍保護自己？","How does power protect itself during crisis?"],"practice":["不要把受災者的死亡講得輕鬆。","Do not speak lightly of those who die."]},{"refs":"12–15","title":["第 3 課｜逾越與過海","Lesson 3 | Passover and sea"],"aim":["理解拯救事件如何成為群體記憶。","Understand how rescue becomes communal memory."],"flow":[["讀 12–13 章，標出向兒女講述的命令。","Mark intergenerational teaching in chapters 12–13. "],["讀 14 章，辨認恐懼、行動與拯救。","Identify fear, action, and rescue in chapter 14. "],["讀 15 章的歌與苦水，討論勝利後的需要。","Discuss song and bitter water in chapter 15."]],"question":["自由如何藉儀式和故事傳給下一代？","How is freedom passed to a new generation?"],"practice":["正視過海敘事中的死亡。","Face the deaths in the sea story honestly."]},{"refs":"16–18","title":["第 4 課｜曠野的供應與合作","Lesson 4 | Provision and shared work"],"aim":["從嗎哪、水與葉忒羅建議看信任與治理。","Study trust and governance through manna, water, and Jethro."],"flow":[["比較 16–17 章三種需要。","Compare needs in chapters 16–17. "],["試畫一週嗎哪與安息日的節奏。","Sketch manna and Sabbath across a week. "],["讀 18 章，討論如何分擔審判工作。","Discuss shared judgment in chapter 18."]],"question":["每日夠用如何改變群體權力？","How can daily sufficiency reshape communal power?"],"practice":["缺水是生存問題，不宜嘲諷百姓。","Water scarcity is a survival issue, not a joke."]},{"refs":"19–24","title":["第 5 課｜受救群體的約","Lesson 5 | Covenant for a rescued people"],"aim":["把十誡與案例法放進拯救敘事。","Read commandments and case laws within rescue."],"flow":[["讀 19:4–6 與 20:2，標出拯救先於誡命。","Read 19:4–6 and 20:2 for rescue before commands. "],["小組選 21–23 章案例，辨認保護與限制。","Choose cases from chapters 21–23 and identify protections and limits. "],["讀 24 章，觀察公開立約。","Read chapter 24 for public commitment."]],"question":["敬拜與鄰舍公義如何互相連結？","How do worship and neighbor justice connect?"],"practice":["古代奴役法不可用來支持現代奴役。","Ancient servitude law cannot defend modern slavery."]},{"refs":"25–31","title":["第 6 課｜會幕、工匠與安息","Lesson 6 | Tabernacle, craft, and rest"],"aim":["認出會幕細節的中心目的。","Identify the tabernacle’s central purpose."],"flow":[["以 25:8 說明「住在中間」。","Begin with the purpose in 25:8. "],["分組整理器具、祭司和工匠的角色。","Map furnishings, priests, and artisans. "],["讀 31 章，討論神聖工程為何仍須安息。","Ask why sacred building still pauses for Sabbath in chapter 31."]],"question":["神同住的目標如何影響建造方式？","How should the goal of divine dwelling shape building?"],"practice":["避免憑空寓意化每個尺寸。","Avoid invented symbolism for each measurement."]},{"refs":"32–34","title":["第 7 課｜背約、代求與更新","Lesson 7 | Breach, intercession, renewal"],"aim":["處理金牛犢事件與神的慈愛公義。","Read the calf crisis alongside mercy and justice."],"flow":[["讀 32 章，辨認人造可見神的動機。","Read chapter 32 for the pull of a visible image. "],["讀 33 章，討論摩西為何求同在。","Ask why Moses seeks divine presence in 33. "],["慢讀 34:6–7，列出慈愛與追究。","Read 34:6–7 for mercy and accountability."]],"question":["更新是否可以不面對傷害？","Can renewal bypass accountability?"],"practice":["避免以「赦免」取消對傷害的處理。","Do not use forgiveness to erase harm."]},{"refs":"35–40","title":["第 8 課｜從設計到同住","Lesson 8 | From design to dwelling"],"aim":["比較建造、檢視與榮光充滿。","Compare construction, inspection, and glory."],"flow":[["對照 25–31 章命令與 35–39 章完成。","Compare commands in 25–31 with completion in 35–39. "],["找出甘心奉獻、足夠就停的細節。","Find willing gifts and the point of enough. "],["讀 40:34–38，說明出埃及記如何連向利未記。","Read 40:34–38 as a bridge to Leviticus."]],"question":["脫離埃及之外，拯救還指向甚麼？","Beyond leaving Egypt, what is rescue for?"],"practice":["留意 40:35 摩西仍不能進入會幕。","Notice Moses still cannot enter in 40:35."]}],"questionsIntro":["請先讓學員指出經文根據，再討論詮釋與應用；困難經文可以保留開放問題。","Ask learners for textual evidence before interpretation and application; difficult passages may leave open questions."],"extraQuestions":[["出埃及記的自由與現代個人自主有何不同？","How does Exodus freedom differ from modern individual autonomy?"],["十誡與案例法如何把敬拜連到弱者保護？","How do commandments and cases connect worship with protection of the vulnerable?"],["會幕的完成如何回應出埃及的目的？","How does the completed tabernacle answer the purpose of exodus?"]],"sourceNote":["本站提供原創逐章摘要與教學建議，不轉載任何譯本的完整經文。中文經文連結預設新標點和合本（神版），英文預設 NASB 2020。","Original chapter summaries and teaching notes; no complete Bible translation is reproduced. Chinese Scripture links default to CUNP (Shen edition), English to NASB 2020."],"sources":[{"title":["BibleProject｜出埃及記導讀","BibleProject | Exodus guide"],"url":"https://bibleproject.com/guides/book-of-exodus/"},{"title":["耶魯公開課｜舊約導論","Open Yale Courses | Introduction to the Old Testament"],"url":"https://oyc.yale.edu/religious-studies/rlst-145"}],"footer":["出埃及記研讀 · 原創逐章摘要與成人主日學教師教案","Exodus study · original chapter notes and adult class plans"],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-1" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
