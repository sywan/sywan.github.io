<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="耶利米哀歌成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>耶利米哀歌｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"LAM","category":["哀歌與詩歌","Lament Poetry"],"name":["耶利米哀歌","Lamentations"],"subtitle":["五首為耶路撒冷災難而寫的詩：讓城市、受害者與祈禱者的聲音不被希望口號掩蓋。","Five poems after Jerusalem’s catastrophe: hear the city, victims, and praying community without silencing grief."],"overviewIntro":["先從全書結構掌握耶利米哀歌，再逐章研讀人物、事件與神學判斷。","Survey Lamentations as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["5 章；依照書卷原有次序逐章研讀。","5 chapters studied in canonical sequence."],"thesis":["哀哭是信仰的一種語言","Lament is a language of faith"],"thesisDetail":["本書從荒涼、憤怒和身體痛楚走向求神記念，卻沒有給傷痛一個整齊結案。","The poems move through desolation, anger, bodily pain, and appeal to God without a tidy closure."],"keyQuestion":["耶利米哀歌如何在複雜歷史中呈現忠誠、失敗與盼望？","How does Lamentations portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["本書從荒涼、憤怒和身體痛楚走向求神記念，卻沒有給傷痛一個整齊結案。","The poems move through desolation, anger, bodily pain, and appeal to God without a tidy closure."],"finalMovement":["最後一句仍在質疑神是否棄絕；教師應容許問題與祈禱並存。","The final line still questions rejection; prayer and unanswered questions remain together."],"readingKeys":[{"refs":"1","title":["城市的孤單","The lonely city"],"body":["錫安以寡婦形象哭泣，朋友變敵人，無人安慰。","Zion weeps like a widow; friends become enemies and no comforter appears."]},{"refs":"3","title":["受苦者的獨白","A sufferer’s testimony"],"body":["一人詳述創痛，在哀哭中記起慈愛仍不斷絕。","A sufferer details pain and recalls mercy amid lament."]},{"refs":"4","title":["圍城後的反轉","Siege reversals"],"body":["昔日尊貴者飢餓流離，領袖與先知的錯誤也被指出。","Formerly honored people starve and wander; leaders and prophets are implicated."]},{"refs":"3–5","title":["盼望與開放結尾","Hope and open ending"],"body":["將第三首的慈愛與第五首的未解答提問並讀。","Read the third poem’s mercy beside the fifth poem’s unanswered question."]}],"mapIntro":["沿八個段落觀察耶利米哀歌的敘事推進與轉折。","Trace the movement of Lamentations through eight teaching units."],"movements":[{"refs":"1","title":["城市的孤單","The lonely city"],"body":["錫安以寡婦形象哭泣，朋友變敵人，無人安慰。","Zion weeps like a widow; friends become enemies and no comforter appears."]},{"refs":"2","title":["主怒中的毀城","Destruction and anger"],"body":["殿與城牆被毀，詩人呼喊兒童飢餓的實況。","Temple and walls fall as the poet cries over hungry children."]},{"refs":"3","title":["受苦者的獨白","A sufferer’s testimony"],"body":["一人詳述創痛，在哀哭中記起慈愛仍不斷絕。","A sufferer details pain and recalls mercy amid lament."]},{"refs":"3","title":["等候與申訴","Waiting and protest"],"body":["同一首詩也呼籲察驗道路、向天舉心，並抗議不公。","The same poem calls for self-examination and raised hearts while protesting injustice."]},{"refs":"4","title":["圍城後的反轉","Siege reversals"],"body":["昔日尊貴者飢餓流離，領袖與先知的錯誤也被指出。","Formerly honored people starve and wander; leaders and prophets are implicated."]},{"refs":"5","title":["群體求記念","Community asks to be remembered"],"body":["無字母順序的詩列出受辱者、勞動者與失去產業者。","A non-acrostic prayer names humiliation, forced labor, and lost inheritance."]},{"refs":"1–5","title":["五首詩的聲音","Voices across five poems"],"body":["回顧城、旁觀者、受苦者與群體各自如何向神說話。","Compare city, witness, sufferer, and community addressing God."]},{"refs":"3–5","title":["盼望與開放結尾","Hope and open ending"],"body":["將第三首的慈愛與第五首的未解答提問並讀。","Read the third poem’s mercy beside the fifth poem’s unanswered question."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["傳統把本書連於耶利米，但詩歌未署作者；字母離合體與中間第三首的三重排列值得留意。","Tradition links the poems to Jeremiah, but they are anonymous; notice acrostic design and the triple sequence in poem three."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["孤單的錫安","Lonely Zion"],"summary":["昔日熱鬧的城像寡婦獨坐，敵人得勢，城在痛苦中呼喚安慰與公義。","The once-crowded city sits like a widow; enemies prevail as Zion calls for comfort and justice."],"deep":[["擬人化使被毀城市能用自己的聲音申訴。","Personification gives the destroyed city a voice."],["反覆的「無人安慰」使讀者停留在傷痛中。","Repeated lack of comfort keeps the reader with grief."]],"caution":["勿把受災者的孤單簡化成道德教訓。","Do not reduce sufferers’ loneliness to a moral lesson."],"question":["「無人安慰」反覆出現有何作用？","What does the repeated absence of comfort do?"]},{"n":2,"refs":"2","title":["倒毀與飢餓","Ruin and hunger"],"summary":["詩人描寫城牆和聖殿傾覆、孩童餓倒街頭，催促錫安向主傾心。","The poet depicts collapsed walls and sanctuary, children fainting in streets, and urges Zion to pour out its heart."],"deep":[["神學憤怒與兒童的具體飢餓必須同時被聽見。","Theological anger and children’s literal hunger must both be heard."],["聖所毀壞與幼兒飢餓同被放在神面前。","The ruined sanctuary and hungry children are brought before God together."]],"caution":["不可把兒童苦難稱為理所當然的懲罰。","Do not call children’s suffering deserved punishment."],"question":["詩人讓讀者看見哪些受苦者？","Which sufferers does the poet make visible?"]},{"n":3,"refs":"3","title":["受苦者、慈愛與抗議","Sufferer, mercy, and protest"],"summary":["「我」細述創傷，在詩中段記起憐憫，又回到申訴與求伸冤。","An “I” recounts affliction, remembers mercy at the center, then returns to protest and appeal."],"deep":[["慈愛宣告不是哀歌的最後一句。","Mercy is not the poem’s final sentence."],["盼望位於長篇痛苦見證之中。","Hope sits within a long testimony of pain."]],"caution":["不應抽離「慈愛」句子而忽略周圍的哀聲。","Do not isolate mercy lines from their surrounding grief."],"question":["盼望在本章處於什麼位置？","Where does hope stand within this poem?"]},{"n":4,"refs":"4","title":["從榮耀到飢餓","From splendor to hunger"],"summary":["黃金失色，貴族與孩童飢餓；詩歌追問先知、祭司與領袖的責任。","Gold grows dim; nobles and children starve as the poem implicates prophets, priests, and rulers."],"deep":[["「昔日／如今」反覆對比，使群體的崩塌無法抽象化。","Repeated before-and-after contrasts resist abstracting communal collapse."],["「從前／如今」的對照使城市崩潰具體可見。","Before-and-after contrasts make collapse tangible."]],"caution":["勿把饑荒與暴力美化為抽象神學圖像。","Do not aestheticize famine and violence."],"question":["哪些反轉最能顯示災難的深度？","Which reversal most clearly exposes the disaster?"]},{"n":5,"refs":"5","title":["求你記念我們","Remember us"],"summary":["群體列出失地、剝削、暴力與羞辱，承認神長存，仍問祂是否全然棄絕。","The community names lost land, exploitation, violence, and shame; it confesses God’s reign while asking if rejection is final."],"deep":[["祈求以未解決的問題結束，沒有輕易圓滿。","Prayer ends with an unresolved question, not easy closure."],["從個人聲音轉向群體「我們」的祈求。","The voice moves toward a communal “we.”"]],"caution":["不可讓群體語言抹去不同人的經驗。","Do not let communal language erase distinct experiences."],"question":["結尾如何容許信心與困惑並存？","How does the ending hold faith with bewilderment?"]}],"themesIntro":["以下主題由耶利米哀歌的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of Lamentations and complement the chapter studies."],"themes":[{"refs":"1","title":["城市的孤單","The lonely city"],"body":["錫安以寡婦形象哭泣，朋友變敵人，無人安慰。","Zion weeps like a widow; friends become enemies and no comforter appears."],"caution":["勿把受災者的孤單簡化成道德教訓。","Do not reduce sufferers’ loneliness to a moral lesson."]},{"refs":"3","title":["受苦者的獨白","A sufferer’s testimony"],"body":["一人詳述創痛，在哀哭中記起慈愛仍不斷絕。","A sufferer details pain and recalls mercy amid lament."],"caution":["不應抽離「慈愛」句子而忽略周圍的哀聲。","Do not isolate mercy lines from their surrounding grief."]},{"refs":"4","title":["圍城後的反轉","Siege reversals"],"body":["昔日尊貴者飢餓流離，領袖與先知的錯誤也被指出。","Formerly honored people starve and wander; leaders and prophets are implicated."],"caution":["勿把饑荒與暴力美化為抽象神學圖像。","Do not aestheticize famine and violence."]},{"refs":"1–5","title":["五首詩的聲音","Voices across five poems"],"body":["回顧城、旁觀者、受苦者與群體各自如何向神說話。","Compare city, witness, sufferer, and community addressing God."],"caution":["不要強迫所有哀傷者按同一順序復原。","Do not force all grieving people through one recovery sequence."]},{"refs":"3–5","title":["盼望與開放結尾","Hope and open ending"],"body":["將第三首的慈愛與第五首的未解答提問並讀。","Read the third poem’s mercy beside the fifth poem’s unanswered question."],"caution":["切勿把經文作為要求人「現在就好起來」的命令。","Do not use the text to demand immediate emotional recovery."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["不要在喪親或災難者面前急著引用第三章的盼望；先聽一、二、四、五章對飢餓、暴力與棄絕的控訴。","Do not rush to chapter 3’s hope in front of grieving people; first hear hunger, violence, and abandonment in the other poems."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1","title":["第 1 課｜城市的孤單","Lesson 1 | The lonely city"],"aim":["錫安以寡婦形象哭泣，朋友變敵人，無人安慰。","Zion weeps like a widow; friends become enemies and no comforter appears."],"flow":[["讀 1 章：擬人化使被毀城市能用自己的聲音申訴。","Read chapter 1: Personification gives the destroyed city a voice."],["對照 1 章：反覆的「無人安慰」使讀者停留在傷痛中。","Compare chapters 1: Repeated lack of comfort keeps the reader with grief."],["討論：「無人安慰」反覆出現有何作用？","Discuss: What does the repeated absence of comfort do?"]],"question":["「無人安慰」反覆出現有何作用？","What does the repeated absence of comfort do?"],"practice":["勿把受災者的孤單簡化成道德教訓。","Do not reduce sufferers’ loneliness to a moral lesson."]},{"refs":"2","title":["第 2 課｜主怒中的毀城","Lesson 2 | Destruction and anger"],"aim":["殿與城牆被毀，詩人呼喊兒童飢餓的實況。","Temple and walls fall as the poet cries over hungry children."],"flow":[["讀 2 章：神學憤怒與兒童的具體飢餓必須同時被聽見。","Read chapter 2: Theological anger and children’s literal hunger must both be heard."],["對照 2 章：聖所毀壞與幼兒飢餓同被放在神面前。","Compare chapters 2: The ruined sanctuary and hungry children are brought before God together."],["討論：詩人讓讀者看見哪些受苦者？","Discuss: Which sufferers does the poet make visible?"]],"question":["詩人讓讀者看見哪些受苦者？","Which sufferers does the poet make visible?"],"practice":["不可把兒童苦難稱為理所當然的懲罰。","Do not call children’s suffering deserved punishment."]},{"refs":"3","title":["第 3 課｜受苦者的獨白","Lesson 3 | A sufferer’s testimony"],"aim":["一人詳述創痛，在哀哭中記起慈愛仍不斷絕。","A sufferer details pain and recalls mercy amid lament."],"flow":[["讀 3 章：慈愛宣告不是哀歌的最後一句。","Read chapter 3: Mercy is not the poem’s final sentence."],["對照 3 章：盼望位於長篇痛苦見證之中。","Compare chapters 3: Hope sits within a long testimony of pain."],["討論：盼望在本章處於什麼位置？","Discuss: Where does hope stand within this poem?"]],"question":["盼望在本章處於什麼位置？","Where does hope stand within this poem?"],"practice":["不應抽離「慈愛」句子而忽略周圍的哀聲。","Do not isolate mercy lines from their surrounding grief."]},{"refs":"3","title":["第 4 課｜等候與申訴","Lesson 4 | Waiting and protest"],"aim":["同一首詩也呼籲察驗道路、向天舉心，並抗議不公。","The same poem calls for self-examination and raised hearts while protesting injustice."],"flow":[["讀 3 章：慈愛宣告不是哀歌的最後一句。","Read chapter 3: Mercy is not the poem’s final sentence."],["對照 3 章：等候不是停止向神發問。","Compare chapters 3: Waiting does not end questions addressed to God."],["討論：盼望在本章處於什麼位置？","Discuss: Where does hope stand within this poem?"]],"question":["盼望在本章處於什麼位置？","Where does hope stand within this poem?"],"practice":["不可把認罪用來使受害者閉嘴。","Do not use confession to silence victims."]},{"refs":"4","title":["第 5 課｜圍城後的反轉","Lesson 5 | Siege reversals"],"aim":["昔日尊貴者飢餓流離，領袖與先知的錯誤也被指出。","Formerly honored people starve and wander; leaders and prophets are implicated."],"flow":[["讀 4 章：「昔日／如今」反覆對比，使群體的崩塌無法抽象化。","Read chapter 4: Repeated before-and-after contrasts resist abstracting communal collapse."],["對照 4 章：「從前／如今」的對照使城市崩潰具體可見。","Compare chapters 4: Before-and-after contrasts make collapse tangible."],["討論：哪些反轉最能顯示災難的深度？","Discuss: Which reversal most clearly exposes the disaster?"]],"question":["哪些反轉最能顯示災難的深度？","Which reversal most clearly exposes the disaster?"],"practice":["勿把饑荒與暴力美化為抽象神學圖像。","Do not aestheticize famine and violence."]},{"refs":"5","title":["第 6 課｜群體求記念","Lesson 6 | Community asks to be remembered"],"aim":["無字母順序的詩列出受辱者、勞動者與失去產業者。","A non-acrostic prayer names humiliation, forced labor, and lost inheritance."],"flow":[["讀 5 章：祈求以未解決的問題結束，沒有輕易圓滿。","Read chapter 5: Prayer ends with an unresolved question, not easy closure."],["對照 5 章：從個人聲音轉向群體「我們」的祈求。","Compare chapters 5: The voice moves toward a communal “we.”"],["討論：結尾如何容許信心與困惑並存？","Discuss: How does the ending hold faith with bewilderment?"]],"question":["結尾如何容許信心與困惑並存？","How does the ending hold faith with bewilderment?"],"practice":["不可讓群體語言抹去不同人的經驗。","Do not let communal language erase distinct experiences."]},{"refs":"1–5","title":["第 7 課｜五首詩的聲音","Lesson 7 | Voices across five poems"],"aim":["回顧城、旁觀者、受苦者與群體各自如何向神說話。","Compare city, witness, sufferer, and community addressing God."],"flow":[["讀 1 章：擬人化使被毀城市能用自己的聲音申訴。","Read chapter 1: Personification gives the destroyed city a voice."],["對照 1–5 章：不同詩歌沒有被抹平成單一情緒。","Compare chapters 1–5: The poems do not collapse into one emotion."],["討論：結尾如何容許信心與困惑並存？","Discuss: How does the ending hold faith with bewilderment?"]],"question":["「無人安慰」反覆出現有何作用？","What does the repeated absence of comfort do?"],"practice":["不要強迫所有哀傷者按同一順序復原。","Do not force all grieving people through one recovery sequence."]},{"refs":"3–5","title":["第 8 課｜盼望與開放結尾","Lesson 8 | Hope and open ending"],"aim":["將第三首的慈愛與第五首的未解答提問並讀。","Read the third poem’s mercy beside the fifth poem’s unanswered question."],"flow":[["讀 3 章：慈愛宣告不是哀歌的最後一句。","Read chapter 3: Mercy is not the poem’s final sentence."],["對照 3–5 章：盼望可以真實，同時不取消未得回答的痛。","Compare chapters 3–5: Hope can be real without canceling unanswered pain."],["討論：結尾如何容許信心與困惑並存？","Discuss: How does the ending hold faith with bewilderment?"]],"question":["盼望在本章處於什麼位置？","Where does hope stand within this poem?"],"practice":["切勿把經文作為要求人「現在就好起來」的命令。","Do not use the text to demand immediate emotional recovery."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["耶利米哀歌最常被忽略的人物是誰？為何？","Which character in Lamentations is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜耶利米哀歌導讀","BibleProject | Lamentations guide"],"url":"https://bibleproject.com/guides/book-of-lamentations/"}],"footer":["耶利米哀歌 · 成人主日學教師版 · 請配合完整經文閱讀。","Lamentations · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
