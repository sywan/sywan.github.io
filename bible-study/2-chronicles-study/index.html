<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="歷代志下成人主日學教師版：全書鳥瞰、逐章研讀、文學地圖、主題、八課教案與討論題。"><title>歷代志下｜成人主日學教師版</title><link rel="stylesheet" href="../assets/book-study.css?v=20261103-language"></head><body><a class="skip" href="#content">跳至內容</a><header class="hero"></header><nav class="nav"><div class="nav-inner"></div></nav><main id="content"></main><button class="backtop" type="button" title="回到頂端" aria-label="回到頂端">↑</button><script>window.STUDY_DATA={"code":"2CH","category":["歷史書","Historical Books"],"name":["歷代志下","2 Chronicles"],"subtitle":["從所羅門建殿到猶大亡國與古列詔書：36 章讓敬拜、悔改與未完成的歸回彼此對話。","From Solomon’s temple to Judah’s fall and Cyrus’s decree: 36 chapters hold worship, repentance, and unfinished return together."],"overviewIntro":["先從全書結構掌握歷代志下，再逐章研讀人物、事件與神學判斷。","Survey 2 Chronicles as a whole, then examine each chapter’s people, events, and theological judgments."],"lengthNote":["36 章；依照書卷原有次序逐章研讀。","36 chapters studied in canonical sequence."],"thesis":["聖殿、回轉與未竟的盼望","Temple, return, and unfinished hope"],"thesisDetail":["作者以聖殿與大衛王朝作敘事軸線，肯定尋求神的可能，也不掩蓋連續背離與被擄的結局。","The narrator centers temple and Davidic line, presenting the possibility of seeking God without concealing repeated failure and exile."],"keyQuestion":["歷代志下如何在複雜歷史中呈現忠誠、失敗與盼望？","How does 2 Chronicles portray fidelity, failure, and hope amid complex history?"],"keyAnswer":["作者以聖殿與大衛王朝作敘事軸線，肯定尋求神的可能，也不掩蓋連續背離與被擄的結局。","The narrator centers temple and Davidic line, presenting the possibility of seeking God without concealing repeated failure and exile."],"finalMovement":["古列宣告可上耶路撒冷建殿，書卷以「願耶和華與他同在」向未來敞開。","Cyrus invites return and rebuilding; “May the Lord be with him” opens the ending toward the future."],"readingKeys":[{"refs":"1–7","title":["所羅門與聖殿","Solomon and temple"],"body":["智慧、建築、約櫃、獻殿禱告及神的回應形成開篇。","Wisdom, building, ark, dedication prayer, and divine response form the opening."]},{"refs":"10–16","title":["分裂、改革與反覆","Division, reform, and reversal"],"body":["羅波安、亞比雅與亞撒在分裂後各有不同的求問與失誤。","Rehoboam, Abijah, and Asa respond differently after division."]},{"refs":"21–24","title":["王朝危機與約阿施","Dynastic crisis and Joash"],"body":["耶蘭、亞哈謝、亞他利雅與約阿施帶來王權、聖殿與先知衝突。","Jehoram, Ahaziah, Athaliah, and Joash expose conflict among throne, temple, and prophecy."]},{"refs":"33–36","title":["悔改、改革與被擄","Repentance, reform, and exile"],"body":["瑪拿西、約西亞、亡國與古列詔書使結尾保留張力。","Manasseh, Josiah, exile, and Cyrus’s decree leave a tense ending."]}],"mapIntro":["沿八個段落觀察歷代志下的敘事推進與轉折。","Trace the movement of 2 Chronicles through eight teaching units."],"movements":[{"refs":"1–7","title":["所羅門與聖殿","Solomon and temple"],"body":["智慧、建築、約櫃、獻殿禱告及神的回應形成開篇。","Wisdom, building, ark, dedication prayer, and divine response form the opening."]},{"refs":"8–9","title":["王國榮景與交接","Royal splendor and succession"],"body":["所羅門的工程、國際聲望與死亡，引向羅波安。","Solomon’s projects, international fame, and death lead to Rehoboam."]},{"refs":"10–16","title":["分裂、改革與反覆","Division, reform, and reversal"],"body":["羅波安、亞比雅與亞撒在分裂後各有不同的求問與失誤。","Rehoboam, Abijah, and Asa respond differently after division."]},{"refs":"17–20","title":["約沙法的信心與結盟","Jehoshaphat’s faith and alliances"],"body":["教導律法、審判改革、錯誤結盟與共同禱告並存。","Torah teaching, judicial reform, flawed alliances, and communal prayer coexist."]},{"refs":"21–24","title":["王朝危機與約阿施","Dynastic crisis and Joash"],"body":["耶蘭、亞哈謝、亞他利雅與約阿施帶來王權、聖殿與先知衝突。","Jehoram, Ahaziah, Athaliah, and Joash expose conflict among throne, temple, and prophecy."]},{"refs":"25–28","title":["亞瑪謝至亞哈斯","Amaziah to Ahaz"],"body":["亞瑪謝、烏西雅、約坦與亞哈斯呈現成敗與敬拜選擇。","Amaziah, Uzziah, Jotham, and Ahaz show mixed outcomes and worship decisions."]},{"refs":"29–32","title":["希西家與集體回轉","Hezekiah and communal renewal"],"body":["潔淨殿宇、守逾越節、恢復供應，也面對亞述威脅。","Temple cleansing, Passover, support for worship, and Assyrian threat converge."]},{"refs":"33–36","title":["悔改、改革與被擄","Repentance, reform, and exile"],"body":["瑪拿西、約西亞、亡國與古列詔書使結尾保留張力。","Manasseh, Josiah, exile, and Cyrus’s decree leave a tense ending."]}],"mapCaution":{"title":["閱讀提醒","Reading caution"],"body":["本書與《列王紀》有選材及神學焦點差異；比較平行段落時，避免說其中一本「沒有歷史」或強行調和。","Chronicles and Kings select and frame events differently; compare without dismissing one or forcing every detail into harmony."]},"chaptersIntro":["每章提供摘要、兩個深入觀察、詮釋提醒與教學問題；請配合完整經文閱讀。","Each chapter offers a summary, two close-reading points, a caution, and a teaching question; read alongside the full text."],"chapters":[{"n":1,"refs":"1","title":["所羅門求智慧","Solomon seeks wisdom"],"summary":["所羅門在基遍求智慧治理百姓，得應許後開始建立王權。","At Gibeon Solomon asks for wisdom to govern the people and receives a promise."],"deep":[["治理智慧的對象是「你的百姓」，不是王的自我提升。","Wisdom concerns governing “your people,” not royal self-improvement."],["第 6–7 章的悔改與祈求是理解聖殿的重要鑰匙。","Repentance and prayer in chapters 6–7 interpret the temple."]],"caution":["不可將聖殿當作保證國家不會受審判的護符。","The temple is not a charm guaranteeing immunity from judgment."],"question":["所羅門求的與一般王權欲望有何不同？","How does Solomon’s request differ from ordinary royal ambition?"]},{"n":2,"refs":"2","title":["建殿的準備","Temple preparations"],"summary":["所羅門動員工匠與勞力，與推羅王希蘭商議材料及技術。","Solomon mobilizes workers and negotiates with Hiram of Tyre for materials and expertise."],"deep":[["建殿依賴跨境合作與大量勞動。","Building depends on international cooperation and substantial labor."],["第 6–7 章的悔改與祈求是理解聖殿的重要鑰匙。","Repentance and prayer in chapters 6–7 interpret the temple."]],"caution":["不可將聖殿當作保證國家不會受審判的護符。","The temple is not a charm guaranteeing immunity from judgment."],"question":["誰為聖殿的建成付出工作？","Who labors for the temple?"]},{"n":3,"refs":"3","title":["殿址與建造","Temple site and building"],"summary":["殿建在摩利亞山、阿珥楠禾場，記下尺寸與至聖所。","The temple rises on Mount Moriah at Ornan’s threshing floor, with dimensions and inner sanctuary described."],"deep":[["殿址把大衛數點後的悔罪記憶帶入新建築。","The site carries memory of David’s census and repentance."],["第 6–7 章的悔改與祈求是理解聖殿的重要鑰匙。","Repentance and prayer in chapters 6–7 interpret the temple."]],"caution":["不可將聖殿當作保證國家不會受審判的護符。","The temple is not a charm guaranteeing immunity from judgment."],"question":["殿址的舊故事如何影響新工程？","How does the site’s past shape the project?"]},{"n":4,"refs":"4","title":["聖殿器物","Temple furnishings"],"summary":["銅壇、銅海、燈臺與其他器物被安排供祭祀和潔淨使用。","Bronze altar, sea, lampstands, and vessels are prepared for worship and cleansing."],"deep":[["器物有具體禮儀功能，不只是裝飾。","Furnishings serve ritual tasks, not mere display."],["第 6–7 章的悔改與祈求是理解聖殿的重要鑰匙。","Repentance and prayer in chapters 6–7 interpret the temple."]],"caution":["不可將聖殿當作保證國家不會受審判的護符。","The temple is not a charm guaranteeing immunity from judgment."],"question":["不同器物如何服務敬拜？","How do the vessels support worship?"]},{"n":5,"refs":"5","title":["約櫃與榮光","Ark and glory"],"summary":["祭司將約櫃抬入殿中，雲彩充滿，使祭司不能站立供職。","Priests bring in the ark; cloud fills the temple and interrupts their service."],"deep":[["神的榮光中斷人的儀式安排，顯示神不是可控制的對象。","Glory interrupts human ritual, showing God is not controllable."],["第 6–7 章的悔改與祈求是理解聖殿的重要鑰匙。","Repentance and prayer in chapters 6–7 interpret the temple."]],"caution":["不可將聖殿當作保證國家不會受審判的護符。","The temple is not a charm guaranteeing immunity from judgment."],"question":["雲彩為何使祭司停下？","Why must the priests stop?"]},{"n":6,"refs":"6","title":["所羅門的獻殿禱告","Solomon’s dedication prayer"],"summary":["所羅門記念大衛之約，承認天不能容神，求神垂聽悔改者與外邦人。","Solomon recalls David’s promise, says heaven cannot contain God, and asks God to hear penitents and foreigners."],"deep":[["禱告從聖殿伸向各種失敗與流亡情境。","The prayer reaches beyond the building into failure and exile."],["第 6–7 章的悔改與祈求是理解聖殿的重要鑰匙。","Repentance and prayer in chapters 6–7 interpret the temple."]],"caution":["不可將聖殿當作保證國家不會受審判的護符。","The temple is not a charm guaranteeing immunity from judgment."],"question":["為何獻殿時就談到被擄？","Why speak of exile at a dedication?"]},{"n":7,"refs":"7","title":["火降下與神的回應","Fire and divine response"],"summary":["火降下，百姓敬拜；神應許垂聽謙卑祈求，也警告離棄。","Fire falls and the people worship; God promises to hear humble prayer and warns against apostasy."],"deep":[["應許與警告並列，不能只取其中一面。","Promise and warning belong together."],["第 6–7 章的悔改與祈求是理解聖殿的重要鑰匙。","Repentance and prayer in chapters 6–7 interpret the temple."]],"caution":["不可將聖殿當作保證國家不會受審判的護符。","The temple is not a charm guaranteeing immunity from judgment."],"question":["第 7 章如何限制對聖殿的過度信心？","How does chapter 7 limit confidence in the temple?"]},{"n":8,"refs":"8","title":["工程、城邑與秩序","Projects, towns, and order"],"summary":["所羅門完成城邑工程，安排居民、祭司班次與航海貿易。","Solomon completes towns and projects, organizes worship duties, and trades by sea."],"deep":[["城市與敬拜制度同時被建造。","Civic projects and worship systems develop together."],["盛世結束後，後繼者仍須作新的選擇。","A prosperous reign does not settle the successor’s choices."]],"caution":["財富與名望不等同無條件的神聖認可。","Wealth and fame are not unconditional divine approval."],"question":["經濟與敬拜在本章如何並置？","How do economy and worship stand together?"]},{"n":9,"refs":"9","title":["示巴女王與所羅門之死","Queen of Sheba and Solomon’s death"],"summary":["示巴女王稱讚所羅門智慧；財富與權勢達高峰，末尾交棒羅波安。","The queen of Sheba praises Solomon’s wisdom; wealth peaks before Rehoboam succeeds him."],"deep":[["訪客的稱讚塑造國際視角，但不是後繼王的保證。","The visitor offers an international view, not a guarantee for successors."],["盛世結束後，後繼者仍須作新的選擇。","A prosperous reign does not settle the successor’s choices."]],"caution":["財富與名望不等同無條件的神聖認可。","Wealth and fame are not unconditional divine approval."],"question":["盛世結尾為何仍需要新一代作選擇？","Why must a new generation still choose?"]},{"n":10,"refs":"10","title":["羅波安的重軛","Rehoboam’s heavy yoke"],"summary":["羅波安拒絕減輕人民負擔，北方支派離開大衛家。","Rehoboam refuses to ease the people’s burden, and northern tribes break away."],"deep":[["領袖聽誰的建議，直接影響受治理者的生活。","Whose advice a ruler hears affects ordinary lives."],["亞撒的前後期須一起讀，避免英雄化。","Read Asa’s early and late years together, resisting idealization."]],"caution":["不可把戰爭勝敗簡化成每個士兵個人善惡。","Do not reduce battle outcomes to each soldier’s virtue or guilt."],"question":["羅波安忽略了誰的聲音？","Whose voices does Rehoboam ignore?"]},{"n":11,"refs":"11","title":["羅波安的防衛與祭司","Rehoboam’s defenses and priests"],"summary":["羅波安加固城邑；從北方來的祭司、利未人與尋求神者加入猶大。","Rehoboam fortifies cities; priests, Levites, and God-seekers arrive from the north."],"deep":[["分裂並不使所有人完全留在出生地。","Division does not fix every person within one kingdom."],["亞撒的前後期須一起讀，避免英雄化。","Read Asa’s early and late years together, resisting idealization."]],"caution":["不可把戰爭勝敗簡化成每個士兵個人善惡。","Do not reduce battle outcomes to each soldier’s virtue or guilt."],"question":["遷移者如何改變猶大的身分？","How do migrants change Judah’s identity?"]},{"n":12,"refs":"12","title":["埃及入侵與自卑","Egypt invades and Judah humbles itself"],"summary":["示撒侵襲，羅波安與首領自卑，耶路撒冷得免全毀但失去財寶。","Shishak invades; Rehoboam and leaders humble themselves, sparing total destruction but losing treasure."],"deep":[["減輕災難不等於沒有損失。","Mitigated disaster still entails loss."],["亞撒的前後期須一起讀，避免英雄化。","Read Asa’s early and late years together, resisting idealization."]],"caution":["不可把戰爭勝敗簡化成每個士兵個人善惡。","Do not reduce battle outcomes to each soldier’s virtue or guilt."],"question":["自卑後仍失去什麼？","What is still lost after humility?"]},{"n":13,"refs":"13","title":["亞比雅與耶羅波安","Abijah and Jeroboam"],"summary":["亞比雅向北國發言，強調大衛之約與敬拜，猶大在戰中得勝。","Abijah addresses Israel about David’s covenant and worship, and Judah prevails in battle."],"deep":[["戰前演說是王的一方陳詞，需和敘事角度分開辨識。","The prebattle speech is a king’s argument within the narrator’s frame."],["亞撒的前後期須一起讀，避免英雄化。","Read Asa’s early and late years together, resisting idealization."]],"caution":["不可把戰爭勝敗簡化成每個士兵個人善惡。","Do not reduce battle outcomes to each soldier’s virtue or guilt."],"question":["亞比雅如何建立戰爭正當性？","How does Abijah argue for legitimacy?"]},{"n":14,"refs":"14","title":["亞撒的初期改革","Asa’s early reforms"],"summary":["亞撒除去偶像，建立城邑，遇古實軍時求神幫助。","Asa removes idols, builds towns, and seeks God when a Cushite army attacks."],"deep":[["先前安息的日子被用來預備，而非保證永久安穩。","Years of rest allow preparation, not permanent security."],["亞撒的前後期須一起讀，避免英雄化。","Read Asa’s early and late years together, resisting idealization."]],"caution":["不可把戰爭勝敗簡化成每個士兵個人善惡。","Do not reduce battle outcomes to each soldier’s virtue or guilt."],"question":["亞撒如何使用平安時期？","How does Asa use peace?"]},{"n":15,"refs":"15","title":["先知勸勉與立約","Prophetic counsel and covenant"],"summary":["亞撒聽亞撒利雅勸勉，聚集百姓立約、改革敬拜。","Asa hears Azariah, gathers the people, renews covenant, and reforms worship."],"deep":[["先知呼召引出群體行動，而非王單獨完成改革。","Prophetic counsel leads to communal action, not royal action alone."],["亞撒的前後期須一起讀，避免英雄化。","Read Asa’s early and late years together, resisting idealization."]],"caution":["不可把戰爭勝敗簡化成每個士兵個人善惡。","Do not reduce battle outcomes to each soldier’s virtue or guilt."],"question":["群體如何參與改革？","How does the community take part in reform?"]},{"n":16,"refs":"16","title":["亞撒後期的失誤","Asa’s later failure"],"summary":["亞撒求助亞蘭對抗北國，拒絕先知責備；患病時仍被敘事批評。","Asa relies on Aram against Israel, rejects prophetic rebuke, and is criticized amid illness."],"deep":[["早年信靠與晚年拒聽形成強烈對照。","Early trust and later resistance create a sharp contrast."],["亞撒的前後期須一起讀，避免英雄化。","Read Asa’s early and late years together, resisting idealization."]],"caution":["不可把戰爭勝敗簡化成每個士兵個人善惡。","Do not reduce battle outcomes to each soldier’s virtue or guilt."],"question":["亞撒何時停止聽勸？","When does Asa cease to listen?"]},{"n":17,"refs":"17","title":["約沙法教導律法","Jehoshaphat teaches Torah"],"summary":["約沙法強化防務，派官員、利未人與祭司在城邑教導律法。","Jehoshaphat fortifies the land and sends officials, Levites, and priests to teach Torah."],"deep":[["教導深入城邑，並非只集中於王宮或聖殿。","Teaching moves through towns rather than remaining at court or temple."],["本書可正面評價王，也指出他在結盟上的過失。","The book can commend a king and criticize his alliances."]],"caution":["勿將集體禱告當作保證所有戰爭都不會造成傷亡。","Do not promise that communal prayer prevents all wartime casualties."],"question":["教導為何被放在治理敘事中？","Why is teaching part of governance?"]},{"n":18,"refs":"18","title":["與亞哈結盟","Alliance with Ahab"],"summary":["約沙法與亞哈同赴戰場；米該雅反對多數先知，亞哈陣亡。","Jehoshaphat joins Ahab in battle; Micaiah dissents from most prophets, and Ahab dies."],"deep":[["好王也可能作錯誤結盟，先知的少數聲音值得檢驗。","A commended king can make a poor alliance; test the prophetic minority."],["本書可正面評價王，也指出他在結盟上的過失。","The book can commend a king and criticize his alliances."]],"caution":["勿將集體禱告當作保證所有戰爭都不會造成傷亡。","Do not promise that communal prayer prevents all wartime casualties."],"question":["約沙法為何沒有更早退出？","Why does Jehoshaphat not withdraw earlier?"]},{"n":19,"refs":"19","title":["責備與審判改革","Rebuke and judicial reform"],"summary":["先知責備約沙法結盟，他隨後安排審判官，提醒他們不徇私。","A prophet rebukes Jehoshaphat’s alliance; he appoints judges and charges impartiality."],"deep":[["接受責備後的制度安排顯示悔改涉及公共正義。","Institutional justice follows prophetic rebuke."],["本書可正面評價王，也指出他在結盟上的過失。","The book can commend a king and criticize his alliances."]],"caution":["勿將集體禱告當作保證所有戰爭都不會造成傷亡。","Do not promise that communal prayer prevents all wartime casualties."],"question":["敬拜與公正審判有何關係？","How are worship and fair judgment related?"]},{"n":20,"refs":"20","title":["聯軍威脅與禱告","Coalition threat and prayer"],"summary":["敵軍迫近，約沙法召聚百姓禁食禱告；歌者領頭，敵軍自亂。","Threatened by a coalition, Jehoshaphat gathers people to fast and pray; singers lead as enemies collapse."],"deep":[["婦女與孩童也站在會中，危機不是只有軍人的事。","Women and children stand with the assembly; the crisis is communal."],["本書可正面評價王，也指出他在結盟上的過失。","The book can commend a king and criticize his alliances."]],"caution":["勿將集體禱告當作保證所有戰爭都不會造成傷亡。","Do not promise that communal prayer prevents all wartime casualties."],"question":["集體禱告如何承認人的無力？","How does communal prayer acknowledge helplessness?"]},{"n":21,"refs":"21","title":["耶蘭的暴政","Jehoram’s violence"],"summary":["耶蘭殺兄弟、引導猶大背離，遭先知警告，王國受攻。","Jehoram kills his brothers, leads Judah astray, and faces warning and invasion."],"deep":[["保存大衛家應許不等於認可耶蘭的行為。","Preserving David’s line does not endorse Jehoram."],["約阿施初期修殿，後期卻殺責備他的撒迦利亞。","Joash repairs the temple yet later kills the prophet Zechariah."]],"caution":["不可把長期忠誠只憑早期事蹟判定。","Do not judge lifelong faithfulness by early achievements alone."],"question":["應許如何與王的惡行並存？","How can promise coexist with royal wrongdoing?"]},{"n":22,"refs":"22","title":["亞哈謝與亞他利雅","Ahaziah and Athaliah"],"summary":["亞哈謝受亞哈家影響而死；亞他利雅奪權，約阿施被藏起。","Ahaziah follows Ahab’s house and dies; Athaliah seizes power while Joash is hidden."],"deep":[["一名兒童的存活維繫王朝，也凸顯王宮危險。","A child’s survival preserves a line amid palace danger."],["約阿施初期修殿，後期卻殺責備他的撒迦利亞。","Joash repairs the temple yet later kills the prophet Zechariah."]],"caution":["不可把長期忠誠只憑早期事蹟判定。","Do not judge lifelong faithfulness by early achievements alone."],"question":["誰保護了約阿施？","Who protects Joash?"]},{"n":23,"refs":"23","title":["耶何耶大與約阿施","Jehoiada and Joash"],"summary":["耶何耶大召聚人立約，護送約阿施即位，亞他利雅被處死。","Jehoiada gathers a covenant assembly and enthrones Joash; Athaliah is executed."],"deep":[["改革結合聖殿、軍事與群體，應問權力如何被約束。","Reform joins temple, guards, and assembly; ask how power is checked."],["約阿施初期修殿，後期卻殺責備他的撒迦利亞。","Joash repairs the temple yet later kills the prophet Zechariah."]],"caution":["不可把長期忠誠只憑早期事蹟判定。","Do not judge lifelong faithfulness by early achievements alone."],"question":["新王權如何取得支持？","How does the new reign gain support?"]},{"n":24,"refs":"24","title":["約阿施修殿與背離","Joash repairs then turns"],"summary":["約阿施修殿；耶何耶大死後聽從首領，命人殺責備他的撒迦利亞。","Joash repairs the temple but after Jehoiada dies follows leaders and orders Zechariah killed."],"deep":[["早期美好的工程未能保證後期願意聽真話。","An early good project does not guarantee later openness to truth."],["約阿施初期修殿，後期卻殺責備他的撒迦利亞。","Joash repairs the temple yet later kills the prophet Zechariah."]],"caution":["不可把長期忠誠只憑早期事蹟判定。","Do not judge lifelong faithfulness by early achievements alone."],"question":["約阿施為何拒絕撒迦利亞？","Why does Joash reject Zechariah?"]},{"n":25,"refs":"25","title":["亞瑪謝的半心","Amaziah’s divided heart"],"summary":["亞瑪謝初有秩序，後敬拜以東神，挑戰北國而遭大敗。","Amaziah begins with restraint, then worships Edomite gods and loses to Israel."],"deep":[["「行正」與「不專心」並置，要求全程觀察。","“Did right” and “not wholeheartedly” must be read together."],["烏西雅成功後越界進殿，提供權力膨脹的案例。","Uzziah crosses a boundary after success, showing power’s temptation."]],"caution":["疾病與災難不可直接套用為現代病人的道德判決。","Do not apply ancient illness narratives as moral verdicts on modern patients."],"question":["勝利後亞瑪謝的判斷如何改變？","How does Amaziah change after victory?"]},{"n":26,"refs":"26","title":["烏西雅成功與越界","Uzziah’s success and trespass"],"summary":["烏西雅擴建與強軍，後進殿燒香越界，患痲瘋而與殿隔離。","Uzziah builds and arms well, then unlawfully burns incense and is isolated with a skin disease."],"deep":[["權力擴張容易使王不接受角色界線。","Expanding power tempts a ruler to ignore limits."],["烏西雅成功後越界進殿，提供權力膨脹的案例。","Uzziah crosses a boundary after success, showing power’s temptation."]],"caution":["疾病與災難不可直接套用為現代病人的道德判決。","Do not apply ancient illness narratives as moral verdicts on modern patients."],"question":["何時成功變成越界的誘因？","When does success tempt boundary crossing?"]},{"n":27,"refs":"27","title":["約坦的道路","Jotham’s reign"],"summary":["約坦修建城邑並擊敗亞捫；敘事說他在神面前預備道路。","Jotham builds towns and defeats Ammon; the narrator says he orders his ways before God."],"deep":[["王的評價與百姓仍有敗壞並列。","Royal commendation stands beside continuing public corruption."],["烏西雅成功後越界進殿，提供權力膨脹的案例。","Uzziah crosses a boundary after success, showing power’s temptation."]],"caution":["疾病與災難不可直接套用為現代病人的道德判決。","Do not apply ancient illness narratives as moral verdicts on modern patients."],"question":["好領袖能否獨自改變整個群體？","Can a good ruler transform a whole society alone?"]},{"n":28,"refs":"28","title":["亞哈斯與災禍","Ahaz and disaster"],"summary":["亞哈斯推行偶像敬拜，猶大受多方攻擊，向亞述求助反而更困苦。","Ahaz promotes idolatry; Judah suffers attacks, and Assyria’s help deepens trouble."],"deep":[["援助選擇可能製造更深依附。","A chosen ally can create deeper dependency."],["烏西雅成功後越界進殿，提供權力膨脹的案例。","Uzziah crosses a boundary after success, showing power’s temptation."]],"caution":["疾病與災難不可直接套用為現代病人的道德判決。","Do not apply ancient illness narratives as moral verdicts on modern patients."],"question":["亞哈斯的求援為何失敗？","Why does Ahaz’s appeal fail?"]},{"n":29,"refs":"29","title":["希西家潔淨聖殿","Hezekiah cleanses temple"],"summary":["希西家召聚利未人潔淨殿宇，恢復獻祭與讚美。","Hezekiah gathers Levites to cleanse the temple and restore sacrifice and song."],"deep":[["改革先承認殿被忽略與失序。","Reform begins by naming neglect and disorder."],["邀請北方餘民同守節期，使分裂後的群體重新相遇。","Inviting northern survivors to Passover reopens communal connection."]],"caution":["不要把希西家的國家經驗當作每個人的醫治保證。","Do not make Hezekiah’s national story a guarantee of individual healing."],"question":["哪些人實際執行潔淨？","Who does the work of cleansing?"]},{"n":30,"refs":"30","title":["全以色列的逾越節","Passover for all Israel"],"summary":["希西家邀北方支派同守逾越節；有人嘲笑，有人回應，王為未潔淨者代求。","Hezekiah invites northern tribes to Passover; some mock, some come, and he prays for the unclean."],"deep":[["邀請跨越王國分裂，也暴露回應並不一致。","The invitation crosses division yet receives mixed responses."],["邀請北方餘民同守節期，使分裂後的群體重新相遇。","Inviting northern survivors to Passover reopens communal connection."]],"caution":["不要把希西家的國家經驗當作每個人的醫治保證。","Do not make Hezekiah’s national story a guarantee of individual healing."],"question":["誰被邀請，誰選擇回應？","Who is invited, and who responds?"]},{"n":31,"refs":"31","title":["奉獻與祭司供應","Giving and priestly provision"],"summary":["百姓除去偶像，供應祭司與利未人；分配與保管被安排。","The people remove idols and provide for priests and Levites through organized distribution."],"deep":[["敬拜更新需要透明而持續的物資管理。","Renewed worship needs sustained, accountable distribution."],["邀請北方餘民同守節期，使分裂後的群體重新相遇。","Inviting northern survivors to Passover reopens communal connection."]],"caution":["不要把希西家的國家經驗當作每個人的醫治保證。","Do not make Hezekiah’s national story a guarantee of individual healing."],"question":["如何避免奉獻管理失序？","How can contributions be managed well?"]},{"n":32,"refs":"32","title":["亞述威脅與希西家驕傲","Assyria and Hezekiah’s pride"],"summary":["西拿基立威脅耶路撒冷，希西家與以賽亞禱告；王後來因驕傲而自卑。","Sennacherib threatens Jerusalem; Hezekiah and Isaiah pray, and the king later humbles himself for pride."],"deep":[["外敵退去後仍有內在權力試探。","An external threat ends, but inward pride remains."],["邀請北方餘民同守節期，使分裂後的群體重新相遇。","Inviting northern survivors to Passover reopens communal connection."]],"caution":["不要把希西家的國家經驗當作每個人的醫治保證。","Do not make Hezekiah’s national story a guarantee of individual healing."],"question":["得救後為何仍需自省？","Why is self-examination needed after deliverance?"]},{"n":33,"refs":"33","title":["瑪拿西悔改與亞們","Manasseh’s repentance and Amon"],"summary":["瑪拿西先行大惡，受擄後自卑歸回並修殿；亞們拒絕自卑。","Manasseh does grave evil, is captured, humbles himself, and restores worship; Amon refuses humility."],"deep":[["悔改可能真實，卻不會使早先受害者不存在。","Repentance can be real without erasing earlier victims."],["瑪拿西的悔改與約西亞的改革都不能抹去先前傷害。","Manasseh’s repentance and Josiah’s reform do not erase earlier harm."]],"caution":["希望不能成為跳過哀悼和責任的捷徑。","Hope must not bypass grief and accountability."],"question":["如何同時談悔改與責任？","How can repentance and accountability both be taught?"]},{"n":34,"refs":"34","title":["約西亞與律法書","Josiah and the law book"],"summary":["約西亞除偶像，修殿時發現律法書，求問戶勒大並與民立約。","Josiah removes idols; the law book is found during repairs, Huldah interprets it, and covenant is renewed."],"deep":[["女先知的話引導王公開讀經與回應。","A woman prophet guides the king toward public reading and response."],["瑪拿西的悔改與約西亞的改革都不能抹去先前傷害。","Manasseh’s repentance and Josiah’s reform do not erase earlier harm."]],"caution":["希望不能成為跳過哀悼和責任的捷徑。","Hope must not bypass grief and accountability."],"question":["讀到律法後群體如何行動？","What does the community do after hearing Torah?"]},{"n":35,"refs":"35","title":["逾越節與約西亞之死","Passover and Josiah’s death"],"summary":["約西亞守盛大逾越節，後不聽埃及王的話，在米吉多戰死。","Josiah celebrates Passover, then disregards the Egyptian king’s words and dies at Megiddo."],"deep":[["敬虔改革者也可能在單一決策上失誤。","A pious reformer may still err in a particular decision."],["瑪拿西的悔改與約西亞的改革都不能抹去先前傷害。","Manasseh’s repentance and Josiah’s reform do not erase earlier harm."]],"caution":["希望不能成為跳過哀悼和責任的捷徑。","Hope must not bypass grief and accountability."],"question":["約西亞之死如何抵抗簡單報償公式？","How does Josiah’s death resist a simple reward formula?"]},{"n":36,"refs":"36","title":["末代諸王與古列詔書","Last kings and Cyrus’s decree"],"summary":["猶大末代諸王背離，耶路撒冷被毀、百姓被擄；古列允許返回建殿。","Judah’s last kings fail, Jerusalem is destroyed, and people are exiled; Cyrus permits return and rebuilding."],"deep":[["結尾以邀請而非完成式復興收束。","The book ends with invitation rather than completed restoration."],["瑪拿西的悔改與約西亞的改革都不能抹去先前傷害。","Manasseh’s repentance and Josiah’s reform do not erase earlier harm."]],"caution":["希望不能成為跳過哀悼和責任的捷徑。","Hope must not bypass grief and accountability."],"question":["「誰願上去」使讀者面對什麼選擇？","What choice does “whoever will go up” pose?"]}],"themesIntro":["以下主題由歷代志下的主要段落引出，可與逐章研讀互相對照。","These themes arise from major sections of 2 Chronicles and complement the chapter studies."],"themes":[{"refs":"1–7","title":["所羅門與聖殿","Solomon and temple"],"body":["智慧、建築、約櫃、獻殿禱告及神的回應形成開篇。","Wisdom, building, ark, dedication prayer, and divine response form the opening."],"caution":["不可將聖殿當作保證國家不會受審判的護符。","The temple is not a charm guaranteeing immunity from judgment."]},{"refs":"10–16","title":["分裂、改革與反覆","Division, reform, and reversal"],"body":["羅波安、亞比雅與亞撒在分裂後各有不同的求問與失誤。","Rehoboam, Abijah, and Asa respond differently after division."],"caution":["不可把戰爭勝敗簡化成每個士兵個人善惡。","Do not reduce battle outcomes to each soldier’s virtue or guilt."]},{"refs":"21–24","title":["王朝危機與約阿施","Dynastic crisis and Joash"],"body":["耶蘭、亞哈謝、亞他利雅與約阿施帶來王權、聖殿與先知衝突。","Jehoram, Ahaziah, Athaliah, and Joash expose conflict among throne, temple, and prophecy."],"caution":["不可把長期忠誠只憑早期事蹟判定。","Do not judge lifelong faithfulness by early achievements alone."]},{"refs":"29–32","title":["希西家與集體回轉","Hezekiah and communal renewal"],"body":["潔淨殿宇、守逾越節、恢復供應，也面對亞述威脅。","Temple cleansing, Passover, support for worship, and Assyrian threat converge."],"caution":["不要把希西家的國家經驗當作每個人的醫治保證。","Do not make Hezekiah’s national story a guarantee of individual healing."]},{"refs":"33–36","title":["悔改、改革與被擄","Repentance, reform, and exile"],"body":["瑪拿西、約西亞、亡國與古列詔書使結尾保留張力。","Manasseh, Josiah, exile, and Cyrus’s decree leave a tense ending."],"caution":["希望不能成為跳過哀悼和責任的捷徑。","Hope must not bypass grief and accountability."]}],"pastoral":{"title":["教學與牧養提醒","Teaching and pastoral care"],"body":["讀改革與審判時，也要注意普通百姓的代價，避免用「悔改就必立刻興旺」解釋個人遭遇。","When teaching reform and judgment, attend to ordinary people and avoid promising instant prosperity after repentance."]},"lessonsIntro":["八堂課依經文次序編排；每堂含目標、流程、提問與帶領提醒。","Eight sequential lessons include aims, teaching flow, questions, and facilitation cautions."],"lessons":[{"refs":"1–7","title":["第 1 課｜所羅門與聖殿","Lesson 1 | Solomon and temple"],"aim":["智慧、建築、約櫃、獻殿禱告及神的回應形成開篇。","Wisdom, building, ark, dedication prayer, and divine response form the opening."],"flow":[["讀 1 章：治理智慧的對象是「你的百姓」，不是王的自我提升。","Read chapter 1: Wisdom concerns governing “your people,” not royal self-improvement."],["對照 1–7 章：第 6–7 章的悔改與祈求是理解聖殿的重要鑰匙。","Compare chapters 1–7: Repentance and prayer in chapters 6–7 interpret the temple."],["討論：第 7 章如何限制對聖殿的過度信心？","Discuss: How does chapter 7 limit confidence in the temple?"]],"question":["所羅門求的與一般王權欲望有何不同？","How does Solomon’s request differ from ordinary royal ambition?"],"practice":["不可將聖殿當作保證國家不會受審判的護符。","The temple is not a charm guaranteeing immunity from judgment."]},{"refs":"8–9","title":["第 2 課｜王國榮景與交接","Lesson 2 | Royal splendor and succession"],"aim":["所羅門的工程、國際聲望與死亡，引向羅波安。","Solomon’s projects, international fame, and death lead to Rehoboam."],"flow":[["讀 8 章：城市與敬拜制度同時被建造。","Read chapter 8: Civic projects and worship systems develop together."],["對照 8–9 章：盛世結束後，後繼者仍須作新的選擇。","Compare chapters 8–9: A prosperous reign does not settle the successor’s choices."],["討論：盛世結尾為何仍需要新一代作選擇？","Discuss: Why must a new generation still choose?"]],"question":["經濟與敬拜在本章如何並置？","How do economy and worship stand together?"],"practice":["財富與名望不等同無條件的神聖認可。","Wealth and fame are not unconditional divine approval."]},{"refs":"10–16","title":["第 3 課｜分裂、改革與反覆","Lesson 3 | Division, reform, and reversal"],"aim":["羅波安、亞比雅與亞撒在分裂後各有不同的求問與失誤。","Rehoboam, Abijah, and Asa respond differently after division."],"flow":[["讀 10 章：領袖聽誰的建議，直接影響受治理者的生活。","Read chapter 10: Whose advice a ruler hears affects ordinary lives."],["對照 10–16 章：亞撒的前後期須一起讀，避免英雄化。","Compare chapters 10–16: Read Asa’s early and late years together, resisting idealization."],["討論：亞撒何時停止聽勸？","Discuss: When does Asa cease to listen?"]],"question":["羅波安忽略了誰的聲音？","Whose voices does Rehoboam ignore?"],"practice":["不可把戰爭勝敗簡化成每個士兵個人善惡。","Do not reduce battle outcomes to each soldier’s virtue or guilt."]},{"refs":"17–20","title":["第 4 課｜約沙法的信心與結盟","Lesson 4 | Jehoshaphat’s faith and alliances"],"aim":["教導律法、審判改革、錯誤結盟與共同禱告並存。","Torah teaching, judicial reform, flawed alliances, and communal prayer coexist."],"flow":[["讀 17 章：教導深入城邑，並非只集中於王宮或聖殿。","Read chapter 17: Teaching moves through towns rather than remaining at court or temple."],["對照 17–20 章：本書可正面評價王，也指出他在結盟上的過失。","Compare chapters 17–20: The book can commend a king and criticize his alliances."],["討論：集體禱告如何承認人的無力？","Discuss: How does communal prayer acknowledge helplessness?"]],"question":["教導為何被放在治理敘事中？","Why is teaching part of governance?"],"practice":["勿將集體禱告當作保證所有戰爭都不會造成傷亡。","Do not promise that communal prayer prevents all wartime casualties."]},{"refs":"21–24","title":["第 5 課｜王朝危機與約阿施","Lesson 5 | Dynastic crisis and Joash"],"aim":["耶蘭、亞哈謝、亞他利雅與約阿施帶來王權、聖殿與先知衝突。","Jehoram, Ahaziah, Athaliah, and Joash expose conflict among throne, temple, and prophecy."],"flow":[["讀 21 章：保存大衛家應許不等於認可耶蘭的行為。","Read chapter 21: Preserving David’s line does not endorse Jehoram."],["對照 21–24 章：約阿施初期修殿，後期卻殺責備他的撒迦利亞。","Compare chapters 21–24: Joash repairs the temple yet later kills the prophet Zechariah."],["討論：約阿施為何拒絕撒迦利亞？","Discuss: Why does Joash reject Zechariah?"]],"question":["應許如何與王的惡行並存？","How can promise coexist with royal wrongdoing?"],"practice":["不可把長期忠誠只憑早期事蹟判定。","Do not judge lifelong faithfulness by early achievements alone."]},{"refs":"25–28","title":["第 6 課｜亞瑪謝至亞哈斯","Lesson 6 | Amaziah to Ahaz"],"aim":["亞瑪謝、烏西雅、約坦與亞哈斯呈現成敗與敬拜選擇。","Amaziah, Uzziah, Jotham, and Ahaz show mixed outcomes and worship decisions."],"flow":[["讀 25 章：「行正」與「不專心」並置，要求全程觀察。","Read chapter 25: “Did right” and “not wholeheartedly” must be read together."],["對照 25–28 章：烏西雅成功後越界進殿，提供權力膨脹的案例。","Compare chapters 25–28: Uzziah crosses a boundary after success, showing power’s temptation."],["討論：亞哈斯的求援為何失敗？","Discuss: Why does Ahaz’s appeal fail?"]],"question":["勝利後亞瑪謝的判斷如何改變？","How does Amaziah change after victory?"],"practice":["疾病與災難不可直接套用為現代病人的道德判決。","Do not apply ancient illness narratives as moral verdicts on modern patients."]},{"refs":"29–32","title":["第 7 課｜希西家與集體回轉","Lesson 7 | Hezekiah and communal renewal"],"aim":["潔淨殿宇、守逾越節、恢復供應，也面對亞述威脅。","Temple cleansing, Passover, support for worship, and Assyrian threat converge."],"flow":[["讀 29 章：改革先承認殿被忽略與失序。","Read chapter 29: Reform begins by naming neglect and disorder."],["對照 29–32 章：邀請北方餘民同守節期，使分裂後的群體重新相遇。","Compare chapters 29–32: Inviting northern survivors to Passover reopens communal connection."],["討論：得救後為何仍需自省？","Discuss: Why is self-examination needed after deliverance?"]],"question":["哪些人實際執行潔淨？","Who does the work of cleansing?"],"practice":["不要把希西家的國家經驗當作每個人的醫治保證。","Do not make Hezekiah’s national story a guarantee of individual healing."]},{"refs":"33–36","title":["第 8 課｜悔改、改革與被擄","Lesson 8 | Repentance, reform, and exile"],"aim":["瑪拿西、約西亞、亡國與古列詔書使結尾保留張力。","Manasseh, Josiah, exile, and Cyrus’s decree leave a tense ending."],"flow":[["讀 33 章：悔改可能真實，卻不會使早先受害者不存在。","Read chapter 33: Repentance can be real without erasing earlier victims."],["對照 33–36 章：瑪拿西的悔改與約西亞的改革都不能抹去先前傷害。","Compare chapters 33–36: Manasseh’s repentance and Josiah’s reform do not erase earlier harm."],["討論：「誰願上去」使讀者面對什麼選擇？","Discuss: What choice does “whoever will go up” pose?"]],"question":["如何同時談悔改與責任？","How can repentance and accountability both be taught?"],"practice":["希望不能成為跳過哀悼和責任的捷徑。","Hope must not bypass grief and accountability."]}],"questionsIntro":["先請學員引用經文，再討論不同讀法的理由。","Ask learners to cite the text before weighing interpretations."],"extraQuestions":[["歷代志下最常被忽略的人物是誰？為何？","Which character in 2 Chronicles is most easily overlooked, and why?"],["本書哪些段落挑戰「成功必然代表神認可」的想法？","Which passages challenge the claim that success always signals divine approval?"],["今日教學如何避免把古代事件直接變成現代命令？","How can teaching avoid turning ancient events directly into modern commands?"]],"sourceNote":["本頁為依完整經文編寫的原創研讀摘要；延伸資源供比較詮釋與文學結構。","Original study summaries based on the full text; use further resources to compare interpretation and literary design."],"sources":[{"title":["BibleProject｜歷代志上、下導讀","BibleProject | Books of Chronicles guide"],"url":"https://bibleproject.com/guides/books-of-chronicles/"}],"footer":["歷代志下 · 成人主日學教師版 · 請配合完整經文閱讀。","2 Chronicles · Adult Sunday school teacher edition · Read alongside the full biblical text."],"pdfFiles":[]};</script><script src="../assets/book-study.js?v=20261103-language2" defer></script><script src="/assets/site-freshness.js" defer></script></body></html>
